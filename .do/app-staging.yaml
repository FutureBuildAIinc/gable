# Digital Ocean App Platform spec — EXAMPLE "staging" environment.
#
# This is a self-host reference, not a live environment. It tracks the `staging`
# branch and can share one DO Managed Postgres cluster with other environments
# while using a separate logical database, so a botched seed in one environment
# cannot poison another. Replace every placeholder before applying.
#
# Apply with: doctl apps create --spec .do/app-staging.yaml   (first time)
#             doctl apps update <app-id> --spec .do/app-staging.yaml
#
# SECURITY: never deploy a reachable environment with AUTH_MODE=dev. The
# backend is fail-closed — with AUTH_MODE unset (or != dev) it REQUIRES a valid
# JWKS_URL and CORS_ORIGINS and refuses to start otherwise. AUTH_MODE=dev is for
# a developer's local machine ONLY; it disables authentication entirely.
name: gable-staging
# Choose a region where DO Managed Postgres is available, and co-locate the app
# and database cluster for low-latency cross-talk.
region: nyc
alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED

domains:
  - domain: staging.example.com
    type: PRIMARY

services:
  - name: backend
    dockerfile_path: backend/Dockerfile
    source_dir: /
    github:
      repo: your-org/gable
      branch: staging
      deploy_on_push: true
    instance_count: 1
    instance_size_slug: basic-xxs
    http_port: 8080
    health_check:
      http_path: /healthz/live
      initial_delay_seconds: 15
      period_seconds: 30
      failure_threshold: 3
    routes:
      # preserve_path_prefix keeps the original path when proxying to the
      # container; without it App Platform strips the matched prefix and the Go
      # router 404s (e.g. /healthz/live -> /live).
      - path: /api
        preserve_path_prefix: true
      - path: /health
        preserve_path_prefix: true
      - path: /healthz
        preserve_path_prefix: true
      - path: /metrics
        preserve_path_prefix: true
    envs:
      - key: PORT
        value: "8080"
      # Reachable/production auth. Point JWKS_URL at your identity provider's
      # JWKS endpoint. Do NOT set AUTH_MODE=dev on a reachable host.
      - key: AUTH_MODE
        value: production
      - key: EDI_OUTPUT_DIR
        value: /app/edi_out
        scope: RUN_TIME
      - key: JWKS_URL
        value: https://auth.example.com/.well-known/jwks.json
      - key: CORS_ORIGINS
        value: https://staging.example.com
      # PORTAL_JWT_SECRET is required in production. Set it as an encrypted
      # secret out-of-band (doctl apps update / dashboard), never inline here:
      #   - key: PORTAL_JWT_SECRET
      #     scope: RUN_TIME
      #     type: SECRET
      - key: DATABASE_URL
        value: ${gable-db.DATABASE_URL}
        scope: RUN_AND_BUILD_TIME
        type: SECRET

  - name: frontend
    dockerfile_path: app/Dockerfile
    source_dir: /
    github:
      repo: your-org/gable
      branch: staging
      deploy_on_push: true
    instance_count: 1
    instance_size_slug: basic-xxs
    http_port: 8080
    build_command: ""
    envs:
      # Empty on purpose: the SPA issues relative /api/* requests, which App
      # Platform's path routing sends to the backend on the same hostname —
      # works identically on the default *.ondigitalocean.app hostname and on
      # your custom domain once DNS attaches, with no rebuild in between.
      - key: VITE_API_URL
        value: ""
        scope: BUILD_TIME
      - key: BACKEND_URL
        value: ${backend.PRIVATE_URL}
        scope: RUN_TIME
    routes:
      - path: /

jobs:
  # The seed TRUNCATEs the transactional tables (orders, deliveries, routes,
  # quotes, the general ledger) with RESTART IDENTITY CASCADE before writing
  # demo data. It is therefore gated on DEMO_SEED and skipped by default:
  # without the gate, every deploy of this spec would silently destroy the
  # target database's operational data. Set DEMO_SEED=true ONLY on a
  # throwaway demo environment. The binary enforces the same gate itself.
  #
  # DEMO_SEED is deliberately ABSENT from this spec. Staging keeps whatever is
  # in it across deploys; only .do/app-demo.yaml opts in to the reset. If you
  # ever need to reseed staging, set the variable for one deploy and remove it
  # again — do not add it here.
  - name: migrate-and-seed
    kind: POST_DEPLOY
    dockerfile_path: backend/Dockerfile
    source_dir: /
    github:
      repo: your-org/gable
      branch: staging
    instance_count: 1
    instance_size_slug: basic-xxs
    # App Platform exec-splits run_command on whitespace and passes the tokens
    # as argv to the first binary (no implicit /bin/sh). Wrapping with `sh -c`
    # is required so the `&&` chain runs ./seed after ./migrate. Without it,
    # only ./migrate executes and the seed binary is silently skipped.
    run_command: sh -c 'set -e; ./migrate; if [ "$DEMO_SEED" = true ]; then echo seeding demo data; ./seed; else echo skipping demo seed, DEMO_SEED is not true; fi'
    envs:
      - key: DATABASE_URL
        value: ${gable-db.DATABASE_URL}
        scope: RUN_TIME
        type: SECRET

databases:
  - name: gable-db
    engine: PG
    version: "16"
    # production: true references an externally-managed cluster you create ahead
    # of `doctl apps create` (see .do/README.md). Multiple environments can
    # share one cluster using distinct logical databases.
    production: true
    cluster_name: your-db-cluster
    db_name: gable_staging_db
    db_user: gable_user
