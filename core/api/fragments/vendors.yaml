#
# The vendors module, transcribed from internal/vendor/handler.go and model.go
# as they behave today: float performance metrics, the contact and address fields
# are nullable on every response, and list is not paginated.
paths:
  /api/v1/vendors:
    get:
      operationId: vendorList
      tags:
      - vendors
      summary: List vendors
      description: 'The list is not paginated: limit and offset are not read.'
      parameters:
      - $ref: '#/components/parameters/XBranchId'
      responses:
        '200':
          description: Every vendor; an empty array when none.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Vendor'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: vendorCreate
      tags:
      - vendors
      summary: Create a vendor
      parameters:
      - $ref: '#/components/parameters/XBranchId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VendorCreate'
      responses:
        '201':
          description: The created vendor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vendor'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/vendors/{id}:
    get:
      operationId: vendorGet
      tags:
      - vendors
      summary: Get one vendor
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/XBranchId'
      responses:
        '200':
          description: The vendor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vendor'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  schemas:
    Vendor:
      type: object
      description: vendor.Vendor.
      required:
      - id
      - name
      - contact_email
      - phone
      - address_line1
      - city
      - state
      - zip
      - payment_terms
      - average_lead_time_days
      - fill_rate
      - total_spend_ytd
      - created_at
      - updated_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        contact_email:
          type:
          - string
          - 'null'
        phone:
          type:
          - string
          - 'null'
        address_line1:
          type:
          - string
          - 'null'
        city:
          type:
          - string
          - 'null'
        state:
          type:
          - string
          - 'null'
        zip:
          type:
          - string
          - 'null'
        payment_terms:
          type: string
        average_lead_time_days:
          type: number
        fill_rate:
          type: number
        total_spend_ytd:
          type: number
          description: Float dollars today.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    VendorCreate:
      type: object
      description: CreateVendorRequest. The address fields are not accepted.
      required:
      - name
      properties:
        name:
          type: string
        contact_email:
          type:
          - string
          - 'null'
        phone:
          type:
          - string
          - 'null'
        payment_terms:
          type:
          - string
          - 'null'
