#
# The pricing and market index routes. The price read, the rules, the category
# tree, the category rules (with bulk, audit, matrix and resolve) are on the
# wire contract (item C3-1, ADR 0001 and ADR 0006 section 7.3): scaled
# prices (_ten_thousandths), percentages and quantities as decimal strings,
# lowercase vocabularies, the list envelope and a revision on the rules. The
# category routes register only when CATEGORY_PRICING_ENABLED=true. The
# escalation, rebate and market index routes below keep the shapes they had.
# Component schemas are prefixed Pricing or MarketIndex.
paths:
  /api/v1/pricing/calculate:
    get:
      operationId: pricingCalculate
      tags: [pricing]
      summary: Calculate a customer price for a product
      description: >-
        Guarded admin or owner. The price one line would carry (ADR 0006 section 7.3):
        the exact scale 4 unit price in the product's stocking unit, the conversion pair
        (1 and 1 until the unit sets of C3-2A), the extension rounded once to cents by
        the line extension rule, and the price basis in lowercase. customer_id and
        product_id are required UUIDs; a quantity that is not a positive decimal string
        at scale 4 or a job_id that is not a UUID is a 400 naming it. A missing customer
        or product is 404.
      parameters:
        - name: customer_id
          in: query
          required: true
          schema: {type: string, format: uuid}
        - name: product_id
          in: query
          required: true
          schema: {type: string, format: uuid}
        - name: quantity
          in: query
          required: false
          description: A positive decimal string at scale 4; default "1".
          schema: {type: string}
        - name: job_id
          in: query
          required: false
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: The calculated price.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PricingCalculatedPrice"
        "400":
          $ref: "#/components/responses/WireBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/WireNotFound"
        "500":
          $ref: "#/components/responses/InternalErrorEither"
  /api/v1/pricing/rules:
    get:
      operationId: pricingRuleList
      tags: [pricing]
      summary: List pricing rules
      description: >-
        Guarded admin or owner. The list envelope of ADR 0001 section 1, newest first
        (created_at DESC, id DESC); items is never null.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/Include"
      responses:
        "200":
          description: The page of rules.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PricingRulePage"
        "400":
          $ref: "#/components/responses/WireBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalErrorEither"
    post:
      operationId: pricingRuleCreate
      tags: [pricing]
      summary: Create a pricing rule
      description: >-
        Guarded admin or owner. Every field problem is collected into one 400 naming
        each field. A rule carries a fixed price, a discount or a markup. Prices are
        integers at scale 4 (fixed_price_ten_thousandths); percentages and quantities
        are decimal strings. The response is 201 with Location and the revision ETag.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PricingRuleCreateRequest"
      responses:
        "201":
          description: The created rule at revision 1.
          headers:
            Location:
              description: The rule's URL.
              schema:
                type: string
            ETag:
              description: The rule revision in quotes, for example "3". Send it back as If-Match.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PricingRule"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/WireConflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalErrorEither"
  /api/v1/pricing/calculate-escalation:
    post:
      operationId: pricingCalculateEscalation
      tags: [pricing]
      summary: Calculate an escalated future price
      description: >-
        Guarded admin or owner. The body is capped at 1 MiB. base_price must be
        positive; escalation_type must be PERCENTAGE or INDEX_DELTA; both dates
        are required. A date that is not YYYY-MM-DD, or an index lookup
        failure, answers 500. A target on or before the effective date returns
        the base price with months_out 0. For INDEX_DELTA the
        escalation_rate field carries the base index value.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PricingEscalationRequest"
      responses:
        "200":
          description: The escalation result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PricingEscalationResult"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
        "409":
          $ref: "#/components/responses/ConflictEither"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /api/v1/pricing/categories:
    get:
      operationId: pricingCategoryList
      tags: [pricing]
      summary: List product categories
      description: >-
        Registered only when CATEGORY_PRICING_ENABLED=true. The only pricing route with
        no role guard beyond authentication. view=tree (default) returns the nested
        tree, view=flat the flat list; any other value is a 400. The list envelope with
        every category on one page.
      parameters:
        - name: view
          in: query
          required: false
          schema: {type: string, enum: [tree, flat]}
      responses:
        "200":
          description: The categories.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PricingProductCategoryList"
        "400":
          $ref: "#/components/responses/WireBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalErrorEither"
    post:
      operationId: pricingCategoryCreate
      tags: [pricing]
      summary: Create a product category
      description: >-
        Registered only when CATEGORY_PRICING_ENABLED=true. Guarded admin or owner.
        name, slug and path are required.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PricingProductCategoryWrite"
      responses:
        "201":
          description: The created category.
          headers:
            Location:
              description: The category's URL.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PricingProductCategory"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/WireConflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalErrorEither"
  /api/v1/pricing/categories/{id}:
    put:
      operationId: pricingCategoryUpdate
      tags: [pricing]
      summary: Update a product category
      description: >-
        Registered only when CATEGORY_PRICING_ENABLED=true. Guarded admin or owner.
        Updates name, slug, sort_order and is_active; the path and parent are fixed.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PricingProductCategoryWrite"
      responses:
        "200":
          description: The category as written.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PricingProductCategory"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/WireNotFound"
        "409":
          $ref: "#/components/responses/WireConflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalErrorEither"
  /api/v1/pricing/category-rules:
    get:
      operationId: pricingCategoryRuleList
      tags: [pricing]
      summary: List category pricing rules
      description: >-
        Registered only when CATEGORY_PRICING_ENABLED=true. Guarded admin or owner.
        The list envelope of ADR 0001 section 1, newest first (created_at DESC, id
        DESC). An unknown filter value or parameter is a 400 naming it; the legacy
        offset parameters are gone.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/Include"
        - name: target_type
          in: query
          required: false
          schema: {type: string, enum: [account, tier]}
        - name: tier
          in: query
          required: false
          schema: {type: string}
        - name: customer_id
          in: query
          required: false
          schema: {type: string, format: uuid}
        - name: category_id
          in: query
          required: false
          schema: {type: string, format: uuid}
        - name: is_active
          in: query
          required: false
          schema: {type: boolean}
      responses:
        "200":
          description: The page of category rules.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PricingCategoryRulePage"
        "400":
          $ref: "#/components/responses/WireBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalErrorEither"
    post:
      operationId: pricingCategoryRuleCreate
      tags: [pricing]
      summary: Create a category pricing rule
      description: >-
        Registered only when CATEGORY_PRICING_ENABLED=true. Guarded admin or owner.
        target_type account needs customer_id, tier needs tier. A fixed rule carries
        value_ten_thousandths (a scale 4 price), any other rule value_pct (a decimal
        string). The rule and its audit entry are written in one transaction. A
        second active rule for the same target and category is 409 duplicate.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PricingCategoryRuleCreateRequest"
      responses:
        "201":
          description: The created rule at revision 1.
          headers:
            Location:
              description: The rule's URL.
              schema:
                type: string
            ETag:
              description: The rule revision in quotes, for example "3". Send it back as If-Match.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PricingCategoryRule"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/WireConflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalErrorEither"
  /api/v1/pricing/category-rules/bulk:
    post:
      operationId: pricingCategoryRuleBulkUpsert
      tags: [pricing]
      summary: Bulk upsert category pricing rules
      description: >-
        Registered only when CATEGORY_PRICING_ENABLED=true. Guarded admin or owner.
        The body is a JSON array of 1 to 500 rules, each validated as on single
        create; an element that carries an id replaces the rule with that id at its revision. Any
        failure refuses the whole batch, which is written with its audit entries in
        one transaction.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              minItems: 1
              maxItems: 500
              items:
                $ref: "#/components/schemas/PricingCategoryRuleBulkItem"
      responses:
        "200":
          description: The number of rules written.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PricingBulkCount"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/WireConflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalErrorEither"
    delete:
      operationId: pricingCategoryRuleBulkDelete
      tags: [pricing]
      summary: Bulk delete category pricing rules
      description: >-
        Registered only when CATEGORY_PRICING_ENABLED=true. Guarded admin or owner.
        DELETE with a JSON body of ids; at least one is required. The deletions and
        their audit entries are one transaction.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PricingBulkDeleteRequest"
      responses:
        "204":
          description: Deleted; no body.
        "400":
          $ref: "#/components/responses/WireBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/InternalErrorEither"
  /api/v1/pricing/category-rules/{id}:
    put:
      operationId: pricingCategoryRuleUpdate
      tags: [pricing]
      summary: Update a category pricing rule
      description: >-
        Registered only when CATEGORY_PRICING_ENABLED=true. Guarded admin or owner.
        Takes the rule's revision (If-Match or the body revision; neither is 428, a
        stale one 409 stale_revision). The target (account or tier, customer, category)
        is fixed at create: a body that names one is a 400 naming it. The write and its
        audit entry are one transaction.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PricingCategoryRuleUpdateRequest"
      responses:
        "200":
          description: The rule at its new revision.
          headers:
            ETag:
              description: The rule revision in quotes, for example "3". Send it back as If-Match.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PricingCategoryRule"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/WireNotFound"
        "409":
          $ref: "#/components/responses/WireConflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "428":
          $ref: "#/components/responses/WirePreconditionRequired"
        "500":
          $ref: "#/components/responses/InternalErrorEither"
    delete:
      operationId: pricingCategoryRuleDelete
      tags: [pricing]
      summary: Delete a category pricing rule
      description: >-
        Registered only when CATEGORY_PRICING_ENABLED=true. Guarded admin or owner.
        At the rule's revision (If-Match or an optional body revision). A missing
        rule is 404.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "204":
          description: Deleted; no body.
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/WireNotFound"
        "409":
          $ref: "#/components/responses/WireConflict"
        "428":
          $ref: "#/components/responses/WirePreconditionRequired"
        "500":
          $ref: "#/components/responses/InternalErrorEither"
  /api/v1/pricing/category-rules/{id}/audit:
    get:
      operationId: pricingCategoryRuleAudit
      tags: [pricing]
      summary: List audit entries for a category pricing rule
      description: >-
        Registered only when CATEGORY_PRICING_ENABLED=true. Guarded admin or owner.
        The list envelope, the rule's most recent entries (at most 50) on one page.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: The audit entries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PricingCategoryRuleAuditList"
        "400":
          $ref: "#/components/responses/WireBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalErrorEither"
  /api/v1/pricing/matrix:
    get:
      operationId: pricingMatrix
      tags: [pricing]
      summary: Get the category by tier pricing matrix
      description: >-
        Registered only when CATEGORY_PRICING_ENABLED=true. Guarded admin or owner.
      responses:
        "200":
          description: The matrix.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PricingMatrix"
        "400":
          $ref: "#/components/responses/WireBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalErrorEither"
  /api/v1/pricing/resolve:
    get:
      operationId: pricingResolve
      tags: [pricing]
      summary: Preview the effective category price for a product
      description: >-
        Registered only when CATEGORY_PRICING_ENABLED=true. Guarded admin or owner.
        product_id is required; a customer_id that is not a UUID is a 400. When tier
        is absent it is taken from the customer, else RETAIL. A product with no
        category resolves to match_type none with an empty category_path, with 200.
      parameters:
        - name: product_id
          in: query
          required: true
          schema: {type: string, format: uuid}
        - name: customer_id
          in: query
          required: false
          schema: {type: string, format: uuid}
        - name: tier
          in: query
          required: false
          schema: {type: string}
      responses:
        "200":
          description: The resolution.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PricingResolvedCategoryPrice"
        "400":
          $ref: "#/components/responses/WireBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalErrorEither"
  /api/v1/pricing/rebates/programs:
    get:
      operationId: pricingRebateProgramList
      tags: [pricing]
      summary: List rebate programs
      description: >-
        Guarded admin or owner. Optional vendor_id filter (an unparseable value
        is silently ignored). A bare array with tiers populated; null when no
        program matches.
      parameters:
        - name: vendor_id
          in: query
          required: false
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: The programs.
          content:
            application/json:
              schema:
                type: [array, "null"]
                items:
                  $ref: "#/components/schemas/PricingRebateProgram"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: pricingRebateProgramCreate
      tags: [pricing]
      summary: Create a rebate program with tiers
      description: >-
        Guarded admin or owner. The body wraps the program and its tiers.
        Only program.vendor_id and program.name are validated.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PricingRebateProgramCreateRequest"
      responses:
        "201":
          description: The created program, reloaded with its tiers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PricingRebateProgram"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
        "409":
          $ref: "#/components/responses/ConflictEither"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /api/v1/pricing/rebates/programs/{id}:
    get:
      operationId: pricingRebateProgramGet
      tags: [pricing]
      summary: Get a rebate program with tiers
      description: Guarded admin or owner.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: The program.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PricingRebateProgram"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/pricing/rebates/programs/{id}/claims:
    get:
      operationId: pricingRebateClaimList
      tags: [pricing]
      summary: List claims for a rebate program
      description: >-
        Guarded admin or owner. A bare array; null when the program has no
        claims. An unknown program id is not an error.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: The claims.
          content:
            application/json:
              schema:
                type: [array, "null"]
                items:
                  $ref: "#/components/schemas/PricingRebateClaim"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/pricing/rebates/programs/{id}/claims/calculate:
    post:
      operationId: pricingRebateClaimCalculate
      tags: [pricing]
      summary: Calculate a rebate claim for a period
      description: >-
        Guarded admin or owner. Answers 200, not 201. The qualifying volume is
        the caller supplied mock_volume (there is no ledger query yet). An
        unknown program, like any service failure, answers 500.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PricingRebateClaimCalculateRequest"
      responses:
        "200":
          description: The calculated claim.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PricingRebateClaim"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
        "409":
          $ref: "#/components/responses/ConflictEither"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /api/v1/market-indices:
    get:
      operationId: marketIndexList
      tags: [marketIndex]
      summary: List market indices
      description: Guarded admin or owner. A bare unpaged array, always an array.
      responses:
        "200":
          description: Every market index.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MarketIndex"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/market-indices/{id}:
    put:
      operationId: marketIndexUpdateMetadata
      tags: [marketIndex]
      summary: Update market index metadata
      description: >-
        Guarded admin or owner. An empty or omitted name or description keeps
        the stored value; an omitted is_active keeps the stored flag. Always
        refreshes last_updated_at.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarketIndexMetadataRequest"
      responses:
        "200":
          description: The index re-read after the update.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketIndex"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
        "409":
          $ref: "#/components/responses/ConflictEither"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /api/v1/market-indices/{id}/history:
    get:
      operationId: marketIndexHistory
      tags: [marketIndex]
      summary: Get a market index value history
      description: >-
        Guarded admin or owner. The window ends now and starts days back.
        days outside 1 to 730, or unparseable, silently falls back to 90. An
        unknown index id is not an error (empty points).
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: days
          in: query
          required: false
          description: Window length in days; default 90, accepted 1 to 730.
          schema: {type: integer}
      responses:
        "200":
          description: The time series.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketIndexHistoryResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/market-indices/{id}/refresh:
    post:
      operationId: marketIndexRefresh
      tags: [marketIndex]
      summary: Apply a new market index value
      description: >-
        Guarded admin or owner. new_value must be positive. Source defaults to
        MANUAL. Updates the index and appends a history point in one
        transaction, then kicks the exposure scanner; a scanner failure does
        not fail the call and shows as scan_kicked false.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarketIndexRefreshRequest"
      responses:
        "200":
          description: The updated index, the new history id and the scan flag.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketIndexRefreshResponse"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
        "409":
          $ref: "#/components/responses/ConflictEither"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /api/v1/market-indices/{id}/refresh/preview:
    post:
      operationId: marketIndexRefreshPreview
      tags: [marketIndex]
      summary: Preview the exposure of a new market index value
      description: >-
        Guarded admin or owner. A dry run: nothing is written. new_value must
        be positive. top_customers lists at most five customers by exposure
        and is null when no active escalator carries a base index.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarketIndexRefreshRequest"
      responses:
        "200":
          description: The exposure preview.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketIndexRefreshPreview"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
        "409":
          $ref: "#/components/responses/ConflictEither"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
components:
  schemas:
    PricingSource:
      type: string
      description: Where a price came from, lowercase (ADR 0006 section 7.3).
      enum: [contract, tier, retail, quantity_break, job_override, promotional, category_tier, category_account]
    PricingRuleType:
      type: string
      enum: [quantity_break, job_override, promotional]
    PricingCalculatedPrice:
      type: object
      description: >-
        The price read (ADR 0006 section 7.3). unit_price_ten_thousandths is the
        exact scale 4 price in price_uom; uom_qty and price_uom_qty are the
        line's conversion pair; line_total_cents is the one rounding, by the line
        extension rule.
      required: [customer_id, product_id, quantity, uom, unit_price_ten_thousandths, price_uom, uom_qty, price_uom_qty, line_total_cents, price_basis, details]
      properties:
        customer_id: {type: string, format: uuid}
        product_id: {type: string, format: uuid}
        quantity: {type: string}
        uom: {type: string}
        unit_price_ten_thousandths: {type: integer, format: int64}
        price_uom: {type: string}
        uom_qty: {type: string}
        price_uom_qty: {type: string}
        line_total_cents: {type: integer, format: int64}
        price_basis:
          $ref: "#/components/schemas/PricingSource"
        details:
          type: string
          description: Free text such as "Gold Tier (15%)".
    PricingRule:
      type: object
      required: [id, name, rule_type, product_id, customer_id, job_id, category, fixed_price_ten_thousandths, discount_pct, markup_pct, min_quantity, max_quantity, margin_floor_pct, starts_at, expires_at, is_active, priority, revision, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        rule_type:
          $ref: "#/components/schemas/PricingRuleType"
        product_id: {type: [string, "null"], format: uuid}
        customer_id: {type: [string, "null"], format: uuid}
        job_id: {type: [string, "null"], format: uuid}
        category:
          type: string
          description: Empty means unscoped.
        fixed_price_ten_thousandths: {type: [integer, "null"], format: int64}
        discount_pct: {type: [string, "null"]}
        markup_pct: {type: [string, "null"]}
        min_quantity: {type: string}
        max_quantity: {type: [string, "null"]}
        margin_floor_pct: {type: [string, "null"]}
        starts_at: {type: [string, "null"], format: date-time}
        expires_at: {type: [string, "null"], format: date-time}
        is_active: {type: boolean}
        priority: {type: integer}
        revision: {type: integer, format: int64}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    PricingRulePage:
      type: object
      required: [items, next_cursor, limit]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PricingRule"
        next_cursor: {type: [string, "null"]}
        limit: {type: integer}
        total: {type: integer, format: int64}
    PricingRuleCreateRequest:
      type: object
      required: [name, rule_type]
      description: The create body. The server assigns the id, the revision and both timestamps; a field not listed is a 400.
      properties:
        name: {type: string, minLength: 1}
        rule_type:
          $ref: "#/components/schemas/PricingRuleType"
        product_id: {type: [string, "null"], format: uuid}
        customer_id: {type: [string, "null"], format: uuid}
        job_id: {type: [string, "null"], format: uuid}
        category: {type: [string, "null"]}
        fixed_price_ten_thousandths: {type: [integer, "null"], format: int64}
        discount_pct: {type: [string, "null"]}
        markup_pct: {type: [string, "null"]}
        min_quantity: {type: [string, "null"]}
        max_quantity: {type: [string, "null"]}
        margin_floor_pct: {type: [string, "null"]}
        starts_at: {type: [string, "null"], format: date-time}
        expires_at: {type: [string, "null"], format: date-time}
        is_active: {type: boolean, description: Defaults to true.}
        priority: {type: integer}
    PricingEscalationRequest:
      type: object
      required: [base_price, escalation_type, effective_date, target_date]
      properties:
        base_price: {type: number, exclusiveMinimum: 0}
        escalation_type:
          type: string
          enum: [PERCENTAGE, INDEX_DELTA]
        escalation_rate:
          type: number
          description: Percent per month for PERCENTAGE; the base index value for INDEX_DELTA.
        effective_date: {type: string, format: date}
        target_date: {type: string, format: date}
        market_index_id: {type: string, format: uuid}
    PricingEscalationResult:
      type: object
      required: [base_price, future_price, price_delta, delta_percent, months_out, is_stale, escalation_type, is_expired]
      properties:
        base_price: {type: number}
        future_price: {type: number}
        price_delta: {type: number}
        delta_percent: {type: number}
        months_out: {type: integer}
        is_stale: {type: boolean}
        stale_delta_pct: {type: number}
        current_index: {type: number}
        base_index: {type: number}
        escalation_type: {type: string}
        expiration_date: {type: string}
        is_expired: {type: boolean}
    PricingProductCategory:
      type: object
      required: [id, name, slug, path, parent_id, sort_order, is_active, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        slug: {type: string}
        path:
          type: string
          description: ltree path such as lumber.framing.
        parent_id: {type: [string, "null"], format: uuid}
        sort_order: {type: integer}
        is_active: {type: boolean}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        children:
          type: array
          description: Present on the tree view only.
          items:
            $ref: "#/components/schemas/PricingProductCategory"
    PricingProductCategoryList:
      type: object
      required: [items, next_cursor, limit]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PricingProductCategory"
        next_cursor: {type: [string, "null"]}
        limit: {type: integer}
    PricingProductCategoryWrite:
      type: object
      required: [name, slug, path]
      properties:
        name: {type: string}
        slug: {type: string}
        path: {type: string}
        parent_id: {type: [string, "null"], format: uuid}
        sort_order: {type: integer}
        is_active: {type: boolean}
    PricingCategoryRule:
      type: object
      description: >-
        The rule's value is one number with two readings (ADR 0001 section 7):
        value_ten_thousandths on a fixed rule, value_pct otherwise, null for the
        other.
      required: [id, target_type, customer_id, tier, category_id, rule_type, value_ten_thousandths, value_pct, margin_floor_pct, starts_at, expires_at, is_active, priority, created_by, revision, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        target_type:
          type: string
          enum: [account, tier]
        customer_id: {type: [string, "null"], format: uuid}
        tier: {type: string}
        category_id: {type: string, format: uuid}
        rule_type:
          type: string
          enum: [markup, markdown, fixed, margin]
        value_ten_thousandths: {type: [integer, "null"], format: int64}
        value_pct: {type: [string, "null"]}
        margin_floor_pct: {type: [string, "null"]}
        starts_at: {type: [string, "null"], format: date-time}
        expires_at: {type: [string, "null"], format: date-time}
        is_active: {type: boolean}
        priority: {type: integer}
        created_by: {type: string}
        revision: {type: integer, format: int64}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        category_name: {type: string, description: Joined on reads.}
        category_path: {type: string, description: Joined on reads.}
        customer_name: {type: string, description: Joined on reads.}
    PricingCategoryRulePage:
      type: object
      required: [items, next_cursor, limit]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PricingCategoryRule"
        next_cursor: {type: [string, "null"]}
        limit: {type: integer}
        total: {type: integer, format: int64}
    PricingCategoryRuleValues:
      type: object
      properties:
        rule_type:
          type: string
          enum: [markup, markdown, fixed, margin]
        value_ten_thousandths: {type: [integer, "null"], format: int64}
        value_pct: {type: [string, "null"]}
        margin_floor_pct: {type: [string, "null"]}
        starts_at: {type: [string, "null"], format: date-time}
        expires_at: {type: [string, "null"], format: date-time}
        is_active: {type: boolean, description: Defaults to true.}
        priority: {type: integer}
    PricingCategoryRuleCreateRequest:
      description: The create body; a field not listed is a 400.
      allOf:
        - $ref: "#/components/schemas/PricingCategoryRuleValues"
        - type: object
          required: [target_type, category_id, rule_type]
          properties:
            target_type:
              type: string
              enum: [account, tier]
            customer_id: {type: [string, "null"], format: uuid}
            tier: {type: [string, "null"]}
            category_id: {type: string, format: uuid}
    PricingCategoryRuleBulkItem:
      description: >-
        One element of the bulk body; an id replaces the rule that has it, at
        the revision the element names (required with an id: 428 without, 409
        when stale) and without changing the rule's scope.
      allOf:
        - $ref: "#/components/schemas/PricingCategoryRuleCreateRequest"
        - type: object
          properties:
            id: {type: string, format: uuid}
            revision: {type: integer, format: int64}
    PricingCategoryRuleUpdateRequest:
      description: >-
        The update body: the values and the revision. A target field
        (target_type, customer_id, tier, category_id) is a 400.
      allOf:
        - $ref: "#/components/schemas/PricingCategoryRuleValues"
        - type: object
          required: [rule_type]
          properties:
            revision: {type: integer, format: int64}
    PricingCategoryRuleAudit:
      type: object
      required: [id, rule_id, action, performed_by, performed_at]
      properties:
        id: {type: string, format: uuid}
        rule_id: {type: string, format: uuid}
        action: {type: string}
        old_values: {type: object, additionalProperties: true}
        new_values: {type: object, additionalProperties: true}
        performed_by: {type: string}
        performed_at: {type: string, format: date-time}
        category_id: {type: string, format: uuid}
        target_type: {type: string}
        tier: {type: string}
        customer_id: {type: string, format: uuid}
    PricingCategoryRuleAuditList:
      type: object
      required: [items, next_cursor, limit]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PricingCategoryRuleAudit"
        next_cursor: {type: [string, "null"]}
        limit: {type: integer}
    PricingBulkCount:
      type: object
      required: [count]
      properties:
        count: {type: integer}
    PricingBulkDeleteRequest:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          minItems: 1
          items: {type: string, format: uuid}
    PricingMatrixCell:
      type: object
      required: [category_id, category_name, category_path, tier, inherited]
      properties:
        category_id: {type: string, format: uuid}
        category_name: {type: string}
        category_path: {type: string}
        tier: {type: string}
        rule:
          $ref: "#/components/schemas/PricingCategoryRule"
        inherited: {type: boolean}
        source_path: {type: string}
    PricingMatrix:
      type: object
      required: [categories, tiers, cells]
      properties:
        categories:
          type: [array, "null"]
          items:
            $ref: "#/components/schemas/PricingProductCategory"
        tiers:
          type: [array, "null"]
          items: {type: string}
        cells:
          type: [array, "null"]
          items:
            $ref: "#/components/schemas/PricingMatrixCell"
    PricingResolvedCategoryPrice:
      type: object
      required: [match_type, category_path, cost_price_ten_thousandths]
      properties:
        rule:
          $ref: "#/components/schemas/PricingCategoryRule"
        match_type:
          type: string
          enum: [account_exact, account_ancestor, tier_exact, tier_ancestor, none]
        category_path: {type: string}
        cost_price_ten_thousandths:
          type: integer
          format: int64
          description: The product average unit cost at scale 4, used by markup and margin rules.
    PricingRebateTier:
      type: object
      required: [id, program_id, min_volume, max_volume, rebate_pct, created_at]
      properties:
        id: {type: string, format: uuid}
        program_id: {type: string, format: uuid}
        min_volume: {type: integer, format: int64}
        max_volume: {type: [integer, "null"], format: int64}
        rebate_pct: {type: number}
        created_at: {type: string, format: date-time}
    PricingRebateProgram:
      type: object
      required: [id, vendor_id, name, program_type, start_date, end_date, is_active, created_at]
      properties:
        id: {type: string, format: uuid}
        vendor_id: {type: string, format: uuid}
        name: {type: string}
        program_type:
          type: string
          description: VOLUME, GROWTH or PRODUCT_MIX by convention; not validated.
        start_date: {type: string, format: date-time}
        end_date: {type: string, format: date-time}
        is_active: {type: boolean}
        created_at: {type: string, format: date-time}
        tiers:
          type: array
          items:
            $ref: "#/components/schemas/PricingRebateTier"
    PricingRebateProgramCreateRequest:
      type: object
      required: [program]
      properties:
        program:
          type: object
          required: [vendor_id, name]
          properties:
            vendor_id: {type: string, format: uuid}
            name: {type: string, minLength: 1}
            program_type: {type: string}
            start_date: {type: string, format: date-time}
            end_date: {type: string, format: date-time}
            is_active: {type: boolean}
        tiers:
          type: array
          items:
            type: object
            required: [min_volume, rebate_pct]
            properties:
              min_volume: {type: integer, format: int64}
              max_volume: {type: [integer, "null"], format: int64}
              rebate_pct: {type: number}
    PricingRebateClaim:
      type: object
      required: [id, program_id, period_start, period_end, qualifying_volume, rebate_amount, status, claimed_at, created_at]
      properties:
        id: {type: string, format: uuid}
        program_id: {type: string, format: uuid}
        period_start: {type: string, format: date-time}
        period_end: {type: string, format: date-time}
        qualifying_volume: {type: integer, format: int64}
        rebate_amount: {type: integer, format: int64}
        status:
          type: string
          description: CALCULATED, CLAIMED or RECEIVED.
        claimed_at: {type: [string, "null"], format: date-time}
        created_at: {type: string, format: date-time}
    PricingRebateClaimCalculateRequest:
      type: object
      properties:
        period_start: {type: string, format: date-time}
        period_end: {type: string, format: date-time}
        mock_volume: {type: integer, format: int64}
    MarketIndex:
      type: object
      required: [id, name, source, current_value, unit, last_updated_at, created_at, index_code, is_active]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        source: {type: string}
        current_value: {type: number}
        previous_value: {type: number}
        unit: {type: string}
        last_updated_at: {type: string, format: date-time}
        created_at: {type: string, format: date-time}
        index_code: {type: string}
        commodity_kind: {type: string}
        description: {type: string}
        is_active: {type: boolean}
    MarketIndexMetadataRequest:
      type: object
      properties:
        name: {type: string}
        description: {type: string}
        is_active: {type: boolean}
    MarketIndexHistory:
      type: object
      required: [id, market_index_id, value, recorded_at, source]
      properties:
        id: {type: string, format: uuid}
        market_index_id: {type: string, format: uuid}
        value: {type: number}
        recorded_at: {type: string, format: date-time}
        recorded_by: {type: string}
        source: {type: string}
    MarketIndexHistoryResponse:
      type: object
      required: [market_index_id, from, to, points]
      properties:
        market_index_id: {type: string, format: uuid}
        from: {type: string, format: date-time}
        to: {type: string, format: date-time}
        points:
          type: array
          items:
            $ref: "#/components/schemas/MarketIndexHistory"
    MarketIndexRefreshRequest:
      type: object
      required: [new_value]
      properties:
        new_value: {type: number, exclusiveMinimum: 0}
        source:
          type: string
          description: Defaults to MANUAL on refresh; ignored by the preview.
        notes: {type: string}
    MarketIndexRefreshResponse:
      type: object
      required: [market_index, history_id, scan_kicked]
      properties:
        market_index:
