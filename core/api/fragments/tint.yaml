#
# The paint tint catalogue on the wire contract (row CP-16): the dealer's
# own bases, colorants, colours and per size formulas, the rescale between
# container sizes, and the saved colours per customer and job. No dispenser
# or colour matching device link. The `tint` module scope admits machine
# keys (tint:read, tint:write).
paths:
  /api/v1/tint/systems:
    get:
      operationId: tintSystemList
      tags: [tint]
      summary: List tint systems
      description: Every tinting system the dealer runs, with the dispense denominator that makes its colourant amount columns meaningful.
      responses:
        '200':
          description: The tint systems.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TintSystemPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: tintSystemCreate
      tags: [tint]
      summary: Create a tint system
      description: One manufacturer's tinting system. The unit_denominator is one of the trade's dispense increments (32, 48, 64, 128, 192, 384, 1024).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TintSystemCreate'
      responses:
        '201':
          description: The created system.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TintSystem'
        '400':
          $ref: '#/components/responses/BadRequestEither'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/tint/bases:
    get:
      operationId: tintBaseList
      tags: [tint]
      summary: List bases
      description: The base paints, optionally filtered to a tint system or to the bases whose product link is a given products row.
      parameters:
        - name: tint_system_id
          in: query
          description: Filter by tint system.
          schema: { type: string, format: uuid }
        - name: product_id
          in: query
          description: Only the bases whose product link names this product.
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The bases.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TintBasePage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: tintBaseCreate
      tags: [tint]
      summary: Create a base
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TintBaseCreate'
      responses:
        '201':
          description: The created base.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TintBase'
        '400':
          $ref: '#/components/responses/BadRequestEither'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/tint/colorants:
    get:
      operationId: tintColorantList
      tags: [tint]
      summary: List colorants
      parameters:
        - name: tint_system_id
          in: query
          description: Filter by tint system.
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The colorants.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TintColorantPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: tintColorantCreate
      tags: [tint]
      summary: Create a colorant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TintColorantCreate'
      responses:
        '201':
          description: The created colorant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TintColorant'
        '400':
          $ref: '#/components/responses/BadRequestEither'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/tint/colors:
    get:
      operationId: tintColorList
      tags: [tint]
      summary: List colours
      description: The colours, by name or manufacturer code fragment. A manufacturer code is an attribute, never a key.
      parameters:
        - name: tint_system_id
          in: query
          description: Filter by tint system.
          schema: { type: string, format: uuid }
        - name: q
          in: query
          description: A name or manufacturer code fragment.
          schema: { type: string }
      responses:
        '200':
          description: The colours.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TintColorPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: tintColorCreate
      tags: [tint]
      summary: Create a colour
      description: A colour of a book (manufacturer_code set) or a store match (is_custom true, no manufacturer code, optionally the customer it was matched for).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TintColorCreate'
      responses:
        '201':
          description: The created colour.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TintColor'
        '400':
          $ref: '#/components/responses/BadRequestEither'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/tint/formulas:
    get:
      operationId: tintFormulaList
      tags: [tint]
      summary: List formulas
      description: The formulas, optionally filtered to a colour, a base and a container size code, with their components in guide order.
      parameters:
        - name: color_id
          in: query
          description: Filter by colour.
          schema: { type: string, format: uuid }
        - name: base_id
          in: query
          description: Filter by base.
          schema: { type: string, format: uuid }
        - name: container_size_code
          in: query
          description: Filter by container size code.
          schema: { type: string }
      responses:
        '200':
          description: The formulas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TintFormulaPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: tintFormulaCreate
      tags: [tint]
      summary: Create a formula
      description: One formula of a colour in a base at a container size. Every component's unit_denominator must be the one the colour's tint system declares.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TintFormulaCreate'
      responses:
        '201':
          description: The created formula.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TintFormula'
        '400':
          $ref: '#/components/responses/BadRequestEither'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/tint/formulas/{id}:
    get:
      operationId: tintFormulaGet
      tags: [tint]
      summary: Read a formula
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The formula with its components.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TintFormula'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/tint/formulas/{id}/rescale:
    post:
      operationId: tintFormulaRescale
      tags: [tint]
      summary: Rescale a formula to another container size
      description: Each component is multiplied by the exact volume ratio and rounded independently to a whole count of its own dispense unit, half up; any_rounded reports whether at least one component was rounded, so the counter can see the value is a derived approximation and override it.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TintRescaleRequest'
      responses:
        '200':
          description: The source formula, the rescaled components and the rounding flag.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TintRescale'
        '400':
          $ref: '#/components/responses/BadRequestEither'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/tint/saved-colors:
    get:
      operationId: tintSavedColorList
      tags: [tint]
      summary: List saved colours
      description: The store's record of a customer's colours, optionally filtered by the free text job note (a room or a jobsite).
      parameters:
        - name: customer_id
          in: query
          description: Filter by customer.
          schema: { type: string, format: uuid }
        - name: job_note
          in: query
          description: A job note fragment.
          schema: { type: string }
      responses:
        '200':
          description: The saved colours.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TintSavedColorPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: tintSavedColorCreate
      tags: [tint]
      summary: Save a colour for a customer
      description: The name is unique per customer, so a customer cannot accumulate two identical names.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TintSavedColorCreate'
      responses:
        '201':
          description: The saved colour.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TintSavedColor'
        '400':
          $ref: '#/components/responses/BadRequestEither'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/tint/saved-colors/{id}:
    delete:
      operationId: tintSavedColorDelete
      tags: [tint]
      summary: Delete a saved colour
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: The saved colour is gone.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/tint/charge:
    get:
      operationId: tintChargeGet
      tags: [tint]
      summary: The dealer's tint charge
      description: The flat tint charge setting of the counter (pos.tint_charge_cents), 0 when none is set, the dominant retail model folding the tint into the shelf price.
      responses:
        '200':
          description: The charge in cents.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TintCharge'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  schemas:
    TintSystem:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        manufacturer: { type: string }
        unit_denominator: { type: integer }
        unit_label: { type: string }
        created_at: { type: string, format: date-time }
    TintSystemCreate:
      type: object
      required: [code, name, unit_denominator]
      properties:
        code: { type: string }
        name: { type: string }
        manufacturer: { type: string }
        unit_denominator: { type: integer, enum: [32, 48, 64, 128, 192, 384, 1024] }
        unit_label: { type: string }
    TintSystemPage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/TintSystem' }
    TintBase:
      type: object
      properties:
        id: { type: string, format: uuid }
        tint_system_id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        manufacturer_base_code: { type: string }
        product_id: { type: string, format: uuid, nullable: true }
        fill_volume_oz: { type: integer }
        is_deepest: { type: boolean }
        created_at: { type: string, format: date-time }
    TintBaseCreate:
      type: object
      required: [tint_system_id, code, name, fill_volume_oz]
      properties:
        tint_system_id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        manufacturer_base_code: { type: string }
        product_id: { type: string, format: uuid }
        fill_volume_oz: { type: integer }
        is_deepest: { type: boolean }
    TintBasePage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/TintBase' }
    TintColorant:
      type: object
      properties:
        id: { type: string, format: uuid }
        tint_system_id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        manufacturer_code: { type: string }
        manufacturer_upc: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
    TintColorantCreate:
      type: object
      required: [tint_system_id, code, name]
      properties:
        tint_system_id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        manufacturer_code: { type: string }
        manufacturer_upc: { type: string }
    TintColorantPage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/TintColorant' }
    TintColor:
      type: object
      properties:
        id: { type: string, format: uuid }
        tint_system_id: { type: string, format: uuid }
        manufacturer_code: { type: string, nullable: true }
        name: { type: string }
        is_custom: { type: boolean }
        customer_id: { type: string, format: uuid, nullable: true }
        note: { type: string }
        created_at: { type: string, format: date-time }
    TintColorCreate:
      type: object
      required: [tint_system_id, name]
      properties:
        tint_system_id: { type: string, format: uuid }
        manufacturer_code: { type: string }
        name: { type: string }
        is_custom: { type: boolean }
        customer_id: { type: string, format: uuid }
        note: { type: string }
    TintColorPage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/TintColor' }
    TintAmount:
      type: object
      required: [whole_oz, increments_coarse, increments_fine, unit_denominator]
      properties:
        whole_oz: { type: integer }
        increments_coarse: { type: integer, description: The count of the coarse 1/32 step. }
        increments_fine: { type: integer, description: The count of the fine 1/denominator step. }
        unit_denominator: { type: integer, enum: [32, 48, 64, 128, 192, 384, 1024] }
    TintComponent:
      type: object
      properties:
        colorant_id: { type: string, format: uuid }
        colorant_code: { type: string }
        colorant_name: { type: string }
        amount: { $ref: '#/components/schemas/TintAmount' }
    TintFormula:
      type: object
      properties:
        id: { type: string, format: uuid }
        color_id: { type: string, format: uuid }
        base_id: { type: string, format: uuid }
        product_id: { type: string, format: uuid, nullable: true }
        container_size_code: { type: string }
        container_volume_oz: { type: integer }
        total_colorant_oz: { type: string }
        source: { type: string, enum: [book, match, manual] }
        components:
          type: array
          items: { $ref: '#/components/schemas/TintComponent' }
        created_at: { type: string, format: date-time }
    TintFormulaCreate:
      type: object
      required: [color_id, base_id, container_size_code, container_volume_oz]
      properties:
        color_id: { type: string, format: uuid }
        base_id: { type: string, format: uuid }
        product_id: { type: string, format: uuid }
        container_size_code: { type: string }
        container_volume_oz: { type: integer }
        source: { type: string, enum: [book, match, manual] }
        components:
          type: array
          items:
            type: object
            required: [colorant_id, whole_oz, increments_coarse, increments_fine, unit_denominator]
            properties:
              colorant_id: { type: string, format: uuid }
              whole_oz: { type: integer }
              increments_coarse: { type: integer }
              increments_fine: { type: integer }
              unit_denominator: { type: integer, enum: [32, 48, 64, 128, 192, 384, 1024] }
    TintFormulaPage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/TintFormula' }
    TintRescaleRequest:
      type: object
      required: [target_volume_oz]
      properties:
        target_volume_oz: { type: integer, description: The target container volume in whole fluid ounces. }
    TintRescaledComponent:
      type: object
      properties:
        colorant_code: { type: string }
        colorant_name: { type: string }
        amount: { $ref: '#/components/schemas/TintAmount' }
        rounded: { type: boolean }
    TintRescale:
      type: object
      properties:
        formula: { $ref: '#/components/schemas/TintFormula' }
        target_volume_oz: { type: integer }
        components:
          type: array
          items: { $ref: '#/components/schemas/TintRescaledComponent' }
        any_rounded: { type: boolean }
    TintSavedColor:
      type: object
      properties:
        id: { type: string, format: uuid }
        customer_id: { type: string, format: uuid }
        color_id: { type: string, format: uuid }
        name: { type: string }
        job_note: { type: string }
        note: { type: string }
        project_id: { type: string, format: uuid, nullable: true }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
    TintSavedColorCreate:
      type: object
      required: [customer_id, color_id, name]
      properties:
        customer_id: { type: string, format: uuid }
        color_id: { type: string, format: uuid }
        name: { type: string }
        job_note: { type: string }
        note: { type: string }
        project_id: { type: string, format: uuid }
    TintSavedColorPage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/TintSavedColor' }
    TintCharge:
      type: object
      properties:
        tint_charge_cents: { type: integer }
