components:
  schemas:
    DeliveryDriver:
      type: object
      required: [id, name, phone_number, license_number, status, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        phone_number:
          type: string
        license_number:
          type: string
        email:
          type: string
          nullable: true
        cdl_class:
          type: string
          nullable: true
        cdl_expiry:
          type: string
          format: date-time
          nullable: true
        photo_url:
          type: string
          nullable: true
        status:
          type: string
          enum: [ACTIVE, INACTIVE]
        hire_date:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    DeliveryDriverCreate:
      type: object
      required: [name, phone_number, license_number]
      properties:
        name:
          type: string
        phone_number:
          type: string
        license_number:
          type: string
        email:
          type: string
        cdl_class:
          type: string
        cdl_expiry:
          type: string
          format: date-time
        hire_date:
          type: string
          format: date-time
    DeliveryDriverUpdate:
      type: object
      properties:
        name:
          type: string
        phone_number:
          type: string
        license_number:
          type: string
        email:
          type: string
        cdl_class:
          type: string
        cdl_expiry:
          type: string
          format: date-time
        status:
          type: string
          enum: [ACTIVE, INACTIVE]
        hire_date:
          type: string
          format: date-time
    DeliveryVehicle:
      type: object
      required: [id, name, vehicle_type, license_plate, capacity_weight_lbs, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        vehicle_type:
          type: string
          enum: [BOX_TRUCK, FLATBED, PICKUP, VAN, CRANE]
        license_plate:
          type: string
        make:
          type: string
          nullable: true
        model:
          type: string
          nullable: true
        year:
          type: integer
          nullable: true
        vin:
          type: string
          nullable: true
        capacity_weight_lbs:
          type: number
        odometer_miles:
          type: number
          nullable: true
          description: Float miles.
        insurance_expiry:
          type: string
          format: date-time
          nullable: true
        next_service_date:
          type: string
          format: date-time
          nullable: true
        photo_url:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    DeliveryVehicleCreate:
      type: object
      required: [name, vehicle_type, license_plate, capacity_weight_lbs]
      properties:
        name:
          type: string
        vehicle_type:
          type: string
