#
# The delivery module on the wire contract of ADR 0001 (item C5-1d): the
# cursor list envelope on every list, the one error envelope, lowercase
# vocabularies, business dates as YYYY-MM-DD, a revision with its ETag on
# every record and the If-Match or body revision precondition on every
# write, and every mutation's audit row and module event in one transaction.
# Routes and stops carry the branch wall through the stop's order branch: a
# second branch's request is a 404. Vehicles and drivers carry no branch
# column (the fleet is dealer-wide), a stated limit. The board read is one
# payload: the route list embeds each route's stops under include=stops.
paths:
  /api/v1/delivery/vehicles:
    get:
      operationId: deliveryVehicleList
      tags: [delivery]
      summary: List vehicles
      description: >-
        The cursor list envelope, newest first on (created_at, id). The fleet
        is dealer-wide, so no branch wall applies. total appears only under
        include=total.
      parameters:
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Include"
        - $ref: "#/components/parameters/XBranchId"
      responses:
        "200":
          description: The page of vehicles.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryVehiclePage"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "500":
          $ref: "#/components/responses/InternalErrorEither"
    post:
      operationId: deliveryVehicleCreate
      tags: [delivery]
      summary: Create a vehicle
      description: >-
        name, vehicle_type (lowercase) and license_plate are required; an
        unknown body field, an uppercase vehicle_type or a malformed date is
        a 400 naming the field. Writes the audit row vehicle.created and the
        event vehicle.created in one transaction, the event last.
      parameters:
        - $ref: "#/components/parameters/XBranchId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeliveryVehicleCreate"
      responses:
        "201":
          description: The created vehicle, with its ETag and Location.
          headers:
            ETag:
              description: The record's revision in quotes, for example "3". Send it back as If-Match.
              schema:
                type: string
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryVehicle"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalErrorEither"
  /api/v1/delivery/vehicles/{id}:
    get:
      operationId: deliveryVehicleGet
      tags: [delivery]
      summary: Get a vehicle
      description: A missing vehicle (or one soft deleted) is a 404 in the error envelope.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/XBranchId"
      responses:
        "200":
          description: The vehicle, with its revision's ETag.
          headers:
            ETag:
              description: The record's revision in quotes, for example "3". Send it back as If-Match.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryVehicle"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "404":
          $ref: "#/components/responses/WireNotFound"
        "500":
          $ref: "#/components/responses/InternalErrorEither"
    put:
      operationId: deliveryVehicleUpdate
      tags: [delivery]
      summary: Update a vehicle
      description: >-
        Replaces every mutable field on the client's revision: If-Match or a
        body revision (428 without one, 409 stale_revision behind). An
        omitted optional field clears it. Writes the audit row and the event
        vehicle.updated.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/XBranchId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeliveryVehicleUpdate"
      responses:
        "200":
          description: The updated vehicle, with the new revision and its ETag.
          headers:
            ETag:
              description: The record's revision in quotes, for example "3". Send it back as If-Match.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryVehicle"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "404":
          $ref: "#/components/responses/WireNotFound"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "428":
          $ref: "#/components/responses/WirePreconditionRequired"
        "500":
          $ref: "#/components/responses/InternalErrorEither"
    delete:
      operationId: deliveryVehicleDelete
      tags: [delivery]
      summary: Delete a vehicle
      description: >-
        A soft delete on the client's revision, carried by If-Match alone (a
        DELETE has no body). Writes the audit row and the event
        vehicle.deleted.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/XBranchId"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "204":
          description: Vehicle deleted.
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "404":
          $ref: "#/components/responses/WireNotFound"
        "409":
          $ref: "#/components/responses/ConflictEither"
        "428":
          $ref: "#/components/responses/WirePreconditionRequired"
        "500":
          $ref: "#/components/responses/InternalErrorEither"
  /api/v1/delivery/vehicles/{id}/photo:
    post:
      operationId: deliveryVehiclePhoto
      tags: [delivery]
      summary: Upload a vehicle photo
      description: >-
        A jpg, jpeg, png or webp file of at most 10 MB. The photo attach
        takes no precondition (a photo is evidence appended to a record, and
        a revision would fail the second of a run of uploads) but it moves
        the revision, returns the vehicle with the new ETag, and writes the
        audit row and event vehicle.updated (data part photo) in one
        transaction.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/XBranchId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/DeliveryPhotoUpload"
      responses:
        "200":
          description: The vehicle with the photo attached.
          headers:
            ETag:
              description: The record's revision in quotes, for example "3". Send it back as If-Match.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryVehicle"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "404":
          $ref: "#/components/responses/WireNotFound"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalErrorEither"
  /api/v1/delivery/drivers:
    get:
      operationId: deliveryDriverList
      tags: [delivery]
      summary: List drivers
      description: The cursor list envelope, newest first on (created_at, id). The roster is dealer-wide.
      parameters:
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Include"
        - $ref: "#/components/parameters/XBranchId"
      responses:
        "200":
          description: The page of drivers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryDriverPage"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "500":
          $ref: "#/components/responses/InternalErrorEither"
    post:
      operationId: deliveryDriverCreate
      tags: [delivery]
      summary: Create a driver
      description: >-
        name is required; status defaults to active. Writes the audit row and
        the event driver.created in one transaction, the event last.
      parameters:
        - $ref: "#/components/parameters/XBranchId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeliveryDriverCreate"
      responses:
        "201":
          description: The created driver, with its ETag and Location.
          headers:
            ETag:
              description: The record's revision in quotes, for example "3". Send it back as If-Match.
              schema:
                type: string
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryDriver"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalErrorEither"
  /api/v1/delivery/drivers/{id}:
    get:
      operationId: deliveryDriverGet
      tags: [delivery]
      summary: Get a driver
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/XBranchId"
      responses:
        "200":
          description: The driver, with its revision's ETag.
          headers:
            ETag:
              description: The record's revision in quotes, for example "3". Send it back as If-Match.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryDriver"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "404":
          $ref: "#/components/responses/WireNotFound"
        "500":
          $ref: "#/components/responses/InternalErrorEither"
    put:
      operationId: deliveryDriverUpdate
      tags: [delivery]
      summary: Update a driver
      description: >-
        Replaces every mutable field, status required, on the client's
        revision (If-Match or body revision; 428 without one, 409 behind).
        Writes the audit row and the event driver.updated.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/XBranchId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeliveryDriverUpdate"
      responses:
        "200":
          description: The updated driver, with the new revision and its ETag.
          headers:
            ETag:
              description: The record's revision in quotes, for example "3". Send it back as If-Match.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryDriver"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "404":
          $ref: "#/components/responses/WireNotFound"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "428":
          $ref: "#/components/responses/WirePreconditionRequired"
        "500":
          $ref: "#/components/responses/InternalErrorEither"
    delete:
      operationId: deliveryDriverDelete
      tags: [delivery]
      summary: Delete a driver
      description: A soft delete on the client's If-Match; writes the audit row and the event driver.deleted.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/XBranchId"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "204":
          description: Driver deleted.
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "404":
          $ref: "#/components/responses/WireNotFound"
        "409":
          $ref: "#/components/responses/ConflictEither"
        "428":
          $ref: "#/components/responses/WirePreconditionRequired"
        "500":
          $ref: "#/components/responses/InternalErrorEither"
  /api/v1/delivery/drivers/{id}/photo:
    post:
      operationId: deliveryDriverPhoto
      tags: [delivery]
      summary: Upload a driver photo
      description: >-
        A jpg, jpeg, png or webp file of at most 10 MB. Like the vehicle
        photo attach it takes no precondition but moves the revision and
        writes the audit row and event driver.updated (data part photo).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/XBranchId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/DeliveryPhotoUpload"
      responses:
        "200":
          description: The driver with the photo attached.
          headers:
            ETag:
              description: The record's revision in quotes, for example "3". Send it back as If-Match.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryDriver"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "404":
          $ref: "#/components/responses/WireNotFound"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalErrorEither"
  /api/v1/delivery/routes:
    get:
      operationId: deliveryRouteList
      tags: [delivery]
      summary: List routes
      description: >-
        The board read. The cursor list envelope, newest scheduled date
        first on (scheduled_date, id). The date filter is honoured exactly
        (an unparseable date is a 400 naming date), driver_id and status
        filter, and include=stops embeds each route's stops in the same
        payload. A route is visible when none of its stops belongs to a
        branch the caller cannot see; a route with no stops is visible to
        every branch.
      parameters:
        - name: date
          in: query
          required: false
          description: Only routes scheduled for this date.
          schema:
            type: string
            format: date
        - name: driver_id
          in: query
          required: false
          description: Only this driver's routes.
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          required: false
          description: One lowercase route status.
          schema:
            $ref: "#/components/schemas/DeliveryRouteStatus"
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Include"
        - $ref: "#/components/parameters/XBranchId"
      responses:
        "200":
          description: The page of routes, with stops under include=stops.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryRoutePage"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "500":
          $ref: "#/components/responses/InternalErrorEither"
    post:
      operationId: deliveryRouteCreate
      tags: [delivery]
      summary: Create a route
      description: >-
        vehicle_id, driver_id and a scheduled_date as YYYY-MM-DD are
        required; a missing vehicle or driver is a 400 naming the field. The
        route starts draft. Writes the audit row and the event route.created.
      parameters:
        - $ref: "#/components/parameters/XBranchId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeliveryRouteCreate"
      responses:
        "201":
          description: The created route, with its ETag and Location.
          headers:
            ETag:
              description: The record's revision in quotes, for example "3". Send it back as If-Match.
              schema:
                type: string
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryRoute"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalErrorEither"
  /api/v1/delivery/routes/{id}:
    get:
      operationId: deliveryRouteGet
      tags: [delivery]
      summary: Get a route
      description: The route document with its stops embedded, behind the branch wall.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/XBranchId"
      responses:
        "200":
          description: The route with its stops, with its revision's ETag.
          headers:
            ETag:
              description: The record's revision in quotes, for example "3". Send it back as If-Match.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryRoute"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "404":
          $ref: "#/components/responses/WireNotFound"
        "500":
          $ref: "#/components/responses/InternalErrorEither"
  /api/v1/delivery/routes/{id}/transitions:
    post:
      operationId: deliveryRouteTransition
      tags: [delivery]
      summary: Move a route through its lifecycle
      description: >-
        to in_transit (from draft or scheduled) is the dispatch; to completed
        needs every stop terminal and at least one stop (blockers
        stop_not_terminal, route_empty). Takes the revision precondition
        (428 without, 409 stale or invalid_state_transition). Writes the
        audit row and the event route.in_transit or route.completed. The
        former /dispatch and /complete action routes are removed.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/XBranchId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeliveryRouteTransition"
      responses:
        "200":
          description: The route in its new status, with the new revision and its ETag.
          headers:
            ETag:
              description: The record's revision in quotes, for example "3". Send it back as If-Match.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryRoute"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "404":
          $ref: "#/components/responses/WireNotFound"
        "409":
          $ref: "#/components/responses/ConflictEither"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "428":
          $ref: "#/components/responses/WirePreconditionRequired"
        "500":
          $ref: "#/components/responses/InternalErrorEither"
  /api/v1/delivery/routes/{id}/reorder:
    post:
      operationId: deliveryRouteReorder
      tags: [delivery]
      summary: Reorder the stops of a route
      description: >-
        The list must name every stop of the route exactly once (400 naming
        ordered_delivery_ids or the offending entry otherwise). Takes the
        route's revision by If-Match (428 without, 409 behind); each stop's
        revision moves with its new position and the route's revision moves
        with the write. Writes the audit row and the event route.updated
        (data part stops).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/XBranchId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeliveryRouteReorder"
      responses:
        "200":
          description: The route with its stops in the new order.
          headers:
            ETag:
              description: The record's revision in quotes, for example "3". Send it back as If-Match.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryRoute"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "404":
          $ref: "#/components/responses/WireNotFound"
        "409":
          $ref: "#/components/responses/ConflictEither"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "428":
          $ref: "#/components/responses/WirePreconditionRequired"
        "500":
          $ref: "#/components/responses/InternalErrorEither"
  /api/v1/delivery/routes/{id}/optimize:
    post:
      operationId: deliveryRouteOptimize
      tags: [delivery]
      summary: Optimize the stop order of a route
      description: >-
        Reorders the stops through the configured routing service and
        persists the new order and the per-stop ETAs; a route with no
        geocoded stops is returned unchanged. The routing and geocoding
        calls run before the transaction opens and the route's revision is
        re-checked inside it (If-Match, 428 without, 409 if the route moved
        meanwhile). A route with no deliveries answers the unchanged route.
        Writes the audit row and the event route.updated (data part stops).
        The response is the route document now, not the optimizer's
        intermediate result.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/XBranchId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: The route with its stops in the optimized order.
          headers:
            ETag:
              description: The record's revision in quotes, for example "3". Send it back as If-Match.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryRoute"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "404":
          $ref: "#/components/responses/WireNotFound"
        "409":
          $ref: "#/components/responses/ConflictEither"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "428":
          $ref: "#/components/responses/WirePreconditionRequired"
        "500":
          $ref: "#/components/responses/InternalErrorEither"
  /api/v1/delivery/routes/{id}/deliveries:
    get:
      operationId: deliveryRouteDeliveries
      tags: [delivery]
      summary: List the stops of a route
      description: >-
        The cursor list envelope in stop order on (stop_sequence, id). The
        route is read behind the branch wall first, so a caller held to
        another branch gets the same 404 as reading the route. total appears
        under include=total.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Include"
        - $ref: "#/components/parameters/XBranchId"
      responses:
        "200":
          description: The page of stops.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryStopPage"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "404":
          $ref: "#/components/responses/WireNotFound"
        "500":
          $ref: "#/components/responses/InternalErrorEither"
  /api/v1/delivery/deliveries:
    post:
      operationId: deliveryCreate
      tags: [delivery]
      summary: Assign an order to a route
      description: >-
        Creates the route's stop for the order, pending. A pickup (will-call)
        order is never routed (ADR 0005 5.5): 409 with the blocker
        pickup_order. An order with unresolved lumber-index exposure is
        refused; a route the caller cannot see behind the branch wall is the
        same 404 as reading it; a missing order is a 400 naming order_id.
        stop_sequence defaults to the route's next position. The stop's
        coordinates are geocoded when a routing key is configured, before
        the transaction opens. A vehicle over its weight capacity answers
        201 with a capacity_warning beside the stop (a soft warning).
        Writes the audit row and the event delivery.created.
      parameters:
        - $ref: "#/components/parameters/XBranchId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeliveryCreate"
      responses:
        "201":
          description: The created stop, with its ETag and Location.
          headers:
            ETag:
              description: The record's revision in quotes, for example "3". Send it back as If-Match.
              schema:
                type: string
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryAssignResult"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "404":
          $ref: "#/components/responses/WireNotFound"
        "409":
          $ref: "#/components/responses/ConflictEither"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalErrorEither"
  /api/v1/delivery/deliveries/{id}:
    get:
      operationId: deliveryGet
      tags: [delivery]
      summary: Get a stop
      description: Behind the branch wall through the stop's order; a missing stop is a 404.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/XBranchId"
      responses:
        "200":
          description: The stop, with its revision's ETag.
          headers:
            ETag:
              description: The record's revision in quotes, for example "3". Send it back as If-Match.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Delivery"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "404":
          $ref: "#/components/responses/WireNotFound"
        "500":
          $ref: "#/components/responses/InternalErrorEither"
  /api/v1/delivery/deliveries/{id}/transitions:
    post:
      operationId: deliveryTransition
      tags: [delivery]
      summary: Complete a stop
      description: >-
        to delivered, failed or partial, from pending or out_for_delivery
        (a terminal stop is 409 invalid_state_transition). delivered and
        partial need pod_proof_url and pod_signed_by (a 400 naming them).
        Takes the revision precondition (428 without, 409 behind). A
        delivered stop queues its order's fulfilment request inside the same
        transaction (ADR 0005 5.5). Writes the audit row and the event
        delivery.delivered, delivery.failed or delivery.partial. The former
        PUT /status route is removed.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/XBranchId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeliveryStopTransition"
      responses:
        "200":
          description: The stop in its terminal status, with the new revision and its ETag.
          headers:
            ETag:
              description: The record's revision in quotes, for example "3". Send it back as If-Match.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Delivery"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "404":
          $ref: "#/components/responses/WireNotFound"
        "409":
          $ref: "#/components/responses/ConflictEither"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "428":
          $ref: "#/components/responses/WirePreconditionRequired"
        "500":
          $ref: "#/components/responses/InternalErrorEither"
  /api/v1/delivery/deliveries/{id}/adjust-qty:
    post:
      operationId: deliveryAdjustQty
      tags: [delivery]
      summary: Record a driver's on-site quantity adjustments
      description: >-
        One adjustment per line: product_id, the quantities as decimal
        strings (a JSON number is a 400 naming the indexed path), and a
        lowercase reason code (short_ship, damaged, refused, wrong_product,
        other). The rows land in delivery_qty_adjustments (the live failure
        wrote nothing, only a log line), the stop's revision moves, and the
        audit row and the event delivery.adjusted are written in the same
        transaction. Like the photo attaches it takes no precondition: it
        records evidence of a fact already lived.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/XBranchId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeliveryAdjustQty"
      responses:
        "200":
          description: The stop, with its moved revision and its ETag.
          headers:
            ETag:
              description: The record's revision in quotes, for example "3". Send it back as If-Match.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Delivery"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "404":
          $ref: "#/components/responses/WireNotFound"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalErrorEither"
  /api/v1/delivery/deliveries/{id}/pod-photo:
    post:
      operationId: deliveryPodPhoto
      tags: [delivery]
      summary: Attach a proof of delivery photo
      description: >-
        A jpg, jpeg, png or webp file of at most 10 MB, with an optional
        photo_type of signature, site (the default) or damage. The photo
        attach takes no precondition but moves the stop's revision and
        writes the audit row and the event delivery.updated (data part
        pod_photos) in one transaction.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/XBranchId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/DeliveryPodPhotoUpload"
      responses:
        "201":
          description: The stored photo record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryPodPhoto"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "404":
          $ref: "#/components/responses/WireNotFound"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalErrorEither"
  /api/v1/delivery/deliveries/{id}/pod-photos:
    get:
      operationId: deliveryPodPhotos
      tags: [delivery]
      summary: List the proof of delivery photos
      description: >-
        The cursor list envelope, oldest first on (uploaded_at, id). The
        stop is read behind the branch wall first; a missing stop is a 404.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Include"
        - $ref: "#/components/parameters/XBranchId"
      responses:
        "200":
          description: The page of photo records.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryPodPhotoPage"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "404":
          $ref: "#/components/responses/WireNotFound"
        "500":
          $ref: "#/components/responses/InternalErrorEither"
