          type: string
          format: uuid
        order_id:
          type: string
          format: uuid
        stop_sequence:
          type: integer
          description: Defaults to the route's next position.
        delivery_instructions:
          type:
            - string
            - "null"
    DeliveryAssignResult:
      type: object
      required: [delivery, capacity_warning]
      properties:
        delivery:
          $ref: "#/components/schemas/Delivery"
        capacity_warning:
          type:
            - object
            - "null"
          description: >-
            Soft warning only; the assignment still happens. Null when the
            vehicle holds no capacity or the load fits.
          required:
            - vehicle_capacity_lbs
            - current_load_lbs
            - order_weight_lbs
            - total_after_lbs
          properties:
            vehicle_capacity_lbs:
              type: number
            current_load_lbs:
              type: number
            order_weight_lbs:
              type: number
            total_after_lbs:
              type: number
    DeliveryStopTransition:
      type: object
      required: [to]
      properties:
        to:
          type: string
          enum: [delivered, failed, partial]
        revision:
          type: integer
          format: int64
          description: The body half of the revision precondition.
        pod_proof_url:
          type:
            - string
            - "null"
          description: Required when to is delivered or partial.
        pod_signed_by:
          type:
            - string
            - "null"
          description: Required when to is delivered or partial.
        signature_data_url:
          type:
            - string
            - "null"
    DeliveryAdjustQty:
      type: object
      required: [adjusted_by, adjustments]
      properties:
        adjusted_by:
          type: string
          format: uuid
        adjustments:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/DeliveryAdjustLine"
    DeliveryAdjustLine:
      type: object
      required: [product_id, original_qty, adjusted_qty, reason_code]
      properties:
        product_id:
          type: string
          format: uuid
        original_qty:
          type: string
          description: A decimal string, at most 4 fraction digits.
        adjusted_qty:
          type: string
          description: A decimal string, at most 4 fraction digits.
        reason_code:
          type: string
          enum: [short_ship, damaged, refused, wrong_product, other]
        notes:
          type:
            - string
            - "null"
    DeliveryQtyAdjustment:
      type: object
      description: One recorded adjustment row (the module's own read of what it wrote).
      required:
        - id
        - delivery_id
        - product_id
        - original_qty
        - adjusted_qty
        - reason_code
        - notes
        - adjusted_by
        - created_at
      properties:
        id:
          type: string
          format: uuid
        delivery_id:
          type: string
          format: uuid
        product_id:
          type: string
          format: uuid
        original_qty:
          type: string
        adjusted_qty:
          type: string
        reason_code:
          type: string
          enum: [short_ship, damaged, refused, wrong_product, other]
        notes:
          type:
            - string
            - "null"
        adjusted_by:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
    DeliveryPodPhoto:
      type: object
      required: [id, delivery_id, photo_url, photo_type, uploaded_at]
      properties:
        id:
          type: string
          format: uuid
        delivery_id:
          type: string
          format: uuid
        photo_url:
          type: string
        photo_type:
          type: string
          enum: [signature, site, damage]
        uploaded_at:
          type: string
          format: date-time
    DeliveryPodPhotoPage:
      type: object
      required: [items, next_cursor, limit]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/DeliveryPodPhoto"
        next_cursor:
          type:
            - string
            - "null"
        limit:
          type: integer
    DeliveryPodPhotoUpload:
      type: object
      required: [photo]
      properties:
        photo:
          type: string
          format: binary
          description: jpg, jpeg, png or webp, at most 10 MB.
        photo_type:
          type: string
          enum: [signature, site, damage]
          default: site
