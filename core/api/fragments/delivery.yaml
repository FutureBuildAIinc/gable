      operationId: deliveryDriverGet
      tags: [delivery]
      summary: Get one delivery driver
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/XBranchId"
      responses:
