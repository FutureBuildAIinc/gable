#
# The delivery module, transcribed from internal/delivery/handler.go and model.go
# as they behave today: lists are nil slices (null when empty), a missing delivery,
# vehicle update or route answers 500, and the photo routes take multipart forms.
paths:
  /api/v1/delivery/vehicles:
    get:
      operationId: deliveryVehicleList
      tags:
      - delivery
      summary: List vehicles
      parameters:
      - $ref: '#/components/parameters/XBranchId'
      responses:
        '200':
          description: All vehicles. The body is null when there are none.
          content:
            application/json:
              schema:
                type:
                - array
                - 'null'
                items:
                  $ref: '#/components/schemas/DeliveryVehicle'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: deliveryVehicleCreate
      tags:
      - delivery
      summary: Create a vehicle
      parameters:
      - $ref: '#/components/parameters/XBranchId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeliveryVehicleCreate'
      responses:
        '201':
          description: The created vehicle.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryVehicle'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/delivery/vehicles/{id}:
    get:
      operationId: deliveryVehicleGet
      tags:
      - delivery
      summary: Get a vehicle
      description: Any repository error, not only a missing row, answers 404.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/XBranchId'
      responses:
        '200':
          description: The vehicle.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryVehicle'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: deliveryVehicleUpdate
      tags:
      - delivery
      summary: Update a vehicle
      description: A missing vehicle answers 500, not 404.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/XBranchId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeliveryVehicleUpdate'
      responses:
        '200':
          description: The updated vehicle.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryVehicle'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: deliveryVehicleDelete
      tags:
      - delivery
      summary: Delete a vehicle
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/XBranchId'
      responses:
        '204':
          description: Vehicle deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/delivery/vehicles/{id}/photo:
    post:
      operationId: deliveryVehiclePhoto
      tags:
      - delivery
      summary: Upload a vehicle photo
      description: A missing form file, an unsupported extension (jpg, jpeg, png, webp) or a body over
        10 MB answers 400.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/XBranchId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DeliveryPhotoUpload'
      responses:
        '200':
          description: The stored photo URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryPhotoUrl'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/delivery/drivers:
    get:
      operationId: deliveryDriverList
      tags:
      - delivery
      summary: List drivers
      parameters:
      - $ref: '#/components/parameters/XBranchId'
      responses:
        '200':
          description: All drivers. The body is null when there are none.
          content:
            application/json:
              schema:
                type:
                - array
                - 'null'
                items:
                  $ref: '#/components/schemas/DeliveryDriver'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: deliveryDriverCreate
      tags:
      - delivery
      summary: Create a driver
      parameters:
      - $ref: '#/components/parameters/XBranchId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeliveryDriverCreate'
      responses:
        '201':
          description: The created driver, status ACTIVE.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryDriver'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/delivery/drivers/{id}:
    get:
      operationId: deliveryDriverGet
      tags:
      - delivery
      summary: Get a driver
      description: Any repository error, not only a missing row, answers 404.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/XBranchId'
      responses:
        '200':
          description: The driver.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryDriver'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: deliveryDriverUpdate
      tags:
      - delivery
      summary: Update a driver
      description: A missing driver answers 500, not 404.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/XBranchId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeliveryDriverUpdate'
      responses:
        '200':
          description: The updated driver.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryDriver'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: deliveryDriverDelete
      tags:
      - delivery
      summary: Delete a driver
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/XBranchId'
      responses:
        '204':
          description: Driver deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/delivery/drivers/{id}/photo:
    post:
      operationId: deliveryDriverPhoto
      tags:
      - delivery
      summary: Upload a driver photo
      description: A missing form file, an unsupported extension (jpg, jpeg, png, webp) or a body over
        10 MB answers 400.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/XBranchId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DeliveryPhotoUpload'
      responses:
        '200':
          description: The stored photo URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryPhotoUrl'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/delivery/routes:
    get:
      operationId: deliveryRouteList
      tags:
      - delivery
      summary: List routes
      parameters:
      - name: date
        in: query
        description: Filter to one scheduled date. An unparseable date answers 500.
        schema:
          type: string
          format: date
      - name: driver_id
        in: query
        description: Filter to one driver.
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/XBranchId'
      responses:
        '200':
          description: Routes. The body is null when there are none.
          content:
            application/json:
              schema:
                type:
                - array
                - 'null'
                items:
                  $ref: '#/components/schemas/DeliveryRoute'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: deliveryRouteCreate
      tags:
      - delivery
      summary: Create a route
      description: An unparseable scheduled_date answers 500.
      parameters:
      - $ref: '#/components/parameters/XBranchId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeliveryRouteCreate'
      responses:
        '201':
          description: The created route, status DRAFT.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryRoute'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/delivery/routes/{id}/dispatch:
    post:
      operationId: deliveryRouteDispatch
      tags:
      - delivery
      summary: Dispatch a route
      description: Only a DRAFT or SCHEDULED route can be dispatched, otherwise 500. The route becomes
        IN_TRANSIT.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/XBranchId'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Dispatched; the body is empty.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/delivery/routes/{id}/reorder:
    post:
      operationId: deliveryRouteReorder
      tags:
      - delivery
      summary: Reorder the stops of a route
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/XBranchId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeliveryRouteReorder'
      responses:
        '200':
          description: Reordered; the body is empty.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/delivery/routes/{id}/optimize:
    post:
      operationId: deliveryRouteOptimize
      tags:
      - delivery
      summary: Optimize the stop order of a route
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/XBranchId'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: 'The optimization result. A route with no deliveries or no geocoded stops answers
            an empty result: null order and legs and zero totals.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryRouteOptimizationResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/delivery/routes/{id}/complete:
    post:
      operationId: deliveryRouteComplete
      tags:
      - delivery
      summary: Complete a route
      description: 'Every failure answers 400: a route with no deliveries, a delivery not yet DELIVERED,
        FAILED or PARTIAL, or a repository fault.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/XBranchId'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The route is completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryStatusAck'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/delivery/routes/{id}/deliveries:
    get:
      operationId: deliveryRouteDeliveries
      tags:
      - delivery
      summary: List the deliveries of a route
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/XBranchId'
      responses:
        '200':
          description: Deliveries in stop order. The body is null when there are none.
          content:
            application/json:
              schema:
                type:
                - array
                - 'null'
                items:
                  $ref: '#/components/schemas/Delivery'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/delivery/deliveries:
    post:
      operationId: deliveryCreate
      tags:
      - delivery
      summary: Assign an order to a route
      description: A missing route, an order blocked by unresolved index exposure or any other failure
        answers 500.
      parameters:
      - $ref: '#/components/parameters/XBranchId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeliveryCreate'
      responses:
        '201':
          description: The created delivery, with a capacity warning when the vehicle would be over its
            weight capacity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryAssignResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/delivery/deliveries/{id}:
    get:
      operationId: deliveryGet
      tags:
      - delivery
      summary: Get a delivery
      description: A missing delivery answers 500, not 404.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/XBranchId'
      responses:
        '200':
          description: The delivery.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Delivery'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/delivery/deliveries/{id}/status:
    put:
      operationId: deliveryUpdateStatus
      tags:
      - delivery
      summary: Complete a delivery
      description: Only DELIVERED, FAILED and PARTIAL are accepted. DELIVERED and PARTIAL need pod_proof_url
        and pod_signed_by. Any other value or a missing proof answers 500.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/XBranchId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeliveryStatusUpdate'
      responses:
        '200':
          description: Updated; the body is empty.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/delivery/deliveries/{id}/adjust-qty:
    post:
      operationId: deliveryAdjustQty
      tags:
      - delivery
      summary: Adjust delivered quantities on site
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/XBranchId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeliveryAdjustQty'
      responses:
        '200':
          description: Adjusted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryAdjustAck'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/delivery/deliveries/{id}/pod-photo:
    post:
      operationId: deliveryPodPhoto
      tags:
      - delivery
      summary: Attach a proof of delivery photo
      description: A missing photo, an unsupported extension (jpg, jpeg, png, webp) or a body over 10
        MB answers 400.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/XBranchId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DeliveryPodPhotoUpload'
      responses:
        '201':
          description: The stored photo record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryPodPhoto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/delivery/deliveries/{id}/pod-photos:
    get:
      operationId: deliveryPodPhotos
      tags:
      - delivery
      summary: List the proof of delivery photos
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/XBranchId'
      responses:
        '200':
          description: Photo records; an empty array when none.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeliveryPodPhoto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  schemas:
    DeliveryVehicle:
      type: object
      description: Transcribed from delivery.Vehicle. The expiry and service dates are stored as dates
        and serialized as date-times.
      required:
      - id
      - name
      - vehicle_type
      - license_plate
      - capacity_weight_lbs
      - vin
      - year
      - make
      - model
      - insurance_expiry
      - next_service_date
      - odometer_miles
      - notes
      - photo_url
      - created_at
      - updated_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        vehicle_type:
          $ref: '#/components/schemas/DeliveryVehicleType'
        license_plate:
          type: string
        capacity_weight_lbs:
          type:
          - integer
          - 'null'
        vin:
          type:
          - string
          - 'null'
        year:
          type:
          - integer
          - 'null'
        make:
          type:
          - string
          - 'null'
        model:
          type:
          - string
          - 'null'
        insurance_expiry:
          type:
          - string
          - 'null'
          format: date-time
        next_service_date:
          type:
          - string
          - 'null'
          format: date-time
        odometer_miles:
          type:
          - integer
          - 'null'
        notes:
          type:
          - string
          - 'null'
        photo_url:
          type:
          - string
          - 'null'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    DeliveryVehicleType:
      type: string
      enum:
      - BOX_TRUCK
      - FLATBED
      - PICKUP
      - VAN
      - CRANE
    DeliveryVehicleCreate:
      type: object
      description: CreateVehicleRequest. Nothing is validated; an unparseable date is silently dropped.
      properties:
        name:
          type: string
        vehicle_type:
          $ref: '#/components/schemas/DeliveryVehicleType'
        license_plate:
          type: string
        capacity_weight_lbs:
          type:
          - integer
          - 'null'
        vin:
          type:
          - string
          - 'null'
        year:
          type:
          - integer
          - 'null'
        make:
          type:
          - string
          - 'null'
        model:
          type:
