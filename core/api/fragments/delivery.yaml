#
# The delivery module, transcribed from internal/delivery/handler.go and model.go
# as they behave today: float miles for odometer, nullability per golden records.
paths:
  /api/v1/delivery/drivers:
    get:
      operationId: deliveryDriverList
      tags: [delivery]
      summary: List delivery drivers
      parameters:
        - $ref: "#/components/parameters/XBranchId"
      responses:
        "200":
          description: Array of drivers.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DeliveryDriver"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: deliveryDriverCreate
      tags: [delivery]
      summary: Create a delivery driver
      parameters:
        - $ref: "#/components/parameters/XBranchId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeliveryDriverCreate"
      responses:
        "201":
          description: The created driver.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryDriver"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
