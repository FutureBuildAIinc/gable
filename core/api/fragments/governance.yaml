#
# The governance (RFC) app on the wire contract of ADR 0001 (item C5-1a):
# the cursor list envelope with a working status filter, the one error
# envelope, a lowercase status with the transitions route, RFC- document
# numbers, and a revision with its ETag behind If-Match. The routes sit
# behind the apps registry: when the governance app is disabled they answer
# 404 app_disabled.
paths:
  /api/v1/governance/rfcs:
    get:
      operationId: governanceListRFCs
      tags: [governance]
      summary: List RFCs
      description: >-
        The cursor list envelope, newest first, one summary per RFC (the
        body never rides the list). status filters on the lowercase
        vocabulary (a comma separated list); total appears only under
        include=total. A parameter the route does not declare, a status
        outside the vocabulary (uppercase included), a malformed cursor or
        an out of range limit is a 400.
      parameters:
        - name: status
          in: query
          required: false
          description: Comma separated lowercase statuses (draft, review, approved, rejected).
          schema:
            type: string
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Include"
      responses:
        "200":
          description: The page of RFC summaries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RFCPage"
        "400": { $ref: "#/components/responses/WireBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/WireInternalError" }
    post:
      operationId: governanceCreateRFC
      tags: [governance]
      summary: Draft an RFC
      description: >-
        Creates an RFC in draft. The content is generated from the triple by
        the provider (a template today), never sent by the client; a request
        carrying content, status or revision is a 400 naming the field. The
        number is minted from the sequence (RFC-000001), the create, its
        audit row and rfc.created are one transaction, and the answer carries
        the revision and its ETag.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GovernanceCreateRFCRequest"
      responses:
        "201":
          description: The drafted RFC.
          headers:
            Location:
              description: The new RFC's own URL.
              schema:
                type: string
            ETag:
              description: The revision (1) in quotes.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RFC"
        "400": { $ref: "#/components/responses/WireBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/WireConflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "500": { $ref: "#/components/responses/WireInternalError" }
        "503": { $ref: "#/components/responses/WireUnavailable" }
  /api/v1/governance/rfcs/{id}:
    get:
      operationId: governanceGetRFC
      tags: [governance]
      summary: Read one RFC
      description: The full document with its revision and ETag.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The RFC.
          headers:
            ETag:
              description: The revision in quotes.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RFC"
        "400": { $ref: "#/components/responses/WireBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/WireNotFound" }
        "500": { $ref: "#/components/responses/WireInternalError" }
    put:
      operationId: governanceUpdateRFC
      tags: [governance]
      summary: Update an RFC
      description: >-
        Every editable field is optional: nil leaves it alone. status moves
        through the transitions route (a request carrying it is a 400 naming
        it and pointing there); author_id is set once at create. Takes
        If-Match or the body revision (428 without, 409 stale) and answers
        the document with its new revision and ETag. An RFC under review may
        still be edited; an approved or rejected one refuses the edit with a
        409 blocker until it is reopened.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: If-Match
          in: header
          required: false
          description: The revision this write preconditions on, quoted ("3"); the weak form is accepted.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GovernanceUpdateRFCRequest"
      responses:
        "200":
          description: The RFC after the update.
          headers:
            ETag:
              description: The new revision in quotes.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RFC"
        "400": { $ref: "#/components/responses/WireBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/WireNotFound" }
        "409": { $ref: "#/components/responses/WireConflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "428": { $ref: "#/components/responses/WirePreconditionRequired" }
        "500": { $ref: "#/components/responses/WireInternalError" }
  /api/v1/governance/rfcs/{id}/transitions:
    post:
      operationId: governanceTransitionRFC
      tags: [governance]
      summary: Move an RFC along its lifecycle
      description: >-
        The allowed edges are draft to review, review to approved, review to
        rejected and rejected back to draft (a reopen); approved is terminal.
        A forbidden edge is a 409 invalid_state_transition. Takes If-Match or
        the body revision like every write, and writes the transition's
        event (rfc.review, rfc.approved, rfc.rejected, rfc.reopened).
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: If-Match
          in: header
          required: false
          description: The revision this write preconditions on, quoted.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GovernanceTransitionRequest"
      responses:
        "200":
          description: The RFC after the transition.
          headers:
            ETag:
              description: The new revision in quotes.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RFC"
        "400": { $ref: "#/components/responses/WireBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/WireNotFound" }
        "409": { $ref: "#/components/responses/WireConflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "428": { $ref: "#/components/responses/WirePreconditionRequired" }
        "500": { $ref: "#/components/responses/WireInternalError" }
components:
  schemas:
    RFCSummary:
      type: object
      required: [id, number, title, status, author_id, revision, created_at, updated_at]
      description: Go type governance.RFCSummary, the list item; the full document embeds it.
      properties:
        id:
          type: string
          format: uuid
        number:
          type: string
          description: The human readable document number (RFC-000001), minted from the sequence.
        title:
          type: string
        status:
          type: string
          enum: [draft, review, approved, rejected]
        author_id:
          type: [string, "null"]
          format: uuid
        revision:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    RFC:
      type: object
      required: [id, number, title, status, author_id, revision, created_at, updated_at, problem_statement, proposed_solution, content]
      description: >-
        Go type governance.RFC, the summary fields spelled out with the body
        behind them. content is generated by the provider at create and null
        only on rows the legacy seed wrote without one.
      properties:
        id:
          type: string
          format: uuid
        number:
          type: string
          description: The human readable document number (RFC-000001), minted from the sequence.
        title:
          type: string
        status:
          type: string
          enum: [draft, review, approved, rejected]
        author_id:
          type: [string, "null"]
          format: uuid
        revision:
          type: integer
          format: int64
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        problem_statement:
          type: string
        proposed_solution:
          type: string
        content:
          type: [string, "null"]
    RFCPage:
      type: object
      required: [items, next_cursor, limit]
      description: The list envelope of ADR 0001 section 1. items is never null; total is present only under include=total.
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RFCSummary"
        next_cursor:
          type: [string, "null"]
        limit:
          type: integer
        total:
          type: integer
    GovernanceCreateRFCRequest:
      type: object
      required: [title, problem_statement, proposed_solution]
      description: Go type governance.CreateRFCInput. content, status and revision are refused on a create.
      properties:
        title:
          type: string
        problem_statement:
          type: string
        proposed_solution:
          type: string
        author_id:
          type: [string, "null"]
          format: uuid
    GovernanceUpdateRFCRequest:
      type: object
      description: >-
        Go type governance.UpdateRFCInput. Every editable field is a pointer:
        nil leaves it alone.
      properties:
        title:
          type: [string, "null"]
        problem_statement:
          type: [string, "null"]
        proposed_solution:
          type: [string, "null"]
        content:
          type: [string, "null"]
        revision:
          type: integer
    GovernanceTransitionRequest:
      type: object
      required: [to]
      description: Go type governance.TransitionRequest.
      properties:
        to:
          type: string
          enum: [draft, review, approved, rejected]
        revision:
          type: integer
