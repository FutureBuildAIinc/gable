#
# The quote module on the wire contract of ADR 0001 (item R1-15), the template
# every later module copies: the cursor list envelope with a working status
# filter, the one error envelope, a lowercase status with the transitions
# route, integer _cents money, the scaled unit price, quantities as decimal
# strings with their unit, a document number and a revision with its ETag.
# The exposure routes at the bottom are the pricing module's and still speak
# its pending, unconverted shapes.
paths:
  /api/v1/quotes:
    get:
      operationId: quoteList
      tags: [quote]
      summary: List quotes
      description: >-
        The cursor list envelope, newest first. status filters on the
        lowercase lifecycle vocabulary (a comma separated list), customer_id
        filters on the customer. total appears only under include=total. A
        parameter the route does not declare, a status outside the vocabulary,
        a malformed cursor or an out of range limit is a 400.
      parameters:
        - name: status
          in: query
          required: false
          description: Comma separated lowercase statuses (draft, sent, accepted, rejected, expired).
          schema:
            type: string
        - name: customer_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Include"
        - $ref: "#/components/parameters/XBranchId"
      responses:
        "200":
          description: The page of quotes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuotePage"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "500":
          $ref: "#/components/responses/InternalErrorEither"
    post:
      operationId: quoteCreate
      tags: [quote]
      summary: Create a quote
      description: >-
        Creates a draft quote, priced by the platform rule: each line's
        extension is rounded once to cents. A line carries its unit of
        measure, or names a product whose own unit it takes (a line with
        neither is a 400 naming lines[i].uom); every field
        problem is collected into one 400. Mints the document number and writes
        quote.created in the same transaction.
      parameters:
        - $ref: "#/components/parameters/XBranchId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuoteRequest"
      responses:
        "201":
          description: The created quote, with its ETag and a Location header.
          headers:
            ETag:
              description: The quote's revision in quotes, for example "3". Send it back as If-Match.
              schema:
                type: string
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "409":
          $ref: "#/components/responses/WireConflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalErrorEither"
  /api/v1/quotes/analytics:
    get:
      operationId: quoteAnalytics
      tags: [quote]
      summary: Quote analytics aggregates
      parameters:
        - $ref: "#/components/parameters/XBranchId"
      responses:
        "200":
          description: Aggregated quote analytics; money in cents.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteAnalytics"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "500":
          $ref: "#/components/responses/InternalErrorEither"
  /api/v1/quotes/{id}:
    get:
      operationId: quoteGet
      tags: [quote]
      summary: Get one quote with lines
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/XBranchId"
      responses:
        "200":
          description: The quote, with its revision as the ETag.
          headers:
            ETag:
              description: The quote's revision in quotes, for example "3". Send it back as If-Match.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "404":
          $ref: "#/components/responses/WireNotFound"
        "500":
          $ref: "#/components/responses/InternalErrorEither"
    put:
      operationId: quoteUpdate
      tags: [quote]
      summary: Replace a draft quote
      description: >-
        Full replace of a draft quote's header and lines, on the client's
        revision (If-Match or the body's revision; neither is 428, a stale one
        is 409 stale_revision). Only a draft is editable; any other status is a
        409 conflict. A line whose id survives keeps its customer note. The
        lifecycle never moves here: use the transitions route. A PUT applies
        the header fields and the lines only: branch_id, source,
        margin_total_cents, original_file, original_filename,
        original_content_type and parse_map are fixed at create, and sending
        one is a 400 naming it.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/XBranchId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuoteRequest"
      responses:
        "200":
          description: The updated quote at its new revision.
          headers:
            ETag:
              description: The quote's revision in quotes, for example "3". Send it back as If-Match.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "404":
          $ref: "#/components/responses/WireNotFound"
        "409":
          $ref: "#/components/responses/WireConflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "428":
          $ref: "#/components/responses/WirePreconditionRequired"
        "500":
          $ref: "#/components/responses/InternalErrorEither"
  /api/v1/quotes/{id}/transitions:
    post:
      operationId: quoteTransition
      tags: [quote]
      summary: Move a quote along its lifecycle
      description: >-
        One write on the client's revision. The target is a lowercase status;
        a transition the lifecycle does not allow is 409
        invalid_state_transition (accepted is terminal; rejected and expired
        can reopen to draft). Writes the transition's event
        (quote.sent, quote.accepted, quote.rejected, quote.expired or
        quote.reopened) in the same transaction.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/XBranchId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuoteTransitionRequest"
      responses:
        "200":
          description: The quote at its new status and revision.
          headers:
            ETag:
              description: The quote's revision in quotes, for example "3". Send it back as If-Match.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "404":
          $ref: "#/components/responses/WireNotFound"
        "409":
          $ref: "#/components/responses/WireConflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "428":
          $ref: "#/components/responses/WirePreconditionRequired"
        "500":
          $ref: "#/components/responses/InternalErrorEither"
  /api/v1/quotes/{id}/convert:
    post:
      operationId: quoteConvertToOrderPayload
      tags: [quote]
      summary: Accept the quote and return the order creation payload
      description: >-
        A transition to accepted on the client's revision, then the body the
        client maps onto POST /api/v1/orders itself; no order is created here.
        The orders route is not converted yet and reads a numeric quantity
        and price_each in cents, so the client maps quantity and
        price_each_cents onto it. Until the orders contract carries the
        conversion pair (cycle 2), a quote with a line whose pair is not 1 to
        1, or whose price_uom differs from uom, is refused with 409
        invalid_state_transition and a line_not_convertible blocker naming
        lines[i]; the quote is left as it was.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/XBranchId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: The order creation payload, with the accepted quote's revision as the ETag.
          headers:
            ETag:
              description: The accepted quote's revision in quotes, for example "3".
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteOrderPayload"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "404":
          $ref: "#/components/responses/WireNotFound"
        "409":
          $ref: "#/components/responses/WireConflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "428":
          $ref: "#/components/responses/WirePreconditionRequired"
        "500":
          $ref: "#/components/responses/InternalErrorEither"
  /api/v1/quotes/exposure:
    get:
      operationId: exposureList
      tags:
      - quote
      summary: List at-risk quotes
      description: 403 when owner=me and the caller has no salesperson id and is not owner or admin, when
        owner=all and the caller is not owner or admin, or when a sales role names another salesperson.
        An unparseable owner, customer_id or min_dollars answers 400.
      parameters:
      - name: owner
        in: query
        description: me (the default) scopes to the caller's book, all needs the owner or admin role,
          or a salesperson UUID (a sales role may only name itself).
        schema:
          type: string
      - name: state
        in: query
        description: Comma separated exposure states.
        schema:
          type: string
      - name: limit
        in: query
        description: Page size, 50 when absent or non positive.
        schema:
          type: integer
      - name: offset
        in: query
        schema:
          type: integer
      - name: index_code
        in: query
        schema:
          type: string
      - name: customer_id
        in: query
        schema:
          type: string
          format: uuid
      - name: min_dollars
        in: query
        description: A non negative dollar floor.
        schema:
          type: number
      - name: summary
        in: query
        description: Only the literal true selects the summary body.
        schema:
          type: boolean
      - $ref: '#/components/parameters/XBranchId'
      responses:
        '200':
          description: The rows, or the summary when summary=true.
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ExposureList'
                - $ref: '#/components/schemas/ExposureSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenEither'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/quotes/{id}/exposure:
    get:
      operationId: exposureGet
      tags:
      - quote
      summary: Get exposure status for one quote
      description: A missing quote answers 500, not 404.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/XBranchId'
      responses:
        '200':
          description: The exposure status with the quote's event ledger.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteExposureDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenEither'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/quotes/{id}/exposure/request-ack:
    post:
      operationId: exposureRequestAck
      tags:
      - quote
      summary: Request customer acknowledgment of exposure
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/XBranchId'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Acknowledgment requested.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExposureRequestAckResponse'
        '400':
          $ref: '#/components/responses/BadRequestEither'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenEither'
        '409':
          $ref: '#/components/responses/ConflictEither'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/quotes/{id}/exposure/acknowledge:
    post:
      operationId: exposureAcknowledge
      tags:
      - quote
      summary: Acknowledge exposure on behalf of the customer
      description: Notes under ten characters or an unknown method answer 400; a quote whose exposure
        is already cleared answers 409.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/XBranchId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcknowledgmentRequest'
      responses:
        '200':
          description: Acknowledgment recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExposureAcknowledgeResponse'
        '400':
          $ref: '#/components/responses/BadRequestEither'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenEither'
        '409':
          $ref: '#/components/responses/ConflictEither'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/quotes/{id}/exposure/override:
    post:
      operationId: exposureOverride
      tags:
      - quote
      summary: Override exposure (owner or admin only)
      description: A caller without the owner or admin role answers 403. Notes under ten characters answer
        400; a quote whose exposure is already cleared answers 409.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/XBranchId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OverrideRequest'
      responses:
        '200':
          description: Override recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExposureOverrideResponse'
        '400':
          $ref: '#/components/responses/BadRequestEither'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenEither'
        '409':
          $ref: '#/components/responses/ConflictEither'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/quotes/{id}/exposure/escalate-now:
    post:
      operationId: exposureEscalateNow
      tags:
      - quote
      summary: Preview re-quoting at market prices
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/XBranchId'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: 'The dry run: suggested per line prices. Nothing is persisted.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EscalateNowResult'
        '400':
          $ref: '#/components/responses/BadRequestEither'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenEither'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/quotes/{id}/file:
    get:
      operationId: quoteDownloadOriginalFile
      tags: [quote]
      summary: Download the original uploaded file
      description: >-
        Streams the stored original upload of an AI sourced quote. The stored
        content type is echoed; the filename in Content-Disposition is
        sanitized. A quote with no stored file, or no such quote, is a 404.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/XBranchId"
      responses:
        "200":
          description: The file bytes; the stored content type is echoed.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "404":
          $ref: "#/components/responses/WireNotFound"
        "500":
          $ref: "#/components/responses/InternalErrorEither"
components:
  schemas:
    QuoteStatus:
      type: string
      enum: [draft, sent, accepted, rejected, expired]
      description: The lifecycle, lowercase on the wire (ADR 0001 section 6). The database keeps its uppercase enum.
    QuoteDeliveryType:
      type: string
      enum: [pickup, delivery]
    QuoteExposureStatus:
      type: string
      enum: [ok, flagged, escalated, ack_required, acknowledged, blocked, overridden]
      description: The price protection rollup, lowercase on the quote wire; the exposure routes below still speak their own uppercase vocabulary until the pricing module converts.
    QuoteSummary:
      type: object
      description: A quote header, used as a list item and as the head of the full document.
      required: [id, number, branch_id, customer_id, customer_name, job_id, status, revision, total_cents, freight_cents, margin_total_cents, delivery_type, vehicle_id, vehicle_name, source, expires_at, sent_at, accepted_at, rejected_at, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        number:
          type: string
          description: The human readable document number, Q- and at least six digits, from a database sequence.
          pattern: "^Q-[0-9]{6,}$"
        branch_id:
          type: string
          format: uuid
        customer_id:
          type: string
          format: uuid
        customer_name:
          type: string
        job_id:
          type: [string, "null"]
          format: uuid
        status:
          $ref: "#/components/schemas/QuoteStatus"
        revision:
          type: integer
          format: int64
          minimum: 1
          description: Starts at 1 and moves on every write; the client sends it back as If-Match or in the body.
        total_cents:
          type: integer
          format: int64
        freight_cents:
          type: integer
          format: int64
        margin_total_cents:
          type: integer
          format: int64
        delivery_type:
          $ref: "#/components/schemas/QuoteDeliveryType"
        vehicle_id:
          type: [string, "null"]
          format: uuid
        vehicle_name:
          type: [string, "null"]
        source:
          type: string
          description: How the quote came to be; portal is a quote the dealer portal customer requested.
          enum: [manual, ai, portal]
        expires_at:
          type: [string, "null"]
          format: date-time
        sent_at:
          type: [string, "null"]
          format: date-time
        accepted_at:
          type: [string, "null"]
          format: date-time
        rejected_at:
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Quote:
      type: object
      required: [id, number, branch_id, customer_id, customer_name, job_id, status, revision, total_cents, freight_cents, margin_total_cents, delivery_type, vehicle_id, vehicle_name, source, expires_at, sent_at, accepted_at, rejected_at, created_at, updated_at, original_filename, original_content_type, parse_map, exposure_state, exposure_cents, exposure_last_checked_at, lines]
      properties:
        id:
          type: string
          format: uuid
        number:
          type: string
          description: The human readable document number, Q- and at least six digits, from a database sequence.
          pattern: "^Q-[0-9]{6,}$"
        branch_id:
          type: string
          format: uuid
        customer_id:
          type: string
          format: uuid
        customer_name:
          type: string
        job_id:
          type: [string, "null"]
          format: uuid
        status:
          $ref: "#/components/schemas/QuoteStatus"
        revision:
          type: integer
          format: int64
          minimum: 1
          description: Starts at 1 and moves on every write; the client sends it back as If-Match or in the body.
        total_cents:
          type: integer
          format: int64
        freight_cents:
          type: integer
          format: int64
        margin_total_cents:
          type: integer
          format: int64
        delivery_type:
          $ref: "#/components/schemas/QuoteDeliveryType"
        vehicle_id:
          type: [string, "null"]
          format: uuid
        vehicle_name:
          type: [string, "null"]
        source:
          type: string
          description: How the quote came to be; portal is a quote the dealer portal customer requested.
          enum: [manual, ai, portal]
        expires_at:
          type: [string, "null"]
          format: date-time
        sent_at:
          type: [string, "null"]
          format: date-time
        accepted_at:
          type: [string, "null"]
          format: date-time
        rejected_at:
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        original_filename:
          type: [string, "null"]
        original_content_type:
          type: [string, "null"]
        parse_map:
          type: [array, "null"]
          items:
            type: object
        exposure_state:
          $ref: "#/components/schemas/QuoteExposureStatus"
        exposure_cents:
          type: integer
          format: int64
        exposure_last_checked_at:
          type: [string, "null"]
          format: date-time
        lines:
          type: array
          items:
            $ref: "#/components/schemas/QuoteLine"
    QuoteLine:
      type: object
      description: >-
        One priced line. Every priced line carries the same fields: the
        quantity as a decimal string with its unit, the scaled unit price with
        its price unit, the conversion pair, and the extension in cents
        (quantity x unit price x price_uom_qty / uom_qty, rounded once, half
        away from zero).
      required: [id, quote_id, product_id, sku, description, customer_note, quantity, uom, price_uom, uom_qty, price_uom_qty, unit_price_ten_thousandths, line_total_cents, unit_cost_ten_thousandths, created_at]
      properties:
        id:
          type: string
          format: uuid
        quote_id:
          type: string
          format: uuid
        product_id:
          type: [string, "null"]
          format: uuid
          description: Null for a special order line the dealer does not stock.
        sku:
          type: string
        description:
          type: string
        customer_note:
          type: [string, "null"]
          description: What a portal user wrote when asking for the line to be priced; an edit that keeps the line id keeps it.
        quantity:
          $ref: "#/components/schemas/Quantity"
        uom:
          $ref: "#/components/schemas/QuoteUom"
        price_uom:
          type: string
          description: The unit the price is quoted in; equal to uom when the units agree. Not limited to the sale enum (per M, per CWT).
        uom_qty:
          $ref: "#/components/schemas/Quantity"
        price_uom_qty:
          $ref: "#/components/schemas/Quantity"
        unit_price_ten_thousandths:
          type: integer
          format: int64
          description: The unit price per price_uom, times 10,000 (13725 is 1.3725).
        line_total_cents:
          type: integer
          format: int64
        unit_cost_ten_thousandths:
          type: integer
          format: int64
          description: The product's average cost times 10,000; read only.
        created_at:
          type: string
          format: date-time
    Quantity:
      type: string
      pattern: "^-?(0|[1-9][0-9]*)(\\.[0-9]{1,4})?$"
      description: A plain decimal string with at most four fraction digits, never a JSON number.
    QuoteUom:
      type: string
      enum: [PCS, EA, LF, SF, BF, MBF, SQ, BOX, CTN, RL, GAL, LBS, BAG, BUNDLE, PAIR, SET]
      description: Units of measure keep their standard uppercase codes.
    QuoteRequest:
      type: object
      required: [customer_id, lines]
      description: >-
        The body of POST /quotes and PUT /quotes/{id}. A field the schema does
        not name is a 400. revision is the PUT precondition beside If-Match; a
        create has no revision and refuses one with a 400. A PUT refuses the
        create-only fields (branch_id, source, margin_total_cents,
        original_file, original_filename, original_content_type, parse_map).
      properties:
        branch_id:
          type: string
          format: uuid
        customer_id:
          type: string
          format: uuid
        job_id:
          type: [string, "null"]
          format: uuid
        expires_at:
          type: [string, "null"]
          format: date-time
        delivery_type:
          $ref: "#/components/schemas/QuoteDeliveryType"
        freight_cents:
          type: integer
          format: int64
          minimum: 0
          description: Cleared for a pickup.
        vehicle_id:
          type: [string, "null"]
          format: uuid
        source:
          type: string
          enum: [manual, ai]
        margin_total_cents:
          type: integer
          format: int64
        original_file:
          type: string
          description: Base64 of the original upload, up to 5 MB.
        original_filename:
          type: string
        original_content_type:
          type: string
        parse_map:
          type: [array, "null"]
          items:
            type: object
        revision:
          type: integer
          format: int64
          minimum: 1
        lines:
          type: array
          items:
            $ref: "#/components/schemas/QuoteLineRequest"
    QuoteLineRequest:
      type: object
      required: [quantity, unit_price_ten_thousandths]
      description: >-
        uom defaults from the product's own unit when the line names a
        product; a line with neither uom nor product_id is a 400 naming
        lines[i].uom. sku and description default from product_id and are
        required without one. price_uom defaults to uom; when it differs,
        uom_qty and price_uom_qty (both) are required.
      properties:
        id:
          type: string
          format: uuid
        product_id:
          type: string
          format: uuid
        sku:
          type: string
        description:
          type: string
        customer_note:
          type: string
        quantity:
          $ref: "#/components/schemas/Quantity"
        uom:
          $ref: "#/components/schemas/QuoteUom"
        price_uom:
          type: string
          pattern: "^[A-Z]{1,6}$"
          description: A unit code of one to six capital letters; defaults to uom.
        uom_qty:
          $ref: "#/components/schemas/Quantity"
        price_uom_qty:
          $ref: "#/components/schemas/Quantity"
        unit_price_ten_thousandths:
          type: integer
          format: int64
          minimum: 0
    QuoteTransitionRequest:
      type: object
      required: [to]
      properties:
        to:
          $ref: "#/components/schemas/QuoteStatus"
        revision:
          type: integer
          format: int64
          minimum: 1
    QuoteOrderPayload:
      type: object
      required: [customer_id, quote_id, revision, lines]
      description: What the client maps onto POST /api/v1/orders, which is not converted yet and reads a numeric quantity and price_each in cents.
      properties:
        customer_id:
          type: string
          format: uuid
        quote_id:
          type: string
          format: uuid
        revision:
          type: integer
          format: int64
          minimum: 1
          description: The accepted quote's revision.
        lines:
          type: array
          items:
            $ref: "#/components/schemas/QuoteOrderPayloadLine"
    QuoteOrderPayloadLine:
      type: object
      required: [product_id, quantity, uom, price_each_cents]
      properties:
        product_id:
          type: [string, "null"]
          format: uuid
        quantity:
          $ref: "#/components/schemas/Quantity"
        uom:
          $ref: "#/components/schemas/QuoteUom"
        price_each_cents:
          type: integer
          format: int64
          description: The price per sale unit in cents (the unit price through the line's conversion pair).
    QuotePage:
      type: object
      required: [items, next_cursor, limit]
      description: The list envelope of ADR 0001 section 1. items is never null; total is present only under include=total.
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/QuoteSummary"
        next_cursor:
          type: [string, "null"]
          description: Opaque; pass it back verbatim as cursor. Null on the last page.
        limit:
          type: integer
        total:
          type: integer
          format: int64
    QuoteAnalytics:
      type: object
      required: [total_quotes, draft_count, sent_count, accepted_count, rejected_count, expired_count, conversion_rate, avg_margin_accepted_cents, avg_margin_rejected_cents, avg_days_to_close, total_quote_value_cents, total_accepted_value_cents, ai_sourced_count, ai_conversion_rate, manual_conversion_rate, trend_data]
      properties:
        total_quotes:
          type: integer
        draft_count:
          type: integer
        sent_count:
          type: integer
        accepted_count:
          type: integer
        rejected_count:
          type: integer
        expired_count:
          type: integer
        conversion_rate:
          type: number
          description: A percentage.
        avg_margin_accepted_cents:
          type: integer
          format: int64
        avg_margin_rejected_cents:
          type: integer
          format: int64
        avg_days_to_close:
          type: number
        total_quote_value_cents:
          type: integer
          format: int64
        total_accepted_value_cents:
          type: integer
          format: int64
        ai_sourced_count:
          type: integer
        ai_conversion_rate:
          type: number
        manual_conversion_rate:
          type: number
        trend_data:
          type: array
          items:
            $ref: "#/components/schemas/QuoteAnalyticsTrend"
    QuoteAnalyticsTrend:
      type: object
      required: [date, created, accepted, rejected, total_value_cents, accepted_value_cents]
      properties:
        date:
          type: string
        created:
          type: integer
        accepted:
          type: integer
        rejected:
          type: integer
        total_value_cents:
          type: integer
          format: int64
        accepted_value_cents:
          type: integer
          format: int64
    ExposureState:
      type: string
      enum:
      - OK
      - FLAGGED
      - ESCALATED
      - ACK_REQUIRED
      - ACKNOWLEDGED
      - BLOCKED
      - OVERRIDDEN
    QuoteExposureEvent:
      type: object
      description: pricing.QuoteExposureEvent. Everything but the five required fields is omitted when
        empty.
      required:
      - id
      - quote_id
      - event_type
      - idempotency_key
      - created_at
      properties:
        id:
          type: string
          format: uuid
        quote_id:
          type: string
          format: uuid
        quote_line_id:
          type: string
          format: uuid
        market_index_id:
          type: string
          format: uuid
        market_index_history_id:
          type: string
          format: uuid
        event_type:
          type: string
          enum:
          - DETECTED
          - FLAGGED
          - ESCALATED
          - ACK_REQUIRED
          - ACK_REQUESTED
          - ACKNOWLEDGED
          - CLEARED
          - BLOCKED
          - OVERRIDDEN
        base_index_value:
          type: number
        current_index_value:
          type: number
        delta_pct:
          type: number
        exposure_dollars:
          type: number
        threshold_pct:
          type: number
        policy:
          type: string
        actor_user_id:
          type: string
        actor_role:
          type: string
        method:
          type: string
        notes:
          type: string
        idempotency_key:
          type: string
        created_at:
          type: string
          format: date-time
    ExposureRow:
      type: object
      description: pricing.ExposureRow. The salesperson fields are omitted when empty.
      required:
      - quote_id
      - short_id
      - customer_id
      - customer_name
      - days_open
      - indexes
      - max_delta_pct
      - exposure_dollars
      - policy
      - exposure_state
      - available_actions
      properties:
        quote_id:
          type: string
          format: uuid
        short_id:
          type: string
        customer_id:
          type: string
          format: uuid
        customer_name:
          type: string
        salesperson_id:
          type: string
          format: uuid
        salesperson_name:
          type: string
        days_open:
          type: integer
        indexes:
          type:
          - array
          - 'null'
          items:
            type: string
        max_delta_pct:
          type: number
        exposure_dollars:
          type: number
          description: Float dollars.
        policy:
          type: string
        exposure_state:
          type: string
        available_actions:
          type: array
          items:
            type: string
    ExposureList:
      type: object
      required:
      - items
      - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ExposureRow'
        total:
          type: integer
    ExposureSummary:
      type: object
      required:
      - count
      - total_dollars
      properties:
        count:
          type: integer
        total_dollars:
          type: number
          description: Float dollars rounded to cents.
    QuoteExposureDetail:
      type: object
      description: 'A hand built map, not pricing.ExposureStatus: the state is named exposure_state here
        and the events ride along.'
      required:
      - quote_id
      - exposure_state
      - exposure_dollars
      - last_checked_at
      - indexes
      - required_action
      - events
      properties:
        quote_id:
          type: string
          format: uuid
        exposure_state:
          $ref: '#/components/schemas/ExposureState'
        exposure_dollars:
          type: number
          description: Float dollars.
        last_checked_at:
          type:
          - string
          - 'null'
          format: date-time
        indexes:
          type:
          - array
          - 'null'
          items:
            type: string
        required_action:
          type: string
        events:
          type: array
          items:
            $ref: '#/components/schemas/QuoteExposureEvent'
    AcknowledgmentRequest:
      type: object
      required:
      - method
      - notes
      properties:
        method:
          type: string
          enum:
          - VERBAL
          - EMAIL
          - PORTAL
        customer_contact:
          type: string
        notes:
          type: string
          minLength: 10
          description: At least ten characters after trimming.
    OverrideRequest:
      type: object
      required:
      - notes
      properties:
        notes:
          type: string
          minLength: 10
          description: At least ten characters after trimming.
    ExposureRequestAckResponse:
      type: object
      required:
      - event_id
      - salesperson_notified
      properties:
        event_id:
          type: string
          format: uuid
        salesperson_notified:
          type: boolean
    ExposureAcknowledgeResponse:
      type: object
      required:
      - event_id
      - quote_id
      - new_exposure_state
      properties:
        event_id:
          type: string
          format: uuid
        quote_id:
          type: string
          format: uuid
        new_exposure_state:
          type: string
          enum:
          - ACKNOWLEDGED
    ExposureOverrideResponse:
      type: object
      required:
      - event_id
      - new_exposure_state
      properties:
        event_id:
          type: string
          format: uuid
        new_exposure_state:
          type: string
          enum:
          - OVERRIDDEN
    EscalateNowLine:
      type: object
      required:
      - quote_line_id
      - current_unit_price
      - suggested_unit_price
      - delta_pct
      properties:
        quote_line_id:
          type: string
          format: uuid
        current_unit_price:
          type: number
          description: Float dollars.
        suggested_unit_price:
          type: number
          description: Float dollars.
        delta_pct:
          type: number
    EscalateNowResult:
      type: object
      description: pricing.EscalateNowResult. lines is null when the quote is missing or has no lines.
      required:
      - quote_id
      - lines
      - estimated_new_total
      properties:
        quote_id:
          type: string
          format: uuid
        lines:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/EscalateNowLine'
        estimated_new_total:
          type: number
          description: Float dollars.
