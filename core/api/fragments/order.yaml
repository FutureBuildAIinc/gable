#
# The order module, transcribed from internal/order/handler.go and model.go
# as they behave today: cents money, an UPPERCASE status vocabulary, bare
# 204s on the lifecycle actions, the exposure gate's own raw 409 payload,
# and service level validation surfacing as 500.
paths:
  /api/v1/orders:
    get:
      operationId: orderList
      tags: [order]
      summary: List orders
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/XBranchId"
      responses:
        "200":
          description: The page of orders.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: orderCreate
      tags: [order]
      summary: Create an order
      description: >-
        Money is cents on this route. A missing customer_id or an unknown
        product surfaces as a 500 today, not a 400.
      parameters:
        - $ref: "#/components/parameters/XBranchId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderCreateRequest"
      responses:
        "201":
          description: The created order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/orders/{id}:
    get:
      operationId: orderGet
      tags: [order]
      summary: Get one order with lines
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/XBranchId"
      responses:
        "200":
          description: The order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/orders/{id}/confirm:
    post:
      operationId: orderConfirm
      tags: [order]
      summary: Confirm a draft order
      description: >-
        Bare 204 on success; side effects (stock depletion for stocked lines)
        are not represented. A blocked exposure gate is the raw exposure 409
        payload.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/XBranchId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204":
          description: Confirmed.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: The lumber index exposure gate blocks this order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExposureBlock"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/orders/{id}/fulfill:
    post:
      operationId: orderFulfill
      tags: [order]
      summary: Fulfill a confirmed order
      description: >-
        Bare 204 on success. Fulfilling creates an invoice, posts GL and AR
        and depletes stock; none of that is represented in the response.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/XBranchId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204":
          description: Fulfilled.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: The lumber index exposure gate blocks this order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExposureBlock"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/orders/{id}/cancel:
    post:
      operationId: orderCancel
      tags: [order]
      summary: Cancel an order
      description: >-
        A refusal from the state machine (already cancelled, not
        cancellable) is a 409. The reason is optional; an empty body is
        accepted.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/XBranchId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderCancelRequest"
      responses:
        "204":
          description: Cancelled.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/orders/{id}/exposure-gate:
    get:
      operationId: orderExposureGate
      tags: [order]
      summary: Check the pre ship exposure gate
      description: 200 with blocked false when clear; the raw exposure payload with 409 when blocked.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/XBranchId"
      responses:
        "200":
          description: Not blocked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderExposureClear"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Blocked by unresolved index exposure.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExposureBlock"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/orders/{id}/exposure-override:
    post:
      operationId: orderExposureOverride
      tags: [order]
      summary: Override the exposure gate
      description: >-
        Records an explicit override with an audit entry. A notes
        justification of at least ten characters is required; shorter notes
        are a 400.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/XBranchId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderExposureOverrideRequest"
      responses:
        "200":
          description: Overridden.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderExposureOverridden"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  schemas:
    OrderStatus:
      type: string
      enum: [DRAFT, CONFIRMED, FULFILLED, CANCELLED, ON_HOLD]
    Order:
      type: object
      required: [id, branch_id, customer_id, status, total_amount, created_at, updated_at, total_cost, total_margin, margin_percent, total_commission]
      properties:
        id:
          type: string
          format: uuid
        branch_id:
          type: string
          format: uuid
        customer_id:
          type: string
          format: uuid
        customer_name:
          type: string
        quote_id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/OrderStatus"
        total_amount:
          type: integer
          format: int64
          description: Cents.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        salesperson_id:
          type: string
          format: uuid
        salesperson_name:
          type: string
        total_cost:
          type: integer
          format: int64
          description: Cents.
        total_margin:
          type: integer
          format: int64
          description: Cents.
        margin_percent:
          type: number
          description: Percentage, kept as float.
        total_commission:
          type: integer
          format: int64
          description: Cents.
        lines:
          type: array
          items:
            $ref: "#/components/schemas/OrderLine"
    OrderLine:
      type: object
      required: [id, order_id, product_id, quantity, price_each, unit_cost, commission_rate, is_special_order]
      properties:
        id:
          type: string
          format: uuid
        order_id:
          type: string
          format: uuid
        product_id:
          type: string
          format: uuid
        product_sku:
          type: string
        product_name:
          type: string
        quantity:
          type: number
        price_each:
          type: integer
          format: int64
          description: Cents. The quote module's convert payload carries float dollars; the client converts.
        unit_cost:
          type: integer
          format: int64
          description: Cents.
        commission_rate:
          type: number
          description: Percentage, kept as float.
        is_special_order:
          type: boolean
        vendor_id:
          type: string
          format: uuid
        special_order_cost:
          type: integer
          format: int64
          description: Cents.
    OrderCreateRequest:
      type: object
      required: [customer_id, lines]
      properties:
        customer_id:
          type: string
          format: uuid
        quote_id:
          type: string
          format: uuid
        lines:
          type: array
          items:
            $ref: "#/components/schemas/OrderLineRequest"
    OrderLineRequest:
      type: object
      required: [product_id, quantity, price_each]
      properties:
        product_id:
          type: string
          format: uuid
        quantity:
          type: number
        price_each:
          type: integer
          format: int64
          description: Cents.
        is_special_order:
          type: boolean
        vendor_id:
          type: string
          format: uuid
        special_order_cost:
          type: integer
          format: int64
          description: Cents.
    OrderCancelRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
    OrderExposureClear:
      type: object
      required: [blocked]
      properties:
        blocked:
          type: boolean
          enum: [false]
    OrderExposureOverrideRequest:
      type: object
      required: [notes]
      properties:
        notes:
          type: string
          minLength: 10
          description: The justification recorded with the override and its audit entry.
    OrderExposureOverridden:
      type: object
      required: [overridden]
      properties:
        overridden:
          type: boolean
          enum: [true]
    OrderPage:
      type: object
      required: [data, total, limit, offset]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Order"
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
