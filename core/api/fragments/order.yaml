    OrderCreateRequest:
      type: object
      description: The body of POST /orders and PUT /orders/{id}.
      required:
      - customer_id
      - delivery_type
      - lines
      properties:
        branch_id:
          type: string
          format: uuid
          description: Held to the caller's branch context (ADR 0007 section 2.3); fixed at create.
        customer_id:
          type: string
          format: uuid
        quote_id:
          type: string
          format: uuid
          description: 'Never accepted: a 400 on create and on PUT. A quote''s order is created by
            POST /quotes/{id}/convert (ADR 0005 section 5.8).'
        job_id:
          type: string
          format: uuid
        delivery_type:
          $ref: '#/components/schemas/OrderDeliveryType'
        ship_to_id:
          type: string
          format: uuid
        customer_po:
          type: string
          maxLength: 100
        ordered_by_contact_id:
          type: string
          format: uuid
        salesperson_id:
          type: string
          format: uuid
        scheduled_delivery_date:
          type: string
          description: YYYY-MM-DD.
        revision:
          type: integer
          format: int64
          description: 'PUT only: the precondition, beside If-Match. On create it is a 400.'
        lines:
          type: array
          items:
            $ref: '#/components/schemas/OrderLineRequest'
    OrderLineRequest:
      type: object
      description: One line of a create or edit body. The parse collects every problem into one 400 with
        the full field path (lines[2].quantity).
      properties:
        id:
          type: string
          format: uuid
          description: A line keeps its id across edits when the request sends it.
        line_type:
          type: string
          enum:
          - product
          - charge
          - text
          description: 'Derived when absent: a charge_code means charge, a product or a priced field means
            product, a description alone means text. kit and component are never a request.'
        product_id:
          type: string
          format: uuid
        charge_code:
          type: string
          description: The charge code's code text, on a charge line.
          pattern: ^[A-Z0-9_]{1,16}$
        sku:
          type: string
        description:
          type: string
          description: Required on every line without a product (the product fills its own); required
            on a text line.
        quantity:
          type: string
          description: A decimal string, at most 4 fraction digits, positive on a sales document.
        uom:
          type: string
          description: A unit code; a product line may leave it to the product's stocking unit.
        price_uom:
          type: string
          description: A unit code; defaults to uom.
        uom_qty:
          type: string
          description: One side of the conversion pair; both together or neither; 1 and 1 when the units
            agree.
        price_uom_qty:
          type: string
        unit_price_ten_thousandths:
          type: integer
          format: int64
          description: Absent on a stocked product line means the engine prices it; present it is an override
            naming override_reason, and on a non stock or charge line the manual price.
        override_reason:
          type: string
          maxLength: 500
        discount_percent:
          type: string
        discount_cents:
          type: integer
          format: int64
        discount_reason:
          type: string
        taxable:
          type: boolean
          description: A charge line's override of its code's flag; a non stock product line's own flag.
        is_special_order:
          type: boolean
        vendor_id:
          type: string
          format: uuid
        special_order_unit_cost_ten_thousandths:
          type: integer
          format: int64
    OrderAllocateRequest:
      type: object
      description: The body is optional; the revision may ride in If-Match instead.
      properties:
        revision:
          type: integer
          format: int64
          description: The precondition, beside If-Match.
    OrderFulfilRequest:
      type: object
      properties:
        revision:
          type: integer
          format: int64
          description: The precondition, beside If-Match.
        lines:
          type: array
          description: Optional; absent means everything allocated, every non stock line's unbilled quantity and every unbilled charge line.
          items:
            $ref: '#/components/schemas/OrderFulfilLine'
        picked_up_by:
          type: string
          maxLength: 200
          description: Required to fulfil a pickup order (who collected it); refused on a delivery order.
        delivery_id:
          type: string
          format: uuid
          description: The delivery this fulfilment bills (a delivery order only).
    OrderFulfilLine:
      type: object
      required:
      - order_line_id
      - quantity
      properties:
        order_line_id:
          type: string
          format: uuid
        quantity:
          type: string
          description: A decimal string, greater than zero, at most the line's allocation (a stocked line) or unbilled quantity (a non stock line); whole kits for a kit line.
    OrderFulfilmentRequest:
      type: object
      required:
      - delivery_id
      - order_id
      - position
      - attempts
      - last_error
      - parked_at
      - created_at
      properties:
        delivery_id:
          type: string
          format: uuid
        order_id:
          type: string
          format: uuid
        position:
          type: integer
          format: int64
        attempts:
          type: integer
        last_error:
          type:
          - string
          - 'null'
        parked_at:
          type:
          - string
          - 'null'
          format: date-time
        created_at:
          type: string
          format: date-time
    OrderFulfilmentRequestPage:
      type: object
      required:
      - items
      - next_cursor
      - limit
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderFulfilmentRequest'
        next_cursor:
          type:
          - string
          - 'null'
        limit:
          type: integer
    OrderTransitionRequest:
      type: object
      required:
      - to
      properties:
        to:
          $ref: '#/components/schemas/OrderStatus'
        revision:
          type: integer
          format: int64
          description: The precondition, beside If-Match.
        reason:
          type: string
          description: Required by the cancel and the close short.
        hold_note:
          type: string
          description: Required by the manual hold.
    OrderExposureClear:
      type: object
      required:
      - blocked
      properties:
        blocked:
          type: boolean
          enum:
          - false
    OrderExposureOverrideRequest:
      type: object
      required:
      - notes
      properties:
        notes:
          type: string
          minLength: 10
          description: The justification recorded with the override and its audit entry.
    OrderExposureOverridden:
      type: object
      required:
      - overridden
      properties:
        overridden:
          type: boolean
          enum:
          - true
    OrderPage:
      type: object
      required:
      - items
      - next_cursor
      - limit
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderSummary'
        next_cursor:
          type:
          - string
          - 'null'
        limit:
          type: integer
        total:
          type: integer
          description: Only under include=total.
