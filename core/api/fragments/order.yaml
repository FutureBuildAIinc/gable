#
# The order module on the wire contract (ADR 0001; ADR 0005 section 5, item
# C2-2a): the cursor list envelope with working filters, the one error
# envelope, a lowercase status with the transitions route, integer _cents
# money, the scaled unit price, quantities and the conversion pair as decimal
# strings, the shared sales line shape of ADR 0005 section 2 (product, kit,
# component, charge and text lines), a document number and a revision with
# its ETag, the credit hold as a committed state with its own event, and the
# tax estimate with its source. The exposure routes at the bottom are the
# pricing module's; their behaviour is kept, onto the error envelope.
paths:
  /api/v1/orders:
    get:
      operationId: orderList
      tags:
      - order
      summary: List orders
      description: The cursor list envelope, newest first. status filters on the lowercase lifecycle vocabulary
        (a comma separated list); customer_id, job_id, ship_to_id and quote_id filter on their document;
        delivery_type on pickup or delivery. total appears only under include=total. A parameter the route
        does not declare, a status outside the vocabulary, a malformed cursor or an out of range limit
        is a 400.
      parameters:
      - name: status
        in: query
        required: false
        description: Comma separated lowercase statuses (draft, on_hold, confirmed, backordered, fulfilled,
          cancelled).
        schema:
          type: string
      - name: customer_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: job_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: ship_to_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: delivery_type
        in: query
        required: false
        schema:
          type: string
          enum:
          - pickup
          - delivery
      - name: quote_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/PageLimit'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Include'
      - $ref: '#/components/parameters/XBranchId'
      responses:
        '200':
          description: The page of orders.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderPage'
        '400':
          $ref: '#/components/responses/BadRequestEither'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenEither'
        '500':
          $ref: '#/components/responses/InternalErrorEither'
    post:
      operationId: orderCreate
      tags:
      - order
      summary: Create a draft order
      description: Creates the order in draft with its lines priced and its tax estimated. A line that
        names a product takes the pricing engine's answer (price_source price_list); a price beside the
        engine's is an override that names its reason (override), kept with the engine's answer beside
        it; a charge line names a charge code and takes its default price when it sends none (manual);
        a non stock product line sends its own price (manual); a text line carries only a description.
        A kit product explodes into its components. A discount is one of discount_percent or discount_cents,
        never both, with its reason. The order's currency is the customer's effective currency, copied,
        never sent. A delivery order takes the customer's default ship-to.
      parameters:
      - $ref: '#/components/parameters/XBranchId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCreateRequest'
      responses:
        '201':
          description: The created draft order.
          headers:
            Location:
              description: /api/v1/orders/{id} of the created order.
              schema:
                type: string
            ETag:
              description: The order's revision.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequestEither'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenEither'
        '409':
          description: A conflict the finer codes do not name; blockers may name unit_not_stock_unit or
            tax_rate_not_configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WireError'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/orders/{id}:
    get:
      operationId: orderGet
      tags:
      - order
      summary: Get one order with lines
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/XBranchId'
      responses:
        '200':
          description: The order.
          headers:
            ETag:
              description: The order's revision.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenEither'
        '404':
          $ref: "#/components/responses/WireNotFound"
    put:
      operationId: orderUpdate
      tags:
      - order
      summary: Replace a draft order
      description: 'Replaces the header fields and the lines, in draft only: in any other status it is
        409 with the blocker order_not_draft. A line keeps its id across edits when the request sends
        it. The tax estimate is refreshed on every edit. The revision precondition applies (If-Match or
        the body revision).'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/XBranchId'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCreateRequest'
      responses:
        '200':
          description: The edited order.
          headers:
            ETag:
              description: The new revision.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequestEither'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenEither'
        '404':
          $ref: "#/components/responses/WireNotFound"
        '409':
          $ref: '#/components/responses/ConflictEither'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '428':
          $ref: '#/components/responses/WirePreconditionRequired'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/orders/{id}/transitions:
    post:
      operationId: orderTransition
      tags:
      - order
      summary: Move an order along its lifecycle
      description: 'The transition table of ADR 0005 section 5.2. draft to confirmed runs the guards (price
        exposure, tax rate configured, PO required, contact authority, non empty) and the credit check:
        over the customer''s limit the order lands on_hold IN THE SAME TRANSACTION, with order.hold written,
        and the answer is 200 with the held order, never an error. on_hold to confirmed is the release
        (roles admin, owner, finance); it skips the credit check. confirmed or backordered to on_hold
        is a manual hold and requires hold_note. Any status to draft reopens (refused once the order has
        been billed, blocker has_fulfilments); any live status to cancelled requires reason. confirmed
        or backordered to fulfilled is the close short and requires reason: it releases the allocations and
        back orders of the unfulfilled remainder and is refused with no_fulfilments when nothing has been
        billed or fulfilled against the order. The confirm allocates each stocked line min(available,
        quantity) from the order''s branch and records the rest as back ordered (the order lands backordered,
        order.backordered after order.confirmed); the release of a credit hold allocates an order that never
        was; a cancel or a reopen gives its allocation back. Anything outside the table is 409
        invalid_state_transition.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/XBranchId'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderTransitionRequest'
      responses:
        '200':
          description: The order after the transition, on_hold included. A hold is a committed state,
            not an error.
          headers:
            ETag:
              description: The new revision.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequestEither'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The release of a hold needs the admin, owner or finance role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WireError'
        '404':
          $ref: "#/components/responses/WireNotFound"
        '409':
          $ref: '#/components/responses/ConflictEither'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '428':
          $ref: '#/components/responses/WirePreconditionRequired'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/orders/{id}/allocate:
    post:
      operationId: orderAllocate
      tags:
      - order
      summary: Allocate a back ordered order on demand
      description: 'The desk''s retry for a back order (ADR 0005 5.4): allocates the available stock to the
        order''s back ordered lines in the same transaction shape as the worker''s serving of an allocation
        request, derives the status, and writes order.backorder_released when it clears the back order.
        It never touches the request queue; a request left behind finds nothing to allocate and the worker
        deletes it. The order''s branch is held to the caller''s wall (403 naming id). Allowed in confirmed
        and backordered; any other status is 409 order_not_allocatable. The revision precondition is
        required (If-Match or the body revision; neither is 428).'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/XBranchId'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderAllocateRequest'
      responses:
        '200':
          description: The order after the allocation.
          headers:
            ETag:
              description: The new revision.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequestEither'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenEither'
        '404':
          $ref: "#/components/responses/WireNotFound"
        '409':
          $ref: '#/components/responses/ConflictEither'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '428':
          $ref: '#/components/responses/WirePreconditionRequired'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/orders/{id}/fulfillments:
    post:
      operationId: orderFulfil
      tags:
      - order
      summary: Fulfil an order, the money moment
      description: 'ADR 0005 5.6. Bills the allocated quantities in one transaction: stock moves out (an
        amount above a line''s allocation is 409 exceeds_allocation), the invoice is built through the
        shared line rules (each billed extension is the difference of two cumulative totals, so the
        invoices of a line sum to the order line''s total to the cent, an amount discount prorated), and
        the invoice entry is posted with its cost of goods sold: DR 1020 total and 5010 cost, CR each
        revenue account, 2020 tax and 1030 cost. Absent lines means every allocated quantity, every non
        stock product line''s unbilled quantity and every charge line not yet billed; naming a non stock
        line is checked against quantity less fulfilled (409 exceeds_unbilled); a kit is fulfilled by naming
        its kit line, in whole kits; naming a component line is a 400. A pickup (will-call) order requires
        picked_up_by (1 to 200 characters), a delivery order must not send it. The price exposure gate and
        the credit are re-checked with this order counted by its unbilled remainder (409 credit_limit, no
        hold). Allowed in confirmed and backordered. The order''s branch is held to the caller''s wall
        (403 naming id). Answers 201 with the updated order and Location naming the invoice.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/XBranchId'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderFulfilRequest'
      responses:
        '201':
          description: The updated order.
          headers:
            Location:
              description: The invoice created, /api/v1/invoices/{id}.
              schema:
                type: string
            ETag:
              description: The new revision.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequestEither'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenEither'
        '404':
          $ref: "#/components/responses/WireNotFound"
        '409':
          $ref: '#/components/responses/ConflictEither'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '428':
          $ref: '#/components/responses/WirePreconditionRequired'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/orders/fulfillment-requests:
    get:
      operationId: orderFulfilmentRequestList
      tags:
      - order
      summary: List the fulfilment requests of completed deliveries
      description: 'ADR 0005 5.5. A completed delivery queues one request in the transaction that writes its
        delivered status; the worker bills it, retries a failure and parks it after ten. parked=true lists
        the parked ones with their last_error; they are never retried automatically and never deleted.
        Roles admin, owner, finance, warehouse.'
      parameters:
      - name: parked
        in: query
        required: false
        schema:
          type: boolean
      - name: order_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/PageLimit'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/XBranchId'
      responses:
        '200':
          description: The page of requests, oldest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderFulfilmentRequestPage'
        '400':
          $ref: '#/components/responses/BadRequestEither'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenEither'
        '500':
          $ref: '#/components/responses/InternalErrorEither'
  /api/v1/orders/fulfillment-requests/{delivery_id}/retry:
    post:
      operationId: orderFulfilmentRequestRetry
      tags:
      - order
      summary: Retry a parked fulfilment request
      description: 'Clears parked_at and attempts so the worker takes the request again. The order''s branch
        is held to the caller''s wall (403 naming id). Roles admin, owner, finance, warehouse.'
      parameters:
      - name: delivery_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/XBranchId'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: The request is cleared.
        '400':
          $ref: '#/components/responses/BadRequestEither'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenEither'
        '404':
          $ref: "#/components/responses/WireNotFound"
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/orders/{id}/exposure-gate:
    get:
      operationId: orderExposureGate
      tags:
      - order
      summary: Check the pre ship exposure gate
      description: 200 with blocked false when clear; 409 with the wire's error envelope carrying the
        exposure payload as blockers when it does not. The behaviour of the pre-conversion route, onto
        the envelope.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/XBranchId'
      responses:
        '200':
          description: Not blocked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderExposureClear'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenEither'
        '409':
          description: Blocked by unresolved index exposure; the blockers carry the exposure payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WireError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/orders/{id}/exposure-override:
    post:
      operationId: orderExposureOverride
      tags:
      - order
      summary: Override the exposure gate
      description: Records an explicit override with an audit entry. A notes justification of at least
        ten characters is required; shorter notes are a 400.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/XBranchId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderExposureOverrideRequest'
      responses:
        '200':
          description: Overridden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderExposureOverridden'
        '400':
          $ref: '#/components/responses/BadRequestEither'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenEither'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  schemas:
    OrderStatus:
      type: string
      enum:
      - draft
      - on_hold
      - confirmed
      - backordered
      - fulfilled
      - cancelled
      description: The lifecycle, lowercase on the wire (ADR 0001 section 6; ADR 0005 section 5.2). The
        database keeps its uppercase CHECK.
    OrderDeliveryType:
      type: string
      enum:
      - pickup
      - delivery
      description: pickup is will-call, the customer collecting at the branch; delivery goes on a truck
        (ADR 0005 section 5.5).
    OrderTaxSource:
      type: string
      enum:
      - exempt
      - provider
      - ship_to_rate
      - branch_rate
      - legacy
      description: How the order's tax was found (ADR 0005 section 3). Rows written before cycle 2 are
        legacy.
    SalesLineType:
      type: string
      enum:
      - product
      - kit
      - component
      - charge
      - text
      description: The line types of ADR 0005 section 2.1, one shape on every sales document. kit and
        component lines are written by the server when a line names a kit product; a request never sends
        them.
    SalesPriceSource:
      type: string
      enum:
      - price_list
      - quote
      - override
      - manual
      - none
      description: Where a line's unit price came from (ADR 0005 section 2.3).
    SalesLine:
      type: object
      description: One line of a sales document, the shared shape of ADR 0005 section 2.2. Every priced
        line carries all the priced fields, always present; a text line carries them as null, present
        on the wire (ADR 0001 section 12), so a client reads one shape per line.
      required:
      - id
      - position
      - line_type
      - parent_line_id
      - product_id
      - charge_code_id
      - charge_code
      - sku
      - description
      - quantity
      - uom
      - price_uom
      - uom_qty
      - price_uom_qty
      - unit_price_ten_thousandths
      - priced_unit_price_ten_thousandths
      - price_source
      - override_reason
      - discount_percent
      - discount_cents
      - discount_reason
      - price_adjusted_by
      - line_total_cents
      - taxable
      - revenue_account_code
      - is_special_order
      - vendor_id
      - special_order_unit_cost_ten_thousandths
      - created_at
      properties:
        id:
          type: string
          format: uuid
        position:
          type: integer
          description: The line's place on the document; a kit's components follow it.
        line_type:
          $ref: '#/components/schemas/SalesLineType'
        parent_line_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Set on a component line only, naming its kit line.
        product_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Required on kit and component lines, optional on a product line (null is a non
            stock item), null on charge and text lines.
        charge_code_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Set on a charge line only.
        charge_code:
          type:
          - string
          - 'null'
          description: The charge code's code text, read.
        sku:
          type:
          - string
          - 'null'
          description: A snapshot of the product's SKU.
        description:
          type: string
          description: A snapshot; required on every line.
        quantity:
          type:
          - string
          - 'null'
          description: The quantity as a decimal string with its unit; null only on a text line.
        uom:
          type:
          - string
          - 'null'
          description: The sale unit. On a stocked line it is the product's stocking unit (ADR 0005 section
            1).
        price_uom:
          type:
          - string
          - 'null'
          description: The unit the price is per; equals uom unless the pair says otherwise.
        uom_qty:
          type:
          - string
          - 'null'
          description: One side of the conversion pair; 1 and 1 when the units agree (any other pair on
            equal units is a 400).
        price_uom_qty:
          type:
          - string
          - 'null'
          description: The other side of the conversion pair.
        unit_price_ten_thousandths:
          type:
          - integer
          - 'null'
          format: int64
          description: The price charged per price unit, after any override, before any discount.
        priced_unit_price_ten_thousandths:
          type:
          - integer
          - 'null'
          format: int64
          description: What the pricing engine resolved, read only, so an override is visible as the difference;
            null on text, charge and non stock lines.
        price_source:
          $ref: '#/components/schemas/SalesPriceSource'
        override_reason:
          type:
          - string
          - 'null'
          description: Required when price_source is override.
        discount_percent:
          type:
          - string
          - 'null'
          description: A percent at scale 4 as a decimal string, greater than 0 and at most 100; never
            with discount_cents.
        discount_cents:
          type:
          - integer
          - 'null'
          format: int64
          description: A discount amount in cents, positive; never with discount_percent.
        discount_reason:
          type:
          - string
          - 'null'
          description: Required with either discount.
        price_adjusted_by:
          type:
          - string
          - 'null'
          description: The actor of the last override or discount; the audit row carries the rest.
        line_total_cents:
          type:
          - integer
          - 'null'
          format: int64
          description: The extension, rounded once (ADR 0005 section 2.4); null only on a text line.
        taxable:
          type: boolean
        revenue_account_code:
          type:
          - string
          - 'null'
          description: The charge code's account, snapshotted at create; null on every other line type.
        is_special_order:
          type: boolean
        vendor_id:
          type:
          - string
          - 'null'
          format: uuid
        special_order_unit_cost_ten_thousandths:
          type:
          - integer
          - 'null'
          format: int64
          description: A unit cost at scale 4.
        created_at:
          type: string
          format: date-time
    OrderLine:
      type: object
      description: A sales line on an order, with the order's own columns (ADR 0005 sections 2.2 and 5.4).
      required:
      - id
      - position
      - line_type
      - parent_line_id
      - product_id
      - charge_code_id
      - charge_code
      - sku
      - description
      - quantity
      - uom
      - price_uom
      - uom_qty
      - price_uom_qty
      - unit_price_ten_thousandths
      - priced_unit_price_ten_thousandths
      - price_source
      - override_reason
      - discount_percent
      - discount_cents
      - discount_reason
      - price_adjusted_by
      - line_total_cents
      - taxable
      - revenue_account_code
      - is_special_order
      - vendor_id
      - special_order_unit_cost_ten_thousandths
      - created_at
      - quote_line_id
      - quantity_allocated
      - quantity_backordered
      - quantity_fulfilled
      properties:
        id:
          type: string
          format: uuid
        position:
          type: integer
          description: The line's place on the document; a kit's components follow it.
        line_type:
          $ref: '#/components/schemas/SalesLineType'
        parent_line_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Set on a component line only, naming its kit line.
        product_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Required on kit and component lines, optional on a product line (null is a non
            stock item), null on charge and text lines.
        charge_code_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Set on a charge line only.
        charge_code:
          type:
          - string
          - 'null'
          description: The charge code's code text, read.
        sku:
          type:
          - string
          - 'null'
          description: A snapshot of the product's SKU.
        description:
          type: string
          description: A snapshot; required on every line.
        quantity:
          type:
          - string
          - 'null'
          description: The quantity as a decimal string with its unit; null only on a text line.
        uom:
          type:
          - string
          - 'null'
          description: The sale unit. On a stocked line it is the product's stocking unit (ADR 0005 section
            1).
        price_uom:
          type:
          - string
          - 'null'
          description: The unit the price is per; equals uom unless the pair says otherwise.
        uom_qty:
          type:
          - string
          - 'null'
          description: One side of the conversion pair; 1 and 1 when the units agree (any other pair on
            equal units is a 400).
        price_uom_qty:
          type:
          - string
          - 'null'
          description: The other side of the conversion pair.
        unit_price_ten_thousandths:
          type:
          - integer
          - 'null'
          format: int64
          description: The price charged per price unit, after any override, before any discount.
        priced_unit_price_ten_thousandths:
          type:
          - integer
          - 'null'
          format: int64
          description: What the pricing engine resolved, read only, so an override is visible as the difference;
            null on text, charge and non stock lines.
        price_source:
          $ref: '#/components/schemas/SalesPriceSource'
        override_reason:
          type:
          - string
          - 'null'
          description: Required when price_source is override.
        discount_percent:
          type:
          - string
          - 'null'
          description: A percent at scale 4 as a decimal string, greater than 0 and at most 100; never
            with discount_cents.
        discount_cents:
          type:
          - integer
          - 'null'
          format: int64
          description: A discount amount in cents, positive; never with discount_percent.
        discount_reason:
          type:
          - string
          - 'null'
          description: Required with either discount.
        price_adjusted_by:
          type:
          - string
          - 'null'
          description: The actor of the last override or discount; the audit row carries the rest.
        line_total_cents:
          type:
          - integer
          - 'null'
          format: int64
          description: The extension, rounded once (ADR 0005 section 2.4); null only on a text line.
        taxable:
          type: boolean
        revenue_account_code:
          type:
          - string
          - 'null'
          description: The charge code's account, snapshotted at create; null on every other line type.
        is_special_order:
          type: boolean
        vendor_id:
          type:
          - string
          - 'null'
          format: uuid
        special_order_unit_cost_ten_thousandths:
          type:
          - integer
          - 'null'
          format: int64
          description: A unit cost at scale 4.
        created_at:
          type: string
          format: date-time
        quote_line_id:
          type:
          - string
          - 'null'
          format: uuid
          description: The quote line an order line came from (a conversion, ADR 0005 section 5.8).
        quantity_allocated:
          type: string
          description: Stock allocated to the line; the allocation act arrives with C2-2b (ADR 0005 section
            5.4).
        quantity_backordered:
          type: string
          description: The short quantity, recorded by the allocation act (C2-2b).
        quantity_fulfilled:
          type: string
          description: What has left the yard on the line (C2-2b's fulfilments).
    OrderSummary:
      type: object
      description: An order header, used as a list item and as the head of the full document.
      required:
      - id
      - number
      - branch_id
      - customer_id
      - customer_name
      - quote_id
      - job_id
      - status
      - revision
      - currency
      - delivery_type
      - ship_to_id
      - customer_po
      - ordered_by_contact_id
      - salesperson_id
      - salesperson_name
      - scheduled_delivery_date
      - subtotal_cents
      - tax_cents
      - tax_rate_percent
      - tax_exempt
      - tax_source
      - total_cents
      - total_cost_cents
      - total_margin_cents
      - margin_percent
      - total_commission_cents
      - hold_reason
      - hold_note
      - confirmed_at
      - created_at
      - updated_at
      - invoice_ids
      properties:
        id:
          type: string
          format: uuid
        number:
          type: string
          description: The human readable document number, SO- and at least six digits, from a database
            sequence.
          pattern: ^SO-[0-9]{6,}$
        branch_id:
          type: string
          format: uuid
        customer_id:
          type: string
          format: uuid
        customer_name:
          type: string
        quote_id:
          type:
          - string
          - 'null'
          format: uuid
        job_id:
          type:
          - string
          - 'null'
          format: uuid
        status:
          $ref: '#/components/schemas/OrderStatus'
        revision:
          type: integer
          format: int64
          minimum: 1
          description: Starts at 1 and moves on every write; the client sends it back as If-Match or in
            the body.
        currency:
          type: string
          description: The customer's effective currency at create, copied (ADR 0005 section 4.2); a create
            body that sends it is a 400.
          pattern: ^[A-Z]{3}$
        delivery_type:
          $ref: '#/components/schemas/OrderDeliveryType'
        ship_to_id:
          type:
          - string
          - 'null'
          format: uuid
          description: The customer's default ship-to is taken on a delivery order at create.
        customer_po:
          type:
          - string
          - 'null'
          description: Required at confirm when the customer requires a PO (blocker po_required).
        ordered_by_contact_id:
          type:
          - string
          - 'null'
          format: uuid
          description: The contact that placed the order; its authority is checked at confirm (blocker
            contact_authority).
        salesperson_id:
          type:
          - string
          - 'null'
          format: uuid
        salesperson_name:
          type:
          - string
          - 'null'
        scheduled_delivery_date:
          type:
          - string
          - 'null'
          description: A business date as YYYY-MM-DD.
        subtotal_cents:
          type: integer
          format: int64
        tax_cents:
          type: integer
          format: int64
          description: The estimate, rounded once per document (ADR 0005 section 3); each invoice computes
            its own.
        tax_rate_percent:
          type:
          - string
          - 'null'
          description: The resolved rate as a percent decimal string ("8.875"); null when the provider
            answered.
        tax_exempt:
          type: boolean
        tax_source:
          $ref: '#/components/schemas/OrderTaxSource'
        total_cents:
          type: integer
          format: int64
          description: The subtotal plus the tax estimate.
        total_cost_cents:
          type: integer
          format: int64
          description: The lines' cost at the products' average cost, read at read time.
        total_margin_cents:
          type: integer
          format: int64
        margin_percent:
          type:
          - string
          - 'null'
          description: The margin as a percentage decimal string; null when the subtotal is zero.
        total_commission_cents:
          type: integer
          format: int64
        hold_reason:
          type:
          - string
          - 'null'
          enum:
          - credit_limit
          - manual
          - null
          description: Set only while on hold (ADR 0005 section 5.1).
        hold_note:
          type:
          - string
          - 'null'
        confirmed_at:
          type:
          - string
          - 'null'
          format: date-time
          description: The first confirm.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        invoice_ids:
          type: array
          description: The invoices written against the order, oldest first.
          items:
            type: string
            format: uuid
