#
# The general ledger module, transcribed from internal/gl/handler.go,
# model.go, service.go, repository.go, branch.go and periods.go as they
# behave today. The routes sit behind RequireRole("admin","owner") composed
# with the branch middleware, and the branch wall is on every read and write
# that names or returns a branch: a named branch is held to the caller's
# reach (403 when it is not), a read that names no branch reads the
# X-Branch-Id branch when the header is sent, and the consolidated read (no
# branch_id and no header) needs every branch reach. Money is int64 cents everywhere, the lists are cursor
# paginated, and the account and period updates take If-Match on a revision.
paths:
  /api/v1/gl/accounts:
    get:
      operationId: glAccountList
      tags: [gl]
      summary: List the chart of accounts
      description: >-
        One cursor page of the chart, ordered by code, with the posted
        balance (debit minus credit, cents) computed per account. Role guard
        admin or owner.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of the chart of accounts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GlAccountPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: glAccountCreate
      tags: [gl]
      summary: Create a GL account
      description: >-
        Role guard admin or owner. A missing code, a missing name, an invalid
        type, or a database refusal such as a duplicate code is a 400. A
        missing normal_balance defaults from the type (DEBIT for ASSET and
        EXPENSE, CREDIT otherwise). The account is always created active.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GlAccountRequest"
      responses:
        "201":
          description: The created account (balance is 0, revision is 1).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GlAccount"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /api/v1/gl/accounts/{id}:
    put:
      operationId: glAccountUpdate
      tags: [gl]
      summary: Replace a GL account
      description: >-
        Role guard admin or owner. Full replace of the editable columns; the
        account is always written active (is_active cannot be set false
        here). If-Match (or the body revision) must carry the revision the
        caller read: absent is 428, stale is 409, and the row's revision
        moves on with the write. An unknown id is a 404.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GlAccountRequest"
      responses:
        "200":
          description: The account as written, with its new revision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GlAccount"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/WireNotFound"
        "409":
          $ref: "#/components/responses/ConflictEither"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "428":
          $ref: "#/components/responses/WirePreconditionRequired"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/gl/journal-entries:
    get:
      operationId: glJournalEntryList
      tags: [gl]
      summary: List journal entries
      description: >-
        One cursor page of the entries, highest entry_number first, at the
        caller's branch reach. branch_id narrows the page to one branch; a
        caller held to one branch is refused the consolidated read (no
        branch_id) with 403. Headers only: lines are omitted.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: branch_id
          in: query
          required: false
          description: One branch's entries. Absent reads the X-Branch-Id branch when the header is sent, else consolidated, which needs every branch reach.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: A page of the journal entry headers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GlJournalEntryPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: glJournalEntryCreate
      tags: [gl]
      summary: Create a draft manual journal entry
      description: >-
        Role guard admin or owner. The request carries int64 cents
        (debit_cents, credit_cents) and names its branch, which the branch
        wall holds to the caller's reach. Source is always MANUAL and status
        DRAFT. entry_date is optional (today when absent) and must be
        YYYY-MM-DD. The entry, its audit row and its outbox event ride one
        transaction. Refused with 400: undecodable body, malformed
        entry_date, a negative amount, a non UUID account_id or branch_id,
        fewer than 2 lines, debits not equal to credits, all zero amounts,
        or a database refusal such as an unknown account.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GlJournalEntryRequest"
      responses:
        "201":
          description: The created entry with its lines (account_code and account_name are omitted on the echo).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GlJournalEntry"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /api/v1/gl/journal-entries/{id}:
    get:
      operationId: glJournalEntryGet
      tags: [gl]
      summary: Get one journal entry with lines
      description: >-
        Role guard admin or owner, walled by the entry's branch: a caller
        held to one branch finds another branch's entry a 404. Lines carry
        account_code and account_name. Any repository failure, not only a
        missing row, answers 404.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The entry with lines.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GlJournalEntry"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/WireNotFound"
  /api/v1/gl/journal-entries/{id}/post:
    post:
      operationId: glJournalEntryPost
      tags: [gl]
      summary: Post a draft journal entry
      description: >-
        Role guard admin or owner. No body. Only a DRAFT entry whose date does
        not fall in a CLOSED fiscal period can post. An unknown id, or an entry
        of a branch outside the caller's reach, is a 404; every other refusal
        is a 400. The post, its audit row and its outbox event ride one
        transaction.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Posted. The body is a one key object with status "posted".
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GlStatusResult"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/WireNotFound"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /api/v1/gl/journal-entries/{id}/reverse:
    post:
      operationId: glJournalEntryReverse
      tags: [gl]
      summary: Reverse a posted journal entry
      description: >-
        Role guard admin or owner. Books a posted, net-zero reversing entry
        dated today and linked by reverses_entry_id, in the original entry's
        own branch and currency, each line keeping its own branch. The
        optional body reason is appended to the memo; an undecodable or
        absent body is ignored. Only a POSTED entry that has not already been
        reversed and has at least 2 lines can be reversed. An unknown id, or
        an entry of a branch outside the caller's reach, is a 404; every other
        refusal is a 400. The reversal, its audit row and its outbox event
        ride one transaction.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GlReverseRequest"
      responses:
        "200":
          description: The id of the new reversal entry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GlReverseResult"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/WireNotFound"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /api/v1/gl/journal-entries/{id}/void:
    post:
      operationId: glJournalEntryVoid
      tags: [gl]
      summary: Void a posted journal entry
      description: >-
        Role guard admin or owner. No body. Only a POSTED entry can be
        voided. An unknown id, or an entry of a branch outside the caller's
        reach, is a 404; every other refusal is a 400. The void, its audit row
        and its outbox event ride one transaction.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Voided. The body is a one key object with status "voided".
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GlStatusResult"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/WireNotFound"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /api/v1/gl/trial-balance:
    get:
      operationId: glTrialBalance
      tags: [gl]
      summary: Trial balance
      description: >-
        Role guard admin or owner. Posted activity up to and including as_of
        (default the branch's business day in its own time zone), for active
        accounts with any activity, ordered by code. branch_id cuts the
        report to one branch; absent reads consolidated, which needs every
        branch reach (403 otherwise). A malformed as_of is a 400. The body is
        null when no account has activity.
      parameters:
        - name: as_of
          in: query
          required: false
          description: The branch's business day or later, YYYY-MM-DD. Defaults to the branch's business day.
          schema:
            type: string
            format: date
        - name: currency
          in: query
          required: false
          description: >-
            ISO 4217 code, three capital letters. Reports never add two currencies
            (ADR 0005 4.2): omitted, every currency's rows are returned, each row naming its currency; given, that currency alone.
          schema:
            type: string
            pattern: "^[A-Z]{3}$"
        - name: branch_id
          in: query
          required: false
          description: One branch's rows. Absent reads the X-Branch-Id branch when the header is sent, else consolidated, which needs every branch reach.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The trial balance rows.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GlTrialBalance"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/gl/profit-and-loss:
    get:
      operationId: glProfitAndLoss
      tags: [gl]
      summary: Profit and loss statement
      description: >-
        Role guard admin or owner. start defaults to the first of the current
        month and end to today; both are YYYY-MM-DD and inclusive.
        compare_start and compare_end carry the previous period beside the
        current one. branch_id cuts the statement to one branch; absent
        reads consolidated, the sum of the branches, which needs every branch
        reach (403 otherwise). A malformed date or an end before the start is
        a 400. The three sections are never null.
      parameters:
        - name: start
          in: query
          required: false
          description: First day, YYYY-MM-DD. Defaults to the first of the current month.
          schema:
            type: string
            format: date
        - name: end
          in: query
          required: false
          description: Last day, YYYY-MM-DD. Defaults to today.
          schema:
            type: string
            format: date
        - name: compare_start
          in: query
          required: false
          description: First day of the comparison period, YYYY-MM-DD.
          schema:
            type: string
            format: date
        - name: compare_end
          in: query
          required: false
          description: Last day of the comparison period, YYYY-MM-DD.
          schema:
            type: string
            format: date
        - name: currency
          in: query
          required: false
          description: >-
            ISO 4217 code, three capital letters. Reports never add two currencies
            (ADR 0005 4.2): defaults to the dealer's default currency; the report is in that one currency.
          schema:
            type: string
            pattern: "^[A-Z]{3}$"
        - name: branch_id
          in: query
          required: false
          description: One branch's statement. Absent reads the X-Branch-Id branch when the header is sent, else consolidated, which needs every branch reach.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The income statement in cents.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GlProfitAndLossReport"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/gl/balance-sheet:
    get:
      operationId: glBalanceSheet
      tags: [gl]
      summary: Balance sheet
      description: >-
        Role guard admin or owner. as_of defaults to the branch's business
        day in its own time zone; a malformed value is a 400.
        retained_earnings is already included in total_equity. branch_id cuts
        the sheet to one branch; absent reads consolidated, which needs every
        branch reach (403 otherwise). The three sections are never null.
      parameters:
        - name: as_of
          in: query
          required: false
          description: Statement date, YYYY-MM-DD. Defaults to the branch's business day.
          schema:
            type: string
            format: date
        - name: currency
          in: query
          required: false
          description: >-
            ISO 4217 code, three capital letters. Reports never add two currencies
            (ADR 0005 4.2): defaults to the dealer's default currency; the sheet is in that one currency.
          schema:
            type: string
            pattern: "^[A-Z]{3}$"
        - name: branch_id
          in: query
          required: false
          description: One branch's sheet. Absent reads the X-Branch-Id branch when the header is sent, else consolidated, which needs every branch reach.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The statement of financial position in cents.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GlBalanceSheetReport"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/gl/detail:
    get:
      operationId: glDetail
      tags: [gl]
      summary: GL detail drill down
      description: >-
        Role guard admin or owner. The posted lines of one account over a
        date window, oldest first: the drill down from a statement row.
        branch_id cuts the detail to one branch; absent reads every branch,
        which needs every branch reach (403 otherwise). account_id, from and
        to are required; a malformed value is a 400.
      parameters:
        - name: account_id
          in: query
          required: true
          description: The account whose posted lines are listed.
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          required: true
          description: First day, YYYY-MM-DD.
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          description: Last day, YYYY-MM-DD.
          schema:
            type: string
            format: date
        - name: branch_id
          in: query
          required: false
          description: One branch's lines. Absent reads the X-Branch-Id branch when the header is sent, else every branch, which needs every branch reach.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The posted detail lines; never null.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GlDetailList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/gl/tie-out:
    get:
      operationId: glTieOut
      tags: [gl]
      summary: Subledger tie out
      description: >-
        Role guard admin or owner. The AR control account (1020) against the
        customer subledger and the AP control account (2010) against the open
        vendor bills, each difference answered in cents, in one currency. The
        subledgers hold only their current balances, so the tie out is for the
        branch's business day: an earlier as_of is a 400. branch_id ties one
        branch (the customer subledger carries no branch of its own, so its
        branch figure is that branch's customers, by primary branch); absent
        ties consolidated, which needs every branch reach (403 otherwise).
      parameters:
        - name: as_of
          in: query
          required: false
          description: Cut-off date, YYYY-MM-DD. Defaults to the branch's business day.
          schema:
            type: string
            format: date
        - name: currency
          in: query
          required: false
          description: ISO 4217 code, three capital letters; defaults to the dealer's default currency.
          schema:
            type: string
            pattern: "^[A-Z]{3}$"
        - name: branch_id
          in: query
          required: false
          description: One branch's tie out. Absent ties the X-Branch-Id branch when the header is sent, else consolidated, which needs every branch reach.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The tie out, differences in cents.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GlTieOutReport"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/gl/fiscal-periods:
    get:
      operationId: glFiscalPeriodList
      tags: [gl]
      summary: List fiscal periods
      description: >-
        Role guard admin or owner. One cursor page of the periods ordered by
        start date, each with the revision its If-Match takes.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of the fiscal periods.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GlFiscalPeriodPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/gl/fiscal-periods/{id}/close:
    post:
      operationId: glFiscalPeriodClose
      tags: [gl]
      summary: Close an open fiscal period
      description: >-
        Role guard admin or owner. No body. If-Match must carry the
        revision the caller read: absent is 428, stale is 409. The close,
        its audit row and its outbox event ride one transaction. A period
        that does not exist is a 404; one already closed is a 409
        invalid_state_transition. The close spans every branch, so a caller
        held to some branches is refused (403).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: The closed period, revision moved on.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GlFiscalPeriod"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/WireNotFound"
        "409":
          $ref: "#/components/responses/ConflictEither"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "428":
          $ref: "#/components/responses/WirePreconditionRequired"
  /api/v1/gl/fiscal-periods/{id}/reopen:
    post:
      operationId: glFiscalPeriodReopen
      tags: [gl]
      summary: Reopen a closed fiscal period
      description: >-
        Role guard admin or owner. The body reason is required: a period is
        reopened with a reason, recorded on the row with the actor and the
        time. If-Match must carry the revision the caller read (absent 428,
        stale 409). The reopen, its audit row and its outbox event ride one
        transaction. A period that does not exist is a 404; one not closed
        is a 409 invalid_state_transition. The reopen spans every branch, so
        a caller held to some branches is refused (403).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GlReopenRequest"
      responses:
        "200":
          description: The reopened period with its reason, revision moved on.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GlFiscalPeriod"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/WireNotFound"
        "409":
          $ref: "#/components/responses/ConflictEither"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "428":
          $ref: "#/components/responses/WirePreconditionRequired"
  /api/v1/gl/years/{year}/close:
    post:
      operationId: glYearClose
      tags: [gl]
      summary: Close the year
      description: >-
        Role guard admin or owner. Zeroes the year's revenue and expense
        accounts into Retained Earnings (3020), one balanced CLOSING entry
        per branch that holds activity, dated the year's last day; each
        entry, its audit row and its outbox event ride one transaction. A
        year whose last day falls in a closed period is refused 409
        period_closed (reopen it with a reason first). The close spans every
        branch, so a caller held to some branches is refused (403). The
        income statement leaves the closing entries out, so a closed year
        still reads what it earned.
      parameters:
        - name: year
          in: path
          required: true
          schema:
            type: integer
        - name: currency
          in: query
          required: false
          description: ISO 4217 code, three capital letters; defaults to the dealer's default currency.
          schema:
            type: string
            pattern: "^[A-Z]{3}$"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: The branches' closing entry ids.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GlYearEndResult"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/ConflictEither"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  schemas:
    GlAccount:
      type: object
      required: [id, code, name, type, subtype, normal_balance, is_active, description, balance, revision, created_at, updated_at]
      description: One chart of accounts row (gl.GLAccount). balance is int64 cents (debit minus credit of posted lines); revision is the If-Match revision of the row.
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        type:
          type: string
          enum: [ASSET, LIABILITY, EQUITY, REVENUE, EXPENSE]
        subtype:
          type: string
        parent_id:
          type: string
          format: uuid
        normal_balance:
          type: string
          enum: [DEBIT, CREDIT]
        is_active:
          type: boolean
        description:
          type: string
        balance:
          type: integer
          format: int64
          description: Cents.
        revision:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    GlAccountPage:
      type: object
      required: [items, limit]
      description: One cursor page of the chart of accounts.
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/GlAccount"
        next_cursor:
          type: [string, "null"]
        limit:
          type: integer
    GlAccountRequest:
      type: object
      required: [code, name, type]
      description: The create and update body for an account. The optional revision is the update's precondition beside If-Match. Unknown keys are ignored.
      properties:
        code:
          type: string
        name:
          type: string
        type:
          type: string
          enum: [ASSET, LIABILITY, EQUITY, REVENUE, EXPENSE]
        subtype:
          type: string
        parent_id:
          type: string
          format: uuid
        normal_balance:
          type: string
          enum: [DEBIT, CREDIT]
        description:
          type: string
        revision:
          type: integer
          format: int64
    GlJournalEntry:
      type: object
      required: [id, entry_number, entry_date, memo, source, branch_id, status, posted_by, total_debit, total_credit, created_at, updated_at]
      description: A journal entry header (gl.JournalEntry), with lines on the single read and the create echo. total_debit and total_credit are int64 cents; branch_id is the branch the entry belongs to.
      properties:
        id:
          type: string
          format: uuid
        entry_number:
          type: integer
        entry_date:
          type: string
          format: date-time
        memo:
          type: string
        source:
          type: string
          description: MANUAL, INVOICE, PAYMENT, ADJUSTMENT, CLOSING, VENDOR_INVOICE, VENDOR_PAYMENT, REVERSAL, RETURN, DEPOSIT, CREDIT_MEMO or WRITE_OFF.
        source_ref_id:
          type: string
          format: uuid
        branch_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [DRAFT, POSTED, VOID]
        posted_by:
          type: string
        reverses_entry_id:
          type: string
          format: uuid
        total_debit:
          type: integer
          format: int64
          description: Cents.
        total_credit:
          type: integer
          format: int64
          description: Cents.
        lines:
          type: array
          items:
            $ref: "#/components/schemas/GlJournalLine"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    GlJournalEntryPage:
      type: object
      required: [items, limit]
      description: One cursor page of the journal entry headers.
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/GlJournalEntry"
        next_cursor:
          type: [string, "null"]
        limit:
          type: integer
    GlJournalLine:
      type: object
      required: [id, journal_entry_id, account_id, description, debit, credit]
      description: One debit or credit line (gl.JournalLine). debit and credit are int64 cents; branch_id is the line's branch, normally its entry's.
      properties:
        id:
          type: string
          format: uuid
        journal_entry_id:
          type: string
          format: uuid
        account_id:
          type: string
          format: uuid
        account_code:
          type: string
        account_name:
          type: string
        description:
          type: string
        branch_id:
          type: string
          format: uuid
        debit:
          type: integer
          format: int64
          description: Cents.
        credit:
          type: integer
          format: int64
          description: Cents.
    GlJournalEntryRequest:
      type: object
      required: [branch_id]
      description: >-
        The create body. entry_date is YYYY-MM-DD and defaults to today.
        debit_cents and credit_cents are int64 cents. branch_id names the
        branch the entry belongs to, held to the caller's reach.
      properties:
        entry_date:
          type: string
          format: date
        memo:
          type: string
        branch_id:
          type: string
          format: uuid
        lines:
          type: array
          items:
            $ref: "#/components/schemas/GlJournalLineRequest"
    GlJournalLineRequest:
      type: object
      properties:
        account_id:
          type: string
          format: uuid
        description:
          type: string
        debit_cents:
          type: integer
          format: int64
          description: Cents; must be >= 0.
        credit_cents:
          type: integer
          format: int64
          description: Cents; must be >= 0.
    GlReverseRequest:
      type: object
      properties:
        reason:
          type: string
    GlReopenRequest:
      type: object
      required: [reason]
      description: The reopen body (a period is reopened with a reason).
      properties:
        reason:
          type: string
    GlReverseResult:
      type: object
      required: [reversal_entry_id]
      properties:
        reversal_entry_id:
          type: string
          format: uuid
    GlStatusResult:
      type: object
      required: [status]
      description: The one key acknowledgement the status routes write.
      properties:
        status:
          type: string
          enum: [posted, voided]
    GlFiscalPeriod:
      type: object
      required: [id, name, start_date, end_date, status, revision, created_at]
      description: An accounting period (gl.FiscalPeriod). closed_at and closed_by are omitted while the period is open; reopen_reason, reopened_by and reopened_at appear once it has been reopened. revision is the If-Match revision.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        start_date:
          type: string
          format: date-time
        end_date:
          type: string
          format: date-time
        status:
          type: string
          enum: [OPEN, CLOSED]
        closed_at:
          type: string
          format: date-time
        closed_by:
          type: string
        reopen_reason:
          type: string
        reopened_by:
          type: string
        reopened_at:
          type: string
          format: date-time
        revision:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
    GlFiscalPeriodPage:
      type: object
      required: [items, limit]
      description: One cursor page of the fiscal periods.
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/GlFiscalPeriod"
        next_cursor:
          type: [string, "null"]
        limit:
          type: integer
    GlTrialBalanceRow:
      type: object
      required: [account_id, account_code, account_name, account_type, currency, branch_id, debit, credit]
      description: One trial balance row (gl.TrialBalanceRow), per account, currency and branch. debit and credit are int64 cents.
      properties:
        currency:
          type: string
          description: The ISO 4217 code of the entries summed in this row.
        account_id:
          type: string
          format: uuid
        account_code:
          type: string
        account_name:
          type: string
        account_type:
          type: string
        branch_id:
          type: string
          format: uuid
        debit:
          type: integer
          format: int64
          description: Cents.
        credit:
          type: integer
          format: int64
          description: Cents.
    GlTrialBalance:
      type: [array, "null"]
      items:
        $ref: "#/components/schemas/GlTrialBalanceRow"
    GlDetailRow:
      type: object
      required: [entry_id, entry_number, entry_date, memo, source, line_id, account_id, account_code, account_name, description, branch_id, debit_cents, credit_cents]
      description: One posted ledger line behind a statement row (gl.GLDetailRow). debit_cents and credit_cents are int64 cents.
      properties:
        entry_id:
          type: string
          format: uuid
        entry_number:
          type: integer
        entry_date:
          type: string
          format: date-time
        memo:
          type: string
        source:
          type: string
        line_id:
          type: string
          format: uuid
        account_id:
          type: string
          format: uuid
        account_code:
          type: string
        account_name:
          type: string
        description:
          type: string
        branch_id:
          type: string
          format: uuid
        debit_cents:
          type: integer
          format: int64
        credit_cents:
          type: integer
          format: int64
    GlDetailList:
      type: array
      items:
        $ref: "#/components/schemas/GlDetailRow"
    GlTieOutLeg:
      type: object
      required: [control_cents, subledger_cents, difference_cents]
      description: One control account against its subledger, cents.
      properties:
        control_cents:
          type: integer
          format: int64
        subledger_cents:
          type: integer
          format: int64
        difference_cents:
          type: integer
          format: int64
    GlTieOutReport:
      type: object
      required: [as_of, currency, ar, ap]
      description: The subledger tie out (gl.TieOutReport), AR 1020 against the customers and AP 2010 against the open bills.
      properties:
        as_of:
          type: string
          description: YYYY-MM-DD.
        currency:
          type: string
        branch_id:
          type: string
          format: uuid
        ar:
          $ref: "#/components/schemas/GlTieOutLeg"
        ap:
          $ref: "#/components/schemas/GlTieOutLeg"
    GlYearEndResult:
      type: object
      required: [year, currency, entries]
      description: The year end close's answer (gl.YearEndResult).
      properties:
        year:
          type: integer
        currency:
          type: string
        entries:
          type: array
          description: One closing entry id per branch that held activity; empty when the year held none.
          items:
            type: string
            format: uuid
    GlAccountLineItem:
      type: object
      required: [account_id, account_code, account_name, amount]
      description: One account's signed balance on a statement (gl.AccountLineItem). amount is int64 cents.
      properties:
        account_id:
          type: string
        account_code:
          type: string
        account_name:
          type: string
        amount:
          type: integer
          format: int64
          description: Cents.
    GlProfitAndLossComparison:
      type: object
      required: [start_date, end_date, total_revenue, total_cogs, gross_profit, total_expenses, net_income]
      description: The previous period's totals beside the current ones (gl.ProfitAndLossComparison), cents.
      properties:
        start_date:
          type: string
        end_date:
          type: string
        total_revenue:
          type: integer
          format: int64
        total_cogs:
          type: integer
          format: int64
        gross_profit:
          type: integer
          format: int64
        total_expenses:
          type: integer
          format: int64
        net_income:
          type: integer
          format: int64
    GlProfitAndLossReport:
      type: object
      required: [currency, start_date, end_date, revenue, cogs, expenses, total_revenue, total_cogs, gross_profit, total_expenses, net_income]
      description: The income statement (gl.ProfitAndLossReport). Every amount is int64 cents, in one currency, one branch's or the consolidated sum.
      properties:
        currency:
          type: string
        branch_id:
          type: string
          format: uuid
        start_date:
          type: string
          description: YYYY-MM-DD.
        end_date:
          type: string
          description: YYYY-MM-DD.
        comparison:
          $ref: "#/components/schemas/GlProfitAndLossComparison"
        revenue:
          type: array
          items:
            $ref: "#/components/schemas/GlAccountLineItem"
        cogs:
          type: array
          items:
            $ref: "#/components/schemas/GlAccountLineItem"
        expenses:
          type: array
          items:
            $ref: "#/components/schemas/GlAccountLineItem"
        total_revenue:
          type: integer
          format: int64
        total_cogs:
          type: integer
          format: int64
        gross_profit:
          type: integer
          format: int64
        total_expenses:
          type: integer
          format: int64
          description: Cents, excludes COGS.
        net_income:
          type: integer
          format: int64
    GlBalanceSheetReport:
      type: object
      required: [currency, as_of_date, assets, liabilities, equity, total_assets, total_liabilities, total_equity, retained_earnings]
      description: The statement of financial position (gl.BalanceSheetReport). Every amount is int64 cents, in one currency, one branch's or the consolidated sum.
      properties:
        currency:
          type: string
        branch_id:
          type: string
          format: uuid
        as_of_date:
          type: string
          description: YYYY-MM-DD.
        assets:
          type: array
          items:
            $ref: "#/components/schemas/GlAccountLineItem"
        liabilities:
          type: array
          items:
            $ref: "#/components/schemas/GlAccountLineItem"
        equity:
          type: array
          items:
            $ref: "#/components/schemas/GlAccountLineItem"
        total_assets:
          type: integer
          format: int64
        total_liabilities:
          type: integer
          format: int64
        total_equity:
          type: integer
          format: int64
          description: Cents, includes retained_earnings.
        retained_earnings:
          type: integer
          format: int64
