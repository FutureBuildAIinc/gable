#
# The orders draft kind on the wire contract (ADR 0007 section 10, item
# C5-2a): the same seven routes over the order module. A create draft's
# promotion runs the create core, so the order is born in status draft with
# its SO- number and order.created; the confirm (with its credit, PO and
# contact checks) stays an order transition. An edit draft's promotion runs
# the update core on subject_revision and writes order.updated beside
# draft.promoted. The scope is read off the URL: orders:propose or
# orders:commit for the draft routes, orders:commit alone for the
# promotion.
paths:
  /api/v1/drafts/orders:
    get:
      operationId: ordersDraftList
      tags: [draft]
      summary: List order drafts
      description: >-
        The cursor list envelope, newest first on created_at then id.
        Filters status, subject_id and created_by_kind; total appears only
        under include=total. Drafts are shared, not owned.
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: subject_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: created_by_kind
          in: query
          required: false
          schema:
            type: string
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Include"
        - $ref: "#/components/parameters/XBranchId"
      responses:
        "200":
          description: The list envelope of order draft summaries.
          content:
            application/json:
              schema:
                type: object
        "400":
          $ref: "#/components/responses/WireBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "500":
          $ref: "#/components/responses/WireInternalError"
    post:
      operationId: ordersDraftCreate
      tags: [draft]
      summary: Create an order draft
      description: >-
        A create draft (subject_id null) carries the order create request
        as its payload; an edit draft names the draft order it edits and
        may assert subject_revision. The payload is the module's own body,
        never a file and never a revision of its own; the branch is fixed
        at create.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/XBranchId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrdersDraftCreateRequest"
      responses:
        "201":
          description: The open draft; Location names it and the ETag is its revision.
          headers:
            Location:
              schema:
                type: string
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrdersDraftDocument"
        "400":
          $ref: "#/components/responses/WireBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "409":
          $ref: "#/components/responses/WireConflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/WireInternalError"
  /api/v1/drafts/orders/feed:
    get:
      operationId: ordersDraftFeed
      tags: [draft]
      summary: The order drafts change feed
      description: >-
        A text/event-stream of the order draft change rows, never payloads,
        with the ready, draft, cursor, reset and reauth events of the
        quotes feed; the cursor resumes through Last-Event-ID (which wins
        when both are present) or the cursor parameter.
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - name: draft_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: subject_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: Last-Event-ID
          in: header
          required: false
          schema:
            type: string
        - $ref: "#/components/parameters/XBranchId"
      responses:
        "200":
          description: The stream.
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/WireBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "429":
          description: This principal holds its draft feed stream limit, answered before the stream opens.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WireError"
        "503":
          $ref: "#/components/responses/WireUnavailable"
  /api/v1/drafts/orders/{id}:
    get:
      operationId: ordersDraftGet
      tags: [draft]
      summary: Read an order draft
      description: The draft with its payload and computed validation; the ETag is the revision.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/XBranchId"
      responses:
        "200":
          description: The draft.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrdersDraftDocument"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "404":
          $ref: "#/components/responses/WireNotFound"
        "500":
          $ref: "#/components/responses/WireInternalError"
    put:
      operationId: ordersDraftReplace
      tags: [draft]
      summary: Replace an order draft's payload
      description: >-
        The whole-payload compare and swap on the revision precondition;
        any status but open is 409 with the draft_not_open blocker, and
        subject_revision moves only forward within the subject's bounds.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/XBranchId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrdersDraftCreateRequest"
      responses:
        "200":
          description: The draft at its new revision.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrdersDraftDocument"
        "400":
          $ref: "#/components/responses/WireBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "404":
          $ref: "#/components/responses/WireNotFound"
        "409":
          $ref: "#/components/responses/WireConflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "428":
          $ref: "#/components/responses/WirePreconditionRequired"
        "500":
          $ref: "#/components/responses/WireInternalError"
  /api/v1/drafts/orders/{id}/transitions:
    post:
      operationId: ordersDraftTransition
      tags: [draft]
      summary: Discard or reopen an order draft
      description: open to discarded and discarded to open, on the revision precondition; promoted is terminal.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/XBranchId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to, revision]
              properties:
                to:
                  type: string
                  enum: [discarded, open]
                revision:
                  type: integer
                  format: int64
      responses:
        "200":
          description: The draft in its new status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrdersDraftDocument"
        "400":
          $ref: "#/components/responses/WireBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "404":
          $ref: "#/components/responses/WireNotFound"
        "409":
          $ref: "#/components/responses/WireConflict"
        "428":
          $ref: "#/components/responses/WirePreconditionRequired"
        "500":
          $ref: "#/components/responses/WireInternalError"
  /api/v1/drafts/orders/{id}/promote:
    post:
      operationId: ordersDraftPromote
      tags: [draft]
      summary: Promote an order draft, in one transaction
      description: >-
        The confirm: the revision the committer read becomes an order born
        in status draft with its SO- number (order.created, then
        draft.promoted; the confirm with its credit, PO and contact checks
        stays an order transition), or an edit draft's payload becomes the
        draft order's update (order.updated, then draft.promoted). A
        failure rolls the whole transaction back, the draft stays open at
        the same revision, and the module's own error is carried out
        (order_not_draft on a subject that left draft, subject_stale added
        when the subject moved).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/XBranchId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                revision:
                  type: integer
                  format: int64
      responses:
        "201":
          description: A create draft's promotion; Location is the order's URL.
          headers:
            Location:
              schema:
                type: string
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrdersDraftDocument"
        "200":
          description: An edit draft's promotion; the body is the promoted draft.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrdersDraftDocument"
        "400":
          $ref: "#/components/responses/WireBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "404":
          $ref: "#/components/responses/WireNotFound"
        "409":
          $ref: "#/components/responses/WireConflict"
        "428":
          $ref: "#/components/responses/WirePreconditionRequired"
        "500":
          $ref: "#/components/responses/WireInternalError"
components:
  schemas:
    OrdersDraftStatus:
      type: string
      enum: [open, promoted, discarded]
      description: The draft lifecycle, lowercase on the wire; promoted is terminal.
    OrdersDraftActor:
      type: object
      description: What pkg/actor resolved for the request (see the quotes kind's actor).
      properties:
        kind:
          type: string
          enum: [user, key, agent, anonymous]
        id:
          type: string
          nullable: true
        acting_as:
          type: string
          nullable: true
        tool:
          type: string
          nullable: true
    OrdersDraftDocument:
      type: object
      description: >-
        The order draft resource: one wire type from every draft route. The
        summary form (the list) is the same object without payload and
        without validation.problems.
      required: [id, module, status, revision, branch_id, payload, validation, created_by, updated_by, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        module:
          type: string
          enum: [orders]
        status:
          $ref: "#/components/schemas/OrdersDraftStatus"
        revision:
          type: integer
          format: int64
        branch_id:
          type: string
          format: uuid
        subject_id:
          type: string
          format: uuid
          nullable: true
        subject_revision:
          type: integer
          format: int64
          nullable: true
        payload:
          type: object
          description: The order create or update request as JSON.
        validation:
          type: object
          required: [ready]
          properties:
            ready:
              type: boolean
            problems:
              type: array
              items:
                $ref: "#/components/schemas/WireErrorDetail"
        created_by:
          $ref: "#/components/schemas/OrdersDraftActor"
        updated_by:
          $ref: "#/components/schemas/OrdersDraftActor"
        promoted:
          type: object
          nullable: true
          properties:
            entity_id:
              type: string
              format: uuid
            number:
              type: string
              nullable: true
            at:
              type: string
            by:
              $ref: "#/components/schemas/OrdersDraftActor"
        discarded:
          type: object
          nullable: true
          properties:
            at:
              type: string
            by:
              $ref: "#/components/schemas/OrdersDraftActor"
        created_at:
          type: string
        updated_at:
          type: string
    OrdersDraftCreateRequest:
      type: object
      required: [payload]
      properties:
        payload:
          type: object
          description: The order create (or, with subject_id, update) request as JSON; at most 256 KiB.
        subject_id:
          type: string
          format: uuid
        subject_revision:
          type: integer
          format: int64
