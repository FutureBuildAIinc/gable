#
# The partner module, transcribed from internal/partner as it behaves today.
# These routes sit behind the ERP's JWT auth and then a second gate that
# resolves the JWT's email to a customer: an email no customer carries (or an
# inactive customer) is a 403. The quotes are the ERP's own quote model, the
# same shape /api/v1/quotes serves, and the list is a bare array, never null.
# Quirks preserved: the dashboard's money fields are float dollars; every
# failure on the one-quote read, someone else's quote included, is the
# handler's fixed 404.
paths:
  /api/partner/v1/dashboard:
    get:
      operationId: partnerDashboard
      tags: [partner]
      summary: The partner's balance snapshot
      description: Balance due and credit limit for the customer the caller's email resolves to.
      responses:
        "200":
          description: The AR snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartnerDashboard"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The caller's email resolves to no customer, or to an inactive one; the standard error envelope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/partner/v1/quotes:
    get:
      operationId: partnerListQuotes
      tags: [partner]
      summary: The partner's quotes
      description: The customer's quotes in the ERP's own quote shape; a bare array, never null.
      responses:
        "200":
          description: The quotes, a bare array, never null.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Quote"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The caller's email resolves to no customer, or to an inactive one; the standard error envelope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/partner/v1/quotes/{id}:
    get:
      operationId: partnerGetQuote
      tags: [partner]
      summary: One quote
      description: >-
        The ERP's own quote shape. Every failure, a quote that does not
        exist, one belonging to another customer, and a repository fault,
        is the handler's fixed 404.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The quote.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The caller's email resolves to no customer, or to an inactive one; the standard error envelope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  schemas:
    PartnerDashboard:
      type: object
      required: [balance_due, credit_limit]
      properties:
        balance_due:
          type: number
          description: Float dollars.
        credit_limit:
          type: number
          description: Float dollars.
