        customer_name:
          type: string
        expires_at:
          type: [string, "null"]
          format: date-time
        can_decide:
          type: boolean
        lines:
          type: array
          items:
            type: object
            required: [description, quantity, uom, price_uom, unit_price_ten_thousandths, line_total_cents]
            properties:
