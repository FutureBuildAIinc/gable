          format: int64
        delta_cents:
          type: integer
          format: int64
        captured_margin_cents:
          type: integer
          format: int64
        projected_margin_cents:
          type: integer
          format: int64
        lines:
          type: array
          items:
            type: object
            required: [line_id, product_id, sku, description, quantity, uom, captured_cost_cents, current_cost_cents, delta_cents]
            properties:
              line_id:
                type: string
                format: uuid
              product_id:
                type: string
                format: uuid
              sku:
                type: string
              description:
                type: string
              quantity:
                type: string
              uom:
                type: string
              captured_cost_cents:
