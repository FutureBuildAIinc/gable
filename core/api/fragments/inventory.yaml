#
# The inventory module. The read is on the wire contract (C3-1b, ADR 0006
# 7.2): the levels list as the ADR 0001 envelope with scale 4 decimal string
# quantities in the product's stocking unit, `available` and `uom` beside them,
# and the product summary under include=product. The two writes stay on their
# legacy shapes until C4-1 converts the module's write side.
paths:
  /api/v1/inventory:
    get:
      operationId: inventoryList
      tags:
      - inventory
      summary: List inventory levels
      description: >-
        The keyset envelope of ADR 0001 section 1, ordered created_at DESC,
        id DESC (ADR 0006 7.2). Every quantity is a scale 4 decimal string in
        the product's stocking unit, with available (quantity - allocated) and
        uom beside it. The list is held to the branch wall: a context branch
        (X-Branch-Id) lists its own rows; with no context branch a bound
        non-admin user lists the branches granted to the user, none granted
        listing none; an administrator without a header, an unbound key, the
        single-branch switch and callers with no branch context at all list
        every branch's. A legacy row with no location_id has no branch on its
        joined location and stays visible to an administrator without a header
        and to callers with no branch context only (C4-1 migrates legacy rows
        onto locations). product_id and location_id are optional filters; a
        request without product_id is the whole levels list, where the base
        refused it with 400.
      parameters:
      - $ref: '#/components/parameters/PageLimit'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Include'
        # include=total counts the filtered set; include=product embeds the
        # product summary in every row.
      - name: product_id
        in: query
        required: false
        description: Only the named product's rows. A value that is not a UUID is a 400 naming it.
        schema:
          type: string
          format: uuid
      - name: location_id
        in: query
        required: false
        description: Only the rows at the named location. A value that is not a UUID is a 400 naming it.
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/XBranchId'
      responses:
        '200':
          description: >-
            The page of inventory levels. items is never null; total is
            present only under include=total; each row's product is present
            only under include=product.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryLevelPage'
        '400':
          $ref: '#/components/responses/BadRequestEither'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenEither'
        '500':
          $ref: '#/components/responses/InternalErrorEither'
  /api/v1/inventory/adjust:
    post:
      operationId: inventoryAdjust
      tags:
      - inventory
      summary: Adjust inventory (cycle count)
      description: A result that would leave negative stock answers 500.
      parameters:
      - $ref: '#/components/parameters/XBranchId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockAdjustmentRequest'
      responses:
        '200':
          description: Adjusted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryStatusAck'
        '400':
          $ref: '#/components/responses/BadRequestEither'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenEither'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/inventory/transfer:
    post:
      operationId: inventoryTransfer
      tags:
      - inventory
      summary: Transfer inventory between locations
      description: A cross-branch move, a non positive quantity or insufficient unallocated stock answers
        500.
      parameters:
      - $ref: '#/components/parameters/XBranchId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockMovementRequest'
      responses:
        '200':
          description: Transferred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryStatusAck'
        '400':
          $ref: '#/components/responses/BadRequestEither'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenEither'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  schemas:
    InventoryLevel:
      type: object
      description: >-
        One inventory row on the wire (ADR 0006 7.2): the quantities as scale
        4 decimal strings in the product's stocking unit, available as
        quantity - allocated, and the location's name beside its id. The
        product summary is present only under include=product.
      required:
      - id
      - product_id
      - location_id
      - location_name
      - quantity
      - allocated
      - available
      - uom
      - updated_at
      properties:
        id:
          type: string
          format: uuid
        product_id:
          type: string
          format: uuid
        location_id:
          type:
          - string
          - 'null'
          format: uuid
          description: The location the stock sits at; null on a legacy row that never had one.
        location_name:
          type: string
          description: The location's path, or the row's deprecated free text when it has none.
        quantity:
          type: string
          description: On hand, in the product's stocking unit.
        allocated:
          type: string
          description: Reserved, in the product's stocking unit.
        available:
          type: string
          description: quantity - allocated, in the product's stocking unit.
        uom:
          $ref: '#/components/schemas/UOM'
        product:
          $ref: '#/components/schemas/InventoryProductSummary'
        updated_at:
          type: string
          format: date-time
    InventoryProductSummary:
      type: object
      description: >-
        The product an inventory row stocks, embedded under include=product
        (the expansion ADR 0001 section 1 names): the identity fields a levels
        screen shows beside the numbers, with the stocking unit the quantities
        are counted in.
      required:
      - id
      - sku
      - description
      - stock_uom
      properties:
        id:
          type: string
          format: uuid
        sku:
          type: string
        description:
          type: string
        stock_uom:
          $ref: '#/components/schemas/UOM'
    InventoryLevelPage:
      type: object
      required: [items, next_cursor, limit]
      description: The list envelope of ADR 0001 section 1. items is never null; total is present only under include=total.
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/InventoryLevel'
        next_cursor:
          type: [string, "null"]
        limit:
          type: integer
        total:
          type: integer
          format: int64
    StockAdjustmentRequest:
      type: object
      required:
      - product_id
      - quantity
      properties:
        product_id:
          type: string
          format: uuid
        location_id:
          type:
          - string
          - 'null'
          format: uuid
        quantity:
          type: number
          description: The new quantity, or the delta when is_delta is true.
        reason:
          type: string
        is_delta:
          type: boolean
          description: If true, add or subtract; if false, replace.
    StockMovementRequest:
      type: object
      required:
      - product_id
      - to_location_id
      - quantity
      properties:
        product_id:
          type: string
          format: uuid
        from_location_id:
          type:
          - string
          - 'null'
          format: uuid
        to_location_id:
          type: string
          format: uuid
        quantity:
          type: number
        reason:
          type: string
    InventoryStatusAck:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - ok
