#
# The product configurator on the wire contract of ADR 0001 (item C5-1b):
# the one error envelope and the strict query posture on every route. The
# rule matrix and the presets are seeded master data, so their lists are the
# plain master array of the charge codes precedent (no cursor, no keyset) and
# the module owns no write, no audit row and no event. A preset's config is
# the JSON the dealer stored, not a base64 string. Every route registers
# under the millwork app (404 app_disabled when it is off) and the admin,
# owner or sales guard.
paths:
  /api/v1/configurator/rules:
    get:
      operationId: configuratorListRules
      tags: [configurator]
      summary: List every configurator rule
      description: >-
        The whole rule matrix, the charge codes master shape: ordered by
        dependency type and value, then attribute type and value, never null.
        A query parameter the route does not declare is a 400
        unsupported_query_parameter.
      responses:
        "200":
          description: The full rule set.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConfiguratorRule"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/AppDisabled" }
        "500": { $ref: "#/components/responses/InternalErrorEither" }
  /api/v1/configurator/options:
    get:
      operationId: configuratorListOptions
      tags: [configurator]
      summary: List the allowed values of one attribute
      description: >-
        The values the attribute may take under the current selections,
        deterministically ordered by value. attribute_type is required; the
        selections ride as one parameter, a comma separated list of
        Type=Value pairs (selections=Species=SYP,Treatment=None), so the
        route declares exactly the two names it reads (the base consumed
        every unknown query name as a selection and never said so). With no
        selections, or when no rule matches them, the static defaults for
        the attribute answer (an empty array for an unknown attribute). A
        parameter the route does not declare, a missing attribute_type or a
        malformed selections value is a 400.
      parameters:
        - name: attribute_type
          in: query
          required: true
          description: The attribute to list values for, for example Species, Grade, Treatment, Dimensions, ProductType.
          schema:
            type: string
        - name: selections
          in: query
          required: false
          description: The current selections as Type=Value pairs, comma separated.
          schema:
            type: string
      responses:
        "200":
          description: The values with their allowed flag. Never null.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConfiguratorAvailableOption"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/AppDisabled" }
        "500": { $ref: "#/components/responses/InternalErrorEither" }
  /api/v1/configurator/presets:
    get:
      operationId: configuratorListPresets
      tags: [configurator]
      summary: List the active presets
      description: >-
        Active presets ordered by name, never null. product_type filters
        (the filter filters); a parameter the route does not declare is a
        400 unsupported_query_parameter.
      parameters:
        - name: product_type
          in: query
          required: false
          description: Exact match on the preset's product type; absent or empty lists all.
          schema:
            type: string
      responses:
        "200":
          description: The presets.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConfiguratorPreset"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/AppDisabled" }
        "500": { $ref: "#/components/responses/InternalErrorEither" }
  /api/v1/configurator/validate:
    post:
      operationId: configuratorValidate
      tags: [configurator]
      summary: Validate a set of selections against the rules
      description: >-
        The body is capped at 64 KiB; an oversized or malformed body, or an
        empty selections map, is a 400 naming the field. A rule conflict is
        a 200 with valid false and the conflicts listed (conflicts is always
        an array, never omitted). The verdict is deterministic: the same
        selections always answer the same conflicts in the same order.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfiguratorValidateRequest"
      responses:
        "200":
          description: The verdict.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfiguratorValidateResponse"
        "400": { $ref: "#/components/responses/BadRequestEither" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/AppDisabled" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "500": { $ref: "#/components/responses/InternalErrorEither" }
  /api/v1/configurator/build-sku:
    post:
      operationId: configuratorBuildSku
      tags: [configurator]
      summary: Build a non stock SKU from selections
      description: >-
        The body is capped at 64 KiB. Product type and selections are both
        required. The selections are validated first; a conflict is a 400
        validation_failed whose details carry one config_conflict blocker per
        violated rule (the base answered one fixed message and never said
        which rules). The SKU is NS, the product type code, then the
        Species, Grade, Treatment and Dimensions selections upper cased with
        spaces as hyphens; the keys other than those four are ignored.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfiguratorBuildSKURequest"
      responses:
        "200":
          description: The generated SKU and description.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfiguratorBuildSKUResponse"
        "400": { $ref: "#/components/responses/BadRequestEither" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/AppDisabled" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "500": { $ref: "#/components/responses/InternalErrorEither" }
components:
  schemas:
    ConfiguratorRule:
      type: object
      required: [id, attribute_type, attribute_value, depends_on_type, depends_on_value, is_allowed, error_message, created_at, updated_at]
      description: >-
        One dependency rule. error_message is present as null when the
        database value is null, never omitted (ADR 0001 section 12).
      properties:
        id:
          type: string
          format: uuid
        attribute_type:
          type: string
        attribute_value:
          type: string
        depends_on_type:
          type: string
        depends_on_value:
          type: string
        is_allowed:
          type: boolean
        error_message:
          type: [string, "null"]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ConfiguratorPreset:
      type: object
      required: [id, name, description, product_type, config, is_active, created_at, updated_at]
      description: >-
        One preset. config is the JSON the dealer stored, carried as JSON (it
        serialized as a base64 string before the conversion); description is
        present as null when the database value is null.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: [string, "null"]
        product_type:
          type: string
        config:
          description: The preset's attribute selections, as stored.
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ConfiguratorAvailableOption:
      type: object
      required: [value, allowed, message]
      description: One value with its verdict; message is present as null when no rule explained a refusal.
      properties:
        value:
          type: string
        allowed:
          type: boolean
        message:
          type: [string, "null"]
          description: Why the value is disallowed.
    ConfiguratorValidateRequest:
      type: object
      required: [selections]
      description: An empty map is a 400 naming selections.
      properties:
        selections:
          type: object
          additionalProperties:
            type: string
          description: Attribute type to chosen value, for example Species to SYP.
    ConfiguratorValidationConflict:
      type: object
      required: [attribute_type, attribute_value, depends_on_type, depends_on_value, message]
      properties:
        attribute_type:
          type: string
        attribute_value:
          type: string
        depends_on_type:
          type: string
        depends_on_value:
          type: string
        message:
          type: string
    ConfiguratorValidateResponse:
      type: object
      required: [valid, conflicts]
      description: conflicts is always an array, empty when the selections are valid.
      properties:
        valid:
          type: boolean
        conflicts:
          type: array
          items:
            $ref: "#/components/schemas/ConfiguratorValidationConflict"
    ConfiguratorBuildSKURequest:
      type: object
      required: [product_type, selections]
      description: An empty product type or an empty selections map is a 400 naming the field.
      properties:
        product_type:
          type: string
          description: Lumber, Door, Trim or Panel map to LBR, DR, TRM and PNL; any other value is upper cased and cut to three characters.
        selections:
          type: object
          additionalProperties:
            type: string
    ConfiguratorBuildSKUResponse:
      type: object
      required: [sku, description]
      properties:
        sku:
          type: string
        description:
          type: string
