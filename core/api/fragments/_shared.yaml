#
# Shared wire shapes every module fragment reuses. These are TODAY's shapes,
# transcribed from core/pkg/httputil, core/pkg/pagination, core/pkg/middleware
# and core/internal/integrations/handler.go as they behave at the base; the
# conversions of ADR 0001 replace them module by module, each replacement
# editing this fragment in the same change. Underscore prefixed fragments
# carry components only (no paths).
paths: {}
components:
  securitySchemes:
    BearerJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        The user JWT the auth middleware verifies against the configured JWKS
        issuer. Role guards run per module (the census column in ROUTES.txt
        names the registering module; cmd/server/main.go names the roles each
        module registers with). AUTH_MODE=dev disables verification entirely.
    IntegrationKey:
      type: apiKey
      in: header
      name: X-Integration-Key
      description: >-
        The shared integration key of the AI load management seam, compared in
        constant time. When no key is configured the whole seam answers 503
        before the handler runs.
  parameters:
    PageLimit:
      name: limit
      in: query
      required: false
      description: >-
        Page size of a converted list, 1 to 200, default 50. Anything else is
        a 400 naming limit (ADR 0001 section 2); it is never clamped.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      required: false
      description: >-
        The opaque cursor of the previous page's next_cursor, passed back
        verbatim. A malformed cursor, or one minted for another ordering, is a
        400 naming cursor.
      schema:
        type: string
    Include:
      name: include
      in: query
      required: false
      description: >-
        A comma separated list of expansions. total adds the count of rows
        matching the filters, which costs a second query and is therefore
        opt in.
      schema:
        type: string
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: >-
        The document revision the client read, in quotes ("3"; the weak form
        W/"3" is accepted too). The body's revision field is the alternative;
        a write carrying neither is 428, a stale one 409 stale_revision, and
        * or a list of tags is a 400.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      description: >-
        Page size. Unparseable, non positive or over maximum values are
        silently ignored and the default applies; the value is never refused
        today.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Offset:
      name: offset
      in: query
      description: >-
        Page offset. Unparseable or negative values are silently ignored and
        the default applies.
      schema:
        type: integer
        minimum: 0
        default: 0
    XBranchId:
      name: X-Branch-Id
      in: header
      required: false
      description: >-
        Branch scope for modules registered behind the branch middleware
        (quote, customer, order, invoice in this fragment set). A missing
        header passes for admins and in dev mode; with default_branch_required
        on, a non admin without it is refused. A non UUID value is a 400 and a
        branch the caller has no grant for is a 403.
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >-
        Opt in idempotent replay for POST, PUT and PATCH. The legacy name
        X-Idempotency-Key addresses the same claim. Claims are stored in
        Postgres and survive a restart; only 2xx and 3xx responses are stored.
      schema:
        type: string
        minLength: 1
        maxLength: 255
  responses:
    WireNotFound:
      description: The addressed resource does not exist, or is not visible to the caller.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WireError"
    WireConflict:
      description: >-
        The write conflicts with the resource's state: stale_revision,
        invalid_state_transition, duplicate, idempotency_in_progress or
        conflict.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WireError"
    WirePreconditionRequired:
      description: The write needs If-Match or a body revision and carries neither.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WireError"
    BadRequest:
      description: >-
        A handler (or the branch middleware) cannot consume the request. The
        body is the standard error envelope; the message is the generic status
        text, and the specific message goes to the server log only. POST, PUT
        and PATCH operations that take an Idempotency-Key use BadRequestEither.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: >-
        No or invalid credentials. The auth layer (pkg/middleware respondAuthError)
        answers every route with the ADR 0001 error envelope, code unauthorized.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WireError"
    HandlerUnauthorized:
      description: >-
        No or invalid credentials on a route whose handler also checks the
        claims itself. The auth layer answers with the ADR 0001 envelope; a
        handler reached without claims (AUTH_MODE=dev mounts no auth layer)
        answers with the legacy Error envelope.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/WireError"
              - $ref: "#/components/schemas/Error"
    Forbidden:
      description: >-
        The caller's roles, or a machine key's scopes, do not include one the
        route requires. The role guard and the machine key check answer every
        route with the ADR 0001 error envelope, code forbidden.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WireError"
    NotFound:
      description: The addressed resource does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: >-
        A handler reports that the write conflicts with the resource's current
        state (the standard error envelope). Operations that take an
        Idempotency-Key use ConflictEither.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnprocessableEntity:
      description: >-
        The idempotency layer refused an Idempotency-Key reused with a request
        whose method, path, query or body differs from the original (code
        idempotency_key_reused). Written by middleware, so the ADR 0001
        envelope.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WireError"
    UnprocessableEntityEither:
      description: >-
        Either the handler refused the operation as semantically invalid (the
        standard error envelope, code UNPROCESSABLE_ENTITY), or the idempotency
        layer refused a reused Idempotency-Key (the ADR 0001 envelope, code
        idempotency_key_reused).
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/Error"
              - $ref: "#/components/schemas/WireError"
    IdempotencyConflict:
      description: >-
        The Idempotency-Key is already in progress under a concurrent request
        (code idempotency_in_progress). Written by the idempotency layer, so
        the ADR 0001 envelope. The operation raises no 409 of its own.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WireError"
    ConflictEither:
      description: >-
        Either the handler reports a conflict with the resource's current state
        (the standard error envelope, code CONFLICT), or the idempotency layer
        reports the Idempotency-Key in progress (the ADR 0001 envelope, code
        idempotency_in_progress).
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/Error"
              - $ref: "#/components/schemas/WireError"
    BadRequestEither:
      description: >-
        Either the handler cannot consume the request (the standard error
        envelope, code BAD_REQUEST, generic message), or the idempotency layer
        rejects the Idempotency-Key header or the body read (the ADR 0001
        envelope, codes validation_failed and bad_request, one details entry
        per fault).
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/Error"
              - $ref: "#/components/schemas/WireError"
    IdempotencyBadRequest:
      description: >-
        The idempotency layer rejects an Idempotency-Key that is not 1 to 255
        printable ASCII characters (code validation_failed) or a body it cannot
        read (code bad_request). Written by middleware, so the ADR 0001
        envelope. The operation raises no 400 of its own.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WireError"
    PayloadTooLarge:
      description: >-
        An Idempotency-Key was sent and the body exceeds the request size
        limit (code payload_too_large). Written by the idempotency layer, so
        the ADR 0001 envelope.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WireError"
    ForbiddenEither:
      description: >-
        Either the role guard or the machine key scope check refused the caller
        (the ADR 0001 envelope, code forbidden), or the branch middleware found
        no grant for the X-Branch-Id (the standard error envelope, code
        FORBIDDEN).
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/WireError"
              - $ref: "#/components/schemas/Error"
    InternalErrorEither:
      description: >-
        An unexpected server fault. A converted handler answers with the ADR
        0001 envelope (code internal_error, the fixed message "internal
        error"); the branch middleware's access lookup failing answers with the
        standard error envelope (code INTERNAL_ERROR).
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/WireError"
              - $ref: "#/components/schemas/Error"
    LegacyUnauthorized:
      description: >-
        No or invalid portal credentials. The portal auth middleware answers
        with httputil.RespondError, so the standard error envelope.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    LegacyForbidden:
      description: >-
        A portal handler refused the caller. Portal handlers answer with
        httputil.RespondError, so the standard error envelope.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    WireBadRequest:
      description: >-
        The request cannot be consumed or fails validation. The body is the
        ADR 0001 error envelope: lowercase code, the handler's own message in
        full, one details entry per offending field or blocker.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WireError"
    WireInternalError:
      description: >-
        An unexpected server fault in the ADR 0001 error envelope. The message
        is always the fixed string "internal error" and details is omitted.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WireError"
    WireUnavailable:
      description: >-
        A dependency the route needs is down, in the ADR 0001 error envelope
        (code unavailable); retry later.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WireError"
    PaymentRequired:
      description: The card charge or its persistence failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: Unexpected server fault (also today's status for most service level validation failures).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServiceUnavailable:
      description: A dependency the route needs is not configured.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    IntegrationUnauthorized:
      description: The X-Integration-Key is missing or wrong (the integration seam's own error body, not the standard envelope).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/IntegrationError"
    IntegrationUnavailable:
      description: No integration key is configured, so the whole seam is closed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/IntegrationError"
  schemas:
    Error:
      type: object
      required: [error, meta]
      description: >-
        The standard error envelope written by httputil.RespondError. The
        message is always the generic status text; the handler's specific
        message is server log only. request_id echoes the X-Request-ID
        response header.
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [BAD_REQUEST, UNAUTHORIZED, FORBIDDEN, NOT_FOUND, CONFLICT, RATE_LIMITED, UNPROCESSABLE_ENTITY, PAYMENT_REQUIRED, INTERNAL_ERROR]
            message:
              type: string
              description: Generic status text such as "Bad Request".
        meta:
          type: object
          required: [request_id]
          properties:
            request_id:
              type: string
    WireError:
      type: object
      required: [error, meta]
      description: >-
        The ADR 0001 section 3 error envelope, written by
        internal/platform/httpx.WriteError. Converted modules answer with it;
        routes not yet converted keep the Error envelope above. code is a
        stable lowercase snake_case machine code, message the handler's own
        message (the fixed string "internal error" on a 500), details one
        entry per reason (omitted when empty).
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - bad_request
                - validation_failed
                - unsupported_query_parameter
                - unauthorized
                - forbidden
                - not_found
                - method_not_allowed
                - stale_revision
                - duplicate
                - idempotency_in_progress
                - invalid_state_transition
                - conflict
                - precondition_failed
                - payload_too_large
                - unsupported_media_type
                - idempotency_key_reused
                - precondition_required
                - rate_limited
                - internal_error
                - unavailable
            message:
              type: string
            details:
              type: array
              items:
                $ref: "#/components/schemas/WireErrorDetail"
        meta:
          type: object
          required: [request_id]
          properties:
            request_id:
              type: string
              description: The request id, equal to the X-Request-ID response header.
    WireErrorDetail:
      type: object
      required: [message]
      description: >-
        One reason. A field entry names the field (a body JSON path, a query
        parameter name, or cursor); a blocker carries code and no field.
      properties:
        field:
          type: string
        message:
          type: string
        code:
          type: string
    IntegrationError:
      type: object
      required: [error]
      description: The integration seam's own error body, a bare message string.
      properties:
        error:
          type: string
    ExposureBlock:
      type: object
      required: [error, code, exposure]
      description: >-
        The raw 409 payload the order module writes when the lumber index
        exposure gate blocks a confirm, fulfill or gate check. This is not
        the standard error envelope.
      properties:
        error:
          type: string
          enum: [unresolved index exposure on source quote]
        code:
          type: string
          enum: [UNRESOLVED_EXPOSURE]
        exposure:
          type: object
          required: [quote_id, state, exposure_dollars, indexes]
          properties:
            quote_id:
              type: string
              format: uuid
            quote_short_id:
              type: string
            state:
              type: string
              description: The exposure state vocabulary (ACK_REQUIRED, BLOCKED and neighbors).
            exposure_dollars:
              type: number
            indexes:
              type: array
              items:
                type: string
            salesperson_id:
              type: [string, "null"]
              format: uuid
            salesperson_name:
              type: [string, "null"]
            required_action:
              type: string
            last_checked_at:
              type: [string, "null"]
              format: date-time
