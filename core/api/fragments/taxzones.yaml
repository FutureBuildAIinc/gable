#
# The tax zone tables (CP-10): the dealer maintained zones a delivered sale's
# tax is sourced to. A zone maps a place of receipt (a postal code, a postal
# code range, or a Canadian province) to a jurisdiction and its rate parts;
# the combined rate is the sum of the live parts and is never stored. Roles
# admin, owner and finance guard every route.
paths:
  /api/v1/tax/setup:
    get:
      operationId: taxSetupGet
      tags: [tax]
      summary: Read the tax setup warnings
      description: >-
        Roles admin, owner, finance. The Tech Admin tax setup panel's standing
        warnings (CP-14): whether a branch is Canadian, whether the dealer
        charges GST with no GST/HST number on file (never a refusal: documents
        print a notice), and the provinces of active Canadian ship-tos that no
        live zone covers, where a delivery is refused tax_parts_not_configured
        until its zone is added. A dealer with no Canadian branch has none.
      responses:
        "200":
          description: The warnings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaxSetup"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/v1/tax/zones:
    get:
      operationId: taxZoneList
      tags: [tax]
      summary: List tax zones
      description: >-
        Roles admin, owner, finance. Every zone, newest first, each with its
        rate parts and its boundaries. The country and jurisdiction_type
        filters are optional; country matches the two letter code and
        jurisdiction_type must be STA, CTY, CIT, STJ or PROV (400 otherwise).
      parameters:
        - name: country
          in: query
          schema: { type: string }
        - name: jurisdiction_type
          in: query
          schema: { type: string, enum: [STA, CTY, CIT, STJ, PROV] }
      responses:
        "200":
          description: The zones.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TaxZone"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      operationId: taxZoneCreate
      tags: [tax]
      summary: Create a tax zone
      description: >-
        Roles admin, owner, finance. country (two letters), jurisdiction_code,
        jurisdiction_type (STA, CTY, CIT, STJ, PROV) and effective_from are
        required, with at least one rate part and, for a postal zone, at least
        one boundary. zone_kind defaults POSTAL; a PROVINCE zone needs
        province_code. sourcing defaults DESTINATION. Rates are decimal
        fractions between 0 and 1, such as 0.06.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaxZoneCreateRequest"
      responses:
        "201":
          description: The created zone.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaxZone"
        "400": { $ref: "#/components/responses/BadRequestEither" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/IdempotencyConflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/v1/tax/zones/{id}:
    get:
      operationId: taxZoneGet
      tags: [tax]
      summary: Read a tax zone
      description: Roles admin, owner, finance. The zone with its rate parts and its boundaries.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The zone.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaxZone"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      operationId: taxZoneDelete
      tags: [tax]
      summary: Delete a tax zone no document used
      description: >-
        Roles admin, owner, finance. A zone that an order or an invoice was
        taxed under answers 409: it is closed, never deleted, because the
        sale that used it must stay explainable from the records.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: The zone is gone.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/v1/tax/zones/{id}/close:
    post:
      operationId: taxZoneClose
      tags: [tax]
      summary: Close a tax zone
      description: >-
        Roles admin, owner, finance. Ends the zone's effective window on the
        named date, so sales before it keep the rate they were charged. A
        replacement rate is a new zone (or new rate parts from a later
        effective date), never an overwrite.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaxZoneCloseRequest"
      responses:
        "200":
          description: The closed zone.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaxZone"
        "400": { $ref: "#/components/responses/BadRequestEither" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "500": { $ref: "#/components/responses/InternalError" }
components:
  schemas:
    DocumentTaxLine:
      type: object
      description: >-
        One printed tax line of a Canadian document (CP-14): BC's PST must stand
        as its own item, and GST prints as its own line at every total.
      required: [part, label, rate_percent, cents, exempt]
      properties:
        part:
          type: string
          description: GOODS_TAX or PROVINCIAL_SALES_TAX.
        label:
          type: string
          description: GST, or HST in a harmonized province; PST in BC and SK, RST in MB; the part's name in Quebec until its rendering lands.
        rate_percent:
          type: string
          description: The part's rate as a percent without trailing zeros ("5").
        cents:
          type: integer
          format: int64
          description: The part's own tax, rounded on its own.
        exempt:
          type: boolean
          description: The part was exempted (PST exemptions land with A2); false today.
    TaxSetup:
      type: object
      required: [canadian, gst_hst_number_missing, unzoned_provinces, incomplete_ship_tos]
      properties:
        canadian:
          type: boolean
          description: A branch's country (its own, else the dealer default) is CA.
        gst_hst_number_missing:
          type: boolean
          description: Canadian, not marked not registered for GST/HST, and no GST/HST number on file.
        unzoned_provinces:
          type: array
          items:
            type: object
            required: [province, name, ship_tos]
            properties:
              province:
                type: string
                description: The ship-tos' region as typed, upper cased (BC, AB).
              name:
                type: string
                description: The province's name, or the code when it is not a Canadian province code.
              ship_tos:
                type: integer
                format: int64
                description: How many active ship-tos sit there.
        incomplete_ship_tos:
          type: integer
          format: int64
          description: >-
            Active ship-tos with no country, or a Canadian one with no province: no zone can
            answer them, so a delivery there is refused until the address is completed.
    TaxZoneRatePart:
      type: object
      required: [name, rate, effective_from]
      properties:
        name:
          type: string
          enum: [STATE, COUNTY, CITY, DISTRICT, GOODS_TAX, PROVINCIAL_SALES_TAX]
        rate: { type: string, description: "The decimal fraction, such as 0.060000." }
        effective_from: { type: string, description: YYYY-MM-DD }
        effective_to: { type: string, description: YYYY-MM-DD, absent while the part lives }
    TaxZoneBoundary:
      type: object
      required: [country, postal_code_low, postal_code_high]
      properties:
        country: { type: string, description: ISO 3166-1 alpha-2 }
        postal_code_low: { type: string }
        postal_code_high: { type: string, description: Equals postal_code_low for an exact code }
        extension_low: { type: string, description: The plus four the boundary narrows to, when it knows it }
        extension_high: { type: string }
    TaxZone:
      type: object
      required: [id, country, jurisdiction_code, jurisdiction_type, jurisdiction_name, zone_kind, sourcing, effective_from, data_source, data_version, rates, boundaries]
      properties:
        id: { type: string, format: uuid }
        country: { type: string }
        jurisdiction_code: { type: string }
        jurisdiction_type: { type: string, enum: [STA, CTY, CIT, STJ, PROV] }
        jurisdiction_name: { type: string }
        state_code: { type: string }
        county_code: { type: string }
        place_code: { type: string }
        province_code: { type: string, description: Set on a province zone }
        zone_kind: { type: string, enum: [POSTAL, PROVINCE] }
        sourcing: { type: string, enum: [ORIGIN, DESTINATION, BOTH] }
        effective_from: { type: string, description: YYYY-MM-DD }
        effective_to: { type: [string, "null"], description: YYYY-MM-DD while the zone lives }
        data_source: { type: string, description: Where the rate came from }
        data_version: { type: string, description: Which version of the published data }
        rates:
          type: array
          items:
            $ref: "#/components/schemas/TaxZoneRatePart"
        boundaries:
          type: array
          items:
            $ref: "#/components/schemas/TaxZoneBoundary"
    TaxZoneCreateRequest:
      type: object
      required: [country, jurisdiction_code, effective_from, rates]
      properties:
        country: { type: string, description: Two letter code }
        jurisdiction_code: { type: string }
        jurisdiction_type: { type: string, enum: [STA, CTY, CIT, STJ, PROV] }
        jurisdiction_name: { type: string }
        state_code: { type: string }
        county_code: { type: string }
        place_code: { type: string }
        province_code: { type: string, description: Required on a PROVINCE zone }
        zone_kind: { type: string, enum: [POSTAL, PROVINCE], description: Defaults POSTAL }
        sourcing: { type: string, enum: [ORIGIN, DESTINATION, BOTH], description: Defaults DESTINATION }
        effective_from: { type: string, description: YYYY-MM-DD }
        data_source: { type: string }
        data_version: { type: string }
        rates:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/TaxZoneRatePart"
        boundaries:
          type: array
          description: Required on a POSTAL zone; a boundary's country defaults to the zone's when omitted.
          items:
            $ref: "#/components/schemas/TaxZoneBoundary"
    TaxZoneCloseRequest:
      type: object
      required: [effective_to]
      properties:
        effective_to: { type: string, description: YYYY-MM-DD }
