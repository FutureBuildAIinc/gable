#
# The project module on the wire contract of ADR 0001 (item C5-1b): the
# cursor list envelope with a working status filter, the one error envelope,
# a lowercase status, a revision with its ETag on every record and the
# If-Match precondition on the update, and every mutation's audit row and
# project.* event in one transaction. The routes live under the portal
# prefix and share its session (the portal_token cookie or bearer JWT), and
# every read and write is scoped to the customer the portal chain
# identifies: another customer's project is a 404. Dashboard item totals are
# integer cents (total_cents), never floats.
paths:
  /api/portal/v1/projects:
    get:
      operationId: projectList
      tags: [project]
      summary: The customer's jobs
      description: >-
        The cursor list envelope, newest first on (created_at, id). status
        filters (lowercase); total appears only under include=total. A
        parameter the route does not declare, a status outside the lowercase
        vocabulary, a malformed cursor or an out of range limit is a 400.
      security:
        - PortalSession: []
      parameters:
        - name: status
          in: query
          required: false
          description: One lowercase status.
          schema:
            type: string
            enum: [active, completed]
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Include"
      responses:
        "200":
          description: The page of projects.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectPage"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/LegacyUnauthorized"
        "500":
          $ref: "#/components/responses/InternalErrorEither"
    post:
      operationId: projectCreate
      tags: [project]
      summary: Create a job
      description: >-
        name is required (1 to 255 characters); the project starts active and
        no status is accepted on create. Writes the audit row project.created
        and the event project.created in the same transaction, the event last.
      security:
        - PortalSession: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectRequest"
      responses:
        "201":
          description: The created project, with its ETag and a Location header.
          headers:
            ETag:
              description: The record's revision in quotes, for example "3". Send it back as If-Match.
              schema:
                type: string
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/LegacyUnauthorized"
        "409":
          $ref: "#/components/responses/WireConflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalErrorEither"
  /api/portal/v1/projects/{id}:
    get:
      operationId: projectGetDashboard
      tags: [project]
      summary: One job with its orders, deliveries and invoices
      description: >-
        The dashboard aggregate with the project's ETag. Scoped to the
        caller: another customer's project is a 404. Item statuses are
        lowercase summaries of each document's own status; totals are integer
        cents (null on a delivery, which carries no money).
      security:
        - PortalSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The project and its associated documents.
          headers:
            ETag:
              description: The project's revision in quotes. Send it back as If-Match.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectDashboard"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/LegacyUnauthorized"
        "404":
          $ref: "#/components/responses/WireNotFound"
        "500":
          $ref: "#/components/responses/InternalErrorEither"
    put:
      operationId: projectUpdate
      tags: [project]
      summary: Rename a job or change its status
      description: >-
        Partial update on the client's revision: If-Match or a body revision,
        neither is 428, a stale one 409 stale_revision, an If-Match of * or a
        list 400, header and body disagreeing 400. Absent fields keep their
        values; status accepts active or completed. Writes the audit row
        project.updated and the event project.updated (with the changed field
        list) in the same transaction, the event last.
      security:
        - PortalSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectRequest"
      responses:
        "200":
          description: The updated project at its new revision, with its ETag.
          headers:
            ETag:
              description: The new revision in quotes.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/LegacyUnauthorized"
        "404":
          $ref: "#/components/responses/WireNotFound"
        "409":
          $ref: "#/components/responses/WireConflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "428":
          $ref: "#/components/responses/WirePreconditionRequired"
        "500":
          $ref: "#/components/responses/InternalErrorEither"
components:
  schemas:
    Project:
      type: object
      required: [id, customer_id, name, status, revision, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        customer_id:
          type: string
          format: uuid
        name:
          type: string
        status:
          type: string
          description: Lowercase on the wire (ADR 0001 section 6). inactive is a storage value the 091 job merge wrote; writes accept active and completed.
          enum: [active, completed, inactive]
        revision:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ProjectPage:
      type: object
      required: [items, next_cursor, limit]
      description: The list envelope of ADR 0001 section 1. items is never null; total is present only under include=total.
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Project"
        next_cursor:
          type: [string, "null"]
          description: Opaque; pass it back verbatim as cursor. Null on the last page.
        limit:
          type: integer
        total:
          type: integer
          format: int64
    ProjectDashboard:
      type: object
      required: [project, orders, deliveries, invoices]
      properties:
        project:
          $ref: "#/components/schemas/Project"
        orders:
          type: array
          description: The project's orders, newest first, never null.
          items:
            $ref: "#/components/schemas/ProjectItem"
        deliveries:
          type: array
          description: The stops of the project's orders, newest first, never null.
          items:
            $ref: "#/components/schemas/ProjectItem"
        invoices:
          type: array
          description: The invoices of the project's orders, newest first, never null.
          items:
            $ref: "#/components/schemas/ProjectItem"
    ProjectItem:
      type: object
      required: [id, type, status, total_cents, created_at, reference]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          description: Lowercase.
          enum: [order, delivery, invoice]
        status:
          type: string
          description: A lowercase summary of the document's own status.
        total_cents:
          type: [integer, "null"]
          format: int64
          description: Integer cents (ADR 0001 section 7); null on a delivery, which carries no money.
        created_at:
          type: string
          format: date-time
        reference:
          type: string
          description: A human label such as "Order 1a2b3c4d".
    ProjectRequest:
      type: object
      description: >-
        The body of the create and the update. Every field problem is
        collected into one 400 with a details entry per field; an unknown
        field is refused. On create only name applies (required); on update
        absent fields keep their values.
      required: []
      properties:
        name:
          type: string
          description: 1 to 255 characters.
        status:
          type: string
          enum: [active, completed]
        revision:
          type: integer
          format: int64
          description: The body revision, on update only. A create carrying one is a 400.
