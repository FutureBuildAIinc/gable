      - uom_qty
      - price_uom_qty
      - unit_price_ten_thousandths
      - priced_unit_price_ten_thousandths
      - price_source
      - override_reason
      - discount_percent
      - discount_cents
      - discount_reason
      - price_adjusted_by
      - line_total_cents
      - taxable
      - revenue_account_code
      - is_special_order
      - vendor_id
      - special_order_unit_cost_ten_thousandths
      - created_at
      - order_line_id
      - unit_cost_ten_thousandths
      - cost_cents
      properties:
        id:
          type: string
          format: uuid
        position:
          type: integer
          description: The line's place on the document; a kit's components follow it.
        line_type:
          $ref: '#/components/schemas/SalesLineType'
