          type:
          - string
          - 'null'
          format: uuid
          description: Set on a component line only, naming its kit line.
        product_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Required on kit and component lines, optional on a product line (null is a non stock item),
            null on charge and text lines.
        charge_code_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Set on a charge line only.
        charge_code:
          type:
          - string
          - 'null'
          description: The charge code's code text, read.
        sku:
          type:
          - string
          - 'null'
          description: A snapshot of the product's SKU.
        description:
          type: string
          description: A snapshot; required on every line.
        quantity:
          type:
          - string
          - 'null'
          description: The quantity as a decimal string with its unit; null only on a text line.
        uom:
          type:
          - string
          - 'null'
          description: The sale unit. On a stocked line it is the product's stocking unit (ADR 0005 section 1).
        price_uom:
          type:
          - string
          - 'null'
          description: The unit the price is per; equals uom unless the pair says otherwise.
        uom_qty:
          type:
          - string
          - 'null'
          description: One side of the conversion pair; 1 and 1 when the units agree (any other pair on equal units
            is a 400).
        price_uom_qty:
          type:
          - string
          - 'null'
          description: The other side of the conversion pair.
        unit_price_ten_thousandths:
          type:
          - integer
          - 'null'
          format: int64
          description: The price charged per price unit, after any override, before any discount.
        priced_unit_price_ten_thousandths:
          type:
          - integer
          - 'null'
          format: int64
          description: What the pricing engine resolved, read only, so an override is visible as the difference;
            null on text, charge and non stock lines.
        price_source:
          $ref: '#/components/schemas/SalesPriceSource'
        override_reason:
          type:
          - string
          - 'null'
          description: Required when price_source is override.
        discount_percent:
          type:
          - string
          - 'null'
          description: A percent at scale 4 as a decimal string, greater than 0 and at most 100; never with discount_cents.
        discount_cents:
          type:
          - integer
          - 'null'
          format: int64
          description: A discount amount in cents, positive; never with discount_percent.
        discount_reason:
          type:
          - string
          - 'null'
          description: Required with either discount.
        price_adjusted_by:
          type:
          - string
          - 'null'
          description: The actor of the last override or discount; the audit row carries the rest.
        line_total_cents:
          type:
          - integer
          - 'null'
          format: int64
          description: The extension, rounded once (ADR 0005 section 2.4); null only on a text line.
        taxable:
          type: boolean
        revenue_account_code:
          type:
          - string
          - 'null'
          description: The charge code's account, snapshotted at create; null on every other line type.
        is_special_order:
          type: boolean
        vendor_id:
          type:
          - string
          - 'null'
          format: uuid
        special_order_unit_cost_ten_thousandths:
          type:
          - integer
          - 'null'
          format: int64
          description: A unit cost at scale 4.
        created_at:
          type: string
          format: date-time
        order_line_id:
          type:
          - string
          - 'null'
          format: uuid
          description: The order line this invoice line bills; null on a note and on a counter charge.
        unit_cost_ten_thousandths: &id006
          type:
          - integer
          - 'null'
          format: int64
          description: 'The cost that left (ADR 0005 8.4) at scale 4, shown to the roles that see margin (admin,
            owner, finance, sales: the roles that reach these routes). Null when the line carries no cost.'
        cost_cents:
          type: integer
          format: int64
          description: The cost of goods relieved from inventory for this line, in cents (ADR 0005 8.4); 0 when
            none.
