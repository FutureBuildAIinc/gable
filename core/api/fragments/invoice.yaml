#
# The invoice and credit memo modules on the wire contract (ADR 0001; ADR 0005
# sections 4, 6 and 8, item C2-3): the cursor list envelope with working
# filters, the one error envelope, a lowercase status with the transitions
# route (an invoice is only voided by a client; its other statuses are derived
# from payments and credit memos), integer _cents money, the scaled unit price,
# quantities and the conversion pair as decimal strings, the shared sales line
# shape of ADR 0005 section 2 on invoice and credit memo lines, a gapless
# document number and a revision with its ETag, the job and ship-to the invoice
# carries, the tax with its source, and the computed is_overdue flag in place of
# the OVERDUE status. The document print and email routes keep their paths.
paths:
  /api/v1/invoices:
    get:
      operationId: invoiceList
      tags:
      - invoice
      summary: List invoices
      description: The cursor list envelope, newest first (created_at, then id). status filters on the lowercase
        lifecycle vocabulary (a comma separated list); customer_id, job_id, ship_to_id and order_id filter on their
        document; overdue=true lists the open invoices past their due date and overdue=false the rest. total appears
        only under include=total. A parameter the route does not declare, a status outside the vocabulary (overdue
        is not one), a malformed cursor or an out of range limit is a 400.
      parameters:
      - name: status
        in: query
        required: false
        description: Comma separated lowercase statuses (unpaid, partial, paid, void, written_off).
        schema:
          type: string
      - name: customer_id
        in: query
        required: false
        description: Filter on the customer.
        schema:
          type: string
          format: uuid
      - name: job_id
        in: query
        required: false
        description: Filter on the job (project).
        schema:
          type: string
          format: uuid
      - name: ship_to_id
        in: query
        required: false
        description: Filter on the ship-to.
        schema:
          type: string
          format: uuid
      - name: order_id
        in: query
        required: false
        description: Filter on the order.
        schema:
          type: string
          format: uuid
      - name: overdue
        in: query
        required: false
        description: 'true: open and past due; false: everything else.'
        schema:
          type: string
          enum:
          - 'true'
          - 'false'
      - $ref: '#/components/parameters/PageLimit'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Include'
      - $ref: '#/components/parameters/XBranchId'
      responses:
        '200':
          description: The page of invoices.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoicePage'
        '400':
          $ref: '#/components/responses/BadRequestEither'
        '401': &id002
          $ref: '#/components/responses/Unauthorized'
        '403': &id003
          $ref: '#/components/responses/ForbiddenEither'
        '500': &id004
          $ref: '#/components/responses/InternalError'
  /api/v1/invoices/{id}:
    get:
      operationId: invoiceGet
      tags:
      - invoice
      summary: Get one invoice with lines
      description: The invoice with every line (id, description, quantity, unit price, line total, cost), its status
        and open amount, and its ETag.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/XBranchId'
      responses:
        '200':
          description: The invoice.
          headers: &id001
            ETag: &id005
              description: The document's revision.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/WireNotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenEither'
  /api/v1/invoices/{id}/transitions:
    post:
      operationId: invoiceTransition
      tags:
      - invoice
      summary: Void an invoice
      description: 'The only client transition is void (roles admin, owner, finance; a reason is required). unpaid,
        partial, paid and written_off are derived by payments and credit memos, so asking for one is 409 invalid_state_transition.
        A void is refused with the blocker has_applications while the invoice has a live application (a payment, an
        applied credit memo, a discount or a write off), and with has_credit_memos while a credit memo that is not void names it. It
        runs in one transaction: it locks the invoice''s order row first, reverses the invoice''s whole journal
        entry (dated the void date), returns its billed stock to on hand, reduces the order lines'' fulfilled quantities,
        re-runs allocation for those quantities and derives the order status; the subledger is credited back. The
        number is kept; nothing deletes an invoice. Writes invoice.voided (and order.backordered when the order
        cannot re-allocate) last.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/XBranchId'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvoiceTransitionRequest'
      responses:
        '200':
          description: The voided invoice.
          headers: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
        '400':
          $ref: '#/components/responses/BadRequestEither'
        '404':
          $ref: '#/components/responses/WireNotFound'
        '409':
          $ref: '#/components/responses/ConflictEither'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '428':
          $ref: '#/components/responses/WirePreconditionRequired'
        '401': *id002
        '403': *id003
        '500': *id004
  /api/v1/invoices/{id}/email:
    post:
      operationId: invoiceEmail
      tags:
      - invoice
      summary: Email invoice to customer
      description: Queues an email to the customer with the invoice PDF attached. Returns 202 Accepted immediately;
        the email is dispatched asynchronously. Fails if the customer has no email address on file.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/XBranchId'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Email queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceEmailResponse'
        '400':
          description: Customer has no email address on file (the standard error envelope), or the Idempotency-Key
            header is malformed (the ADR 0001 envelope).
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/Error'
                - $ref: '#/components/schemas/WireError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenEither'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/credit-memos:
    get:
      operationId: creditMemoList
      tags:
      - credit-memo
      summary: List credit memos
      description: The cursor list envelope, newest first. status filters on the lowercase vocabulary (draft, open,
        partial, applied, void; a comma separated list); customer_id, invoice_id and job_id filter on their document.
        total appears only under include=total.
      parameters:
      - name: status
        in: query
        required: false
        description: Comma separated lowercase statuses.
        schema:
          type: string
      - name: customer_id
        in: query
        required: false
        description: Filter on the customer.
        schema:
          type: string
          format: uuid
      - name: invoice_id
        in: query
        required: false
        description: Filter on the invoice credited.
        schema:
          type: string
          format: uuid
      - name: job_id
        in: query
        required: false
        description: Filter on the job.
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/PageLimit'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Include'
      - $ref: '#/components/parameters/XBranchId'
      responses:
        '200':
          description: The page of credit memos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditMemoPage'
        '400':
          $ref: '#/components/responses/BadRequestEither'
        '401': *id002
        '403': *id003
        '500': *id004
    post:
      operationId: creditMemoCreate
      tags:
      - credit-memo
      summary: Create a draft credit memo
      description: 'Creates the credit memo in draft: no number (it is minted at post, so a voided draft consumes
        none), lines built and totalled, tax at the invoice''s rate and never more than the invoice charged less
        what earlier credit memos credited. A line that names an invoice line cannot credit more than it billed
        less what earlier credit memos returned (409 exceeds_billed). The branch is held to the caller''s branch
        (403 naming branch_id). Writes credit_memo.created.'
      parameters:
      - $ref: '#/components/parameters/XBranchId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreditMemoRequest'
      responses:
        '201':
          description: The draft credit memo.
          headers:
            ETag: *id005
            Location:
              description: The path of the created document.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditMemo'
        '400':
          $ref: '#/components/responses/BadRequestEither'
        '409':
          $ref: '#/components/responses/ConflictEither'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '401': *id002
        '403': *id003
        '500': *id004
  /api/v1/credit-memos/{id}:
    get:
      operationId: creditMemoGet
      tags:
      - credit-memo
      summary: Get one credit memo with lines
      description: The credit memo with every line and its ETag.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/XBranchId'
      responses:
        '200':
          description: The credit memo.
          headers: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditMemo'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/WireNotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenEither'
    put:
      operationId: creditMemoUpdate
      tags:
      - credit-memo
      summary: Replace a draft credit memo
      description: 'Replaces the header fields and the lines, in draft only: in any other status it is 409 with
        the blocker credit_memo_not_draft. The customer and the invoice are fixed at create. The revision precondition
        applies (If-Match or the body revision). Writes credit_memo.updated.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/XBranchId'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreditMemoRequest'
      responses:
        '200':
          description: The edited credit memo.
          headers: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditMemo'
        '400':
          $ref: '#/components/responses/BadRequestEither'
        '404':
          $ref: '#/components/responses/WireNotFound'
        '409':
          $ref: '#/components/responses/ConflictEither'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '428':
          $ref: '#/components/responses/WirePreconditionRequired'
        '401': *id002
        '403': *id003
        '500': *id004
  /api/v1/credit-memos/{id}/transitions:
    post:
      operationId: creditMemoTransition
      tags:
      - credit-memo
      summary: Post or void a credit memo
      description: 'draft to open posts the credit memo (roles admin, owner, finance): it locks the invoice it names
        (409 invoice_void when that invoice is void), recomputes its lines against what was posted, restocks the
        lines that restock, mints the gapless CM- number, posts the balanced entry (revenue and tax back, receivable
        down, and for a restocked line the cost back to inventory and out of cost of goods sold at the original
        cost) and the subledger credit, and writes credit_memo.posted last. draft to void ends a draft and consumes
        no number; open to void (roles admin, owner, finance; a reason is required) reverses the entry and the restock
        and puts the credit back on the receivable. partial and applied are reached by applications and refunds
        (POST /credit-memos/{id}/applications and /refunds) and reopened by reversing an application; asking for them
        here is 409 invalid_state_transition. A credit memo is voided from open only while no application or refund
        has used it (409 has_applications). Writes credit_memo.posted or credit_memo.voided.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/XBranchId'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreditMemoTransitionRequest'
      responses:
        '200':
          description: The credit memo after the transition.
          headers: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditMemo'
        '400':
          $ref: '#/components/responses/BadRequestEither'
        '404':
          $ref: '#/components/responses/WireNotFound'
        '409':
          $ref: '#/components/responses/ConflictEither'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '428':
          $ref: '#/components/responses/WirePreconditionRequired'
        '401': *id002
        '403': *id003
        '500': *id004
  /api/v1/invoices/{id}/write-offs:
    post:
      operationId: invoiceWriteOff
      tags:
      - invoice
      summary: Write off part or all of an invoice's open amount
      description: 'Roles admin, owner, finance; a reason is required. Writes an amount of an unpaid or partial invoice
        off as bad debt: DR 5040 / CR 1020, a WRITE_OFF application and a WRITE_OFF subledger row. A write off
        that takes the open amount to zero closes the invoice as written_off, else it stays partial. The precondition
        is the invoice''s revision. Refused with 409 exceeds_open_amount, invoice_not_open (invalid_state_transition)
        or period_closed. Writes invoice.written_off when it closes the invoice, else invoice.partial, and customer.updated.
        Reversing the application (POST /ar/applications/{id}/reverse) reopens the invoice.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/XBranchId'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvoiceWriteOffRequest'
      responses:
        '200':
          description: The invoice after the write off.
          headers: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
        '400':
          $ref: '#/components/responses/BadRequestEither'
        '404':
          $ref: '#/components/responses/WireNotFound'
        '409':
          $ref: '#/components/responses/ConflictEither'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '428':
          $ref: '#/components/responses/WirePreconditionRequired'
        '401': *id002
        '403': *id003
        '500': *id004
  /api/v1/invoices/{id}/payments:
    get:
      operationId: invoiceApplications
      tags:
      - invoice
      summary: List an invoice's applications
      description: 'The applications that settled (or settle) the invoice: payment applications, credit memo applications,
        early pay discounts and write offs, oldest first, reversed ones included with their reversal. The path keeps
        its name; the payments of a legacy invoice are its PAYMENT applications.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/XBranchId'
      responses:
        '200':
          description: The applications, in the list envelope (one page, no further cursor).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceApplicationPage'
        '400':
          $ref: '#/components/responses/BadRequestEither'
        '404':
          $ref: '#/components/responses/WireNotFound'
        '401': *id002
        '403': *id003
  /api/v1/credit-memos/{id}/applications:
    post:
      operationId: creditMemoApply
      tags:
      - credit-memo
      summary: Apply a credit memo's open credit to invoices
      description: 'Uses the open credit of an open or partial credit memo on invoices of the same customer and currency.
        No ledger entry (both sides are in 1020) and no subledger row; each application is a CREDIT_MEMO application.
        The precondition is the credit memo''s revision. Refused with 409 exceeds_open_credit, exceeds_open_amount,
        invoice_void, customer_mismatch or currency_mismatch. Writes credit_memo.partial or credit_memo.applied, and
        invoice.partial or invoice.paid per invoice.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/XBranchId'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreditMemoApplyRequest'
      responses:
        '200':
          description: The credit memo after the applications.
          headers: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditMemo'
        '400':
          $ref: '#/components/responses/BadRequestEither'
        '404':
          $ref: '#/components/responses/WireNotFound'
        '409':
          $ref: '#/components/responses/ConflictEither'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '428':
          $ref: '#/components/responses/WirePreconditionRequired'
        '401': *id002
        '403': *id003
        '500': *id004
components:
  schemas:
    InvoiceStatus:
      type: string
      enum:
      - unpaid
      - partial
      - paid
      - void
      - written_off
      description: 'The lifecycle, lowercase on the wire (ADR 0001 section 6; ADR 0005 section 6.2). overdue is
        not a status: it is the is_overdue flag and the overdue list filter.'
    CreditMemoStatus:
      type: string
      enum:
      - draft
      - open
      - partial
      - applied
      - void
      description: The credit memo lifecycle, lowercase on the wire (ADR 0005 section 6.3).
    InvoiceSummary:
      type: object
      description: An invoice header, used as a list item and as the head of the full document.
      required:
      - id
      - number
      - branch_id
      - customer_id
      - customer_name
      - order_id
      - job_id
      - ship_to_id
      - status
      - revision
      - currency
      - origin
      - delivery_type
      - picked_up_by
      - delivery_id
      - invoice_date
      - due_date
      - payment_terms_id
      - discount_due_date
      - discount_percent
      - subtotal_cents
      - tax_cents
      - tax_rate_percent
      - tax_exempt
      - tax_source
      - total_cents
      - open_cents
      - is_overdue
      - paid_at
      - gl_entry_id
      - voided_at
      - voided_by
      - void_reason
      - created_at
      - updated_at
      properties:
        id:
          type: string
          format: uuid
        number:
          type: string
          description: The gapless IN- number, minted when the invoice is created (ADR 0005 4.1). A void invoice
            keeps it.
        branch_id:
          type: string
          format: uuid
        customer_id:
          type: string
          format: uuid
        customer_name:
          type: string
        order_id:
          type:
          - string
          - 'null'
          format: uuid
          description: The order this invoice bills; null on a counter account charge.
        job_id:
          type:
          - string
          - 'null'
          format: uuid
          description: The job (project) the invoice carries, from its order (ADR 0005 7.1).
        ship_to_id:
          type:
          - string
          - 'null'
          format: uuid
        status:
          $ref: '#/components/schemas/InvoiceStatus'
        revision:
          type: integer
          format: int64
        currency:
          type: string
          pattern: ^[A-Z]{3}$
          description: ISO 4217, copied from the order, never sent.
        origin:
          type: string
          enum:
          - order
          - pos
        delivery_type:
          type: string
          enum:
          - pickup
          - delivery
        picked_up_by:
          type:
          - string
          - 'null'
          description: Who collected a will-call order.
        delivery_id:
          type:
          - string
          - 'null'
          format: uuid
        invoice_date:
          type: string
          format: date
          description: The business date in the branch's local calendar.
        due_date:
          type:
          - string
          - 'null'
          format: date
          description: From the customer's payment terms at create.
        payment_terms_id:
          type: string
          format: uuid
        discount_due_date:
          type:
          - string
          - 'null'
          format: date
          description: The last day the early payment discount applies; null when the terms carry none.
        discount_percent:
          type:
          - string
          - 'null'
          description: The early payment discount percent at scale 4 as a decimal string.
        subtotal_cents:
          type: integer
          format: int64
        tax_cents:
          type: integer
          format: int64
        tax_rate_percent:
          type:
          - string
          - 'null'
          description: A percent with at most 4 fraction digits ("8.875"); null when the tax provider answered.
        tax_exempt:
          type: boolean
        tax_source:
          $ref: '#/components/schemas/OrderTaxSource'
        total_cents:
          type: integer
          format: int64
        open_cents:
          type: integer
          format: int64
          description: 'What is still owed: the total less the live applications (stored by the AR core as amount_open),
            0 when paid, written off or void.'
        is_overdue:
          type: boolean
          description: 'Computed: open and its due_date is before the branch''s today. OVERDUE is not a status.'
        paid_at:
          type:
          - string
          - 'null'
          format: date-time
        gl_entry_id:
          type:
          - string
          - 'null'
          format: uuid
          description: The invoice entry in the general ledger.
        voided_at:
          type:
          - string
          - 'null'
          format: date-time
        voided_by:
          type:
          - string
          - 'null'
        void_reason:
          type:
          - string
          - 'null'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Invoice:
      type: object
      description: The full invoice document with its lines (IN-1.8).
      required:
      - id
      - number
      - branch_id
      - customer_id
      - customer_name
      - order_id
      - job_id
      - ship_to_id
      - status
      - revision
      - currency
      - origin
      - delivery_type
      - picked_up_by
      - delivery_id
      - invoice_date
      - due_date
      - payment_terms_id
      - discount_due_date
      - discount_percent
      - subtotal_cents
      - tax_cents
      - tax_rate_percent
      - tax_exempt
      - tax_source
