      tags: [pos]
      summary: Bank statement lines that may be the day's deposit
      description: >-
        The unmatched deposit lines of the bank statement dated from three days
        before the business date to ten days after, nearest to the day's cash and
        checks to deposit first, at most 20. A close the caller's branch context
        hides answers 404; a caller with no branch in context and no grant, 403.
        Finance and owner only.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: "#/components/parameters/XBranchId"
      responses:
