      properties:
        id: {type: string, format: uuid}
        branch_id: {type: string, format: uuid}
        name: {type: string}
        protocol: {type: string, description: "SMA: the Scale Manufacturers Association standard."}
        endpoint: {type: string}
        certificate_no: {type: [string, "null"], description: "The certificate of conformance number the ticket can prove."}
        location_note: {type: [string, "null"]}
    PosScaleReading:
      type: object
