      tags: [pos]
      summary: State what a return comes to
      description: >-
        The same request as the return, answered with the figures only: the
        credit the memo will state (its subtotal net of the restocking fee,
        the tax and the total, negative as a credit), the restocking fee
        itself, the money that goes back (positive) and each line's fee beside
        its refund, so the counter states the fee before the return is taken.
        Computed from the same read-only pricing the return guards with;
        nothing is written, no row locks, no sequences.
      parameters:
        - $ref: "#/components/parameters/XBranchId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PosReturnRequest"
      responses:
        "200":
          description: The figures.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PosReturnFigures"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "404":
          $ref: "#/components/responses/WireNotFound"
        "409":
          $ref: "#/components/responses/ConflictEither"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/pos/returns/{id}:
    get:
      operationId: posReturnGet
      tags: [pos]
      summary: Read a return
      description: The return with its lines and its credit memo link.
      parameters:
        - name: id
          in: path
          required: true
