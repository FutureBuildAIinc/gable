#
# The pos module, transcribed from internal/pos/handler.go and model.go as they behave
# today: money is int64 cents on responses and float dollars on requests, the list
# wrappers carry nil slices (null when empty), and service failures map to the
# status the handler picks per route (409 till, 422 complete, 400 return, 500 the rest).
paths:
  /api/v1/pos/transactions:
    post:
      operationId: posTransactionStart
      tags:
      - pos
      summary: Start a transaction
      description: register_id defaults to REG-01 and a missing cashier_id is replaced by a random UUID.
      parameters:
      - $ref: '#/components/parameters/XBranchId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PosTransactionCreate'
      responses:
        '201':
          description: The new OPEN transaction, attached to the register's open till session when there
            is one.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PosTransaction'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 'The caller''s roles do not include one the route requires, or the caller authenticated
            with a machine key: a cashier must be a user.'
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/Error'
                - $ref: '#/components/schemas/PosCashierRefusal'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      operationId: posTransactionList
      tags:
      - pos
      summary: List transaction summaries
      parameters:
      - $ref: '#/components/parameters/XBranchId'
      - name: register_id
        in: query
        description: Filter to one register.
        schema:
          type: string
      - name: date
        in: query
        description: The day to list; today when omitted or unparseable.
        schema:
          type: string
          format: date
      responses:
        '200':
          description: Summaries; an empty array when none.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PosTransactionSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/pos/transactions/{id}:
    get:
      operationId: posTransactionGet
      tags:
      - pos
      summary: Get a transaction with its lines and tenders
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/XBranchId'
      responses:
        '200':
          description: The transaction.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PosTransaction'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/pos/transactions/{id}/items:
    post:
      operationId: posTransactionItemAdd
      tags:
      - pos
      summary: Add a line item
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/XBranchId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PosAddItem'
      responses:
        '200':
          description: The transaction with totals recalculated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PosTransaction'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/pos/transactions/{id}/items/{itemId}:
    delete:
      operationId: posTransactionItemRemove
      tags:
      - pos
      summary: Remove a line item
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: itemId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/XBranchId'
      responses:
        '200':
          description: The transaction with totals recalculated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PosTransaction'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/pos/transactions/{id}/complete:
    post:
      operationId: posTransactionComplete
      tags:
      - pos
      summary: Complete a transaction with tenders
      description: An empty tenders list answers 400. Every service failure (an under-tendered sale, a
        declined card, a transaction not OPEN) answers 422.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/XBranchId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PosComplete'
      responses:
        '200':
          description: The COMPLETED transaction.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PosTransaction'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: The completion failed (under-tendered sale, declined card, transaction not OPEN).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/pos/transactions/{id}/void:
    post:
      operationId: posTransactionVoid
      tags:
      - pos
      summary: Void a transaction
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/XBranchId'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The VOIDED transaction.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PosTransaction'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/pos/products/search:
    get:
      operationId: posProductSearch
      tags:
      - pos
      summary: Typeahead product search
      parameters:
      - $ref: '#/components/parameters/XBranchId'
      - name: q
        in: query
        description: SKU, description or barcode. An empty or one character query answers an empty array.
        schema:
          type: string
      responses:
        '200':
          description: Up to 20 matches; a bare array.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PosSearchResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/pos/sync:
    post:
      operationId: posSync
      tags:
      - pos
      summary: Replay offline transactions
      description: A missing batch_id or an empty items list answers 400.
      parameters:
      - $ref: '#/components/parameters/XBranchId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PosSyncRequest'
      responses:
        '200':
          description: The batch result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PosSyncResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/pos/catalog:
    get:
      operationId: posCatalog
      tags:
      - pos
      summary: Product catalog for the offline cache
      parameters:
      - $ref: '#/components/parameters/XBranchId'
      responses:
        '200':
          description: The whole catalog as a bare array.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PosCatalogProduct'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/pos/till/open:
    post:
      operationId: posTillOpen
      tags:
      - pos
      summary: Open a till session
      description: register_id defaults to REG-01. Every service failure, such as a session already open
        on the register, answers 409.
      parameters:
      - $ref: '#/components/parameters/XBranchId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PosTillOpen'
      responses:
        '201':
          description: The OPEN session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PosTillSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 'The caller''s roles do not include one the route requires, or the caller authenticated
            with a machine key: a cashier must be a user.'
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/Error'
                - $ref: '#/components/schemas/PosCashierRefusal'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/pos/till/current:
    get:
      operationId: posTillCurrent
      tags:
      - pos
      summary: The open till session of a register
      parameters:
      - $ref: '#/components/parameters/XBranchId'
      - name: register_id
        in: query
        description: Defaults to REG-01.
        schema:
          type: string
      responses:
        '200':
          description: The open session, or null when none.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PosTillCurrent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/pos/till/{id}/report:
    get:
      operationId: posTillReport
      tags:
      - pos
      summary: Live X report of a session
      description: An unknown session answers 500.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/XBranchId'
      responses:
        '200':
          description: The report.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PosTillReport'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/pos/till/{id}/close:
    post:
      operationId: posTillClose
      tags:
      - pos
      summary: Close a till session
      description: Every service failure, such as a session not OPEN, answers 409.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/XBranchId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PosTillClose'
      responses:
        '200':
          description: The closing Z report.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PosTillReport'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/pos/till/{id}/zreport:
    get:
      operationId: posZReportGet
      tags:
      - pos
      summary: The Z report of a closed session
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/XBranchId'
      responses:
        '200':
          description: The frozen Z snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PosZReport'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/pos/zreports:
    get:
      operationId: posZReportList
      tags:
      - pos
      summary: List Z reports
      parameters:
      - $ref: '#/components/parameters/XBranchId'
      - name: register_id
        in: query
        schema:
          type: string
      - name: date
        in: query
        description: An unparseable date is ignored.
        schema:
          type: string
          format: date
      responses:
        '200':
          description: Z reports wrapped in an object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PosZReportList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/pos/returns:
    post:
      operationId: posReturnCreate
      tags:
      - pos
      summary: Record a return and refund
      description: register_id defaults to REG-01. Every service failure, including validation, answers
        400.
      parameters:
      - $ref: '#/components/parameters/XBranchId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PosReturnRequest'
      responses:
        '201':
          description: The return with its lines.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PosReturn'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 'The caller''s roles do not include one the route requires, or the caller authenticated
            with a machine key: a cashier must be a user.'
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/Error'
                - $ref: '#/components/schemas/PosCashierRefusal'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      operationId: posReturnList
      tags:
      - pos
      summary: List returns
      parameters:
      - $ref: '#/components/parameters/XBranchId'
      - name: register_id
        in: query
        schema:
          type: string
      - name: date
        in: query
        description: An unparseable date is ignored.
        schema:
          type: string
          format: date
      responses:
        '200':
          description: Returns wrapped in an object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PosReturnList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/pos/returns/{id}:
    get:
      operationId: posReturnGet
      tags:
      - pos
      summary: Get a return with its lines
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/XBranchId'
      responses:
        '200':
          description: The return.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PosReturn'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  schemas:
    PosCashierRefusal:
      type: object
      description: The refusal body for a machine key on a cashier route. The code is lower case, unlike
        the standard envelope.
      required:
      - error
      - meta
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
              enum:
              - forbidden
            message:
              type: string
        meta:
          type: object
          required:
          - request_id
          properties:
            request_id:
              type: string
    PosTransactionStatus:
      type: string
      enum:
      - OPEN
      - COMPLETED
      - VOIDED
      - RETURNED
      - HELD
    PosLineItem:
      type: object
      description: POSLineItem.
      required:
      - id
      - transaction_id
      - product_id
      - description
      - quantity
      - uom
      - unit_price
      - line_total
      - created_at
      properties:
        id:
          type: string
          format: uuid
        transaction_id:
          type: string
          format: uuid
        product_id:
          type: string
          format: uuid
        description:
          type: string
        quantity:
          type: number
        uom:
          type: string
        unit_price:
          type: integer
          format: int64
          description: Cents.
        line_total:
          type: integer
          format: int64
          description: Cents.
        created_at:
          type: string
          format: date-time
    PosTender:
      type: object
      description: POSTender. The reference and card fields are omitted when empty.
      required:
      - id
      - transaction_id
      - method
      - amount
      - created_at
      properties:
        id:
          type: string
          format: uuid
        transaction_id:
          type: string
          format: uuid
        method:
          type: string
          description: CASH, CARD, CHECK or ACCOUNT.
        amount:
          type: integer
          format: int64
          description: Cents.
        reference:
          type: string
        card_last4:
          type: string
        card_brand:
          type: string
        gateway_tx_id:
          type: string
        auth_code:
          type: string
        created_at:
          type: string
          format: date-time
    PosTransaction:
      type: object
      description: POSTransaction. The customer, till session, completion time, sync fields and the lines
        and tenders are omitted when empty; only the read and mutation routes after the first line fill
        the lists.
      required:
      - id
      - branch_id
      - register_id
      - cashier_id
      - subtotal
      - tax_amount
      - total
      - change_due
      - status
      - created_at
      properties:
        id:
          type: string
          format: uuid
        branch_id:
          type: string
          format: uuid
        register_id:
          type: string
        cashier_id:
          type: string
          format: uuid
        customer_id:
          type: string
          format: uuid
        subtotal:
          type: integer
          format: int64
          description: Cents.
        tax_amount:
          type: integer
          format: int64
          description: Cents.
        total:
          type: integer
          format: int64
          description: Cents.
        change_due:
          type: integer
          format: int64
          description: Cents, set at completion.
        till_session_id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/PosTransactionStatus'
        completed_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        synced_from:
          type: string
          description: Absent for a live sale, offline-v1 for a synced one.
        client_created_at:
          type: string
          format: date-time
        line_items:
          type: array
          items:
            $ref: '#/components/schemas/PosLineItem'
        tenders:
          type: array
          items:
            $ref: '#/components/schemas/PosTender'
    PosTransactionSummary:
      type: object
      description: TransactionSummary.
      required:
      - id
      - register_id
      - total
      - status
      - item_count
      - created_at
      properties:
        id:
          type: string
          format: uuid
        register_id:
          type: string
        total:
          type: integer
          format: int64
          description: Cents.
        status:
          $ref: '#/components/schemas/PosTransactionStatus'
        item_count:
          type: integer
        completed_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
    PosSearchResult:
      type: object
      description: QuickSearchResult.
      required:
      - product_id
      - sku
      - description
      - unit_price
      - uom
      - in_stock
      properties:
        product_id:
          type: string
          format: uuid
        sku:
          type: string
        description:
          type: string
        unit_price:
          type: number
          description: Float dollars.
        uom:
          type: string
        in_stock:
          type: number
    PosCatalogProduct:
      type: object
      description: CatalogProduct.
      required:
      - product_id
      - sku
      - description
      - price
      - uom
      - in_stock
      properties:
        product_id:
          type: string
          format: uuid
        sku:
          type: string
        description:
          type: string
        price:
          type: number
          description: Float dollars.
        uom:
          type: string
        in_stock:
          type: number
    PosTillSession:
      type: object
      description: TillSession. Everything set at close, and the branch, is omitted when empty.
      required:
      - id
      - register_id
      - cashier_id
      - status
      - opening_float
      - opened_at
      - notes
      properties:
        id:
          type: string
          format: uuid
        register_id:
          type: string
        branch_id:
          type: string
          format: uuid
        cashier_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - OPEN
          - CLOSED
        opening_float:
          type: integer
          format: int64
          description: Cents.
        opened_at:
          type: string
          format: date-time
        closed_at:
          type: string
          format: date-time
        expected_by_method:
          type: object
          additionalProperties:
            type: integer
            format: int64
          description: Cents keyed by tender method.
        counted_by_method:
          type: object
          additionalProperties:
            type: integer
            format: int64
          description: Cents keyed by tender method.
        over_short:
          type: integer
          format: int64
          description: Cents; negative means short.
        gl_entry_id:
          type: string
          format: uuid
        notes:
          type: string
    PosTillCurrent:
      type: object
      description: The current session wrapper.
      required:
      - session
      properties:
        session:
          oneOf:
          - $ref: '#/components/schemas/PosTillSession'
          - type: 'null'
    PosTillReport:
      type: object
      description: TillReport.
      required:
      - session
      - sale_count
      - sales_total
      - tax_total
      - change_given
      - tendered_by_method
      - expected_by_method
      properties:
        session:
