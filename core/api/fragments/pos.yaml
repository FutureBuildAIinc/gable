  /api/v1/pos/refund-intents/{id}/resolve:
    post:
      operationId: posRefundIntentResolve
      tags: [pos]
      summary: Resolve a stranded card refund claim
      description: >-
        The guarded operator route for a refund claim that outlived its act
        (a lost terminal verdict, a crashed process, a transaction that
        refused after the terminal answered): finance reads the terminal and
        records its actual outcome. outcome refund carries the gateway's own
        refund id (the money moved) and books it through the refund's own
        money transaction with every cap and lock, completing the claim DONE;
        outcome no_refund carries the reconciliation reference finance filed,
        marks the claim FAILED and moves nothing. A payback claim (a
        payback whose terminal call answered no verdict) settles the same
        way: a recorded refund books the credit out to its card, a no
        refund releases the claim and the credit stays held at the counter.
        Both write one audit row
        naming the person, the intent, the outcome and the reason. A claim
        whose own terminal call has not answered is live, not stranded: while
        its in flight lease runs the resolve answers 409 refund_in_flight,
        and once the lease expires with no answer at all the claim is marked
        UNKNOWN and settles as recorded. Only the
        finance and owner roles; a machine key is refused in the route
        itself, bound or not. A bare resolve, a refund without its refund id
        and a no refund without its reference are 400s naming the field; a
        claim that is not PENDING is 409 intent_not_pending, a no refund over
        a claim carrying the terminal's refund id and a refund id that
        differs from it are 409s naming the conflict, and the claim's sale is
        read through the caller's branch context, so a caller outside the
        branch finds a missing row (404). In a configured deployment the
        actor is the JWT's subject; with authentication off (dev mode) the
        route runs with no subject and the audit row names nobody, which no
        configured deployment allows.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: "#/components/parameters/XBranchId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PosResolveIntentRequest"
      responses:
        "200":
          description: The settled claim.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PosRefundIntentResolved"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "404":
          $ref: "#/components/responses/WireNotFound"
        "409":
          $ref: "#/components/responses/ConflictEither"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/pos/refund-intents/{id}/payback:
    post:
      operationId: posRefundIntentPayback
      tags: [pos]
      summary: Pay a declined void tender's credit back to its card
      description: >-
        The one way back for a declined void tender's credit
        (FROM-PRINCIPAL 60): a tender whose refund the terminal declined
        keeps its charge as unapplied credit once the void completes, held
        to its own tender (it applies to no invoice, 409
        tender_credit_held), and this route pays it back to that card
        through the counter terminal rail, the rail the charge came from.
        The route keys on the void's own released claim (the id the
        resolve route would key on): only a FAILED void claim of a voided
        sale whose tender's payment still carries the credit unapplied is
        paid back, exactly once. Its terminal call runs under the claim
        discipline every terminal refund runs under: one live claim per
        tender and the in flight lease, so a concurrent payback is 409
        refund_in_flight and a hung call holds the drawer until it is
        resolved. Only the finance and owner roles; a machine key is
        refused in the route itself, bound or not. The claim's sale is read
        through the caller's branch context, so a caller outside the
        branch finds a missing row (404), header or not. A claim that is
        not FAILED (409 intent_not_failed), a claim of a sale whose void
        has not completed and a tender whose credit was already paid back
        (409 no_held_credit) are refused before the terminal is reached,
        so a refusal never moves money at the terminal; a terminal decline
        is 409 card_refund (nothing moved, the credit stays held and the
        counter may ask again), and a call that answers no verdict leaves
        the payback's own claim standing for the resolve route. The
        booking writes one pos.refund_intent.paid_back audit row naming
        the person, the void's claim, the outcome and the reason, the
        credit's unapplied cash falls to zero and the cash account moves
        by the refund. The payment refund route through the online gateway
        is never the way back for such a credit (409 tender_credit_held).
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: "#/components/parameters/XBranchId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PosPaybackIntentRequest"
      responses:
        "200":
          description: The credit paid back to its card.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PosRefundIntentPaidBack"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "404":
          $ref: "#/components/responses/WireNotFound"
        "409":
          $ref: "#/components/responses/ConflictEither"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/pos/terminal-intents/{id}:
    get:
      operationId: posTerminalIntentGet
      tags: [pos]
      summary: Read one card terminal intent (the desk's waiting state)
      description: >-
        The card leg's own record at the counter (CP-05): where the leg
        stands, claimed at the terminal, waiting at the device, answered
        authorized or declined, or lost to the sweep. The desk's waiting
        state reads this route while the terminal has the card. The
        intent's branch is held to the caller's reach: a caller whose
        branch header names another branch finds a missing row (404), and a
        caller with no header and no grant to the branch is 403.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: "#/components/parameters/XBranchId"
      responses:
        "200":
          description: The intent as it stands.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PosTerminalIntent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "404":
          $ref: "#/components/responses/WireNotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/pos/terminal-intents/{id}/cancel:
    post:
      operationId: posTerminalIntentCancel
      tags: [pos]
      summary: Cancel a card terminal intent, honest about the device
      description: >-
        The desk's cancel of a waiting card leg. It is honest about the
        device: a claim the terminal never reached closes lost with no
        manager item (nothing moved), while a leg at the device is refused
        (409 terminal_at_device), because the device may still move the
        money and only the sweep and a manager settle that. An intent
        already answered or lost is 409 terminal_intent_settled, and a leg
        the device authorized that the sale has not used is 409
        terminal_authorized. The cancel never claims money back. A machine
        key is refused in the route itself, bound or not. The intent's
        branch is held to the caller's reach as the read is.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: "#/components/parameters/XBranchId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: The intent as it stands after the cancel.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PosTerminalIntent"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "404":
          $ref: "#/components/responses/WireNotFound"
        "409":
          $ref: "#/components/responses/ConflictEither"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/pos/terminal-intents/sweep:
    post:
      operationId: posTerminalIntentsSweep
      tags: [pos]
      summary: Sweep the card terminal intents past their lease
      description: >-
        The sweep act (CP-05): every intent past its lease becomes lost. A
        claimed one never reached the device and is simply closed; a leg
        at the device may have moved money, so it becomes one manager item
        of the lost answer queue carrying who resolves it, the amount, the
        register and the device reference. The scheduler runs this act on
        its own over every branch; the route is the manager's own trigger
        and sweeps only the caller's reach (a branch in context, else the
        granted branches). Admin, owner and finance roles only; a machine
        key is refused in the route itself.
      parameters:
        - $ref: "#/components/parameters/XBranchId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: What the pass closed and queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PosTerminalSweepResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "409":
          $ref: "#/components/responses/ConflictEither"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/pos/terminal-lost-items:
    get:
      operationId: posTerminalLostItemsList
      tags: [pos]
      summary: List the open lost terminal answers (the manager's queue)
      description: >-
        The manager's queue of card legs the sweep turned lost because the
        device may have moved money: who must resolve it (the register),
        what amount, the device reference, and the transaction it belongs
        to, with the device's own late verdict and reference when its answer
        came after the sweep. A manager reads the terminal's own record and
        settles each at the resolve route. Admin, owner and finance roles
        only. The list is held to the caller's branch wall in the query
        itself: with a branch in context only that branch's items, with none
        and a user only the branches the user is granted.
      parameters:
        - $ref: "#/components/parameters/XBranchId"
      responses:
        "200":
          description: The open items, oldest first, in the list envelope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PosTerminalLostItemList"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/pos/terminal-lost-items/{id}/resolve:
    post:
      operationId: posTerminalLostItemResolve
      tags: [pos]
      summary: Resolve one lost terminal answer
      description: >-
        The manager's settlement of one lost card leg, the terminal's own
        record the authority (CP-05). The item is claimed first by one
        guarded statement, so a second or racing resolve is 409
        lost_item_settled and calls nothing. Outcome authorized on a sale
        leg: a sale still open keeps the authorized leg for its completion
        (never charged again); a completed sale applies the money up to its
        invoice's open amount and the rest goes back to the card; a sale
        paid in full or voided has the whole charge reversed (the same day
        void first, the refund when the void is refused, under the intent's
        idempotency key; a reversal that fails answers 502
        charge_not_reversed and the item is open again). On a refund or void
        leg the refund claim the leg names settles through the claim's own
        resolution. Outcome declined closes the item and moves nothing. Both
        write one audit row naming the person, the item, the outcome and the
        reference. Admin, owner and finance roles only; a machine key is
        refused in the route itself, bound or not. The item's branch is held
        to the caller's reach before either outcome: a caller whose branch
        header names another branch finds a missing row (404), and a caller
        with no header and no grant to the branch is 403.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: "#/components/parameters/XBranchId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PosResolveTerminalLostItemRequest"
      responses:
        "200":
          description: The settled item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PosTerminalLostItem"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "404":
          $ref: "#/components/responses/WireNotFound"
        "409":
          $ref: "#/components/responses/ConflictEither"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  schemas:
    PosStatus:
      type: string
      enum: [open, held, completed, voided]
    PosTenderMethod:
      type: string
      enum: [cash, check, card, account]
    PosRefundMethod:
      type: string
      enum: [cash, card, account]
    PosTillStatus:
      type: string
      enum: [open, closed]
    PosTransactionCreateRequest:
      type: object
      properties:
        register_id: {type: string, description: "Defaults REG-01."}
        cashier_id: {type: [string, "null"], format: uuid, description: "Defaults the JWT's subject."}
        customer_id: {type: [string, "null"], format: uuid, description: "Absent means the walk-in customer."}
    PosAddLineRequest:
      type: object
      required: [line]
      properties:
        line:
          $ref: "#/components/schemas/PosLineRequest"
    PosChangeQuantityRequest:
      type: object
      required: [quantity, revision]
      properties:
        quantity: {type: string, description: "The line's new quantity, a decimal string greater than zero."}
        revision: {type: integer, description: "The sale's revision the change is made on."}
    PosCompleteRequest:
      type: object
      required: [tenders]
      properties:
        tenders:
          type: array
          items:
            $ref: "#/components/schemas/PosTenderRequest"
        picked_up_by: {type: [string, "null"], description: "Who collected the basket, at most 200 characters."}
        revision: {type: integer, format: int64, minimum: 1, description: "The sale's revision; or send If-Match."}
    PosTenderRequest:
      type: object
      required: [method, amount_cents]
      properties:
        method: {$ref: "#/components/schemas/PosTenderMethod"}
        amount_cents: {type: integer, format: int64, minimum: 1}
        reference: {type: [string, "null"], description: "The check number or reference."}
        token_id: {type: [string, "null"], description: "The card token a card tender charges."}
    PosVoidRequest:
      type: object
      required: [reason]
      properties:
        reason: {type: string}
        revision: {type: integer, format: int64, minimum: 1, description: "The sale's revision; or send If-Match."}
    PosResolveIntentRequest:
      type: object
      required: [outcome, reason]
      properties:
        outcome:
          type: string
          enum: [refund, no_refund]
          description: "The terminal's actual outcome: refund (the gateway's own refund id, the money moved) or no_refund (an explicit no at the terminal)."
        refund_tx_id:
          type: string
          description: "Required when the outcome is refund: the gateway's own refund id for the claim."
        reconciliation_reference:
          type: string
          description: "Required when the outcome is no_refund: the reference finance filed for the reconciliation."
        reason: {type: string, description: Why the record was made, 1 to 500 characters.}
    PosRefundIntentResolved:
      type: object
      required: [id, sale_id, tender_id, act, state, outcome]
      properties:
        id: {type: string, format: uuid}
        sale_id: {type: string, format: uuid}
        tender_id: {type: string, format: uuid}
        act: {type: string, enum: [void, return, payback]}
        state: {type: string, enum: [DONE, FAILED], description: DONE when a recorded refund booked, FAILED when a no refund released the claim.}
        outcome: {type: string, enum: [refund, no_refund]}
        refund_tx_id: {type: [string, "null"], description: The gateway refund id the operator recorded.}
        reconciliation_reference: {type: [string, "null"], description: The reference the operator filed.}
    PosPaybackIntentRequest:
      type: object
      required: [reason]
      properties:
        reason: {type: string, description: Why the credit went back to its card, 1 to 500 characters.}
    PosRefundIntentPaidBack:
      type: object
      required: [id, payback_id, sale_id, tender_id, amount_cents, refund_tx_id, state]
      properties:
        id: {type: string, format: uuid, description: The void's own released claim the route keyed on.}
        payback_id: {type: string, format: uuid, description: The payback's own claim, completed DONE with the terminal's refund id.}
        sale_id: {type: string, format: uuid}
        tender_id: {type: string, format: uuid}
        amount_cents: {type: integer, format: int64, description: The credit paid back, the tender's payment's whole unapplied cash.}
        refund_tx_id: {type: string, description: The terminal's own refund id for the payback.}
        state: {type: string, enum: [DONE]}
    PosReturnRequest:
      type: object
      required: [reason, lines]
      properties:
        register_id: {type: string, description: "Defaults REG-01."}
        original_sale_id: {type: [string, "null"], format: uuid, description: "The sale the goods came from; absent is a no-receipt return."}
        customer_id: {type: [string, "null"], format: uuid}
        refund_method: {$ref: "#/components/schemas/PosRefundMethod"}
        reason: {type: string}
        gateway_tx_id: {type: [string, "null"], description: "Refused on a card return: the refund goes to the sale's own card tender, never a transaction the client names."}
        lines:
          type: array
          items:
            $ref: "#/components/schemas/PosReturnLineRequest"
    PosReturnLineRequest:
      type: object
      required: [quantity]
      properties:
        product_id: {type: [string, "null"], format: uuid, description: "Required when the line names no sale line."}
        line_id: {type: [string, "null"], format: uuid, description: "The sale line returned; its price and cost follow. Required on every line when original_sale_id is named, and named at most once: a request naming one sale line twice is refused naming the second."}
        description: {type: [string, "null"]}
        quantity: {type: string, description: "A positive decimal string with at most 4 fraction digits."}
        unit_price_ten_thousandths: {type: integer, format: int64, minimum: 0, description: "Required when the line names no sale line."}
        restock: {type: boolean, description: "Default true; damaged goods stay out of stock."}
    PosTillOpenRequest:
      type: object
      properties:
        register_id: {type: string, description: "Defaults REG-01."}
        opening_float_cents: {type: integer, format: int64, minimum: 0}
    PosTillCloseRequest:
      type: object
      required: [counted_by_method]
      properties:
        counted_by_method:
          type: object
          additionalProperties: {type: integer, format: int64, minimum: 0}
          description: "The counted cents per lowercase method (cash, check, card, account)."
        notes: {type: [string, "null"]}
    PosSyncRequest:
      type: object
      required: [batch_id, items]
      properties:
        batch_id: {type: string}
        register_id: {type: string, description: "Defaults REG-01."}
        items:
          type: array
          items:
            $ref: "#/components/schemas/PosSyncSale"
    PosSyncSale:
      type: object
      required: [client_id, items, tenders]
      properties:
        client_id: {type: string, format: uuid, description: "The offline client's id for the sale; a replay is a duplicate, not an error."}
        cashier_id: {type: [string, "null"], format: uuid}
        customer_id: {type: [string, "null"], format: uuid}
        items:
          type: array
          items:
            $ref: "#/components/schemas/PosLineRequest"
        tenders:
          type: array
          items:
            $ref: "#/components/schemas/PosTenderRequest"
        client_created_at: {type: [string, "null"], format: date-time, description: "When the register made the sale offline."}
    PosLineRequest:
      type: object
      description: >-
        One sales line in the shared shape of ADR 0005 section 2.2, the same
        parse everywhere a sales line is written: a product line (quantity and
        unit from the product when it names one), a charge line (charge_code),
        or a text line (a note, nothing priced); an override or a discount
        carries its reason and is audited.
      properties:
        id: {type: [string, "null"], format: uuid, description: "The client's id for the line, echoed on created lines."}
        line_type: {type: [string, "null"], enum: [product, kit, component, charge, text], description: "Defaults product; a kit explodes to its components."}
        product_id: {type: [string, "null"], format: uuid}
        charge_code: {type: [string, "null"], description: "The charge code a charge line names."}
        sku: {type: [string, "null"]}
        description: {type: [string, "null"]}
        quantity: {type: [string, "null"], description: "A decimal string with at most 4 fraction digits; null only on a text line."}
        uom: {type: [string, "null"], description: "Defaults the product's unit."}
        price_uom: {type: [string, "null"], description: "Defaults uom; a different one requires the pair."}
        uom_qty: {type: [string, "null"], description: "The pair side in the sale unit; both sides together, both positive."}
        price_uom_qty: {type: [string, "null"], description: "The pair side in the price unit."}
        unit_price_ten_thousandths: {type: [integer, "null"], format: int64, minimum: 0, description: "Defaults the product's price."}
        override_reason: {type: [string, "null"], description: "Required when the price is not the product's."}
        discount_percent: {type: [string, "null"], description: "A percent or a cents amount, never both."}
        discount_cents: {type: [integer, "null"], format: int64}
        discount_reason: {type: [string, "null"]}
    PosTransactionSummary:
      type: object
      description: A sale's head, a list item.
      required: [id, number, revision, branch_id, register_id, cashier_id, customer_id, currency, total_cents, status, invoice_id, completed_at, created_at, item_count]
      properties:
        id: {type: string, format: uuid}
        number: {type: string, description: "POS-000001, human readable."}
        revision: {type: integer, format: int64}
        branch_id: {type: string, format: uuid}
        register_id: {type: string}
        cashier_id: {type: string, format: uuid}
        customer_id: {type: [string, "null"], format: uuid}
        currency: {type: string, description: "ISO 4217, the customer's or the dealer default."}
        total_cents: {type: integer, format: int64}
        status: {$ref: "#/components/schemas/PosStatus"}
        invoice_id: {type: [string, "null"], format: uuid, description: "Set by the completion."}
        completed_at: {type: [string, "null"], format: date-time}
        created_at: {type: string, format: date-time}
        item_count: {type: integer}
    PosTransaction:
      type: object
      description: "The full sale: the head with its lines and tenders."
      required: [id, number, revision, branch_id, register_id, cashier_id, customer_id, currency, subtotal_cents, tax_cents, total_cents, change_cents, till_session_id, status, invoice_id, completed_at, created_at, customer_po, job_id, lines, tenders]
      properties:
        id: {type: string, format: uuid}
        number: {type: string, description: "POS-000001, human readable."}
        revision: {type: integer, format: int64}
        branch_id: {type: string, format: uuid}
        register_id: {type: string}
        cashier_id: {type: string, format: uuid}
        customer_id: {type: [string, "null"], format: uuid}
        currency: {type: string, description: "ISO 4217, the customer's or the dealer default."}
        subtotal_cents: {type: integer, format: int64}
        tax_cents: {type: integer, format: int64}
        total_cents: {type: integer, format: int64}
        change_cents: {type: integer, format: int64, description: "The change given, never subtracted from the payments a second time."}
        till_session_id: {type: [string, "null"], format: uuid}
        status: {$ref: "#/components/schemas/PosStatus"}
        invoice_id: {type: [string, "null"], format: uuid, description: "The invoice the completion posted."}
        completed_at: {type: [string, "null"], format: date-time}
        created_at: {type: string, format: date-time}
        customer_po: {type: [string, "null"], description: "The purchase order a charge sale names."}
        job_id: {type: [string, "null"], format: uuid, description: "The customer's job the sale belongs to."}
        lines:
          type: array
          items:
            $ref: "#/components/schemas/PosLineItem"
        tenders:
          type: array
          items:
            $ref: "#/components/schemas/PosTender"
    PosCounterJob:
      type: object
      required: [id, name]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
    PosCounterCustomer:
      type: object
      required: [id, account_number, name, po_required, credit_limit_cents, open_receivable_cents, available_credit_cents, standing, jobs]
      properties:
        id: {type: string, format: uuid}
        account_number: {type: string}
        name: {type: string}
        po_required: {type: boolean, description: "The account asks for a purchase order on a charge sale (409 po_required at completion without one)."}
        credit_limit_cents: {type: [integer, "null"], format: int64, description: "Null: no limit. 0: no credit."}
        open_receivable_cents: {type: integer, format: int64, description: "What the credit check reads: open invoices less open credit memos and unapplied cash."}
        available_credit_cents: {type: [integer, "null"], format: int64, description: "The limit less the open receivable; negative when over; null with no limit."}
        standing: {type: string, enum: [good, no_limit, no_credit, over_limit]}
        jobs:
          type: array
          items:
            $ref: "#/components/schemas/PosCounterJob"
    PosSaleCustomerRequest:
      type: object
      additionalProperties: false
      properties:
        customer_id: {type: [string, "null"], format: uuid}
        customer_po: {type: [string, "null"], maxLength: 100}
        job_id: {type: [string, "null"], format: uuid}
    PosTransactionPage:
      type: object
      required: [items, next_cursor, limit]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PosTransactionSummary"
        next_cursor: {type: [string, "null"], description: "Null: the page is the whole day."}
        limit: {type: integer}
        total: {type: integer, description: "Only under include=total."}
    PosLineItem:
      type: object
      description: >-
        A sale line in the shared shape of ADR 0005 section 2.2: product, kit
        (with its component lines), charge and text lines, the priced fields
        null on a text line, the extension rounded once.
      required: [id, position, line_type, parent_line_id, product_id, charge_code_id, charge_code, sku, description, quantity, uom, price_uom, uom_qty, price_uom_qty, unit_price_ten_thousandths, priced_unit_price_ten_thousandths, price_source, override_reason, discount_percent, discount_cents, discount_reason, price_adjusted_by, line_total_cents, taxable, revenue_account_code, is_special_order, vendor_id, special_order_unit_cost_ten_thousandths, created_at]
      properties:
        id: {type: string, format: uuid}
        position: {type: integer}
        line_type: {type: string, enum: [product, kit, component, charge, text]}
        parent_line_id: {type: [string, "null"], format: uuid, description: "The kit line a component belongs to."}
        product_id: {type: [string, "null"], format: uuid}
        charge_code_id: {type: [string, "null"], format: uuid}
        charge_code: {type: [string, "null"]}
        sku: {type: [string, "null"]}
        description: {type: string}
        quantity: {type: [string, "null"], description: "A decimal string; null on a text line."}
        uom: {type: [string, "null"]}
        price_uom: {type: [string, "null"], description: "The unit the price is per; equals uom unless the pair converts."}
        uom_qty: {type: [string, "null"], description: "The pair side in the sale unit; 1 and 1 when the units agree."}
        price_uom_qty: {type: [string, "null"]}
        unit_price_ten_thousandths: {type: [integer, "null"], format: int64, description: "Scale 4; null on a text line."}
        priced_unit_price_ten_thousandths: {type: [integer, "null"], format: int64, description: "The price before an override or discount moved it."}
        price_source: {type: string, enum: [price_list, quote, override, manual, none]}
        override_reason: {type: [string, "null"]}
        discount_percent: {type: [string, "null"], description: "A percent or a cents amount, never both."}
        discount_cents: {type: [integer, "null"], format: int64}
        discount_reason: {type: [string, "null"]}
        price_adjusted_by: {type: [string, "null"], description: "Who moved the price; the audit row carries the rest."}
        line_total_cents: {type: [integer, "null"], format: int64, description: "The extension, rounded once; null on a text line."}
        taxable: {type: boolean}
        revenue_account_code: {type: [string, "null"], description: "The account the line's revenue posts to (a charge line's code)."}
        is_special_order: {type: boolean}
        vendor_id: {type: [string, "null"], format: uuid}
        special_order_unit_cost_ten_thousandths: {type: [integer, "null"], format: int64}
        created_at: {type: string, format: date-time}
    PosTender:
      type: object
      description: >-
        One payment taken at the counter, stored net: the tendered amount
        less any change given from it, so the payment it became is the money
        kept.
      required: [id, sale_id, method, amount_cents, payment_id, reference, card_last4, card_brand, gateway_tx_id, auth_code, created_at]
      properties:
        id: {type: string, format: uuid}
        sale_id: {type: string, format: uuid}
        method: {$ref: "#/components/schemas/PosTenderMethod"}
        amount_cents: {type: integer, format: int64, description: "Net of change."}
        payment_id: {type: [string, "null"], format: uuid, description: "The payment the completion recorded."}
        reference: {type: [string, "null"]}
        card_last4: {type: [string, "null"]}
        card_brand: {type: [string, "null"]}
        gateway_tx_id: {type: [string, "null"]}
        auth_code: {type: [string, "null"]}
        created_at: {type: string, format: date-time}
    PosReturn:
      type: object
      description: >-
        One counter return: a credit memo created, posted, refunded and
        optionally restocked in one act.
      required: [id, number, revision, branch_id, register_id, till_session_id, original_sale_id, customer_id, cashier_id, currency, subtotal_cents, tax_cents, total_cents, refund_method, reason, credit_memo_id, created_at, lines]
      properties:
        id: {type: string, format: uuid}
        number: {type: string, description: "RTN-000001, human readable."}
        revision: {type: integer, format: int64}
        branch_id: {type: [string, "null"], format: uuid}
        register_id: {type: string}
        till_session_id: {type: [string, "null"], format: uuid}
        original_sale_id: {type: [string, "null"], format: uuid}
        customer_id: {type: [string, "null"], format: uuid}
        cashier_id: {type: string, format: uuid}
        currency: {type: string}
        subtotal_cents: {type: integer, format: int64}
        tax_cents: {type: integer, format: int64}
        total_cents: {type: integer, format: int64}
        refund_method: {$ref: "#/components/schemas/PosRefundMethod"}
        reason: {type: string}
        credit_memo_id: {type: [string, "null"], format: uuid, description: "The credit memo the return posted."}
        created_at: {type: string, format: date-time}
        lines:
          type: array
          items:
            $ref: "#/components/schemas/PosReturnLine"
    PosReturnLine:
      type: object
      description: One returned line, its quantity and extension negative.
      required: [id, position, product_id, description, quantity, uom, unit_price_ten_thousandths, line_total_cents, restock]
      properties:
        id: {type: string, format: uuid}
        position: {type: integer}
        product_id: {type: [string, "null"], format: uuid}
        description: {type: string}
        quantity: {type: [string, "null"], description: "A negative decimal string."}
        uom: {type: [string, "null"]}
        unit_price_ten_thousandths: {type: [integer, "null"], format: int64}
        line_total_cents: {type: [integer, "null"], format: int64}
        restock: {type: boolean}
    PosTillSession:
      type: object
      description: >-
        One drawer shift. The expected cash is the sum of the session's cash
        payments (already net of change) plus the opening float less cash
        refunds.
      required: [id, register_id, branch_id, cashier_id, status, opening_float_cents, opened_at, closed_at, expected_by_method, counted_by_method, over_short_cents, gl_entry_id, notes]
      properties:
        id: {type: string, format: uuid}
        register_id: {type: string}
        branch_id: {type: [string, "null"], format: uuid}
        cashier_id: {type: string, format: uuid}
        status: {$ref: "#/components/schemas/PosTillStatus"}
        opening_float_cents: {type: integer, format: int64}
        opened_at: {type: string, format: date-time}
        closed_at: {type: [string, "null"], format: date-time}
        expected_by_method:
          type: object
          additionalProperties: {type: integer, format: int64}
          description: "The expected cents per lowercase method; present once the session has sales."
        counted_by_method:
          type: object
          additionalProperties: {type: integer, format: int64}
        over_short_cents: {type: [integer, "null"], format: int64, description: "Set by the close."}
        gl_entry_id: {type: [string, "null"], format: uuid, description: "The 5030 over/short entry the close booked."}
        notes: {type: string}
    PosTillReport:
      type: object
      required: [session, sale_count, sales_total_cents, tax_total_cents, change_cents, tendered_by_method, expected_by_method]
      properties:
        session:
          $ref: "#/components/schemas/PosTillSession"
        sale_count: {type: integer}
        sales_total_cents: {type: integer, format: int64}
        tax_total_cents: {type: integer, format: int64}
        change_cents: {type: integer, format: int64}
        tendered_by_method:
          type: object
          additionalProperties: {type: integer, format: int64}
        expected_by_method:
          type: object
          additionalProperties: {type: integer, format: int64}
    PosRegister:
      type: object
      required: [id, name, branch_id, branch_code, branch_name]
      properties:
        id: {type: string}
        name: {type: string}
        branch_id: {type: string, format: uuid}
        branch_code: {type: string}
        branch_name: {type: string}
    PosRegisterPage:
      type: object
      required: [items, next_cursor, limit]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/PosRegister"}
        next_cursor: {type: [string, "null"]}
        limit: {type: integer}
    PosZReport:
      type: object
      description: The immutable end-of-day snapshot written once when the session closes.
      required: [id, till_session_id, register_id, branch_id, over_short_cents, payload, generated_at]
      properties:
        id: {type: string, format: uuid}
        till_session_id: {type: string, format: uuid}
        register_id: {type: string}
        branch_id: {type: [string, "null"], format: uuid}
        over_short_cents: {type: integer, format: int64}
        payload:
          allOf:
          - $ref: "#/components/schemas/PosTillReport"
          description: The frozen closing report, a JSON object.
        generated_at: {type: string, format: date-time}
    PosTileSet:
      type: object
      required: [categories, items, images]
      properties:
        categories:
          type: array
          items: {$ref: "#/components/schemas/PosTileCategory"}
        items:
          type: array
          items: {$ref: "#/components/schemas/PosTile"}
        images: {type: boolean, description: "The catalog.product_images setting."}
    PosTileCategory:
      type: object
      required: [name, count]
      properties:
        name: {type: string}
        count: {type: integer, format: int64}
    PosTile:
      type: object
      required: [product_id, sku, description, uom, unit_price_cents, in_stock, category, image_url]
      properties:
        product_id: {type: string, format: uuid}
        sku: {type: string}
        description: {type: string}
        uom: {type: string}
        unit_price_cents: {type: integer, format: int64}
        in_stock: {type: string, description: "A decimal string of the yard's on hand quantity."}
        category: {type: string}
        image_url: {type: [string, "null"]}
    PosSearchResult:
      type: object
      required: [product_id, sku, description, unit_price_cents, uom, in_stock]
      properties:
        product_id: {type: string, format: uuid}
        sku: {type: string}
        description: {type: string}
        unit_price_cents: {type: integer, format: int64}
        uom: {type: string}
        in_stock: {type: string, description: "A decimal string of the on hand quantity."}
    PosCatalogProduct:
      type: object
      required: [product_id, sku, description, unit_price_cents, uom, in_stock]
      properties:
        product_id: {type: string, format: uuid}
        sku: {type: string}
        description: {type: string}
        unit_price_cents: {type: integer, format: int64}
        uom: {type: string}
        in_stock: {type: string, description: "A decimal string of the on hand quantity."}
    PosSyncResponse:
      type: object
      required: [batch_id, synced_count, duplicate_count, error_count, pending_count, errors, pending]
      properties:
        batch_id: {type: string}
        synced_count: {type: integer}
        duplicate_count: {type: integer, description: "Sales already synced, by client_id."}
        error_count: {type: integer}
        pending_count: {type: integer, description: "Sales waiting on the tax provider; the sync retries them."}
        errors:
          type: array
          items:
            $ref: "#/components/schemas/PosSyncItemResult"
        pending:
          type: array
          items:
            $ref: "#/components/schemas/PosSyncItemResult"
    PosSyncItemResult:
      type: object
      required: [client_id, reason]
      properties:
        client_id: {type: string, format: uuid}
        reason: {type: string}
    PosTerminalIntent:
      type: object
      required: [id, transaction_id, leg_key, kind, state, amount_cents, provider_ref, answer_verdict]
      properties:
        id: {type: string, format: uuid}
        transaction_id: {type: string, format: uuid}
        leg_key: {type: string, description: "The tender leg inside the transaction this intent holds."}
        kind: {type: string, enum: [sale, refund, void]}
        state: {type: string, enum: [claimed, pending_at_device, authorized, declined, lost]}
        amount_cents: {type: integer, format: int64}
        provider_ref: {type: string, description: "The device's own reference for the leg, empty until dispatched."}
        answer_verdict: {type: string, enum: ["", authorized, declined], description: "The landed verdict; empty while none has."}
    PosTerminalSweepResult:
      type: object
      required: [claimed_closed, dispatched_lost]
      properties:
        claimed_closed: {type: integer, format: int64, description: "Claims past their lease that never reached the device, closed lost."}
        dispatched_lost: {type: integer, format: int64, description: "Legs at the device past their lease, turned lost with a manager item each."}
    PosTerminalLostItem:
      type: object
      required: [id, intent_id, branch_id, register_id, transaction_id, kind, amount_cents, device_id, provider_ref, state, late_verdict, late_provider_ref]
      properties:
        id: {type: string, format: uuid}
        intent_id: {type: string, format: uuid}
        branch_id: {type: string, format: uuid}
        register_id: {type: string}
        transaction_id: {type: string, format: uuid}
        kind: {type: string, enum: [sale, refund, void]}
        amount_cents: {type: integer, format: int64}
        device_id: {type: string}
        provider_ref: {type: string}
        state: {type: string, enum: [open, resolving, resolved_authorized, resolved_declined]}
        late_verdict:
          type: string
          enum: ["", authorized, declined]
          description: "The device's own late verdict when its answer arrived after the sweep or against a recorded verdict; empty when none did."
        late_provider_ref:
          type: string
          description: "The reference the late answer carried; empty when none did."
    PosTerminalLostItemList:
      type: object
      required: [items, next_cursor, limit]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PosTerminalLostItem"
        next_cursor: {type: [string, "null"], description: "Null: the queue's open items are one page."}
        limit: {type: integer}
    PosResolveTerminalLostItemRequest:
      type: object
      required: [outcome]
      properties:
        outcome:
          type: string
          enum: [authorized, declined]
          description: "What the terminal's own record said."
        reference:
          type: string
          description: "The terminal's own record the manager read."
        reason:
          type: string
