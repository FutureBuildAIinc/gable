        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "404":
          $ref: "#/components/responses/WireNotFound"
        "503":
          $ref: "#/components/responses/InternalError"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/pos/end-of-day/{id}/deposit-match:
    post:
      operationId: posEndOfDayDepositMatch
      tags: [pos]
      summary: Match the day's deposit to a bank statement line
      description: >-
        Claims an unmatched deposit line of the bank statement through bank
        reconciliation (status matched) and records on the day's close the line,
        the difference in cents (the bank's amount less the cash and checks to
        deposit) and who matched it. A day matches once (409
        deposit_already_matched); a line that is not an unmatched deposit, or that
        another day holds, is 409 bank_line_unavailable; a line of another bank
        account than the day's is 409 bank_account_mismatch; an unknown line is 404.
        The claimed line is linked to the close's deposit entry
        (bank_transactions.matched_journal_entry_id).
        The audit row and till.deposit_matched are written in the same
        transaction. Finance and owner only, never a machine key.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: "#/components/parameters/XBranchId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PosDepositMatchRequest"
      responses:
        "200":
          description: The day's close with its deposit match.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PosDayClose"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "404":
          $ref: "#/components/responses/WireNotFound"
        "409":
          $ref: "#/components/responses/ConflictEither"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/pos/zreports:
    get:
      operationId: posZReportList
      tags: [pos]
      summary: The day's Z reports
      description: >-
