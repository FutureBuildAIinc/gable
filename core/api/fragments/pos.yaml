        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PosOfflinePolicyRequest"
      responses:
        "200":
          description: The offline counter policy now in force.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PosOfflinePolicy"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "404":
          $ref: "#/components/responses/WireNotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/pos/offline/exceptions:
    get:
      operationId: posOfflineExceptionList
      tags: [pos]
      summary: A branch's offline exception queue
      description: >-
        The offline sales the sync could not post or could not verify (ADR 0011
        section 3.4), oldest first, a cursor page. status open (the default)
        lists the open and held rows, held only the held ones, resolved the
        rows a manager or the sync settled, all every row. Each row carries the
        actions a manager may take now. Admin, owner and finance; a branch the
        caller may not target is 403.
      parameters:
        - name: branch_id
          in: query
          required: true
          schema: {type: string, format: uuid}
        - name: status
          in: query
          required: false
          schema: {type: string, enum: [open, held, resolved, all]}
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/XBranchId"
      responses:
        "200":
          description: The page of offline exceptions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PosOfflineExceptionPage"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/pos/offline/exceptions/{id}:
    get:
      operationId: posOfflineExceptionGet
      tags: [pos]
      summary: One offline exception
      description: >-
        One row of the offline exception queue with the signed sale as
        received. Admin, owner and finance; a row of a branch the caller may
        not target is 403.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: "#/components/parameters/XBranchId"
      responses:
        "200":
          description: The offline exception.
          headers:
            ETag:
              description: The row's revision.
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PosOfflineException"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "404":
          $ref: "#/components/responses/WireNotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/pos/offline/exceptions/{id}/resolve:
    post:
      operationId: posOfflineExceptionResolve
      tags: [pos]
      summary: Resolve an offline exception
      description: >-
        A manager's resolution (ADR 0011 section 3.4), in one transaction under
        the register's device row and then the exception row: retry, accept,
        late_post, write_off, post_separate, restate or review, as the row's
        actions allow (409 resolution_not_allowed otherwise). A posting the
        live checks refuse again answers 409 with the check's own code
        (insufficient_stock, session_closed, stock_unit_changed and the like)
        and writes nothing. A late post with no open date is 409 no_open_date;
        a held item above another held one is 409 offline_gap_order. Owner and
        admin only, never a machine key and never the sale's own cashier
        (403). Audited as pos.offline_exception.resolved with the event
        pos_offline.exception_resolved.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/XBranchId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PosOfflineResolveRequest"
      responses:
        "200":
          description: The exception as the resolution left it.
          headers:
            ETag:
              description: The row's revision.
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PosOfflineException"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "404":
          $ref: "#/components/responses/WireNotFound"
        "409":
          $ref: "#/components/responses/ConflictEither"
        "428":
          $ref: "#/components/responses/WirePreconditionRequired"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/pos/offline/registers/{id}/device:
    get:
      operationId: posOfflineRegisterDeviceGet
      tags: [pos]
      summary: A register's device enrolment
      description: >-
        The register's live enrolment (its epoch, public key, the mark and
        chain head the server holds, the mark it confirmed), the last revoked
        one, and next_epoch, the epoch the next enrolment must name (ADR 0011
        section 6.1). Admin, owner and finance; a register of a branch the
        caller may not reach is 403, an unknown register 404.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
        - $ref: "#/components/parameters/XBranchId"
      responses:
        "200":
          description: The register's enrolment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PosRegisterEnrolment"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "404":
          $ref: "#/components/responses/WireNotFound"
        "409":
          $ref: "#/components/responses/ConflictEither"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: posOfflineRegisterDeviceEnrol
      tags: [pos]
      summary: Enrol a register's device for offline selling
      description: >-
        Records the shell's Ed25519 public key for the register's next epoch
        and revokes the previous key in the same transaction (ADR 0011 section
        6.1). An owner or admin act, never a machine key: the manager proves
        presence with their counter PIN (the step up's own check, failure count
        and lock). device_epoch must be the register's next_epoch (409
        epoch_moved otherwise); a key is enrolled once (409
        public_key_reused). The register's latest epoch, live or already
        revoked, gets an unknown_tail exception over the numbers the server
        never recorded: the higher of the device's last reported mark and
        previous_epoch_mark (the mark the shell's keychain kept for that
        epoch), less the server's recorded mark, once per epoch. Audited as
        pos.register_device.enrolled (and .revoked for the replaced key).
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
        - $ref: "#/components/parameters/XBranchId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PosEnrolDeviceRequest"
      responses:
        "201":
          description: The register's enrolment now in force.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PosRegisterEnrolment"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "404":
          $ref: "#/components/responses/WireNotFound"
        "409":
          $ref: "#/components/responses/ConflictEither"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/pos/offline/registers/{id}/device/revoke:
    post:
      operationId: posOfflineRegisterDeviceRevoke
      tags: [pos]
      summary: Revoke a register's device
      description: >-
        Revokes the register's enrolment of an epoch (ADR 0011 section 6.1):
        the old key's later sales go to the exception queue as device_revoked.
        An owner or admin act with the counter PIN, never a machine key;
        audited as pos.register_device.revoked. sessions says what was done to
        the web sessions signed in on the register's shell: supported false
        where the sign in method cannot end them from the server.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
        - $ref: "#/components/parameters/XBranchId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PosRevokeDeviceRequest"
      responses:
        "200":
          description: The register's enrolment after the revocation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PosRegisterEnrolment"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "404":
          $ref: "#/components/responses/WireNotFound"
        "409":
          $ref: "#/components/responses/ConflictEither"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/pos/offline/snapshot:
    get:
      operationId: posOfflineSnapshotGet
      tags: [pos]
      summary: The register's offline snapshot
      description: >-
        What the register may sell on offline (ADR 0011 section 5.4), for its
        enrolled epoch and its open till session: the policy, the branch rate,
        the products with their unit sets, the cached accounts with their room
        at issue, and the price sheet (the engine's answer with rung 2 skipped,
        at the session's business date: the walk-in's rows, each account's own
        rows, each account level's rows). Stored so a signed sale can name it.
        high_seq is the highest sequence the register has assigned: above the
        server's recorded mark, or with an open bad copy of the epoch, the take
        is refused 409 queue_not_drained. The ETag is the document's digest; a
        take whose content has not moved answers the stored snapshot, and
        If-None-Match with it answers 304. The person signed in at the counter,
        never a machine key; a register of a branch the caller may not reach is
        403.
      parameters:
        - name: register_id
          in: query
          required: true
          schema: {type: string}
        - name: high_seq
          in: query
          required: true
          schema: {type: integer, format: int64, minimum: 0}
        - name: If-None-Match
          in: header
          required: false
          schema: {type: string}
        - $ref: "#/components/parameters/XBranchId"
      responses:
        "200":
          description: The register's snapshot.
          headers:
            ETag:
              description: The snapshot's digest in quotes. Send it back as If-None-Match.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PosOfflineSnapshot"
        "304":
          description: The snapshot has not moved since the ETag sent.
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "404":
          $ref: "#/components/responses/WireNotFound"
        "409":
          $ref: "#/components/responses/ConflictEither"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/pos/end-of-day:
    get:
      operationId: posEndOfDayGet
      tags: [pos]
      summary: The branch's end of day summary
      description: >-
        One branch's business date (date, YYYY-MM-DD in the branch's time zone,
        defaulting to the branch's today): each register's sessions, tenders by
        method, movements, expected against counted, over and short, the cash and
        checks to deposit and the card total, and the branch totals, each the sum
        of its registers' to the cent. A session belongs to the date it opened.
        cash_to_deposit is the counted cash (the expected, for a drawer still
        open) less the opening float plus the drops and pickups; checks_to_deposit
        the counted checks; card_total the net card collected.
        collections_net_cents is the branch's net collections of the date as the
        Daily Till counts them. ready_to_close is true when no drawer is open or
        waiting for sign off. close is the day's close once it exists. Finance
        and owner only. A branch the caller may not target is 403; an unknown
        branch 404.
      parameters:
        - name: branch_id
          in: query
          required: true
          schema: {type: string, format: uuid}
        - name: date
          in: query
          required: false
          schema: {type: string, format: date}
        - $ref: "#/components/parameters/XBranchId"
      responses:
        "200":
          description: The branch day.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PosBranchDay"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "404":
          $ref: "#/components/responses/WireNotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/pos/end-of-day/close:
    post:
      operationId: posEndOfDayClose
      tags: [pos]
      summary: Close the branch's business date
      description: >-
        Closes the date for the branch: who, when, the deposit slip reference and
        a frozen totals snapshot, with the audit row and till.day_closed in one
        transaction. Refused 409 till_open while a drawer of the branch dated that
        day or before is open, 409 signoff_pending while one waits for a manager
        (both blockers when both), 409 day_already_closed for a second close of a
        branch date, 409 date_not_reached for a date after the branch's today.
        The close posts the deposit it records in the same transaction: debit the
        GL account of the bank account named by bank_account_id (required, 400,
        when cash and checks are to be deposited; 404 for an unknown bank account,
        409 bank_account_inactive for a retired one) for the cash and checks to
        deposit, credit 1015 Undeposited Funds for the day's drops and pickups,
        credit 1010 Cash for the rest (a debit when the drawers held less than the
        safe's share). Cards are not part of the deposit. The entry is named on the
        close (gl_entry_id); a closed fiscal period is 409 period_closed. A day with
        nothing to deposit and nothing in 1015 needs no bank account and posts
        nothing. The close takes the branch's day lock a drawer opening also takes, so a
        closed day never holds an open drawer and a branch whose date is closed
        takes no new drawer (409 day_closed on POST /pos/till/open). Finance and
        owner only, never a machine key; a branch the caller may not target is 403.
      parameters:
        - $ref: "#/components/parameters/XBranchId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PosEndOfDayCloseRequest"
      responses:
        "201":
          description: The closed branch day.
          headers:
            Location:
              description: The day's summary route.
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PosBranchDay"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "404":
          $ref: "#/components/responses/WireNotFound"
        "409":
          $ref: "#/components/responses/ConflictEither"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/pos/end-of-day/{id}/reopen:
    post:
      operationId: posEndOfDayReopen
      tags: [pos]
      summary: Reopen a closed branch day
      description: >-
        Reopens a closed branch day for a late drawer or a correction. Under the
        branch's day lock, the close's deposit entry is reversed (a reversal
        entry naming it, dated the branch's today; a closed fiscal period is 409
        period_closed), the close row is marked REOPENED (keeping its frozen
        totals snapshot and naming the reversal entry) so the day closes again
        like any open day, and the audit row (with the reason) and
        till.day_reopened are written, all in one transaction. A blank reason is
        a 400. A close already reopened answers 409 day_not_closed, and a day
        whose deposit is matched to a bank statement line cannot reopen: 409
        deposit_already_matched. A close the caller's branch context hides
        answers 404; a caller with no branch in context and no grant for it, 403.
        Finance and owner only, never a machine key.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: "#/components/parameters/XBranchId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PosEndOfDayReopenRequest"
      responses:
        "200":
          description: The reopened branch day, close null.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PosBranchDay"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "404":
          $ref: "#/components/responses/WireNotFound"
        "409":
          $ref: "#/components/responses/ConflictEither"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/pos/end-of-day/{id}/deposit-candidates:
    get:
      operationId: posEndOfDayDepositCandidates
      tags: [pos]
      summary: Bank statement lines that may be the day's deposit
      description: >-
        The unmatched deposit lines of the bank statement dated from three days
        before the business date to ten days after, nearest to the day's cash and
        checks to deposit first, at most 20. A close the caller's branch context
        hides answers 404; a caller with no branch in context and no grant, 403.
        Finance and owner only.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: "#/components/parameters/XBranchId"
      responses:
        "200":
          description: The candidate lines.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PosDepositCandidatePage"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "404":
          $ref: "#/components/responses/WireNotFound"
        "503":
          $ref: "#/components/responses/InternalError"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/pos/end-of-day/{id}/deposit-match:
    post:
      operationId: posEndOfDayDepositMatch
      tags: [pos]
      summary: Match the day's deposit to a bank statement line
      description: >-
        Claims an unmatched deposit line of the bank statement through bank
        reconciliation (status matched) and records on the day's close the line,
        the difference in cents (the bank's amount less the cash and checks to
        deposit) and who matched it. A day matches once (409
        deposit_already_matched); a line that is not an unmatched deposit, or that
        another day holds, is 409 bank_line_unavailable; a line of another bank
        account than the day's is 409 bank_account_mismatch; an unknown line is 404.
        The claimed line is linked to the close's deposit entry
        (bank_transactions.matched_journal_entry_id).
        The audit row and till.deposit_matched are written in the same
        transaction. Finance and owner only, never a machine key.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: "#/components/parameters/XBranchId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PosDepositMatchRequest"
      responses:
        "200":
          description: The day's close with its deposit match.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PosDayClose"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "404":
          $ref: "#/components/responses/WireNotFound"
        "409":
          $ref: "#/components/responses/ConflictEither"
        "500":
          $ref: "#/components/responses/InternalError"
