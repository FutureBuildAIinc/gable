      properties:
        id: {type: string, format: uuid}
        position: {type: integer}
        product_id: {type: [string, "null"], format: uuid}
        description: {type: string}
        quantity: {type: [string, "null"], description: "A negative decimal string."}
        uom: {type: [string, "null"]}
        unit_price_ten_thousandths: {type: [integer, "null"], format: int64}
        line_total_cents: {type: [integer, "null"], format: int64}
        restock: {type: boolean}
        reason_code: {$ref: "#/components/schemas/PosReturnReasonCode"}
        restocking_fee_cents: {type: integer, format: int64, description: "The fee this line's reason withheld from its refund, half even to the cent."}
        mis_tint: {type: boolean, description: "The mis tint return (row CP-16): the store mixed the wrong colour, so the tinted line returned."}
        tinted_return: {type: boolean, description: "A returned line whose sale carried a tint: the can goes to the mistint rack, never back into saleable stock."}
    PosTillSession:
      type: object
      description: >-
        One drawer shift. The expected cash is the sum of the session's cash
        payments (already net of change) plus the opening float less cash
        refunds.
      required: [id, register_id, branch_id, cashier_id, status, opening_float_cents, opened_at, closed_at, expected_by_method, counted_by_method, over_short_cents, gl_entry_id, notes, closed_by, variance_threshold_cents, sign_off]
      properties:
        id: {type: string, format: uuid}
        register_id: {type: string}
        branch_id: {type: [string, "null"], format: uuid}
        cashier_id: {type: string, format: uuid}
        status: {$ref: "#/components/schemas/PosTillStatus"}
        opening_float_cents: {type: integer, format: int64}
        opened_at: {type: string, format: date-time}
        closed_at: {type: [string, "null"], format: date-time}
        expected_by_method:
          type: object
          additionalProperties: {type: integer, format: int64}
          description: "The expected cents per lowercase method; present once the session has sales."
        counted_by_method:
          type: object
          additionalProperties: {type: integer, format: int64}
        over_short_by_method:
          type: object
          additionalProperties: {type: integer, format: int64}
          description: "The signed variance cents per lowercase method; present once the drawer is counted."
        over_short_cents: {type: [integer, "null"], format: int64, description: "Set by the close."}
        gl_entry_id: {type: [string, "null"], format: uuid, description: "The 5030 over/short entry the close (or the sign off) booked."}
        notes: {type: string}
        closed_by: {type: [string, "null"], description: "Who counted and closed the drawer."}
        variance_threshold_cents: {type: [integer, "null"], format: int64, description: "The branch's threshold in force at the close; null when none was."}
        sign_off:
          description: "The manager's release of a close that passed the threshold; null otherwise."
          oneOf:
            - $ref: "#/components/schemas/PosTillSignOff"
            - type: "null"
    PosTillMovementRequest:
      type: object
      required: [kind, amount_cents]
      properties:
        kind: {$ref: "#/components/schemas/PosTillMovementKind"}
        amount_cents: {type: integer, format: int64, minimum: 1}
        reason_code:
          description: "Required for paid_in and paid_out, absent for a drop or pickup."
          oneOf:
            - $ref: "#/components/schemas/PosTillReasonCode"
            - type: "null"
        note: {type: [string, "null"], description: "Required, not blank, when the reason_code is other."}
        taken_by: {type: [string, "null"], description: "A pickup's second person, required there and absent for any other kind. With an approval_token the manager is named by their approval, not typed."}
        approval_token: {type: string, description: "A manager's step up approval (POST /pos/step-up), spent by this one pickup: the manager it names is the taker. Only a pickup carries one."}
    PosTillMovementKind:
      type: string
      enum: [safe_drop, pickup, paid_in, paid_out]
    PosTillReasonCode:
      type: string
      enum: [supplies, freight, fuel, postage, meals, repairs, fee_received, vendor_refund, other]
    PosTillMovement:
      type: object
      required: [id, till_session_id, register_id, branch_id, kind, amount_cents, reason_code, note, actor, taken_by, gl_entry_id, created_at]
      properties:
        id: {type: string, format: uuid}
        till_session_id: {type: string, format: uuid}
        register_id: {type: string}
        branch_id: {type: string, format: uuid}
        kind: {$ref: "#/components/schemas/PosTillMovementKind"}
        amount_cents: {type: integer, format: int64}
        reason_code:
          oneOf:
            - $ref: "#/components/schemas/PosTillReasonCode"
            - type: "null"
        note: {type: string}
        actor: {type: string}
        taken_by: {type: [string, "null"]}
        gl_entry_id: {type: [string, "null"], format: uuid}
        created_at: {type: string, format: date-time}
    PosTillMovementPage:
      type: object
      required: [items, next_cursor, limit]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/PosTillMovement"}
        next_cursor: {type: [string, "null"]}
        limit: {type: integer}
    PosTillSessionPage:
      type: object
      required: [items, next_cursor, limit]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/PosTillSession"}
        next_cursor: {type: [string, "null"]}
        limit: {type: integer}
    PosStepUpRequest:
      type: object
      additionalProperties: false
      required: [act, manager, pin, target_id]
      properties:
        act: {type: string, enum: [override, pickup, signoff]}
        kind: {type: string, enum: [account, check, refund_method], description: "The override's kind; required when the act is an override, absent otherwise. The approval binds it."}
        manager: {type: string, description: "The manager's staff number or staff id."}
        pin: {type: string, description: "The manager's counter PIN. Verified in constant time, never logged."}
        target_id: {type: string, format: uuid, description: "The act's target: the sale (an override) or the till session (a pickup, a sign off)."}
        amount_cents: {type: integer, format: int64, minimum: 1, description: "The amount the manager approves: the override's cap or the pickup's amount; required for an override or a pickup, absent for a sign off. The approval binds it."}
      allOf:
        - if:
            properties: {act: {const: override}}
          then:
            required: [kind, amount_cents]
        - if:
            properties: {act: {const: pickup}}
          then:
            required: [amount_cents]
            not: {required: [kind]}
        - if:
            properties: {act: {const: signoff}}
          then:
            not:
              anyOf:
                - required: [kind]
                - required: [amount_cents]
    PosStepUpApproval:
      type: object
      required: [token, manager_name, expires_at]
      properties:
        token: {type: string, description: "The opaque token the one act spends as approval_token. Stored only as its SHA-256 hash."}
        manager_name: {type: string, description: "The manager's name, for the screen to say who approved."}
        expires_at: {type: string, format: date-time}
    PosStepUpManager:
      type: object
      required: [id, full_name, staff_no, role]
      properties:
        id: {type: string, format: uuid}
        full_name: {type: string}
        staff_no: {type: string}
        role: {type: string}
    PosStepUpManagerPage:
      type: object
      required: [items, next_cursor, limit]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/PosStepUpManager"}
        next_cursor: {type: [string, "null"]}
        limit: {type: integer}
    PosTillSignoffRequest:
      type: object
      required: [reason]
      properties:
        approval_token: {type: string, description: "A manager's step up approval (POST /pos/step-up), spent by this one sign off: the manager it names is the signer. Absent, the signed in caller needs the finance or owner role."}
        reason: {type: string, minLength: 1, description: "Why the variance is accepted; not blank."}
    PosTillSignOff:
      type: object
      required: [signed_off_by, reason, signed_off_at]
      properties:
        signed_off_by: {type: string}
        reason: {type: string}
        signed_off_at: {type: string, format: date-time}
    PosTillPolicy:
      type: object
      required: [branch_id, variance_threshold_cents, branch_threshold_cents, default_threshold_cents, source]
      properties:
        branch_id: {type: string, format: uuid}
        variance_threshold_cents: {type: [integer, "null"], format: int64, description: "The figure in force; null when none exists."}
        branch_threshold_cents: {type: [integer, "null"], format: int64, description: "The branch's own override."}
        default_threshold_cents: {type: [integer, "null"], format: int64, description: "The database wide default."}
        source: {type: string, enum: [branch, default, none]}
    PosTillPolicyRequest:
      type: object
      required: [branch_id, variance_threshold_cents]
      properties:
        branch_id: {type: string, format: uuid}
        variance_threshold_cents: {type: [integer, "null"], format: int64, minimum: 0, description: "Null clears the branch's override."}
    PosOfflineTender:
      type: string
      enum: [cash, check, account]
    PosOfflinePolicy:
      type: object
      required:
        - branch_id
        - enabled
        - tenders
        - sale_cap_cents
        - check_cap_cents
        - account_cap_cents
        - queue_total_cap_cents
        - max_queued
        - enrolled_register_count
        - max_account_exposure_cents
        - source
        - updated_by
        - updated_at
        - revision
      properties:
        branch_id: {type: string, format: uuid}
        enabled: {type: boolean}
        tenders:
          type: array
          items: {$ref: "#/components/schemas/PosOfflineTender"}
        sale_cap_cents: {type: integer, format: int64, minimum: 0}
        check_cap_cents: {type: integer, format: int64, minimum: 0}
        account_cap_cents: {type: integer, format: int64, minimum: 0}
        queue_total_cap_cents: {type: integer, format: int64, minimum: 0}
        max_queued: {type: integer, minimum: 0}
        enrolled_register_count: {type: integer, minimum: 0, description: "Active (unrevoked) enrolled registers on the branch."}
        max_account_exposure_cents: {type: integer, format: int64, minimum: 0, description: "Worst case exposure for one account across the branch's enrolled registers (account_cap_cents times enrolled_register_count)."}
        source: {type: string, enum: [branch, default, none]}
        updated_by: {type: [string, "null"]}
        updated_at: {type: [string, "null"], format: date-time}
        revision: {type: [integer, "null"], format: int64}
    PosOfflineAction:
      type: string
      enum: [retry, accept, late_post, write_off, post_separate, restate, review]
    PosOfflineException:
      type: object
      required: [id, sale_id, register_id, branch_id, device_epoch, device_seq, gap_from_seq, gap_to_seq, offline_ref,
        till_session_id, business_date, customer_id, cashier_id, warning_alert_ids, reason_code, reason_message,
        cash_cents, check_cents, account_cents, total_cents, status, actions, resolution_action, resolution_reason,
        resolved_by, resolved_at, posted_sale_id, signed_sale, revision, created_at]
      properties:
        id: {type: string, format: uuid}
        sale_id: {type: string, format: uuid}
        register_id: {type: string}
        branch_id: {type: string, format: uuid}
        device_epoch: {type: integer, format: int64}
        device_seq: {type: integer, format: int64}
        gap_from_seq: {type: [integer, "null"], format: int64, description: "The first missing number a sequence_gap or unknown tail item names."}
        gap_to_seq: {type: [integer, "null"], format: int64}
        offline_ref: {type: string, description: "The printed number <register>-<epoch>-<seq>; empty on a gap item."}
        till_session_id: {type: [string, "null"], format: uuid}
        business_date: {type: string, format: date}
        customer_id: {type: [string, "null"], format: uuid}
        cashier_id: {type: [string, "null"], format: uuid, description: "The signed sale's cashier, who may not resolve it."}
        warning_alert_ids:
          type: array
          items: {type: string, format: uuid}
        reason_code: {type: string}
        reason_message: {type: string}
        cash_cents: {type: integer, format: int64, description: "The cash the drawer kept (the change out of it)."}
        check_cents: {type: integer, format: int64}
        account_cents: {type: integer, format: int64}
        total_cents: {type: integer, format: int64}
        status: {type: string, enum: [open, held, resolved, relinked, superseded, found, reviewed]}
        actions:
          type: array
          items: {$ref: "#/components/schemas/PosOfflineAction"}
        resolution_action: {type: [string, "null"]}
        resolution_reason: {type: [string, "null"]}
        resolved_by: {type: [string, "null"]}
        resolved_at: {type: [string, "null"], format: date-time}
        posted_sale_id: {type: [string, "null"], format: uuid}
        signed_sale: {type: object, additionalProperties: true, description: "The signed sale as received ({} on a gap or unknown tail item)."}
        revision: {type: integer, format: int64}
        created_at: {type: string, format: date-time}
    PosOfflineExceptionPage:
      type: object
      required: [items, next_cursor, limit]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/PosOfflineException"}
        next_cursor: {type: [string, "null"]}
        limit: {type: integer}
    PosOfflineResolveRequest:
      type: object
      additionalProperties: false
      required: [action, reason]
      properties:
        action: {$ref: "#/components/schemas/PosOfflineAction"}
        reason: {type: string, minLength: 1, description: "Why the manager resolves it so."}
        revision: {type: integer, format: int64, description: "The row's revision; If-Match is the alternative."}
    PosOfflinePolicyRequest:
      type: object
      required: [branch_id]
      properties:
        branch_id: {type: string, format: uuid}
        clear: {type: boolean, description: "When true, deletes the branch override so the database wide defaults or none apply."}
        enabled: {type: boolean, description: "Required unless clear is true."}
        tenders:
          type: array
          items: {$ref: "#/components/schemas/PosOfflineTender"}
        sale_cap_cents: {type: integer, format: int64, minimum: 0}
        check_cap_cents: {type: integer, format: int64, minimum: 0}
        account_cap_cents: {type: integer, format: int64, minimum: 0}
        queue_total_cap_cents: {type: integer, format: int64, minimum: 0}
        max_queued: {type: integer, minimum: 0, maximum: 100000}
    PosRegisterDevice:
      type: object
      required: [register_id, device_epoch, public_key, enrolled_by, enrolled_at, revoked_by, revoked_at, revoke_reason,
        high_seq, chain_head, confirmed_seq, reported_seq]
      properties:
        register_id: {type: string}
        device_epoch: {type: integer, format: int64, minimum: 1}
        public_key: {type: string, description: "The device's Ed25519 public key, 64 hex characters."}
        enrolled_by: {type: string, description: "The staff id of the manager whose PIN proved the enrolment."}
        enrolled_at: {type: string, format: date-time}
        revoked_by: {type: [string, "null"]}
        revoked_at: {type: [string, "null"], format: date-time}
        revoke_reason: {type: [string, "null"]}
        high_seq: {type: integer, format: int64, minimum: 0}
        chain_head: {type: string}
        confirmed_seq: {type: integer, format: int64, minimum: 0}
        reported_seq: {type: integer, format: int64, minimum: 0}
    PosRegisterSessionsEnded:
      type: object
      required: [supported, ended, message]
      properties:
        supported: {type: boolean}
        ended: {type: integer, minimum: 0}
        message: {type: string}
    PosRegisterEnrolment:
      type: object
      required: [register_id, branch_id, next_epoch, device, previous, unknown_tail_exception_id, sessions]
      properties:
        register_id: {type: string}
        branch_id: {type: string, format: uuid}
        next_epoch: {type: integer, format: int64, minimum: 1}
        device:
          oneOf:
            - $ref: "#/components/schemas/PosRegisterDevice"
            - type: "null"
        previous:
          oneOf:
            - $ref: "#/components/schemas/PosRegisterDevice"
            - type: "null"
        unknown_tail_exception_id: {type: [string, "null"], format: uuid}
        sessions:
          oneOf:
            - $ref: "#/components/schemas/PosRegisterSessionsEnded"
            - type: "null"
    PosEnrolDeviceRequest:
      type: object
      required: [device_epoch, public_key, manager, pin]
      properties:
        device_epoch: {type: integer, format: int64, minimum: 1, description: "The register's next_epoch, the epoch the shell made its key for."}
        public_key: {type: string, description: "The device's Ed25519 public key, 64 hex characters."}
        manager: {type: string, description: "The manager's staff id, staff number or email."}
        pin: {type: string, description: "The manager's counter PIN."}
        previous_epoch_mark:
          type: object
          required: [device_epoch, last_seq]
          properties:
            device_epoch: {type: integer, format: int64, minimum: 1}
            last_seq: {type: integer, format: int64, minimum: 0}
    PosRevokeDeviceRequest:
      type: object
      required: [device_epoch, reason, manager, pin]
      properties:
        device_epoch: {type: integer, format: int64, minimum: 1}
        reason: {type: string, maxLength: 500}
        manager: {type: string}
        pin: {type: string}
    PosOfflineSnapshot:
      type: object
      required: [snapshot_id, register_id, branch_id, device_epoch, issued_at, till_session, policy, tax, walk_in_customer,
        price_sheet, products, accounts]
      properties:
        snapshot_id: {type: string, format: uuid}
        register_id: {type: string}
        branch_id: {type: string, format: uuid}
        device_epoch: {type: integer, format: int64, minimum: 1}
        issued_at: {type: string, format: date-time}
        till_session:
          type: object
          required: [id, cashier_id, opened_at, business_date, opening_float_cents]
          properties:
            id: {type: string, format: uuid}
            cashier_id: {type: string, format: uuid}
            opened_at: {type: string, format: date-time}
            business_date: {type: string, format: date}
            opening_float_cents: {type: integer, format: int64}
        policy:
          type: object
          required: [enabled, max_sale_cents, max_check_cents, default_check_limit_cents, account_cap_cents, max_queue_count,
            max_queue_total_cents, allowed_tenders, require_id_for_tenders, cash_rounding_mode]
          properties:
            enabled: {type: boolean}
            max_sale_cents: {type: integer, format: int64, minimum: 0}
            max_check_cents: {type: integer, format: int64, minimum: 0}
            default_check_limit_cents: {type: [integer, "null"], format: int64}
            account_cap_cents: {type: integer, format: int64, minimum: 0}
            max_queue_count: {type: integer, format: int64, minimum: 0}
            max_queue_total_cents: {type: integer, format: int64, minimum: 0}
            allowed_tenders:
              type: array
              items: {$ref: "#/components/schemas/PosOfflineTender"}
            require_id_for_tenders:
              type: array
              items: {type: string}
            cash_rounding_mode: {type: string, enum: [OFF, NEAREST_5_CENTS]}
        tax:
          type: object
          required: [branch_rate, provider_configured]
          properties:
            branch_rate: {type: string, description: "The branch's rate as a decimal string."}
            provider_configured: {type: boolean}
        walk_in_customer:
          type: object
          required: [id, currency]
          properties:
            id: {type: string, format: uuid}
            currency: {type: string}
        price_sheet:
          type: array
          items:
            type: object
            required: [product_id, price_key, price_uom, uom_qty, price_uom_qty, unit_price_ten_thousandths, price_source, price_basis]
            properties:
              product_id: {type: string, format: uuid}
              price_key: {type: string, description: "walkin, customer:<id> or level:<id>."}
              price_uom: {type: string, description: "The unit the engine answered in."}
              uom_qty: {type: string, description: "The exact pair the product's sale unit takes to price_uom, its sale side."}
              price_uom_qty: {type: string, description: "The pair's price side."}
              unit_price_ten_thousandths: {type: integer, format: int64}
              price_source: {type: string, description: "The rung that won, lowercase."}
              price_basis: {type: [string, "null"]}
        products:
          type: array
          items:
            type: object
            required: [id, sku, description, taxable, is_kit, random_length, board_thickness_in, board_width_in, stock_uom,
              sale_uom, price_uom, unit_set, barcode, category, in_stock]
            properties:
              id: {type: string, format: uuid}
              sku: {type: string}
              description: {type: string}
              taxable: {type: boolean}
              is_kit: {type: boolean}
              random_length: {type: boolean}
              board_thickness_in: {type: [string, "null"]}
              board_width_in: {type: [string, "null"]}
              stock_uom: {type: string}
              sale_uom: {type: string}
              price_uom: {type: string}
              unit_set:
                type: array
                items:
                  type: object
                  required: [uom, unit_qty, stock_qty, sell, price]
                  properties:
                    uom: {type: string}
                    unit_qty: {type: string}
                    stock_qty: {type: string}
                    sell: {type: boolean}
                    price: {type: boolean}
              barcode: {type: [string, "null"]}
              category: {type: string}
              in_stock: {type: string, description: "On hand less allocated at the register's branch, in the stocking unit."}
        accounts:
          type: array
          items:
            type: object
            required: [customer_id, account_number, name, currency, tax_exempt, po_required, buyer_roster_required, credit_hold,
              credit_limit_cents, open_receivable_cents, offline_room_cents, check_limit_cents, price_key, level_key, buyers, jobs]
            properties:
              customer_id: {type: string, format: uuid}
              account_number: {type: string}
              name: {type: string}
              currency: {type: string}
              tax_exempt: {type: boolean}
              po_required: {type: boolean}
              buyer_roster_required: {type: boolean}
              credit_hold: {type: boolean}
              credit_limit_cents: {type: integer, format: int64, description: "The limit; for an account with none, its open receivable plus the account cap, so the limit less the open receivable is the cap."}
              open_receivable_cents: {type: integer, format: int64}
              offline_room_cents: {type: integer, format: int64, minimum: 0, description: "The room at issue: the least of the credit room and the account cap, less this register's open account exceptions on the account."}
              check_limit_cents: {type: [integer, "null"], format: int64}
              price_key: {type: string}
              level_key: {type: [string, "null"]}
              buyers:
                type: array
                items:
                  type: object
                  required: [contact_id, name, per_purchase_cap_cents]
                  properties:
                    contact_id: {type: string, format: uuid}
                    name: {type: string}
                    per_purchase_cap_cents: {type: [integer, "null"], format: int64}
              jobs:
                type: array
                items:
                  type: object
                  required: [id, code, name]
                  properties:
                    id: {type: string, format: uuid}
                    code: {type: string}
                    name: {type: string}
    PosSettings:
      type: object
      required: [revision, rules]
      properties:
        revision: {type: integer, format: int64, minimum: 1, description: "The settings resource's revision; a write names it (If-Match and/or the body's revision)."}
        rules:
          type: object
          required: [check_limit_cents, check_id_required, restocking_fees, restocking_fee_defaults, tint_charge, tinted_no_return, card_surcharge]
          properties:
            check_limit_cents: {type: [integer, "null"], format: int64, minimum: 0, description: "The database wide check limit; null is no limit. A customer's own limit wins over it."}
            check_id_required:
              type: object
              required: [mode, over_cents]
              properties:
                mode: {type: string, enum: [never, every_check, over_amount], description: "Never asks for an ID; every_check asks on every check; over_amount asks once the sale's checks total over the figure, and then on every check of the sale."}
                over_cents: {type: [integer, "null"], format: int64, minimum: 1, description: "The figure an over_amount rule names, read against the sale's checks in total; null on the other two."}
            restocking_fees:
              type: object
              description: "The fee each return reason withholds, in basis points: the whole closed list (defective, damaged, wrong_item, ordered_wrong, changed_mind, overbought, other), a reason never set carrying none. The return takes it half even to the cent from each line's own refund, never more than the line."
              required: [defective, damaged, wrong_item, ordered_wrong, changed_mind, overbought, other]
              additionalProperties: {type: integer, minimum: 0, maximum: 10000}
            restocking_fee_defaults:
              type: object
              description: "The suggested fee for each reason, read only: what the settings screen offers a dealer who has set nothing. The reasons that are the customer's own doing carry a figure; the dealer's own and the catch all carry none. Never a fee in force until written."
              required: [defective, damaged, wrong_item, ordered_wrong, changed_mind, overbought, other]
              additionalProperties: {type: integer, minimum: 0, maximum: 10000}
            tint_charge:
              $ref: '#/components/schemas/TintChargeRule'
            tinted_no_return:
              type: boolean
              description: "The dealer's tinted no return policy: a tinted can is not taken back. Off unless the dealer says so, because the rule is a dealer policy and not a law."
            card_surcharge:
              oneOf:
                - $ref: '#/components/schemas/PosCardSurcharge'
                - type: "null"
              description: "The card fee rule of the branch the caller works in (CP-15), or of the default branch in a single branch deployment; null when no branch is known. Off by default."
    PosCardSurcharge:
      type: object
      description: "One branch's card fee rule (CP-15). It records the dealer's intent and the disclosure the clerk and customer see; the processor's enrolment decides the charge, and its answer's figure is what books."
      required: [branch_id, enabled, rate_bps]
      properties:
        branch_id: {type: string, format: uuid}
        enabled: {type: boolean, description: "Off by default."}
        rate_bps: {type: integer, minimum: 0, maximum: 300, description: "The rate shown, in basis points (300 is 3 percent)."}
    PosSettingsRequest:
      type: object
      required: [rules]
      properties:
        rules:
          type: object
          required: [check_limit_cents, check_id_required, restocking_fees]
          properties:
            check_limit_cents: {type: [integer, "null"], format: int64, minimum: 0, description: "Null clears the limit (no limit)."}
            check_id_required:
              type: object
              required: [mode]
              properties:
                mode: {type: string, enum: [never, every_check, over_amount]}
                over_cents: {type: [integer, "null"], format: int64, minimum: 1, description: "Read only when mode is over_amount; dropped otherwise."}
            restocking_fees:
              type: object
              description: "Every reason's fee, the whole closed list: a code outside the list, a figure outside 0 to 10000 basis points, or a reason left out is a 400 naming the field. A figure of 0 clears the reason's row (no fee)."
              required: [defective, damaged, wrong_item, ordered_wrong, changed_mind, overbought, other]
              additionalProperties: {type: integer, minimum: 0, maximum: 10000}
            tint_charge:
              $ref: '#/components/schemas/TintChargeRule'
            tinted_no_return:
              type: boolean
              description: "The dealer's tinted no return policy. Absent is off (the rule is a dealer policy and not a law)." 
            card_surcharge:
              type: object
              description: "The card fee rule of the branch the caller works in (CP-15). Absent leaves it as it is. A rate above 300 basis points (the card brands' 3 percent cap) is a 400 naming the field; a write with no branch known is a 409 branch_required."
              required: [enabled, rate_bps]
              properties:
                enabled: {type: boolean}
                rate_bps: {type: integer, minimum: 0, maximum: 300}
        revision: {type: integer, format: int64, minimum: 1, description: "The revision this write rides; If-Match serves the same role."}
    PosEndOfDayCloseRequest:
      type: object
      required: [branch_id, date, deposit_slip_ref]
      properties:
        branch_id: {type: string, format: uuid}
        date: {type: string, format: date}
        deposit_slip_ref: {type: string, minLength: 1, maxLength: 64}
        bank_account_id:
          type: [string, "null"]
          format: uuid
          description: "The bank account the deposit goes to; required when cash and checks are to be deposited."
    PosEndOfDayReopenRequest:
      type: object
      required: [reason]
      properties:
        reason: {type: string, minLength: 1, description: "Why the day reopens; not blank."}
    PosDepositMatchRequest:
      type: object
      required: [bank_transaction_id]
      properties:
        bank_transaction_id: {type: string, format: uuid}
    PosDayFigures:
      type: object
      required: [session_count, sale_count, sales_total_cents, tendered_by_method, movement_totals_by_kind, expected_by_method, counted_by_method, over_short_cents, cash_to_deposit_cents, checks_to_deposit_cents, card_total_cents]
      properties:
        session_count: {type: integer}
        sale_count: {type: integer}
        sales_total_cents: {type: integer, format: int64}
        tendered_by_method:
          type: object
          additionalProperties: {type: integer, format: int64}
        movement_totals_by_kind:
          type: object
          additionalProperties: {type: integer, format: int64}
        expected_by_method:
          type: object
          additionalProperties: {type: integer, format: int64}
        counted_by_method:
          type: object
          additionalProperties: {type: integer, format: int64}
        over_short_cents: {type: integer, format: int64}
        cash_to_deposit_cents: {type: integer, format: int64}
        checks_to_deposit_cents: {type: integer, format: int64}
        card_total_cents: {type: integer, format: int64}
    PosDaySession:
      type: object
      required: [id, status, cashier_id, closed_by, opened_at, closed_at, opening_float_cents, sale_count, sales_total_cents, tendered_by_method, movement_totals_by_kind, expected_by_method, counted_by_method, over_short_cents, signed_off_by]
      properties:
        id: {type: string, format: uuid}
        status: {$ref: "#/components/schemas/PosTillStatus"}
        cashier_id: {type: string, format: uuid}
        closed_by: {type: [string, "null"]}
        opened_at: {type: string, format: date-time}
        closed_at: {type: [string, "null"], format: date-time}
        opening_float_cents: {type: integer, format: int64}
        sale_count: {type: integer}
        sales_total_cents: {type: integer, format: int64}
        tendered_by_method:
          type: object
          additionalProperties: {type: integer, format: int64}
        movement_totals_by_kind:
          type: object
          additionalProperties: {type: integer, format: int64}
        expected_by_method:
          type: object
          additionalProperties: {type: integer, format: int64}
        counted_by_method:
          type: object
          additionalProperties: {type: integer, format: int64}
        over_short_cents: {type: integer, format: int64}
        signed_off_by: {type: [string, "null"]}
    PosDayRegister:
      allOf:
        - $ref: "#/components/schemas/PosDayFigures"
        - type: object
          required: [register_id, sessions]
          properties:
            register_id: {type: string}
            sessions:
              type: array
              items: {$ref: "#/components/schemas/PosDaySession"}
    PosDepositMatch:
      type: object
      required: [bank_transaction_id, bank_amount_cents, bank_transaction_date, bank_description, difference_cents, matched_by, matched_at]
      properties:
        bank_transaction_id: {type: string, format: uuid}
        bank_amount_cents: {type: integer, format: int64}
        bank_transaction_date: {type: string, format: date}
        bank_description: {type: string}
        difference_cents: {type: integer, format: int64, description: "The bank's amount less the cash and checks to deposit."}
        matched_by: {type: string}
        matched_at: {type: string, format: date-time}
    PosDayClose:
      type: object
      required: [id, branch_id, business_date, deposit_slip_ref, closed_by, closed_at, cash_to_deposit_cents, checks_to_deposit_cents, card_total_cents, totals, bank_account_id, gl_entry_id, deposit_match]
      properties:
        id: {type: string, format: uuid}
        branch_id: {type: string, format: uuid}
        business_date: {type: string, format: date}
        deposit_slip_ref: {type: string}
        closed_by: {type: string}
        closed_at: {type: string, format: date-time}
        cash_to_deposit_cents: {type: integer, format: int64}
        checks_to_deposit_cents: {type: integer, format: int64}
        card_total_cents: {type: integer, format: int64}
        totals:
          type: object
          description: "The frozen branch day summary at the close, a JSON object (the PosBranchDay shape with close null)."
        bank_account_id: {type: [string, "null"], format: uuid, description: "The bank account the deposit goes to."}
        gl_entry_id: {type: [string, "null"], format: uuid, description: "The journal entry that posted the deposit; null for a day with nothing to bank."}
        deposit_match:
          oneOf:
            - $ref: "#/components/schemas/PosDepositMatch"
            - type: "null"
    PosBranchDay:
      type: object
      required: [branch_id, business_date, registers, totals, open_session_count, pending_signoff_count, ready_to_close, collections_net_cents, close]
      properties:
        branch_id: {type: string, format: uuid}
        business_date: {type: string, format: date}
        registers:
          type: array
          items: {$ref: "#/components/schemas/PosDayRegister"}
        totals: {$ref: "#/components/schemas/PosDayFigures"}
        open_session_count: {type: integer}
        pending_signoff_count: {type: integer}
        ready_to_close: {type: boolean}
        collections_net_cents: {type: integer, format: int64}
        close:
          oneOf:
            - $ref: "#/components/schemas/PosDayClose"
            - type: "null"
    PosDepositCandidate:
      type: object
      required: [bank_transaction_id, transaction_date, amount_cents, description, reference]
      properties:
        bank_transaction_id: {type: string, format: uuid}
        transaction_date: {type: string, format: date}
        amount_cents: {type: integer, format: int64}
        description: {type: string}
        reference: {type: string}
    PosDepositCandidatePage:
      type: object
      required: [items, next_cursor, limit]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/PosDepositCandidate"}
        next_cursor: {type: [string, "null"], description: "Always null: at most 20 candidates are listed."}
        limit: {type: integer}
    PosTillReport:
      type: object
      required: [session, sale_count, sales_total_cents, tax_total_cents, change_cents, tendered_by_method, expected_by_method, refunds_by_method, movements, movement_totals_by_kind]
      properties:
        session:
          $ref: "#/components/schemas/PosTillSession"
        movements:
          type: array
          description: "The session's drops, pickups, paid in and paid out, oldest first; the expected cash carries them."
          items: {$ref: "#/components/schemas/PosTillMovement"}
        movement_totals_by_kind:
          type: object
          additionalProperties: {type: integer, format: int64}
        sale_count: {type: integer}
        sales_total_cents: {type: integer, format: int64}
        tax_total_cents: {type: integer, format: int64}
        change_cents: {type: integer, format: int64}
        tendered_by_method:
          type: object
          additionalProperties: {type: integer, format: int64}
        expected_by_method:
          type: object
          additionalProperties: {type: integer, format: int64}
        refunds_by_method:
          type: object
          additionalProperties: {type: integer, format: int64}
          description: "The session's refunds per method (CASH out of the drawer, CARD back to the card), a method present only where the session refunded on it. Always present on a live read; a Z report frozen before the figure existed carries none in its stored payload."
        over_short_by_method:
          type: object
          additionalProperties: {type: integer, format: int64}
          description: "The signed variance cents per lowercase method; present once the drawer is counted."
        offline_held_by_method:
          type: object
          additionalProperties: {type: integer, format: int64}
          description: "The money of the session's offline sales waiting on a manager (refused or held, nothing posted), already inside expected_by_method so the drawer balances; absent when none waits (CP-13 OW)."
    PosRegister:
      type: object
      required: [id, name, branch_id, branch_code, branch_name]
      properties:
