          description: "The reference the late answer carried; empty when none did."
    PosTerminalLostItemList:
      type: object
      required: [items, next_cursor, limit]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PosTerminalLostItem"
        next_cursor: {type: [string, "null"], description: "Null: the queue's open items are one page."}
        limit: {type: integer}
    PosResolveTerminalLostItemRequest:
      type: object
