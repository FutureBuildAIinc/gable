        note: {type: string, description: "Required when the reason is other."}
        revision: {type: [integer, "null"], format: int64, description: "The sale's revision; the If-Match header carries it instead."}
    PosScaleTicketVoidRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: {type: string, description: "A void says why."}
        revision: {type: [integer, "null"], format: int64, description: "The ticket's revision; the If-Match header carries it instead."}
    PosScaleTicketList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PosScaleTicket"
    PosScaleManualReason:
