# SPDX-FileCopyrightText: 2026 FutureBuild, Inc. and OpenLBM contributors
#
# The counter module (POS and till) on the wire contract (ADR 0001; ADR 0005
# sections 2, 4, 9 to 12 and 14.2, item C2-5): a sale is the cart a register
# builds and then one money moment, everything in integer cents and prices at
# scale 4, the lines in the shared salesdoc shape (product, charge and text
# lines, typed override and discount with audit, kits exploding to
# components), tenders in cents stored net of change, each cash, check or card
# tender a payment applied to the sale's invoice (origin POS, pickup) posted
# with tax and COGS inside the sale's own transaction, an ACCOUNT tender left
# open and subject to the credit check, a void of the completed sale while its
# till session is open reversing exactly what it posted, and a return a credit
# memo created, posted, refunded and optionally restocked in one act. The
# sale's POS- and the return's RTN- numbers are human readable (IN-1.3), the
# status is one lowercase field (IN-1.1), money never floats (IN-1.2), the
# day's list is the envelope with an empty page [] in the bytes (IN-1.4), and
# every refusal is the error envelope (IN-3.7). A machine key is refused on
# every route that resolves a cashier: a cashier must be a user.
paths:
  /api/v1/pos/transactions:
    post:
      operationId: posTransactionCreate
      tags: [pos]
      summary: Start a sale
      description: >-
        Opens a cart on a register for the resolved cashier, attached to the
        register's open till session when there is one, at revision 1 with its
        POS- number (the gapped series; a rolled back create abandons the
        number). register_id defaults REG-01; the customer names the account
        the invoice posts to, and its absence means the walk-in customer the
        counter books to. The cashier is the JWT's subject; a machine key is
        refused 403 ("a cashier must be a user").
      parameters:
        - $ref: "#/components/parameters/XBranchId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PosTransactionCreateRequest"
      responses:
        "201":
          description: The new open sale, at revision 1.
          headers:
            ETag:
              description: The document's revision.
              schema: {type: string}
            Location:
              description: The sale's route.
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PosTransaction"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "404":
          $ref: "#/components/responses/WireNotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      operationId: posTransactionList
      tags: [pos]
      summary: List the day's sales
      description: >-
        The list envelope over one register's day: register_id filters (absent
        lists every register's), date is a YYYY-MM-DD that defaults to the
        branch's today, status takes one lowercase value (open, held,
        completed, voided; an uppercase or unknown value is a 400 naming
        status). The page is the whole day newest first, so next_cursor is
        null and limit echoes the 50 the route serves; cursor, limit and
        include are accepted query names. An empty day is [] in the bytes.
      parameters:
        - name: register_id
          in: query
          required: false
          schema: {type: string}
        - name: date
          in: query
          required: false
          schema: {type: string, format: date}
        - name: status
          in: query
          required: false
          schema: {type: string, enum: [open, held, completed, voided]}
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/Include"
        - $ref: "#/components/parameters/XBranchId"
      responses:
        "200":
          description: The day's page of sales.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PosTransactionPage"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/pos/transactions/{id}:
    get:
      operationId: posTransactionGet
      tags: [pos]
      summary: Read a sale
      description: The sale with its lines and tenders, the branch wall applied.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: "#/components/parameters/XBranchId"
      responses:
        "200":
          description: The sale.
          headers:
            ETag:
              description: The document's revision.
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PosTransaction"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "404":
          $ref: "#/components/responses/WireNotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/pos/transactions/{id}/receipt:
    get:
      operationId: posTransactionReceipt
      tags: [pos]
      summary: Print the sale's receipt
      description: >-
        The sale's invoice as the invoice print route answers it (the same
        renderer: Content-Type application/pdf, inline), under the counter's
        own roles admin, owner and cashier, so the till prints its own
        receipt without the documents roles. The sale is read as the sale
        read reads it: a sale that does not exist, or that the caller's
        branch context, wall or bound key pin hides, answers 404, the same
        for both. A sale that is not completed, or has no invoice, answers
        409 with the blocker no_receipt.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: "#/components/parameters/XBranchId"
      responses:
        "200":
          description: The sale's invoice as a PDF document.
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "404":
          $ref: "#/components/responses/WireNotFound"
        "409":
          $ref: "#/components/responses/ConflictEither"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/pos/transactions/{id}/receipt/email:
    post:
      operationId: posTransactionReceiptEmail
      tags: [pos]
      summary: Email the sale's receipt
      description: >-
        Sends the sale's invoice to the account's contact exactly as the
        invoice email route does (the same service call, the same words, 202
        and {"status":"queued"}; the outcome is written to email_deliveries),
        under the counter's own roles admin, owner and cashier. The sale is
        read as the sale read reads it (404 for a sale the caller cannot
        read). A sale that is not completed or has no invoice answers 409
        with the blocker no_receipt; a walk in sale (no customer, or the shared
        walk in customer, whatever address that row holds), or an account
        with no email address on file, answers 409 with the blocker
        no_contact and words the card can show. Nothing is sent for any refusal.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: "#/components/parameters/XBranchId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Email queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceEmailResponse"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "404":
          $ref: "#/components/responses/WireNotFound"
        "409":
          $ref: "#/components/responses/ConflictEither"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/pos/customers:
    get:
      operationId: posCustomerFind
      tags: [pos]
      summary: The counter's customer lookup
      description: >-
        Customers matching the q text (name or account number, at most 10),
        every customer to a user whatever the user's yard or grants (ruling
        A at the counter) and a branch bound key's pin to a key, each with the
        account's standing the charge tender will read: the credit limit
        (null for none, 0 for no credit), the open receivable, the available
        credit and a standing word (good, no_limit, no_credit, over_limit),
        whether the account asks for a purchase order and its open jobs. A
        bare array, never null; q under two characters answers [].
      parameters:
        - name: q
          in: query
          required: false
          schema: {type: string}
        - $ref: "#/components/parameters/XBranchId"
      responses:
        "200":
          description: The matching customers.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PosCounterCustomer"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/pos/registers:
    get:
      operationId: posRegisterList
      tags: [pos]
      summary: The registers the caller may use
      description: >-
        The registers within the caller's reach, each with its branch's code
        and name, ordered by branch then name, in the list envelope: a caller
        with a branch in context (the header, or a branch bound key's pin)
        sees that branch's registers; a user with no header sees the
        branches of the user's grants; an administrator or owner with no
        header sees all. A retired register (not active) is never listed. The counter
        opens on its yard's register.
      parameters:
        - $ref: "#/components/parameters/XBranchId"
      responses:
        "200":
          description: The registers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PosRegisterPage"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/pos/transactions/{id}/customer:
    put:
      operationId: posTransactionCustomer
      tags: [pos]
      summary: Name the sale's customer, purchase order and job
      description: >-
        Names who the sale is for. The customer is named before the first
        line (the lines price for the customer: 409 invalid_state_transition
        once a line exists and the customer would change); the purchase order
        and the job may change while the sale is open. A null customer_id
        makes the sale a walk-in sale again. The job must be an open job of
        the customer. The sale's revision moves; the response is the whole
        sale. A sale that does not exist, or that the caller's branch context
        or wall hides, answers 404, and nothing is written; a caller with no
        branch in context who holds no grant for the sale's branch is refused
        403 by name. A user names any customer whatever the user's yard or
        grants; a customer that does not exist or is inactive, or that a
        branch bound key's pin does not reach, answers 404.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: "#/components/parameters/XBranchId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PosSaleCustomerRequest"
      responses:
        "200":
          description: The sale with its customer named.
          headers:
            ETag:
              description: The document's new revision.
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PosTransaction"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "404":
          $ref: "#/components/responses/WireNotFound"
        "409":
          $ref: "#/components/responses/ConflictEither"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/pos/transactions/{id}/items:
    post:
      operationId: posTransactionAddItem
      tags: [pos]
      summary: Add a line to the sale
      description: >-
        One line in the shared salesdoc shape, parsed under the same rules as
        every sales line (quantity a decimal string, the unit from the product
        when the line names one, the pair when the price unit differs, an
        override or a discount with its reason, a charge by its code, a text
        line a note with nothing priced). A kit explodes to its component
        lines. Only an open sale takes a line (409
        invalid_state_transition). The sale's revision moves; the response is
        the whole sale. A sale that does not exist, or that the caller's branch context
        or wall hides, answers 404, the same for both, and nothing is written;
        a caller with no branch in context who holds no grant for the sale's
        branch is refused 403 by name.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: "#/components/parameters/XBranchId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PosAddLineRequest"
      responses:
        "200":
          description: The sale with the line added.
          headers:
            ETag:
              description: The document's new revision.
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PosTransaction"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "404":
          $ref: "#/components/responses/WireNotFound"
        "409":
          $ref: "#/components/responses/ConflictEither"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/pos/transactions/{id}/items/{itemId}:
    patch:
      operationId: posTransactionChangeItemQuantity
      tags: [pos]
      summary: Change a line's quantity
      description: >-
        Sets the quantity of one line of an open sale. The line is priced
        again by the same step the add uses, at the new quantity (a quantity
        break, a kit's components and the sale's tax follow), keeps its id and
        its place, and the sale's subtotal, tax and total are summed again, so
        the result is what removing the line and adding it at the new
        quantity gives. A price the cashier overrode and a discount stay on
        the line. The body carries the sale's revision (or the request
        carries If-Match): a stale one is 409 stale_revision and none at all
        is 428. Only an open or held sale changes (409 invalid_state_transition), as the
        line add. A fixed cents discount stays the same cents at the new
        quantity (a percent discount scales), as it does when the line is
        removed and added again. A
        quantity of zero or less, or a line that has no quantity (a text
        line) or is a kit's component, is 400. A line that is not on this
        sale is 404. Roles, the branch wall and a bound key's pin are those of
        the line add.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: itemId
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: "#/components/parameters/XBranchId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PosChangeQuantityRequest"
      responses:
        "200":
          description: The whole sale with the line repriced.
          headers:
            ETag:
              description: The document's new revision.
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PosTransaction"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "404":
          $ref: "#/components/responses/WireNotFound"
        "409":
          $ref: "#/components/responses/ConflictEither"
        "428":
          $ref: "#/components/responses/WirePreconditionRequired"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: posTransactionRemoveItem
      tags: [pos]
      summary: Remove a line from the sale
      description: >-
        Removes the line (a kit's component lines go with their parent). Only
        an open sale loses a line (409 invalid_state_transition). The
        response is the whole sale. A sale that does not exist, or that the caller's branch context
        or wall hides, answers 404, the same for both, and nothing is written;
        a caller with no branch in context who holds no grant for the sale's
        branch is refused 403 by name.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: itemId
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: "#/components/parameters/XBranchId"
      responses:
        "200":
          description: The sale with the line removed.
          headers:
            ETag:
              description: The document's new revision.
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PosTransaction"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "404":
          $ref: "#/components/responses/WireNotFound"
        "409":
          $ref: "#/components/responses/ConflictEither"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/pos/transactions/{id}/complete:
    post:
      operationId: posTransactionComplete
      tags: [pos]
      summary: Tender and complete the sale
      description: >-
        The money moment, one transaction: stock out through the inventory
        write path, the invoice (origin POS, pickup) posted through the AR
        core with its tax and COGS legs, each cash, check or card tender a
        payment applied to it and stored net (the tendered amount less change,
        so the payment is the money kept), an ACCOUNT tender left open on the
        invoice and subject to the credit check, the card charged at the
        gateway in the sale's currency before the transaction opens, and the
        pos_transaction.completed event written last: a failing event, audit
        or ledger write rolls the whole sale back (no invoice, payment, stock
        move or entry). Tenders must cover the total (change comes only from
        cash). Refused with 409 and a blocker: insufficient_tender,
        change_from_cash, walk_in_account (an ACCOUNT tender for the walk-in
        customer), card_terminal, card_declined, tax_quote_stale,
        tax_rate_not_configured, credit_limit, insufficient_stock; 503 when
        the tax provider fails before any row is written. The completion
        carries the sale's revision (If-Match or the body's revision; 428
        without one, 409 stale_revision on a stale one). A sale that does not exist, or that the caller's branch context
        or wall hides, answers 404, the same for both, and nothing is written;
        a caller with no branch in context who holds no grant for the sale's
        branch is refused 403 by name.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: "#/components/parameters/XBranchId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PosCompleteRequest"
      responses:
        "200":
          description: The completed sale with its invoice, tenders and change.
          headers:
            ETag:
              description: The document's new revision.
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PosTransaction"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "404":
          $ref: "#/components/responses/WireNotFound"
        "409":
          $ref: "#/components/responses/ConflictEither"
        "428":
          $ref: "#/components/responses/WirePreconditionRequired"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/pos/transactions/{id}/void:
    post:
      operationId: posTransactionVoid
      tags: [pos]
      summary: Void the completed sale
      description: >-
        One transaction in section 11's lock order (the sale, its payments,
        its invoice): each cash or check payment voided, each card payment's
        gateway refund made before the transaction and its application
        reversed with the amount recorded as a refund from its unapplied cash,
        then the invoice voided, the stock back, the ledger exactly reversed
        and the pos_transaction.voided event last. Only while the sale's till
        session is open (409 blocker session_closed: after the session closes
        it is a return). Refused with 409 and a blocker: session_closed,
        card_terminal, card_refund, no_invoice. The void carries the sale's
        revision (428, 409 stale_revision). A sale that does not exist, or that the caller's branch context
        or wall hides, answers 404, the same for both, and nothing is written;
        a caller with no branch in context who holds no grant for the sale's
        branch is refused 403 by name.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: "#/components/parameters/XBranchId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PosVoidRequest"
      responses:
        "200":
          description: The voided sale.
          headers:
            ETag:
              description: The document's new revision.
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PosTransaction"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "404":
          $ref: "#/components/responses/WireNotFound"
        "409":
          $ref: "#/components/responses/ConflictEither"
        "428":
          $ref: "#/components/responses/WirePreconditionRequired"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/pos/products/search:
    get:
      operationId: posProductSearch
      tags: [pos]
      summary: The counter's typeahead
      description: >-
        Products matching the q text (sku or description prefix), at most 20,
        with the price and on hand the counter needs. A bare array, never
        null, the shape this counter's helper surface keeps (the product
        module owns the data). q empty answers [].
      parameters:
        - name: q
          in: query
          required: false
          schema: {type: string}
        - name: limit
          in: query
          required: false
          schema: {type: integer}
        - $ref: "#/components/parameters/XBranchId"
      responses:
        "200":
          description: The matching products.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PosSearchResult"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/pos/tiles:
    get:
      operationId: posTileList
      tags: [pos]
      summary: The counter's catalogue tiles
      description: >-
        The counter's catalogue for the caller's yard (its branch context, as
        the product search takes it): up to eight category chips, the yard's
        categories by units sold, then by product count, then by name, and
        the product tiles. With neither category nor q the tiles are the
        yard's top sellers by quantity sold (completed counter sale lines and
        the lines of invoices at the yard that are not void; a counter sale's
        own invoice, origin POS, is not counted), then by
        description; category keeps one category's products in that order; q
        (two characters or more, sku or description) puts an exact sku first.
        unit_price_cents and in_stock mean what the product search answers.
        image_url is null unless the catalog.product_images setting is on and
        the product has a picture; images is that setting. Never null arrays.
      parameters:
        - name: category
          in: query
          required: false
          schema: {type: string}
        - name: q
          in: query
          required: false
          schema: {type: string, minLength: 2}
        - name: limit
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 48, default: 24}
        - $ref: "#/components/parameters/XBranchId"
      responses:
        "200":
          description: The chips and the tiles.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PosTileSet"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
