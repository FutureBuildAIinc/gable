  /api/v1/pos/returns:
    post:
      operationId: posReturnCreate
      tags: [pos]
      summary: Return goods at the counter
      description: >-
        A return is a credit memo created and posted in one act with its
        restock lines: the memo credits the revenue, reverses the tax and,
        where the lines restock, relieves COGS back and returns the stock,
        refunded in cash (out of the drawer, counted against the session's
        expected) or card (the gateway refund before the transaction) or left
        as account credit (the memo stays open). Lines name the sale line
        they return (its price and cost follow) or stand alone with product,
        quantity and price; quantities are positive on the request and
        negative on the read. The RTN- number and the pos_return.completed
        event land in the same transaction. Refused with 409 and a blocker:
        tax_rate_not_configured, card_terminal, card_refund. The cashier is
        the JWT's subject; a machine key is refused 403.
      parameters:
        - $ref: "#/components/parameters/XBranchId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PosReturnRequest"
      responses:
        "201":
          description: The completed return.
          headers:
            Location:
              description: The return's route.
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PosReturn"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "404":
          $ref: "#/components/responses/WireNotFound"
        "409":
          $ref: "#/components/responses/ConflictEither"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      operationId: posReturnList
      tags: [pos]
      summary: List the day's returns
      description: >-
        The day's returns (register_id filters, date is a YYYY-MM-DD that
        defaults to the branch's today), newest first. A bare array, never
        null.
      parameters:
        - name: register_id
          in: query
          required: false
          schema: {type: string}
        - name: date
          in: query
          required: false
          schema: {type: string, format: date}
        - $ref: "#/components/parameters/XBranchId"
      responses:
        "200":
          description: The day's returns.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PosReturn"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "500":
          $ref: "#/components/responses/InternalError"
