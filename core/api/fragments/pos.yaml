    post:
      operationId: posTillClose
      tags: [pos]
      summary: Close the drawer
      description: >-
        Closes the session on the counted cash: the over or short (counted
        less expected, expected being the session's cash payments net of
        change plus the float less cash refunds) is booked to 5030 inside the
        close's own transaction, the Z report snapshot is written and
        till.closed is the last statement. counted_by_method names the
        counted cents per lowercase method (cash, check, card); account is
        refused in the 400 envelope naming counted_by_method.account, since an
        account charge is not money in the drawer and counting it would book
        the whole charge as a shortage. A refusal rolls everything back. A session that does not exist, or that
        the caller's branch context or wall hides, answers 404, the same for
        both, and nothing is written; a caller with no branch in context who
        holds no grant for the session's branch is refused 403 by name.
