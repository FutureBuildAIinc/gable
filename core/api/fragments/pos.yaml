  /api/v1/pos/returns:
    post:
      operationId: posReturnCreate
      tags: [pos]
      summary: Return goods at the counter
      description: >-
        A return is a credit memo created and posted in one act with its
        restock lines: the memo credits the revenue, reverses the tax and,
        where the lines restock, relieves COGS back and returns the stock,
        refunded in cash (out of the drawer, counted against the session's
        expected) or card (the gateway refund before the transaction) or left
        as account credit (the memo stays open). Lines name the sale line
        they return (its price and cost follow) or stand alone with product,
        quantity and price; quantities are positive on the request and
        negative on the read. The RTN- number and the pos_return.completed
        event land in the same transaction. Refused with 409 and a blocker:
        tax_rate_not_configured, card_terminal, card_refund. The cashier is
        the JWT's subject; a machine key is refused 403.
      parameters:
        - $ref: "#/components/parameters/XBranchId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PosReturnRequest"
      responses:
        "201":
          description: The completed return.
          headers:
            Location:
              description: The return's route.
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PosReturn"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "404":
          $ref: "#/components/responses/WireNotFound"
        "409":
          $ref: "#/components/responses/ConflictEither"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      operationId: posReturnList
      tags: [pos]
      summary: List the day's returns
      description: >-
        The day's returns (register_id filters, date is a YYYY-MM-DD that
        defaults to the branch's today), newest first. A bare array, never
        null.
      parameters:
        - name: register_id
          in: query
          required: false
          schema: {type: string}
        - name: date
          in: query
          required: false
          schema: {type: string, format: date}
        - $ref: "#/components/parameters/XBranchId"
      responses:
        "200":
          description: The day's returns.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PosReturn"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/pos/returns/{id}:
    get:
      operationId: posReturnGet
      tags: [pos]
      summary: Read a return
      description: The return with its lines and its credit memo link.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: "#/components/parameters/XBranchId"
      responses:
        "200":
          description: The return.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PosReturn"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "404":
          $ref: "#/components/responses/WireNotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/pos/refund-intents:
    get:
      operationId: posRefundIntentList
      tags: [pos]
      summary: List the refund claims waiting on a manager
      description: >-
        The list envelope over the counter's open refund claims (CP-06),
        oldest first: every PENDING claim (a terminal answer still owed, or a
        claim waiting on the resolve route) and every void's FAILED claim
        whose tender's posted payment still holds the declined credit the
        pay back route returns to the card (held_credit_cents carries it). A
        settled claim and a paid back credit leave the list. Only the
        finance and owner roles, the resolve and pay back routes' own guard;
        the sale join carries the branch wall, so the list never crosses the
        caller's branch. The page is the oldest 50 of the open set, the
        route's own cap: a claim past the fiftieth shows as the queue drains,
        so the list never claims to be the whole set. next_cursor is null and
        limit echoes the 50 the route serves; cursor, limit and include are
        accepted query names. An empty list is [] in the bytes.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/Include"
        - $ref: "#/components/parameters/XBranchId"
      responses:
        "200":
          description: The open claims.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PosRefundIntentPage"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/pos/settings:
    get:
      operationId: posSettingsGet
      tags: [pos]
      summary: The counter's dealer rules
      description: >-
        The dealer's counter rules: the database wide check limit
        (system_settings pos.check_limit_cents; null is no limit) and the check
        ID rule (pos.check_id_required_over_cents: never, every check, or
        checks over a figure read on the sale's checks in total, so a split
        check cannot pass under it; the ID's number is never taken, on this
        contract or at the counter). The counter reads it to ask for the ID before Pay;
        the write is the admin and owner roles' own route.
      parameters:
        - $ref: "#/components/parameters/XBranchId"
      responses:
        "200":
          description: The rules and their revision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PosSettings"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      operationId: posSettingsPut
      tags: [pos]
      summary: Write the counter's dealer rules
      description: >-
        Writes both rules as one act on the caller's revision (If-Match and/or
        the body's revision; a stale revision is 409 stale_revision). Admin and
        owner only, never a machine key; audited. rules is an object of named
        rules so later rules (the restocking fees) sit beside these.
      parameters:
        - $ref: "#/components/parameters/XBranchId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PosSettingsRequest"
      responses:
        "200":
          description: The rules now in force, with the revision the write made.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PosSettings"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/pos/refund-intents/{id}/resolve:
    post:
      operationId: posRefundIntentResolve
      tags: [pos]
      summary: Resolve a stranded card refund claim
      description: >-
        The guarded operator route for a refund claim that outlived its act
        (a lost terminal verdict, a crashed process, a transaction that
        refused after the terminal answered): finance reads the terminal and
        records its actual outcome. outcome refund carries the gateway's own
        refund id (the money moved) and books it through the refund's own
        money transaction with every cap and lock, completing the claim DONE;
        outcome no_refund carries the reconciliation reference finance filed,
        marks the claim FAILED and moves nothing. A payback claim (a
        payback whose terminal call answered no verdict) settles the same
        way: a recorded refund books the credit out to its card, a no
        refund releases the claim and the credit stays held at the counter.
        Both write one audit row
        naming the person, the intent, the outcome and the reason. A claim
        whose own terminal call has not answered is live, not stranded: while
        its in flight lease runs the resolve answers 409 refund_in_flight,
        and once the lease expires with no answer at all the claim is marked
        UNKNOWN and settles as recorded. Only the
        finance and owner roles; a machine key is refused in the route
        itself, bound or not. A bare resolve, a refund without its refund id
        and a no refund without its reference are 400s naming the field; a
        claim that is not PENDING is 409 intent_not_pending, a no refund over
        a claim carrying the terminal's refund id and a refund id that
        differs from it are 409s naming the conflict, and the claim's sale is
        read through the caller's branch context, so a caller outside the
        branch finds a missing row (404). In a configured deployment the
        actor is the JWT's subject; with authentication off (dev mode) the
        route runs with no subject and the audit row names nobody, which no
        configured deployment allows.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: "#/components/parameters/XBranchId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PosResolveIntentRequest"
      responses:
        "200":
          description: The settled claim.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PosRefundIntentResolved"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "404":
          $ref: "#/components/responses/WireNotFound"
        "409":
          $ref: "#/components/responses/ConflictEither"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/pos/refund-intents/{id}/payback:
    post:
      operationId: posRefundIntentPayback
      tags: [pos]
      summary: Pay a declined void tender's credit back to its card
      description: >-
        The one way back for a declined void tender's credit
        (FROM-PRINCIPAL 60): a tender whose refund the terminal declined
        keeps its charge as unapplied credit once the void completes, held
        to its own tender (it applies to no invoice, 409
        tender_credit_held), and this route pays it back to that card
        through the counter terminal rail, the rail the charge came from.
        The route keys on the void's own released claim (the id the
        resolve route would key on): only a FAILED void claim of a voided
        sale whose tender's payment still carries the credit unapplied is
        paid back, exactly once. Its terminal call runs under the claim
        discipline every terminal refund runs under: one live claim per
        tender and the in flight lease, so a concurrent payback is 409
        refund_in_flight and a hung call holds the drawer until it is
        resolved. Only the finance and owner roles; a machine key is
        refused in the route itself, bound or not. The claim's sale is read
        through the caller's branch context, so a caller outside the
        branch finds a missing row (404), header or not. A claim that is
        not FAILED (409 intent_not_failed), a claim of a sale whose void
        has not completed and a tender whose credit was already paid back
        (409 no_held_credit) are refused before the terminal is reached,
        so a refusal never moves money at the terminal; a terminal decline
        is 409 card_refund (nothing moved, the credit stays held and the
        counter may ask again), and a call that answers no verdict leaves
        the payback's own claim standing for the resolve route. The
        booking writes one pos.refund_intent.paid_back audit row naming
        the person, the void's claim, the outcome and the reason, the
        credit's unapplied cash falls to zero and the cash account moves
        by the refund. The payment refund route through the online gateway
        is never the way back for such a credit (409 tender_credit_held).
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: "#/components/parameters/XBranchId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PosPaybackIntentRequest"
      responses:
        "200":
          description: The credit paid back to its card.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PosRefundIntentPaidBack"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "404":
          $ref: "#/components/responses/WireNotFound"
        "409":
          $ref: "#/components/responses/ConflictEither"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/pos/terminal-intents/{id}:
    get:
      operationId: posTerminalIntentGet
      tags: [pos]
      summary: Read one card terminal intent (the desk's waiting state)
      description: >-
        The card leg's own record at the counter (CP-05): where the leg
        stands, claimed at the terminal, waiting at the device, answered
        authorized or declined, or lost to the sweep. The desk's waiting
        state reads this route while the terminal has the card. The
        intent's branch is held to the caller's reach: a caller whose
        branch header names another branch finds a missing row (404), and a
        caller with no header and no grant to the branch is 403.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: "#/components/parameters/XBranchId"
      responses:
        "200":
          description: The intent as it stands.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PosTerminalIntent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "404":
          $ref: "#/components/responses/WireNotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/pos/terminal-intents/{id}/cancel:
    post:
      operationId: posTerminalIntentCancel
      tags: [pos]
      summary: Cancel a card terminal intent, honest about the device
      description: >-
        The desk's cancel of a waiting card leg. It is honest about the
        device: a claim the terminal never reached closes lost with no
        manager item (nothing moved), while a leg at the device is refused
        (409 terminal_at_device), because the device may still move the
        money and only the sweep and a manager settle that. An intent
        already answered or lost is 409 terminal_intent_settled, and a leg
        the device authorized that the sale has not used is 409
        terminal_authorized. The cancel never claims money back. A machine
        key is refused in the route itself, bound or not. The intent's
        branch is held to the caller's reach as the read is.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: "#/components/parameters/XBranchId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: The intent as it stands after the cancel.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PosTerminalIntent"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "404":
          $ref: "#/components/responses/WireNotFound"
        "409":
          $ref: "#/components/responses/ConflictEither"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/pos/terminal-intents/sweep:
    post:
      operationId: posTerminalIntentsSweep
      tags: [pos]
      summary: Sweep the card terminal intents past their lease
      description: >-
        The sweep act (CP-05): every intent past its lease becomes lost. A
        claimed one never reached the device and is simply closed; a leg
        at the device may have moved money, so it becomes one manager item
        of the lost answer queue carrying who resolves it, the amount, the
        register and the device reference. The worker runs this act on
        its own over every branch; the route is the manager's own trigger
        and sweeps only the caller's reach (a branch in context, else the
        granted branches). Finance and owner roles only; a machine
        key is refused in the route itself.
      parameters:
        - $ref: "#/components/parameters/XBranchId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: What the pass closed and queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PosTerminalSweepResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "409":
          $ref: "#/components/responses/ConflictEither"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/pos/terminal-lost-items:
    get:
      operationId: posTerminalLostItemsList
      tags: [pos]
      summary: List the open lost terminal answers (the manager's queue)
      description: >-
        The manager's queue of card legs the sweep turned lost because the
        device may have moved money: who must resolve it (the register),
        what amount, the device reference, and the transaction it belongs
        to, with the device's own late verdict and reference when its answer
        came after the sweep. A manager reads the terminal's own record and
        settles each at the resolve route. Finance and owner roles
        only. The list is held to the caller's branch wall in the query
        itself: with a branch in context only that branch's items, with none
        and a user only the branches the user is granted.
      parameters:
        - $ref: "#/components/parameters/XBranchId"
      responses:
        "200":
          description: The open items, oldest first, in the list envelope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PosTerminalLostItemList"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/pos/terminal-lost-items/{id}/resolve:
    post:
      operationId: posTerminalLostItemResolve
      tags: [pos]
      summary: Resolve one lost terminal answer
      description: >-
        The manager's settlement of one lost card leg, the terminal's own
        record the authority (CP-05). The item is claimed first by one
        guarded statement, so a second or racing resolve is 409
        lost_item_settled and calls nothing. Outcome authorized on a sale
        leg: a sale still open keeps the authorized leg for its completion
        (never charged again); a completed sale applies the money up to its
        invoice's open amount and the rest goes back to the card; a sale
        paid in full or voided has the whole charge reversed (the same day
        void first, the refund when the void is refused, under the intent's
        idempotency key; a reversal that fails answers 502
        charge_not_reversed and the item is open again). On a refund or void
        leg the refund claim the leg names settles through the claim's own
        resolution. Outcome declined closes the item and moves nothing. Both
        write one audit row naming the person, the item, the outcome and the
        reference. Finance and owner roles only; a machine key is
        refused in the route itself, bound or not. The item's branch is held
        to the caller's reach before either outcome: a caller whose branch
        header names another branch finds a missing row (404), and a caller
        with no header and no grant to the branch is 403.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: "#/components/parameters/XBranchId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PosResolveTerminalLostItemRequest"
      responses:
        "200":
          description: The settled item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PosTerminalLostItem"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "404":
          $ref: "#/components/responses/WireNotFound"
        "409":
          $ref: "#/components/responses/ConflictEither"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/pos/customers/{id}/standing:
    get:
      operationId: posCustomerStanding
      tags: [pos]
      summary: Can this sale go on account?
      description: >-
        The account as the counter reads it before a sale goes on it: the
        credit limit (null for no limit, 0 for no credit), the open
        receivable the credit check reads, the open credit memos (positive
        store credit), the available credit, the hold flag (a limit of zero,
        or a standing credit hold record the AR core placed), the terms kind
        of the payment terms, whether the account asks for a named buyer and
        its roster, the check limit that governs it, the payment shapes the
        server takes from it now, and a verdict on_account: allowed, or
        blocked with a reason (credit_hold, credit_limit, cash_only_terms or
        account_hold: the AR core's standing hold record, with its reason in
        the words and pay down unavailable, for paying the balance does not
        lift a hold), the amount in words, and the three
        ways forward: pay_down (with the amount that would clear it),
        manager_override and switch_tender, each with whether it is available.
        amount_cents is the account portion the sale would put on the account
        (default 0, the account as it stands); sale_id makes the read count
        the sale's live manager override, an allowed verdict with the reason
        manager_override. The completion enforces the same verdict, so the
        read states what the completion will do. The walk-in customer is no
        account: 404, as is a customer the caller may not name.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: amount_cents
          in: query
          required: false
          schema: {type: integer, format: int64, minimum: 0}
        - name: sale_id
          in: query
          required: false
          schema: {type: string, format: uuid}
        - $ref: "#/components/parameters/XBranchId"
      responses:
        "200":
          description: The account's standing and the verdict.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PosAccountStanding"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "404":
          $ref: "#/components/responses/WireNotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/pos/transactions/{id}/overrides:
    post:
      operationId: posOverrideCreate
      tags: [pos]
      summary: A manager approves one sale
      description: >-
        One act for one sale: a manager (the admin or owner role, and a
        person other than the sale's own cashier) approves an on account sale
        the verdict blocks (kind account: credit_hold, credit_limit or
        account_hold, never
        the terms of a cash only account) or a check over the customer's
        check limit (kind check), with a reason and a cap in cents. The
        completion of that sale spends it, once: of any number of racing
        completions exactly one does, and a later sale is blocked again. One
        live override per sale and kind (409 override_exists). The approval
        and its spending are each audited. A cashier, a machine key and a
        token that carries no subject are refused 403 (a request with no
        claims at all is the local development bypass and approves as
        dev-mode); a sale that does not exist or
        that the caller's wall hides is 404; a sale that is not open or held
        is 409 invalid_state_transition; an account override of a walk-in
        sale is 409 walk_in_account.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: "#/components/parameters/XBranchId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PosOverrideRequest"
      responses:
        "201":
          description: The approval.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PosOverride"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "404":
          $ref: "#/components/responses/WireNotFound"
        "409":
          $ref: "#/components/responses/ConflictEither"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/pos/transactions/{id}/signature:
    post:
      operationId: posSignatureCapture
      tags: [pos]
      summary: Seal a signature to a completed sale
      description: >-
        Stores the signer's typed name, the drawn image (a PNG of at most
        131072 bytes, as standard base64 or a data URL), the time, and a
        SHA-256 seal over the sale id, the total in cents, the signer, the
        time and the image's hash. A sale is signed once: the row never
        changes after it is written (a trigger refuses an update), a second
        capture is 409 signature_exists, and a sale that is not completed is
        409 not_completed. The image is never answered; the 80mm receipt
        prints the signature block. A sale that does not exist or that the
        caller's wall hides is 404.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: "#/components/parameters/XBranchId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PosSignatureRequest"
      responses:
        "201":
          description: The sealed signature.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PosSignature"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "404":
          $ref: "#/components/responses/WireNotFound"
        "409":
          $ref: "#/components/responses/ConflictEither"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/pos/return-reasons:
    get:
      operationId: posReturnReasonList
      tags: [pos]
      summary: The closed list of return reasons
      description: >-
        The lowercase reasons a returned line may carry (defective, damaged,
        wrong_item, ordered_wrong, changed_mind, overbought, other) with each
        reason's restocking fee in basis points (the database wide setting
        pos.restocking_fee_bps.<reason>; none set is no fee) and whether it
        needs the return's note, in the list envelope.
      parameters:
        - $ref: "#/components/parameters/XBranchId"
      responses:
        "200":
          description: The reasons.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PosReturnReasonPage"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/pos/exchanges:
    post:
      operationId: posExchangeCreate
      tags: [pos]
      summary: Exchange goods in one act
      description: >-
        The returned lines and the replacement sale lines in one transaction,
        in section 11's lock order (the original sale row, the customer's
        credit, the inventory rows in product order, then the AR core): one
        credit memo and one sale that point at each other. The memo's credit
        (net of any restocking fee) is a leg of the replacement sale up to
        its total, so tender is taken only for the difference; when the return
        is worth more the surplus goes back in cash out of the open drawer or
        stays as store credit on a named account (refund_method cash or
        account). The restocked stock returns at the register's yard. A
        return worth the same takes no tender (409 no_tender_due if one is
        offered). When a tax provider is configured, the replacement lines are
        priced and quoted with the provider before the transaction opens.
        Refused with 409 and a blocker: insufficient_tender,
        exchange_card_refund (a card refund of the surplus is a card return
        through POST /pos/returns, today's refund path), exchange_card_token,
        tax_quote_stale, tax_rate_not_configured, exceeds_sold,
        insufficient_stock, no_open_session, walk_in_account, no_tender_due.
        Nothing is written when any refusal answers. The cashier is the JWT's
        subject; a machine key is refused 403.
      parameters:
        - $ref: "#/components/parameters/XBranchId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PosExchangeRequest"
      responses:
        "201":
          description: The return, the replacement sale and the figures.
          headers:
            Location:
              description: The return's route.
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PosExchange"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "404":
          $ref: "#/components/responses/WireNotFound"
        "409":
          $ref: "#/components/responses/ConflictEither"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/pos/exchanges/preview:
    post:
      operationId: posExchangePreview
      tags: [pos]
      summary: State what an exchange comes to
      description: >-
        The same request as the exchange, answered with the figures only: the
        credit the return is worth (net of the restocking fee), the
        replacement's total with its tax and the difference (positive is what
        the customer pays, negative is what goes back). Computed from read-only
        pricing and tax queries without opening a transaction, taking row locks,
        or advancing sequences; a short tender is not refused here.
      parameters:
        - $ref: "#/components/parameters/XBranchId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PosExchangeRequest"
      responses:
        "200":
          description: The figures.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PosExchangeFigures"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "404":
          $ref: "#/components/responses/WireNotFound"
        "409":
          $ref: "#/components/responses/ConflictEither"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
components:
  schemas:
    PosStatus:
      type: string
      enum: [open, held, completed, voided]
    PosTenderMethod:
      type: string
      enum: [cash, check, card, account, store_credit]
    PosRefundMethod:
      type: string
      enum: [cash, card, account]
    PosTillStatus:
      type: string
      description: "pending_signoff is a counted drawer whose over or short passed the branch's variance threshold."
      enum: [open, pending_signoff, closed]
    PosTransactionCreateRequest:
      type: object
      properties:
        register_id: {type: string, description: "Defaults REG-01."}
        cashier_id: {type: [string, "null"], format: uuid, description: "Defaults the JWT's subject."}
        customer_id: {type: [string, "null"], format: uuid, description: "Absent means the walk-in customer."}
    PosAddLineRequest:
      type: object
      required: [line]
      properties:
        line:
          $ref: "#/components/schemas/PosLineRequest"
    PosChangeQuantityRequest:
      type: object
      required: [quantity, revision]
      properties:
        quantity: {type: string, description: "The line's new quantity, a decimal string greater than zero."}
        revision: {type: integer, description: "The sale's revision the change is made on."}
    PosCompleteRequest:
      type: object
      required: [tenders]
      properties:
        tenders:
          type: array
          items:
            $ref: "#/components/schemas/PosTenderRequest"
        picked_up_by: {type: [string, "null"], description: "Who collected the basket, at most 200 characters."}
        revision: {type: integer, format: int64, minimum: 1, description: "The sale's revision; or send If-Match."}
    PosTenderRequest:
      type: object
      required: [method, amount_cents]
      properties:
        method: {$ref: "#/components/schemas/PosTenderMethod"}
        amount_cents: {type: integer, format: int64, minimum: 1}
        reference: {type: [string, "null"], description: "The check number or reference."}
        token_id: {type: [string, "null"], description: "The card token a card tender charges."}
        id_checked: {type: [boolean, "null"], description: "The cashier looked at the payer's ID; on a check or an account tender only. The ID's number is never taken."}
        id_type: {type: [string, "null"], enum: [drivers_license, state_id, passport, military_id, other, null], description: "The kind of ID looked at; needs id_checked true."}
    PosVoidRequest:
      type: object
      required: [reason]
      properties:
        reason: {type: string}
        revision: {type: integer, format: int64, minimum: 1, description: "The sale's revision; or send If-Match."}
    PosResolveIntentRequest:
      type: object
      required: [outcome, reason]
      properties:
        outcome:
          type: string
          enum: [refund, no_refund]
          description: "The terminal's actual outcome: refund (the gateway's own refund id, the money moved) or no_refund (an explicit no at the terminal)."
        refund_tx_id:
          type: string
          description: "Required when the outcome is refund: the gateway's own refund id for the claim."
        reconciliation_reference:
          type: string
          description: "Required when the outcome is no_refund: the reference finance filed for the reconciliation."
        reason: {type: string, description: Why the record was made, 1 to 500 characters.}
    PosRefundIntentSummary:
      type: object
      description: One open refund claim in the manager's list (CP-06).
      required: [id, sale_id, sale_number, tender_id, tender_method, amount_cents, act, state, held_credit_cents, created_at]
      properties:
        id: {type: string, format: uuid}
        sale_id: {type: string, format: uuid}
        sale_number: {type: string, description: "The claim's sale, POS-000001."}
        tender_id: {type: string, format: uuid}
        tender_method: {type: string, enum: [cash, check, card, account, store_credit]}
        amount_cents: {type: integer, format: int64, description: "The claim's amount."}
        act: {type: string, enum: [void, return, payback]}
        state: {type: string, enum: [PENDING, FAILED], description: "PENDING waits on the terminal's answer or the resolve route; FAILED is a void's declined claim whose credit the pay back route returns."}
        held_credit_cents: {type: integer, format: int64, description: "What the tender's posted payment still holds unapplied; the credit a pay back returns."}
        created_at: {type: string, format: date-time}
    PosRefundIntentPage:
      type: object
      required: [items, next_cursor, limit]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PosRefundIntentSummary"
        next_cursor: {type: [string, "null"], description: "Null: the page is the whole open set."}
        limit: {type: integer}
        total: {type: integer, description: "Only under include=total."}
    PosRefundIntentResolved:
      type: object
      required: [id, sale_id, tender_id, act, state, outcome]
      properties:
        id: {type: string, format: uuid}
        sale_id: {type: string, format: uuid}
        tender_id: {type: string, format: uuid}
        act: {type: string, enum: [void, return, payback]}
        state: {type: string, enum: [DONE, FAILED], description: DONE when a recorded refund booked, FAILED when a no refund released the claim.}
        outcome: {type: string, enum: [refund, no_refund]}
        refund_tx_id: {type: [string, "null"], description: The gateway refund id the operator recorded.}
        reconciliation_reference: {type: [string, "null"], description: The reference the operator filed.}
    PosPaybackIntentRequest:
      type: object
      required: [reason]
      properties:
        reason: {type: string, description: Why the credit went back to its card, 1 to 500 characters.}
    PosRefundIntentPaidBack:
      type: object
      required: [id, payback_id, sale_id, tender_id, amount_cents, refund_tx_id, state]
      properties:
        id: {type: string, format: uuid, description: The void's own released claim the route keyed on.}
        payback_id: {type: string, format: uuid, description: The payback's own claim, completed DONE with the terminal's refund id.}
        sale_id: {type: string, format: uuid}
        tender_id: {type: string, format: uuid}
        amount_cents: {type: integer, format: int64, description: The credit paid back, the tender's payment's whole unapplied cash.}
        refund_tx_id: {type: string, description: The terminal's own refund id for the payback.}
        state: {type: string, enum: [DONE]}
    PosReturnRequest:
      type: object
      required: [reason, lines]
      properties:
        register_id: {type: string, description: "Defaults REG-01."}
        original_sale_id: {type: [string, "null"], format: uuid, description: "The sale the goods came from; absent is a no-receipt return."}
        customer_id: {type: [string, "null"], format: uuid}
        refund_method: {$ref: "#/components/schemas/PosRefundMethod"}
        reason: {type: string, description: "The return's note. Required when a line's reason is other (a line with no reason_code is other); otherwise the memo states the reasons in words."}
        gateway_tx_id: {type: [string, "null"], description: "Refused on a card return: the refund goes to the sale's own card tender, never a transaction the client names."}
        lines:
          type: array
          items:
            $ref: "#/components/schemas/PosReturnLineRequest"
    PosReturnLineRequest:
      type: object
      required: [quantity]
      properties:
        product_id: {type: [string, "null"], format: uuid, description: "Required when the line names no sale line."}
        line_id: {type: [string, "null"], format: uuid, description: "The sale line returned; its price and cost follow. Required on every line when original_sale_id is named, and named at most once: a request naming one sale line twice is refused naming the second."}
        description: {type: [string, "null"]}
        quantity: {type: string, description: "A positive decimal string with at most 4 fraction digits."}
        unit_price_ten_thousandths: {type: integer, format: int64, minimum: 0, description: "Required when the line names no sale line."}
        restock: {type: boolean, description: "Default true; damaged goods stay out of stock."}
        reason_code: {$ref: "#/components/schemas/PosReturnReasonCode"}
    PosReturnReasonCode:
      type: string
      description: "The closed lowercase list of return reasons; an absent reason is other."
      enum: [defective, damaged, wrong_item, ordered_wrong, changed_mind, overbought, other]
    PosWayForward:
      type: object
      required: [kind, available, message]
      properties:
        kind: {type: string, enum: [pay_down, manager_override, switch_tender]}
        available: {type: boolean}
        amount_cents: {type: integer, format: int64, description: "For pay_down, what paying would clear."}
        message: {type: string}
    PosOnAccountVerdict:
      type: object
      required: [verdict, reason, message, over_cents, ways_forward]
      properties:
        verdict: {type: string, enum: [allowed, blocked]}
        reason: {type: string, enum: ["", credit_hold, credit_limit, cash_only_terms, account_hold, manager_override], description: "Empty when plainly allowed; the blocker code the completion refuses with when blocked (account_hold: the AR core's standing hold record); manager_override when allowed by a live override."}
        message: {type: string, description: "The verdict in plain words, with the amount."}
        over_cents: {type: [integer, "null"], format: int64, description: "How far past the limit the sale puts the account (credit_limit only)."}
        ways_forward:
          type: array
          items: {$ref: "#/components/schemas/PosWayForward"}
    PosBuyer:
      type: object
      required: [id, name, cap_cents]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        cap_cents: {type: [integer, "null"], format: int64, description: "The most this buyer may put on the account in one sale; null for no cap of the buyer's own."}
    PosAccountStanding:
      type: object
      required: [customer_id, name, currency, credit_limit_cents, open_receivable_cents, open_credit_memo_cents, available_credit_cents, on_hold, terms_kind, named_buyer_required, buyers, check_limit_cents, payment_options, on_account]
      properties:
        customer_id: {type: string, format: uuid}
        name: {type: string}
        currency: {type: string}
        credit_limit_cents: {type: [integer, "null"], format: int64, description: "Null is unlimited; 0 is no credit."}
        open_receivable_cents: {type: integer, format: int64}
        open_credit_memo_cents: {type: integer, format: int64, description: "The customer's open store credit, positive."}
        available_credit_cents: {type: [integer, "null"], format: int64}
        on_hold: {type: boolean, description: "The hold the counter has today: a credit limit of zero."}
        terms_kind: {type: string, enum: [net_days, day_of_month, due_on_receipt]}
        named_buyer_required: {type: boolean}
        buyers:
          type: array
          items: {$ref: "#/components/schemas/PosBuyer"}
        check_limit_cents: {type: [integer, "null"], format: int64, description: "The customer's own check limit, else the database wide default; null is no limit."}
        payment_options:
          type: array
          description: "The payment shapes the server takes from this customer now, in the order the counter shows them."
          items: {$ref: "#/components/schemas/PosTenderMethod"}
        on_account: {$ref: "#/components/schemas/PosOnAccountVerdict"}
    PosOverrideRequest:
      type: object
      additionalProperties: false
      required: [kind, reason, cap_cents]
      properties:
        kind: {type: string, enum: [account, check]}
        reason: {type: string, maxLength: 500}
        cap_cents: {type: integer, format: int64, minimum: 1, description: "The most the manager approves: the account portion, or the largest check."}
        approval_token: {type: string, description: "A manager's step up approval (POST /pos/step-up), spent by this one override: the manager it names is the approver, recorded by name. Absent on the signed in manager's own path."}
    PosOverride:
      type: object
      required: [id, sale_id, kind, approved_by, reason, cap_cents, created_at, consumed_at]
      properties:
        id: {type: string, format: uuid}
        sale_id: {type: string, format: uuid}
        kind: {type: string, enum: [account, check]}
        approved_by: {type: string, description: "The approving manager's subject."}
        reason: {type: string}
        cap_cents: {type: integer, format: int64}
        created_at: {type: string, format: date-time}
        consumed_at: {type: [string, "null"], format: date-time}
    PosSignatureRequest:
      type: object
      additionalProperties: false
      required: [signer_name, image_png_base64]
      properties:
        signer_name: {type: string, maxLength: 200}
        image_png_base64: {type: string, description: "The drawn PNG, at most 131072 bytes, standard base64 or a data URL."}
    PosSignature:
      type: object
      required: [sale_id, signer_name, signed_at, total_cents, image_sha256, seal, captured_by]
      properties:
        sale_id: {type: string, format: uuid}
        signer_name: {type: string}
        signed_at: {type: string, format: date-time}
        total_cents: {type: integer, format: int64}
        image_sha256: {type: string, description: "The SHA-256 of the image, hex."}
        seal: {type: string, description: "SHA-256 hex over the sale id, the total in cents, the signer, the time and the image's hash."}
        captured_by: {type: string}
    PosReturnReason:
      type: object
      required: [code, label, restocking_fee_bps, needs_note]
      properties:
        code: {$ref: "#/components/schemas/PosReturnReasonCode"}
        label: {type: string}
        restocking_fee_bps: {type: integer, minimum: 0, maximum: 10000}
        needs_note: {type: boolean}
    PosReturnReasonPage:
      type: object
      required: [items, next_cursor, limit]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/PosReturnReason"}
        next_cursor: {type: [string, "null"]}
        limit: {type: integer}
    PosExchangeRequest:
      type: object
      additionalProperties: false
      required: [returned_lines, sale_lines]
      properties:
        register_id: {type: string, description: "Defaults REG-01."}
        original_sale_id: {type: [string, "null"], format: uuid, description: "The sale the goods came from."}
        customer_id: {type: [string, "null"], format: uuid}
        refund_method: {type: string, enum: [cash, account, card], description: "How a surplus goes back: cash (the default) or account (store credit on a named account). card is refused (exchange_card_refund)."}
        reason: {type: string, description: "The return's note, as on a return."}
        returned_lines:
          type: array
          items: {$ref: "#/components/schemas/PosReturnLineRequest"}
        sale_lines:
          type: array
          items: {$ref: "#/components/schemas/PosLineRequest"}
        tenders:
          type: array
          description: "Tender for the difference only. Not store_credit (the returned credit is applied itself)."
          items: {$ref: "#/components/schemas/PosTenderRequest"}
        picked_up_by: {type: [string, "null"], maxLength: 200}
    PosExchangeFigures:
      type: object
      required: [returned_cents, restocking_fee_cents, replacement_cents, difference_cents]
      properties:
        returned_cents: {type: integer, format: int64, description: "The credit the return is worth, net of any restocking fee."}
        restocking_fee_cents: {type: integer, format: int64}
        replacement_cents: {type: integer, format: int64, description: "The replacement sale's total with its tax."}
        difference_cents: {type: integer, format: int64, description: "Replacement less return: positive is what the customer pays, negative what goes back."}
    PosExchange:
      type: object
      required: [return, sale, returned_cents, restocking_fee_cents, replacement_cents, difference_cents, refunded_cents]
      properties:
        return: {$ref: "#/components/schemas/PosReturn"}
        sale: {$ref: "#/components/schemas/PosTransaction"}
        returned_cents: {type: integer, format: int64}
        restocking_fee_cents: {type: integer, format: int64}
        replacement_cents: {type: integer, format: int64}
        difference_cents: {type: integer, format: int64}
        refunded_cents: {type: integer, format: int64, description: "The surplus paid back in cash; zero when it stayed as store credit or there was none."}
    PosTillOpenRequest:
      type: object
      properties:
        register_id: {type: string, description: "Defaults REG-01."}
        opening_float_cents: {type: integer, format: int64, minimum: 0}
    PosTillCloseRequest:
      type: object
      required: [counted_by_method]
      properties:
        counted_by_method:
          type: object
          additionalProperties: {type: integer, format: int64, minimum: 0}
          description: "The counted cents per lowercase method (cash, check, card, account)."
        notes: {type: [string, "null"]}
    PosSyncRequest:
      type: object
      required: [batch_id, items]
      properties:
        batch_id: {type: string}
        register_id: {type: string, description: "Defaults REG-01."}
        items:
          type: array
          items:
            $ref: "#/components/schemas/PosSyncSale"
    PosSyncSale:
      type: object
      required: [client_id, items, tenders]
      properties:
        client_id: {type: string, format: uuid, description: "The offline client's id for the sale; a replay is a duplicate, not an error."}
        cashier_id: {type: [string, "null"], format: uuid}
        customer_id: {type: [string, "null"], format: uuid}
        items:
          type: array
          items:
            $ref: "#/components/schemas/PosLineRequest"
        tenders:
          type: array
          items:
            $ref: "#/components/schemas/PosTenderRequest"
        client_created_at: {type: [string, "null"], format: date-time, description: "When the register made the sale offline."}
    PosLineRequest:
      type: object
      description: >-
        One sales line in the shared shape of ADR 0005 section 2.2, the same
        parse everywhere a sales line is written: a product line (quantity and
        unit from the product when it names one), a charge line (charge_code),
        or a text line (a note, nothing priced); an override or a discount
        carries its reason and is audited.
      properties:
        id: {type: [string, "null"], format: uuid, description: "The client's id for the line, echoed on created lines."}
        line_type: {type: [string, "null"], enum: [product, kit, component, charge, text], description: "Defaults product; a kit explodes to its components."}
        product_id: {type: [string, "null"], format: uuid}
        charge_code: {type: [string, "null"], description: "The charge code a charge line names."}
        sku: {type: [string, "null"]}
        description: {type: [string, "null"]}
        quantity: {type: [string, "null"], description: "A decimal string with at most 4 fraction digits; null only on a text line."}
        uom: {type: [string, "null"], description: "Defaults the product's unit."}
        price_uom: {type: [string, "null"], description: "Defaults uom; a different one requires the pair."}
        uom_qty: {type: [string, "null"], description: "The pair side in the sale unit; both sides together, both positive."}
        price_uom_qty: {type: [string, "null"], description: "The pair side in the price unit."}
        unit_price_ten_thousandths: {type: [integer, "null"], format: int64, minimum: 0, description: "Defaults the product's price."}
        override_reason: {type: [string, "null"], description: "Required when the price is not the product's."}
        discount_percent: {type: [string, "null"], description: "A percent or a cents amount, never both."}
        discount_cents: {type: [integer, "null"], format: int64}
        discount_reason: {type: [string, "null"]}
    PosTransactionSummary:
      type: object
      description: A sale's head, a list item.
      required: [id, number, revision, branch_id, register_id, cashier_id, customer_id, currency, total_cents, status, invoice_id, completed_at, created_at, item_count, customer_name, invoice_number, business_day]
      properties:
        id: {type: string, format: uuid}
        number: {type: string, description: "POS-000001, human readable."}
        revision: {type: integer, format: int64}
        branch_id: {type: string, format: uuid}
        register_id: {type: string}
        cashier_id: {type: string, format: uuid}
        customer_id: {type: [string, "null"], format: uuid}
        currency: {type: string, description: "ISO 4217, the customer's or the dealer default."}
        total_cents: {type: integer, format: int64}
        status: {$ref: "#/components/schemas/PosStatus"}
        invoice_id: {type: [string, "null"], format: uuid, description: "Set by the completion."}
        completed_at: {type: [string, "null"], format: date-time}
        created_at: {type: string, format: date-time}
        item_count: {type: integer}
        customer_name: {type: [string, "null"], description: "The account the sale names; null on a walk-in."}
        invoice_number: {type: [string, "null"], description: "The invoice's number; null until the sale completes."}
        business_day: {type: string, description: "The day the sale was made on in its branch's own zone, YYYY-MM-DD (the date a search bounds by); never the UTC slice of the timestamp."}
    PosTransaction:
      type: object
      description: "The full sale: the head with its lines and tenders."
      required: [id, number, revision, branch_id, register_id, cashier_id, customer_id, currency, subtotal_cents, tax_cents, total_cents, change_cents, till_session_id, status, invoice_id, completed_at, created_at, customer_po, job_id, buyer_contact_id, print_count, exchange_return_id, lines, tenders]
      properties:
        id: {type: string, format: uuid}
        number: {type: string, description: "POS-000001, human readable."}
        revision: {type: integer, format: int64}
        branch_id: {type: string, format: uuid}
        register_id: {type: string}
        cashier_id: {type: string, format: uuid}
        customer_id: {type: [string, "null"], format: uuid}
        currency: {type: string, description: "ISO 4217, the customer's or the dealer default."}
        subtotal_cents: {type: integer, format: int64}
        tax_cents: {type: integer, format: int64}
        total_cents: {type: integer, format: int64}
        change_cents: {type: integer, format: int64, description: "The change given, never subtracted from the payments a second time."}
        till_session_id: {type: [string, "null"], format: uuid}
        status: {$ref: "#/components/schemas/PosStatus"}
        invoice_id: {type: [string, "null"], format: uuid, description: "The invoice the completion posted."}
        completed_at: {type: [string, "null"], format: date-time}
        created_at: {type: string, format: date-time}
        customer_po: {type: [string, "null"], description: "The purchase order a charge sale names."}
        job_id: {type: [string, "null"], format: uuid, description: "The customer's job the sale belongs to."}
        buyer_contact_id: {type: [string, "null"], format: uuid, description: "The roster buyer a sale on account names."}
        print_count: {type: integer, description: "How many times the receipt has been printed."}
        exchange_return_id: {type: [string, "null"], format: uuid, description: "The return an exchange's replacement sale stands against."}
        returned_quantities:
          type: object
          description: "Per sale line id, the quantity every earlier return brought back (a decimal string), on a completed sale that has returns; absent otherwise. The return dialog holds a fully returned line back with it."
          additionalProperties: {type: string, description: "A decimal string with at most 4 fraction digits."}
        tax_exemption:
          type: [object, "null"]
          description: "Why there is no tax: the certificate that exempts this sale on the branch's business day (CP-10). Null when no certificate covers the day."
          properties:
            certificate_number: {type: string, description: "The certificate's number as the counter shows it."}
            expiry_day: {type: string, description: "The certificate's last day, YYYY-MM-DD; absent when it does not expire."}
        lines:
          type: array
          items:
            $ref: "#/components/schemas/PosLineItem"
        tenders:
          type: array
          items:
            $ref: "#/components/schemas/PosTender"
    PosCounterJob:
      type: object
      required: [id, name]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
    PosCounterCustomer:
      type: object
      required: [id, account_number, name, po_required, job_required, credit_limit_cents, open_receivable_cents, available_credit_cents, standing, jobs]
      properties:
        id: {type: string, format: uuid}
        account_number: {type: string}
        name: {type: string}
        po_required: {type: boolean, description: "The account asks for a purchase order on a charge sale (409 po_required at completion without one)."}
        job_required: {type: boolean, description: "The account asks for a job on a charge sale (409 job_required at completion without one)."}
        credit_limit_cents: {type: [integer, "null"], format: int64, description: "Null: no limit. 0: no credit."}
        open_receivable_cents: {type: integer, format: int64, description: "What the credit check reads: open invoices less open credit memos and unapplied cash."}
        available_credit_cents: {type: [integer, "null"], format: int64, description: "The limit less the open receivable; negative when over; null with no limit."}
        standing: {type: string, enum: [good, no_limit, no_credit, over_limit]}
        jobs:
          type: array
          items:
            $ref: "#/components/schemas/PosCounterJob"
    PosSaleCustomerRequest:
      type: object
      additionalProperties: false
      properties:
        customer_id: {type: [string, "null"], format: uuid}
        customer_po: {type: [string, "null"], maxLength: 100}
        job_id: {type: [string, "null"], format: uuid}
        buyer_contact_id: {type: [string, "null"], format: uuid, description: "A buyer from the account's roster (an authorized, active contact of the customer); 400 otherwise. Needs the customer named."}
    PosTransactionPage:
      type: object
      required: [items, next_cursor, limit]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PosTransactionSummary"
        next_cursor: {type: [string, "null"], description: "Null: the page is the whole day."}
        limit: {type: integer}
        total: {type: integer, description: "Only under include=total."}
    PosLineItem:
      type: object
      description: >-
        A sale line in the shared shape of ADR 0005 section 2.2: product, kit
        (with its component lines), charge and text lines, the priced fields
        null on a text line, the extension rounded once.
      required: [id, position, line_type, parent_line_id, product_id, charge_code_id, charge_code, sku, description, quantity, uom, price_uom, uom_qty, price_uom_qty, stock_uom, stock_quantity, tally, unit_price_ten_thousandths, priced_unit_price_ten_thousandths, price_source, price_basis, override_reason, discount_percent, discount_cents, discount_reason, price_adjusted_by, line_total_cents, taxable, revenue_account_code, is_special_order, vendor_id, special_order_unit_cost_ten_thousandths, created_at]
      properties:
        id: {type: string, format: uuid}
        position: {type: integer}
        line_type: {type: string, enum: [product, kit, component, charge, text]}
        parent_line_id: {type: [string, "null"], format: uuid, description: "The kit line a component belongs to."}
        product_id: {type: [string, "null"], format: uuid}
        charge_code_id: {type: [string, "null"], format: uuid}
        charge_code: {type: [string, "null"]}
        sku: {type: [string, "null"]}
        description: {type: string}
        quantity: {type: [string, "null"], description: "A decimal string; null on a text line."}
        uom: {type: [string, "null"]}
        price_uom: {type: [string, "null"], description: "The unit the price is per; equals uom unless the pair converts."}
        uom_qty: {type: [string, "null"], description: "The pair side in the sale unit; 1 and 1 when the units agree."}
        price_uom_qty: {type: [string, "null"]}
        stock_uom: {type: [string, "null"]}
        stock_quantity: {type: [string, "null"]}
        tally: {oneOf: [{$ref: "#/components/schemas/Tally"}, {type: "null"}]}
        unit_price_ten_thousandths: {type: [integer, "null"], format: int64, description: "Scale 4; null on a text line."}
        priced_unit_price_ten_thousandths: {type: [integer, "null"], format: int64, description: "The price before an override or discount moved it."}
        price_source: {type: string, enum: [price_list, quote, override, manual, none]}
        price_basis: {type: [string, "null"]}
        override_reason: {type: [string, "null"]}
        discount_percent: {type: [string, "null"], description: "A percent or a cents amount, never both."}
        discount_cents: {type: [integer, "null"], format: int64}
        discount_reason: {type: [string, "null"]}
        price_adjusted_by: {type: [string, "null"], description: "Who moved the price; the audit row carries the rest."}
        line_total_cents: {type: [integer, "null"], format: int64, description: "The extension, rounded once; null on a text line."}
        taxable: {type: boolean}
        revenue_account_code: {type: [string, "null"], description: "The account the line's revenue posts to (a charge line's code)."}
        is_special_order: {type: boolean}
        vendor_id: {type: [string, "null"], format: uuid}
        special_order_unit_cost_ten_thousandths: {type: [integer, "null"], format: int64}
        created_at: {type: string, format: date-time}
    PosTender:
      type: object
      description: >-
        One payment taken at the counter, stored net: the tendered amount
        less any change given from it, so the payment it became is the money
        kept.
      required: [id, sale_id, method, amount_cents, payment_id, reference, card_last4, card_brand, gateway_tx_id, auth_code, id_checked, id_type, created_at]
      properties:
        id: {type: string, format: uuid}
        sale_id: {type: string, format: uuid}
        method: {$ref: "#/components/schemas/PosTenderMethod"}
        amount_cents: {type: integer, format: int64, description: "Net of change."}
        payment_id: {type: [string, "null"], format: uuid, description: "The payment the completion recorded (none for an account or store credit leg)."}
        id_checked: {type: boolean, description: "The cashier looked at the payer's ID."}
        id_type: {type: [string, "null"], description: "The kind of ID looked at, never its number."}
        reference: {type: [string, "null"]}
        card_last4: {type: [string, "null"]}
        card_brand: {type: [string, "null"]}
        gateway_tx_id: {type: [string, "null"]}
        auth_code: {type: [string, "null"]}
        created_at: {type: string, format: date-time}
    PosReturn:
      type: object
      description: >-
        One counter return: a credit memo created, posted, refunded and
        optionally restocked in one act.
      required: [id, number, revision, branch_id, register_id, till_session_id, original_sale_id, customer_id, cashier_id, currency, subtotal_cents, tax_cents, total_cents, refund_method, reason, credit_memo_id, created_at, restocking_fee_cents, exchange_sale_id, lines]
      properties:
        id: {type: string, format: uuid}
        number: {type: string, description: "RTN-000001, human readable."}
        revision: {type: integer, format: int64}
        branch_id: {type: [string, "null"], format: uuid}
        register_id: {type: string}
        till_session_id: {type: [string, "null"], format: uuid}
        original_sale_id: {type: [string, "null"], format: uuid}
        customer_id: {type: [string, "null"], format: uuid}
        cashier_id: {type: string, format: uuid}
        currency: {type: string}
        subtotal_cents: {type: integer, format: int64}
        tax_cents: {type: integer, format: int64}
        total_cents: {type: integer, format: int64}
        refund_method: {$ref: "#/components/schemas/PosRefundMethod"}
        reason: {type: string}
        credit_memo_id: {type: [string, "null"], format: uuid, description: "The credit memo the return posted."}
        created_at: {type: string, format: date-time}
        restocking_fee_cents: {type: integer, format: int64, description: "The fee withheld from the refund (a positive figure, its own line on the credit memo); the subtotal and total already carry it."}
        exchange_sale_id: {type: [string, "null"], format: uuid, description: "The replacement sale when the return was one half of an exchange."}
        lines:
          type: array
          items:
            $ref: "#/components/schemas/PosReturnLine"
    PosReturnLine:
      type: object
      description: One returned line, its quantity and extension negative.
      required: [id, position, product_id, description, quantity, uom, unit_price_ten_thousandths, line_total_cents, restock, reason_code, restocking_fee_cents]
      properties:
        id: {type: string, format: uuid}
        position: {type: integer}
        product_id: {type: [string, "null"], format: uuid}
        description: {type: string}
        quantity: {type: [string, "null"], description: "A negative decimal string."}
        uom: {type: [string, "null"]}
        unit_price_ten_thousandths: {type: [integer, "null"], format: int64}
        line_total_cents: {type: [integer, "null"], format: int64}
        restock: {type: boolean}
        reason_code: {$ref: "#/components/schemas/PosReturnReasonCode"}
        restocking_fee_cents: {type: integer, format: int64, description: "The fee this line's reason withheld from its refund, half even to the cent."}
    PosTillSession:
      type: object
      description: >-
        One drawer shift. The expected cash is the sum of the session's cash
        payments (already net of change) plus the opening float less cash
        refunds.
      required: [id, register_id, branch_id, cashier_id, status, opening_float_cents, opened_at, closed_at, expected_by_method, counted_by_method, over_short_cents, gl_entry_id, notes, closed_by, variance_threshold_cents, sign_off]
      properties:
        id: {type: string, format: uuid}
        register_id: {type: string}
        branch_id: {type: [string, "null"], format: uuid}
        cashier_id: {type: string, format: uuid}
        status: {$ref: "#/components/schemas/PosTillStatus"}
        opening_float_cents: {type: integer, format: int64}
        opened_at: {type: string, format: date-time}
        closed_at: {type: [string, "null"], format: date-time}
        expected_by_method:
          type: object
          additionalProperties: {type: integer, format: int64}
          description: "The expected cents per lowercase method; present once the session has sales."
        counted_by_method:
          type: object
          additionalProperties: {type: integer, format: int64}
        over_short_by_method:
          type: object
          additionalProperties: {type: integer, format: int64}
          description: "The signed variance cents per lowercase method; present once the drawer is counted."
        over_short_cents: {type: [integer, "null"], format: int64, description: "Set by the close."}
        gl_entry_id: {type: [string, "null"], format: uuid, description: "The 5030 over/short entry the close (or the sign off) booked."}
        notes: {type: string}
        closed_by: {type: [string, "null"], description: "Who counted and closed the drawer."}
        variance_threshold_cents: {type: [integer, "null"], format: int64, description: "The branch's threshold in force at the close; null when none was."}
        sign_off:
          description: "The manager's release of a close that passed the threshold; null otherwise."
          oneOf:
            - $ref: "#/components/schemas/PosTillSignOff"
            - type: "null"
    PosTillMovementRequest:
      type: object
      required: [kind, amount_cents]
      properties:
        kind: {$ref: "#/components/schemas/PosTillMovementKind"}
        amount_cents: {type: integer, format: int64, minimum: 1}
        reason_code:
          description: "Required for paid_in and paid_out, absent for a drop or pickup."
          oneOf:
            - $ref: "#/components/schemas/PosTillReasonCode"
            - type: "null"
        note: {type: [string, "null"], description: "Required, not blank, when the reason_code is other."}
        taken_by: {type: [string, "null"], description: "A pickup's second person, required there and absent for any other kind. With an approval_token the manager is named by their approval, not typed."}
        approval_token: {type: string, description: "A manager's step up approval (POST /pos/step-up), spent by this one pickup: the manager it names is the taker. Only a pickup carries one."}
    PosTillMovementKind:
      type: string
      enum: [safe_drop, pickup, paid_in, paid_out]
    PosTillReasonCode:
      type: string
      enum: [supplies, freight, fuel, postage, meals, repairs, fee_received, vendor_refund, other]
    PosTillMovement:
      type: object
      required: [id, till_session_id, register_id, branch_id, kind, amount_cents, reason_code, note, actor, taken_by, gl_entry_id, created_at]
      properties:
        id: {type: string, format: uuid}
        till_session_id: {type: string, format: uuid}
        register_id: {type: string}
        branch_id: {type: string, format: uuid}
        kind: {$ref: "#/components/schemas/PosTillMovementKind"}
        amount_cents: {type: integer, format: int64}
        reason_code:
          oneOf:
            - $ref: "#/components/schemas/PosTillReasonCode"
            - type: "null"
        note: {type: string}
        actor: {type: string}
        taken_by: {type: [string, "null"]}
        gl_entry_id: {type: [string, "null"], format: uuid}
        created_at: {type: string, format: date-time}
    PosTillMovementPage:
      type: object
      required: [items, next_cursor, limit]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/PosTillMovement"}
        next_cursor: {type: [string, "null"]}
        limit: {type: integer}
    PosTillSessionPage:
      type: object
      required: [items, next_cursor, limit]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/PosTillSession"}
        next_cursor: {type: [string, "null"]}
        limit: {type: integer}
    PosStepUpRequest:
      type: object
      additionalProperties: false
      required: [act, manager, pin, target_id]
      properties:
        act: {type: string, enum: [override, pickup, signoff]}
        kind: {type: string, enum: [account, check, refund_method], description: "The override's kind; required when the act is an override, absent otherwise. The approval binds it."}
        manager: {type: string, description: "The manager's staff number or staff id."}
        pin: {type: string, description: "The manager's counter PIN. Verified in constant time, never logged."}
        target_id: {type: string, format: uuid, description: "The act's target: the sale (an override) or the till session (a pickup, a sign off)."}
        amount_cents: {type: integer, format: int64, minimum: 1, description: "The amount the manager approves: the override's cap or the pickup's amount; required for an override or a pickup, absent for a sign off. The approval binds it."}
      allOf:
        - if:
            properties: {act: {const: override}}
          then:
            required: [kind, amount_cents]
        - if:
            properties: {act: {const: pickup}}
          then:
            required: [amount_cents]
            not: {required: [kind]}
        - if:
            properties: {act: {const: signoff}}
          then:
            not:
              anyOf:
                - required: [kind]
                - required: [amount_cents]
    PosStepUpApproval:
      type: object
      required: [token, manager_name, expires_at]
      properties:
        token: {type: string, description: "The opaque token the one act spends as approval_token. Stored only as its SHA-256 hash."}
        manager_name: {type: string, description: "The manager's name, for the screen to say who approved."}
        expires_at: {type: string, format: date-time}
    PosStepUpManager:
      type: object
      required: [id, full_name, staff_no, role]
      properties:
        id: {type: string, format: uuid}
        full_name: {type: string}
        staff_no: {type: string}
        role: {type: string}
    PosStepUpManagerPage:
      type: object
      required: [items, next_cursor, limit]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/PosStepUpManager"}
        next_cursor: {type: [string, "null"]}
        limit: {type: integer}
    PosTillSignoffRequest:
      type: object
      required: [reason]
      properties:
        approval_token: {type: string, description: "A manager's step up approval (POST /pos/step-up), spent by this one sign off: the manager it names is the signer. Absent, the signed in caller needs the finance or owner role."}
        reason: {type: string, minLength: 1, description: "Why the variance is accepted; not blank."}
    PosTillSignOff:
      type: object
