        branch_id: {type: string, format: uuid}
        register_id: {type: string}
        transaction_id: {type: string, format: uuid}
        kind: {type: string, enum: [sale, refund, void]}
        amount_cents: {type: integer, format: int64}
        device_id: {type: string}
        provider_ref: {type: string}
        state: {type: string, enum: [open, resolving, resolved_authorized, resolved_declined]}
        late_verdict:
          type: string
          enum: ["", authorized, declined]
