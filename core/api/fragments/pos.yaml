  /api/v1/pos/offline/policy:
    get:
      operationId: posOfflinePolicyGet
      tags: [pos]
      summary: A branch's offline counter policy
      description: >-
        The branch's resolved offline selling policy (ADR 0011 section 4): the
        branch's own row in pos_offline_policy when set (source branch), else
        the database wide defaults in system_settings (source default), else
        off (source none). Includes enrolled_register_count and
        max_account_exposure_cents (account_cap_cents times the branch's
        enrolled registers). Admin, owner and finance; a branch the caller may
        not target is 403, and an unknown branch is 404.
      parameters:
        - name: branch_id
          in: query
          required: true
          schema: {type: string, format: uuid}
        - $ref: "#/components/parameters/XBranchId"
      responses:
        "200":
          description: The resolved offline counter policy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PosOfflinePolicy"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "404":
          $ref: "#/components/responses/WireNotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      operationId: posOfflinePolicyPut
      tags: [pos]
      summary: Set or clear a branch's offline counter policy
      description: >-
        Sets the branch's own offline counter policy in pos_offline_policy, or
        clears it with clear true so the database wide defaults (or none) apply
        again. Only cash, check and account tenders may be allowed offline.
        Admin and owner only (finance may read, not write), never a machine key; a branch the caller may
        not target is 403, and an unknown branch is 404. Audited as
        pos.offline.policy in the same transaction.
      parameters:
        - $ref: "#/components/parameters/XBranchId"
        - $ref: "#/components/parameters/IdempotencyKey"
