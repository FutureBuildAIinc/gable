      properties:
        weight_lb: {type: [string, "null"], description: "A decimal string of pounds; null when the indicator sent no weight."}
        unit: {type: string, enum: [lb, kg]}
        mode: {type: string, enum: [gross, tare, net]}
        motion: {type: boolean}
        at_zero: {type: boolean, description: "The manual entry's Handbook 44 check reads this."}
    PosScaleStatus:
      type: object
      required: [configured, device, reading]
      properties:
        configured: {type: boolean}
        device:
          oneOf: [{$ref: "#/components/schemas/PosScaleDevice"}, {type: "null"}]
        reading:
          oneOf: [{$ref: "#/components/schemas/PosScaleReading"}, {type: "null"}]
        detail: {type: string, description: "Why the scale cannot be read, when it cannot."}
    PosScaleWeighInRequest:
      type: object
      additionalProperties: false
      required: [register_id, vehicle_ref]
      properties:
        register_id: {type: string}
        vehicle_ref: {type: string, description: "The truck's plate or number; the ticket carries it."}
    PosScaleWeighOutRequest:
      type: object
      additionalProperties: false
      required: [sale_id, line_id]
      properties:
        sale_id: {type: string, format: uuid}
        line_id: {type: string, format: uuid}
        weigh_in_ticket_id: {type: [string, "null"], format: uuid, description: "The weigh in to net against; else the vehicle's latest open one."}
        vehicle_ref: {type: string}
        revision: {type: [integer, "null"], format: int64, description: "The sale's revision; the If-Match header carries it instead."}
    PosScaleWeighOutResponse:
      type: object
      required: [sale, ticket]
      properties:
        sale:
          $ref: "#/components/schemas/PosTransaction"
