      summary: Replay a batch of offline sales
      description: >-
        Each sale in the batch is replayed through the same completion path
        (stock, invoice, payments, ledger, event) keyed by its client_id: a
        replayed sale is a duplicate, not an error. The batch register is
        read before any item runs and before the sync log row is written: a
        register_id that is empty or names no register the counter knows is
        a 400 for every caller, and a register of another branch is the
        branch wall's 403. A sale whose tax provider call fails is never
        rejected (the one exception to the provider rule, ADR 0005 section
        3): it stays pending in the sync log and the sync retries it;
        errors lists what could not complete and pending what waits.
      parameters:
        - $ref: "#/components/parameters/XBranchId"
        - $ref: "#/components/parameters/IdempotencyKey"
