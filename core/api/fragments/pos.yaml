    PosTillPolicy:
      type: object
      required: [branch_id, variance_threshold_cents, branch_threshold_cents, default_threshold_cents, source]
      properties:
        branch_id: {type: string, format: uuid}
        variance_threshold_cents: {type: [integer, "null"], format: int64, description: "The figure in force; null when none exists."}
        branch_threshold_cents: {type: [integer, "null"], format: int64, description: "The branch's own override."}
        default_threshold_cents: {type: [integer, "null"], format: int64, description: "The database wide default."}
        source: {type: string, enum: [branch, default, none]}
    PosTillPolicyRequest:
      type: object
      required: [branch_id, variance_threshold_cents]
      properties:
        branch_id: {type: string, format: uuid}
        variance_threshold_cents: {type: [integer, "null"], format: int64, minimum: 0, description: "Null clears the branch's override."}
    PosSettings:
      type: object
      required: [revision, rules]
      properties:
        revision: {type: integer, format: int64, minimum: 1, description: "The settings resource's revision; a write names it (If-Match and/or the body's revision)."}
        rules:
          type: object
          required: [check_limit_cents, check_id_required]
          properties:
            check_limit_cents: {type: [integer, "null"], format: int64, minimum: 0, description: "The database wide check limit; null is no limit. A customer's own limit wins over it."}
            check_id_required:
              type: object
              required: [mode, over_cents]
              properties:
                mode: {type: string, enum: [never, every_check, over_amount], description: "Never asks for an ID; every_check asks on every check; over_amount asks once the sale's checks total over the figure, and then on every check of the sale."}
                over_cents: {type: [integer, "null"], format: int64, minimum: 1, description: "The figure an over_amount rule names, read against the sale's checks in total; null on the other two."}
    PosSettingsRequest:
      type: object
      required: [rules]
      properties:
        rules:
          type: object
          required: [check_limit_cents, check_id_required]
          properties:
            check_limit_cents: {type: [integer, "null"], format: int64, minimum: 0, description: "Null clears the limit (no limit)."}
            check_id_required:
              type: object
              required: [mode]
              properties:
                mode: {type: string, enum: [never, every_check, over_amount]}
                over_cents: {type: [integer, "null"], format: int64, minimum: 1, description: "Read only when mode is over_amount; dropped otherwise."}
        revision: {type: integer, format: int64, minimum: 1, description: "The revision this write rides; If-Match serves the same role."}
    PosEndOfDayCloseRequest:
