#
# The accounts payable module. The vendor invoice routes are on the wire
# contract (item C4-1b, ADR 0008 sections 7.4 and 11, on ADR 0001): Gable's
# own number (AP-, gapped sequence) as number, the vendor's as
# vendor_invoice_number, money in _cents, the scaled unit price, the cursor
# envelope, the error envelope, the revision precondition and a transitions
# route that replaced /approve. The payment and aging routes keep their
# today shapes until their own conversion (ADR 0008 section 11), with the
# payment act's new refusals. Every route sits behind
# scoped("admin","owner","finance") with the branch middleware, registered in
# internal/app/serve/serve.go; the bills carry a branch, so every read and
# write is held to the caller's wall.
paths:
  /api/v1/ap/invoices:
    get:
      operationId: apInvoiceList
      tags: [ap]
      summary: List vendor invoices
      description: >-
        Role guard admin, owner or finance, behind the branch middleware: a
        bound caller sees its branch's bills only. The cursor envelope,
        newest first by (created_at, id). vendor_id and po_id filter on their
        document and status on the lowercase lifecycle vocabulary (a comma
        separated list); a parameter the route does not declare, a status
        outside the vocabulary or an uppercase one, a malformed cursor or an
        out of range limit is a 400. total appears only under include=total.
      parameters:
        - name: vendor_id
          in: query
          required: false
          description: Filter on the vendor.
          schema:
            type: string
            format: uuid
        - name: po_id
          in: query
          required: false
          description: Filter on the purchase order.
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          required: false
          description: Comma separated lowercase statuses (pending, approved, partial, paid, voided).
          schema:
            type: string
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Include'
        - $ref: '#/components/parameters/XBranchId'
      responses:
        '200':
          description: The page of vendor invoice summaries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApInvoicePage'
        '400':
          $ref: '#/components/responses/BadRequestEither'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenEither'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: apInvoiceCreate
      tags: [ap]
      summary: Enter a vendor invoice
      description: >-
        Role guard admin, owner or finance. The bill starts pending, owing
        its whole total, with Gable's own number. Money is _cents, the line
        unit price is _ten_thousandths and the quantity a decimal string; the
        server prices each line and never accepts a status. Every line names
        its gl_account_id (the approve entry debits each line's account). The
        branch defaults from the body branch, the caller's context branch or
        the default branch, and is held to the caller's wall (403 naming
        branch_id). Validation failures are one 400 naming every field with
        its full path; a duplicate vendor number for the vendor is a 409; an
        unknown vendor, purchase order or account is a 400 naming the field.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/XBranchId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApCreateVendorInvoiceRequest'
      responses:
        '201':
          description: The created bill, with its lines.
          headers:
            ETag:
              description: The document's revision.
              schema:
                type: string
            Location:
              description: The bill's own route.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApVendorInvoice'
        '400':
          $ref: '#/components/responses/BadRequestEither'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenEither'
        '409':
          $ref: '#/components/responses/ConflictEither'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/ap/invoices/{id}:
    get:
      operationId: apInvoiceGet
      tags: [ap]
      summary: Get one vendor invoice with lines
      description: >-
        Role guard admin, owner or finance, held to the caller's branch wall:
        another branch's bill is a 404. Carries the revision's ETag.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/XBranchId'
      responses:
        '200':
          description: The bill with its lines.
          headers:
            ETag:
              description: The document's revision.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApVendorInvoice'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenEither'
        '404':
          $ref: '#/components/responses/WireNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/ap/invoices/{id}/transitions:
    post:
      operationId: apInvoiceTransition
      tags: [ap]
      summary: Approve or void a vendor invoice
      description: >-
        Role guard admin, owner or finance, held to the caller's branch wall.
        Replaces the old /approve route. The body names the target status and
        carries the revision (or If-Match); a write with neither is 428, a
        mismatch 409 stale_revision. To approved: only from pending; the
        entry posts through gl.PostEntry inside the transition's transaction
        (a debit leg per line on the line's account, the tax spread across
        the line accounts pro rata, the credit to Accounts Payable), and a
        posting failure fails the act (a closed period is a 409 blocker
        period_closed; a line with no account is a 409 blocker
        line_needs_account). To voided: from pending (nothing posted) or
        approved (the entry is reversed whole); a reason is required, and a
        bill with money applied is refused with the has_payments blocker.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/XBranchId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApInvoiceTransitionRequest'
      responses:
        '200':
          description: The bill after the transition, with its lines.
          headers:
            ETag:
              description: The document's new revision.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApVendorInvoice'
        '400':
          $ref: '#/components/responses/BadRequestEither'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenEither'
        '404':
          $ref: '#/components/responses/WireNotFound'
        '409':
          $ref: '#/components/responses/ConflictEither'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '428':
          $ref: '#/components/responses/WirePreconditionRequired'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/ap/payments:
    get:
      operationId: apPaymentList
      tags: [ap]
      summary: List vendor payments
      description: >-
        Role guard admin, owner or finance. A bare array until the payment
        routes' own conversion (ADR 0008 section 11). Optional vendor_id
        filter (an unparseable value is a 400 naming it); a parameter the
        route does not declare is refused.
      parameters:
        - name: vendor_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The vendor payments.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApPayment'
        '400':
          $ref: '#/components/responses/BadRequestEither'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenEither'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: apPaymentCreate
      tags: [ap]
      summary: Pay a vendor
      description: >-
        Role guard admin, owner or finance. The request keeps its today shape
        (float dollars, uppercase methods) until the payment routes' own
        conversion. The payment locks the named bills in id order and applies
        only to bills in approved or partial (a pending, paid or voided bill
        is a 409 blocker invoice_not_approved; a bill of another vendor is a
        400 naming invoice_ids[i]); more than the named bills still owe is a
        409 blocker exceeds_open. The entry posts through gl.PostEntry inside
        the act's transaction (DR Accounts Payable, CR Cash), and a posting
        failure fails the act (a closed period is a 409 blocker
        period_closed).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApCreatePaymentRequest'
      responses:
        '201':
          description: The created payment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApPayment'
        '400':
          $ref: '#/components/responses/BadRequestEither'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenEither'
        '409':
          $ref: '#/components/responses/ConflictEither'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/ap/aging:
    get:
      operationId: apAging
      tags: [ap]
      summary: AP aging by vendor
      description: >-
        Role guard admin, owner or finance. One row per vendor with open
        balances in int64 cents buckets, from amount_open; a paid or voided
        bill owes nothing anywhere. A bare array until the aging route's own
        conversion. No query parameters; one is refused.
      responses:
        '200':
          description: The aging rows.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApAgingSummary'
        '400':
          $ref: '#/components/responses/BadRequestEither'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenEither'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  schemas:
    ApInvoicePage:
      type: object
      required: [items, next_cursor, limit]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ApVendorInvoiceSummary'
        next_cursor:
          type: [string, 'null']
        limit:
          type: integer
        total:
          type: integer
          description: Only under include=total.
    ApVendorInvoice:
      type: object
      required: [id, number, vendor_id, vendor_name, branch_id, vendor_invoice_number, currency, invoice_date,
                 due_date, po_id, subtotal_cents, tax_cents, total_cents, amount_paid_cents, amount_open_cents,
                 status, approved_by, approved_at, notes, revision, gl_entry_id, created_at, lines]
      description: >-
        A vendor bill (ap.Invoice): Gable's own number as number, the vendor's
        as vendor_invoice_number, money in _cents, a lowercase status, the
        revision, and the entry the approval posted. Optional fields are
        present as null.
      properties:
        id:
          type: string
          format: uuid
        number:
          type: string
          description: Gable's own number, AP- and six or more digits.
        vendor_id:
          type: string
          format: uuid
        vendor_name:
          type: string
        branch_id:
          type: string
          format: uuid
        vendor_invoice_number:
          type: string
          description: The vendor's own number for the bill.
        currency:
          type: string
          description: ISO 4217.
        invoice_date:
          type: string
          format: date
        due_date:
          type: string
          format: date
        po_id:
          type: [string, 'null']
          format: uuid
        subtotal_cents:
          type: integer
          format: int64
        tax_cents:
          type: integer
          format: int64
        total_cents:
          type: integer
          format: int64
        amount_paid_cents:
          type: integer
          format: int64
        amount_open_cents:
          type: integer
          format: int64
        status:
          type: string
          enum: [pending, approved, partial, paid, voided]
        approved_by:
          type: [string, 'null']
          format: uuid
        approved_at:
          type: [string, 'null']
          format: date-time
        notes:
          type: string
        revision:
          type: integer
          format: int64
        gl_entry_id:
          type: [string, 'null']
          format: uuid
        created_at:
          type: string
          format: date-time
        lines:
          type: array
          items:
            $ref: '#/components/schemas/ApVendorInvoiceLine'
    ApVendorInvoiceSummary:
      type: object
      required: [id, number, vendor_id, vendor_name, branch_id, vendor_invoice_number, currency, invoice_date,
                 due_date, po_id, subtotal_cents, tax_cents, total_cents, amount_paid_cents, amount_open_cents,
                 status, approved_by, approved_at, notes, revision, gl_entry_id, created_at]
      description: A vendor bill header (ap.Summary), the list item and the shape the full document embeds.
      properties:
        id:
          type: string
          format: uuid
        number:
          type: string
        vendor_id:
          type: string
          format: uuid
        vendor_name:
          type: string
        branch_id:
          type: string
          format: uuid
        vendor_invoice_number:
          type: string
        currency:
          type: string
        invoice_date:
          type: string
          format: date
        due_date:
          type: string
          format: date
        po_id:
          type: [string, 'null']
          format: uuid
        subtotal_cents:
          type: integer
          format: int64
        tax_cents:
          type: integer
          format: int64
        total_cents:
          type: integer
          format: int64
        amount_paid_cents:
          type: integer
          format: int64
        amount_open_cents:
          type: integer
          format: int64
        status:
          type: string
          enum: [pending, approved, partial, paid, voided]
        approved_by:
          type: [string, 'null']
          format: uuid
        approved_at:
          type: [string, 'null']
          format: date-time
        notes:
          type: string
        revision:
          type: integer
          format: int64
        gl_entry_id:
          type: [string, 'null']
          format: uuid
        created_at:
          type: string
          format: date-time
    ApVendorInvoiceLine:
      type: object
      required: [id, position, description, quantity, unit_price_ten_thousandths, line_total_cents, gl_account_id,
                 purchase_order_line_id, product_id, po_freight_charge_id, created_at]
      description: >-
        A vendor invoice line (ap.InvoiceLine). The quantity is a decimal
        string, the unit price is _ten_thousandths, and the extension is the
        server's one rounding. The purchase order line and freight charge
        links arrive with migration 106 and are written from package C's
        freight rule on (ADR 0008 7.3): today's lines are not linked.
      properties:
        id:
          type: string
          format: uuid
        position:
          type: integer
        description:
          type: string
        quantity:
          type: string
          description: A plain decimal with at most 4 fraction digits.
        unit_price_ten_thousandths:
          type: integer
          format: int64
        line_total_cents:
          type: integer
          format: int64
        gl_account_id:
          type: [string, 'null']
          format: uuid
        purchase_order_line_id:
          type: [string, 'null']
          format: uuid
        product_id:
          type: [string, 'null']
          format: uuid
        po_freight_charge_id:
          type: [string, 'null']
          format: uuid
        created_at:
          type: string
          format: date-time
    ApPayment:
      type: object
      required: [id, vendor_id, amount, method, payment_date, status, created_at]
      description: A payment to a vendor (ap.APPayment), in its today shape. amount is int64 cents.
      properties:
        id:
          type: string
          format: uuid
        vendor_id:
          type: string
          format: uuid
        vendor_name:
          type: string
        batch_id:
          type: string
          format: uuid
        amount:
          type: integer
          format: int64
          description: Cents.
        method:
          type: string
          enum: [CHECK, ACH, WIRE]
        check_number:
          type: string
        reference:
          type: string
        payment_date:
          type: string
          format: date
        status:
          type: string
          description: PENDING, COMPLETE or VOIDED.
        created_at:
          type: string
          format: date-time
    ApAgingSummary:
      type: object
      required: [vendor_id, vendor_name, current, past_30, past_60, past_90, total]
      description: Aging buckets for one vendor (ap.APAgingSummary). Every bucket is int64 cents.
      properties:
        vendor_id:
          type: string
          format: uuid
        vendor_name:
          type: string
        current:
          type: integer
          format: int64
          description: Cents.
        past_30:
          type: integer
          format: int64
          description: Cents.
        past_60:
          type: integer
          format: int64
          description: Cents.
        past_90:
          type: integer
          format: int64
          description: Cents.
        total:
          type: integer
          format: int64
          description: Cents.
    ApCreateVendorInvoiceRequest:
      type: object
      required: [vendor_id, vendor_invoice_number, invoice_date, due_date, lines]
      description: >-
        The create body. Dates are YYYY-MM-DD; money is _cents and the line
        unit price is _ten_thousandths; the quantity is a decimal string; the
        server prices each line and never accepts a status.
      properties:
        vendor_id:
          type: string
          format: uuid
        branch_id:
          type: string
          format: uuid
          description: Defaults from the caller's context branch or the default branch.
        vendor_invoice_number:
          type: string
          description: 1 to 64 characters, unique per vendor.
        invoice_date:
          type: string
          format: date
        due_date:
          type: string
          format: date
        po_id:
          type: string
          format: uuid
        currency:
          type: string
          description: An ISO 4217 code of three capital letters; defaults from the setting.
        tax_cents:
          type: integer
          format: int64
        notes:
          type: string
        lines:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ApCreateVendorInvoiceLineRequest'
    ApCreateVendorInvoiceLineRequest:
      type: object
      required: [description, quantity, unit_price_ten_thousandths, gl_account_id]
      properties:
        description:
          type: string
          description: 1 to 256 characters.
        quantity:
          type: string
          description: A plain decimal with at most 4 fraction digits, more than zero.
        unit_price_ten_thousandths:
          type: integer
          format: int64
          description: Never negative.
        gl_account_id:
          type: string
          format: uuid
          description: The account the approve entry debits for the line.
        purchase_order_line_id:
          type: string
          format: uuid
        product_id:
          type: string
          format: uuid
    ApInvoiceTransitionRequest:
      type: object
      required: [to]
      description: The transition body. The revision, or If-Match, is required (ADR 0001 section 11).
      properties:
        to:
          type: string
          enum: [approved, voided]
        revision:
          type: integer
          format: int64
        reason:
          type: string
          description: Required to void; at most 500 characters.
    ApCreatePaymentRequest:
      type: object
      required: [vendor_id, amount, method, payment_date]
      description: The pay body, in its today shape until the payment routes' own conversion.
      properties:
        vendor_id:
          type: string
          format: uuid
        amount:
          type: number
          description: Float dollars today.
        method:
          type: string
          enum: [CHECK, ACH, WIRE]
        check_number:
          type: string
        reference:
          type: string
        payment_date:
          type: string
          format: date
        invoice_ids:
          type: array
          description: Bills this payment is applied to, in the order the desk pays them.
          items:
            type: string
            format: uuid
