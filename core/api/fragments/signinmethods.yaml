#
# The dealer's sign in method allowlist (S9, migration 129): the public auth
# config the front door discovers at boot, the admin read and write of the
# allowlist, and the start route every non form method starts from. The
# allowlist is a closed vocabulary of six method names; of them only
# email_password is a server sign in path today (the portal login), the rest
# are allowlist only and their start route answers a plain 501.
paths:
  /api/v1/auth/config:
    get:
      operationId: authConfigGet
      tags: [auth]
      summary: The runtime auth config
      description: >-
        Public (answers before any sign in). The auth mode the server runs in,
        the dealer's public display name and optional mark URL for the white
        labelled door (read from the single dealer_profile row), and the
        dealer's allowed sign in methods in the stored order, each with what
        the front door needs to render it: the kind (form, passkey, link or
        redirect), the label, the start URL (the portal login for the form
        method, the start route for the others). The oidc issuer is configured in
        Appwrite, so its issuer URL and client id are always null here. A strict allowlist response type: it never carries a
        secret, an internal host or another tenant's data. The dealer is the
        install's single tenant.
      security: []
      responses:
        "200":
          description: The auth mode, the dealer brand and the allowed methods, in the dealer's order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthConfig"
        "500":
          $ref: "#/components/responses/WireInternalError"
  /api/v1/auth/start/{method}:
    post:
      operationId: authStart
      tags: [auth]
      summary: Start a sign in by one method
      description: >-
        Public. The POST a non form method is asked at. A method outside the
        six is a 404; a method the dealer's allowlist does not hold is a 403;
        the form method has no start route (a 400); the provider redirect
        methods (google, microsoft, oidc) start by navigating (GET) and answer
        a POST with a 405; the magic link's POST is its own route; and a
        method that is allowed but not served here (passkey, deferred)
        answers a plain 501 not_implemented, never a crash.
      security: []
      parameters:
        - name: method
          in: path
          required: true
          description: One of the six method codes.
          schema:
            type: string
            enum: [email_password, passkey, magic_link, google, microsoft, oidc]
      responses:
        "400":
          $ref: "#/components/responses/WireBadRequest"
        "404":
          $ref: "#/components/responses/WireNotFound"
        "403":
          $ref: "#/components/responses/Forbidden"
        "405":
          description: A provider redirect method starts by navigation (GET), not by POST.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WireError"
        "501":
          description: >-
            The method is in the dealer's allowlist but not implemented on
            this server; the standard error envelope with code
            not_implemented and the plain message that says so.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WireError"
    get:
      operationId: authStartRedirect
      tags: [auth]
      summary: Start a provider sign in by navigation
      description: >-
        Public. For google, microsoft and oidc the browser navigates here. The
        core files a pending sign in, sets the single use state cookie
        (HttpOnly, Secure, SameSite=Lax, Path=/api, no Domain, short lived)
        and redirects (302) to Appwrite's provider redirect, whose success and
        failure addresses are Gable's callback and nothing else. A method
        outside the three is a 404, one the dealer's allowlist does not hold
        a 403, and the provider methods are closed with a 503 until a
        supported Appwrite version has been read. Limited per client address.
      security: []
      parameters:
        - name: method
          in: path
          required: true
          schema:
            type: string
            enum: [google, microsoft, oidc]
        - name: client
          in: query
          required: false
          description: >-
            Set to shell by a Tauri shell. A shell start must also carry
            code_challenge, code_challenge_method and return_to; a web start
            takes no query at all.
          schema:
            type: string
            enum: [shell]
        - name: code_challenge
          in: query
          required: false
          description: The PKCE S256 challenge, 43 base64url characters.
          schema:
            type: string
        - name: code_challenge_method
          in: query
          required: false
          schema:
            type: string
            enum: [S256]
        - name: return_to
          in: query
          required: false
          description: >-
            Where the callback sends the shell's browser with its one time
            code: gable://auth/callback, or http://127.0.0.1:{port}/auth/callback
            or http://[::1]:{port}/auth/callback. Any other target is a 400.
          schema:
            type: string
      responses:
        "400":
          $ref: "#/components/responses/WireBadRequest"
        "302":
          description: To Appwrite's provider redirect; the state cookie is set.
          headers:
            Set-Cookie:
              description: The gable_signin_state cookie (HttpOnly, Secure, SameSite=Lax, Path=/api, no Domain).
              schema:
                type: string
            Location:
              schema:
                type: string
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/WireNotFound"
        "429":
          description: Too many attempts; retry after the Retry-After seconds.
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WireError"
        "503":
          $ref: "#/components/responses/WireUnavailable"
  /api/v1/auth/methods:
    get:
      operationId: authMethodsGet
      tags: [auth]
      summary: Read the dealer's sign in method allowlist
      description: >-
        The admin read of the allowlist: the same method views the public
        config carries, plus the last write time. Role gated admin and owner,
        the dealer's admin roles alone.
      security:
        - BearerJWT: []
      responses:
        "200":
          description: The allowlist and its last write time.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SigninMethodsAllowlist"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/WireInternalError"
    put:
      operationId: authMethodsPut
      tags: [auth]
      summary: Replace the dealer's sign in method allowlist
      description: >-
        Replaces the whole allowlist. The order of the request's methods is
        the order the door renders them. The list must hold at least one
        method, every code one of the six, no code twice, and the oidc display
        label belongs to the oidc method alone. The issuer URL and client id
        are retired (the issuer is configured in Appwrite) and refused on every
        method; the table never stores a client secret.
        The write is audited with the before and after in one transaction.
        Role gated admin and owner.
      security:
        - BearerJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SigninMethodsPutRequest"
      responses:
        "200":
          description: The saved allowlist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SigninMethodsAllowlist"
        "400":
          $ref: "#/components/responses/WireBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/WireInternalError"
components:
  schemas:
    AuthConfigMethod:
      type: object
      required: [method, kind, label, start_url, issuer_url, client_id]
      description: >-
        One allowed sign in method. The nullable fields are always present,
        null when the method does not use them.
      properties:
        method:
          type: string
          enum: [email_password, passkey, magic_link, google, microsoft, oidc]
        kind:
          type: string
          enum: [form, passkey, link, redirect]
          description: How the door renders the method.
        label:
          type: string
          description: The door's label; an oidc row carries its own.
        start_url:
          type: [string, "null"]
          description: >-
            Where the method starts: the portal login for the form method,
            the start route for every other.
        issuer_url:
          type: [string, "null"]
          description: Retired (the issuer is configured in Appwrite); always null.
        client_id:
          type: [string, "null"]
          description: Retired (the issuer is configured in Appwrite); always null.
    AuthConfig:
      type: object
      required: [auth_mode, dealer_name, dealer_mark_url, methods]
      properties:
        auth_mode:
          type: string
          enum: [dev, production]
          description: The auth mode the server runs in.
        dealer_name:
          type: string
          description: >-
            The dealer's public display name (trading name when set on the
            dealer profile, else legal name; empty when neither is set).
        dealer_mark_url:
          type: [string, "null"]
          description: >-
            The path of the dealer's logo when one is uploaded on the dealer
            profile, else null.
        methods:
          type: array
          items:
            $ref: "#/components/schemas/AuthConfigMethod"
          description: The allowed methods, in the dealer's stored order.
    SigninMethodsAllowlist:
      type: object
      required: [methods, updated_at]
      properties:
        methods:
          type: array
          items:
            $ref: "#/components/schemas/AuthConfigMethod"
        updated_at:
          type: string
          format: date-time
    SigninMethodsPutRequest:
      type: object
      required: [methods]
      properties:
        methods:
          type: array
          minItems: 1
          items:
            type: object
            required: [method]
            properties:
              method:
                type: string
                enum: [email_password, passkey, magic_link, google, microsoft, oidc]
              oidc_issuer_url:
                type: string
                description: Retired; refused on every method (the issuer is configured in Appwrite).
              oidc_client_id:
                type: string
                description: Retired; refused on every method.
              oidc_label:
                type: string
                description: The display label; optional on the oidc method, refused on any other.
