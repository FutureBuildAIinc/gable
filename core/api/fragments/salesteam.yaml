#
# The sales-team module, transcribed from internal/salesteam/handler.go and model.go
# as they behave today: nullability per golden records.
paths:
  /api/v1/sales-team:
    get:
      operationId: salesTeamList
      tags: [sales-team]
      summary: List sales team members
      parameters:
        - $ref: "#/components/parameters/XBranchId"
      responses:
        "200":
          description: Array of sales persons.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SalesPerson"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/sales-team/{id}:
    get:
      operationId: salesTeamGet
      tags: [sales-team]
      summary: Get one sales person
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/XBranchId"
      responses:
        "200":
          description: The sales person.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalesPerson"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  schemas:
    SalesPerson:
      type: object
      required: [id, name, email, phone, role, is_active, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        role:
          type: string
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
