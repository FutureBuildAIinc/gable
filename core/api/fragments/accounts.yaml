#
# The accounts and AR module on the wire contract (ADR 0001; ADR 0005 sections 9
# and 10, item C2-4): the account summary and the subledger, the receivable aging
# by customer, job or ship-to as of a date, the customer statement, the
# reconciliation that shows drift between the subledger, the documents and the
# ledger, and the reversal of an application. Every amount is integer _cents.
paths:
  /api/v1/accounts/{id}:
    get:
      operationId: accountSummary
      tags: [accounts]
      summary: Get account summary
      description: >-
        The customer's balance (the subledger), credit limit and the credit left (both
        null for no limit), and the open credit memos plus unapplied cash as a negative
        figure. An unknown customer is 404, and so is a customer outside the caller's
        branches (customer_branches held to the reach, header or no header).
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: "#/components/parameters/XBranchId"
      responses:
        "200":
          description: The account summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountSummary"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "404":
          $ref: "#/components/responses/WireNotFound"
  /api/v1/accounts/{id}/transactions:
    get:
      operationId: accountTransactions
      tags: [accounts]
      summary: List account transactions
      description: >-
        The customer's subledger rows (one per movement of account 1020), newest first
        (created_at, then id), in the cursor list envelope. A customer outside the
        caller's branches is 404, header or no header.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Include"
        - $ref: "#/components/parameters/XBranchId"
      responses:
        "200":
          description: The page of subledger rows.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountTransactionPage"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "404":
          $ref: "#/components/responses/WireNotFound"
  /api/v1/ar/aging:
    get:
      operationId: arAging
      tags: [ar]
      summary: Receivable aging by customer, job or ship-to
      description: >-
        One item per group per currency, ordered by customer name, customer id, group id
        and currency. Every amount is taken as of as_of (default the branch's today), so the
        aging of a past date ignores later applications, counts an invoice voided after
        that date, and ties to the balances of 1020 and 2200 on it. current_cents is not
        yet due; the day buckets count days past the basis date; unapplied_cents is the
        open credit memos plus unapplied cash, negative, on the row of their own job
        (a payment carries a job, never a ship-to); total_cents is the buckets plus
        unapplied_cents. The fields of the coarser groupings are null.
      parameters:
        - name: group_by
          in: query
          required: false
          schema: {type: string, enum: [customer, job, ship_to], default: customer}
        - name: as_of
          in: query
          required: false
          schema: {type: string, format: date}
        - name: basis
          in: query
          required: false
          schema: {type: string, enum: [due_date, invoice_date], default: due_date}
        - name: customer_id
          in: query
          required: false
          schema: {type: string, format: uuid}
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Include"
        - $ref: "#/components/parameters/XBranchId"
      responses:
        "200":
          description: The page of aging rows.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArAgingPage"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
  /api/v1/ar/aging/summary:
    get:
      operationId: arAgingSummary
      tags: [ar]
      summary: Receivable aging bucket totals per currency
      description: The same parameters as the aging (group_by is read and has no effect); the answer is not a list.
      parameters:
        - name: group_by
          in: query
          required: false
          schema: {type: string, enum: [customer, job, ship_to]}
        - name: as_of
          in: query
          required: false
          schema: {type: string, format: date}
        - name: basis
          in: query
          required: false
          schema: {type: string, enum: [due_date, invoice_date], default: due_date}
        - name: customer_id
          in: query
          required: false
          schema: {type: string, format: uuid}
        - $ref: "#/components/parameters/XBranchId"
      responses:
        "200":
          description: The bucket totals, one entry per currency.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArAgingSummary"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
  /api/v1/ar/customers/{id}/statement:
    get:
      operationId: arStatement
      tags: [ar]
      summary: Customer statement
      description: >-
        Per currency: the opening balance (the subledger rows before from), every row in
        the range (filtered to the job when job_id is given, through the source document's
        job), the closing balance, and the open documents (invoices with an open amount,
        credit memos with open credit). from defaults to a month before to; to to today.
        A customer outside the caller's branches is 404, header or no header.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: from
          in: query
          required: false
          schema: {type: string, format: date}
        - name: to
          in: query
          required: false
          schema: {type: string, format: date}
        - name: job_id
          in: query
          required: false
          schema: {type: string, format: uuid}
        - $ref: "#/components/parameters/XBranchId"
      responses:
        "200":
          description: The statement.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArStatement"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "404":
          $ref: "#/components/responses/WireNotFound"
  /api/v1/ar/reconciliation:
    get:
      operationId: arReconciliation
      tags: [ar]
      summary: Reconcile the subledger, the documents and the ledger
      description: >-
        Roles admin, owner, finance. Lists every customer whose balance_due, subledger
        sum and document open amounts disagree, per currency, and for each currency whether
        the sum of balances equals account 1020 and unapplied cash equals account 2200.
        Rows written before cycle 2 show here; nothing repairs a difference.
      parameters:
        - $ref: "#/components/parameters/XBranchId"
      responses:
        "200":
          description: The drift and the ledger comparison.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArReconciliation"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
  /api/v1/ar/applications/{id}/reverse:
    post:
      operationId: arApplicationReverse
      tags: [ar]
      summary: Reverse one application
      description: >-
        Roles admin, owner, finance; a reason is required. Reverses one live application
        of any kind: a payment application (and the discount applications of the same act on
        the same invoice), a credit memo application, or a write off. A payment application
        posts the reversal of its own entry, or, when it has none (a migrated one), a new
        DR 1020 / CR 2200 entry. A discount alone is refused with 409
        discount_stands_with_payment. Writes payment.unapplied or credit_memo.reopened (none for
        a write off), then invoice.reopened, then customer.updated.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: "#/components/parameters/XBranchId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArApplicationReverseRequest"
      responses:
        "200":
          description: The application, reversed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArApplication"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "404":
          $ref: "#/components/responses/WireNotFound"
        "409":
          $ref: "#/components/responses/ConflictEither"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/ar/credit-holds:
    get:
      operationId: arCreditHoldsList
      tags: [ar]
      summary: List credit holds
      description: >-
        The credit holds, newest first by (placed_at, id) in the cursor list
        envelope, each with the account's standing beside it (the limit, null
        for no limit, the balance, and the open invoice cents past due).
        status selects standing (the default: active and overridden), released
        or all. A customer named outside the caller's branches is 404, the
        subledger's wall.
      parameters:
        - name: status
          in: query
          required: false
          schema: {type: string, enum: [standing, released, all], default: standing}
        - name: customer_id
          in: query
          required: false
          schema: {type: string, format: uuid}
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Include"
        - $ref: "#/components/parameters/XBranchId"
      responses:
        "200":
          description: The page of credit holds.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditHoldPage"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "404":
          $ref: "#/components/responses/WireNotFound"
    post:
      operationId: arCreditHoldPlace
      tags: [ar]
      summary: Place a manual credit hold
      description: >-
        Roles admin, owner, finance. Places a hold of type manual (the
        default), over_limit or past_due with a required reason, and writes
        customers.credit_hold in the same transaction. Idempotent: an account
        that already carries a standing hold answers it with 200 and placed
        false; a new hold answers 201 with placed true. The standing hold
        carries the answer either way.
      parameters:
        - $ref: "#/components/parameters/XBranchId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreditHoldPlaceRequest"
      responses:
        "200":
          description: The standing hold, already in place.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditHold"
        "201":
          description: The hold, placed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditHold"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "404":
          $ref: "#/components/responses/WireNotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /api/v1/ar/credit-holds/evaluate:
    post:
      operationId: arCreditHoldsEvaluate
      tags: [ar]
      summary: Run the credit hold sweep
      description: >-
        Roles admin, owner, finance. Evaluates the active credit accounts (or
        exactly the named customers) against the credit limit and the past due
        invoices, and answers what the sweep would do: the accounts it would
        hold and the standing holds it would lift (only the ones it placed
        itself, never a person's hold and never one carrying a manager's
        override). With dry_run false it places and lifts idempotently and
        keeps customers.credit_hold true to the books; dry_run defaults to
        true and writes nothing.
      parameters:
        - $ref: "#/components/parameters/XBranchId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreditHoldEvaluateRequest"
      responses:
        "200":
          description: The sweep's answer, placed and lifted counts included.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditHoldEvaluation"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /api/v1/ar/credit-holds/{id}/release:
    post:
      operationId: arCreditHoldRelease
      tags: [ar]
      summary: Release a credit hold
      description: >-
        Roles admin, owner, finance; a reason is required. Ends a standing
        hold (active or overridden) with who and why, and clears
        customers.credit_hold in the same transaction. A released hold
        refuses with 409.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: "#/components/parameters/XBranchId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreditHoldReleaseRequest"
      responses:
        "200":
          description: The hold, released.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditHold"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "404":
          $ref: "#/components/responses/WireNotFound"
        "409":
          $ref: "#/components/responses/ConflictEither"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /api/v1/ar/credit-holds/{id}/override:
    post:
      operationId: arCreditHoldOverride
      tags: [ar]
      summary: Put a time-bounded override on a credit hold
      description: >-
        Roles admin, owner, finance. Puts a manager's window on a standing
        hold: override_until (a future instant, required), override_reason
        (required) and an optional max_order_cents the window allows. The hold
        stays on the account and reads as overridden; it never releases. A
        released hold refuses with 409.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: "#/components/parameters/XBranchId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreditHoldOverrideRequest"
      responses:
        "200":
          description: The hold, overridden until the window ends.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditHold"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "404":
          $ref: "#/components/responses/WireNotFound"
        "409":
          $ref: "#/components/responses/ConflictEither"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /api/v1/ar/customers/{id}/credit-limit-changes:
    get:
      operationId: arCreditLimitChangesList
      tags: [ar]
      summary: List a customer's credit limit changes
      description: >-
        The credit limit history, newest first by (created_at, id) in the
        cursor list envelope: what the limit was, what it became, who asked,
        who approved, and when it was decided. A customer outside the caller's
        branches is 404, the subledger's wall.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Include"
        - $ref: "#/components/parameters/XBranchId"
      responses:
        "200":
          description: The page of credit limit changes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditLimitChangePage"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "404":
          $ref: "#/components/responses/WireNotFound"
    post:
      operationId: arCreditLimitChangeRequest
      tags: [ar]
      summary: Record (and optionally apply) a credit limit change
      description: >-
        Roles admin, owner, finance. Records one change with the old limit,
        the new one, a required reason and who asked, as pending. With approve
        true the same act applies the new limit to the customer, stamps who
        approved it and when, and answers 200; a recorded request answers 201.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: "#/components/parameters/XBranchId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreditLimitChangeRequest"
      responses:
        "200":
          description: The change, approved and applied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditLimitChange"
        "201":
          description: The change, recorded as pending.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditLimitChange"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "404":
          $ref: "#/components/responses/WireNotFound"
        "409":
          $ref: "#/components/responses/ConflictEither"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /api/v1/ar/worklist:
    get:
      operationId: arWorklist
      tags: [ar]
      summary: The controller's collections and credit worklist
      description: >-
        The overdue and over-limit accounts, worst first, one row per customer
        with any past due bucket or any balance. The severity score weighs the
        over 90 bucket four times, the 61 to 90 bucket twice, the 31 to 60
        bucket and the over-limit amount once each, and a standing hold adds a
        bump that outranks any plain overdue account. Every row carries the
        aging buckets, the credit limit (null for no limit), the utilisation
        percent, the hold state and the recommended action: hold for a held,
        over limit or 90 day account, finance_charge for 61 to 90, call for 31
        to 60, send_statement for the rest. The aging carries the caller's
        branch wall; limit is 10 to 500 rows.
      parameters:
        - name: as_of
          in: query
          required: false
          schema: {type: string, format: date}
        - name: limit
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 500, default: 100}
        - $ref: "#/components/parameters/XBranchId"
      responses:
        "200":
          description: The ranked worklist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArWorklist"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
  /api/v1/ar/statements/runs:
    get:
      operationId: arStatementRunsList
      tags: [ar]
      summary: List batch statement runs
      description: The batch statement runs, newest first by (created_at, id) in the cursor list envelope.
      parameters:
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Include"
        - $ref: "#/components/parameters/XBranchId"
      responses:
        "200":
          description: The page of runs, without their items.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArStatementRunPage"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
    post:
      operationId: arStatementRunCreate
      tags: [ar]
      summary: Generate a batch statement run
      description: >-
        Roles admin, owner, finance. Records one run over the customers the
        period names: every customer with a non-zero balance, or exactly the
        customers customer_ids names. Each item carries the opening balance
        (the subledger rows before period_start), the invoices, the payments
        and the finance charges of the period, the closing balance and the
        aging buckets of period_end, taken as of that day and never
        re-derived. A run writes no balance, no document and no subledger row:
        two runs of one period answer the same numbers. With queue_email true,
        every item whose closing balance is positive is marked queued with the
        id of its statement.queued outbox event; a zero balance is skipped.
        period_end defaults to today and period_start to a month before it;
        neither may end after today. Answers 201 with the completed run and
        its items.
      parameters:
        - $ref: "#/components/parameters/XBranchId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArStatementRunRequest"
      responses:
        "201":
          description: The run, completed, with its items.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArStatementRun"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /api/v1/ar/statements/runs/{id}:
    get:
      operationId: arStatementRunGet
      tags: [ar]
      summary: Inspect one batch statement run
      description: The run with its items, customers by name.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: "#/components/parameters/XBranchId"
      responses:
        "200":
          description: The run and its items.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArStatementRun"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "404":
          $ref: "#/components/responses/WireNotFound"
  /api/v1/ar/finance-charges/rules:
    get:
      operationId: arFinanceChargeRulesGet
      tags: [ar]
      summary: Read the finance charge rules
      description: >-
        The tenant's finance charge rules: the monthly rate in basis points, the
        grace days, the minimum charge and the minimum overdue balance, whether
        the charges compound, and the income account the charge credits.
        Migration 124 seeds the row charges off.
      parameters:
        - $ref: "#/components/parameters/XBranchId"
      responses:
        "200":
          description: The rules.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArFinanceChargeRules"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "404":
          $ref: "#/components/responses/WireNotFound"
    put:
      operationId: arFinanceChargeRulesUpdate
      tags: [ar]
      summary: Write the finance charge rules
      description: >-
        Roles admin, owner, finance. Writes the whole policy in one act: the
        rate (at most 100000 basis points, 100 percent a month), the grace
        days (0 to 365), the two minimums, the compound flag, and an income
        account the chart of accounts must hold.
      parameters:
        - $ref: "#/components/parameters/XBranchId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArFinanceChargeRules"
      responses:
        "200":
          description: The rules, written.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArFinanceChargeRules"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /api/v1/ar/finance-charges/runs:
    get:
      operationId: arFinanceChargeRunsList
      tags: [ar]
      summary: List finance charge runs
      description: The finance charge runs, newest first by (created_at, id) in the cursor list envelope.
      parameters:
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Include"
        - $ref: "#/components/parameters/XBranchId"
      responses:
        "200":
          description: The page of runs, without their items.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArFinanceChargeRunPage"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
    post:
      operationId: arFinanceChargeRunCreate
      tags: [ar]
      summary: Preview or execute a finance charge run
      description: >-
        Roles admin, owner, finance. Charges every customer (or exactly the
        customers customer_ids names) whose open invoices sit more than the
        grace days past due as of as_of_date (default today, never in the
        future), in exact basis-point arithmetic over integer cents with
        banker's rounding, under the minimum charge and the minimum overdue
        balance. Without compound (the default) a finance charge invoice is
        never itself a basis. dry_run true (the default) records the preview
        as a DRY_RUN run with its per customer items and no documents; dry_run
        false writes each charged customer a FINANCE_CHARGE invoice, moves the
        balance through the subledger and posts the balanced entry (Debit AR
        1020, Credit the income account the rules name) when a ledger is
        wired.
      parameters:
        - $ref: "#/components/parameters/XBranchId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArFinanceChargeRunRequest"
      responses:
        "200":
          description: The run, executed or previewed, with its items.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArFinanceChargeRun"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "409":
          $ref: "#/components/responses/ConflictEither"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /api/v1/ar/finance-charges/runs/{id}:
    get:
      operationId: arFinanceChargeRunGet
      tags: [ar]
      summary: Inspect one finance charge run
      description: The run with its items, customers by name, each naming the invoice and the entry it generated when executed.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: "#/components/parameters/XBranchId"
      responses:
        "200":
          description: The run and its items.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArFinanceChargeRun"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "404":
          $ref: "#/components/responses/WireNotFound"
components:
  schemas:
    AccountSummary:
      type: object
      required: [customer_id, currency, balance_cents, credit_limit_cents, available_credit_cents, unapplied_cents]
      properties:
        customer_id: {type: string, format: uuid}
        currency: {type: string}
        balance_cents: {type: integer, format: int64}
        credit_limit_cents: {type: [integer, "null"], format: int64, description: "null for no limit; 0 is no credit."}
        available_credit_cents: {type: [integer, "null"], format: int64, description: "Limit less balance; null for no limit."}
        unapplied_cents: {type: integer, format: int64, description: "Open credit memos plus unapplied cash, negative or zero."}
    AccountTransactionType:
      type: string
      enum: [INVOICE, PAYMENT, ADJUSTMENT, REFUND, CREDIT_MEMO, DISCOUNT, WRITE_OFF, REVERSAL]
    AccountTransaction:
      type: object
      required: [id, customer_id, type, amount_cents, balance_after_cents, currency, source_kind, reference_id, description, created_at]
      properties:
        id: {type: string, format: uuid}
        customer_id: {type: string, format: uuid}
        type: {$ref: "#/components/schemas/AccountTransactionType"}
        amount_cents: {type: integer, format: int64, description: "Signed, debit positive."}
        balance_after_cents: {type: integer, format: int64}
        currency: {type: string}
        source_kind: {type: [string, "null"], description: "invoice, credit_memo, application, refund or pos_return; null on a row written before cycle 2."}
        reference_id: {type: [string, "null"], format: uuid}
        description: {type: string}
        created_at: {type: string, format: date-time}
    AccountTransactionPage:
      type: object
      required: [items, next_cursor, limit]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/AccountTransaction"}
        next_cursor: {type: [string, "null"]}
        limit: {type: integer}
        total: {type: integer, description: "Only under include=total."}
    ArApplicationKind:
      type: string
      enum: [payment, credit_memo, discount, write_off]
    ArApplication:
      type: object
      required: [id, customer_id, currency, kind, payment_id, credit_memo_id, invoice_id, amount_cents, reason, applied_on, applied_by, act_id, gl_entry_id, reversed_at, reversed_by, reversal_reason, reversal_gl_entry_id, reversed_on, created_at]
      description: The one record of AR being settled; a reversed application is never deleted.
      properties:
        id: {type: string, format: uuid}
        customer_id: {type: string, format: uuid}
        currency: {type: string}
        kind: {$ref: "#/components/schemas/ArApplicationKind"}
        payment_id: {type: [string, "null"], format: uuid}
        credit_memo_id: {type: [string, "null"], format: uuid}
        invoice_id: {type: string, format: uuid}
        amount_cents: {type: integer, format: int64}
        reason: {type: [string, "null"], description: "Required for a write off."}
        applied_on: {type: string, format: date}
        applied_by: {type: [string, "null"]}
        act_id: {type: string, format: uuid, description: "Groups the applications one request made."}
        gl_entry_id: {type: [string, "null"], format: uuid}
        reversed_at: {type: [string, "null"], format: date-time}
        reversed_by: {type: [string, "null"]}
        reversal_reason: {type: [string, "null"]}
        reversal_gl_entry_id: {type: [string, "null"], format: uuid}
        reversed_on: {type: [string, "null"], format: date}
        created_at: {type: string, format: date-time}
    ArApplicationReverseRequest:
      type: object
      required: [reason]
      properties:
        reason: {type: string, minLength: 1, maxLength: 500}
    ArAgingItem:
      type: object
      required: [customer_id, customer_name, job_id, job_name, ship_to_id, ship_to_code, currency, current_cents, days_1_30_cents, days_31_60_cents, days_61_90_cents, over_90_cents, unapplied_cents, total_cents]
      properties:
        customer_id: {type: string, format: uuid}
        customer_name: {type: string}
        job_id: {type: [string, "null"], format: uuid}
        job_name: {type: [string, "null"]}
        ship_to_id: {type: [string, "null"], format: uuid}
        ship_to_code: {type: [string, "null"]}
        currency: {type: string}
        current_cents: {type: integer, format: int64}
        days_1_30_cents: {type: integer, format: int64}
        days_31_60_cents: {type: integer, format: int64}
        days_61_90_cents: {type: integer, format: int64}
        over_90_cents: {type: integer, format: int64}
        unapplied_cents: {type: integer, format: int64}
        total_cents: {type: integer, format: int64}
    ArAgingPage:
      type: object
      required: [items, next_cursor, limit]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/ArAgingItem"}
        next_cursor: {type: [string, "null"]}
        limit: {type: integer}
        total: {type: integer, description: "Only under include=total."}
    ArAgingTotal:
      type: object
      required: [currency, current_cents, days_1_30_cents, days_31_60_cents, days_61_90_cents, over_90_cents, unapplied_cents, total_cents]
      properties:
        currency: {type: string}
        current_cents: {type: integer, format: int64}
        days_1_30_cents: {type: integer, format: int64}
        days_31_60_cents: {type: integer, format: int64}
        days_61_90_cents: {type: integer, format: int64}
        over_90_cents: {type: integer, format: int64}
        unapplied_cents: {type: integer, format: int64}
        total_cents: {type: integer, format: int64}
    ArAgingSummary:
      type: object
      required: [as_of, basis, totals]
      properties:
        as_of: {type: string, format: date}
        basis: {type: string, enum: [due_date, invoice_date]}
        totals:
          type: array
          items: {$ref: "#/components/schemas/ArAgingTotal"}
    ArStatementLine:
      type: object
      required: [id, date, type, description, amount_cents, balance_after_cents, source_kind, reference_id, job_id]
      properties:
        id: {type: string, format: uuid}
        date: {type: string, format: date}
        type: {$ref: "#/components/schemas/AccountTransactionType"}
        description: {type: string}
        amount_cents: {type: integer, format: int64}
        balance_after_cents: {type: integer, format: int64}
        source_kind: {type: [string, "null"]}
        reference_id: {type: [string, "null"], format: uuid}
        job_id: {type: [string, "null"], format: uuid}
    ArOpenDocument:
      type: object
      required: [kind, id, number, date, due_date, job_id, total_cents, open_cents]
      properties:
        kind: {type: string, enum: [invoice, credit_memo]}
        id: {type: string, format: uuid}
        number: {type: string}
        date: {type: string, format: date}
        due_date: {type: [string, "null"], format: date}
        job_id: {type: [string, "null"], format: uuid}
        total_cents: {type: integer, format: int64}
        open_cents: {type: integer, format: int64, description: "Negative for a credit memo."}
    ArStatementCurrency:
      type: object
      required: [currency, opening_balance_cents, lines, closing_balance_cents, open_documents, unapplied_payments, unapplied_cents, net_balance_cents]
      properties:
        currency: {type: string}
        opening_balance_cents: {type: integer, format: int64}
        lines:
          type: array
          items: {$ref: "#/components/schemas/ArStatementLine"}
        closing_balance_cents: {type: integer, format: int64}
        open_documents:
          type: array
          items: {$ref: "#/components/schemas/ArOpenDocument"}
        unapplied_payments:
          type: array
          description: Payments received on or before the statement's last day that still hold unapplied cash on it.
          items: {$ref: "#/components/schemas/ArUnappliedPayment"}
        unapplied_cents: {type: integer, format: int64, description: "The sum of the unapplied payments."}
        net_balance_cents:
          type: integer
          format: int64
          description: The closing balance less unapplied cash; the aging's total for the customer on the statement's last day.
    ArUnappliedPayment:
      type: object
      required: [id, number, received_on, unapplied_cents]
      properties:
        id: {type: string, format: uuid}
        number: {type: string}
        received_on: {type: string, format: date}
        unapplied_cents: {type: integer, format: int64}
    ArStatement:
      type: object
      required: [customer_id, customer_name, from, to, job_id, currencies]
      properties:
        customer_id: {type: string, format: uuid}
        customer_name: {type: string}
        from: {type: string, format: date}
        to: {type: string, format: date}
        job_id: {type: [string, "null"], format: uuid}
        currencies:
          type: array
          items: {$ref: "#/components/schemas/ArStatementCurrency"}
    ArDriftRow:
      type: object
      required: [customer_id, customer_name, currency, balance_cents, subledger_cents, documents_cents]
      properties:
        customer_id: {type: string, format: uuid}
        customer_name: {type: string}
        currency: {type: string}
        balance_cents: {type: integer, format: int64}
        subledger_cents: {type: integer, format: int64}
        documents_cents: {type: integer, format: int64}
    ArLedgerRow:
      type: object
      description: >-
        One currency's ledger comparison. For a scoped caller (a branch a
        header names, or a user whose grants scope a no header read) the two
        GL account balances and their in sync flags are absent: they are
        pure books figures no branch fact can divide, and the two sums cover
        the caller's reach only.
      required: [currency, balance_sum_cents, unapplied_sum_cents]
      properties:
        currency: {type: string}
        receivable_ledger_cents:
          type: integer
          format: int64
          description: Account 1020's posted balance; absent for a scoped caller.
        balance_sum_cents:
          type: integer
          format: int64
          description: The sum of the customers' balance_due over the caller's reach.
        deposits_ledger_cents:
          type: integer
          format: int64
          description: Account 2200's posted balance; absent for a scoped caller.
        unapplied_sum_cents:
          type: integer
          format: int64
          description: The sum of posted unapplied cash over the caller's reach.
        receivable_in_sync:
          type: boolean
          description: Whether 1020 equals the balance sum; absent for a scoped caller.
        deposits_in_sync:
          type: boolean
          description: Whether 2200 equals the unapplied sum; absent for a scoped caller.
    ArReconciliation:
      type: object
      required: [customers, currencies]
      properties:
        customers:
          type: array
          items: {$ref: "#/components/schemas/ArDriftRow"}
        currencies:
          type: array
          items: {$ref: "#/components/schemas/ArLedgerRow"}
    CreditStanding:
      type: object
      required: [credit_limit_cents, current_balance_cents, past_due_cents]
      properties:
        credit_limit_cents: {type: [integer, "null"], format: int64, description: "null for no limit."}
        current_balance_cents: {type: integer, format: int64}
        past_due_cents: {type: integer, format: int64, description: "The open invoice cents past their due date."}
    CreditHold:
      type: object
      required: [id, customer_id, customer_name, reason, hold_type, status, placed_by, placed_at, released_by, released_at, release_reason, override_until, override_by, override_reason, max_order_cents]
      properties:
        id: {type: string, format: uuid}
        customer_id: {type: string, format: uuid}
        customer_name: {type: string}
        reason: {type: string}
        hold_type: {type: string, enum: [manual, over_limit, past_due]}
        status: {type: string, enum: [active, released, overridden]}
        placed_by: {type: [string, "null"], description: "null on a hold the sweep placed."}
        placed_at: {type: string, format: date-time}
        released_by: {type: [string, "null"]}
        released_at: {type: [string, "null"], format: date-time}
        release_reason: {type: [string, "null"]}
        override_until: {type: [string, "null"], format: date-time}
        override_by: {type: [string, "null"]}
        override_reason: {type: [string, "null"]}
        max_order_cents: {type: [integer, "null"], format: int64, description: "The order size the override window allows."}
        credit:
          $ref: "#/components/schemas/CreditStanding"
    CreditHoldPage:
      type: object
      required: [items, next_cursor, limit]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/CreditHold"}
        next_cursor: {type: [string, "null"]}
        limit: {type: integer}
        total: {type: integer, description: "Only under include=total."}
    CreditHoldPlaceRequest:
      type: object
      required: [customer_id, reason]
      properties:
        customer_id: {type: string, format: uuid}
        reason: {type: string, minLength: 1, maxLength: 500}
        hold_type: {type: string, enum: [manual, over_limit, past_due], default: manual}
    CreditHoldReleaseRequest:
      type: object
      required: [reason]
      properties:
        reason: {type: string, minLength: 1, maxLength: 500}
    CreditHoldOverrideRequest:
      type: object
      required: [override_reason, override_until]
      properties:
        override_reason: {type: string, minLength: 1, maxLength: 500}
        override_until: {type: string, format: date-time, description: "A future instant: the window the override buys."}
        max_order_cents: {type: [integer, "null"], format: int64}
    CreditHoldEvaluateRequest:
      type: object
      required: []
      properties:
        dry_run: {type: boolean, default: true}
        customer_ids:
          type: array
          description: "Absent, every active credit account; present, exactly these."
          items: {type: string, format: uuid}
    CreditHoldPlacement:
      type: object
      required: [customer_id, hold_type, reason]
      properties:
        customer_id: {type: string, format: uuid}
        hold_type: {type: string, enum: [over_limit, past_due]}
        reason: {type: string}
        hold_id: {type: string, format: uuid, description: "Set on an executed sweep; empty on a dry run."}
    CreditHoldReleaseRecord:
      type: object
      required: [hold_id, customer_id, reason]
      properties:
        hold_id: {type: string, format: uuid}
        customer_id: {type: string, format: uuid}
        reason: {type: string}
    CreditHoldEvaluation:
      type: object
      required: [dry_run, evaluated, would_place, would_release, placed, released]
      properties:
        dry_run: {type: boolean}
        evaluated: {type: integer, description: "The accounts the sweep read."}
        would_place:
          type: array
          items: {$ref: "#/components/schemas/CreditHoldPlacement"}
        would_release:
          type: array
          items: {$ref: "#/components/schemas/CreditHoldReleaseRecord"}
        placed: {type: integer, description: "Zero on a dry run."}
        released: {type: integer, description: "Zero on a dry run."}
    CreditLimitChange:
      type: object
      required: [id, customer_id, old_limit_cents, new_limit_cents, requested_by, approved_by, status, reason, created_at, decided_at]
      properties:
        id: {type: string, format: uuid}
        customer_id: {type: string, format: uuid}
        old_limit_cents: {type: integer, format: int64}
        new_limit_cents: {type: integer, format: int64}
        requested_by: {type: [string, "null"]}
        approved_by: {type: [string, "null"]}
        status: {type: string, enum: [pending, approved, rejected]}
        reason: {type: [string, "null"]}
        created_at: {type: string, format: date-time}
        decided_at: {type: [string, "null"], format: date-time}
    CreditLimitChangePage:
      type: object
      required: [items, next_cursor, limit]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/CreditLimitChange"}
        next_cursor: {type: [string, "null"]}
        limit: {type: integer}
        total: {type: integer, description: "Only under include=total."}
    CreditLimitChangeRequest:
      type: object
      required: [new_limit_cents, reason]
      properties:
        new_limit_cents: {type: integer, format: int64, minimum: 0}
        reason: {type: string, minLength: 1, maxLength: 500}
        approve: {type: boolean, default: false, description: "true applies the limit in the same act."}
    ArWorklistRow:
      type: object
      required: [customer_id, customer_name, currency, balance_cents, current_cents, days_1_30_cents, days_31_60_cents, days_61_90_cents, over_90_cents, past_due_cents, over_limit_cents, credit_limit_cents, credit_utilization_pct, hold_status, hold_id, override_until, severity_score, recommended_action]
      properties:
        customer_id: {type: string, format: uuid}
        customer_name: {type: string}
        currency: {type: string}
        balance_cents: {type: integer, format: int64}
        current_cents: {type: integer, format: int64}
        days_1_30_cents: {type: integer, format: int64}
        days_31_60_cents: {type: integer, format: int64}
        days_61_90_cents: {type: integer, format: int64}
        over_90_cents: {type: integer, format: int64}
        past_due_cents: {type: integer, format: int64}
        over_limit_cents: {type: integer, format: int64}
        credit_limit_cents: {type: [integer, "null"], format: int64, description: "null for no limit."}
        credit_utilization_pct: {type: [integer, "null"], description: "The balance over the limit, percent; null for no limit."}
        hold_status: {type: string, enum: [none, active, overridden]}
        hold_id: {type: string, format: uuid}
        override_until: {type: [string, "null"], format: date-time}
        severity_score: {type: integer, format: int64}
        recommended_action: {type: string, enum: [hold, call, send_statement, finance_charge]}
    ArWorklist:
      type: object
      required: [as_of, rows]
      properties:
        as_of: {type: string, format: date}
        rows:
          type: array
          items: {$ref: "#/components/schemas/ArWorklistRow"}
    ArStatementRunItem:
      type: object
      required: [id, run_id, customer_id, customer_name, currency, opening_balance_cents, invoices_cents, payments_cents, finance_charges_cents, closing_balance_cents, delivery_status, outbox_id, aging_buckets]
      properties:
        id: {type: string, format: uuid}
        run_id: {type: string, format: uuid}
        customer_id: {type: string, format: uuid}
        customer_name: {type: string}
        currency: {type: string}
        opening_balance_cents: {type: integer, format: int64, description: "The subledger before period_start."}
        invoices_cents: {type: integer, format: int64}
        payments_cents: {type: integer, format: int64}
        finance_charges_cents: {type: integer, format: int64}
        closing_balance_cents: {type: integer, format: int64}
        delivery_status: {type: string, enum: [not_queued, queued, sent, failed, skipped]}
        outbox_id: {type: [string, "null"], format: uuid, description: "The statement.queued event of a queued item."}
        aging_buckets:
          type: object
          description: "The aging as of period_end: current, days_1_30, days_31_60, days_61_90 and over_90, in cents."
          additionalProperties: {type: integer, format: int64}
    ArStatementRun:
      type: object
      required: [id, period_start, period_end, as_of_date, status, total_customers, queued_count, sent_count, total_balance_cents, triggered_by, created_at, completed_at]
      properties:
        id: {type: string, format: uuid}
        period_start: {type: string, format: date}
        period_end: {type: string, format: date}
        as_of_date: {type: string, format: date}
        status: {type: string, enum: [running, completed, failed]}
        total_customers: {type: integer}
        queued_count: {type: integer}
        sent_count: {type: integer}
        total_balance_cents: {type: integer, format: int64}
        triggered_by: {type: [string, "null"]}
        created_at: {type: string, format: date-time}
        completed_at: {type: [string, "null"], format: date-time}
        items:
          type: array
          description: "On the by-id read and the create answer; the list read carries none."
          items: {$ref: "#/components/schemas/ArStatementRunItem"}
    ArStatementRunPage:
      type: object
      required: [items, next_cursor, limit]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/ArStatementRun"}
        next_cursor: {type: [string, "null"]}
        limit: {type: integer}
        total: {type: integer, description: "Only under include=total."}
    ArStatementRunRequest:
      type: object
      required: []
      properties:
        period_start: {type: string, format: date, description: "Default a month before period_end."}
        period_end: {type: string, format: date, description: "Default today; never after today."}
        customer_ids:
          type: array
          description: "Absent, every customer with a non-zero balance; present, exactly these."
          items: {type: string, format: uuid}
        queue_email: {type: boolean, default: false}
    ArFinanceChargeRunRequest:
      type: object
      required: []
      properties:
        as_of_date: {type: string, format: date, description: "Default today; never after today."}
        dry_run: {type: boolean, default: true}
        customer_ids:
          type: array
          description: "Absent, every eligible customer; present, exactly these."
          items: {type: string, format: uuid}
    ArFinanceChargeRules:
      type: object
      required: [monthly_rate_bps, grace_days, min_charge_cents, min_balance_cents, compound, income_account_code, updated_by, updated_at]
      properties:
        monthly_rate_bps: {type: integer, format: int64, minimum: 0, maximum: 100000, description: "10000 basis points is 100 percent a month."}
        grace_days: {type: integer, minimum: 0, maximum: 365}
        min_charge_cents: {type: integer, format: int64, minimum: 0}
        min_balance_cents: {type: integer, format: int64, minimum: 0}
        compound: {type: boolean, description: "false, the default, never charges on a finance charge invoice."}
        income_account_code: {type: string, description: "The chart account the charge credits; 4060 by default."}
        updated_by: {type: [string, "null"]}
        updated_at: {type: string, format: date-time}
    ArFinanceChargeItem:
      type: object
      required: [id, run_id, customer_id, customer_name, currency, overdue_cents, charge_cents, invoice_id, invoice_number, journal_entry_id, created_at]
      properties:
        id: {type: string, format: uuid}
        run_id: {type: string, format: uuid}
        customer_id: {type: string, format: uuid}
        customer_name: {type: string}
        currency: {type: string}
        overdue_cents: {type: integer, format: int64, description: "The basis the charge was taken on."}
        charge_cents: {type: integer, format: int64}
        invoice_id: {type: [string, "null"], format: uuid, description: "null on a dry run's preview."}
        invoice_number: {type: [string, "null"]}
        journal_entry_id: {type: [string, "null"], format: uuid, description: "null on a dry run's preview."}
        created_at: {type: string, format: date-time}
    ArFinanceChargeRun:
      type: object
      required: [id, as_of_date, rate_bps, grace_days, min_charge_cents, status, total_charged_cents, customer_count, triggered_by, created_at, completed_at]
      properties:
        id: {type: string, format: uuid}
        as_of_date: {type: string, format: date}
        rate_bps: {type: integer, format: int64}
        grace_days: {type: integer}
        min_charge_cents: {type: integer, format: int64}
        status: {type: string, enum: [running, completed, failed, dry_run]}
        total_charged_cents: {type: integer, format: int64}
        customer_count: {type: integer}
        triggered_by: {type: [string, "null"]}
        created_at: {type: string, format: date-time}
        completed_at: {type: [string, "null"], format: date-time, description: "null on a dry run: a preview never completes."}
        items:
          type: array
          description: "On the by-id read and the run answer; the list read carries none."
          items: {$ref: "#/components/schemas/ArFinanceChargeItem"}
    ArFinanceChargeRunPage:
      type: object
      required: [items, next_cursor, limit]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/ArFinanceChargeRun"}
        next_cursor: {type: [string, "null"]}
        limit: {type: integer}
        total: {type: integer, description: "Only under include=total."}
