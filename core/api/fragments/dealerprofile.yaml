#
# The dealer profile (item M3): the one dealer wide profile every printed form
# shows, on the contract from birth. A single row (migration 114), read by
# every role that prints and written by admin and owner only, each write with
# an audit row holding the before and after.
paths:
  /api/v1/dealer-profile:
    get:
      operationId: dealerProfileGet
      tags: [dealer-profile]
      summary: Read the dealer profile
      description: >-
        The profile every printed form shows. Role gated admin, owner, sales,
        finance and purchasing. The ETag is the profile's revision.
      security:
        - BearerJWT: []
      responses:
        "200":
          description: The dealer profile.
          headers:
            ETag:
              description: The profile's revision.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DealerProfile"
        "400":
          $ref: "#/components/responses/WireBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/WireInternalError"
    put:
      operationId: dealerProfilePut
      tags: [dealer-profile]
      summary: Replace the dealer profile
      description: >-
        Replaces the writable fields (the logo has its own route; a locale left
        out keeps the stored one). Role gated
        admin and owner. The revision precondition applies: If-Match or the
        body revision, 428 without either, 409 stale_revision when stale. A
        branch bound machine key is refused. The write is audited with the
        before and after in one transaction.
      security:
        - BearerJWT: []
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DealerProfileRequest"
      responses:
        "200":
          description: The saved profile.
          headers:
            ETag:
              description: The new revision.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DealerProfile"
        "400":
          $ref: "#/components/responses/WireBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/WireConflict"
        "428":
          $ref: "#/components/responses/WirePreconditionRequired"
        "500":
          $ref: "#/components/responses/WireInternalError"
  /api/v1/dealer-profile/locale:
    get:
      operationId: dealerProfileLocaleGet
      tags: [dealer-profile]
      summary: Read the dealer's locale alone
      description: >-
        The locale alone, {"locale": "en-CA"}: every signed in desk person may
        call it (the profile read itself is held to the roles that print), so
        every page can format its dates for the dealer's locale.
      security:
        - BearerJWT: []
      responses:
        "200":
          description: The dealer's locale.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DealerProfileLocale"
        "400":
          $ref: "#/components/responses/WireBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/WireInternalError"
  /api/v1/dealer-profile/logo:
    get:
      operationId: dealerProfileLogoGet
      tags: [dealer-profile]
      summary: Read the dealer logo
      description: The uploaded image, with the content type it was uploaded under. A 404 when none is set.
      security:
        - BearerJWT: []
      responses:
        "200":
          description: The logo image.
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/WireBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/WireNotFound"
        "500":
          $ref: "#/components/responses/WireInternalError"
    put:
      operationId: dealerProfileLogoPut
      tags: [dealer-profile]
      summary: Upload the dealer logo
      description: >-
        The image is the raw request body, PNG or JPEG, at most 524288 bytes,
        and its bytes must decode as the type the Content-Type names. Role
        gated admin and owner; the revision precondition applies as on the
        profile; a branch bound machine key is refused. The audit row holds
        the image's size and digest, never its bytes.
      security:
        - BearerJWT: []
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          image/png:
            schema:
              type: string
              format: binary
          image/jpeg:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: The profile with its logo set.
          headers:
            ETag:
              description: The new revision.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DealerProfile"
        "400":
          $ref: "#/components/responses/WireBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/WireConflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          description: The Content-Type is not image/png or image/jpeg (the ADR 0001 error envelope).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WireError"
        "428":
          $ref: "#/components/responses/WirePreconditionRequired"
        "500":
          $ref: "#/components/responses/WireInternalError"
components:
  schemas:
    DealerProfileLocale:
      type: object
      required: [locale]
      properties:
        locale:
          type: string
          description: The dealer's locale (a BCP 47 tag).
    DealerProfile:
      type: object
      required: [legal_name, trading_name, phone, email, website, remit_to, locale, logo_url, revision, updated_at]
      properties:
        legal_name:
          type: string
        trading_name:
          type: string
        phone:
          type: string
        email:
          type: string
        website:
          type: string
        remit_to:
          type: string
          description: The address payments are sent to; invoices and statements print it.
        locale:
          type: string
          description: The dealer's locale (a BCP 47 tag, default en-US); every date the app shows is formatted for it.
        logo_url:
          type: [string, "null"]
          description: /api/v1/dealer-profile/logo when a logo is set, otherwise null.
        revision:
          type: integer
          format: int64
          minimum: 1
        updated_at:
          type: string
          format: date-time
    DealerProfileRequest:
      type: object
      required: [legal_name]
      properties:
        legal_name:
          type: string
          maxLength: 200
        trading_name:
          type: string
          maxLength: 200
        phone:
          type: string
          maxLength: 50
        email:
          type: string
        website:
          type: string
          description: An http or https address, or empty.
        remit_to:
          type: string
          maxLength: 1000
        locale:
          type: string
          maxLength: 35
          description: A BCP 47 tag (en-US, en-CA), refused in words otherwise. Leave it out to keep the stored one.
        revision:
          type: integer
          format: int64
          description: The precondition, beside If-Match.
