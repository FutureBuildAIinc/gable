#
# The product module and the PIM detail on the wire contract (item C3-1, ADR
# 0001 and ADR 0006 sections 6 and 7.1): the list envelope, stock_uom beside
# the scaled base price (base_price_ten_thousandths), quantities as decimal
# strings, the stock totals on_hand, allocated and available in the stocking
# unit, and a revision every write names. The PIM content, media and
# generation routes below keep their own shapes until a later item converts
# them; the PIM detail embeds the product wire.
paths:
  /api/v1/products:
    get:
      operationId: productList
      tags: [product]
      summary: List products
      description: >-
        The keyset envelope of ADR 0001 section 1, ordered created_at DESC,
        id DESC. Money is integer scaled; quantities are decimal strings.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/Include'
      responses:
        '200':
          description: The page of products.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'
        '400':
          $ref: '#/components/responses/BadRequestEither'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: productCreate
      tags: [product]
      summary: Create a product
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCreate'
      responses:
        '201':
          description: The created product, revision 1, with its ETag and Location.
          headers:
            Location:
              schema:
                type: string
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductView'
        '400':
          $ref: '#/components/responses/BadRequestEither'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/products/reorder-alerts:
    get:
      operationId: productReorderAlerts
      tags: [product]
      summary: List products below their reorder point
      description: >-
        The envelope; quantities are decimal strings. The rows carry the
        deficit only.
      responses:
        '200':
          description: The alerts envelope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReorderAlertList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/products/{id}:
    get:
      operationId: productGet
      tags: [product]
      summary: Get one product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The product, with its revision ETag.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductView'
        '400':
          $ref: '#/components/responses/WireBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/WireNotFound'
  /api/v1/products/{id}/detail:
    get:
      operationId: productDetail
      tags:
      - product
      summary: Get product detail
      description: The PIM aggregate; the product summary is the converted product wire.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: The PIM aggregate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDetail'
        '400':
          $ref: '#/components/responses/WireBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/WireNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/products/{id}/pim/content:
    get:
      operationId: productPimContentGet
      tags:
      - product
      summary: Get PIM content for a product
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/XBranchId'
      responses:
        '200':
          description: PIM content; an empty record (zero id, empty text, no keywords) when the product
            has none yet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PimContent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenEither'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      operationId: productPimContentUpdate
      tags:
      - product
      summary: Update PIM content for a product
      description: Only the fields present in the body are changed.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/XBranchId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PimContentUpdate'
      responses:
        '200':
          description: The merged PIM content.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PimContent'
        '400':
          $ref: '#/components/responses/BadRequestEither'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenEither'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/products/{id}/pim/media:
    get:
      operationId: productPimMediaList
      tags:
      - product
      summary: List PIM media for a product
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/XBranchId'
      responses:
        '200':
          description: Media; an empty array when none.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PimMedia'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenEither'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/products/{id}/pim/media/{mediaId}:
    delete:
      operationId: productPimMediaDelete
      tags:
      - product
      summary: Delete PIM media
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: mediaId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/XBranchId'
      responses:
        '204':
          description: Media deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenEither'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/products/{id}/pim/media/{mediaId}/primary:
    patch:
      operationId: productPimMediaSetPrimary
      tags:
      - product
      summary: Set primary PIM media
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: mediaId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/XBranchId'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Primary media set; the body is empty.
        '400':
          $ref: '#/components/responses/BadRequestEither'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenEither'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/products/{id}/pim/collateral:
    get:
      operationId: productPimCollateralList
      tags:
      - product
      summary: List PIM collateral for a product
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/XBranchId'
      responses:
        '200':
          description: Collateral; an empty array when none.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PimCollateral'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenEither'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/products/{id}/pim/collateral/{collateralId}:
    delete:
      operationId: productPimCollateralDelete
      tags:
      - product
      summary: Delete PIM collateral
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: collateralId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/XBranchId'
      responses:
        '204':
          description: Collateral deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenEither'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/products/{id}/pim/generate/collateral:
    post:
      operationId: productPimGenerateCollateral
      tags:
      - product
      summary: Generate PIM collateral
      description: Answers 500 when no AI client is configured.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/XBranchId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PimGenerateCollateralRequest'
      responses:
        '200':
          description: The generated collateral, already stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PimCollateral'
        '400':
          $ref: '#/components/responses/BadRequestEither'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenEither'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/products/{id}/pim/generate/descriptions:
    post:
      operationId: productPimGenerateDescriptions
      tags:
      - product
      summary: Generate PIM descriptions
      description: Answers 500 when no AI client is configured.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/XBranchId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PimGenerateDescriptionsRequest'
      responses:
        '200':
          description: The PIM content with the generated descriptions and attributes, already stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PimContent'
        '400':
          $ref: '#/components/responses/BadRequestEither'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenEither'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/products/{id}/pim/generate/image:
    post:
      operationId: productPimGenerateImage
      tags:
      - product
      summary: Generate PIM image
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/XBranchId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PimGenerateImageRequest'
      responses:
        '202':
          description: Generation runs in the background; the placeholder media row (status generating)
            is returned for polling the media list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PimMedia'
        '400':
          $ref: '#/components/responses/BadRequestEither'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenEither'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/products/{id}/pim/generate/seo:
    post:
      operationId: productPimGenerateSeo
      tags:
      - product
      summary: Generate PIM SEO content
      description: Answers 500 when no AI client is configured.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/XBranchId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PimGenerateSeoRequest'
      responses:
        '200':
          description: The PIM content with the generated SEO fields, already stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PimContent'
        '400':
          $ref: '#/components/responses/BadRequestEither'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenEither'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/products/{id}/margins:
    patch:
      operationId: productUpdateMargins
      tags: [product]
      summary: Update the margin rules
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: If-Match
          in: header
          required: false
          schema:
            type: string
          description: The quoted revision; required unless the body carries it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductMarginUpdate'
      responses:
        '200':
          description: The product with the new revision and its ETag.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductView'
        '400':
          $ref: '#/components/responses/BadRequestEither'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/WireNotFound'
        '409':
          $ref: '#/components/responses/WireConflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '428':
          $ref: '#/components/responses/WirePreconditionRequired'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/products/{id}/dimensions:
    patch:
      operationId: productUpdateDimensions
      tags: [product]
      summary: Write the parametric geometry
      description: >-
        Every geometry field is a pointer: a null clears the column to SQL
        NULL ("not recorded"), a real zero is a measurement.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: If-Match
          in: header
          required: false
          schema:
            type: string
          description: The quoted revision; required unless the body carries it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductDimensionsUpdate'
      responses:
        '200':
          description: The product with the persisted geometry, the new revision and its ETag.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductView'
        '400':
          $ref: '#/components/responses/BadRequestEither'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/WireNotFound'
        '409':
          $ref: '#/components/responses/WireConflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '428':
          $ref: '#/components/responses/WirePreconditionRequired'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/products/{id}/lead-time:
    patch:
      operationId: productUpdateLeadTime
      tags: [product]
      summary: Publish or clear the lead time
      description: >-
        lead_time_days null is "unpublished", a different fact than zero
        ("available today").
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: If-Match
          in: header
          required: false
          schema:
            type: string
          description: The quoted revision; required unless the body carries it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductLeadTimeUpdate'
      responses:
        '200':
          description: The product with the new revision and its ETag.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductView'
        '400':
          $ref: '#/components/responses/BadRequestEither'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/WireNotFound'
        '409':
          $ref: '#/components/responses/WireConflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '428':
          $ref: '#/components/responses/WirePreconditionRequired'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/products/{id}/units:
    get:
      operationId: productUnitSetGet
      tags: [product]
      summary: Read a product's unit set
      description: >-
        The set, the four defaults, the board measure facts the derivations
        read and the product's revision.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The unit set.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnitSetDoc'
        '400':
          $ref: '#/components/responses/BadRequestEither'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      operationId: productUnitSetPut
      tags: [product]
      summary: Replace a product's unit set
      description: >-
        The whole set and the four default columns in one transaction at the
        product's revision. The derivations of ADR 0006 section 3.2 complete
        rows that arrive without a pair; the stocking unit holds of section
        3.2 refuse their cases with 409 blockers (stock_unit_in_use,
        unit_in_use, price_unit_held); until C3-2B the price unit is the
        stocking unit (a PUT naming another is a 400 naming price_uom). The
        answer carries the completed set and the warnings.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: If-Match
          in: header
          description: The revision precondition, beside the body revision.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnitSetPut'
      responses:
        '200':
          description: The completed set with the new revision and its ETag.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnitSetDoc'
        '400':
          $ref: '#/components/responses/BadRequestEither'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '428':
          $ref: '#/components/responses/WirePreconditionRequired'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/products/{id}/kit-components:
    get:
      operationId: productKitComponentsGet
      tags: [product]
      summary: A kit's component list
      description: >-
        The kit's definition (ADR 0005 section 2.6): what it contains, per one
        kit, in each component's own stocking unit.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/XBranchId"
      responses:
        "200":
          description: The component list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KitComponentList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: productKitComponentsPut
      tags: [product]
      summary: Replace a kit's component list
      description: >-
        Replaces the whole list in one transaction at the product's revision
        (If-Match or the body revision, as every write): the delete, the
        inserts and the is_kit update with the revision bump are one database
        act, with the audit row and a product.updated event (parts
        kit_components) in the same transaction, so a fault partway leaves
        the kit unchanged. A product with a non empty list becomes a kit
        (is_kit); an empty list clears the definition. A kit cannot contain a
        kit, cannot contain itself and lists a component once.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/XBranchId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: If-Match
          in: header
          required: false
          schema:
            type: string
          description: The quoted product revision; required unless the body carries it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [components]
              properties:
                revision:
                  type: integer
                  format: int64
                  description: The product revision this write builds on (If-Match carries it too; the write needs one of them).
                components:
                  type: array
                  items:
                    type: object
                    required: [component_product_id, quantity]
                    properties:
                      component_product_id:
                        type: string
                        format: uuid
                      quantity:
                        type: string
                        description: Per one kit, in the component's stocking unit; a decimal string greater than zero.
      responses:
        "200":
          description: The replaced component list, with the product's new revision and its ETag.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KitComponentList"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/WireConflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "428":
          $ref: "#/components/responses/WirePreconditionRequired"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  schemas:
    KitComponent:
      type: object
      required: [component_product_id, sku, description, quantity, uom, position]
      properties:
        component_product_id:
          type: string
          format: uuid
        sku:
          type: string
        description:
          type: string
        quantity:
          type: string
          description: Per one kit, in the component's stocking unit.
        uom:
          type: string
        position:
          type: integer
    KitComponentList:
      type: object
      required: [kit_product_id, components, revision]
      properties:
        kit_product_id:
          type: string
          format: uuid
        components:
          type: array
          items:
            $ref: "#/components/schemas/KitComponent"
        revision:
          type: integer
          format: int64
          description: The product's current revision; send it (or If-Match) on the next write.
    UnitSetRow:
      type: object
      description: >-
        One row of a product's unit set: unit_qty of the row's unit is
        stock_qty of the product's stocking unit, canonical (ADR 0006 R2).
      required: [uom, unit_qty, stock_qty, sell, purchase, price]
      properties:
        uom:
          $ref: '#/components/schemas/UOM'
        unit_qty:
          $ref: '#/components/schemas/Quantity'
        stock_qty:
          $ref: '#/components/schemas/Quantity'
        sell:
          type: boolean
        purchase:
          type: boolean
        price:
          type: boolean
    UnitSetDoc:
      type: object
      description: >-
        GET /products/{id}/units and the PUT's answer: the set, the four
        defaults, the board measure facts the derivations read, the base
        price the hold guards, and the PUT's warnings (empty on a read, an
        array always present).
      required: [product_id, stock_uom, sale_uom, price_uom, purchase_uom,
        base_price_ten_thousandths, board_thickness_in, board_width_in,
        board_length_ft, random_length, units, warnings, revision]
      properties:
        product_id:
          type: string
          format: uuid
        stock_uom:
          $ref: '#/components/schemas/UOM'
        sale_uom:
          $ref: '#/components/schemas/UOM'
        price_uom:
          $ref: '#/components/schemas/UOM'
        purchase_uom:
          $ref: '#/components/schemas/UOM'
        base_price_ten_thousandths:
          type: integer
          format: int64
        board_thickness_in:
          oneOf:
            - $ref: '#/components/schemas/Quantity'
            - type: "null"
        board_width_in:
          oneOf:
            - $ref: '#/components/schemas/Quantity'
            - type: "null"
        board_length_ft:
          oneOf:
            - $ref: '#/components/schemas/Quantity'
            - type: "null"
        random_length:
          type: boolean
        units:
          type: array
          items:
            $ref: '#/components/schemas/UnitSetRow'
        warnings:
          type: array
          description: >-
            One entry per sell row whose unit does not convert exactly into
            the stocking unit, naming the finer stocking unit that would make
            every sell row exact (the 6x9 paver stocked in PCS and sold by
            SF). The warning does not refuse.
          items:
            type: object
            required: [field, message]
            properties:
              field:
                type: string
              message:
                type: string
        revision:
          type: integer
          format: int64
    UnitSetPut:
      type: object
      required: [revision, stock_uom, sale_uom, price_uom, purchase_uom, units]
      description: >-
        The body of PUT /products/{id}/units: it replaces the whole set and
        the four default columns at the product's revision. A row may omit
        its pair (the derivations of ADR 0006 section 3.2 fill it); a sent
        pair is stored canonically and must agree with every derivation that
        applies. base_price_ten_thousandths simply sets the base price while
        the price unit cannot leave the stocking unit. A field the PUT
        cannot apply (the board measure columns) is a 400 naming it.
      properties:
        revision:
          type: integer
          format: int64
          minimum: 1
        stock_uom:
          $ref: '#/components/schemas/UOM'
        sale_uom:
          $ref: '#/components/schemas/UOM'
        price_uom:
          $ref: '#/components/schemas/UOM'
        purchase_uom:
          $ref: '#/components/schemas/UOM'
        base_price_ten_thousandths:
          type: integer
          format: int64
          minimum: 0
        units:
          type: array
          items:
            $ref: '#/components/schemas/UnitSetRowPut'
    UnitSetRowPut:
      type: object
      required: [uom]
      properties:
        uom:
          $ref: '#/components/schemas/UOM'
        unit_qty:
          $ref: '#/components/schemas/Quantity'
        stock_qty:
          $ref: '#/components/schemas/Quantity'
        sell:
          type: boolean
        purchase:
          type: boolean
        price:
          type: boolean
    UOM:
      type: string
      pattern: '^[A-Z]{1,6}$'
      description: A unit code of the catalogue (the closed enum is gone; ADR 0006 section 2).
    ProductView:
      type: object
      description: >-
        The product on the wire (ADR 0006 sections 6 and 7.1): stock_uom,
        the scaled base price, quantities as decimal strings, and the stock
        totals in the stocking unit.
      required: [id, sku, description, stock_uom, base_price_ten_thousandths,
        average_unit_cost_ten_thousandths, target_margin, commission_rate,
        vendor, vendor_id, upc, weight_lbs, length_in, width_in, height_in,
        stackable, geometry_source, lead_time_days, reorder_point,
        reorder_qty, on_hand, allocated, available, revision, created_at,
        updated_at, sale_uom, price_uom, purchase_uom, board_thickness_in,
        board_width_in, board_length_ft, random_length, units]
      properties:
        id:
          type: string
          format: uuid
        sku:
          type: string
        description:
          type: string
        stock_uom:
          $ref: '#/components/schemas/UOM'
        base_price_ten_thousandths:
          type: integer
          format: int64
          description: The base price per stocking unit at scale 4.
        average_unit_cost_ten_thousandths:
          type: integer
          format: int64
        target_margin:
          type: number
        commission_rate:
          type: number
        vendor:
          type: [string, "null"]
        vendor_id:
          type: [string, "null"]
          format: uuid
        upc:
          type: [string, "null"]
        weight_lbs:
          type: number
        length_in:
          type: [number, "null"]
        width_in:
          type: [number, "null"]
        height_in:
          type: [number, "null"]
        stackable:
          type: [boolean, "null"]
        geometry_source:
          type: [string, "null"]
        lead_time_days:
          type: [integer, "null"]
        reorder_point:
          type: string
          description: A decimal string at scale 4.
        reorder_qty:
          type: string
        on_hand:
          type: string
          description: The stocking unit total of quantity.
        allocated:
          type: string
        available:
          type: string
          description: on_hand less allocated.
        revision:
          type: integer
          format: int64
        sale_uom:
          $ref: '#/components/schemas/UOM'
        price_uom:
          $ref: '#/components/schemas/UOM'
          description: The unit the base price is per; the stocking unit until C3-2B.
        purchase_uom:
          $ref: '#/components/schemas/UOM'
        board_thickness_in:
          description: The nominal cross section of a board measure product (a 2x4 is 2), decimal string on the wire.
          oneOf:
            - $ref: '#/components/schemas/Quantity'
            - type: "null"
        board_width_in:
          oneOf:
            - $ref: '#/components/schemas/Quantity'
            - type: "null"
        board_length_ft:
          description: The nominal length of a fixed length piece (a 2x4x8 is 8); null for random length.
          oneOf:
            - $ref: '#/components/schemas/Quantity'
            - type: "null"
        random_length:
          type: boolean
          description: The product is sold by tally (ADR 0006 section 4); requires LF stocking.
        units:
          type: array
          description: The product's unit set (ADR 0006 sections 3.1 and 3.2).
          items:
            $ref: '#/components/schemas/UnitSetRow'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ProductCreate:
      type: object
      required: [sku, description, stock_uom]
      properties:
        sku:
          type: string
        description:
          type: string
        stock_uom:
          $ref: '#/components/schemas/UOM'
        base_price_ten_thousandths:
          type: integer
          format: int64
        vendor:
          type: [string, "null"]
        vendor_id:
          type: [string, "null"]
          format: uuid
        upc:
          type: [string, "null"]
        weight_lbs:
          type: number
        length_in:
          type: [number, "null"]
        width_in:
          type: [number, "null"]
        height_in:
          type: [number, "null"]
        stackable:
          type: [boolean, "null"]
        geometry_source:
          type: [string, "null"]
        reorder_point:
          type: string
        reorder_qty:
          type: string
        board_thickness_in:
          type: [number, "null"]
          description: The nominal cross section (a 2x4 is 2 and 4); both halves or neither.
        board_width_in:
          type: [number, "null"]
        board_length_ft:
          type: [number, "null"]
          description: The nominal length of a fixed length piece; null for random length.
        random_length:
          type: boolean
          description: The product is sold by tally; it stocks in LF and carries no fixed length.
    ProductPage:
      type: object
      required: [items, next_cursor, limit]
      description: The list envelope of ADR 0001 section 1. items is never null; total is present only under include=total.
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProductView'
        next_cursor:
          type: [string, "null"]
        limit:
          type: integer
        total:
          type: integer
          format: int64
    Geometry:
      type: object
      description: >-
        The mutable parametric geometry slice; every field is always present
        and nullable on purpose (nil means not recorded, zero is a recorded
        zero).
      required: [length_in, width_in, height_in, stackable, geometry_source]
      properties:
        length_in:
          type: [number, "null"]
        width_in:
          type: [number, "null"]
        height_in:
          type: [number, "null"]
        stackable:
          type: [boolean, "null"]
        geometry_source:
          type: [string, "null"]
    ReorderAlert:
      type: object
      required: [product_id, sku, description, vendor, vendor_id,
        reorder_point, reorder_qty, current_stock, deficit]
      properties:
        product_id:
          type: string
          format: uuid
        sku:
          type: string
        description:
          type: string
        vendor:
          type: [string, "null"]
        vendor_id:
          type: [string, "null"]
          format: uuid
        reorder_point:
          type: string
        reorder_qty:
          type: string
        current_stock:
          type: string
        deficit:
          type: string
    ReorderAlertList:
      type: object
      required: [items, next_cursor, limit]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ReorderAlert'
        next_cursor:
          type: [string, "null"]
        limit:
          type: integer
    ProductMarginUpdate:
      type: object
      properties:
        target_margin:
          type: number
        commission_rate:
          type: number
        revision:
          type: integer
          format: int64
    ProductDimensionsUpdate:
      type: object
      properties:
        length_in:
          type: [number, "null"]
        width_in:
          type: [number, "null"]
        height_in:
          type: [number, "null"]
        stackable:
          type: [boolean, "null"]
        geometry_source:
          type: [string, "null"]
        revision:
          type: integer
          format: int64
    ProductLeadTimeUpdate:
      type: object
      properties:
        lead_time_days:
          type: [integer, "null"]
        revision:
          type: integer
          format: int64
    PimContent:
      type: object
      description: pim.PIMContent. The handler always sends all fifteen fields. A product with no content
        yet answers a record with a zero id and zero timestamps.
      required:
      - id
      - product_id
      - short_description
      - long_description
      - marketing_copy
      - attributes
      - seo_title
      - seo_description
      - seo_keywords
      - seo_slug
      - last_gen_model
      - last_gen_prompt
      - last_gen_at
      - created_at
      - updated_at
      properties:
        id:
          type: string
          format: uuid
        product_id:
          type: string
          format: uuid
        short_description:
          type: string
        long_description:
          type: string
        marketing_copy:
          type: string
        attributes:
          type:
          - object
          - 'null'
          additionalProperties:
            type: string
        seo_title:
          type: string
        seo_description:
          type: string
        seo_keywords:
          type:
          - array
          - 'null'
          items:
            type: string
        seo_slug:
          type: string
        last_gen_model:
          type: string
        last_gen_prompt:
          type: string
        last_gen_at:
          type:
          - string
          - 'null'
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PimMedia:
      type: object
      description: pim.PIMMedia.
      required:
      - id
      - product_id
      - media_type
      - url
      - alt_text
      - sort_order
      - is_primary
      - status
      - gen_model
      - gen_prompt
      - gen_style
      - generated_at
      - created_at
      - updated_at
      properties:
        id:
          type: string
          format: uuid
        product_id:
          type: string
          format: uuid
        media_type:
          type: string
          description: hero for generated images.
        url:
          type: string
        alt_text:
          type: string
        sort_order:
          type: integer
        is_primary:
          type: boolean
        status:
          type: string
          enum:
          - generating
          - ready
          - failed
        gen_model:
          type: string
        gen_prompt:
          type: string
        gen_style:
          type: string
        generated_at:
          type:
          - string
          - 'null'
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PimCollateral:
      type: object
      description: pim.PIMCollateral.
      required:
      - id
      - product_id
      - collateral_type
      - title
      - content
      - tone
      - audience
      - gen_model
      - gen_prompt
      - generated_at
      - created_at
      - updated_at
      properties:
        id:
          type: string
          format: uuid
        product_id:
          type: string
          format: uuid
        collateral_type:
          type: string
          description: sell_sheet, facebook, instagram, linkedin or email_blast; anything else generates
            a generic piece.
        title:
          type: string
        content:
          type: string
        tone:
          type: string
        audience:
          type: string
        gen_model:
          type: string
        gen_prompt:
          type: string
        generated_at:
          type:
          - string
          - 'null'
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ProductDetail:
      type: object
      description: >-
        The PIM aggregate. The product summary is the converted product wire
        (ADR 0006 7.1); content is null when the product has none.
      required: [product, content, media, collateral]
      properties:
        product:
          $ref: '#/components/schemas/ProductView'
        content:
          type: [object, "null"]
        media:
          type: array
          items:
            type: object
        collateral:
          type: array
          items:
            type: object
    PimContentUpdate:
      type: object
      description: 'UpdateContentRequest: every field optional, absent means unchanged.'
      properties:
        short_description:
          type: string
        long_description:
          type: string
        marketing_copy:
          type: string
        attributes:
          type: object
          additionalProperties:
            type: string
        seo_title:
          type: string
        seo_description:
          type: string
        seo_keywords:
          type: array
          items:
            type: string
        seo_slug:
          type: string
    PimGenerateDescriptionsRequest:
      type: object
      properties:
        tone:
          type: string
          description: Defaults to professional.
        audience:
          type: string
          description: Defaults to contractors and builders.
    PimGenerateSeoRequest:
      type: object
      properties:
        target_keywords:
          type: array
          items:
            type: string
    PimGenerateImageRequest:
      type: object
      properties:
        style:
          type: string
        prompt:
          type: string
    PimGenerateCollateralRequest:
      type: object
      properties:
        type:
          type: string
          description: sell_sheet, facebook, instagram, linkedin or email_blast; anything else generates
            a generic piece.
        tone:
          type: string
        audience:
          type: string
