#
# The product module and the PIM detail on the wire contract (item C3-1, ADR
# 0001 and ADR 0006 sections 6 and 7.1): the list envelope, stock_uom beside
# the scaled base price (base_price_ten_thousandths), quantities as decimal
# strings, the stock totals on_hand, allocated and available in the stocking
# unit, and a revision every write names. The PIM content, media and
# generation routes below keep their own shapes until a later item converts
# them; the PIM detail embeds the product wire.
paths:
  /api/v1/products:
    get:
      operationId: productList
      tags: [product]
      summary: List products
      description: >-
        The keyset envelope of ADR 0001 section 1, ordered created_at DESC,
        id DESC. Money is integer scaled; quantities are decimal strings.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/Include'
      responses:
        '200':
          description: The page of products.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'
        '400':
          $ref: '#/components/responses/BadRequestEither'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: productCreate
      tags: [product]
      summary: Create a product
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCreate'
      responses:
        '201':
          description: The created product, revision 1, with its ETag and Location.
          headers:
            Location:
              schema:
                type: string
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductView'
        '400':
          $ref: '#/components/responses/BadRequestEither'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/products/reorder-alerts:
    get:
      operationId: productReorderAlerts
      tags: [product]
      summary: List products below their reorder point
      description: >-
        The envelope; quantities are decimal strings. The rows carry the
        deficit only.
      responses:
        '200':
          description: The alerts envelope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReorderAlertList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/products/{id}:
    get:
      operationId: productGet
      tags: [product]
      summary: Get one product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The product, with its revision ETag.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductView'
        '400':
          $ref: '#/components/responses/WireBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/WireNotFound'
  /api/v1/products/{id}/detail:
    get:
      operationId: productDetail
      tags:
      - product
      summary: Get product detail
      description: The PIM aggregate; the product summary is the converted product wire.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: The PIM aggregate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDetail'
        '400':
          $ref: '#/components/responses/WireBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/WireNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/products/{id}/pim/content:
    get:
      operationId: productPimContentGet
      tags:
      - product
      summary: Get PIM content for a product
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/XBranchId'
      responses:
        '200':
          description: PIM content; an empty record (zero id, empty text, no keywords) when the product
            has none yet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PimContent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenEither'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      operationId: productPimContentUpdate
      tags:
      - product
      summary: Update PIM content for a product
      description: Only the fields present in the body are changed.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/XBranchId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PimContentUpdate'
      responses:
        '200':
          description: The merged PIM content.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PimContent'
        '400':
          $ref: '#/components/responses/BadRequestEither'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenEither'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/products/{id}/pim/media:
    get:
      operationId: productPimMediaList
      tags:
      - product
      summary: List PIM media for a product
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/XBranchId'
      responses:
        '200':
          description: Media; an empty array when none.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PimMedia'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenEither'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/products/{id}/pim/media/{mediaId}:
    delete:
      operationId: productPimMediaDelete
      tags:
      - product
      summary: Delete PIM media
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: mediaId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/XBranchId'
      responses:
        '204':
          description: Media deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenEither'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/products/{id}/pim/media/{mediaId}/primary:
    patch:
      operationId: productPimMediaSetPrimary
      tags:
      - product
      summary: Set primary PIM media
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: mediaId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/XBranchId'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Primary media set; the body is empty.
        '400':
          $ref: '#/components/responses/BadRequestEither'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenEither'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/products/{id}/pim/collateral:
    get:
      operationId: productPimCollateralList
      tags:
      - product
      summary: List PIM collateral for a product
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/XBranchId'
      responses:
        '200':
          description: Collateral; an empty array when none.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PimCollateral'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenEither'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/products/{id}/pim/collateral/{collateralId}:
    delete:
      operationId: productPimCollateralDelete
      tags:
      - product
      summary: Delete PIM collateral
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: collateralId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/XBranchId'
      responses:
        '204':
          description: Collateral deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenEither'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/products/{id}/pim/generate/collateral:
    post:
      operationId: productPimGenerateCollateral
      tags:
      - product
      summary: Generate PIM collateral
      description: Answers 500 when no AI client is configured.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/XBranchId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PimGenerateCollateralRequest'
      responses:
        '200':
          description: The generated collateral, already stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PimCollateral'
        '400':
          $ref: '#/components/responses/BadRequestEither'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenEither'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/products/{id}/pim/generate/descriptions:
    post:
      operationId: productPimGenerateDescriptions
      tags:
      - product
      summary: Generate PIM descriptions
      description: Answers 500 when no AI client is configured.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/XBranchId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PimGenerateDescriptionsRequest'
      responses:
        '200':
          description: The PIM content with the generated descriptions and attributes, already stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PimContent'
        '400':
          $ref: '#/components/responses/BadRequestEither'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenEither'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/products/{id}/pim/generate/image:
    post:
      operationId: productPimGenerateImage
      tags:
      - product
      summary: Generate PIM image
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/XBranchId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PimGenerateImageRequest'
      responses:
        '202':
          description: Generation runs in the background; the placeholder media row (status generating)
            is returned for polling the media list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PimMedia'
        '400':
          $ref: '#/components/responses/BadRequestEither'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenEither'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/products/{id}/pim/generate/seo:
    post:
      operationId: productPimGenerateSeo
      tags:
      - product
      summary: Generate PIM SEO content
      description: Answers 500 when no AI client is configured.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/XBranchId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PimGenerateSeoRequest'
      responses:
        '200':
          description: The PIM content with the generated SEO fields, already stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PimContent'
        '400':
          $ref: '#/components/responses/BadRequestEither'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenEither'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/products/{id}/margins:
    patch:
      operationId: productUpdateMargins
      tags: [product]
      summary: Update the margin rules
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: If-Match
          in: header
          required: false
          schema:
            type: string
          description: The quoted revision; required unless the body carries it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductMarginUpdate'
      responses:
        '200':
          description: The product with the new revision and its ETag.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductView'
        '400':
          $ref: '#/components/responses/BadRequestEither'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/WireNotFound'
        '409':
          $ref: '#/components/responses/WireConflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '428':
          $ref: '#/components/responses/WirePreconditionRequired'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/products/{id}/dimensions:
    patch:
      operationId: productUpdateDimensions
      tags: [product]
      summary: Write the parametric geometry
      description: >-
        Every geometry field is a pointer: a null clears the column to SQL
        NULL ("not recorded"), a real zero is a measurement.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: If-Match
          in: header
          required: false
          schema:
            type: string
          description: The quoted revision; required unless the body carries it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductDimensionsUpdate'
      responses:
        '200':
          description: The product with the persisted geometry, the new revision and its ETag.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductView'
        '400':
          $ref: '#/components/responses/BadRequestEither'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/WireNotFound'
        '409':
          $ref: '#/components/responses/WireConflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '428':
          $ref: '#/components/responses/WirePreconditionRequired'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/products/{id}/lead-time:
    patch:
      operationId: productUpdateLeadTime
      tags: [product]
      summary: Publish or clear the lead time
      description: >-
        lead_time_days null is "unpublished", a different fact than zero
        ("available today").
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: If-Match
          in: header
          required: false
          schema:
            type: string
          description: The quoted revision; required unless the body carries it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductLeadTimeUpdate'
      responses:
        '200':
          description: The product with the new revision and its ETag.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductView'
        '400':
          $ref: '#/components/responses/BadRequestEither'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/WireNotFound'
        '409':
          $ref: '#/components/responses/WireConflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '428':
          $ref: '#/components/responses/WirePreconditionRequired'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/products/{id}/kit-components:
    get:
      operationId: productKitComponentsGet
      tags: [product]
      summary: A kit's component list
      description: >-
        The kit's definition (ADR 0005 section 2.6): what it contains, per one
        kit, in each component's own stocking unit.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/XBranchId"
      responses:
        "200":
          description: The component list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KitComponentList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: productKitComponentsPut
      tags: [product]
      summary: Replace a kit's component list
      description: >-
        Replaces the whole list. A product with a non empty list becomes a kit
        (is_kit); an empty list clears the definition. A kit cannot contain a
        kit and cannot contain itself. Until the products module converts
        there is no product revision to precondition on: last write wins,
        as ADR 0005 section 2.6 states.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/XBranchId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [components]
              properties:
                components:
                  type: array
                  items:
                    type: object
                    required: [component_product_id, quantity]
                    properties:
                      component_product_id:
                        type: string
                        format: uuid
                      quantity:
                        type: string
                        description: Per one kit, in the component's stocking unit; a decimal string greater than zero.
      responses:
        "200":
          description: The replaced component list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KitComponentList"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  schemas:
    KitComponent:
      type: object
      required: [component_product_id, sku, description, quantity, uom, position]
      properties:
        component_product_id:
          type: string
          format: uuid
        sku:
          type: string
        description:
          type: string
        quantity:
          type: string
          description: Per one kit, in the component's stocking unit.
        uom:
          type: string
        position:
          type: integer
    KitComponentList:
      type: object
      required: [kit_product_id, components]
      properties:
        kit_product_id:
          type: string
          format: uuid
        components:
          type: array
          items:
            $ref: "#/components/schemas/KitComponent"
    UOM:
      type: string
      description: The database unit of measure vocabulary, verbatim.
      enum: [PCS, EA, LF, SF, BF, MBF, SQ, BOX, CTN, RL, GAL, LBS, BAG, BUNDLE, PAIR, SET]
    ProductView:
      type: object
      description: >-
        The product on the wire (ADR 0006 sections 6 and 7.1): stock_uom,
        the scaled base price, quantities as decimal strings, and the stock
        totals in the stocking unit.
      required: [id, sku, description, stock_uom, base_price_ten_thousandths,
        average_unit_cost_ten_thousandths, target_margin, commission_rate,
