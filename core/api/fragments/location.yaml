#
# The location module on the wire contract (item C3-1, ADR 0001 and ADR 0006
# section 7.2): one row shape for every node kind with a lowercase type, the
# list envelope, a revision every write names, and the branch wall on the
# by-id reads. The branch soft archives through the location delete. The user
# branch grant routes at the foot keep their own shapes until a later item.
paths:
  /api/v1/locations:
    get:
      operationId: locationList
      tags: [location]
      summary: List every location node
      description: >-
        The keyset envelope of ADR 0001 section 1, ordered created_at DESC,
        id DESC, behind the branch wall: a bound caller lists its branches'
        rows.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/Include"
      responses:
        "200":
          description: The page of locations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationPage"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalErrorEither"
    post:
      operationId: locationCreate
      tags: [location]
      summary: Create a location node
      description: The active flag defaults to true when the body does not mention it.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocationCreateRequest"
      responses:
        "201":
          description: The created location, revision 1, with its ETag and Location.
          headers:
            Location:
              schema:
                type: string
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Location"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalErrorEither"
  /api/v1/locations/{id}:
    get:
      operationId: locationGet
      tags: [location]
      summary: Get one location node
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The location, with its revision ETag.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Location"
        "400":
          $ref: "#/components/responses/WireBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/WireNotFound"
        "500":
          $ref: "#/components/responses/InternalErrorEither"
    put:
      operationId: locationUpdate
      tags: [location]
      summary: Update a location node
      description: Type and parent_id are not mutable; the write carries the revision.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: If-Match
          in: header
          required: false
          schema:
            type: string
          description: The quoted revision; required unless the body carries it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocationUpdate"
      responses:
        "200":
          description: The updated location with the new revision and its ETag.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Location"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/WireNotFound"
        "409":
          $ref: "#/components/responses/WireConflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "428":
          $ref: "#/components/responses/WirePreconditionRequired"
    delete:
      operationId: locationDelete
      tags: [location]
      summary: Soft archive a location node
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: If-Match
          in: header
          required: false
          schema:
            type: string
          description: The quoted revision; required unless a body revision carries it.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                revision:
                  type: integer
                  format: int64
      responses:
        "204":
          description: Archived (active set false).
        "400":
          $ref: "#/components/responses/WireBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/WireNotFound"
        "409":
          $ref: "#/components/responses/WireConflict"
        "428":
          $ref: "#/components/responses/WirePreconditionRequired"
        "500":
          $ref: "#/components/responses/InternalErrorEither"
  /api/v1/branches:
    get:
      operationId: branchList
      tags: [location]
      summary: List branches
      description: The keyset envelope, ordered created_at DESC, id DESC.
      parameters:
        - name: include_inactive
          in: query
          description: true includes archived branches.
          schema:
            type: string
            enum: ["true", "false"]
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/Include"
      responses:
        "200":
          description: The page of branches.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationPage"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalErrorEither"
    post:
      operationId: branchCreate
      tags: [location]
      summary: Create a branch
      description: >-
        Creates a location node with type branch and no parent; the type in
        the body, when sent, is overridden.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocationCreateRequest"
      responses:
        "201":
          description: The created branch, revision 1, with its ETag and Location.
          headers:
            Location:
              schema:
                type: string
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Location"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalErrorEither"
  /api/v1/branches/{id}:
    get:
      operationId: branchGet
      tags: [location]
      summary: Get one branch
      description: A node that exists but is not a branch is a 404.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The branch, with its revision ETag.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Location"
        "400":
          $ref: "#/components/responses/WireBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/WireNotFound"
        "500":
          $ref: "#/components/responses/InternalErrorEither"
    put:
      operationId: branchUpdate
      tags: [location]
      summary: Update a branch
      description: Reuses the location update; the type column is not mutable here.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: If-Match
          in: header
          required: false
          schema:
            type: string
          description: The quoted revision; required unless the body carries it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocationUpdate"
      responses:
        "200":
          description: The updated branch with the new revision and its ETag.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Location"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/WireNotFound"
        "409":
          $ref: "#/components/responses/WireConflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "428":
          $ref: "#/components/responses/WirePreconditionRequired"
    delete:
      operationId: branchDelete
      tags: [location]
      summary: Soft archive a branch
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: If-Match
          in: header
          required: false
          schema:
            type: string
          description: The quoted revision; required unless a body revision carries it.
      responses:
        "204":
          description: Archived (active set false).
        "400":
          $ref: "#/components/responses/WireBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/WireNotFound"
        "409":
          $ref: "#/components/responses/WireConflict"
        "428":
          $ref: "#/components/responses/WirePreconditionRequired"
        "500":
          $ref: "#/components/responses/InternalErrorEither"
  /api/v1/branches/{id}/tree:
    get:
      operationId: branchTree
      tags: [location]
      summary: Get a branch's location tree
      description: The branch's rows as the list envelope, ordered by path.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The tree's rows.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationPage"
        "400":
          $ref: "#/components/responses/WireBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalErrorEither"
  /api/v1/branches/{id}/users:
    get:
      operationId: branchListUsers
      tags: [location]
      summary: List the users granted to a branch
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The grants, a bare array that is null when none exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserLocationList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/me/branches:
    get:
      operationId: myBranches
      tags: [location]
      summary: List the caller's branches
      description: >-
        The caller's grants with the home flag. Without auth claims (dev
        mode) every active branch is returned with the first marked home.
      responses:
        "200":
          description: The branch summaries, a bare array that is null when none exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BranchSummaryList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/users:
    get:
      operationId: locationListKnownUsers
      tags: [location]
      summary: List known user subjects
      description: The union of distinct user subjects from grants and the audit log; feeds the admin user picker.
      responses:
        "200":
          description: The subject strings, a bare array that is null when none exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StringList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/users/{sub}/branches:
    get:
      operationId: userBranches
      tags: [location]
      summary: List a user's branch grants
      parameters:
        - name: sub
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The branch summaries, a bare array that is null when the user has none.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BranchSummaryList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: userGrantBranch
      tags: [location]
      summary: Grant a branch to a user
      parameters:
        - name: sub
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserBranchGrant"
      responses:
        "204":
          description: Granted.
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/users/{sub}/branches/{branch_id}:
    delete:
      operationId: userRevokeBranch
      tags: [location]
      summary: Revoke a user's branch grant
      parameters:
        - name: sub
          in: path
          required: true
          schema:
            type: string
        - name: branch_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Revoked.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/users/{sub}/home-branch:
    put:
      operationId: userSetHomeBranch
      tags: [location]
      summary: Set a user's home branch
      description: The user must already hold a grant on the branch.
      parameters:
        - name: sub
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HomeBranchSet"
      responses:
        "204":
          description: Set.
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  schemas:
    LocationType:
      type: string
      enum: [branch, zone, aisle, rack, shelf, bin, yard]
    Location:
      type: object
      description: >-
        A node of the hierarchy; the type is lowercase on the wire and the
        optional metadata is present with null (ADR 0001 sections 6 and 12).
      required: [id, parent_id, path, type, code, description, name, address,
        city, state, zip, phone, tax_jurisdiction_code, default_tax_rate,
        timezone, active, branch_id, revision, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        parent_id:
          type: [string, "null"]
          format: uuid
        path:
          type: string
        type:
          $ref: "#/components/schemas/LocationType"
        code:
          type: string
        description:
          type: [string, "null"]
        name:
          type: [string, "null"]
        address:
          type: [string, "null"]
        city:
          type: [string, "null"]
        state:
          type: [string, "null"]
        zip:
          type: [string, "null"]
        phone:
          type: [string, "null"]
        tax_jurisdiction_code:
          type: [string, "null"]
        default_tax_rate:
          type: [number, "null"]
        timezone:
          type: [string, "null"]
        active:
          type: boolean
        branch_id:
          type: [string, "null"]
          format: uuid
        revision:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    LocationPage:
      type: object
      required: [items, next_cursor, limit]
      description: The list envelope of ADR 0001 section 1.
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Location"
        next_cursor:
          type: [string, "null"]
        limit:
          type: integer
        total:
          type: integer
          format: int64
    LocationUpdate:
      type: object
      properties:
        path:
          type: string
        code:
          type: string
        description:
          type: [string, "null"]
        name:
          type: [string, "null"]
        address:
          type: [string, "null"]
        city:
          type: [string, "null"]
        state:
          type: [string, "null"]
        zip:
          type: [string, "null"]
        phone:
          type: [string, "null"]
        tax_jurisdiction_code:
          type: [string, "null"]
        default_tax_rate:
          type: [number, "null"]
        timezone:
          type: [string, "null"]
        active:
          type: boolean
        revision:
          type: integer
          format: int64
    LocationCreateRequest:
      type: object
      description: The location shape with the active flag told apart from an explicit false.
      required: [path, type, code]
      properties:
        parent_id:
          type: string
          format: uuid
        path:
          type: string
        type:
          $ref: "#/components/schemas/LocationType"
        code:
          type: string
        description:
          type: string
        name:
          type: string
        address:
          type: string
        city:
          type: string
        state:
          type: string
        zip:
          type: string
        phone:
          type: string
        tax_jurisdiction_code:
          type: string
        default_tax_rate:
          type: number
        timezone:
          type: string
        active:
          type: [boolean, "null"]
          description: Defaults to true when absent; an explicit false is honored.
    BranchSummary:
      type: object
      required: [id, code, name, active]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        active:
          type: boolean
        is_home:
          type: boolean
        timezone:
          type: string
    BranchSummaryList:
      type: [array, "null"]
      items:
        $ref: "#/components/schemas/BranchSummary"
    UserLocation:
      type: object
      required: [user_sub, branch_id, is_home, granted_at]
      properties:
        user_sub:
          type: string
        branch_id:
          type: string
          format: uuid
        is_home:
          type: boolean
        granted_at:
          type: string
          format: date-time
        granted_by:
          type: string
    UserLocationList:
      type: [array, "null"]
      items:
        $ref: "#/components/schemas/UserLocation"
    UserBranchGrant:
      type: object
      required: [branch_id, is_home]
      properties:
        branch_id:
          type: string
          format: uuid
        is_home:
          type: boolean
    HomeBranchSet:
      type: object
      required: [branch_id]
      properties:
        branch_id:
          type: string
          format: uuid
    StringList:
      type: [array, "null"]
      items:
        type: string
