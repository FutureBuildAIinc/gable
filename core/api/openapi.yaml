        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: The lumber index exposure gate blocks this order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExposureBlock"
        "500":
          $ref: "#/components/responses/InternalError"
