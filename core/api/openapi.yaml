        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      operationId: productUnitSetPut
      tags: [product]
      summary: Replace a product's unit set
      description: >-
        The whole set and the four default columns in one transaction at the product's revision. The derivations of ADR 0006 section 3.2 complete rows that arrive without a pair; the stocking unit holds of section 3.2 refuse their cases with 409 blockers (stock_unit_in_use, unit_in_use, price_unit_held); until C3-2B the price unit is the stocking unit (a PUT naming another is a 400 naming price_uom). The answer carries the completed set and the warnings.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: If-Match
          in: header
          description: The revision precondition, beside the body revision.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnitSetPut'
      responses:
        '200':
          description: The completed set with the new revision and its ETag.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnitSetDoc'
        '400':
          $ref: '#/components/responses/BadRequestEither'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '428':
          $ref: '#/components/responses/WirePreconditionRequired'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/products/{id}/kit-components:
    get:
      operationId: productKitComponentsGet
      tags: [product]
      summary: A kit's component list
      description: >-
        The kit's definition (ADR 0005 section 2.6): what it contains, per one kit, in each component's own stocking unit.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/XBranchId"
      responses:
        "200":
          description: The component list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KitComponentList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: productKitComponentsPut
      tags: [product]
      summary: Replace a kit's component list
      description: >-
        Replaces the whole list in one transaction at the product's revision (If-Match or the body revision, as every write): the delete, the inserts and the is_kit update with the revision bump are one database act, with the audit row and a product.updated event (parts kit_components) in the same transaction, so a fault partway leaves the kit unchanged. A product with a non empty list becomes a kit (is_kit); an empty list clears the definition. A kit cannot contain a kit, cannot contain itself and lists a component once.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/XBranchId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: If-Match
          in: header
          required: false
          schema:
            type: string
          description: The quoted product revision; required unless the body carries it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [components]
              properties:
                revision:
                  type: integer
                  format: int64
                  description: The product revision this write builds on (If-Match carries it too; the write needs one of them).
                components:
                  type: array
                  items:
                    type: object
                    required: [component_product_id, quantity]
                    properties:
                      component_product_id:
                        type: string
                        format: uuid
                      quantity:
                        type: string
                        description: Per one kit, in the component's stocking unit; a decimal string greater than zero.
      responses:
        "200":
          description: The replaced component list, with the product's new revision and its ETag.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KitComponentList"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/WireConflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "428":
          $ref: "#/components/responses/WirePreconditionRequired"
        "500":
          $ref: "#/components/responses/InternalError"
