    get:
      operationId: purchaseOrderFreightList
      tags: [purchaseOrder]
      summary: List freight charges of an order
      description: Roles admin, owner, purchasing. A bare array, never null.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/XBranchId"
      responses:
        "200":
          description: The freight charges, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PurchaseOrderFreightCharge"
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/InternalError"}
    post:
      operationId: purchaseOrderFreightUpload
      tags: [purchaseOrder]
      summary: Upload a freight invoice
      description: >-
