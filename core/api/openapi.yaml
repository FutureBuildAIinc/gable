          schema:
            type: string
        - name: category_id
          in: query
          description: "The tree filter: the category and every descendant of it."
          schema:
            type: string
            format: uuid
        - name: species
          in: query
          schema:
            type: string
        - name: grade
          in: query
          schema:
            type: string
      responses:
        "200":
          description: The products, a bare array, never null.
