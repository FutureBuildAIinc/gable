          enum: [PCS, EA, LF, SF, BF, MBF, SQ, BOX, CTN, RL, GAL, LBS, BAG, BUNDLE, PAIR, SET]
        unit_price:
          type: number
        unit_cost:
          type: number
        customer_note:
          type: string
    QuoteStateUpdate:
      type: object
      required: [state]
      properties:
        state:
          $ref: "#/components/schemas/QuoteState"
    QuoteOrderPayload:
      type: object
      required: [customer_id, quote_id, lines]
      description: What POST /api/v1/orders expects, except price_each here is float dollars while the order route expects cents.
      properties:
        customer_id:
          type: string
          format: uuid
        quote_id:
          type: string
          format: uuid
        lines:
          type: array
          items:
            type: object
            required: [product_id, quantity, price_each]
            properties:
              product_id:
                type: string
                format: uuid
              quantity:
                type: number
              price_each:
                type: number
                description: Float dollars.
    QuotePage:
      type: object
      required: [data, total, limit, offset]
      description: Today's offset page envelope; data is never null on this route (the handler substitutes an empty array).
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Quote"
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
    QuoteAnalytics:
      type: object
      required: [total_quotes, draft_count, sent_count, accepted_count, rejected_count, expired_count, conversion_rate, avg_margin_accepted, avg_margin_rejected, avg_days_to_close, total_quote_value, total_accepted_value, ai_sourced_count, ai_conversion_rate, manual_conversion_rate, trend_data]
      properties:
        total_quotes:
          type: integer
        draft_count:
          type: integer
        sent_count:
          type: integer
        accepted_count:
          type: integer
        rejected_count:
          type: integer
        expired_count:
          type: integer
        conversion_rate:
          type: number
        avg_margin_accepted:
          type: number
        avg_margin_rejected:
          type: number
        avg_days_to_close:
          type: number
        total_quote_value:
          type: number
        total_accepted_value:
          type: number
        ai_sourced_count:
          type: integer
        ai_conversion_rate:
          type: number
        manual_conversion_rate:
          type: number
        trend_data:
          type: array
          items:
            $ref: "#/components/schemas/QuoteAnalyticsTrend"
    QuoteAnalyticsTrend:
      type: object
      required: [date, created, accepted, rejected, total_value, accepted_value]
      properties:
        date:
          type: string
        created:
          type: integer
        accepted:
          type: integer
        rejected:
          type: integer
        total_value:
          type: number
        accepted_value:
          type: number

