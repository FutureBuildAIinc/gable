    LinkAnswer:
      type: object
      description: >-
        Who the record is, and every frontend's URL for it. The record segment in the links is the document number when the entity has one, otherwise the UUID; draft links use the draft's UUID. Optional slots are present as null (ADR 0001 section 12).
      required: [entity, module, id, number, links]
      properties:
        entity:
          type: string
          description: The entity name (quote, order, invoice, customer, product, draft).
        module:
          type: string
          description: The module, the path segment under /api/v1.
        id:
          type: string
          format: uuid
        number:
          type: string
          nullable: true
        links:
          type: object
          required: [desk, front_door, portal, app, agent]
          properties:
            desk:
              type: string
              description: >-
                The desk record route; absolute when GABLE_PUBLIC_URL is configured, otherwise a path relative to the deployment's origin.
            front_door:
              type: string
              description: The front door's /?open=<record path> form, which signs a person in and then opens the record.
            portal:
              type: string
              nullable: true
              description: Null until the portal has a record screen for the entity.
            app:
              type: string
              description: The gable:// deep link the Tauri shell parses.
            agent:
              type: string
              nullable: true
              description: >-
                The agent UI's record URL from GABLE_AGENT_URL_TEMPLATE ({module}, {entity}, {id}, {number} placeholders); null when the template is unset, every deployment today.
