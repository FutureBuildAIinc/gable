  /api/v1/pricing/calculate:
    get:
      operationId: pricingCalculate
      tags: [pricing]
      summary: Calculate a customer price for a product
      description: >-
        Guarded admin or owner. The price one line would carry (ADR 0006 section 7.3): the exact scale 4 unit price in the product's stocking unit, the conversion pair (1 and 1 until the unit sets of C3-2A), the extension rounded once to cents by the line extension rule, and the price basis in lowercase. customer_id and product_id are required UUIDs; a quantity that is not a positive decimal string at scale 4 or a job_id that is not a UUID is a 400 naming it. A missing customer or product is 404.
      parameters:
        - name: customer_id
          in: query
          required: true
          schema: {type: string, format: uuid}
        - name: product_id
          in: query
          required: true
          schema: {type: string, format: uuid}
        - name: quantity
          in: query
          required: false
          description: A positive decimal string at scale 4; default "1".
          schema: {type: string}
        - name: job_id
          in: query
          required: false
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: The calculated price.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PricingCalculatedPrice"
        "400":
          $ref: "#/components/responses/WireBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/WireNotFound"
        "500":
          $ref: "#/components/responses/InternalErrorEither"
  /api/v1/pricing/rules:
    get:
      operationId: pricingRuleList
      tags: [pricing]
      summary: List pricing rules
      description: >-
        Guarded admin or owner. The list envelope of ADR 0001 section 1, newest first (created_at DESC, id DESC); items is never null.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/Include"
      responses:
        "200":
          description: The page of rules.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PricingRulePage"
        "400":
          $ref: "#/components/responses/WireBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalErrorEither"
    post:
      operationId: pricingRuleCreate
      tags: [pricing]
      summary: Create a pricing rule
      description: >-
        Guarded admin or owner. Every field problem is collected into one 400 naming each field. A rule carries a fixed price, a discount or a markup. Prices are integers at scale 4 (fixed_price_ten_thousandths); percentages and quantities are decimal strings. The response is 201 with Location and the revision ETag.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PricingRuleCreateRequest"
      responses:
        "201":
          description: The created rule at revision 1.
          headers:
            Location:
              description: The rule's URL.
              schema:
                type: string
            ETag:
              description: The rule revision in quotes, for example "3". Send it back as If-Match.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PricingRule"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/WireConflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalErrorEither"
  /api/v1/pricing/calculate-escalation:
    post:
      operationId: pricingCalculateEscalation
      tags: [pricing]
      summary: Calculate an escalated future price
      description: >-
        Guarded admin or owner. The body is capped at 1 MiB. base_price must be positive; escalation_type must be PERCENTAGE or INDEX_DELTA; both dates are required. A date that is not YYYY-MM-DD, or an index lookup failure, answers 500. A target on or before the effective date returns the base price with months_out 0. For INDEX_DELTA the escalation_rate field carries the base index value.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PricingEscalationRequest"
      responses:
        "200":
          description: The escalation result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PricingEscalationResult"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/ConflictEither"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalError"
