  /api/v1/quotes:
    get:
      operationId: quoteList
      tags: [quote]
      summary: List quotes
      description: >-
        The cursor list envelope, newest first. status filters on the lowercase lifecycle vocabulary (a comma separated list), customer_id filters on the customer. total appears only under include=total. A parameter the route does not declare, a status outside the vocabulary, a malformed cursor or an out of range limit is a 400.
      parameters:
        - name: status
          in: query
          required: false
          description: Comma separated lowercase statuses (draft, sent, accepted, rejected, expired).
          schema:
            type: string
        - name: customer_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Include"
        - $ref: "#/components/parameters/XBranchId"
      responses:
        "200":
          description: The page of quotes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuotePage"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "500":
          $ref: "#/components/responses/InternalErrorEither"
    post:
      operationId: quoteCreate
      tags: [quote]
      summary: Create a quote
      description: >-
        Creates a draft quote, priced by the platform rule: each line's extension is rounded once to cents. A line carries its unit of measure, or names a product whose own unit it takes (a line with neither is a 400 naming lines[i].uom); every field problem is collected into one 400. A body branch_id must be a branch the caller may target: when the request's branch context names a branch it must equal it, and with no context branch it must be within the caller's branch grants, else 403 forbidden naming branch_id. Mints the document number and writes quote.created in the same transaction.
      parameters:
        - $ref: "#/components/parameters/XBranchId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuoteRequest"
      responses:
        "201":
          description: The created quote, with its ETag and a Location header.
          headers:
            ETag:
              description: The quote's revision in quotes, for example "3". Send it back as If-Match.
              schema:
                type: string
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "409":
          $ref: "#/components/responses/WireConflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalErrorEither"
  /api/v1/quotes/analytics:
    get:
      operationId: quoteAnalytics
      tags: [quote]
      summary: Quote analytics aggregates
      parameters:
        - $ref: "#/components/parameters/XBranchId"
      responses:
        "200":
          description: Aggregated quote analytics; money in cents.
          content:
            application/json:
              schema:
