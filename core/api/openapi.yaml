        full_name:
          type: string
        staff_no:
          type: [string, "null"]
        role:
          type: string
        active:
          type: boolean
        revision:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        modules:
          type: array
          items:
            type: string
    StaffPage:
