          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/quotes/{id}/file:
    get:
      operationId: quoteDownloadOriginalFile
      tags: [quote]
      summary: Download the original uploaded file
      description: >-
        Streams the stored original upload of an AI sourced quote. The stored content type is echoed; the filename in Content-Disposition is sanitized. A quote with no stored file is a 404.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/XBranchId"
      responses:
        "200":
          description: The file bytes; the stored content type is echoed.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /uploads/:
    get:
      operationId: uploadsFile
      tags: [uploads]
      summary: Serve an uploaded file
      description: >-
        Authenticated access to the dealer file store under the uploads directory. The path after /uploads/ is the file path within the uploads directory. Content-Type is derived from the file extension (go's http.DetectContentType, which checks the extension first and falls back to content sniffing); Content-Disposition is always attachment; X-Content-Type-Options is nosniff. A nonexistent file is a 404.
      security:
        - BearerJWT: []
        - MachineKey: []
      responses:
        "200":
          description: The file bytes; Content-Type is derived from the file extension.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    BearerJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        The user JWT the auth middleware verifies against the configured JWKS issuer. Role guards run per module (the census column in ROUTES.txt names the registering module; cmd/server/main.go names the roles each module registers with). AUTH_MODE=dev disables verification entirely.
    IntegrationKey:
      type: apiKey
      in: header
      name: X-Integration-Key
      description: >-
        The shared integration key of the AI load management seam, compared in constant time. When no key is configured the whole seam answers 503 before the handler runs.
    PortalSession:
      type: apiKey
      in: cookie
      name: portal_token
      description: >-
        The portal JWT issued by POST /api/portal/v1/login, presented as the portal_token cookie (HttpOnly) or as an Authorization: Bearer header; the middleware accepts either, cookie first. Verified against PORTAL_JWT_SECRET (HS256). AUTH_MODE=dev bypasses the check and injects the demo customer's claims instead.
    MachineKey:
      type: http
      scheme: bearer
      bearerFormat: machine-key
      description: >-
        A machine key (the sk_live_ shape GenerateKey mints). Validated against the api_keys table; needs scope for the route module, uploads:read for GET and HEAD and uploads:write for other methods. Machine keys are accepted on the same Authorization: Bearer header as the user JWT; the auth layer dispatches by token shape before the JWT parser runs.
  parameters:
    Limit:
      name: limit
      in: query
      description: >-
        Page size. Unparseable, non positive or over maximum values are silently ignored and the default applies; the value is never refused today.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Offset:
      name: offset
      in: query
      description: >-
        Page offset. Unparseable or negative values are silently ignored and the default applies.
      schema:
        type: integer
        minimum: 0
        default: 0
    XBranchId:
      name: X-Branch-Id
      in: header
      required: false
      description: >-
        Branch scope for modules registered behind the branch middleware (quote, customer, order, invoice in this fragment set). A missing header passes for admins and in dev mode; with default_branch_required on, a non admin without it is refused. A non UUID value is a 400 and a branch the caller has no grant for is a 403.
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >-
        Opt in idempotent replay for POST, PUT and PATCH. The legacy name X-Idempotency-Key addresses the same claim. Claims are stored in Postgres and survive a restart; only 2xx and 3xx responses are stored.
      schema:
        type: string
        minLength: 1
        maxLength: 255
  responses:
    BadRequest:
      description: >-
        The request cannot be consumed. The body is the standard error envelope; the message is the generic status text, and the handler's specific message goes to the server log only.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: No or invalid credentials.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: The caller's roles do not include one the route requires.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: The addressed resource does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: The write conflicts with the resource's current state.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnprocessableEntity:
      description: >-
        The request is semantically invalid for this operation. Used by the idempotency layer when an Idempotency-Key is reused with a request body that differs from the original.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PaymentRequired:
      description: The card charge or its persistence failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: Unexpected server fault (also today's status for most service level validation failures).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServiceUnavailable:
      description: A dependency the route needs is not configured.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    IntegrationUnauthorized:
      description: The X-Integration-Key is missing or wrong (the integration seam's own error body, not the standard envelope).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/IntegrationError"
    IntegrationUnavailable:
      description: No integration key is configured, so the whole seam is closed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/IntegrationError"
    IntegrationBadRequest:
      description: The body or a parameter is malformed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/IntegrationError"
    IntegrationNotFound:
      description: The addressed resource does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/IntegrationError"
    IntegrationConflict:
      description: The order was created but could not be confirmed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/IntegrationError"
    IntegrationServerError:
      description: The handler failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/IntegrationError"
  schemas:
    Error:
      type: object
      required: [error, meta]
      description: >-
        The standard error envelope written by httputil.RespondError. The message is always the generic status text; the handler's specific message is server log only. request_id echoes the X-Request-ID response header.
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [BAD_REQUEST, UNAUTHORIZED, FORBIDDEN, NOT_FOUND, CONFLICT, RATE_LIMITED, UNPROCESSABLE_ENTITY, PAYMENT_REQUIRED, INTERNAL_ERROR]
            message:
              type: string
              description: Generic status text such as "Bad Request".
        meta:
          type: object
          required: [request_id]
          properties:
            request_id:
              type: string
    IntegrationError:
      type: object
      required: [error]
      description: The integration seam's own error body, a bare message string.
      properties:
        error:
          type: string
    ExposureBlock:
      type: object
      required: [error, code, exposure]
      description: >-
        The raw 409 payload the order module writes when the lumber index exposure gate blocks a confirm, fulfill or gate check. This is not the standard error envelope.
      properties:
        error:
          type: string
          enum: [unresolved index exposure on source quote]
        code:
          type: string
          enum: [UNRESOLVED_EXPOSURE]
        exposure:
          type: object
          required: [quote_id, state, exposure_dollars, indexes]
          properties:
            quote_id:
              type: string
              format: uuid
            quote_short_id:
              type: string
            state:
              type: string
              description: The exposure state vocabulary (ACK_REQUIRED, BLOCKED and neighbors).
            exposure_dollars:
              type: number
            indexes:
              type: array
              items:
                type: string
            salesperson_id:
              type: [string, "null"]
              format: uuid
            salesperson_name:
              type: [string, "null"]
            required_action:
              type: string
            last_checked_at:
              type: [string, "null"]
              format: date-time
    Customer:
      type: object
      required: [id, primary_branch_id, name, account_number, tier, credit_limit, balance_due, is_active, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        primary_branch_id:
          type: string
          format: uuid
        name:
          type: string
        account_number:
          type: string
        email:
          type: string
        phone:
          type: string
        address:
          type: string
        tier:
          type: string
          enum: [RETAIL, SILVER, GOLD, PLATINUM]
        price_level_id:
          type: string
          format: uuid
        price_level:
          $ref: "#/components/schemas/PriceLevel"
        salesperson_id:
          type: string
          format: uuid
        salesperson_name:
          type: string
        credit_limit:
          type: number
          description: Float dollars.
        balance_due:
          type: number
          description: Float dollars. The account module carries the same fact in cents.
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CustomerPage:
      type: object
      required: [data, total, limit, offset]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Customer"
        total:
