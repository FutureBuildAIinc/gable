        - name: q
          in: query
          required: false
          description: Search term for name, account_number and email, at most 100 characters.
          schema:
            type: string
        - name: tier
          in: query
          required: false
          description: One lowercase tier.
          schema:
            type: string
            enum: [retail, silver, gold, platinum]
        - name: is_active
          in: query
          required: false
          schema:
            type: boolean
        - name: salesperson_id
          in: query
          required: false
          description: Customers assigned to this salesperson.
          schema:
            type: string
            format: uuid
