        quantity:
          type: number
        uom:
          type: string
        unit_price:
          type: number
          description: Float dollars; 0 until the dealer prices the line.
        line_total:
          type: number
          description: Float dollars; 0 until the dealer prices the line.
        is_special_order:
          type: boolean
