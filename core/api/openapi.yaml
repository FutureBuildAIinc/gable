      description: >-
        Roles admin, owner, finance. Every lookup failure, not only a missing result, is a 404.
      parameters:
        - name: po_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The match result with per line details.
          content:
            application/json:
