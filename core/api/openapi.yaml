    get:
      operationId: purchaseOrderReorderRuns
      tags: [purchaseOrder]
      summary: Recent reorder cron runs
      description: Roles admin, owner, purchasing. The last 50 runs, never null.
      parameters:
        - $ref: "#/components/parameters/XBranchId"
      responses:
        "200":
          description: The runs, newest first.
          content:
            application/json:
              schema:
                type: array
