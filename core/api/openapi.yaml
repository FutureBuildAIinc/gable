          type: string
          nullable: true
        tool:
          type: string
          nullable: true
    OrdersDraftDocument:
      type: object
      description: >-
        The order draft resource: one wire type from every draft route. The summary form (the list) is the same object without payload and without validation.problems.
      required: [id, module, status, revision, branch_id, payload, validation, created_by, updated_by, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        module:
          type: string
          enum: [orders]
        status:
          $ref: "#/components/schemas/OrdersDraftStatus"
        revision:
          type: integer
          format: int64
        branch_id:
          type: string
          format: uuid
        subject_id:
          type: string
          format: uuid
          nullable: true
        subject_revision:
          type: integer
          format: int64
          nullable: true
        payload:
          type: object
          description: The order create or update request as JSON.
        validation:
          type: object
          required: [ready]
          properties:
            ready:
              type: boolean
            problems:
              type: array
              items:
                $ref: "#/components/schemas/WireErrorDetail"
        created_by:
          $ref: "#/components/schemas/OrdersDraftActor"
        updated_by:
          $ref: "#/components/schemas/OrdersDraftActor"
        promoted:
          type: object
          nullable: true
          properties:
            entity_id:
              type: string
              format: uuid
            number:
              type: string
              nullable: true
            at:
              type: string
            by:
              $ref: "#/components/schemas/OrdersDraftActor"
        discarded:
          type: object
          nullable: true
          properties:
            at:
              type: string
            by:
              $ref: "#/components/schemas/OrdersDraftActor"
        created_at:
          type: string
        updated_at:
          type: string
    OrdersDraftCreateRequest:
      type: object
      required: [payload]
      properties:
        payload:
          type: object
          description: The order create (or, with subject_id, update) request as JSON; at most 256 KiB.
        subject_id:
          type: string
          format: uuid
        subject_revision:
          type: integer
          format: int64
    QuotesDraftStatus:
      type: string
      enum: [open, promoted, discarded]
      description: The draft lifecycle, lowercase on the wire; promoted is terminal.
    QuotesDraftActor:
      type: object
      description: >-
        What pkg/actor resolved for the request: the user's subject for an agent acting with a person's session, the key's id for a keyed writer; acting_as and tool carry the agent marker and tool name.
      properties:
        kind:
          type: string
          enum: [user, key, agent, anonymous]
        id:
          type: string
          nullable: true
        acting_as:
          type: string
          nullable: true
        tool:
          type: string
          nullable: true
    QuotesDraftValidation:
      type: object
      description: >-
        Computed on every read and write from the payload alone: ready is true when the kind's parser would accept the payload as a create (or update) request, and problems is exactly that 400's details with payload.-prefixed fields. It tells an editor what still blocks a promotion without refusing the save.
      required: [ready]
      properties:
        ready:
          type: boolean
        problems:
          type: array
          items:
            $ref: "#/components/schemas/WireErrorDetail"
    QuotesDraftPromoted:
      type: object
      description: Set once, at promotion, with the entity's id and document number.
      required: [entity_id, at]
      properties:
        entity_id:
          type: string
          format: uuid
        number:
          type: string
          nullable: true
        at:
          type: string
        by:
          $ref: "#/components/schemas/QuotesDraftActor"
    QuotesDraftDocument:
      type: object
      description: >-
        The draft resource: one wire type from every draft route, promotion included. Optional fields are present as null (ADR 0001 section 12). The summary form (the list) is the same object without payload and without validation.problems.
      required: [id, module, status, revision, branch_id, payload, validation, created_by, updated_by, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        module:
          type: string
          enum: [quotes]
        status:
          $ref: "#/components/schemas/QuotesDraftStatus"
        revision:
          type: integer
          format: int64
        branch_id:
          type: string
          format: uuid
        subject_id:
          type: string
          format: uuid
          nullable: true
        subject_revision:
          type: integer
          format: int64
          nullable: true
        payload:
          type: object
          description: The module's own request body as JSON.
        validation:
          $ref: "#/components/schemas/QuotesDraftValidation"
        created_by:
          $ref: "#/components/schemas/QuotesDraftActor"
        updated_by:
          $ref: "#/components/schemas/QuotesDraftActor"
        promoted:
          allOf:
            - $ref: "#/components/schemas/QuotesDraftPromoted"
          nullable: true
        discarded:
          type: object
          nullable: true
          properties:
            at:
              type: string
            by:
              $ref: "#/components/schemas/QuotesDraftActor"
        created_at:
          type: string
        updated_at:
          type: string
    QuotesDraftCreateRequest:
      type: object
      required: [payload]
      properties:
        payload:
          type: object
          description: >-
            The quote create request (or, with subject_id, the update request): never a revision, never a file; at most 256 KiB of JSON.
        subject_id:
          type: string
          format: uuid
          description: The quote an edit draft edits; null on a create draft.
        subject_revision:
          type: integer
          format: int64
          description: >-
            The entity revision the edit was built on; asserted at create (a mismatch is 409 subject_stale), taken from the subject when omitted, moved forward by a bounded rebase on PUT.
    QuotesDraftReplaceRequest:
      type: object
      required: [payload]
      properties:
        payload:
          type: object
        revision:
          type: integer
          format: int64
          description: The body form of the precondition, beside If-Match.
        subject_revision:
          type: integer
          format: int64
          description: The bounded rebase, never past the subject's current revision.
