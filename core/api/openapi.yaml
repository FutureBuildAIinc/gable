    get:
      operationId: productUnitSetGet
      tags: [product]
      summary: Read a product's unit set
      description: >-
        The set, the four defaults, the board measure facts the derivations read and the product's revision.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The unit set.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnitSetDoc'
        '400':
