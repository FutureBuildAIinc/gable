        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /api/v1/gl/trial-balance:
    get:
      operationId: glTrialBalance
      tags: [gl]
      summary: Trial balance
      description: >-
        Role guard admin or owner. Posted activity up to and including as_of (default today), for active accounts with any activity, ordered by code. A malformed as_of is a 400. The body is null when no account has activity.
      parameters:
        - name: as_of
          in: query
          required: false
          description: Cut-off date, YYYY-MM-DD. Defaults to today.
          schema:
            type: string
            format: date
        - name: currency
          in: query
          required: false
          description: >-
            ISO 4217 code, three capital letters. Reports never add two currencies (ADR 0005 4.2): omitted, every currency's rows are returned, each row naming its currency; given, that currency alone.
          schema:
            type: string
            pattern: "^[A-Z]{3}$"
      responses:
        "200":
          description: The trial balance rows.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GlTrialBalance"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/gl/profit-and-loss:
    get:
      operationId: glProfitAndLoss
      tags: [gl]
      summary: Profit and loss statement
      description: >-
        Role guard admin or owner. start defaults to the first of the current month and end to today; both are YYYY-MM-DD and inclusive. A malformed date or an end before the start is a 400. The three sections are never null.
      parameters:
        - name: start
          in: query
          required: false
          description: First day, YYYY-MM-DD. Defaults to the first of the current month.
          schema:
            type: string
            format: date
        - name: end
          in: query
          required: false
          description: Last day, YYYY-MM-DD. Defaults to today.
          schema:
            type: string
            format: date
        - name: currency
          in: query
          required: false
          description: >-
            ISO 4217 code, three capital letters. Reports never add two currencies (ADR 0005 4.2): defaults to the dealer's default currency; the report is in that one currency.
          schema:
            type: string
            pattern: "^[A-Z]{3}$"
      responses:
        "200":
          description: The income statement in cents.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GlProfitAndLossReport"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/gl/balance-sheet:
    get:
      operationId: glBalanceSheet
