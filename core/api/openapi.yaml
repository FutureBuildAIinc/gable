  /api/portal/v1/dashboard:
    get:
      operationId: portalDashboard
      tags: [portal]
      summary: The contractor dashboard
      description: AR summary plus the five most recent orders.
      security:
        - PortalSession: []
      responses:
        "200":
          description: The dashboard aggregate.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalDashboard"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/portal/v1/orders:
    get:
      operationId: portalListOrders
      tags: [portal]
      summary: The customer's order history
      description: >-
        A bare array, newest created first, capped at 50 with no page envelope. Two additive filters: project_id (a project the caller does not own is a 404) and since (strictly newer updated_at, the change-feed cursor; a since page is ordered updated_at ascending and tie-completed so the cursor cannot lose a row). ETag and X-Portal-Latest-Change make a 30 second poll cheap: If-None-Match matching (weak comparison, list or star) answers 304 with no body.
      security:
        - PortalSession: []
      parameters:
        - name: project_id
          in: query
          description: Only orders on this project; a project the caller does not own is a 404, not an empty list.
          schema:
            type: string
            format: uuid
        - name: since
          in: query
          description: Only orders with updated_at strictly newer; RFC3339. An unparseable value is a 400.
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: The orders, a bare array, never null.
          headers:
            ETag:
              description: A strong validator over (customer, filters, count, newest updated_at).
              schema:
                type: string
            X-Portal-Latest-Change:
              description: The newest updated_at in this result; send it back as since next time. Absent when the list is empty.
              schema:
                type: string
                format: date-time
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PortalOrder"
        "304":
          description: If-None-Match matched the ETag; no body.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/portal/v1/orders/{id}:
    get:
      operationId: portalGetOrder
      tags: [portal]
      summary: One order
      description: Scoped to the caller; another customer's order and a nonexistent one are the same 404.
      security:
        - PortalSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The order with its lines.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalOrder"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/portal/v1/orders/reorder:
    post:
      operationId: portalReorder
      tags: [portal]
      summary: Duplicate a historical order as a new draft
      description: >-
        Creates a new DRAFT order from the source order's lines. Every service failure, including a source order the caller does not own, is the handler's fixed 500 today.
      security:
        - PortalSession: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PortalReorderRequest"
      responses:
        "201":
          description: The new draft's id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalReorderResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: The idempotency key is already being processed by a concurrent request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/portal/v1/orders/{id}/cancel:
    post:
      operationId: portalCancelOrder
      tags: [portal]
      summary: Cancel an order
      description: >-
        The body is optional (an empty body is a cancellation without a reason). Ownership first (someone else's order is a 404), then the goods-in-motion gate (a stop already delivered or on a dispatched route is a 409), then the ERP state machine (already cancelled and fulfilled are 409s). A 409 carries the refusal envelope with a customer-safe reason string.
      security:
        - PortalSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PortalCancelOrderRequest"
      responses:
        "200":
          description: What was cancelled and what it changed from.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalCancelOrderResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The order exists but cannot be cancelled from the portal (on a truck, delivered, already cancelled, or fulfilled); the refusal envelope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalRefusal"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/portal/v1/orders/{id}/project:
    put:
      operationId: portalSetOrderProject
      tags: [portal]
      summary: Attach or detach an order's project
      description: >-
        A null project_id detaches. The project must belong to the caller (a foreign project id is a 404); the order too. Returns the updated order.
      security:
        - PortalSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PortalSetOrderProjectRequest"
      responses:
        "200":
          description: The updated order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalOrder"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The idempotency key is already being processed by a concurrent request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/portal/v1/invoices:
    get:
      operationId: portalListInvoices
      tags: [portal]
