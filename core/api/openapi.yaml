          format: int64
          description: Cents.
    ApCreateVendorInvoiceRequest:
      type: object
      required: [vendor_id, vendor_invoice_number, invoice_date, due_date, lines]
      description: >-
        The create body. Dates are YYYY-MM-DD; money is _cents and the line unit price is _ten_thousandths; the quantity is a decimal string; the server prices each line and never accepts a status.
      properties:
        vendor_id:
          type: string
          format: uuid
        branch_id:
          type: string
          format: uuid
          description: Defaults from the caller's context branch or the default branch.
        vendor_invoice_number:
          type: string
          description: 1 to 64 characters, unique per vendor.
        invoice_date:
          type: string
          format: date
        due_date:
          type: string
          format: date
        po_id:
          type: string
          format: uuid
        currency:
          type: string
          description: An ISO 4217 code of three capital letters; defaults from the setting.
        tax_cents:
          type: integer
          format: int64
        notes:
          type: string
        lines:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ApCreateVendorInvoiceLineRequest'
    ApCreateVendorInvoiceLineRequest:
      type: object
      required: [description, quantity, unit_price_ten_thousandths, gl_account_id]
      properties:
        description:
          type: string
          description: 1 to 256 characters.
        quantity:
          type: string
          description: A plain decimal with at most 4 fraction digits, more than zero.
        unit_price_ten_thousandths:
          type: integer
          format: int64
          description: Never negative.
        gl_account_id:
          type: string
          format: uuid
          description: The account the approve entry debits for the line.
        purchase_order_line_id:
          type: string
          format: uuid
        product_id:
          type: string
          format: uuid
    ApInvoiceTransitionRequest:
      type: object
      required: [to]
