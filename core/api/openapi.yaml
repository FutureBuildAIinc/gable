#
# Gable API contract, assembled by core/api/tools/merge from the fragments
# in core/api/fragments/. Edit a fragment, never this file; regenerate with:
#
#	go run ./api/tools/merge
#
# The merge -check drift gate and the internal/apicontract coverage test
# both fail when this file and the fragments disagree.
openapi: 3.1.0
info:
  title: Gable API
  version: 1.0.0
  description: The HTTP surface of the Gable ERP core, transcribed route by route from the handlers as they behave today. Assembled from per module fragments; see docs/refactor/CONTRACT.md. The wire conventions of ADR 0001 land on these routes module by module, and each conversion edits the fragments in the same change.
security:
  - BearerJWT: []
tags:
  - name: a2a
  - name: accounts
  - name: activities
  - name: admin
  - name: apps
  - name: configurator
  - name: customer
  - name: dashboard
  - name: delivery
  - name: deposits
  - name: documents
  - name: governance
  - name: health
  - name: integration
  - name: inventory
  - name: invoice
  - name: location
  - name: millwork
  - name: order
  - name: parsing
  - name: partner
  - name: payment
  - name: portal
  - name: pos
  - name: product
  - name: project
  - name: quote
  - name: reporting
  - name: sales-team
  - name: uploads
  - name: vendors
  - name: vision
paths:
  /api/v1/a2a/purchase-order:
    post:
      operationId: a2aPurchaseOrderReceive
      tags: [a2a]
      summary: Receive a signed create_purchase_order event from FB Brain
      description: >-
        Order of checks, exactly as the receiver runs them. (1) The body is read up to 1 MiB; anything beyond that is silently truncated, which makes the signature fail. (2) X-JWS-Signature must be present, else 401. (3) X-Idempotency-Key must be present, else 400. (4) The signature must be a compact detached JWS (RS256 only) that verifies over the raw request body with Brain's RSA public key, else 401 "invalid JWS signature". (5) The key is looked up in the a2a_inbound_po_log table; a key already logged is a 409 DUPLICATE (the receiver's own check, in addition to the global idempotency layer). (6) The body must be JSON, else 400. (7) An event_type other than create_purchase_order is acknowledged with 200 {"status": "ignored"} and nothing is created. (8) payload must decode into the purchase order payload and its vendor_id must be a UUID, else 400. The purchase order is created through the purchase order service with source A2A, stamped with the branch from the brain_inbound_branch_id system setting (falling back to default_branch_id); a failure is a 500. On success the webhook is logged against the idempotency key (a failure to log is only logged, the answer stays 201) and the answer is 201 {"status":"created","po_id"}. The key is recorded only after a successful creation, so a failed attempt can be retried with the same key. The global idempotency layer (the Idempotency-Key or X-Idempotency-Key header) only claims requests that carry an identifiable principal; this route has no JWT, so outside AUTH_MODE=dev the global layer passes it through uncached, and under AUTH_MODE=dev it claims under the dev principal and may answer 409 (in progress) or 422 (key reused with a different body) in the standard envelope. There is no role guard and no JWT.
      security: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: X-JWS-Signature
          in: header
          required: true
          description: >-
            A compact detached JWS (header..signature, empty payload segment) signed RS256 over the exact request body bytes, verifiable with the configured Brain public key. A missing header is a 401, an unparseable or non verifying signature is a 401.
          schema:
            type: string
        - name: X-Idempotency-Key
          in: header
          required: true
          description: >-
            The receiver's own duplicate key, checked against the a2a_inbound_po_log table. The same header name is also read by the global idempotency layer as an alias of Idempotency-Key. A missing header is a 400 (after the signature header check, before the signature verification).
          schema:
            type: string
      requestBody:
        required: true
        description: >-
          The signed body; the signature covers these exact bytes, so a re-serialization breaks it.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/A2aInboundPOWebhook"
      responses:
        "200":
          description: The event type is not create_purchase_order; acknowledged and ignored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/A2aIgnoredResponse"
        "201":
          description: The purchase order was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/A2aCreatedResponse"
        "400":
          description: >-
            VALIDATION_ERROR: unreadable body, missing X-Idempotency-Key, body not JSON, payload not a purchase order payload, or vendor_id not a UUID. The global idempotency layer can also answer 400 in the standard envelope under AUTH_MODE=dev.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/A2aError"
                  - $ref: "#/components/schemas/Error"
        "401":
          description: >-
            UNAUTHORIZED: missing X-JWS-Signature header, or a signature that does not parse or verify against Brain's public key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/A2aError"
        "404":
          description: >-
            The route is not mounted (FB Brain disabled or no loadable public key): the mux's own plain text 404, not an error envelope.
          content:
            text/plain:
              schema:
                type: string
        "409":
          description: >-
            DUPLICATE: the X-Idempotency-Key was already processed (the receiver's body), or, under AUTH_MODE=dev only, the global layer's in progress claim in the standard envelope.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/A2aError"
                  - $ref: "#/components/schemas/Error"
        "422": {$ref: "#/components/responses/UnprocessableEntity"}
        "500":
          description: >-
            INTERNAL_ERROR: the idempotency lookup failed or the purchase order could not be created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/A2aError"
  /api/v1/accounts/{id}:
    get:
      operationId: accountSummary
      tags:
        - accounts
      summary: Get account summary
      description: Balance due, credit limit and available credit, all in cents. Any service error, including an unknown customer, answers 500.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/XBranchId'
      responses:
        '200':
          description: The account summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/accounts/{id}/transactions:
    get:
      operationId: accountTransactions
      tags:
        - accounts
      summary: List account transactions
      description: 'The list is not paginated: limit and offset are not read.'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/XBranchId'
      responses:
        '200':
          description: Every transaction of the customer, newest first. The body is null when there are none.
          content:
            application/json:
              schema:
                type:
                  - array
                  - 'null'
                items:
                  $ref: '#/components/schemas/CustomerTransaction'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/activities/{id}:
    get:
      operationId: activityGet
      tags:
        - activities
      summary: Get one activity
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/XBranchId'
      responses:
        '200':
          description: The activity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activity'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: activityUpdate
      tags:
        - activities
      summary: Update an activity
      description: The write replaces contact_id, activity_type, description, logged_by and activity_date; an omitted field is cleared.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/XBranchId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivityUpdate'
      responses:
        '200':
          description: The activity as the request wrote it. customer_id, created_at and any field the body omitted come back as zero values, because the handler echoes the decoded body rather than re-reading the row.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activity'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: activityDelete
      tags:
        - activities
      summary: Delete an activity
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/XBranchId'
      responses:
        '204':
          description: Activity deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/admin/keys:
    get:
      operationId: adminListKeys
      tags: [admin]
      summary: List machine API keys
      description: >-
        Admin or owner only. Newest first, revoked keys included. Not paginated. Answers null, not an empty array, when there are no keys. Only the 12 character prefix identifies a key; the secret is never retrievable.
      responses:
        "200":
          description: Every key, or null when none exist.
          content:
            application/json:
              schema:
                type: [array, "null"]
                items:
                  $ref: "#/components/schemas/TechAdminKey"
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/InternalError"}
    post:
      operationId: adminCreateKey
      tags: [admin]
      summary: Create a machine API key
      description: >-
        Admin or owner only. The raw key (sk_live_ followed by 43 URL safe base64 characters) is returned here and nowhere else; only its salted Argon2 hash is stored. Success is a 200, not a 201. Neither name nor scopes is validated; omitted scopes are stored as null.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TechAdminCreateKeyRequest"
      responses:
        "200":
          description: The new key record and the raw key, shown once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TechAdminCreateKeyResponse"
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/UnprocessableEntity"}
        "500": {$ref: "#/components/responses/InternalError"}
  /api/v1/admin/keys/{id}:
    delete:
      operationId: adminRevokeKey
      tags: [admin]
      summary: Revoke a machine API key
      description: >-
        Admin or owner only. Sets revoked_at; the row is kept. Unknown ids and already revoked keys are a 204 too (an UPDATE that matches nothing is not an error). A malformed id the database refuses is a 500. DELETE is outside the idempotency layer.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Revoked; no body.
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/InternalError"}
  /api/v1/admin/settings/ai:
    get:
      operationId: adminGetAISettings
      tags: [admin]
      summary: Show the OpenRouter key status
      description: >-
        Admin or owner only. Never returns the key: key_hint is the first 10 and last 4 characters joined by three dots (four asterisks for a key of 12 characters or fewer), and is absent when no key is configured. base_url is present only when an admin override is stored, never for the environment or built in default.
      responses:
        "200":
          description: The key status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TechAdminSettingsStatus"
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
    put:
      operationId: adminSaveAISettings
      tags: [admin]
      summary: Save the OpenRouter key and base URL
      description: >-
        Admin or owner only. The key is stored and never echoed back. base_url absent or null leaves the stored override alone; an empty string clears the override; any other value must be an absolute https URL (plain http only for loopback hosts) or the call is a 400 and nothing, key included, is saved. A key is required. A 500 also answers when the key store is not wired.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TechAdminSaveAISettingsRequest"
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TechAdminSaveResult"
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/UnprocessableEntity"}
        "500": {$ref: "#/components/responses/InternalError"}
    delete:
      operationId: adminDeleteAISettings
      tags: [admin]
      summary: Remove the stored OpenRouter key and base URL override
      description: >-
        Admin or owner only. Deletes the admin stored key and the base URL override together, so both revert to the environment or default. DELETE is outside the idempotency layer.
      responses:
        "204":
          description: Removed; no body.
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/InternalError"}
  /api/v1/admin/settings/routing:
    get:
      operationId: adminGetRoutingSettings
      tags: [admin]
      summary: Show the OpenRouteService key status
      description: >-
        Admin or owner only. Same shape and masking as the AI settings, key only: key_hint is the first 10 and last 4 characters (four asterisks for a key of 12 characters or fewer), and base_url is never present.
      responses:
        "200":
          description: The key status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TechAdminSettingsStatus"
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
    put:
      operationId: adminSaveRoutingSettings
      tags: [admin]
      summary: Save the OpenRouteService key
      description: >-
        Admin or owner only. The key is stored and never echoed back. A key is required (400). A 500 also answers when the key store is not wired.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TechAdminSaveRoutingSettingsRequest"
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TechAdminSaveResult"
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/UnprocessableEntity"}
        "500": {$ref: "#/components/responses/InternalError"}
    delete:
      operationId: adminDeleteRoutingSettings
      tags: [admin]
      summary: Remove the stored OpenRouteService key
      description: >-
        Admin or owner only. Deletes the admin stored key so the environment value, if any, applies again. DELETE is outside the idempotency layer.
      responses:
        "204":
          description: Removed; no body.
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/InternalError"}
  /api/v1/admin/modules:
    get:
      operationId: adminListModules
      tags: [admin]
      summary: List the integration modules and their global flag
      description: >-
        Admin or owner only. A fixed catalog (today only ai_lm); enabled is true only when the modules.<id>.enabled setting is exactly true.
      responses:
        "200":
          description: The modules. Never null.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StaffModule"
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/InternalError"}
  /api/v1/admin/modules/{id}:
    put:
      operationId: adminSetModuleEnabled
      tags: [admin]
      summary: Switch an integration module on or off globally
      description: >-
        Admin or owner only. Writes the modules.<id>.enabled setting for any id, known or not, and revokes access for every staff member at once when switched off without deleting grants. The id is not checked against the catalog. The response echoes the id and the new flag with an empty name.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffSetModuleEnabledRequest"
      responses:
        "200":
          description: The module with its new flag; name is always the empty string here.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffModule"
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/UnprocessableEntity"}
        "500": {$ref: "#/components/responses/InternalError"}
  /api/v1/admin/staff:
    get:
      operationId: adminListStaff
      tags: [admin]
      summary: List the staff roster
      description: >-
        Admin or owner only. Ordered by full name, with each member's raw module grants. Not paginated. Never null.
      responses:
        "200":
          description: The roster.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StaffMember"
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/InternalError"}
    post:
      operationId: adminCreateStaff
      tags: [admin]
      summary: Add a staff member
      description: >-
        Admin or owner only. Email and full_name are required (400 when empty). Role defaults to staff and active to true. A duplicate email the database refuses surfaces as a 500.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffCreateRequest"
      responses:
        "201":
          description: The created member, with an empty modules array.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMember"
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/UnprocessableEntity"}
        "500": {$ref: "#/components/responses/InternalError"}
  /api/v1/admin/staff/{id}:
    get:
      operationId: adminGetStaff
      tags: [admin]
      summary: Get a staff member
      description: Admin or owner only.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The member with its raw module grants.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMember"
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/InternalError"}
    put:
      operationId: adminUpdateStaff
      tags: [admin]
      summary: Update a staff member
      description: >-
        Admin or owner only. A partial update: absent or null fields are left unchanged (a null staff_no cannot clear the stored value). An empty body returns the current record, or 404 when the id is unknown.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffUpdateRequest"
      responses:
        "200":
          description: The updated member.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMember"
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/UnprocessableEntity"}
        "500": {$ref: "#/components/responses/InternalError"}
  /api/v1/admin/staff/{id}/modules:
    post:
      operationId: adminGrantStaffModule
      tags: [admin]
      summary: Grant a module to a staff member
      description: >-
        Admin or owner only. Idempotent at the database (a repeat grant is a no-op) and audit logged. The module id is not checked against the catalog. An unknown staff id is refused by the database and is a 500. When the re-read of the member fails after the grant, the answer is still 200 with the bare status object granted.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffGrantModuleRequest"
      responses:
        "200":
          description: The member with its grants, or the bare status object.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/StaffMember"
                  - $ref: "#/components/schemas/StaffModuleStatus"
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/UnprocessableEntity"}
        "500": {$ref: "#/components/responses/InternalError"}
  /api/v1/admin/staff/{id}/modules/{module_id}:
    delete:
      operationId: adminRevokeStaffModule
      tags: [admin]
      summary: Revoke a module from a staff member
      description: >-
        Admin or owner only. Idempotent and audit logged; an unknown staff id or a grant that does not exist still succeeds, with the bare status object revoked (the re-read finds no member). DELETE is outside the idempotency layer.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: module_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The member with its remaining grants, or the bare status object.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/StaffMember"
                  - $ref: "#/components/schemas/StaffModuleStatus"
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/InternalError"}
  /api/v1/admin/exposure-scan:
    post:
      operationId: adminExposureScan
      tags: [admin]
      summary: Run the price exposure safety net scan now
      description: >-
        The route guard admits admin, owner and sales; the handler then refuses all but admin and owner with a 403, judging by the first role of the token (the role claim, else the first of the roles array). In dev auth mode the caller is treated as owner. The body is ignored and optional. The scan runs synchronously to completion.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: The scan finished.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminExposureScanResult"
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/UnprocessableEntity"}
        "500": {$ref: "#/components/responses/InternalError"}
  /api/v1/apps:
    get:
      operationId: appsList
      tags: [apps]
      summary: List the app catalog with live enablement
      description: >-
        Any authenticated role (the web client builds its navigation from it); no role guard. The catalog is the union of the compiled in manifests and orphaned database rows, sorted by category then name. An empty catalog on a fresh database triggers one self heal sync, so the list is never null.
      responses:
        "200":
          description: The catalog.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppsList"
        "401": {$ref: "#/components/responses/Unauthorized"}
        "500": {$ref: "#/components/responses/InternalError"}
  /api/v1/apps/{key}/enable:
    post:
      operationId: appsEnable
      tags: [apps]
      summary: Enable an app
      description: >-
        Admin or owner only (a 403 for any other role). Every app the target depends on must be enabled, except core dependencies which are always treated as enabled; otherwise the answer is a 409 with the blockers. Answers the full catalog after the change. Enabling an already enabled app succeeds again.
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: The catalog after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppsList"
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404":
          description: >-
            The key names no compiled in manifest, or the manifest has no registry row. The standard error envelope with the generic text.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >-
            Either a disabled dependency blocks the enable (the hand written app_dependency_conflict body with the blockers), or the idempotency layer reports an in progress claim (the standard envelope).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AppsDependencyConflictError"
                  - $ref: "#/components/schemas/Error"
        "422": {$ref: "#/components/responses/UnprocessableEntity"}
        "500": {$ref: "#/components/responses/InternalError"}
  /api/v1/apps/{key}/disable:
    post:
      operationId: appsDisable
      tags: [apps]
      summary: Disable an app
      description: >-
        Admin or owner only (a 403 for any other role). A core app cannot be disabled (409 app_core), and an app that another enabled app depends on cannot be disabled (409 app_dependency_conflict with the dependents as blockers). Disabled apps do not block. Answers the full catalog after the change. The effect on the app's routes follows within the gate cache window.
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: The catalog after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppsList"
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404":
          description: >-
            The key names no compiled in manifest, or the manifest has no registry row. The standard error envelope with the generic text.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >-
            A core app (app_core), a dependent enabled app (app_dependency_conflict), or an idempotency in progress claim (the standard envelope).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AppsCoreConflictError"
                  - $ref: "#/components/schemas/AppsDependencyConflictError"
                  - $ref: "#/components/schemas/Error"
        "422": {$ref: "#/components/responses/UnprocessableEntity"}
        "500": {$ref: "#/components/responses/InternalError"}
  /api/v1/configurator/rules:
    get:
      operationId: configuratorListRules
      tags: [configurator]
      summary: List every configurator rule
      description: Admin, owner or sales. Ordered by dependency type and value, then attribute type and value. Never null.
      responses:
        "200":
          description: The full rule set.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConfiguratorRule"
