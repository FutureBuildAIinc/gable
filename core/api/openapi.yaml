          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/partner/v1/quotes/{id}:
    get:
      operationId: partnerGetQuote
      tags: [partner]
      summary: One quote
      description: >-
        The ERP's own quote shape. Every failure, a quote that does not exist, one belonging to another customer, and a repository fault, is the handler's fixed 404. A malformed UUID is a 400.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The quote.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The caller's email resolves to no customer, or to an inactive one; the standard error envelope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/payments:
    post:
      operationId: paymentCreate
      tags: [payment]
      summary: Record a non card payment
      description: Cash, check or account payments against an invoice.
      parameters:
