        job_id:
          type: [string, "null"]
          format: uuid
        status:
          $ref: "#/components/schemas/QuoteStatus"
        revision:
          type: integer
          format: int64
          minimum: 1
          description: Starts at 1 and moves on every write; the client sends it back as If-Match or in the body.
        total_cents:
          type: integer
          format: int64
        freight_cents:
          type: integer
          format: int64
        margin_total_cents:
          type: integer
          format: int64
        delivery_type:
          $ref: "#/components/schemas/QuoteDeliveryType"
        vehicle_id:
          type: [string, "null"]
          format: uuid
        vehicle_name:
          type: [string, "null"]
        source:
          type: string
          description: How the quote came to be; portal is a quote the dealer portal customer requested.
          enum: [manual, ai, portal]
        expires_at:
          type: [string, "null"]
          format: date-time
        sent_at:
          type: [string, "null"]
          format: date-time
        accepted_at:
          type: [string, "null"]
          format: date-time
        rejected_at:
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Quote:
      type: object
      required: [id, number, branch_id, customer_id, customer_name, job_id, status, revision, total_cents, freight_cents, margin_total_cents, delivery_type, vehicle_id, vehicle_name, source, expires_at, sent_at, accepted_at, rejected_at, created_at, updated_at, original_filename, original_content_type, parse_map, exposure_state, exposure_cents, exposure_last_checked_at, lines]
      properties:
        id:
          type: string
          format: uuid
        number:
          type: string
          description: The human readable document number, Q- and at least six digits, from a database sequence.
          pattern: "^Q-[0-9]{6,}$"
        branch_id:
          type: string
          format: uuid
        customer_id:
          type: string
          format: uuid
        customer_name:
          type: string
        job_id:
          type: [string, "null"]
          format: uuid
        status:
          $ref: "#/components/schemas/QuoteStatus"
        revision:
          type: integer
          format: int64
          minimum: 1
          description: Starts at 1 and moves on every write; the client sends it back as If-Match or in the body.
        total_cents:
          type: integer
          format: int64
        freight_cents:
          type: integer
          format: int64
        margin_total_cents:
          type: integer
          format: int64
        delivery_type:
          $ref: "#/components/schemas/QuoteDeliveryType"
        vehicle_id:
          type: [string, "null"]
          format: uuid
        vehicle_name:
          type: [string, "null"]
        source:
          type: string
          description: How the quote came to be; portal is a quote the dealer portal customer requested.
          enum: [manual, ai, portal]
        expires_at:
          type: [string, "null"]
          format: date-time
        sent_at:
          type: [string, "null"]
          format: date-time
        accepted_at:
          type: [string, "null"]
          format: date-time
        rejected_at:
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        original_filename:
          type: [string, "null"]
        original_content_type:
          type: [string, "null"]
        parse_map:
          type: [array, "null"]
          items:
            type: object
        exposure_state:
          $ref: "#/components/schemas/QuoteExposureStatus"
        exposure_cents:
          type: integer
          format: int64
        exposure_last_checked_at:
          type: [string, "null"]
          format: date-time
        lines:
          type: array
          items:
            $ref: "#/components/schemas/QuoteLine"
    QuoteLine:
      type: object
      description: >-
        One priced line. Every priced line carries the same fields: the quantity as a decimal string with its unit, the scaled unit price with its price unit, the conversion pair, and the extension in cents (quantity x unit price x price_uom_qty / uom_qty, rounded once, half away from zero).
      required: [id, quote_id, product_id, sku, description, customer_note, quantity, uom, price_uom, uom_qty, price_uom_qty, unit_price_ten_thousandths, line_total_cents, stock_uom, stock_quantity, tally, unit_cost_ten_thousandths, created_at]
      properties:
        id:
          type: string
          format: uuid
        quote_id:
          type: string
          format: uuid
        product_id:
          type: [string, "null"]
          format: uuid
          description: Null for a special order line the dealer does not stock.
        stock_uom:
          type: [string, "null"]
          description: >-
            The product's stocking unit at the line's create (ADR 0006 section 3.4); null on a line without a product.
        stock_quantity:
          description: >-
            The quantity converted into the stocking unit, exact at scale 4 (R5); null on a line without a product.
          oneOf:
            - $ref: "#/components/schemas/Quantity"
            - type: "null"
        tally:
          description: >-
            The pieces by length a random length line carries (ADR 0006 section 4); null on every other line.
          oneOf:
            - $ref: "#/components/schemas/Tally"
            - type: "null"
        sku:
          type: string
        description:
          type: string
        customer_note:
          type: [string, "null"]
          description: What a portal user wrote when asking for the line to be priced; an edit that keeps the line id keeps it.
        quantity:
          $ref: "#/components/schemas/Quantity"
        uom:
          $ref: "#/components/schemas/QuoteUom"
        price_uom:
          type: string
          description: The unit the price is quoted in; equal to uom when the units agree. Not limited to the sale enum (per M, per CWT).
        uom_qty:
          $ref: "#/components/schemas/Quantity"
        price_uom_qty:
          $ref: "#/components/schemas/Quantity"
        unit_price_ten_thousandths:
          type: integer
          format: int64
          description: The unit price per price_uom, times 10,000 (13725 is 1.3725).
        line_total_cents:
          type: integer
          format: int64
        unit_cost_ten_thousandths:
          type: integer
          format: int64
          description: The product's average cost times 10,000; read only.
        created_at:
          type: string
          format: date-time
    Quantity:
      type: string
      pattern: "^-?(0|[1-9][0-9]*)(\\.[0-9]{1,4})?$"
      description: A plain decimal string with at most four fraction digits, never a JSON number.
    QuoteUom:
      type: string
      pattern: '^[A-Z]{1,6}$'
      description: >-
        A unit code of the catalogue (ADR 0006 section 2); on a product line, a sale unit of the product's set.
    Tally:
      type: object
      description: >-
        A random length line's tally (ADR 0006 section 4.3): pieces by length, the cross section snapshotted from the product, the exact linear feet the line's quantity carries, and the board feet display rounding of R4.3 (read by nothing). Pieces are JSON integers; the lengths and derived fields are decimal strings.
      required: [thickness_in, width_in, rows, linear_feet, board_feet]
      properties:
        thickness_in:
          oneOf:
            - $ref: "#/components/schemas/Quantity"
            - type: "null"
        width_in:
          description: "Null beside a null thickness: a tally without a cross section."
          oneOf:
            - $ref: "#/components/schemas/Quantity"
            - type: "null"
        rows:
          type: array
          items:
            $ref: "#/components/schemas/TallyRow"
        linear_feet:
          $ref: "#/components/schemas/Quantity"
        board_feet:
          description: Linear feet x thickness x width / 12, rounded once to scale 4 for display.
          oneOf:
            - $ref: "#/components/schemas/Quantity"
            - type: "null"
    TallyRow:
      type: object
      required: [pieces, length_ft]
      properties:
        pieces:
          type: integer
          minimum: 1
          maximum: 1000000
        length_ft:
          $ref: "#/components/schemas/Quantity"
    TallyRequest:
      type: object
      required: [rows]
      description: >-
        The tally a line carries: rows only. thickness_in, width_in, linear_feet and board_feet are read only, and one in a request is a 400 naming it. Allowed on a random length product line only, its sale unit LF; the linear feet are the line's quantity.
      properties:
        rows:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/TallyRow"
    QuoteRequest:
      type: object
      required: [customer_id, lines]
      description: >-
        The body of POST /quotes and PUT /quotes/{id}. A field the schema does not name is a 400. revision is the PUT precondition beside If-Match; a create has no revision and refuses one with a 400. A PUT refuses the create-only fields (branch_id, source, margin_total_cents, original_file, original_filename, original_content_type, parse_map).
      properties:
        branch_id:
          type: string
          format: uuid
        customer_id:
          type: string
          format: uuid
        job_id:
          type: [string, "null"]
          format: uuid
        expires_at:
          type: [string, "null"]
          format: date-time
        delivery_type:
          $ref: "#/components/schemas/QuoteDeliveryType"
        freight_cents:
          type: integer
          format: int64
          minimum: 0
          description: Cleared for a pickup.
        vehicle_id:
          type: [string, "null"]
          format: uuid
        source:
          type: string
          enum: [manual, ai]
        margin_total_cents:
          type: integer
          format: int64
        original_file:
          type: string
          description: Base64 of the original upload, up to 5 MB.
        original_filename:
          type: string
        original_content_type:
          type: string
        parse_map:
          type: [array, "null"]
          items:
            type: object
        revision:
          type: integer
          format: int64
          minimum: 1
        lines:
          type: array
          items:
            $ref: "#/components/schemas/QuoteLineRequest"
    QuoteLineRequest:
      type: object
      required: [unit_price_ten_thousandths]
      description: >-
        uom defaults to the product's sale unit when the line names a product; a line with neither uom nor product_id is a 400 naming lines[i].uom. sku and description default from product_id and are required without one. price_uom defaults to the product's price unit on a product line and to uom on the others. The pair is resolved by the server from the product's unit set on a product line (ADR 0006 section 3.3); a sent pair must equal the resolved one as a ratio. A line without a product carries the client's pair, required when the two units differ unless their standard sizes derive it. quantity is required unless the line carries a tally, whose linear feet are the quantity.
      properties:
        id:
          type: string
          format: uuid
        product_id:
          type: string
          format: uuid
        sku:
          type: string
        description:
          type: string
        customer_note:
          type: string
        quantity:
          $ref: "#/components/schemas/Quantity"
        uom:
          $ref: "#/components/schemas/QuoteUom"
        price_uom:
          type: string
          pattern: "^[A-Z]{1,6}$"
          description: A unit code of one to six capital letters; defaults to uom.
        uom_qty:
          $ref: "#/components/schemas/Quantity"
        price_uom_qty:
          $ref: "#/components/schemas/Quantity"
        unit_price_ten_thousandths:
          type: integer
          format: int64
          minimum: 0
        tally:
          $ref: "#/components/schemas/TallyRequest"
