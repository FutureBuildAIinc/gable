    PortalRefusal:
      type: object
      required: [error, meta]
      description: >-
        The 409 the portal writes for a recognised refusal: the standard error envelope's shape plus a hand-written, customer-safe reason under error.reason. Codes seen today: QUOTE_NOT_PRICED, DELIVERY_COMMITTED, ORDER_IN_MOTION, ORDER_ALREADY_CANCELLED, ORDER_NOT_CANCELLABLE.
