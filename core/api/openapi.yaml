          type: string
          description: Not read today.
        payment_method:
          type: string
          description: ACCOUNT or CARD; not read today.
        notes:
          type: string
          description: Not read today.
        project_id:
          type: [string, "null"]
          format: uuid
          description: Optional; when set it must be the caller's own project.
