      type: object
      required: [id, number, title, status, author_id, revision, created_at, updated_at, problem_statement, proposed_solution, content]
      description: >-
        Go type governance.RFC, the summary fields spelled out with the body behind them. content is generated by the provider at create and null only on rows the legacy seed wrote without one.
      properties:
        id:
          type: string
          format: uuid
        number:
          type: string
          description: The human readable document number (RFC-000001), minted from the sequence.
        title:
          type: string
        status:
          type: string
          enum: [draft, review, approved, rejected]
        author_id:
          type: [string, "null"]
          format: uuid
        revision:
          type: integer
          format: int64
