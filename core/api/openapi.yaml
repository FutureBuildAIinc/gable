          type: [string, "null"]
          format: date-time
        sent_at:
          type: [string, "null"]
          format: date-time
        accepted_at:
          type: [string, "null"]
          format: date-time
        rejected_at:
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
