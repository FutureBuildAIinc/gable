  /api/v1/quotes/{id}/file:
    put:
      operationId: quoteAttachFile
      tags: [quote]
      summary: Attach the AI parse's original file after promotion
      description: >-
        The raw file bytes with their content type, the same 5 MiB bound the create applies (413 above it): the quote draft never carries the file (every autosave re-sends the payload and every feed subscriber re-reads it), so the parse flow attaches it here, by the committer, right after a promotion. Accepted only while the quote is in status draft (else 409 with the quote_not_draft blocker), on the revision precondition; it replaces any file already stored, moves the quote's revision by one, returns the quote with its new ETag, and writes the quote.file_attached audit row and no outbox event.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/XBranchId"
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: The quote with its new revision and ETag.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "404":
          $ref: "#/components/responses/WireNotFound"
        "409":
          $ref: "#/components/responses/ConflictEither"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "428":
          $ref: "#/components/responses/WirePreconditionRequired"
        "500":
          $ref: "#/components/responses/InternalErrorEither"
    get:
      operationId: quoteDownloadOriginalFile
      tags: [quote]
      summary: Download the original uploaded file
      description: >-
        Streams the stored original upload of an AI sourced quote. The stored content type is echoed; the filename in Content-Disposition is sanitized. A quote with no stored file, or no such quote, is a 404.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/XBranchId"
      responses:
        "200":
          description: The file bytes; the stored content type is echoed.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "404":
          $ref: "#/components/responses/WireNotFound"
        "500":
          $ref: "#/components/responses/InternalErrorEither"
  /api/v1/reporting/builder/preview:
    post:
      operationId: reportingBuilderPreview
      tags: [reporting]
      summary: Run an ad hoc report definition and return the rows
      description: >-
        Roles admin, owner, finance. Builds a parameterised query from the definition over one of the entities invoices, orders or inventory and returns at most 1000 rows. A body that is not JSON is a 400. An unknown entity_type, a column, filter or grouping field outside the entity's whitelist, an unsupported aggregation or operator, an empty column list, or a database error are all 500 today. Filter operators are =, !=, >, <, >=, <= and LIKE (matched case insensitively as a contains); aggregations are SUM, COUNT, AVG, MIN and MAX.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportingBuilderRequest"
      responses:
        "200":
          description: The rows, or null when the query matched nothing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportingRows"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/ConflictEither"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/reporting/builder/export:
    post:
      operationId: reportingBuilderExport
      tags: [reporting]
      summary: Run an ad hoc report definition and download it as CSV or XLSX
      description: >-
        Roles admin, owner, finance. Runs the same query as the preview, then renders the rows with the requested columns. The query runs before the format is checked, so an unsupported format is a 400 only when the query itself succeeds; a failing query is a 500 whatever the format. The CSV header row uses each column's label (the field when the label is empty). The attachment file name is fixed.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportingBuilderExportRequest"
      responses:
        "200":
          description: The rendered report, chosen by the request's format.
          headers:
            Content-Disposition:
              description: 'attachment; filename="report.csv" or attachment; filename="report.xlsx".'
              schema:
                type: string
          content:
            text/csv:
              schema:
                type: string
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
