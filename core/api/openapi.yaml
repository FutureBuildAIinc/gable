    VisionBlueprintScanRequest:
      type: object
      description: >-
        Go type vision.BlueprintScanRequest (github.com/gablelbm/gable/internal/vision). Unknown fields are ignored.
      required: [blueprint_text]
      properties:
        blueprint_text:
          type: string
          minLength: 1
          description: Simulated text extracted from a blueprint PDF; empty is a 400.
        config_selections:
          type: [object, "null"]
          description: >-
            The configurator choices, keyed by name. The keys the comparison reads are Species, Dimensions (for example "2x6-10") and Treatment. Absent or null skips the mismatch check.
          additionalProperties:
            type: string
    VisionBlueprintScanResponse:
      type: object
      description: Go type vision.BlueprintScanResponse (github.com/gablelbm/gable/internal/vision).
      required: [extracted_dimensions, mismatches, summary]
      properties:
        extracted_dimensions:
          type: object
          description: >-
            Zero or more of cross_section ("2x4"), length ("10'"), stud_length ("10'"), spacing ("16\" OC"), species (SYP, Douglas Fir, Cedar, SPF, Hem-Fir) and treatment ("Treatable").
          additionalProperties:
            type: string
        mismatches:
          type: array
          items:
            $ref: "#/components/schemas/VisionMismatch"
        summary:
          type: string
    VisionMismatch:
      type: object
      description: Go type vision.Mismatch (github.com/gablelbm/gable/internal/vision).
      required: [field, blueprint_value, config_value, severity, message]
      properties:
        field:
          type: string
          description: Species, Dimensions, Length or Treatment.
        blueprint_value:
          type: string
        config_value:
          type: string
        severity:
          type: string
          enum: [warning, error]
        message:
          type: string

