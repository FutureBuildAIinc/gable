          $ref: "#/components/responses/ForbiddenEither"
        "404":
          $ref: "#/components/responses/WireNotFound"
        "409":
          $ref: "#/components/responses/WireConflict"
        "428":
          $ref: "#/components/responses/WirePreconditionRequired"
        "500":
          $ref: "#/components/responses/WireInternalError"
  /api/v1/drafts/quotes/{id}/promote:
    post:
      operationId: quotesDraftPromote
      tags: [draft]
      summary: Promote a quote draft, in one transaction
      description: >-
        The confirm: exactly the revision the committer read becomes a quote (428 without a precondition, 409 stale_revision on a moved one, 409 already_promoted on a keyless retry, 409 draft_discarded), born in status draft with its Q- number and quote.created, beside draft.promoted. The body carries nothing but the revision: what is committed is what was reviewed. A failure rolls the whole transaction back and the draft stays open at the same revision, with the module's own error carried out (payload.-prefixed fields on a 400, subject_stale added when the subject moved).
