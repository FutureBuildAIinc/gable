  /api/v1/pricing/calculate:
    get:
      operationId: pricingCalculate
      tags: [pricing]
      summary: Calculate a customer price for a product
      description: >-
        Guarded admin or owner. customer_id and product_id are required UUIDs. A non positive or unparseable quantity silently falls back to 1 and an unparseable job_id is silently ignored. A customer or product lookup failure of any kind (not only a missing row) answers 404.
      parameters:
        - name: customer_id
          in: query
          required: true
          schema: {type: string, format: uuid}
        - name: product_id
          in: query
          required: true
          schema: {type: string, format: uuid}
        - name: quantity
          in: query
          required: false
          description: Volume pricing quantity; default 1.
          schema: {type: number}
        - name: job_id
          in: query
          required: false
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: The calculated price.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PricingCalculatedPrice"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/pricing/rules:
    get:
      operationId: pricingRuleList
      tags: [pricing]
      summary: List pricing rules
      description: Guarded admin or owner. A bare array, unpaged; null when the table is empty.
      responses:
        "200":
          description: Every pricing rule.
          content:
            application/json:
              schema:
                type: [array, "null"]
                items:
                  $ref: "#/components/schemas/PricingRule"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: pricingRuleCreate
      tags: [pricing]
      summary: Create a pricing rule
      description: >-
        Guarded admin or owner. Only name and rule_type are validated. The server assigns id and both timestamps; is_active is not defaulted, so an omitted is_active is stored and echoed as false. Unknown rule_type values fail at the database and answer 500.
