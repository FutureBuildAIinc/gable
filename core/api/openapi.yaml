        Role guard admin or owner. The request carries float dollars; each amount is multiplied by 100 and rounded to int64 cents. Source is always MANUAL and status DRAFT. entry_date is optional (today when absent) and must be YYYY-MM-DD. Refused with 400: undecodable body, malformed entry_date, a negative debit or credit, a non UUID account_id, fewer than 2 lines, debits not equal to credits, all zero amounts, or a database refusal such as an unknown account.
      parameters:
