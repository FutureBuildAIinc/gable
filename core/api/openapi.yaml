    post:
      operationId: deliveryRouteOptimize
      tags: [delivery]
      summary: Optimize the stop order of a route
      description: >-
        Reorders the stops through the configured routing service and persists the new order and the per-stop ETAs; a route with no geocoded stops is returned unchanged. The routing and geocoding calls run before the transaction opens and the route's revision is re-checked inside it (If-Match, 428 without, 409 if the route moved meanwhile). A route with no deliveries answers the unchanged route. Writes the audit row and the event route.updated (data part stops). The response is the route document now, not the optimizer's intermediate result.
