#
# Gable API contract, assembled by core/api/tools/merge from the fragments
# in core/api/fragments/. Edit a fragment, never this file; regenerate with:
#
#	go run ./api/tools/merge
#
# The merge -check drift gate and the internal/apicontract coverage test
# both fail when this file and the fragments disagree.
openapi: 3.1.0
info:
  title: Gable API
  version: 1.0.0
  description: The HTTP surface of the Gable ERP core, transcribed route by route from the handlers as they behave today. Assembled from per module fragments; see docs/refactor/CONTRACT.md. The wire conventions of ADR 0001 land on these routes module by module, and each conversion edits the fragments in the same change.
security:
  - BearerJWT: []
tags:
  - name: customer
  - name: health
  - name: integration
  - name: invoice
  - name: location
  - name: order
  - name: partner
  - name: payment
  - name: portal
  - name: product
  - name: project
  - name: quote
  - name: uploads
paths:
  /api/v1/customers:
    get:
      operationId: customerList
      tags: [customer]
      summary: List customers
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/XBranchId"
      responses:
        "200":
          description: The page of customers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: customerCreate
      tags: [customer]
      summary: Create a customer
      parameters:
        - $ref: "#/components/parameters/XBranchId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Customer"
      responses:
        "201":
          description: The created customer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/customers/{id}:
    get:
      operationId: customerGet
      tags: [customer]
      summary: Get one customer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/XBranchId"
      responses:
        "200":
          description: The customer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/customers/{id}/salesperson:
    patch:
      operationId: customerUpdateSalesperson
      tags: [customer]
      summary: Assign or clear the salesperson
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerSalespersonUpdate"
      responses:
        "200":
          description: The updated customer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/customers/{id}/escalation-policy:
    get:
      operationId: customerGetEscalationPolicy
      tags: [customer]
      summary: Get the lumber index escalation policy
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/XBranchId"
      responses:
        "200":
          description: The policy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EscalationPolicy"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      operationId: customerSetEscalationPolicy
      tags: [customer]
      summary: Set the lumber index escalation policy
      description: >-
        Validation failures (a missing agreement reference, an invalid policy) are a 400; the reloaded row is returned so server side normalization is visible.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/XBranchId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EscalationPolicy"
      responses:
        "200":
          description: The reloaded policy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EscalationPolicy"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/customers/{customerId}/contacts:
    get:
      operationId: customerListContacts
      tags: [customer]
      summary: List a customer's contacts
      parameters:
        - name: customerId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/XBranchId"
      responses:
        "200":
          description: The contacts, a bare array that is null when the customer has none.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: customerCreateContact
      tags: [customer]
      summary: Create a contact
      parameters:
        - name: customerId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/XBranchId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Contact"
      responses:
        "201":
          description: The created contact.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/contacts/{id}:
    get:
      operationId: contactGet
      tags: [customer]
      summary: Get one contact
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/XBranchId"
      responses:
        "200":
          description: The contact.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: contactUpdate
      tags: [customer]
      summary: Update a contact
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/XBranchId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Contact"
      responses:
        "200":
          description: The updated contact.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: contactDelete
      tags: [customer]
      summary: Delete a contact
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/XBranchId"
      responses:
        "204":
          description: Deleted.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/price_levels:
    get:
      operationId: customerListPriceLevels
      tags: [customer]
      summary: List price levels
      parameters:
        - $ref: "#/components/parameters/XBranchId"
      responses:
        "200":
          description: All price levels, a bare array that is null when none exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriceLevelList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /healthz/live:
    get:
      operationId: healthLive
      tags: [health]
      summary: Liveness probe
      description: >-
        Always 200 if the process is running. Used by Kubernetes liveness; no dependency checks.
      security: []
      responses:
        "200":
          description: The process is alive.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: "ok"
  /healthz/ready:
    get:
      operationId: healthReady
      tags: [health]
      summary: Readiness probe
      description: >-
        Checks the database connection pool. Returns 200 when the pool is healthy; 503 Service Unavailable when Ping fails, with the same JSON body and status degraded.
      security: []
      responses:
        "200":
          description: The service is ready; db pool is connected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthReadyOK"
        "503":
          description: The service is degraded; db pool is disconnected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthReadyDegraded"
  /health:
    get:
      operationId: healthLegacy
      tags: [health]
      summary: Legacy health check
      description: >-
        Backward-compatible health endpoint. Checks the database pool Ping and returns the connectivity status. No request ID is generated.
      security: []
      responses:
        "200":
          description: The health with db status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthLegacy"
  /metrics:
    get:
      operationId: metricsPrometheus
      tags: [health]
      summary: Prometheus metrics
      description: >-
        The Prometheus scrape endpoint. By default serves the Prometheus text exposition format (text/plain; version=0.0.4; charset=utf-8). If the request carries an Accept header for application/openmetrics-text the endpoint serves the OpenMetrics format instead. Public: listed in the auth middleware PublicPaths so the scrape target can reach it without a token.
      security: []
      responses:
        "200":
          description: Prometheus text exposition format or OpenMetrics format.
          content:
            text/plain:
              schema:
                type: string
                description: Prometheus text exposition format; see https://prometheus.io/docs/instrumenting/exposition_formats/.
  /api/integration/products:
    get:
      operationId: integrationListProducts
      tags: [integration]
      summary: List catalog products with weight and geometry
      description: >-
        An unfiltered call is a bulk catalog pull with a raised cap; a filtered call is a typeahead search with a small cap. The two caps are server constants and not visible on the wire.
      security:
        - IntegrationKey: []
      parameters:
        - name: category
          in: query
          schema:
            type: string
        - name: q
          in: query
          schema:
            type: string
      responses:
        "200":
          description: The products, a bare array, never null.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationProductList"
        "401":
          $ref: "#/components/responses/IntegrationUnauthorized"
        "500":
          $ref: "#/components/responses/IntegrationServerError"
        "503":
          $ref: "#/components/responses/IntegrationUnavailable"
  /api/integration/quotes/bulk-price:
    post:
      operationId: integrationBulkPrice
      tags: [integration]
      summary: Price a basket of lines for one customer
      description: >-
        Money in and out is cents. Lines whose product cannot be resolved or priced are silently dropped from the response.
      security:
        - IntegrationKey: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IntegrationBulkPriceRequest"
      responses:
        "200":
          description: The priced lines, a bare array.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationPricedItemList"
        "400":
          $ref: "#/components/responses/IntegrationBadRequest"
        "401":
          $ref: "#/components/responses/IntegrationUnauthorized"
        "404":
          $ref: "#/components/responses/IntegrationNotFound"
        "500":
          $ref: "#/components/responses/IntegrationServerError"
        "503":
          $ref: "#/components/responses/IntegrationUnavailable"
  /api/integration/quotes:
    post:
      operationId: integrationCreateQuote
      tags: [integration]
      summary: Create a draft quote from priced lines
      description: >-
        Line unit prices arrive in cents and are stored as float dollars inside the quote module; the response total returns cents.
      security:
        - IntegrationKey: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IntegrationQuoteRequest"
      responses:
        "201":
          description: The created quote summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationQuoteResponse"
        "400":
          $ref: "#/components/responses/IntegrationBadRequest"
        "401":
          $ref: "#/components/responses/IntegrationUnauthorized"
        "500":
          $ref: "#/components/responses/IntegrationServerError"
        "503":
          $ref: "#/components/responses/IntegrationUnavailable"
  /api/integration/quotes/{id}/accept-and-convert:
    post:
      operationId: integrationAcceptAndConvert
      tags: [integration]
      summary: Accept a quote and convert it into a confirmed order
      description: >-
        One call creates the order, marks the quote accepted and confirms the order. A confirmation failure answers 409 with the order's id in the message; the order exists in DRAFT and confirmation can be retried.
      security:
        - IntegrationKey: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: The order summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationOrderResponse"
        "400":
          $ref: "#/components/responses/IntegrationBadRequest"
        "401":
          $ref: "#/components/responses/IntegrationUnauthorized"
        "409":
          $ref: "#/components/responses/IntegrationConflict"
        "500":
          $ref: "#/components/responses/IntegrationServerError"
        "503":
          $ref: "#/components/responses/IntegrationUnavailable"
  /api/integration/vehicles:
    get:
      operationId: integrationListVehicles
      tags: [integration]
      summary: List the active fleet
      security:
        - IntegrationKey: []
      responses:
        "200":
          description: The vehicles, a bare array, never null.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationVehicleList"
        "401":
          $ref: "#/components/responses/IntegrationUnauthorized"
        "500":
          $ref: "#/components/responses/IntegrationServerError"
        "503":
          $ref: "#/components/responses/IntegrationUnavailable"
  /api/integration/drivers:
    get:
      operationId: integrationListDrivers
      tags: [integration]
      summary: List the fleet's drivers
      security:
        - IntegrationKey: []
      responses:
        "200":
          description: The drivers, a bare array, never null.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationDriverList"
        "401":
          $ref: "#/components/responses/IntegrationUnauthorized"
        "500":
          $ref: "#/components/responses/IntegrationServerError"
        "503":
          $ref: "#/components/responses/IntegrationUnavailable"
  /api/integration/locations:
    get:
      operationId: integrationListLocations
      tags: [integration]
      summary: List the dealer's branches for route rooting
      description: >-
        A branch with null coordinates is returned anyway: the caller must see that the yard exists and has never been geocoded.
      security:
        - IntegrationKey: []
      responses:
        "200":
          description: The branches, a bare array, never null.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationLocationList"
        "401":
          $ref: "#/components/responses/IntegrationUnauthorized"
        "500":
          $ref: "#/components/responses/IntegrationServerError"
        "503":
          $ref: "#/components/responses/IntegrationUnavailable"
  /api/integration/orders:
    get:
      operationId: integrationListOrders
      tags: [integration]
      summary: List orders for a calendar date
      description: >-
        Both filters are optional; an unfiltered call returns the whole order book. A malformed date is a 400 rather than a cast failure.
      security:
        - IntegrationKey: []
      parameters:
        - name: date
          in: query
          schema:
            type: string
            format: date
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: The orders with their lines, a bare array, never null.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationOrderList"
        "400":
          $ref: "#/components/responses/IntegrationBadRequest"
        "401":
          $ref: "#/components/responses/IntegrationUnauthorized"
        "500":
          $ref: "#/components/responses/IntegrationServerError"
        "503":
          $ref: "#/components/responses/IntegrationUnavailable"
  /api/integration/delivery-routes:
    post:
      operationId: integrationCreateDeliveryRoute
      tags: [integration]
      summary: Write an approved delivery plan onto the dispatch board
      description: >-
        Idempotent on vehicle and date: a not yet dispatched route for that pair is replaced. The load manifest is opaque JSON persisted verbatim.
      security:
        - IntegrationKey: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IntegrationDeliveryRouteRequest"
      responses:
        "201":
          description: The acknowledgement.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationDeliveryRouteResponse"
        "400":
          $ref: "#/components/responses/IntegrationBadRequest"
        "401":
          $ref: "#/components/responses/IntegrationUnauthorized"
        "500":
          $ref: "#/components/responses/IntegrationServerError"
        "503":
          $ref: "#/components/responses/IntegrationUnavailable"
  /api/integration/validate-staff:
    post:
      operationId: integrationValidateStaff
      tags: [integration]
      summary: Report whether a staff member may use the integration
      description: >-
        A well formed request always answers 200: an unknown email is a non entitled result, not an error. The identity fields are omitted for unknown staff so attacker input is not echoed.
      security:
        - IntegrationKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IntegrationValidateStaffRequest"
      responses:
        "200":
          description: The entitlement result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationValidateStaffResponse"
        "400":
          $ref: "#/components/responses/IntegrationBadRequest"
        "401":
          $ref: "#/components/responses/IntegrationUnauthorized"
        "500":
          $ref: "#/components/responses/IntegrationServerError"
        "503":
          $ref: "#/components/responses/IntegrationUnavailable"
  /api/v1/invoices:
    get:
      operationId: invoiceList
      tags: [invoice]
      summary: List invoices
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/XBranchId"
      responses:
        "200":
          description: The page of invoices.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoicePage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/invoices/{id}:
    get:
      operationId: invoiceGet
      tags: [invoice]
      summary: Get one invoice with lines
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/XBranchId"
      responses:
        "200":
          description: The invoice.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/invoices/{id}/credit-memo:
    post:
      operationId: invoiceCreateCreditMemo
      tags: [invoice]
      summary: Create and apply a credit memo against an invoice
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/XBranchId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreditMemoCreateRequest"
      responses:
        "201":
          description: The created credit memo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditMemo"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/credit-memos/{customerId}:
    get:
      operationId: invoiceListCreditMemos
      tags: [invoice]
      summary: List a customer's credit memos
      parameters:
        - name: customerId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/XBranchId"
      responses:
        "200":
          description: The credit memos, a bare array that is null when the customer has none.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditMemoList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/locations:
    get:
      operationId: locationList
      tags: [location]
      summary: List every location node
      responses:
        "200":
