          format: uuid
        attribute_type:
          type: string
        attribute_value:
          type: string
        depends_on_type:
          type: string
        depends_on_value:
          type: string
        is_allowed:
          type: boolean
        error_message:
          type: [string, "null"]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ConfiguratorPreset:
      type: object
      required: [id, name, description, product_type, config, is_active, created_at, updated_at]
      description: >-
        One preset. config is the JSON the dealer stored, carried as JSON (it serialized as a base64 string before the conversion); description is present as null when the database value is null.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: [string, "null"]
        product_type:
