            type: integer
        - name: offset
          in: query
          schema:
            type: integer
        - name: index_code
          in: query
          schema:
            type: string
        - name: customer_id
          in: query
          schema:
            type: string
            format: uuid
        - name: min_dollars
          in: query
          description: A non negative dollar floor.
          schema:
            type: number
        - name: summary
