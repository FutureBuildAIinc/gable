          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/reporting/saved/{id}:
    get:
      operationId: reportingGetSavedReport
      tags: [reporting]
      summary: Get one saved report
      description: >-
        Roles admin, owner, finance. The id is not validated as a UUID; a malformed id and an id that does not exist are both a 500 today, never a 404.
      parameters:
        - name: id
          in: path
          required: true
          description: The saved report id; not validated as a UUID by the handler.
          schema:
            type: string
      responses:
        "200":
          description: The saved report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportingSavedReport"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      operationId: reportingUpdateSavedReport
      tags: [reporting]
      summary: Replace a saved report's name, description, entity and definition
      description: >-
        Roles admin, owner, finance. Answers 200 with an empty body (the updated report is not returned). Only name, description, entity_type and definition_json are written. An id that does not exist or is not a UUID is a 500, never a 404.
      parameters:
        - name: id
          in: path
          required: true
          description: The saved report id; not validated as a UUID by the handler.
          schema:
            type: string
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportingSavedReportInput"
      responses:
        "200":
          description: Updated; no body.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: reportingDeleteSavedReport
      tags: [reporting]
      summary: Delete a saved report
      description: >-
        Roles admin, owner, finance. Not covered by the idempotency layer. Deleting an id that does not exist is still a 204. A report that a schedule still references fails the foreign key and is a 500.
      parameters:
        - name: id
          in: path
          required: true
          description: The saved report id; not validated as a UUID by the handler.
