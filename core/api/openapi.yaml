      description: >-
        Roles admin, owner, sales (registered by internal/pricing). A caller with the sales role and a UUID subject sees only the customers that salesperson owns, and then by_salesperson is empty; every other caller sees the whole portfolio. Only quotes in SENT or ACCEPTED state whose exposure state is not OK count. by_customer is capped at 50 rows. summary=true trims the body to the three totals. The ExposureRow schema of the quote fragment is not used by this route.
