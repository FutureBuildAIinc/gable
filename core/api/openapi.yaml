                  $ref: "#/components/schemas/EdiCatalogEntry"
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/InternalError"}
  /api/v1/edi/partners/{id}/import-catalog:
    post:
      operationId: ediPartnerCatalogImport
      tags: [edi]
      summary: Import a catalog file for a partner
      description: >-
        Roles admin, owner. The request body is the raw file (50 MiB limit), not multipart. format=x12 (default, an 832 document) or format=csv; any other value is treated as x12 but echoed back as given. An unreadable file is a 422. Entries upsert on (partner, vendor_sku). The partner id is not looked up first, but catalog entries carry a foreign key to the partner: an unknown partner id answers 500 when at least one entry parses, and 200 with saved_count 0 when none does.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: format
          in: query
          required: false
          schema:
            type: string
            default: x12
            description: x12 or csv.
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          text/plain:
            schema:
              type: string
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Counts of parsed and saved entries.
          content:
            application/json:
              schema:
                type: object
                required: [partner_id, format, parsed_count, saved_count]
                properties:
                  partner_id:
                    type: string
                    format: uuid
                  format:
                    type: string
                  parsed_count:
                    type: integer
                  saved_count:
                    type: integer
        "400": {$ref: "#/components/responses/BadRequestEither"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/IdempotencyConflict"}
        "413": {$ref: "#/components/responses/PayloadTooLarge"}
        "422": {$ref: "#/components/responses/UnprocessableEntityEither"}
        "500": {$ref: "#/components/responses/InternalError"}
  /api/v1/events:
    get:
      operationId: eventsList
      tags: [events]
      summary: Read the event feed
      description: >-
        Events in commit order, paged by cursor. Role gated admin and owner; a machine key holding the events:read scope also reaches the feed (the role guard passes any key that clears the scope check). The feed is not branch scoped. Query parameters are exactly cursor, limit, types and include: any other name is a 400 unsupported_query_parameter, and a repeated include is a 400.
      parameters:
        - name: cursor
          in: query
          required: false
          description: >-
            The opaque next_cursor of an earlier page (ordering scope events.position). Absent means the first page; present but malformed is a 400 naming cursor.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Page size, 1 to 200. Malformed or out of range is a 400 naming limit.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: types
          in: query
          required: false
          description: >-
            Exact event types, comma separated and repeatable, each name once and dot-delimited lowercase (quote.exposure.flagged). A name that is malformed or repeated is a 400 validation_failed naming types; a filter matching nothing is an empty page.
          schema:
            type: string
        - name: include
          in: query
          required: false
          description: Comma separated expansions; only total is known. total adds the count of matching events.
          schema:
            type: string
            enum: [total]
      responses:
        "200":
          description: One page of events, oldest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventPage"
        "400":
          $ref: "#/components/responses/WireBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/WireInternalError"
  /api/v1/gl/accounts:
    get:
      operationId: glAccountList
      tags: [gl]
      summary: List the chart of accounts
      description: >-
        Every account ordered by code, with the posted balance (debit minus credit, cents) computed per account. Role guard admin or owner. The body is null when the chart is empty.
      responses:
        "200":
          description: The chart of accounts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GlAccountList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: glAccountCreate
      tags: [gl]
      summary: Create a GL account
      description: >-
        Role guard admin or owner. A missing code, a missing name, an invalid type, or a database refusal such as a duplicate code is a 400. A missing normal_balance defaults from the type (DEBIT for ASSET and EXPENSE, CREDIT otherwise). The account is always created active.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GlAccountRequest"
      responses:
        "201":
          description: The created account (balance is 0).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GlAccount"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /api/v1/gl/accounts/{id}:
    put:
      operationId: glAccountUpdate
      tags: [gl]
      summary: Replace a GL account
      description: >-
        Role guard admin or owner. Full replace of the editable columns; the account is always written active (is_active cannot be set false here). The row is not checked for existence: an unknown id still answers 200, echoing the request with a zero created_at (0001-01-01T00:00:00Z) and a zero balance. A non UUID id or an undecodable body is a 400; a database refusal is a 500.
      parameters:
        - name: id
