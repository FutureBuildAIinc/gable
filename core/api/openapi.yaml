    PortalQuote:
      type: object
      required: [id, status, erp_state, project_id, project_name, notes, priced, total_amount, freight_amount, delivery_type, expires_at, sent_at, accepted_at, rejected_at, created_at, updated_at, lines]
      description: >-
        A customer-facing quote. Status is the portal vocabulary and erp_state the raw ERP state, so a consumer can de-dup on what the dealer actually said.
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [REQUESTED, PRICED, ACCEPTED, DECLINED, EXPIRED]
          description: The portal projection of erp_state; an unrecognised ERP state passes through verbatim.
        erp_state:
          type: string
          enum: [DRAFT, SENT, ACCEPTED, REJECTED, EXPIRED]
        project_id:
          type: [string, "null"]
          format: uuid
        project_name:
          type: [string, "null"]
        notes:
          type: string
        priced:
          type: boolean
          description: False until the dealer sends the quote back; derived from the lifecycle, never from the total.
        total_amount:
          type: number
          description: Float dollars; 0.00 while priced is false and not a quotation.
        freight_amount:
          type: number
          description: Float dollars.
        delivery_type:
          type: string
          enum: [PICKUP, DELIVERY]
        expires_at:
          type: [string, "null"]
          format: date-time
        sent_at:
          type: [string, "null"]
          format: date-time
        accepted_at:
          type: [string, "null"]
          format: date-time
        rejected_at:
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        lines:
          type: array
          description: Never null.
          items:
            $ref: "#/components/schemas/PortalQuoteLine"
    PortalQuoteLine:
      type: object
      required: [id, product_id, product_sku, description, customer_note, quantity, uom, unit_price, line_total, is_special_order]
      properties:
        id:
          type: string
          format: uuid
        product_id:
          type: [string, "null"]
          format: uuid
          description: Null for a special-order line (a thing the dealer does not stock).
        product_sku:
          type: string
          description: SPECIAL-ORDER for a line with no product behind it.
        description:
          type: string
        customer_note:
          type: string
          description: What the contractor wrote when asking; never overwritten by the dealer's pricing pass.
        quantity:
          type: number
        uom:
          type: string
        unit_price:
          type: number
          description: Float dollars; 0 until the dealer prices the line.
        line_total:
          type: number
          description: Float dollars; 0 until the dealer prices the line.
        is_special_order:
          type: boolean
    PortalCreateQuoteRequest:
      type: object
      required: [lines]
      description: >-
        A scope, never a price: there is no money field. At least one line, at most 200; delivery_type defaults to PICKUP when absent.
      properties:
        project_id:
          type: [string, "null"]
          format: uuid
          description: Optional; when set it must be the caller's own project.
        notes:
          type: string
        delivery_type:
          type: string
          enum: [PICKUP, DELIVERY]
        lines:
          type: array
          items:
            $ref: "#/components/schemas/PortalQuoteRequestLine"
    PortalQuoteRequestLine:
      type: object
      required: [quantity]
      description: A catalog line (product_id set, dealer SKU and UOM snapshotted) or a special-order line (product_id null, description and uom required).
      properties:
        product_id:
          type: [string, "null"]
          format: uuid
        description:
          type: string
        quantity:
          type: number
        uom:
          type: string
          description: One of the uom_type values; uppercased and validated, unknown values are a 400.
        note:
          type: string
    PortalRescheduleRequest:
      type: object
      required: [requested_date]
      properties:
        requested_date:
          type: string
          description: YYYY-MM-DD, a calendar day; today or later, at most 365 days out.
        reason:
          type: string
    PortalDeliveryReschedule:
      type: object
      required: [id, delivery_id, order_id, requested_date, reason, status, applied, current_scheduled_date, resolution_note, created_at, updated_at]
      description: A recorded ask; the schedule itself is never changed by the portal.
      properties:
        id:
          type: string
          format: uuid
        delivery_id:
          type: string
          format: uuid
        order_id:
          type: string
          format: uuid
        requested_date:
          type: string
          description: The asked-for day, YYYY-MM-DD.
        reason:
          type: string
        status:
          type: string
          enum: [PENDING, APPLIED, DECLINED, SUPERSEDED]
        applied:
          type: boolean
          description: False for a PENDING request; the field to branch on.
        current_scheduled_date:
          type: [string, "null"]
          description: The dealer board's day, YYYY-MM-DD, or null when the stop is on no route.
        resolution_note:
          type: [string, "null"]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PortalInvite:
      type: object
      required: [id, customer_id, email, role, expires_at, created_at]
      description: A recorded invite; the token is never serialized.
      properties:
        id:
          type: string
          format: uuid
        customer_id:
          type: string
          format: uuid
        email:
          type: string
        role:
          type: string
          enum: [Admin, Buyer, View-Only]
        expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
    PortalInviteUserRequest:
      type: object
      required: [email, role]
      properties:
        email:
          type: string
        role:
          type: string
          enum: [Admin, Buyer, View-Only]
    PortalUpdateUserRoleRequest:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [Admin, Buyer, View-Only]
    PortalUpdateUserStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [Active, Inactive]
    UOM:
      type: string
      description: The database unit of measure vocabulary, verbatim.
      enum: [PCS, EA, LF, SF, BF, MBF, SQ, BOX, CTN, RL, GAL, LBS, BAG, BUNDLE, PAIR, SET]
    Product:
      type: object
      required: [id, sku, description, uom_primary, base_price, vendor, vendor_id, upc, weight_lbs, length_in, width_in, height_in, stackable, geometry_source, reorder_point, reorder_qty, total_quantity, total_allocated, average_unit_cost, target_margin, commission_rate, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        sku:
          type: string
        description:
          type: string
        uom_primary:
          $ref: "#/components/schemas/UOM"
        base_price:
          type: number
          description: Float dollars.
        vendor:
          type: [string, "null"]
          description: Denormalized display name.
        vendor_id:
          type: [string, "null"]
          format: uuid
        upc:
          type: [string, "null"]
        weight_lbs:
          type: number
        length_in:
          type: [number, "null"]
          description: Inches; null when the PIM has no geometry for the SKU.
        width_in:
          type: [number, "null"]
        height_in:
          type: [number, "null"]
        stackable:
          type: [boolean, "null"]
        geometry_source:
          type: [string, "null"]
        reorder_point:
          type: number
        reorder_qty:
          type: number
        total_quantity:
          type: number
          description: Aggregated from inventory.
        total_allocated:
          type: number
        average_unit_cost:
          type: number
          description: Float dollars.
        target_margin:
          type: number
        commission_rate:
          type: number
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ProductPage:
      type: object
      required: [data, total, limit, offset]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Product"
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
    Geometry:
      type: object
      description: >-
        The mutable parametric geometry slice; every field is always present and nullable on purpose (nil means not recorded, zero is a recorded zero).
      required: [length_in, width_in, height_in, stackable, geometry_source]
      properties:
        length_in:
          type: [number, "null"]
        width_in:
          type: [number, "null"]
        height_in:
          type: [number, "null"]
        stackable:
          type: [boolean, "null"]
        geometry_source:
          type: [string, "null"]
    ReorderAlert:
      type: object
      required: [product_id, sku, description, vendor, vendor_id, reorder_point, reorder_qty, current_stock, deficit]
      properties:
        product_id:
          type: string
          format: uuid
        sku:
          type: string
        description:
          type: string
        vendor:
          type: [string, "null"]
        vendor_id:
          type: [string, "null"]
          format: uuid
        reorder_point:
          type: number
        reorder_qty:
          type: number
        current_stock:
          type: number
        deficit:
          type: number
    ReorderAlertList:
      type: [array, "null"]
      items:
        $ref: "#/components/schemas/ReorderAlert"
    ProductMarginUpdate:
      type: object
      required: [target_margin, commission_rate]
      properties:
        target_margin:
          type: number
        commission_rate:
          type: number
    ProductLeadTimeUpdate:
      type: object
      required: [lead_time_days]
      properties:
        lead_time_days:
          type: [integer, "null"]
          description: Days; null clears to unpublished, zero asserts same day.
    Project:
      type: object
      required: [id, customer_id, name, status, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        customer_id:
          type: string
          format: uuid
        name:
          type: string
        status:
          type: string
          enum: [Active, Completed]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ProjectDashboard:
      type: object
      required: [project, orders, deliveries, invoices]
      properties:
        project:
          $ref: "#/components/schemas/Project"
        orders:
          type: array
          description: The project's orders, newest first, never null.
          items:
            $ref: "#/components/schemas/ProjectItem"
        deliveries:
          type: array
          description: The stops of the project's orders, newest first, never null.
          items:
            $ref: "#/components/schemas/ProjectItem"
        invoices:
          type: array
          description: The invoices of the project's orders, newest first, never null.
          items:
            $ref: "#/components/schemas/ProjectItem"
    ProjectItem:
      type: object
      required: [id, type, status, created_at]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [ORDER, DELIVERY, INVOICE]
        status:
          type: string
        total_amount:
          type: number
          description: Float dollars; omitted when zero.
        created_at:
          type: string
          format: date-time
        reference:
          type: string
          description: A human label such as "Order 1a2b3c4d"; omitted when empty.
    ProjectCreateRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
    ProjectUpdateRequest:
      type: object
      description: "Partial: only the fields present are applied."
      properties:
        name:
          type: string
        status:
          type: string
          enum: [Active, Completed]
    QuoteState:
      type: string
      enum: [DRAFT, SENT, ACCEPTED, REJECTED, EXPIRED]
      description: "Today's lifecycle vocabulary: the field is named state and the values are UPPERCASE."
    Quote:
      type: object
      required: [id, branch_id, customer_id, state, total_amount, created_at, updated_at, delivery_type, freight_amount, margin_total, source, exposure_state, exposure_dollars]
      properties:
        id:
          type: string
          format: uuid
        branch_id:
          type: string
          format: uuid
        customer_id:
          type: string
          format: uuid
        customer_name:
          type: string
        job_id:
          type: string
          format: uuid
        state:
          $ref: "#/components/schemas/QuoteState"
        total_amount:
          type: number
          description: Float dollars. The order and invoice modules carry cents; this module does not.
        expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        sent_at:
          type: string
          format: date-time
        accepted_at:
          type: string
          format: date-time
        rejected_at:
          type: string
          format: date-time
        delivery_type:
          type: string
          enum: [PICKUP, DELIVERY]
        freight_amount:
          type: number
          description: Float dollars.
        vehicle_id:
          type: string
          format: uuid
        vehicle_name:
          type: string
        margin_total:
          type: number
        source:
          type: string
          enum: [manual, ai]
        original_filename:
          type: string
        original_content_type:
          type: string
        parse_map:
          description: The AI parse mapping, arbitrary JSON.
        exposure_state:
          type: string
          description: The price protection rollup state; OK when no escalator is active.
        exposure_dollars:
          type: number
        exposure_last_checked_at:
          type: string
          format: date-time
        lines:
          type: array
          items:
            $ref: "#/components/schemas/QuoteLine"
    QuoteLine:
      type: object
      required: [id, quote_id, product_id, sku, description, quantity, uom, unit_price, unit_cost, line_total, created_at]
      properties:
        id:
          type: string
          format: uuid
        quote_id:
          type: string
          format: uuid
        product_id:
          type: string
          format: uuid
        sku:
          type: string
        description:
          type: string
        customer_note:
          type: string
          description: What a portal user asked for when requesting this line.
        quantity:
          type: number
        uom:
          type: string
          enum: [PCS, EA, LF, SF, BF, MBF, SQ, BOX, CTN, RL, GAL, LBS, BAG, BUNDLE, PAIR, SET]
        unit_price:
          type: number
          description: Float dollars per the line's uom.
        unit_cost:
          type: number
          description: Float dollars.
        line_total:
          type: number
          description: Float dollars.
        created_at:
          type: string
          format: date-time
    QuoteCreateRequest:
      type: object
      description: >-
        The create and update body: the full quote shape plus the base64 original upload. Decoding is lenient and validation happens late, so most invalid payloads surface as 500 today.
      required: [customer_id]
      properties:
        branch_id:
          type: string
          format: uuid
        customer_id:
          type: string
          format: uuid
        customer_name:
          type: string
        job_id:
          type: string
          format: uuid
        state:
          $ref: "#/components/schemas/QuoteState"
        total_amount:
          type: number
        expires_at:
          type: string
          format: date-time
        delivery_type:
          type: string
          enum: [PICKUP, DELIVERY]
        freight_amount:
          type: number
        vehicle_id:
          type: string
          format: uuid
        vehicle_name:
          type: string
        source:
          type: string
          enum: [manual, ai]
        original_file:
          type: string
          description: Base64 of the original upload; over 5 MiB decoded is a 400.
        lines:
          type: array
          items:
            $ref: "#/components/schemas/QuoteLineInput"
    QuoteLineInput:
      type: object
      required: [product_id, quantity, uom, unit_price]
      properties:
        product_id:
          type: string
          format: uuid
        sku:
          type: string
        description:
          type: string
        quantity:
          type: number
        uom:
          type: string
          enum: [PCS, EA, LF, SF, BF, MBF, SQ, BOX, CTN, RL, GAL, LBS, BAG, BUNDLE, PAIR, SET]
        unit_price:
          type: number
        unit_cost:
          type: number
        customer_note:
          type: string
    QuoteStateUpdate:
      type: object
      required: [state]
      properties:
        state:
          $ref: "#/components/schemas/QuoteState"
    QuoteOrderPayload:
      type: object
      required: [customer_id, quote_id, lines]
      description: What POST /api/v1/orders expects, except price_each here is float dollars while the order route expects cents.
      properties:
        customer_id:
          type: string
          format: uuid
        quote_id:
          type: string
          format: uuid
        lines:
          type: array
          items:
            type: object
            required: [product_id, quantity, price_each]
            properties:
              product_id:
                type: string
                format: uuid
              quantity:
                type: number
              price_each:
                type: number
                description: Float dollars.
    QuotePage:
      type: object
      required: [data, total, limit, offset]
      description: Today's offset page envelope; data is never null on this route (the handler substitutes an empty array).
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Quote"
        total:
