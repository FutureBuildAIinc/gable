        limit:
          type: integer
        offset:
          type: integer
    CustomerSalespersonUpdate:
      type: object
      required: [salesperson_id]
      properties:
        salesperson_id:
          type: [string, "null"]
          format: uuid
          description: The salesperson to assign, or null to clear.
    PriceLevel:
      type: object
