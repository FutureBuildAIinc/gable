          type: [string, "null"]
          format: uuid
        project_name:
          type: [string, "null"]
        notes:
          type: string
        priced:
          type: boolean
          description: False until the dealer sends the quote back; derived from the lifecycle, never from the total.
        total_amount:
          type: number
          description: Float dollars; 0.00 while priced is false and not a quotation.
        freight_amount:
          type: number
          description: Float dollars.
        delivery_type:
          type: string
          enum: [PICKUP, DELIVERY]
        expires_at:
          type: [string, "null"]
          format: date-time
        sent_at:
          type: [string, "null"]
          format: date-time
        accepted_at:
          type: [string, "null"]
          format: date-time
        rejected_at:
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
