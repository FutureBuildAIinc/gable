        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /api/v1/governance/rfcs:
    get:
      operationId: governanceListRFCs
      tags: [governance]
      summary: List RFCs
      description: >-
        The cursor list envelope, newest first, one summary per RFC (the body never rides the list). status filters on the lowercase vocabulary (a comma separated list); total appears only under include=total. A parameter the route does not declare, a status outside the vocabulary (uppercase included), a malformed cursor or an out of range limit is a 400.
      parameters:
        - name: status
          in: query
          required: false
          description: Comma separated lowercase statuses (draft, review, approved, rejected).
          schema:
            type: string
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Include"
      responses:
        "200":
          description: The page of RFC summaries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RFCPage"
        "400": {$ref: "#/components/responses/WireBadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/WireInternalError"}
    post:
      operationId: governanceCreateRFC
      tags: [governance]
      summary: Draft an RFC
      description: >-
        Creates an RFC in draft. The content is generated from the triple by the provider (a template today), never sent by the client; a request carrying content, status or revision is a 400 naming the field. The number is minted from the sequence (RFC-000001), the create, its audit row and rfc.created are one transaction, and the answer carries the revision and its ETag.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GovernanceCreateRFCRequest"
      responses:
        "201":
          description: The drafted RFC.
          headers:
            Location:
              description: The new RFC's own URL.
              schema:
                type: string
            ETag:
              description: The revision (1) in quotes.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RFC"
        "400": {$ref: "#/components/responses/WireBadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/WireConflict"}
        "413": {$ref: "#/components/responses/PayloadTooLarge"}
        "422": {$ref: "#/components/responses/UnprocessableEntity"}
        "500": {$ref: "#/components/responses/WireInternalError"}
        "503": {$ref: "#/components/responses/WireUnavailable"}
  /api/v1/governance/rfcs/{id}:
    get:
      operationId: governanceGetRFC
      tags: [governance]
      summary: Read one RFC
      description: The full document with its revision and ETag.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The RFC.
          headers:
            ETag:
              description: The revision in quotes.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RFC"
        "400": {$ref: "#/components/responses/WireBadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/WireNotFound"}
        "500": {$ref: "#/components/responses/WireInternalError"}
    put:
      operationId: governanceUpdateRFC
      tags: [governance]
      summary: Update an RFC
      description: >-
        Every editable field is optional: nil leaves it alone. status moves through the transitions route (a request carrying it is a 400 naming it and pointing there); author_id is set once at create. Takes If-Match or the body revision (428 without, 409 stale) and answers the document with its new revision and ETag. An RFC under review may still be edited; an approved or rejected one refuses the edit with a 409 blocker until it is reopened.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: If-Match
          in: header
          required: false
          description: The revision this write preconditions on, quoted ("3"); the weak form is accepted.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GovernanceUpdateRFCRequest"
      responses:
        "200":
          description: The RFC after the update.
          headers:
            ETag:
              description: The new revision in quotes.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RFC"
        "400": {$ref: "#/components/responses/WireBadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/WireNotFound"}
        "409": {$ref: "#/components/responses/WireConflict"}
        "413": {$ref: "#/components/responses/PayloadTooLarge"}
        "422": {$ref: "#/components/responses/UnprocessableEntity"}
        "428": {$ref: "#/components/responses/WirePreconditionRequired"}
        "500": {$ref: "#/components/responses/WireInternalError"}
  /api/v1/governance/rfcs/{id}/transitions:
    post:
      operationId: governanceTransitionRFC
      tags: [governance]
      summary: Move an RFC along its lifecycle
      description: >-
        The allowed edges are draft to review, review to approved, review to rejected and rejected back to draft (a reopen); approved is terminal. A forbidden edge is a 409 invalid_state_transition. Takes If-Match or the body revision like every write, and writes the transition's event (rfc.review, rfc.approved, rfc.rejected, rfc.reopened).
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: If-Match
          in: header
          required: false
          description: The revision this write preconditions on, quoted.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GovernanceTransitionRequest"
      responses:
        "200":
          description: The RFC after the transition.
          headers:
            ETag:
              description: The new revision in quotes.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RFC"
        "400": {$ref: "#/components/responses/WireBadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/WireNotFound"}
        "409": {$ref: "#/components/responses/WireConflict"}
        "413": {$ref: "#/components/responses/PayloadTooLarge"}
        "422": {$ref: "#/components/responses/UnprocessableEntity"}
        "428": {$ref: "#/components/responses/WirePreconditionRequired"}
        "500": {$ref: "#/components/responses/WireInternalError"}
  /healthz/live:
    get:
      operationId: healthLive
      tags: [health]
      summary: Liveness probe
      description: >-
        Always 200 if the process is running. Used by Kubernetes liveness; no dependency checks.
      security: []
      responses:
        "200":
          description: The process is alive.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: "ok"
  /healthz/ready:
    get:
      operationId: healthReady
      tags: [health]
      summary: Readiness probe
      description: >-
        Checks the database connection pool. Returns 200 when the pool is healthy; 503 Service Unavailable when Ping fails, with the same JSON body and status degraded.
      security: []
      responses:
        "200":
          description: The service is ready; db pool is connected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthReadyOK"
        "503":
          description: The service is degraded; db pool is disconnected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthReadyDegraded"
  /health:
    get:
      operationId: healthLegacy
      tags: [health]
      summary: Legacy health check
      description: >-
        Backward-compatible health endpoint. Checks the database pool Ping and returns the connectivity status. No request ID is generated.
      security: []
      responses:
        "200":
          description: The health with db status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthLegacy"
  /metrics:
    get:
      operationId: metricsPrometheus
      tags: [health]
      summary: Prometheus metrics
      description: >-
        The Prometheus scrape endpoint. By default serves the Prometheus text exposition format (text/plain; version=0.0.4; charset=utf-8). If the request carries an Accept header for application/openmetrics-text the endpoint serves the OpenMetrics format instead. Public: listed in the auth middleware PublicPaths so the scrape target can reach it without a token.
      security: []
      responses:
        "200":
          description: Prometheus text exposition format or OpenMetrics format.
          content:
            text/plain:
              schema:
                type: string
                description: Prometheus text exposition format; see https://prometheus.io/docs/instrumenting/exposition_formats/.
