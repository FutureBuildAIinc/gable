#
# Gable API contract, assembled by core/api/tools/merge from the fragments
# in core/api/fragments/. Edit a fragment, never this file; regenerate with:
#
#	go run ./api/tools/merge
#
# The merge -check drift gate and the internal/apicontract coverage test
# both fail when this file and the fragments disagree.
openapi: 3.1.0
info:
  title: Gable API
  version: 1.0.0
  description: The HTTP surface of the Gable ERP core, transcribed route by route from the handlers as they behave today. Assembled from per module fragments; see docs/refactor/CONTRACT.md. The wire conventions of ADR 0001 land on these routes module by module, and each conversion edits the fragments in the same change.
security:
  - BearerJWT: []
tags:
  - name: ap
  - name: bankrecon
  - name: customer
  - name: edi
  - name: gl
  - name: health
  - name: integration
  - name: invoice
  - name: location
  - name: marketIndex
  - name: matching
  - name: order
  - name: partner
  - name: payment
  - name: portal
  - name: pricing
  - name: product
  - name: project
  - name: purchaseOrder
  - name: quote
  - name: tax
  - name: uploads
paths:
  /api/v1/ap/invoices:
    get:
      operationId: apInvoiceList
      tags: [ap]
      summary: List vendor invoices
      description: >-
        Role guard admin, owner or finance. Optional filters vendor_id (an unparseable value is ignored, not refused) and status (free text, compared as given). No paging parameters exist; limit and offset are silently ignored. Never null. Lines are not included.
      parameters:
        - name: vendor_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          required: false
          description: Invoice status filter, for example PENDING, APPROVED, PARTIAL, PAID or VOIDED.
          schema:
            type: string
      responses:
        "200":
          description: The vendor invoices, ordered by due_date ascending (earliest due first).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApVendorInvoice"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: apInvoiceCreate
      tags: [ap]
      summary: Enter a vendor invoice
      description: >-
        Role guard admin, owner or finance. The request carries float dollars; subtotal, tax and line amounts are converted to int64 cents. The invoice starts PENDING with nothing paid. Only an undecodable body is a 400; a malformed invoice_date or due_date or any database refusal (unknown vendor, duplicate number) is a 500. The echo omits vendor_name and lines.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApCreateVendorInvoiceRequest"
      responses:
        "201":
          description: The created invoice.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApVendorInvoice"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/ap/invoices/{id}:
    get:
      operationId: apInvoiceGet
      tags: [ap]
      summary: Get one vendor invoice with lines
      description: >-
        Role guard admin, owner or finance. Any service failure, not only a missing row, is a 404. lines is omitted when the invoice has none.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The invoice with vendor_name and lines.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApVendorInvoice"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/ap/invoices/{id}/approve:
    post:
      operationId: apInvoiceApprove
      tags: [ap]
      summary: Approve a pending vendor invoice
      description: >-
        Role guard admin, owner or finance. No body. The approver is the subject of the caller's JWT claims; with no claims, or a subject that is not a UUID, the handler answers 401 itself (so in AUTH_MODE=dev, which carries no claims, this route is always 401). Only a PENDING invoice can be approved. Every service failure, including an unknown id, a non pending status or a failed GL sync, is a 422. The response carries vendor_name, approved_by and approved_at but not lines.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: The approved invoice.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApVendorInvoice"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /api/v1/ap/payments:
    get:
      operationId: apPaymentList
      tags: [ap]
      summary: List vendor payments
      description: >-
        Role guard admin, owner or finance. Optional vendor_id filter (an unparseable value is ignored). No paging. Never null.
      parameters:
        - name: vendor_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The vendor payments.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApPayment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: apPaymentCreate
      tags: [ap]
      summary: Pay a vendor
      description: >-
        Role guard admin, owner or finance. The amount is float dollars, converted to int64 cents. The payment is created COMPLETE and applied in order to the listed invoices up to each one's outstanding balance, then synced to the GL. Only an undecodable body is a 400; a malformed payment_date, an unknown invoice or any GL failure is a 500.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApCreatePaymentRequest"
      responses:
        "201":
          description: The created payment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApPayment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/ap/aging:
    get:
      operationId: apAging
      tags: [ap]
      summary: AP aging by vendor
      description: >-
        Role guard admin, owner or finance. One row per vendor with open balances in int64 cents buckets. Never null.
      responses:
        "200":
          description: The aging rows.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApAgingSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/bankrecon/accounts:
    get:
      operationId: bankreconAccountList
      tags: [bankrecon]
      summary: List bank accounts
      description: Role guard admin, owner or finance. Never null.
      responses:
        "200":
          description: The bank accounts.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BankreconBankAccount"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: bankreconAccountCreate
      tags: [bankrecon]
      summary: Create a bank account
      description: >-
        Role guard admin, owner or finance. Always created active. Only an undecodable body is a 400; a database refusal such as an unknown gl_account_id is a 500.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BankreconCreateBankAccountRequest"
      responses:
        "201":
          description: The created bank account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BankreconBankAccount"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/bankrecon/import:
    post:
      operationId: bankreconImport
      tags: [bankrecon]
      summary: Import a bank statement CSV
      description: >-
        Role guard admin, owner or finance. csv_content is the CSV text; the first line is skipped as a header and rows are date, amount, description, reference. Unparseable rows are counted as skipped, not refused, and unmatched transactions are then auto matched to posted journal entries within a day and a half and equal amount. Always 200 once the body decodes.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BankreconImportRequest"
      responses:
        "200":
          description: The import counts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BankreconImportResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/bankrecon/match:
    post:
      operationId: bankreconMatch
      tags: [bankrecon]
      summary: Match a bank transaction to a journal entry
      description: >-
        Role guard admin, owner or finance. An unknown transaction or journal entry is a 500, not a 404.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BankreconMatchRequest"
      responses:
        "200":
          description: Matched. The body is a one key object with status "matched".
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BankreconStatusResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/bankrecon/unmatch:
    post:
      operationId: bankreconUnmatch
      tags: [bankrecon]
      summary: Clear the match on a bank transaction
      description: >-
        Role guard admin, owner or finance. An unknown transaction is a 500, not a 404.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BankreconUnmatchRequest"
      responses:
        "200":
          description: Unmatched. The body is a one key object with status "unmatched".
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BankreconStatusResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/bankrecon/sessions:
    get:
      operationId: bankreconSessionList
      tags: [bankrecon]
      summary: List reconciliation sessions
      description: >-
        Role guard admin, owner or finance. Optional bank_account_id filter (an unparseable value is ignored). No paging. Never null. Transactions are not included.
      parameters:
        - name: bank_account_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The sessions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BankreconSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: bankreconSessionCreate
      tags: [bankrecon]
      summary: Start a reconciliation session
      description: >-
        Role guard admin, owner or finance. statement_balance is float dollars today, stored as int64 cents. The session starts IN_PROGRESS. Only an undecodable body is a 400; malformed period dates or a database refusal are 500. The echo omits bank_account_name.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BankreconCreateSessionRequest"
      responses:
        "201":
          description: The created session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BankreconSession"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/bankrecon/sessions/{id}:
    get:
      operationId: bankreconSessionGet
      tags: [bankrecon]
      summary: Get a session with its transactions
      description: >-
        Role guard admin, owner or finance. Any service failure, not only a missing row, is a 404. The cleared and outstanding summary is recalculated from the transactions on every read. transactions is omitted when the session has none.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BankreconSession"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/bankrecon/sessions/{id}/complete:
    post:
      operationId: bankreconSessionComplete
      tags: [bankrecon]
      summary: Complete a reconciliation session
      description: >-
        Role guard admin, owner or finance. No body. completed_by is the caller's JWT subject when it parses as a UUID, else omitted. Every service failure, including an unknown id or an already completed session, is a 422.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: The completed session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BankreconSession"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /api/v1/customers:
    get:
      operationId: customerList
      tags: [customer]
      summary: List customers
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/XBranchId"
      responses:
        "200":
          description: The page of customers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: customerCreate
      tags: [customer]
      summary: Create a customer
      parameters:
        - $ref: "#/components/parameters/XBranchId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Customer"
      responses:
        "201":
          description: The created customer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/customers/{id}:
    get:
      operationId: customerGet
      tags: [customer]
      summary: Get one customer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/XBranchId"
      responses:
        "200":
          description: The customer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/customers/{id}/salesperson:
    patch:
      operationId: customerUpdateSalesperson
      tags: [customer]
      summary: Assign or clear the salesperson
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerSalespersonUpdate"
      responses:
        "200":
          description: The updated customer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/customers/{id}/escalation-policy:
    get:
      operationId: customerGetEscalationPolicy
      tags: [customer]
      summary: Get the lumber index escalation policy
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/XBranchId"
      responses:
        "200":
          description: The policy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EscalationPolicy"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      operationId: customerSetEscalationPolicy
      tags: [customer]
      summary: Set the lumber index escalation policy
      description: >-
        Validation failures (a missing agreement reference, an invalid policy) are a 400; the reloaded row is returned so server side normalization is visible.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/XBranchId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EscalationPolicy"
      responses:
        "200":
          description: The reloaded policy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EscalationPolicy"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/customers/{customerId}/contacts:
    get:
      operationId: customerListContacts
      tags: [customer]
      summary: List a customer's contacts
      parameters:
        - name: customerId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/XBranchId"
      responses:
        "200":
          description: The contacts, a bare array that is null when the customer has none.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: customerCreateContact
      tags: [customer]
      summary: Create a contact
      parameters:
        - name: customerId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/XBranchId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Contact"
      responses:
        "201":
          description: The created contact.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/contacts/{id}:
    get:
      operationId: contactGet
      tags: [customer]
      summary: Get one contact
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/XBranchId"
      responses:
        "200":
          description: The contact.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: contactUpdate
      tags: [customer]
      summary: Update a contact
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/XBranchId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Contact"
      responses:
        "200":
          description: The updated contact.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: contactDelete
      tags: [customer]
      summary: Delete a contact
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/XBranchId"
      responses:
        "204":
          description: Deleted.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/price_levels:
    get:
      operationId: customerListPriceLevels
      tags: [customer]
      summary: List price levels
      parameters:
        - $ref: "#/components/parameters/XBranchId"
      responses:
        "200":
          description: All price levels, a bare array that is null when none exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriceLevelList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/edi/partners:
    get:
      operationId: ediPartnerList
      tags: [edi]
      summary: List trading partners
      description: Roles admin, owner. Ordered by name, unpaged, never null.
      responses:
        "200":
          description: The trading partners.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EdiTradingPartner"
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/InternalError"}
    post:
      operationId: ediPartnerCreate
      tags: [edi]
      summary: Create a trading partner
      description: >-
        Roles admin, owner. name is required (400 when empty). Defaults filled when empty: transport_config "{}", edi_version "004010", transport_type "SFTP", supported_documents ["832","846","850"]. A transport_config that is not valid JSON fails at the database cast and is a 500. is_active defaults to false.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EdiTradingPartner"
      responses:
        "201":
          description: The created partner with server filled id and timestamps.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EdiTradingPartner"
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/InternalError"}
  /api/v1/edi/partners/{id}:
    delete:
      operationId: ediPartnerDelete
      tags: [edi]
      summary: Delete a trading partner
      description: >-
        Roles admin, owner. A hard delete. An unknown id still answers 204.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: The partner is gone (or never existed).
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/InternalError"}
    get:
      operationId: ediPartnerGet
      tags: [edi]
      summary: Get one trading partner
      description: Roles admin, owner. Adds the count of catalog entries.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The partner with its catalog count.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EdiTradingPartnerDetail"
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    put:
      operationId: ediPartnerUpdate
      tags: [edi]
      summary: Replace a trading partner
      description: >-
        Roles admin, owner. A full replace of every field; an omitted field is written as its zero value, and an empty transport_config fails the JSON cast and is a 500. The response echoes the submitted body with the path id and a fresh updated_at; created_at is whatever the body carried (the zero time when omitted) and an omitted supported_documents echoes as null. An unknown id is a 404.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EdiTradingPartner"
      responses:
        "200":
          description: The echoed partner.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EdiTradingPartner"
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/InternalError"}
  /api/v1/edi/partners/{id}/catalog:
    get:
      operationId: ediPartnerCatalogList
      tags: [edi]
      summary: List a partner's catalog entries
      description: >-
        Roles admin, owner. Ordered by vendor_sku, capped at 200, never null. An unknown partner answers an empty array.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The catalog entries.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EdiCatalogEntry"
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/InternalError"}
  /api/v1/edi/partners/{id}/import-catalog:
    post:
      operationId: ediPartnerCatalogImport
      tags: [edi]
      summary: Import a catalog file for a partner
      description: >-
        Roles admin, owner. The request body is the raw file (50 MiB limit), not multipart. format=x12 (default, an 832 document) or format=csv; any other value is treated as x12 but echoed back as given. An unreadable file is a 422. Entries upsert on (partner, vendor_sku). The partner id is not looked up first, but catalog entries carry a foreign key to the partner: an unknown partner id answers 500 when at least one entry parses, and 200 with saved_count 0 when none does.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: format
          in: query
          required: false
          schema:
            type: string
            default: x12
            description: x12 or csv.
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          text/plain:
            schema:
              type: string
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Counts of parsed and saved entries.
          content:
            application/json:
              schema:
                type: object
                required: [partner_id, format, parsed_count, saved_count]
                properties:
                  partner_id:
                    type: string
                    format: uuid
                  format:
                    type: string
                  parsed_count:
                    type: integer
                  saved_count:
                    type: integer
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422": {$ref: "#/components/responses/UnprocessableEntity"}
        "500": {$ref: "#/components/responses/InternalError"}
  /api/v1/gl/accounts:
    get:
      operationId: glAccountList
      tags: [gl]
      summary: List the chart of accounts
      description: >-
        Every account ordered by code, with the posted balance (debit minus credit, cents) computed per account. Role guard admin or owner. The body is null when the chart is empty.
      responses:
        "200":
          description: The chart of accounts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GlAccountList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: glAccountCreate
      tags: [gl]
      summary: Create a GL account
      description: >-
        Role guard admin or owner. A missing code, a missing name, an invalid type, or a database refusal such as a duplicate code is a 400. A missing normal_balance defaults from the type (DEBIT for ASSET and EXPENSE, CREDIT otherwise). The account is always created active.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GlAccountRequest"
      responses:
        "201":
          description: The created account (balance is 0).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GlAccount"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/gl/accounts/{id}:
    put:
      operationId: glAccountUpdate
      tags: [gl]
      summary: Replace a GL account
      description: >-
        Role guard admin or owner. Full replace of the editable columns; the account is always written active (is_active cannot be set false here). The row is not checked for existence: an unknown id still answers 200, echoing the request with a zero created_at (0001-01-01T00:00:00Z) and a zero balance. A non UUID id or an undecodable body is a 400; a database refusal is a 500.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GlAccountRequest"
      responses:
        "200":
          description: The account as written, not re-read.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GlAccount"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/gl/journal-entries:
    get:
      operationId: glJournalEntryList
      tags: [gl]
      summary: List journal entries
      description: >-
        Every entry, newest entry_date first then highest entry_number. No filters or paging. Headers only: lines are omitted. Role guard admin or owner. The body is null when there are no entries.
      responses:
        "200":
          description: The journal entry headers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GlJournalEntryList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: glJournalEntryCreate
      tags: [gl]
      summary: Create a draft manual journal entry
      description: >-
        Role guard admin or owner. The request carries float dollars; each amount is multiplied by 100 and rounded to int64 cents. Source is always MANUAL and status DRAFT. entry_date is optional (today when absent) and must be YYYY-MM-DD. Refused with 400: undecodable body, malformed entry_date, a negative debit or credit, a non UUID account_id, fewer than 2 lines, debits not equal to credits, all zero amounts, or a database refusal such as an unknown account.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GlJournalEntryRequest"
      responses:
        "201":
          description: The created entry with its lines (account_code and account_name are omitted on the echo).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GlJournalEntry"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/gl/journal-entries/{id}:
    get:
      operationId: glJournalEntryGet
      tags: [gl]
      summary: Get one journal entry with lines
      description: >-
        Role guard admin or owner. Lines carry account_code and account_name. Any repository failure, not only a missing row, answers 404. reverses_entry_id is never present on this read.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The entry with lines.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GlJournalEntry"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/gl/journal-entries/{id}/post:
    post:
      operationId: glJournalEntryPost
      tags: [gl]
      summary: Post a draft journal entry
      description: >-
        Role guard admin or owner. No body. Only a DRAFT entry whose date does not fall in a CLOSED fiscal period can post. Every refusal, including an unknown id, is a 400.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Posted. The body is a one key object with status "posted".
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GlStatusResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/gl/journal-entries/{id}/reverse:
    post:
      operationId: glJournalEntryReverse
      tags: [gl]
      summary: Reverse a posted journal entry
      description: >-
        Role guard admin or owner. Books a posted, net-zero reversing entry dated today and linked by reverses_entry_id. The optional body reason is appended to the memo; an undecodable or absent body is ignored. Only a POSTED entry that has not already been reversed and has at least 2 lines can be reversed. Every refusal, including an unknown id, is a 400.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GlReverseRequest"
      responses:
        "200":
          description: The id of the new reversal entry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GlReverseResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/gl/journal-entries/{id}/void:
    post:
      operationId: glJournalEntryVoid
      tags: [gl]
      summary: Void a posted journal entry
      description: >-
        Role guard admin or owner. No body. Only a POSTED entry can be voided; every refusal, including an unknown id, is a 400.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Voided. The body is a one key object with status "voided".
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GlStatusResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/gl/trial-balance:
    get:
      operationId: glTrialBalance
      tags: [gl]
      summary: Trial balance
      description: >-
        Role guard admin or owner. Posted activity up to and including as_of (default today), for active accounts with any activity, ordered by code. A malformed as_of is a 400. The body is null when no account has activity.
      parameters:
        - name: as_of
          in: query
          required: false
          description: Cut-off date, YYYY-MM-DD. Defaults to today.
          schema:
            type: string
            format: date
      responses:
        "200":
          description: The trial balance rows.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GlTrialBalance"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/gl/profit-and-loss:
    get:
      operationId: glProfitAndLoss
      tags: [gl]
      summary: Profit and loss statement
      description: >-
        Role guard admin or owner. start defaults to the first of the current month and end to today; both are YYYY-MM-DD and inclusive. A malformed date or an end before the start is a 400. The three sections are never null.
      parameters:
        - name: start
          in: query
          required: false
          description: First day, YYYY-MM-DD. Defaults to the first of the current month.
          schema:
            type: string
            format: date
        - name: end
          in: query
          required: false
          description: Last day, YYYY-MM-DD. Defaults to today.
          schema:
            type: string
            format: date
      responses:
        "200":
          description: The income statement in cents.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GlProfitAndLossReport"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/gl/balance-sheet:
    get:
      operationId: glBalanceSheet
      tags: [gl]
      summary: Balance sheet
      description: >-
        Role guard admin or owner. as_of defaults to today; a malformed value is a 400. retained_earnings is already included in total_equity. The three sections are never null.
      parameters:
        - name: as_of
          in: query
          required: false
          description: Statement date, YYYY-MM-DD. Defaults to today.
          schema:
            type: string
            format: date
      responses:
        "200":
          description: The statement of financial position in cents.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GlBalanceSheetReport"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/gl/fiscal-periods:
    get:
      operationId: glFiscalPeriodList
      tags: [gl]
      summary: List fiscal periods
      description: >-
        Role guard admin or owner. All periods ordered by start date; the body is null when there are none.
      responses:
        "200":
          description: The fiscal periods.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GlFiscalPeriodList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/gl/fiscal-periods/{id}/close:
    post:
      operationId: glFiscalPeriodClose
      tags: [gl]
      summary: Close an open fiscal period
      description: >-
        Role guard admin or owner. No body. A period that does not exist or is not OPEN is a 400.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Closed. The body is a one key object with status "closed".
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GlStatusResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/gl/fiscal-periods/{id}/reopen:
    post:
      operationId: glFiscalPeriodReopen
      tags: [gl]
      summary: Reopen a closed fiscal period
      description: >-
        Role guard admin or owner. No body. A period that does not exist or is not CLOSED is a 400.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Reopened. The body is a one key object with status "reopened".
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GlStatusResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /healthz/live:
    get:
      operationId: healthLive
      tags: [health]
      summary: Liveness probe
      description: >-
        Always 200 if the process is running. Used by Kubernetes liveness; no dependency checks.
      security: []
      responses:
        "200":
          description: The process is alive.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: "ok"
  /healthz/ready:
    get:
      operationId: healthReady
      tags: [health]
      summary: Readiness probe
      description: >-
        Checks the database connection pool. Returns 200 when the pool is healthy; 503 Service Unavailable when Ping fails, with the same JSON body and status degraded.
      security: []
      responses:
        "200":
          description: The service is ready; db pool is connected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthReadyOK"
        "503":
          description: The service is degraded; db pool is disconnected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthReadyDegraded"
  /health:
    get:
      operationId: healthLegacy
      tags: [health]
      summary: Legacy health check
      description: >-
        Backward-compatible health endpoint. Checks the database pool Ping and returns the connectivity status. No request ID is generated.
      security: []
      responses:
        "200":
          description: The health with db status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthLegacy"
  /metrics:
    get:
      operationId: metricsPrometheus
      tags: [health]
      summary: Prometheus metrics
      description: >-
        The Prometheus scrape endpoint. By default serves the Prometheus text exposition format (text/plain; version=0.0.4; charset=utf-8). If the request carries an Accept header for application/openmetrics-text the endpoint serves the OpenMetrics format instead. Public: listed in the auth middleware PublicPaths so the scrape target can reach it without a token.
      security: []
      responses:
        "200":
          description: Prometheus text exposition format or OpenMetrics format.
          content:
            text/plain:
              schema:
                type: string
                description: Prometheus text exposition format; see https://prometheus.io/docs/instrumenting/exposition_formats/.
  /api/integration/products:
    get:
      operationId: integrationListProducts
      tags: [integration]
      summary: List catalog products with weight and geometry
      description: >-
        An unfiltered call is a bulk catalog pull with a raised cap; a filtered call is a typeahead search with a small cap. The two caps are server constants and not visible on the wire.
      security:
        - IntegrationKey: []
      parameters:
        - name: category
          in: query
          schema:
            type: string
        - name: q
          in: query
          schema:
            type: string
      responses:
        "200":
          description: The products, a bare array, never null.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationProductList"
        "401":
          $ref: "#/components/responses/IntegrationUnauthorized"
        "500":
          $ref: "#/components/responses/IntegrationServerError"
        "503":
          $ref: "#/components/responses/IntegrationUnavailable"
  /api/integration/quotes/bulk-price:
    post:
      operationId: integrationBulkPrice
      tags: [integration]
      summary: Price a basket of lines for one customer
      description: >-
        Money in and out is cents. Lines whose product cannot be resolved or priced are silently dropped from the response.
      security:
        - IntegrationKey: []
      parameters:
