      tags: [ap]
      summary: List vendor invoices
      description: >-
        Role guard admin, owner or finance, behind the branch middleware: a bound caller sees its branch's bills only. The cursor envelope, newest first by (created_at, id). vendor_id and po_id filter on their document and status on the lowercase lifecycle vocabulary (a comma separated list); a parameter the route does not declare, a status outside the vocabulary or an uppercase one, a malformed cursor or an out of range limit is a 400. total appears only under include=total.
      parameters:
        - name: vendor_id
          in: query
          required: false
          description: Filter on the vendor.
          schema:
            type: string
            format: uuid
        - name: po_id
          in: query
          required: false
          description: Filter on the purchase order.
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          required: false
          description: Comma separated lowercase statuses (pending, approved, partial, paid, voided).
          schema:
            type: string
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Include'
        - $ref: '#/components/parameters/XBranchId'
      responses:
        '200':
          description: The page of vendor invoice summaries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApInvoicePage'
        '400':
          $ref: '#/components/responses/BadRequestEither'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenEither'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: apInvoiceCreate
      tags: [ap]
      summary: Enter a vendor invoice
      description: >-
        Role guard admin, owner or finance. The bill starts pending, owing its whole total, with Gable's own number. Money is _cents, the line unit price is _ten_thousandths and the quantity a decimal string; the server prices each line and never accepts a status. Every line names its gl_account_id (the approve entry debits each line's account). The branch defaults from the body branch, the caller's context branch or the default branch, and is held to the caller's wall (403 naming branch_id). Validation failures are one 400 naming every field with its full path; a duplicate vendor number for the vendor is a 409; an unknown vendor, purchase order or account is a 400 naming the field.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/XBranchId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApCreateVendorInvoiceRequest'
      responses:
        '201':
          description: The created bill, with its lines.
          headers:
            ETag:
              description: The document's revision.
              schema:
                type: string
            Location:
              description: The bill's own route.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApVendorInvoice'
        '400':
          $ref: '#/components/responses/BadRequestEither'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenEither'
        '409':
          $ref: '#/components/responses/ConflictEither'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
