        description:
          type: string
        quantity:
          type: string
          description: A plain decimal with at most 4 fraction digits.
        unit_price_ten_thousandths:
          type: integer
          format: int64
        line_total_cents:
          type: integer
          format: int64
        gl_account_id:
          type: [string, 'null']
          format: uuid
        purchase_order_line_id:
          type: [string, 'null']
          format: uuid
        product_id:
          type: [string, 'null']
          format: uuid
        po_freight_charge_id:
          type: [string, 'null']
          format: uuid
        created_at:
          type: string
          format: date-time
    ApPayment:
      type: object
      required: [id, vendor_id, amount, method, payment_date, status, created_at]
      description: A payment to a vendor (ap.APPayment), in its today shape. amount is int64 cents.
      properties:
        id:
          type: string
          format: uuid
        vendor_id:
          type: string
          format: uuid
        vendor_name:
          type: string
        batch_id:
          type: string
          format: uuid
        amount:
