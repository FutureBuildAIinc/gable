          type: string
        currency:
          type: string
        invoice_date:
          type: string
          format: date
        due_date:
          type: string
          format: date
        po_id:
          type: [string, 'null']
          format: uuid
        subtotal_cents:
          type: integer
          format: int64
        tax_cents:
          type: integer
          format: int64
        total_cents:
          type: integer
          format: int64
        amount_paid_cents:
          type: integer
          format: int64
        amount_open_cents:
          type: integer
          format: int64
        status:
          type: string
