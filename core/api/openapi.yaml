  /api/v1/ap/payments:
    get:
      operationId: apPaymentList
      tags: [ap]
      summary: List vendor payments
      description: >-
        Role guard admin, owner or finance. A bare array until the payment routes' own conversion (ADR 0008 section 11). Optional vendor_id filter (an unparseable value is a 400 naming it); a parameter the route does not declare is refused.
      parameters:
        - name: vendor_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The vendor payments.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApPayment'
        '400':
          $ref: '#/components/responses/BadRequestEither'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenEither'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: apPaymentCreate
      tags: [ap]
      summary: Pay a vendor
      description: >-
        Role guard admin, owner or finance. The request keeps its today shape (float dollars, uppercase methods) until the payment routes' own conversion. The payment locks the named bills in id order and applies only to bills in approved or partial (a pending, paid or voided bill is a 409 blocker invoice_not_approved; a bill of another vendor is a 400 naming invoice_ids[i]); more than the named bills still owe is a 409 blocker exceeds_open. The entry posts through gl.PostEntry inside the act's transaction (DR Accounts Payable, CR Cash), and a posting failure fails the act (a closed period is a 409 blocker period_closed).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApCreatePaymentRequest'
      responses:
        '201':
          description: The created payment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApPayment'
        '400':
          $ref: '#/components/responses/BadRequestEither'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenEither'
        '409':
          $ref: '#/components/responses/ConflictEither'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/ap/aging:
    get:
      operationId: apAging
      tags: [ap]
      summary: AP aging by vendor
      description: >-
        Role guard admin, owner or finance. One row per vendor with open balances in int64 cents buckets, from amount_open; a paid or voided bill owes nothing anywhere. A bare array until the aging route's own conversion. No query parameters; one is refused.
      responses:
        '200':
          description: The aging rows.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApAgingSummary'
        '400':
          $ref: '#/components/responses/BadRequestEither'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenEither'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/apps:
    get:
      operationId: appsList
      tags: [apps]
      summary: List the app catalog with live enablement
      description: >-
        Any authenticated role (the web client builds its navigation from it); no role guard. The catalog is the union of the compiled in manifests and orphaned database rows, sorted by category then name. An empty catalog on a fresh database triggers one self heal sync, so the list is never null.
      responses:
        "200":
          description: The catalog.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppsList"
        "401": {$ref: "#/components/responses/Unauthorized"}
        "500": {$ref: "#/components/responses/InternalError"}
  /api/v1/apps/{key}/enable:
    post:
      operationId: appsEnable
      tags: [apps]
      summary: Enable an app
      description: >-
        Admin or owner only (a 403 for any other role). Every app the target depends on must be enabled, except core dependencies which are always treated as enabled; otherwise the answer is a 409 with the blockers. Answers the full catalog after the change. Enabling an already enabled app succeeds again.
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: The catalog after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppsList"
        "400": {$ref: "#/components/responses/IdempotencyBadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404":
          description: >-
            The key names no compiled in manifest, or the manifest has no registry row. The standard error envelope with the generic text.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >-
            Either a disabled dependency blocks the enable (the hand written app_dependency_conflict body with the blockers), or the idempotency layer reports an in progress claim (the ADR 0001 envelope).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AppsDependencyConflictError"
                  - $ref: "#/components/schemas/WireError"
        "413": {$ref: "#/components/responses/PayloadTooLarge"}
        "422": {$ref: "#/components/responses/UnprocessableEntity"}
        "500": {$ref: "#/components/responses/InternalError"}
  /api/v1/apps/{key}/disable:
    post:
      operationId: appsDisable
      tags: [apps]
      summary: Disable an app
      description: >-
        Admin or owner only (a 403 for any other role). A core app cannot be disabled (409 app_core), and an app that another enabled app depends on cannot be disabled (409 app_dependency_conflict with the dependents as blockers). Disabled apps do not block. Answers the full catalog after the change. The effect on the app's routes follows within the gate cache window.
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: The catalog after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppsList"
        "400": {$ref: "#/components/responses/IdempotencyBadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404":
          description: >-
            The key names no compiled in manifest, or the manifest has no registry row. The standard error envelope with the generic text.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >-
            A core app (app_core), a dependent enabled app (app_dependency_conflict), or an idempotency in progress claim (the ADR 0001 envelope).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AppsCoreConflictError"
                  - $ref: "#/components/schemas/AppsDependencyConflictError"
                  - $ref: "#/components/schemas/WireError"
        "413": {$ref: "#/components/responses/PayloadTooLarge"}
        "422": {$ref: "#/components/responses/UnprocessableEntity"}
        "500": {$ref: "#/components/responses/InternalError"}
