paths:
  /api/v1/a2a/purchase-order:
    post:
      operationId: a2aPurchaseOrderReceive
      tags: [a2a]
      summary: Receive a signed create_purchase_order event from FB Brain
      description: >-
        Order of checks, exactly as the receiver runs them. (1) The body is read up to 1 MiB; anything beyond that is silently truncated, which makes the signature fail. (2) X-JWS-Signature must be present, else 401. (3) X-Idempotency-Key must be present, else 400. (4) The signature must be a compact detached JWS (RS256 only) that verifies over the raw request body with Brain's RSA public key, else 401 "invalid JWS signature". (5) The key is looked up in the a2a_inbound_po_log table; a key already logged is a 409 DUPLICATE (the receiver's own check, in addition to the global idempotency layer). (6) The body must be JSON, else 400. (7) An event_type other than create_purchase_order is acknowledged with 200 {"status": "ignored"} and nothing is created. (8) payload must decode into the purchase order payload and its vendor_id must be a UUID, else 400. The purchase order is created through the purchase order service with source A2A, stamped with the branch from the brain_inbound_branch_id system setting (falling back to default_branch_id); a failure is a 500. On success the webhook is logged against the idempotency key (a failure to log is only logged, the answer stays 201) and the answer is 201 {"status":"created","po_id"}. The key is recorded only after a successful creation, so a failed attempt can be retried with the same key. The global idempotency layer (the Idempotency-Key or X-Idempotency-Key header) only claims requests that carry an identifiable principal; this route has no JWT, so outside AUTH_MODE=dev the global layer passes it through uncached, and under AUTH_MODE=dev it claims under the dev principal. In dev a repeat of a request that already succeeded therefore replays the stored 201 or 200 with Idempotency-Replayed: true, and the receiver's own 409 DUPLICATE is not reached; the layer may also answer 409 (in progress), 422 (key reused with a different body) or, when the body exceeds the size limit, 413 payload_too_large, all in the ADR 0001 envelope. A key that is not 1 to 255 printable ASCII characters is answered 400 validation_failed by the layer in every mode, before the signature is checked. There is no role guard and no JWT.
      security: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: X-JWS-Signature
          in: header
          required: true
          description: >-
            A compact detached JWS (header..signature, empty payload segment) signed RS256 over the exact request body bytes, verifiable with the configured Brain public key. A missing header is a 401, an unparseable or non verifying signature is a 401.
          schema:
            type: string
        - name: X-Idempotency-Key
          in: header
          required: true
          description: >-
            The receiver's own duplicate key, checked against the a2a_inbound_po_log table. The same header name is also read by the global idempotency layer as an alias of Idempotency-Key. A missing header is a 400 (after the signature header check, before the signature verification).
          schema:
            type: string
      requestBody:
        required: true
        description: >-
          The signed body; the signature covers these exact bytes, so a re-serialization breaks it.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/A2aInboundPOWebhook"
      responses:
        "200":
          description: The event type is not create_purchase_order; acknowledged and ignored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/A2aIgnoredResponse"
        "201":
          description: The purchase order was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/A2aCreatedResponse"
        "400":
          description: >-
            VALIDATION_ERROR: unreadable body, missing X-Idempotency-Key, body not JSON, payload not a purchase order payload, or vendor_id not a UUID. The global idempotency layer can also answer 400 in the ADR 0001 envelope (validation_failed for a malformed key in every mode; bad_request for an unreadable body under AUTH_MODE=dev).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/A2aError"
                  - $ref: "#/components/schemas/WireError"
        "401":
          description: >-
            UNAUTHORIZED: missing X-JWS-Signature header, or a signature that does not parse or verify against Brain's public key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/A2aError"
        "404":
          description: >-
            The route is not mounted (FB Brain disabled or no loadable public key): the mux's own plain text 404, not an error envelope.
          content:
            text/plain:
              schema:
                type: string
        "409":
          description: >-
            DUPLICATE: the X-Idempotency-Key was already processed (the receiver's body), or, under AUTH_MODE=dev only, the global layer's in progress claim in the ADR 0001 envelope.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/A2aError"
                  - $ref: "#/components/schemas/WireError"
        "413": {$ref: "#/components/responses/PayloadTooLarge"}
        "422": {$ref: "#/components/responses/UnprocessableEntity"}
        "500":
          description: >-
            INTERNAL_ERROR: the idempotency lookup failed or the purchase order could not be created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/A2aError"
  /api/v1/accounts/{id}:
    get:
      operationId: accountSummary
      tags: [accounts]
      summary: Get account summary
      description: >-
        The customer's balance (the subledger), credit limit and the credit left (both null for no limit), and the open credit memos plus unapplied cash as a negative figure. An unknown customer is 404.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: "#/components/parameters/XBranchId"
      responses:
        "200":
          description: The account summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountSummary"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "404":
          $ref: "#/components/responses/WireNotFound"
  /api/v1/accounts/{id}/transactions:
    get:
      operationId: accountTransactions
      tags: [accounts]
      summary: List account transactions
      description: >-
        The customer's subledger rows (one per movement of account 1020), newest first (created_at, then id), in the cursor list envelope.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Include"
        - $ref: "#/components/parameters/XBranchId"
      responses:
        "200":
          description: The page of subledger rows.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountTransactionPage"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "404":
          $ref: "#/components/responses/WireNotFound"
  /api/v1/ar/aging:
    get:
      operationId: arAging
      tags: [ar]
      summary: Receivable aging by customer, job or ship-to
      description: >-
        One item per group per currency, ordered by customer name, customer id, group id and currency. Every amount is taken as of as_of (default the branch's today), so the aging of a past date ignores later applications, counts an invoice voided after that date, and ties to the balances of 1020 and 2200 on it. current_cents is not yet due; the day buckets count days past the basis date; unapplied_cents is the open credit memos plus unapplied cash, negative, on the row of their own job (a payment carries a job, never a ship-to); total_cents is the buckets plus unapplied_cents. The fields of the coarser groupings are null.
      parameters:
        - name: group_by
          in: query
          required: false
          schema: {type: string, enum: [customer, job, ship_to], default: customer}
        - name: as_of
          in: query
          required: false
          schema: {type: string, format: date}
        - name: basis
          in: query
          required: false
          schema: {type: string, enum: [due_date, invoice_date], default: due_date}
        - name: customer_id
          in: query
          required: false
          schema: {type: string, format: uuid}
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Include"
        - $ref: "#/components/parameters/XBranchId"
      responses:
        "200":
          description: The page of aging rows.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArAgingPage"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
  /api/v1/ar/aging/summary:
    get:
      operationId: arAgingSummary
      tags: [ar]
      summary: Receivable aging bucket totals per currency
      description: The same parameters as the aging (group_by is read and has no effect); the answer is not a list.
      parameters:
        - name: group_by
          in: query
          required: false
          schema: {type: string, enum: [customer, job, ship_to]}
        - name: as_of
          in: query
          required: false
          schema: {type: string, format: date}
        - name: basis
          in: query
          required: false
          schema: {type: string, enum: [due_date, invoice_date], default: due_date}
        - name: customer_id
          in: query
          required: false
          schema: {type: string, format: uuid}
        - $ref: "#/components/parameters/XBranchId"
      responses:
        "200":
          description: The bucket totals, one entry per currency.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArAgingSummary"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
  /api/v1/ar/customers/{id}/statement:
    get:
      operationId: arStatement
      tags: [ar]
      summary: Customer statement
      description: >-
        Per currency: the opening balance (the subledger rows before from), every row in the range (filtered to the job when job_id is given, through the source document's job), the closing balance, and the open documents (invoices with an open amount, credit memos with open credit). from defaults to a month before to; to to today.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: from
          in: query
          required: false
          schema: {type: string, format: date}
        - name: to
          in: query
          required: false
          schema: {type: string, format: date}
        - name: job_id
          in: query
          required: false
          schema: {type: string, format: uuid}
        - $ref: "#/components/parameters/XBranchId"
      responses:
        "200":
          description: The statement.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArStatement"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "404":
          $ref: "#/components/responses/WireNotFound"
  /api/v1/ar/reconciliation:
    get:
      operationId: arReconciliation
      tags: [ar]
      summary: Reconcile the subledger, the documents and the ledger
      description: >-
        Roles admin, owner, finance. Lists every customer whose balance_due, subledger sum and document open amounts disagree, per currency, and for each currency whether the sum of balances equals account 1020 and unapplied cash equals account 2200. Rows written before cycle 2 show here; nothing repairs a difference.
      parameters:
        - $ref: "#/components/parameters/XBranchId"
      responses:
        "200":
          description: The drift and the ledger comparison.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArReconciliation"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
  /api/v1/ar/applications/{id}/reverse:
    post:
      operationId: arApplicationReverse
      tags: [ar]
      summary: Reverse one application
      description: >-
        Roles admin, owner, finance; a reason is required. Reverses one live application of any kind: a payment application (and the discount applications of the same act on the same invoice), a credit memo application, or a write off. A payment application posts the reversal of its own entry, or, when it has none (a migrated one), a new DR 1020 / CR 2200 entry. A discount alone is refused with 409 discount_stands_with_payment. Writes payment.unapplied or credit_memo.reopened (none for a write off), then invoice.reopened, then customer.updated.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: "#/components/parameters/XBranchId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArApplicationReverseRequest"
      responses:
        "200":
          description: The application, reversed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArApplication"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "404":
          $ref: "#/components/responses/WireNotFound"
        "409":
          $ref: "#/components/responses/ConflictEither"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/customers/{customerId}/activities:
    get:
      operationId: activityList
      tags: [activities]
      summary: List a customer's activities
      description: >-
        The cursor list envelope, newest first on (created_at, id). activity_type and contact_id filter; total appears only under include=total. A parameter the route does not declare, an activity type outside the lowercase vocabulary, a malformed cursor or an out of range limit is a 400. A customer the caller cannot see behind the branch wall serves an empty page.
      parameters:
        - name: customerId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: activity_type
          in: query
          required: false
          description: One lowercase activity type.
          schema:
            type: string
            enum: [call, meeting, email, note]
        - name: contact_id
          in: query
          required: false
          description: Only the activities of this contact.
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Include"
        - $ref: "#/components/parameters/XBranchId"
      responses:
        "200":
          description: The page of activities.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityPage"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "500":
          $ref: "#/components/responses/InternalErrorEither"
    post:
      operationId: activityCreate
      tags: [activities]
      summary: Log an activity
      description: >-
        activity_type and description are required; contact_id and logged_by are optional; activity_date defaults to now. The customer is named by the path: a body customer_id is a 400, and a customer the caller cannot see behind the branch wall is a 404. Writes the audit row activity.created and the event activity.created in the same transaction, the event last.
      parameters:
        - name: customerId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/XBranchId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivityRequest"
      responses:
        "201":
          description: The logged activity, with its ETag and a Location header.
          headers:
            ETag:
              description: The record's revision in quotes, for example "3". Send it back as If-Match.
              schema:
                type: string
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Activity"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "404":
          $ref: "#/components/responses/WireNotFound"
        "409":
          $ref: "#/components/responses/WireConflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalErrorEither"
  /api/v1/activities/{id}:
    get:
      operationId: activityGet
      tags: [activities]
      summary: Get one activity
      description: The activity with its ETag. An activity behind the caller's branch wall is a 404.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/XBranchId"
      responses:
        "200":
          description: The activity.
          headers:
            ETag:
              description: The record's revision in quotes, for example "3". Send it back as If-Match.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Activity"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "404":
          $ref: "#/components/responses/WireNotFound"
        "500":
          $ref: "#/components/responses/InternalErrorEither"
    put:
      operationId: activityUpdate
      tags: [activities]
      summary: Update an activity
      description: >-
        Replaces contact_id, activity_type, description, logged_by and activity_date (an omitted activity_date keeps its stored value) on the client's revision: If-Match or a body revision, neither is 428, a stale one 409 stale_revision, an If-Match of * or a list 400, header and body disagreeing 400. A body customer_id is a 400: the customer is fixed at create. The response is the stored row, not the echo of the body. Writes the audit row activity.updated and the event activity.updated in the same transaction, the event last.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/XBranchId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivityRequest"
      responses:
        "200":
          description: The activity at its new revision, with its ETag.
          headers:
            ETag:
              description: The new revision in quotes.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Activity"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "404":
          $ref: "#/components/responses/WireNotFound"
        "409":
          $ref: "#/components/responses/WireConflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "428":
          $ref: "#/components/responses/WirePreconditionRequired"
        "500":
          $ref: "#/components/responses/InternalErrorEither"
    delete:
      operationId: activityDelete
      tags: [activities]
      summary: Delete an activity
      description: >-
        Deletes on the client's revision, carried by If-Match alone (a DELETE has no body). Writes the audit row activity.deleted and the event activity.deleted in the same transaction, the event last.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/XBranchId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "204":
          description: Activity deleted.
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "404":
          $ref: "#/components/responses/WireNotFound"
        "409":
          $ref: "#/components/responses/WireConflict"
        "428":
          $ref: "#/components/responses/WirePreconditionRequired"
        "500":
          $ref: "#/components/responses/InternalErrorEither"
  /api/v1/admin/keys:
    get:
      operationId: adminListKeys
      tags: [admin]
      summary: List machine API keys
      description: >-
        Admin or owner only (a machine key is refused here whatever its scopes). The cursor list envelope, newest first, revoked keys included; scopes is never null. Only the 12 character prefix identifies a key; the secret and its hash are never served. total appears only under include=total.
      parameters:
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Include"
      responses:
        "200":
          description: The page of keys.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyPage"
        "400": {$ref: "#/components/responses/WireBadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/WireInternalError"}
    post:
      operationId: adminCreateKey
      tags: [admin]
      summary: Create a machine API key
      description: >-
        Admin or owner only. The raw key (sk_live_ followed by 43 URL safe base64 characters) is returned here and nowhere else; only its salted Argon2 hash is stored. The scopes are stored verbatim (ADR 0002: a grant reads back as written); grammar validation at the mint is C5-2a's (ADR 0007 section 5.3), so this parse checks only that the name is present and each scope is a printable, non-empty string. The mint, its audit row and the key.created event are one transaction.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCreateKeyRequest"
      responses:
        "201":
          description: The new key row and the raw key, shown once.
          headers:
            Location:
              description: The new key's own URL.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCreateKeyResponse"
        "400": {$ref: "#/components/responses/WireBadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/WireConflict"}
        "413": {$ref: "#/components/responses/PayloadTooLarge"}
