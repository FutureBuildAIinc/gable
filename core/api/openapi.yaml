        Roles admin, owner, finance. Partial: only the fields sent change. dollar_tolerance is read as float dollars and stored and returned as int64 cents.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MatchingConfigUpdateRequest"
      responses:
        "200":
          description: The updated configuration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchingConfig"
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/InternalError"}
  /api/v1/matching/exceptions:
    get:
      operationId: matchingExceptionList
      tags: [matching]
      summary: List match exceptions
      description: >-
        Roles admin, owner, finance. Results in EXCEPTION or PARTIAL status, newest first, unpaged, never null.
      responses:
        "200":
          description: The exceptions.
          content:
            application/json:
              schema:
