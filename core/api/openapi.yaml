        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: The order was submitted.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [submitted]
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/InternalError"}
  /api/v1/quotes:
    get:
      operationId: quoteList
      tags: [quote]
      summary: List quotes
      description: >-
        Offset paged quote list. No filters are implemented; any query parameter other than limit and offset is silently ignored.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/XBranchId"
      responses:
        "200":
          description: The page of quotes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuotePage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: quoteCreate
      tags: [quote]
      summary: Create a quote
      description: >-
        Decodes the full quote shape (lines included) and the optional base64 original upload. Validation is loose: a line without a unit of measure fails at the database cast and surfaces as a 500.
      parameters:
        - $ref: "#/components/parameters/XBranchId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuoteCreateRequest"
      responses:
        "201":
          description: The created quote, echoed with server filled fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/quotes/analytics:
    get:
      operationId: quoteAnalytics
      tags: [quote]
      summary: Quote analytics aggregates
      parameters:
        - $ref: "#/components/parameters/XBranchId"
      responses:
        "200":
          description: Aggregated quote analytics.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteAnalytics"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/quotes/{id}:
    get:
      operationId: quoteGet
      tags: [quote]
      summary: Get one quote with lines
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/XBranchId"
      responses:
        "200":
          description: The quote.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: quoteUpdate
      tags: [quote]
      summary: Replace a draft quote
      description: >-
        Full replace. Only a DRAFT quote can be edited; any other state is a 400. Lines are replaced; a line whose id survives keeps its customer note.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/XBranchId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuoteCreateRequest"
      responses:
        "200":
          description: The updated quote with lines.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/quotes/{id}/state:
    put:
      operationId: quoteUpdateState
      tags: [quote]
      summary: Change the quote lifecycle state
      description: >-
        Sets the state directly; the service refuses transitions it does not allow and the handler reports that refusal as a 400. Returns the updated quote.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/XBranchId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuoteStateUpdate"
      responses:
        "200":
          description: The updated quote.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/quotes/{id}/convert:
    post:
      operationId: quoteConvertToOrderPayload
      tags: [quote]
      summary: Mark accepted and return the order creation payload
      description: >-
        Marks the quote ACCEPTED and returns the body the client is expected to POST to /api/v1/orders itself; no order is created here. The returned price_each is in float dollars, while POST /api/v1/orders expects cents: the client converts.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/XBranchId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: The order creation payload for the client to POST.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteOrderPayload"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/quotes/{id}/file:
    get:
      operationId: quoteDownloadOriginalFile
      tags: [quote]
      summary: Download the original uploaded file
      description: >-
        Streams the stored original upload of an AI sourced quote. The stored content type is echoed; the filename in Content-Disposition is sanitized. A quote with no stored file is a 404.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/XBranchId"
      responses:
        "200":
          description: The file bytes; the stored content type is echoed.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/tax/exemptions:
    post:
      operationId: taxExemptionCreate
      tags: [tax]
      summary: Create a tax exemption
      description: >-
        Roles admin, owner, finance. customer_id and exempt_reason are required (400). The exemption is created active and effective now. expiry_date is a YYYY-MM-DD string; any other format is a 500.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaxExemptionCreateRequest"
      responses:
        "201":
          description: The created exemption.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaxExemption"
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/InternalError"}
  /api/v1/tax/exemptions/{customerID}:
    get:
      operationId: taxExemptionList
      tags: [tax]
      summary: List a customer's tax exemptions
      description: >-
        Roles admin, owner, finance. Every exemption of the customer, active or not, newest first; an array that is empty, never null, for an unknown customer.
      parameters:
        - name: customerID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The exemptions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TaxExemption"
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/InternalError"}
  /api/v1/tax/exemptions/{id}:
    delete:
      operationId: taxExemptionDelete
      tags: [tax]
      summary: Delete a tax exemption
      description: >-
        Roles admin, owner, finance. A hard delete. An unknown id still answers 204.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: The exemption is gone (or never existed).
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/InternalError"}
  /api/v1/tax/preview:
    post:
      operationId: taxPreview
      tags: [tax]
      summary: Preview tax on a cart or invoice
      description: >-
        Roles admin, owner, finance. At least one line is required (400). document_type defaults to SalesInvoice. An exempt customer gets a zero tax result; otherwise Avalara is used when configured and a flat rate estimate (is_estimate true) when not. Amounts are int64 cents.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaxPreviewRequest"
      responses:
        "200":
          description: The tax result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaxResult"
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/InternalError"}
  /uploads/:
    get:
      operationId: uploadsFile
      tags: [uploads]
      summary: Serve an uploaded file
      description: >-
        Authenticated access to the dealer file store under the uploads directory. The path after /uploads/ is the file path within the uploads directory. Content-Type is derived from the file extension first and by content sniffing when the extension is unknown; Content-Disposition is always attachment; X-Content-Type-Options is nosniff. A nonexistent file is a 404. The mount registers for every HTTP method and the file server ignores the method, so any other method on the same path answers the same file with the same status. A user JWT whose roles do not include admin, owner or user is a 403; a machine key is a 403 on this path whatever scope it holds.
      security:
        - BearerJWT: []
      responses:
        "200":
          description: The file bytes; Content-Type is derived from the file extension, then sniffed.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    BearerJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        The user JWT the auth middleware verifies against the configured JWKS issuer. Role guards run per module (the census column in ROUTES.txt names the registering module; cmd/server/main.go names the roles each module registers with). AUTH_MODE=dev disables verification entirely.
    IntegrationKey:
      type: apiKey
      in: header
      name: X-Integration-Key
      description: >-
        The shared integration key of the AI load management seam, compared in constant time. When no key is configured the whole seam answers 503 before the handler runs.
    PortalSession:
      type: apiKey
      in: cookie
      name: portal_token
      description: >-
        The portal JWT issued by POST /api/portal/v1/login, presented as the portal_token cookie (HttpOnly) or as an Authorization: Bearer header; the middleware accepts either, cookie first. Verified against PORTAL_JWT_SECRET (HS256). AUTH_MODE=dev bypasses the check and injects the demo customer's claims instead.
  parameters:
    Limit:
      name: limit
      in: query
      description: >-
        Page size. Unparseable, non positive or over maximum values are silently ignored and the default applies; the value is never refused today.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Offset:
      name: offset
      in: query
      description: >-
        Page offset. Unparseable or negative values are silently ignored and the default applies.
      schema:
        type: integer
        minimum: 0
        default: 0
    XBranchId:
      name: X-Branch-Id
      in: header
      required: false
      description: >-
        Branch scope for modules registered behind the branch middleware (quote, customer, order, invoice in this fragment set). A missing header passes for admins and in dev mode; with default_branch_required on, a non admin without it is refused. A non UUID value is a 400 and a branch the caller has no grant for is a 403.
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >-
        Opt in idempotent replay for POST, PUT and PATCH. The legacy name X-Idempotency-Key addresses the same claim. Claims are stored in Postgres and survive a restart; only 2xx and 3xx responses are stored.
      schema:
        type: string
        minLength: 1
        maxLength: 255
  responses:
    BadRequest:
      description: >-
        The request cannot be consumed. The body is the standard error envelope; the message is the generic status text, and the handler's specific message goes to the server log only.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: No or invalid credentials.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: The caller's roles do not include one the route requires.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: The addressed resource does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: The write conflicts with the resource's current state.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnprocessableEntity:
      description: >-
        The request is semantically invalid for this operation. Used by the idempotency layer when an Idempotency-Key is reused with a request body that differs from the original.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PaymentRequired:
      description: The card charge or its persistence failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: Unexpected server fault (also today's status for most service level validation failures).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServiceUnavailable:
      description: A dependency the route needs is not configured.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    IntegrationUnauthorized:
      description: The X-Integration-Key is missing or wrong (the integration seam's own error body, not the standard envelope).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/IntegrationError"
    IntegrationUnavailable:
      description: No integration key is configured, so the whole seam is closed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/IntegrationError"
    IntegrationBadRequest:
      description: The body or a parameter is malformed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/IntegrationError"
    IntegrationNotFound:
      description: The addressed resource does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/IntegrationError"
    IntegrationConflict:
      description: The order was created but could not be confirmed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/IntegrationError"
    IntegrationServerError:
      description: The handler failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/IntegrationError"
  schemas:
    Error:
      type: object
      required: [error, meta]
      description: >-
        The standard error envelope written by httputil.RespondError. The message is always the generic status text; the handler's specific message is server log only. request_id echoes the X-Request-ID response header.
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [BAD_REQUEST, UNAUTHORIZED, FORBIDDEN, NOT_FOUND, CONFLICT, RATE_LIMITED, UNPROCESSABLE_ENTITY, PAYMENT_REQUIRED, INTERNAL_ERROR]
            message:
              type: string
              description: Generic status text such as "Bad Request".
        meta:
          type: object
          required: [request_id]
          properties:
            request_id:
              type: string
    IntegrationError:
      type: object
      required: [error]
      description: The integration seam's own error body, a bare message string.
      properties:
        error:
          type: string
    ExposureBlock:
      type: object
      required: [error, code, exposure]
      description: >-
        The raw 409 payload the order module writes when the lumber index exposure gate blocks a confirm, fulfill or gate check. This is not the standard error envelope.
      properties:
        error:
          type: string
          enum: [unresolved index exposure on source quote]
        code:
          type: string
          enum: [UNRESOLVED_EXPOSURE]
        exposure:
          type: object
          required: [quote_id, state, exposure_dollars, indexes]
          properties:
            quote_id:
              type: string
              format: uuid
            quote_short_id:
              type: string
            state:
              type: string
              description: The exposure state vocabulary (ACK_REQUIRED, BLOCKED and neighbors).
            exposure_dollars:
              type: number
            indexes:
              type: array
              items:
                type: string
            salesperson_id:
              type: [string, "null"]
              format: uuid
            salesperson_name:
              type: [string, "null"]
            required_action:
              type: string
            last_checked_at:
              type: [string, "null"]
              format: date-time
    ApVendorInvoice:
      type: object
      required: [id, vendor_id, invoice_number, invoice_date, due_date, subtotal, tax_amount, total, amount_paid, status, created_at]
      description: A vendor bill (ap.VendorInvoice). Every money field is int64 cents.
      properties:
        id:
          type: string
          format: uuid
        vendor_id:
          type: string
          format: uuid
        vendor_name:
          type: string
          description: Joined from the vendor on reads and approve; omitted on the create echo.
        invoice_number:
          type: string
        invoice_date:
          type: string
          format: date-time
        due_date:
          type: string
          format: date-time
        po_id:
          type: string
          format: uuid
        subtotal:
          type: integer
          format: int64
          description: Cents.
        tax_amount:
          type: integer
          format: int64
          description: Cents.
        total:
          type: integer
          format: int64
          description: Cents.
        amount_paid:
          type: integer
          format: int64
          description: Cents.
        status:
          type: string
          enum: [PENDING, APPROVED, PARTIAL, PAID, VOIDED]
        approved_by:
          type: string
          format: uuid
        approved_at:
          type: string
          format: date-time
        notes:
          type: string
        created_at:
          type: string
          format: date-time
        lines:
          type: array
          description: Present on the single read only.
          items:
            $ref: "#/components/schemas/ApVendorInvoiceLine"
    ApVendorInvoiceLine:
      type: object
      required: [id, invoice_id, description, quantity, unit_price, line_total, created_at]
      description: A vendor invoice line (ap.VendorInvoiceLine). unit_price and line_total are int64 cents.
      properties:
        id:
          type: string
          format: uuid
        invoice_id:
          type: string
          format: uuid
        description:
          type: string
        quantity:
          type: number
        unit_price:
          type: integer
          format: int64
          description: Cents.
        line_total:
          type: integer
          format: int64
          description: Cents.
        gl_account_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
    ApPayment:
      type: object
      required: [id, vendor_id, amount, method, payment_date, status, created_at]
      description: A payment to a vendor (ap.APPayment). amount is int64 cents.
      properties:
        id:
          type: string
          format: uuid
        vendor_id:
          type: string
          format: uuid
        vendor_name:
          type: string
        batch_id:
          type: string
          format: uuid
        amount:
          type: integer
          format: int64
          description: Cents.
        method:
          type: string
          enum: [CHECK, ACH, WIRE]
        check_number:
          type: string
        reference:
          type: string
        payment_date:
          type: string
          format: date-time
        status:
          type: string
          description: PENDING, COMPLETE or VOIDED.
        created_at:
          type: string
          format: date-time
    ApAgingSummary:
      type: object
      required: [vendor_id, vendor_name, current, past_30, past_60, past_90, total]
      description: Aging buckets for one vendor (ap.APAgingSummary). Every bucket is int64 cents.
      properties:
        vendor_id:
          type: string
          format: uuid
        vendor_name:
          type: string
        current:
          type: integer
          format: int64
          description: Cents.
        past_30:
          type: integer
          format: int64
          description: Cents.
        past_60:
          type: integer
          format: int64
          description: Cents.
        past_90:
          type: integer
          format: int64
          description: Cents.
        total:
          type: integer
          format: int64
          description: Cents.
    ApCreateVendorInvoiceRequest:
      type: object
      description: The create body. Dates are YYYY-MM-DD; tax_amount and line unit_price are float dollars today.
      properties:
        vendor_id:
          type: string
          format: uuid
        invoice_number:
          type: string
        invoice_date:
          type: string
          format: date
        due_date:
          type: string
          format: date
        po_id:
          type: string
          format: uuid
        tax_amount:
          type: number
          description: Float dollars today.
        notes:
          type: string
        lines:
          type: array
          items:
            $ref: "#/components/schemas/ApCreateVendorInvoiceLineRequest"
    ApCreateVendorInvoiceLineRequest:
      type: object
      properties:
        description:
          type: string
        quantity:
          type: number
        unit_price:
          type: number
          description: Float dollars today.
        gl_account_id:
          type: string
          format: uuid
    ApCreatePaymentRequest:
      type: object
      description: The pay body. payment_date is YYYY-MM-DD; amount is float dollars today.
      properties:
        vendor_id:
          type: string
          format: uuid
        amount:
          type: number
          description: Float dollars today.
        method:
          type: string
          enum: [CHECK, ACH, WIRE]
        check_number:
          type: string
        reference:
          type: string
        payment_date:
          type: string
          format: date
        invoice_ids:
          type: array
          description: Invoices this payment is applied to, in order.
          items:
            type: string
            format: uuid
    BankreconBankAccount:
      type: object
      required: [id, name, account_number, routing_number, gl_account_id, is_active, created_at]
      description: A bank account linked to a GL cash account (bankrecon.BankAccount).
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        account_number:
          type: string
        routing_number:
          type: string
        gl_account_id:
          type: string
          format: uuid
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
    BankreconTransaction:
      type: object
      required: [id, bank_account_id, transaction_date, amount, description, reference, status, created_at]
      description: One imported statement row (bankrecon.BankTransaction). amount is int64 cents, positive for a deposit and negative for a withdrawal.
      properties:
