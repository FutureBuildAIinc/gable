    UnitSetRow:
      type: object
      description: >-
        One row of a product's unit set: unit_qty of the row's unit is stock_qty of the product's stocking unit, canonical (ADR 0006 R2).
      required: [uom, unit_qty, stock_qty, sell, purchase, price]
      properties:
        uom:
          $ref: '#/components/schemas/UOM'
        unit_qty:
          $ref: '#/components/schemas/Quantity'
        stock_qty:
          $ref: '#/components/schemas/Quantity'
        sell:
          type: boolean
        purchase:
          type: boolean
        price:
          type: boolean
    UnitSetDoc:
      type: object
      description: >-
        GET /products/{id}/units and the PUT's answer: the set, the four defaults, the board measure facts the derivations read, the base price the hold guards, and the PUT's warnings (empty on a read, an array always present).
      required: [product_id, stock_uom, sale_uom, price_uom, purchase_uom, base_price_ten_thousandths, board_thickness_in, board_width_in, board_length_ft, random_length, units, warnings, revision]
      properties:
        product_id:
          type: string
          format: uuid
        stock_uom:
          $ref: '#/components/schemas/UOM'
        sale_uom:
          $ref: '#/components/schemas/UOM'
        price_uom:
          $ref: '#/components/schemas/UOM'
        purchase_uom:
          $ref: '#/components/schemas/UOM'
        base_price_ten_thousandths:
          type: integer
          format: int64
        board_thickness_in:
          oneOf:
            - $ref: '#/components/schemas/Quantity'
            - type: "null"
        board_width_in:
          oneOf:
            - $ref: '#/components/schemas/Quantity'
            - type: "null"
        board_length_ft:
          oneOf:
            - $ref: '#/components/schemas/Quantity'
            - type: "null"
        random_length:
          type: boolean
        units:
          type: array
          items:
            $ref: '#/components/schemas/UnitSetRow'
        warnings:
          type: array
          description: >-
            One entry per sell row whose unit does not convert exactly into the stocking unit, naming the finer stocking unit that would make every sell row exact (the 6x9 paver stocked in PCS and sold by SF). The warning does not refuse.
          items:
            type: object
            required: [field, message]
            properties:
              field:
                type: string
              message:
                type: string
        revision:
          type: integer
          format: int64
    UnitSetPut:
      type: object
      required: [revision, stock_uom, sale_uom, price_uom, purchase_uom, units]
      description: >-
        The body of PUT /products/{id}/units: it replaces the whole set and the four default columns at the product's revision. A row may omit its pair (the derivations of ADR 0006 section 3.2 fill it); a sent pair is stored canonically and must agree with every derivation that applies. base_price_ten_thousandths simply sets the base price while the price unit cannot leave the stocking unit. A field the PUT cannot apply (the board measure columns) is a 400 naming it.
      properties:
        revision:
          type: integer
          format: int64
          minimum: 1
        stock_uom:
          $ref: '#/components/schemas/UOM'
        sale_uom:
          $ref: '#/components/schemas/UOM'
        price_uom:
          $ref: '#/components/schemas/UOM'
        purchase_uom:
          $ref: '#/components/schemas/UOM'
        base_price_ten_thousandths:
          type: integer
          format: int64
          minimum: 0
        units:
          type: array
          items:
            $ref: '#/components/schemas/UnitSetRowPut'
    UnitSetRowPut:
      type: object
      required: [uom]
      properties:
        uom:
          $ref: '#/components/schemas/UOM'
        unit_qty:
          $ref: '#/components/schemas/Quantity'
        stock_qty:
          $ref: '#/components/schemas/Quantity'
        sell:
          type: boolean
        purchase:
          type: boolean
        price:
          type: boolean
    UOM:
      type: string
      pattern: '^[A-Z]{1,6}$'
      description: A unit code of the catalogue (the closed enum is gone; ADR 0006 section 2).
    ProductView:
      type: object
      description: >-
        The product on the wire (ADR 0006 sections 6 and 7.1): stock_uom, the scaled base price, quantities as decimal strings, and the stock totals in the stocking unit.
      required: [id, sku, description, stock_uom, base_price_ten_thousandths, average_unit_cost_ten_thousandths, target_margin, commission_rate, vendor, vendor_id, upc, weight_lbs, length_in, width_in, height_in, stackable, geometry_source, lead_time_days, reorder_point, reorder_qty, on_hand, allocated, available, revision, created_at, updated_at, sale_uom, price_uom, purchase_uom, board_thickness_in, board_width_in, board_length_ft, random_length, units]
      properties:
        id:
          type: string
          format: uuid
        sku:
          type: string
        description:
          type: string
        stock_uom:
          $ref: '#/components/schemas/UOM'
        base_price_ten_thousandths:
          type: integer
          format: int64
          description: The base price per stocking unit at scale 4.
        average_unit_cost_ten_thousandths:
          type: integer
          format: int64
        target_margin:
          type: number
        commission_rate:
          type: number
        vendor:
          type: [string, "null"]
        vendor_id:
          type: [string, "null"]
          format: uuid
        upc:
          type: [string, "null"]
        weight_lbs:
          type: number
        length_in:
          type: [number, "null"]
        width_in:
          type: [number, "null"]
        height_in:
          type: [number, "null"]
        stackable:
          type: [boolean, "null"]
        geometry_source:
          type: [string, "null"]
        lead_time_days:
          type: [integer, "null"]
        reorder_point:
          type: string
          description: A decimal string at scale 4.
        reorder_qty:
          type: string
        on_hand:
          type: string
          description: The stocking unit total of quantity.
        allocated:
          type: string
        available:
          type: string
          description: on_hand less allocated.
        revision:
          type: integer
          format: int64
        sale_uom:
          $ref: '#/components/schemas/UOM'
        price_uom:
          $ref: '#/components/schemas/UOM'
          description: The unit the base price is per; the stocking unit until C3-2B.
        purchase_uom:
          $ref: '#/components/schemas/UOM'
        board_thickness_in:
          description: The nominal cross section of a board measure product (a 2x4 is 2), decimal string on the wire.
          oneOf:
            - $ref: '#/components/schemas/Quantity'
            - type: "null"
        board_width_in:
          oneOf:
            - $ref: '#/components/schemas/Quantity'
            - type: "null"
        board_length_ft:
          description: The nominal length of a fixed length piece (a 2x4x8 is 8); null for random length.
          oneOf:
            - $ref: '#/components/schemas/Quantity'
            - type: "null"
        random_length:
          type: boolean
          description: The product is sold by tally (ADR 0006 section 4); requires LF stocking.
        units:
          type: array
          description: The product's unit set (ADR 0006 sections 3.1 and 3.2).
          items:
            $ref: '#/components/schemas/UnitSetRow'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ProductCreate:
      type: object
      required: [sku, description, stock_uom]
      properties:
        sku:
          type: string
