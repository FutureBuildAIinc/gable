    get:
      operationId: marketIndexHistory
      tags: [marketIndex]
      summary: Get a market index value history
      description: >-
        Guarded admin or owner. The window ends now and starts days back. days outside 1 to 730, or unparseable, silently falls back to 90. An unknown index id is not an error (empty points).
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: days
          in: query
          required: false
          description: Window length in days; default 90, accepted 1 to 730.
          schema: {type: integer}
      responses:
        "200":
          description: The time series.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketIndexHistoryResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/market-indices/{id}/refresh:
    post:
      operationId: marketIndexRefresh
      tags: [marketIndex]
      summary: Apply a new market index value
      description: >-
        Guarded admin or owner. new_value must be positive. Source defaults to MANUAL. Updates the index and appends a history point in one transaction, then kicks the exposure scanner; a scanner failure does not fail the call and shows as scan_kicked false.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarketIndexRefreshRequest"
      responses:
        "200":
          description: The updated index, the new history id and the scan flag.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketIndexRefreshResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/market-indices/{id}/refresh/preview:
    post:
      operationId: marketIndexRefreshPreview
      tags: [marketIndex]
      summary: Preview the exposure of a new market index value
      description: >-
        Guarded admin or owner. A dry run: nothing is written. new_value must be positive. top_customers lists at most five customers by exposure and is null when no active escalator carries a base index.
      parameters:
        - name: id
          in: path
          required: true
