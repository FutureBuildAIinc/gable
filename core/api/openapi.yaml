        document_code:
          type: string
          description: The Avalara document code; absent for estimates.
        total_amount:
          type: integer
          format: int64
          description: Pre-tax total in cents.
        total_tax:
          type: integer
          format: int64
          description: Tax in cents.
        grand_total:
          type: integer
          format: int64
        lines:
          type: array
          items:
            $ref: "#/components/schemas/TaxLine"
        is_estimate:
          type: boolean
          description: True when the flat rate fallback was used.
    Unit:
      type: object
      description: >-
        One unit of the catalogue. The standard size is the pair std_unit_qty of this unit = std_ref_qty of its dimension's reference unit, stored in the canonical form of ADR 0006 section 1 (GAL is 576 = 77 CF); both fields are null for a unit whose size is per product (a box, a bundle).
      required: [code, name, dimension, std_unit_qty, std_ref_qty, is_system, is_active, revision, created_at, updated_at]
      properties:
        code:
          type: string
          pattern: '^[A-Z]{1,6}$'
          description: Immutable; the value every unit column holds.
        name:
          type: string
        dimension:
          type: string
          enum: [count, length, area, volume, weight, board_measure]
        std_unit_qty:
          oneOf:
            - $ref: '#/components/schemas/Quantity'
            - type: "null"
        std_ref_qty:
          oneOf:
            - $ref: '#/components/schemas/Quantity'
            - type: "null"
        is_system:
          type: boolean
          description: "True on seeded rows: their code, dimension and standard size cannot change."
        is_active:
          type: boolean
          description: "An inactive unit cannot enter a new unit set row or a new line; existing rows keep it."
        revision:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    UnitCreate:
      type: object
      required: [code, name]
      description: >-
        The create body. The dimension defaults to count; the standard size is both halves or neither. is_system and revision are never accepted.
      properties:
        code:
          type: string
          pattern: '^[A-Z]{1,6}$'
        name:
          type: string
          minLength: 1
          maxLength: 80
        dimension:
          type: string
          enum: [count, length, area, volume, weight, board_measure]
        std_unit_qty:
          $ref: '#/components/schemas/Quantity'
        std_ref_qty:
          $ref: '#/components/schemas/Quantity'
    UnitUpdate:
      type: object
      description: >-
        The update body at the unit's revision: If-Match or revision. A field the PUT cannot change is a 400 naming it.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        is_active:
          type: boolean
        dimension:
          type: string
          enum: [count, length, area, volume, weight, board_measure]
        std_unit_qty:
          $ref: '#/components/schemas/Quantity'
        std_ref_qty:
          $ref: '#/components/schemas/Quantity'
        revision:
          type: integer
          format: int64
          minimum: 1
    UnitPage:
      type: object
      description: The list envelope of ADR 0001 section 1 over units.
      required: [items, next_cursor, limit]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Unit'
        next_cursor:
          type: [string, "null"]
        limit:
          type: integer
        total:
          type: integer
          description: Present only under include=total.
    Vendor:
      type: object
      description: vendor.Vendor.
      required:
        - id
        - name
        - contact_email
        - phone
        - address_line1
        - city
        - state
        - zip
        - payment_terms
        - average_lead_time_days
        - fill_rate
        - total_spend_ytd
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        contact_email:
          type:
            - string
            - 'null'
        phone:
          type:
            - string
            - 'null'
        address_line1:
          type:
            - string
            - 'null'
        city:
          type:
            - string
            - 'null'
        state:
          type:
            - string
            - 'null'
        zip:
          type:
            - string
            - 'null'
        payment_terms:
          type: string
        average_lead_time_days:
          type: number
        fill_rate:
          type: number
        total_spend_ytd:
          type: number
          description: Float dollars today.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    VendorCreate:
      type: object
      description: CreateVendorRequest. The address fields are not accepted.
      required:
        - name
      properties:
        name:
          type: string
        contact_email:
          type:
            - string
            - 'null'
        phone:
          type:
            - string
            - 'null'
        payment_terms:
          type:
            - string
            - 'null'
    VisionBlueprintScanRequest:
      type: object
      description: >-
        Go type vision.BlueprintScanRequest (github.com/gablelbm/gable/internal/vision). Unknown fields are ignored.
      required: [blueprint_text]
      properties:
        blueprint_text:
          type: string
          minLength: 1
          description: Simulated text extracted from a blueprint PDF; empty is a 400.
        config_selections:
          type: [object, "null"]
          description: >-
            The configurator choices, keyed by name. The keys the comparison reads are Species, Dimensions (for example "2x6-10") and Treatment. Absent or null skips the mismatch check.
          additionalProperties:
            type: string
    VisionBlueprintScanResponse:
      type: object
      description: Go type vision.BlueprintScanResponse (github.com/gablelbm/gable/internal/vision).
      required: [extracted_dimensions, mismatches, summary]
      properties:
        extracted_dimensions:
          type: object
          description: >-
            Zero or more of cross_section ("2x4"), length ("10'"), stud_length ("10'"), spacing ("16\" OC"), species (SYP, Douglas Fir, Cedar, SPF, Hem-Fir) and treatment ("Treatable").
          additionalProperties:
            type: string
        mismatches:
          type: array
          items:
            $ref: "#/components/schemas/VisionMismatch"
        summary:
          type: string
    VisionMismatch:
      type: object
      description: Go type vision.Mismatch (github.com/gablelbm/gable/internal/vision).
      required: [field, blueprint_value, config_value, severity, message]
      properties:
        field:
          type: string
          description: Species, Dimensions, Length or Treatment.
        blueprint_value:
          type: string
        config_value:
          type: string
        severity:
          type: string
          enum: [warning, error]
        message:
          type: string

