          type: [array, "null"]
          items:
            type: string
          description: Null when the key was created without scopes.
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: [string, "null"]
          format: date-time
        revoked_at:
          type: [string, "null"]
          format: date-time
