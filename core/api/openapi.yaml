        format:
          type: string
          enum: [CSV, XLSX, PDF]
        last_run_at:
          type: string
          description: Absent until the first run. Postgres timestamptz text.
        next_run_at:
          type: string
          description: Absent until the first run. Postgres timestamptz text.
        created_at:
          type: string
          description: Postgres timestamptz text.
        updated_at:
          type: string
          description: Postgres timestamptz text.
