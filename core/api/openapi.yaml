  /api/v1/inventory:
    get:
      operationId: inventoryList
      tags:
        - inventory
      summary: List inventory levels
      description: >-
        The keyset envelope of ADR 0001 section 1, ordered created_at DESC, id DESC (ADR 0006 7.2). Every quantity is a scale 4 decimal string in the product's stocking unit, with available (quantity - allocated) and uom beside it. The list is held to the branch wall: a context branch (X-Branch-Id) lists its own rows; with no context branch a bound non-admin user lists the branches granted to the user, none granted listing none; an administrator without a header, an unbound key, the single-branch switch and callers with no branch context at all list every branch's. A legacy row with no location_id has no branch on its joined location and stays visible to an administrator without a header and to callers with no branch context only (C4-1 migrates legacy rows onto locations). product_id and location_id are optional filters; a request without product_id is the whole levels list, where the base refused it with 400.
      parameters:
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Include'
          # include=total counts the filtered set; include=product embeds the
          # product summary in every row.
        - name: product_id
          in: query
          required: false
          description: Only the named product's rows. A value that is not a UUID is a 400 naming it.
          schema:
            type: string
            format: uuid
        - name: location_id
          in: query
          required: false
          description: Only the rows at the named location. A value that is not a UUID is a 400 naming it.
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/XBranchId'
      responses:
        '200':
          description: >-
            The page of inventory levels. items is never null; total is present only under include=total; each row's product is present only under include=product.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryLevelPage'
        '400':
          $ref: '#/components/responses/BadRequestEither'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenEither'
        '500':
          $ref: '#/components/responses/InternalErrorEither'
  /api/v1/inventory/adjust:
    post:
      operationId: inventoryAdjust
      tags:
