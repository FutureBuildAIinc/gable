  /api/v1/orders/{id}/fulfill:
    post:
      operationId: orderFulfill
      tags: [order]
      summary: Fulfill a confirmed order
      description: >-
        Bare 204 on success. Fulfilling creates an invoice, posts GL and AR and depletes stock; none of that is represented in the response.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/XBranchId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204":
          description: Fulfilled.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: The lumber index exposure gate blocks this order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExposureBlock"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/orders/{id}/cancel:
    post:
      operationId: orderCancel
      tags: [order]
      summary: Cancel an order
      description: >-
        A refusal from the state machine (already cancelled, not cancellable) is a 409. The reason is optional; an empty body is accepted.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/XBranchId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderCancelRequest"
      responses:
        "204":
          description: Cancelled.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/orders/{id}/exposure-gate:
    get:
      operationId: orderExposureGate
      tags: [order]
      summary: Check the pre ship exposure gate
      description: 200 with blocked false when clear; the raw exposure payload with 409 when blocked.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/XBranchId"
      responses:
        "200":
          description: Not blocked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderExposureClear"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Blocked by unresolved index exposure.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExposureBlock"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/orders/{id}/exposure-override:
