        id:
          type: string
          format: uuid
        delivery_id:
          type: string
          format: uuid
        order_id:
          type: string
          format: uuid
        requested_date:
          type: string
          description: The asked-for day, YYYY-MM-DD.
        reason:
          type: string
        status:
          type: string
          enum: [PENDING, APPLIED, DECLINED, SUPERSEDED]
        applied:
