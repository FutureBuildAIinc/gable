  /api/v1/payments:
    get:
      operationId: paymentList
      tags: [payment]
      summary: List payments
      description: >-
        The cursor list envelope, newest first (created_at, then id). customer_id, order_id and job_id filter on their document; status and method take comma separated lowercase lists; unapplied=true lists the posted payments that still hold unapplied cash and unapplied=false the rest. total appears only under include=total. A parameter the route does not declare, a value outside its vocabulary, a malformed cursor or an out of range limit is a 400.
      parameters:
        - name: customer_id
          in: query
          required: false
          schema: {type: string, format: uuid}
        - name: status
          in: query
          required: false
          description: Comma separated lowercase statuses (posted, voided).
          schema: {type: string}
        - name: unapplied
          in: query
          required: false
          schema: {type: string, enum: ["true", "false"]}
        - name: order_id
          in: query
          required: false
          schema: {type: string, format: uuid}
        - name: job_id
          in: query
          required: false
          schema: {type: string, format: uuid}
        - name: method
          in: query
          required: false
          description: Comma separated lowercase methods (cash, card, check, ach, other, account).
          schema: {type: string}
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Include"
        - $ref: "#/components/parameters/XBranchId"
      responses:
        "200":
          description: The page of payments.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentPage"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: paymentCreate
      tags: [payment]
      summary: Record a payment
      description: >-
        Records a posted payment for a customer (cash, check, ach or other; a card is taken through POST /payments/card, and account is not a payment). The whole amount is posted to 2200 (DR 1010 / CR 2200). Without applications the payment is unapplied cash. With applications each invoice takes its cash (and an early pay discount, on or before the invoice's discount date, up to what its terms allow) in the same transaction, each application its own entry (DR 2200 / CR 1020) and subledger row. Refused with 409 and a blocker: exceeds_unapplied, exceeds_open_amount, invoice_void, customer_mismatch, currency_mismatch, discount_not_available, period_closed. Writes payment.recorded, then payment.applied and invoice.partial or invoice.paid per invoice, then customer.updated (part balance).
      parameters:
        - $ref: "#/components/parameters/XBranchId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentCreateRequest"
      responses:
        "201":
          description: The recorded payment.
          headers:
            ETag:
              description: The document's revision.
              schema: {type: string}
            Location:
              description: The payment's route.
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "409":
          $ref: "#/components/responses/ConflictEither"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalError"
