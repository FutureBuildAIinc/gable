      properties:
        to:
          type: string
          enum: [approved, voided]
        revision:
          type: integer
          format: int64
        reason:
          type: string
          description: Required to void; at most 500 characters.
    ApCreatePaymentRequest:
      type: object
      required: [vendor_id, amount, method, payment_date]
      description: The pay body, in its today shape until the payment routes' own conversion.
      properties:
        vendor_id:
          type: string
          format: uuid
        amount:
          type: number
          description: Float dollars today.
        method:
          type: string
          enum: [CHECK, ACH, WIRE]
        check_number:
          type: string
        reference:
          type: string
        payment_date:
          type: string
          format: date
        invoice_ids:
          type: array
          description: Bills this payment is applied to, in the order the desk pays them.
          items:
            type: string
            format: uuid
    AppsManifestStatus:
