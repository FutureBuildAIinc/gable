        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "503":
          $ref: "#/components/responses/WireServiceUnavailable"
  /api/v1/payments/card:
    post:
      operationId: paymentCard
      tags: [payment]
      summary: Charge a tokenized card
      description: >-
        Charges the gateway (outside the transaction, in the customer's currency), then records and applies the payment as POST /payments does. An invoice that cannot take the payment (void, over open) is refused before the card is charged. When the system refuses the payment after the gateway approved the charge (409), the charge is voided (same day) or refunded before the refusal returns, and the message says which. When the void and the refund both fail the route answers 502 with code charge_not_reversed and a message saying the card was charged and finance must reconcile the named gateway transaction id (the id and nothing else about the card); the attempt is on record as the audit row payment.charge_reversal. A declined card or a gateway fault before anything is recorded is 402 payment_required. The token is never echoed back.
      parameters:
        - $ref: "#/components/parameters/XBranchId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CardPaymentRequest"
      responses:
        "201":
          description: The recorded card payment.
          headers:
            ETag:
              description: The document's revision.
              schema: {type: string}
            Location:
              description: The payment's route.
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/WirePaymentRequired"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "409":
          $ref: "#/components/responses/ConflictEither"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "502":
          $ref: "#/components/responses/ChargeNotReversed"
        "503":
          $ref: "#/components/responses/WireServiceUnavailable"
  /api/portal/v1/login:
    post:
      operationId: portalLogin
      tags: [portal]
      summary: Log a contractor in
      description: >-
        Public. Answers the portal_token cookie (HttpOnly, Strict, 24 hours) and the user plus branding config; the JWT itself is never in the body. Every failure, unknown email or wrong password, is the same 401. Wrapped in a strict per-IP rate limit of 10 per minute; the 11th call within the window is a 429. It takes no Idempotency-Key: the public login route sits outside both idempotency layers.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PortalLoginRequest"
      responses:
        "200":
          description: The logged in user and the portal branding config; the session token rides the Set-Cookie header.
          headers:
            Set-Cookie:
              description: portal_token=<jwt>; Path=/api/portal; Max-Age=86400; HttpOnly; SameSite=Strict.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalLoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/LegacyUnauthorized"
        "429":
          description: The per-IP strict limit (10 per minute) is exhausted; the standard error envelope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/portal/v1/logout:
    post:
      operationId: portalLogout
      tags: [portal]
      summary: Clear the portal session cookie
      description: "Public and unconditional: no token is read, the cookie is cleared, and the body is empty. It takes no Idempotency-Key: the public logout route sits outside both idempotency layers."
      security: []
      responses:
        "200":
          description: The cookie is expired; no body.
          headers:
            Set-Cookie:
              description: portal_token=; Path=/api/portal; Max-Age=0; HttpOnly; SameSite=Strict.
              schema:
                type: string
  /api/portal/v1/config:
    get:
      operationId: portalGetConfig
      tags: [portal]
      summary: The dealer branding config
      description: Public. The one row of white-label branding the login page renders before any session exists.
      security: []
      responses:
        "200":
          description: The branding config.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalConfig"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/portal/v1/dashboard:
    get:
      operationId: portalDashboard
      tags: [portal]
      summary: The contractor dashboard
      description: AR summary plus the five most recent orders.
      security:
        - PortalSession: []
      responses:
        "200":
          description: The dashboard aggregate.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalDashboard"
        "401":
          $ref: "#/components/responses/LegacyUnauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/portal/v1/orders:
    get:
      operationId: portalListOrders
      tags: [portal]
      summary: The customer's order history
      description: >-
        A bare array, newest created first, capped at 50 with no page envelope. Two additive filters: project_id (a project the caller does not own is a 404) and since (strictly newer updated_at, the change-feed cursor; a since page is ordered updated_at ascending and tie-completed so the cursor cannot lose a row). ETag and X-Portal-Latest-Change make a 30 second poll cheap: If-None-Match matching (weak comparison, list or star) answers 304 with no body.
      security:
        - PortalSession: []
      parameters:
        - name: project_id
          in: query
          description: Only orders on this project; a project the caller does not own is a 404, not an empty list.
          schema:
            type: string
            format: uuid
        - name: since
          in: query
          description: Only orders with updated_at strictly newer; RFC3339. An unparseable value is a 400.
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: The orders, a bare array, never null.
          headers:
            ETag:
              description: A strong validator over (customer, filters, count, newest updated_at).
              schema:
                type: string
            X-Portal-Latest-Change:
              description: The newest updated_at in this result; send it back as since next time. Absent when the list is empty.
              schema:
                type: string
                format: date-time
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PortalOrder"
        "304":
          description: If-None-Match matched the ETag; no body.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/LegacyUnauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/portal/v1/orders/{id}:
    get:
      operationId: portalGetOrder
      tags: [portal]
      summary: One order
      description: Scoped to the caller; another customer's order and a nonexistent one are the same 404.
      security:
        - PortalSession: []
      parameters:
        - name: id
          in: path
          required: true
