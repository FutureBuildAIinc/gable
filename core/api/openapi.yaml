      responses:
        "200":
          description: The page of category rules.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PricingCategoryRulePage"
        "400":
          $ref: "#/components/responses/WireBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalErrorEither"
    post:
      operationId: pricingCategoryRuleCreate
      tags: [pricing]
      summary: Create a category pricing rule
      description: >-
        Registered only when CATEGORY_PRICING_ENABLED=true. Guarded admin or owner. target_type account needs customer_id, tier needs tier. A fixed rule carries value_ten_thousandths (a scale 4 price), any other rule value_pct (a decimal string). The rule and its audit entry are written in one transaction. A second active rule for the same target and category is 409 duplicate.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PricingCategoryRuleCreateRequest"
      responses:
        "201":
          description: The created rule at revision 1.
          headers:
            Location:
              description: The rule's URL.
              schema:
                type: string
            ETag:
              description: The rule revision in quotes, for example "3". Send it back as If-Match.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PricingCategoryRule"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/WireConflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalErrorEither"
  /api/v1/pricing/category-rules/bulk:
    post:
      operationId: pricingCategoryRuleBulkUpsert
      tags: [pricing]
      summary: Bulk upsert category pricing rules
      description: >-
        Registered only when CATEGORY_PRICING_ENABLED=true. Guarded admin or owner. The body is a JSON array of 1 to 500 rules, each validated as on single create; an element that carries an id replaces the rule with that id at its revision. Any failure refuses the whole batch, which is written with its audit entries in one transaction.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              minItems: 1
              maxItems: 500
              items:
                $ref: "#/components/schemas/PricingCategoryRuleBulkItem"
      responses:
        "200":
          description: The number of rules written.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PricingBulkCount"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/WireConflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalErrorEither"
    delete:
      operationId: pricingCategoryRuleBulkDelete
      tags: [pricing]
      summary: Bulk delete category pricing rules
      description: >-
        Registered only when CATEGORY_PRICING_ENABLED=true. Guarded admin or owner. DELETE with a JSON body of ids; at least one is required. The deletions and their audit entries are one transaction.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PricingBulkDeleteRequest"
      responses:
        "204":
          description: Deleted; no body.
        "400":
          $ref: "#/components/responses/WireBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/InternalErrorEither"
  /api/v1/pricing/category-rules/{id}:
    put:
      operationId: pricingCategoryRuleUpdate
      tags: [pricing]
      summary: Update a category pricing rule
      description: >-
        Registered only when CATEGORY_PRICING_ENABLED=true. Guarded admin or owner. Takes the rule's revision (If-Match or the body revision; neither is 428, a stale one 409 stale_revision). The target (account or tier, customer, category) is fixed at create: a body that names one is a 400 naming it. The write and its audit entry are one transaction.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PricingCategoryRuleUpdateRequest"
