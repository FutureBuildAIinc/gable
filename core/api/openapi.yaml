      responses:
        '200':
          description: Every vendor; an empty array when none.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Vendor'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: vendorCreate
      tags:
        - vendors
      summary: Create a vendor
      parameters:
        - $ref: '#/components/parameters/XBranchId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VendorCreate'
      responses:
        '201':
          description: The created vendor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vendor'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/vendors/{id}:
    get:
      operationId: vendorGet
      tags:
        - vendors
      summary: Get one vendor
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/XBranchId'
      responses:
        '200':
          description: The vendor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vendor'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    BearerJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        The user JWT the auth middleware verifies against the configured JWKS issuer. Role guards run per module (the census column in ROUTES.txt names the registering module; cmd/server/main.go names the roles each module registers with). AUTH_MODE=dev disables verification entirely.
    IntegrationKey:
      type: apiKey
      in: header
      name: X-Integration-Key
      description: >-
        The shared integration key of the AI load management seam, compared in constant time. When no key is configured the whole seam answers 503 before the handler runs.
  parameters:
    Limit:
      name: limit
      in: query
      description: >-
        Page size. Unparseable, non positive or over maximum values are silently ignored and the default applies; the value is never refused today.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Offset:
      name: offset
      in: query
      description: >-
        Page offset. Unparseable or negative values are silently ignored and the default applies.
      schema:
        type: integer
        minimum: 0
        default: 0
    XBranchId:
      name: X-Branch-Id
      in: header
      required: false
      description: >-
        Branch scope for modules registered behind the branch middleware (quote, customer, order, invoice in this fragment set). A missing header passes for admins and in dev mode; with default_branch_required on, a non admin without it is refused. A non UUID value is a 400 and a branch the caller has no grant for is a 403.
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >-
        Opt in idempotent replay for POST, PUT and PATCH. The legacy name X-Idempotency-Key addresses the same claim. Claims are stored in Postgres and survive a restart; only 2xx and 3xx responses are stored.
      schema:
        type: string
        minLength: 1
        maxLength: 255
  responses:
    BadRequest:
      description: >-
        The request cannot be consumed. The body is the standard error envelope; the message is the generic status text, and the handler's specific message goes to the server log only.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: No or invalid credentials.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: The caller's roles do not include one the route requires.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: The addressed resource does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: The write conflicts with the resource's current state.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PaymentRequired:
      description: The card charge or its persistence failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: Unexpected server fault (also today's status for most service level validation failures).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServiceUnavailable:
      description: A dependency the route needs is not configured.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    IntegrationUnauthorized:
      description: The X-Integration-Key is missing or wrong (the integration seam's own error body, not the standard envelope).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/IntegrationError"
    IntegrationUnavailable:
      description: No integration key is configured, so the whole seam is closed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/IntegrationError"
    IntegrationBadRequest:
      description: The body or a parameter is malformed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/IntegrationError"
    IntegrationNotFound:
      description: The addressed resource does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/IntegrationError"
    IntegrationConflict:
      description: The order was created but could not be confirmed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/IntegrationError"
    IntegrationServerError:
      description: The handler failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/IntegrationError"
  schemas:
    Error:
      type: object
      required: [error, meta]
      description: >-
        The standard error envelope written by httputil.RespondError. The message is always the generic status text; the handler's specific message is server log only. request_id echoes the X-Request-ID response header.
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [BAD_REQUEST, UNAUTHORIZED, FORBIDDEN, NOT_FOUND, CONFLICT, RATE_LIMITED, UNPROCESSABLE_ENTITY, PAYMENT_REQUIRED, INTERNAL_ERROR]
            message:
              type: string
              description: Generic status text such as "Bad Request".
        meta:
          type: object
          required: [request_id]
          properties:
            request_id:
              type: string
    IntegrationError:
      type: object
      required: [error]
      description: The integration seam's own error body, a bare message string.
      properties:
        error:
          type: string
    ExposureBlock:
      type: object
      required: [error, code, exposure]
      description: >-
        The raw 409 payload the order module writes when the lumber index exposure gate blocks a confirm, fulfill or gate check. This is not the standard error envelope.
      properties:
        error:
          type: string
          enum: [unresolved index exposure on source quote]
        code:
          type: string
          enum: [UNRESOLVED_EXPOSURE]
        exposure:
          type: object
          required: [quote_id, state, exposure_dollars, indexes]
          properties:
            quote_id:
              type: string
              format: uuid
            quote_short_id:
              type: string
            state:
              type: string
              description: The exposure state vocabulary (ACK_REQUIRED, BLOCKED and neighbors).
            exposure_dollars:
              type: number
            indexes:
              type: array
              items:
                type: string
            salesperson_id:
              type: [string, "null"]
              format: uuid
            salesperson_name:
              type: [string, "null"]
            required_action:
              type: string
            last_checked_at:
              type: [string, "null"]
              format: date-time
    AccountSummary:
      type: object
      required:
        - customer_id
        - balance_due
        - credit_limit
        - available_credit
      properties:
        customer_id:
          type: string
          format: uuid
        balance_due:
          type: integer
          format: int64
          description: Cents.
        credit_limit:
          type: integer
          format: int64
          description: Cents.
        available_credit:
          type: integer
          format: int64
          description: Cents.
    CustomerTransaction:
      type: object
      required:
        - id
        - customer_id
        - type
        - amount
        - balance_after
        - reference_id
        - description
        - created_at
      properties:
        id:
          type: string
          format: uuid
        customer_id:
          type: string
          format: uuid
        type:
          type: string
          enum:
            - INVOICE
            - PAYMENT
            - ADJUSTMENT
            - REFUND
        amount:
          type: integer
          format: int64
          description: Cents.
        balance_after:
          type: integer
          format: int64
          description: Cents.
        reference_id:
          type:
            - string
            - 'null'
          format: uuid
        description:
          type: string
        created_at:
          type: string
          format: date-time
    ActivityType:
      type: string
      enum:
        - CALL
        - MEETING
        - EMAIL
        - NOTE
    Activity:
      type: object
      description: crm.Activity. contact_id and logged_by are omitted when unset. The customer routes of the customer fragment return the same schema.
      required:
        - id
        - customer_id
        - activity_type
        - description
        - activity_date
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        customer_id:
          type: string
          format: uuid
        contact_id:
          type: string
          format: uuid
        activity_type:
          $ref: '#/components/schemas/ActivityType'
        description:
          type: string
        logged_by:
          type: string
          format: uuid
        activity_date:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ActivityUpdate:
      type: object
      description: The Activity decoded from the body; a missing or unknown activity_type answers 400.
      required:
        - activity_type
      properties:
        contact_id:
          type: string
          format: uuid
        activity_type:
          $ref: '#/components/schemas/ActivityType'
        description:
          type: string
        logged_by:
          type: string
          format: uuid
        activity_date:
          type: string
          format: date-time
    Customer:
      type: object
      required: [id, primary_branch_id, name, account_number, tier, credit_limit, balance_due, is_active, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        primary_branch_id:
          type: string
          format: uuid
        name:
          type: string
        account_number:
          type: string
        email:
          type: string
        phone:
          type: string
        address:
          type: string
        tier:
          type: string
          enum: [RETAIL, SILVER, GOLD, PLATINUM]
        price_level_id:
          type: string
          format: uuid
        price_level:
          $ref: "#/components/schemas/PriceLevel"
        salesperson_id:
          type: string
          format: uuid
        salesperson_name:
          type: string
        credit_limit:
          type: number
          description: Float dollars.
        balance_due:
          type: number
          description: Float dollars. The account module carries the same fact in cents.
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CustomerPage:
      type: object
      required: [data, total, limit, offset]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Customer"
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
    CustomerSalespersonUpdate:
      type: object
      required: [salesperson_id]
      properties:
        salesperson_id:
          type: [string, "null"]
          format: uuid
          description: The salesperson to assign, or null to clear.
    PriceLevel:
      type: object
      required: [id, name, multiplier, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        multiplier:
          type: number
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PriceLevelList:
      type: [array, "null"]
      items:
        $ref: "#/components/schemas/PriceLevel"
    EscalationPolicy:
      type: object
      required: [customer_id, policy, threshold_pct]
      properties:
        customer_id:
          type: string
          format: uuid
        policy:
          type: string
          description: The policy name; an unknown name is a 400 on set.
        threshold_pct:
          type: number
        agreement_signed_at:
          type: string
          format: date-time
        agreement_ref:
          type: string
          description: Required by the set validation for the policies that need a signed agreement.
    Contact:
      type: object
      required: [id, customer_id, first_name, last_name, role, is_primary, is_active, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        customer_id:
          type: string
          format: uuid
        first_name:
          type: string
        last_name:
          type: string
        title:
          type: string
        email:
          type: string
        phone:
          type: string
        role:
          type: string
          enum: [Buyer, AP, Owner, Site Super]
        is_primary:
          type: boolean
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ContactList:
      type: [array, "null"]
      items:
        $ref: "#/components/schemas/Contact"
    CustomerActivityCreate:
      type: object
      required: [activity_type]
      description: >-
        The Activity decoded from the body; customer_id comes from the path and created_at and updated_at are set by the server. A supplied id is kept. A missing or unknown activity_type answers 400.
      properties:
        contact_id:
          type: string
          format: uuid
        activity_type:
          $ref: "#/components/schemas/ActivityType"
        description:
          type: string
        logged_by:
          type: string
          format: uuid
        activity_date:
          type: string
          format: date-time
    DeliveryVehicle:
      type: object
      description: Transcribed from delivery.Vehicle. The expiry and service dates are stored as dates and serialized as date-times.
      required:
        - id
        - name
        - vehicle_type
        - license_plate
        - capacity_weight_lbs
        - vin
        - year
        - make
        - model
        - insurance_expiry
        - next_service_date
        - odometer_miles
        - notes
        - photo_url
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        vehicle_type:
          $ref: '#/components/schemas/DeliveryVehicleType'
        license_plate:
          type: string
        capacity_weight_lbs:
          type:
            - integer
            - 'null'
        vin:
          type:
            - string
            - 'null'
        year:
          type:
            - integer
            - 'null'
        make:
          type:
            - string
            - 'null'
        model:
          type:
            - string
            - 'null'
        insurance_expiry:
          type:
            - string
            - 'null'
          format: date-time
        next_service_date:
          type:
            - string
            - 'null'
          format: date-time
        odometer_miles:
          type:
            - integer
            - 'null'
        notes:
          type:
            - string
            - 'null'
        photo_url:
          type:
            - string
            - 'null'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    DeliveryVehicleType:
      type: string
      enum:
        - BOX_TRUCK
        - FLATBED
        - PICKUP
        - VAN
        - CRANE
    DeliveryVehicleCreate:
      type: object
      description: CreateVehicleRequest. Nothing is validated; an unparseable date is silently dropped.
      properties:
        name:
