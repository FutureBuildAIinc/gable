  /api/v1/payments/{id}/refunds:
    post:
      operationId: paymentRefund
      tags: [payment]
      summary: Refund a payment's unapplied cash
      description: >-
        Pays unapplied cash back out (DR 2200 / CR 1010), limited to the unapplied amount (409 exceeds_unapplied). A card payment is refunded through the gateway before the transaction. The precondition is the payment's revision. Writes payment.refunded.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: "#/components/parameters/XBranchId"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentRefundRequest"
      responses:
        "201":
          description: The refund.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refund"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "404":
          $ref: "#/components/responses/WireNotFound"
        "409":
          $ref: "#/components/responses/ConflictEither"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "428":
          $ref: "#/components/responses/WirePreconditionRequired"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/credit-memos/{id}/refunds:
    post:
      operationId: creditMemoRefund
      tags: [payment]
      summary: Pay a credit memo's open credit out
      description: >-
        Roles admin, owner, finance. Pays the open credit of an open or partial credit memo out (DR 1020 / CR 1010) by check, ach, other or card (a card refund names the card payment it goes back to and goes through the gateway before the transaction), limited to the open credit (409 exceeds_open_credit). The credit leaves the receivable: a REFUND subledger row. The precondition is the credit memo's revision. Writes credit_memo.refunded, then credit_memo.partial or credit_memo.applied, and customer.updated.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: "#/components/parameters/XBranchId"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreditMemoRefundRequest"
      responses:
        "201":
          description: The refund.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refund"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "404":
          $ref: "#/components/responses/WireNotFound"
        "409":
          $ref: "#/components/responses/ConflictEither"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "428":
          $ref: "#/components/responses/WirePreconditionRequired"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/payments/intent:
