        "404":
          $ref: "#/components/responses/NotFound"
  /api/portal/v1/catalog/{id}/volume-breaks:
    get:
      operationId: portalVolumeBreaks
      tags: [portal]
      summary: The customer's quantity ladder for a product
      description: Every rung is derived from the same pricing waterfall that prices the line; every failure is the handler's fixed 404 today.
      security:
        - PortalSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The ladder, a bare array, never null; empty when no rung beats the single-unit price.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PortalVolumeBreak"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/portal/v1/quotes:
    get:
      operationId: portalListQuotes
      tags: [portal]
      summary: The customer's quotes
      description: A bare array, newest first, capped at 100, no page envelope. Status is the portal vocabulary (REQUESTED, PRICED, ...), erp_state the raw ERP state.
      security:
        - PortalSession: []
      responses:
        "200":
          description: The quotes, a bare array, never null.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PortalQuote"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: portalCreateQuote
      tags: [portal]
      summary: Send a scope for the dealer to price
      description: >-
        A scope, never a price: the request has no money field and every money column is written 0.00 (priced stays false until the dealer answers). A line needs either a product_id or a description plus a uom; quantity must be positive; at most 200 lines; violations are 400 with a message naming the line. A project the caller does not own is a 404. Database failures surface as 400 today, because the handler's fallback status for this route is 400.
      security:
        - PortalSession: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PortalCreateQuoteRequest"
      responses:
        "201":
          description: The created quote request, unpriced.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalQuote"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The idempotency key is already being processed by a concurrent request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /api/portal/v1/quotes/{id}:
    get:
      operationId: portalGetQuote
      tags: [portal]
      summary: One quote
      description: Scoped to the caller; another customer's quote and a nonexistent one are the same 404.
      security:
        - PortalSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The quote with its lines.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalQuote"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/portal/v1/quotes/{id}/accept:
    post:
      operationId: portalAcceptQuote
      tags: [portal]
      summary: Accept a priced quote
      description: >-
        Only a quote the dealer has priced and SENT may be accepted; a REQUESTED or already closed quote is a 409 (QUOTE_NOT_PRICED, the refusal envelope). The transition runs the ERP's own state machine. No body is read.
      security:
        - PortalSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: The accepted quote.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalQuote"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The quote is not in a decidable state; the refusal envelope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalRefusal"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/portal/v1/quotes/{id}/decline:
    post:
      operationId: portalDeclineQuote
      tags: [portal]
      summary: Decline a priced quote
      description: Same SENT-only rule and same answers as accept; the quote moves to the ERP's REJECTED. No body is read.
      security:
        - PortalSession: []
