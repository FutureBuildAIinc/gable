          $ref: "#/components/responses/Unauthorized"
        "409":
          description: The idempotency key is already being processed by a concurrent request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/purchase-orders:
    get:
      operationId: purchaseOrderList
      tags: [purchaseOrder]
      summary: List purchase orders
      description: >-
        Roles admin, owner, purchasing. Unpaged, newest first, scoped to the caller's branch. Headers only (no lines); line_count and total_cost are filled. A bare array that is JSON null when there are no orders.
      parameters:
        - $ref: "#/components/parameters/XBranchId"
      responses:
        "200":
          description: The purchase orders, or null when there are none.
          content:
            application/json:
              schema:
                type: [array, "null"]
                items:
                  $ref: "#/components/schemas/PurchaseOrder"
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/InternalError"}
    post:
      operationId: purchaseOrderCreate
      tags: [purchaseOrder]
      summary: Create a manual purchase order
      description: >-
        Roles admin, owner, purchasing. Creates a DRAFT order with source MANUAL. A vendor_id that is not a UUID is a 400. Any service failure (unknown vendor, bad line product id) is a 500.
      parameters:
        - $ref: "#/components/parameters/XBranchId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PurchaseOrderCreateRequest"
      responses:
        "201":
          description: The created purchase order with its lines.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseOrder"
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/InternalError"}
  /api/v1/purchase-orders/recommendations:
    get:
      operationId: purchaseOrderRecommendations
      tags: [purchaseOrder]
      summary: Purchasing recommendations
      description: >-
        Roles admin, owner, purchasing. Velocity based reorder suggestions. 503 when the recommendation service is not wired.
      parameters:
        - $ref: "#/components/parameters/XBranchId"
      responses:
        "200":
          description: The recommendation summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseOrderRecommendationSummary"
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/InternalError"}
        "503": {$ref: "#/components/responses/ServiceUnavailable"}
  /api/v1/purchase-orders/refresh-reorder-targets:
    post:
      operationId: purchaseOrderRefreshReorderTargets
      tags: [purchaseOrder]
      summary: Recompute product reorder targets
      description: >-
        Roles admin, owner, purchasing. The body is optional and a body that fails to decode is ignored. dry_run defaults to true when absent, so a bare call previews only. Failures (including an unwired velocity repository) are 500.
      parameters:
        - $ref: "#/components/parameters/XBranchId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PurchaseOrderRefreshRequest"
      responses:
        "200":
          description: The refresh result with up to 100 proposals.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseOrderRefreshResult"
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/InternalError"}
  /api/v1/purchase-orders/reorder-check:
    post:
      operationId: purchaseOrderReorderCheck
      tags: [purchaseOrder]
      summary: Create reorder purchase orders
      description: >-
        Roles admin, owner, purchasing. Raises DRAFT orders for products below their reorder point, grouped by vendor.
      parameters:
        - $ref: "#/components/parameters/XBranchId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: The count of orders created.
          content:
            application/json:
              schema:
                type: object
                required: [status, count]
                properties:
                  status:
                    type: string
                    enum: [success]
                  count:
                    type: integer
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/InternalError"}
