          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/deposits/{id}/apply:
    post:
      operationId: depositApply
      tags:
        - deposits
      summary: Apply a deposit against AR
      description: Every service failure, such as a deposit not OPEN or an amount over the remainder, answers 400.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/XBranchId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepositApply'
      responses:
        '201':
          description: The recorded application.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepositApplication'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/documents/print/invoice/{id}:
    get:
      operationId: documentsPrintInvoice
      tags: [documents]
      summary: Print an invoice as PDF
      description: >-
        Renders the invoice and its customer to a PDF and answers the bytes inline (Content-Type application/pdf, Content-Disposition "inline; filename=invoice.pdf"). Requires one of the roles admin, owner, sales or finance. A path id that is not a UUID is a 400; an unknown invoice or an unknown customer on the invoice is a 404 (any lookup error maps to 404); a PDF generation failure is a 500.
      security:
        - BearerJWT: []
      parameters:
        - name: id
          in: path
          required: true
          description: The invoice id.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The invoice as a PDF document.
          headers:
            Content-Disposition:
              description: Always "inline; filename=invoice.pdf".
              schema:
                type: string
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/InternalError"}
  /api/v1/documents/print/pickticket/{id}:
    get:
      operationId: documentsPrintPickticket
      tags: [documents]
      summary: Print an order pick ticket as PDF
      description: >-
        Renders the order and its customer to a pick ticket PDF and answers the bytes inline (Content-Type application/pdf, Content-Disposition "inline; filename=pickticket.pdf"). Requires one of the roles admin, owner, sales or finance. A path id that is not a UUID is a 400; an unknown order or an unknown customer on the order is a 404 (any lookup error maps to 404); a PDF generation failure is a 500.
      security:
        - BearerJWT: []
      parameters:
        - name: id
          in: path
          required: true
          description: The order id.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The pick ticket as a PDF document.
          headers:
            Content-Disposition:
              description: Always "inline; filename=pickticket.pdf".
              schema:
                type: string
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/InternalError"}
  /api/v1/governance/rfcs:
    get:
      operationId: governanceListRfcs
      tags: [governance]
      summary: List RFCs
      description: >-
        Admin or owner only. Newest first. Not paginated. Answers null, not an empty array, when there are no RFCs.
      responses:
        "200":
          description: Every RFC, or null when none exist.
          content:
            application/json:
              schema:
                type: [array, "null"]
                items:
                  $ref: "#/components/schemas/GovernanceRFC"
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/AppDisabled"}
        "500": {$ref: "#/components/responses/InternalError"}
    post:
      operationId: governanceCreateRfc
      tags: [governance]
      summary: Draft an RFC
      description: >-
        Admin or owner only. The content is expanded from a fixed Markdown template (no model is called). The new RFC is always status draft. The request keys are the Go field names matched case insensitively; the snake_case spelling of ProblemStatement, ProposedSolution and AuthorID is ignored without an error.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GovernanceCreateRFCRequest"
      responses:
        "201":
          description: The drafted RFC.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GovernanceRFC"
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/AppDisabled"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/UnprocessableEntity"}
        "500": {$ref: "#/components/responses/InternalError"}
  /api/v1/governance/rfcs/{id}:
    get:
      operationId: governanceGetRfc
      tags: [governance]
      summary: Get an RFC
      description: >-
        Admin or owner only. Any lookup failure, including a database fault, answers 404.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The RFC.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GovernanceRFC"
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404":
          description: >-
            The RFC does not exist (or the lookup failed), or the governance app is disabled (the app_disabled body). The standard envelope in the first case.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Error"
                  - $ref: "#/components/schemas/AppsDisabledError"
        "500": {$ref: "#/components/responses/InternalError"}
    put:
      operationId: governanceUpdateRfc
      tags: [governance]
      summary: Replace an RFC's editable fields
      description: >-
        Admin or owner only. A full overwrite: title, status, problem statement, proposed solution and content are all set from the body, so an omitted key blanks the stored value. Status is not validated by the handler; a value outside the database's allowed set surfaces as a 500. An unknown id is a 500, not a 404.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GovernanceUpdateRFCRequest"
      responses:
        "200":
          description: The updated RFC.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GovernanceRFC"
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/AppDisabled"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/UnprocessableEntity"}
        "500": {$ref: "#/components/responses/InternalError"}
  /healthz/live:
    get:
      operationId: healthLive
      tags: [health]
      summary: Liveness probe
      description: >-
        Always 200 if the process is running. Used by Kubernetes liveness; no dependency checks.
      security: []
      responses:
        "200":
          description: The process is alive.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: "ok"
  /healthz/ready:
    get:
      operationId: healthReady
      tags: [health]
      summary: Readiness probe
      description: >-
        Checks the database connection pool. Returns 200 when the pool is healthy; 503 Service Unavailable when Ping fails, with the same JSON body and status degraded.
      security: []
      responses:
        "200":
          description: The service is ready; db pool is connected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthReadyOK"
        "503":
          description: The service is degraded; db pool is disconnected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthReadyDegraded"
  /health:
    get:
      operationId: healthLegacy
      tags: [health]
      summary: Legacy health check
      description: >-
        Backward-compatible health endpoint. Checks the database pool Ping and returns the connectivity status. No request ID is generated.
      security: []
      responses:
        "200":
          description: The health with db status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthLegacy"
  /metrics:
    get:
      operationId: metricsPrometheus
      tags: [health]
      summary: Prometheus metrics
      description: >-
        The Prometheus scrape endpoint. By default serves the Prometheus text exposition format (text/plain; version=0.0.4; charset=utf-8). If the request carries an Accept header for application/openmetrics-text the endpoint serves the OpenMetrics format instead. Public: listed in the auth middleware PublicPaths so the scrape target can reach it without a token.
      security: []
      responses:
        "200":
          description: Prometheus text exposition format or OpenMetrics format.
          content:
            text/plain:
              schema:
                type: string
                description: Prometheus text exposition format; see https://prometheus.io/docs/instrumenting/exposition_formats/.
  /api/integration/products:
    get:
      operationId: integrationListProducts
      tags: [integration]
      summary: List catalog products with weight and geometry
