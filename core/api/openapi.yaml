  /api/portal/v1/deliveries/{id}/reschedule:
    get:
      operationId: portalGetReschedule
      tags: [portal]
      summary: The newest reschedule request for a delivery
      description: >-
        204 with no body when the caller's delivery has never been asked about; a delivery that is not the caller's is a 404.
      security:
        - PortalSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The newest recorded ask.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalDeliveryReschedule"
        "204":
          description: No request has ever been filed for this delivery; no body.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/LegacyUnauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: portalRequestReschedule
      tags: [portal]
      summary: Ask for a different delivery day
      description: >-
        202 Accepted, not 200 or 201: the ask is recorded as PENDING, the schedule is NOT changed, and the dispatcher decides (applied stays false). A repeated ask supersedes the caller's earlier pending one. requested_date must be YYYY-MM-DD, not in the past and at most 365 days out (violations are 400). A delivered stop or a route already IN_TRANSIT or COMPLETED is a 409 with the refusal envelope.
      security:
        - PortalSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PortalRescheduleRequest"
      responses:
        "202":
          description: The recorded ask, applied false.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalDeliveryReschedule"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/LegacyUnauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Conflict — either the idempotency key is already being processed, or the stop is history / the truck is rolling.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/WireError"
                  - $ref: "#/components/schemas/PortalRefusal"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
