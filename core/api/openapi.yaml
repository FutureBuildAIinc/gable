      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        entity_type:
          type: string
        definition_json:
          type: object
          additionalProperties: true
        created_by:
          type: string
          description: A user UUID, or the empty string when no author is recorded.
        created_at:
          type: string
          description: Postgres timestamptz text, for example 2026-01-02 03:04:05.678+00.
