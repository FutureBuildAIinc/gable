        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/ap/invoices/{id}/transitions:
    post:
      operationId: apInvoiceTransition
      tags: [ap]
      summary: Approve or void a vendor invoice
      description: >-
        Role guard admin, owner or finance, held to the caller's branch wall. Replaces the old /approve route. The body names the target status and carries the revision (or If-Match); a write with neither is 428, a mismatch 409 stale_revision. To approved: only from pending; the entry posts through gl.PostEntry inside the transition's transaction (a debit leg per line on the line's account, the tax spread across the line accounts pro rata, the credit to Accounts Payable), and a posting failure fails the act (a closed period is a 409 blocker period_closed; a line with no account is a 409 blocker line_needs_account). To voided: from pending (nothing posted) or approved (the entry is reversed whole); a reason is required, and a bill with money applied is refused with the has_payments blocker.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/XBranchId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApInvoiceTransitionRequest'
      responses:
        '200':
          description: The bill after the transition, with its lines.
          headers:
            ETag:
