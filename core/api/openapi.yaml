      tags: [configurator]
      summary: List the allowed values of one attribute
      description: >-
        The values the attribute may take under the current selections, deterministically ordered by value. attribute_type is required; the selections ride as one parameter, a comma separated list of Type=Value pairs (selections=Species=SYP,Treatment=None), so the route declares exactly the two names it reads (the base consumed every unknown query name as a selection and never said so). With no selections, or when no rule matches them, the static defaults for the attribute answer (an empty array for an unknown attribute). A parameter the route does not declare, a missing attribute_type or a malformed selections value is a 400.
