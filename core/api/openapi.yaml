      properties:
        vendor_id:
          type: string
          format: uuid
        vendor_name:
          type: string
        current:
          type: integer
          format: int64
          description: Cents.
        past_30:
          type: integer
          format: int64
          description: Cents.
        past_60:
          type: integer
          format: int64
          description: Cents.
        past_90:
          type: integer
          format: int64
          description: Cents.
        total:
