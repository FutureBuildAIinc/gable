  /api/v1/gl/journal-entries/{id}/reverse:
    post:
      operationId: glJournalEntryReverse
      tags: [gl]
      summary: Reverse a posted journal entry
      description: >-
        Role guard admin or owner. Books a posted, net-zero reversing entry dated today and linked by reverses_entry_id. The optional body reason is appended to the memo; an undecodable or absent body is ignored. Only a POSTED entry that has not already been reversed and has at least 2 lines can be reversed. Every refusal, including an unknown id, is a 400.
      parameters:
        - name: id
