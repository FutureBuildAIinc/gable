      description: >-
        Creates the route's stop for the order, pending. A pickup (will-call) order is never routed (ADR 0005 5.5): 409 with the blocker pickup_order. An order with unresolved lumber-index exposure is refused; a route the caller cannot see behind the branch wall is the same 404 as reading it; a missing order is a 400 naming order_id. stop_sequence defaults to the route's next position. The stop's coordinates are geocoded when a routing key is configured, before the transaction opens. A vehicle over its weight capacity answers 201 with a capacity_warning beside the stop (a soft warning). Writes the audit row and the event delivery.created.
