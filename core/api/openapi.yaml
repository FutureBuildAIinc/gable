        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/invoices:
    get:
      operationId: invoiceList
      tags:
        - invoice
      summary: List invoices
      description: The cursor list envelope, newest first (created_at, then id). status filters on the lowercase lifecycle vocabulary (a comma separated list); customer_id, job_id, ship_to_id and order_id filter on their document; overdue=true lists the open invoices past their due date and overdue=false the rest. total appears only under include=total. A parameter the route does not declare, a status outside the vocabulary (overdue is not one), a malformed cursor or an out of range limit is a 400.
      parameters:
        - name: status
          in: query
          required: false
          description: Comma separated lowercase statuses (unpaid, partial, paid, void, written_off).
          schema:
            type: string
        - name: customer_id
          in: query
          required: false
          description: Filter on the customer.
          schema:
            type: string
            format: uuid
        - name: job_id
          in: query
          required: false
          description: Filter on the job (project).
          schema:
            type: string
            format: uuid
        - name: ship_to_id
          in: query
          required: false
          description: Filter on the ship-to.
          schema:
            type: string
            format: uuid
        - name: order_id
          in: query
          required: false
          description: Filter on the order.
          schema:
            type: string
            format: uuid
        - name: overdue
          in: query
          required: false
          description: 'true: open and past due; false: everything else.'
          schema:
            type: string
            enum:
              - 'true'
              - 'false'
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Include'
        - $ref: '#/components/parameters/XBranchId'
      responses:
        '200':
          description: The page of invoices.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoicePage'
        '400':
          $ref: '#/components/responses/BadRequestEither'
        '401': &id002
          $ref: '#/components/responses/Unauthorized'
        '403': &id003
          $ref: '#/components/responses/ForbiddenEither'
        '500': &id004
          $ref: '#/components/responses/InternalError'
  /api/v1/invoices/{id}:
    get:
      operationId: invoiceGet
      tags:
        - invoice
      summary: Get one invoice with lines
      description: The invoice with every line (id, description, quantity, unit price, line total, cost), its status and open amount, and its ETag.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/XBranchId'
      responses:
        '200':
          description: The invoice.
          headers: &id001
            ETag: &id005
              description: The document's revision.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenEither'
        '404':
          $ref: '#/components/responses/WireNotFound'
  /api/v1/invoices/{id}/transitions:
    post:
      operationId: invoiceTransition
      tags:
        - invoice
      summary: Void an invoice
      description: 'The only client transition is void (roles admin, owner, finance; a reason is required). unpaid, partial, paid and written_off are derived by payments and credit memos, so asking for one is 409 invalid_state_transition. A void is refused with the blocker has_applications while the invoice has a live application (a payment, an applied credit memo, a discount or a write off), and with has_credit_memos while a credit memo that is not void names it. It runs in one transaction: it locks the invoice''s order row first, reverses the invoice''s whole journal entry (dated the void date), returns its billed stock to on hand, reduces the order lines'' fulfilled quantities, re-runs allocation for those quantities and derives the order status; the subledger is credited back. The number is kept; nothing deletes an invoice. Writes invoice.voided (and order.backordered when the order cannot re-allocate) last.'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/XBranchId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvoiceTransitionRequest'
      responses:
        '200':
          description: The voided invoice.
          headers: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
        '400':
          $ref: '#/components/responses/BadRequestEither'
        '401': *id002
        '403': *id003
        '404':
          $ref: '#/components/responses/WireNotFound'
        '409':
          $ref: '#/components/responses/ConflictEither'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '428':
          $ref: '#/components/responses/WirePreconditionRequired'
        '500': *id004
  /api/v1/invoices/{id}/email:
    post:
      operationId: invoiceEmail
      tags:
        - invoice
      summary: Email invoice to customer
      description: Queues an email to the customer with the invoice PDF attached. Returns 202 Accepted immediately; the email is dispatched asynchronously. Fails if the customer has no email address on file.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/XBranchId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Email queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceEmailResponse'
        '400':
          description: Customer has no email address on file (the standard error envelope), or the Idempotency-Key header is malformed (the ADR 0001 envelope).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Error'
                  - $ref: '#/components/schemas/WireError'
        '401':
