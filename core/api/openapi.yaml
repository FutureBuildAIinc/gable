      description: >-
        Registered only when CATEGORY_PRICING_ENABLED=true. Guarded admin or owner. The list envelope of ADR 0001 section 1, newest first (created_at DESC, id DESC). An unknown filter value or parameter is a 400 naming it; the legacy offset parameters are gone.
      parameters:
