          description: Not blocked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderExposureClear"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Blocked by unresolved index exposure.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExposureBlock"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/orders/{id}/exposure-override:
    post:
      operationId: orderExposureOverride
      tags: [order]
      summary: Override the exposure gate
      description: >-
        Records an explicit override with an audit entry. A notes justification of at least ten characters is required; shorter notes are a 400.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/XBranchId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderExposureOverrideRequest"
      responses:
        "200":
          description: Overridden.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderExposureOverridden"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/partner/v1/dashboard:
