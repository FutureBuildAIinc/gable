    get:
      operationId: reportingBiEntityExport
      tags: [reporting]
      summary: Dump every whitelisted column of an entity as JSON for BI tools
      description: >-
        Roles admin, owner only. A SELECT of every whitelisted column of the entity with the builder's 1000 row cap, as JSON (not a file). The key order of each row is not stable. An entity outside invoices, orders and inventory is a 400.
      parameters:
        - name: entity
          in: path
          required: true
          schema:
            type: string
            enum: [invoices, orders, inventory]
      responses:
        "200":
          description: The rows, or null when the entity has none.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportingRows"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
