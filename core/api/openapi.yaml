        "409": {$ref: "#/components/responses/ConflictEither"}
        "413": {$ref: "#/components/responses/PayloadTooLarge"}
        "422": {$ref: "#/components/responses/UnprocessableEntity"}
components:
  securitySchemes:
    BearerJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        The user JWT the auth middleware verifies against the configured JWKS issuer. Role guards run per module (the census column in ROUTES.txt names the registering module; cmd/server/main.go names the roles each module registers with). AUTH_MODE=dev disables verification entirely.
    IntegrationKey:
      type: apiKey
      in: header
      name: X-Integration-Key
      description: >-
        The shared integration key of the AI load management seam, compared in constant time. When no key is configured the whole seam answers 503 before the handler runs.
    PortalSession:
      type: apiKey
      in: cookie
      name: portal_token
      description: >-
        The portal JWT issued by POST /api/portal/v1/login, presented as the portal_token cookie (HttpOnly) or as an Authorization: Bearer header; the middleware accepts either, cookie first. Verified against PORTAL_JWT_SECRET (HS256). AUTH_MODE=dev bypasses the check and injects the demo customer's claims instead.
  parameters:
    PageLimit:
      name: limit
      in: query
      required: false
      description: >-
        Page size of a converted list, 1 to 200, default 50. Anything else is a 400 naming limit (ADR 0001 section 2); it is never clamped.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      required: false
      description: >-
        The opaque cursor of the previous page's next_cursor, passed back verbatim. A malformed cursor, or one minted for another ordering, is a 400 naming cursor.
      schema:
        type: string
    Include:
      name: include
      in: query
      required: false
      description: >-
        A comma separated list of expansions. total adds the count of rows matching the filters, which costs a second query and is therefore opt in.
      schema:
        type: string
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: >-
        The document revision the client read, in quotes ("3"; the weak form W/"3" is accepted too). The body's revision field is the alternative; a write carrying neither is 428, a stale one 409 stale_revision, and * or a list of tags is a 400.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      description: >-
        Page size. Unparseable, non positive or over maximum values are silently ignored and the default applies; the value is never refused today.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Offset:
      name: offset
      in: query
      description: >-
        Page offset. Unparseable or negative values are silently ignored and the default applies.
      schema:
        type: integer
        minimum: 0
        default: 0
    XBranchId:
      name: X-Branch-Id
      in: header
      required: false
      description: >-
        Branch scope for modules registered behind the branch middleware (quote, customer, order, invoice in this fragment set). A missing header passes for admins and in dev mode; with default_branch_required on, a non admin without it is refused. A non UUID value is a 400 and a branch the caller has no grant for is a 403.
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >-
        Opt in idempotent replay for POST, PUT and PATCH. The legacy name X-Idempotency-Key addresses the same claim. Claims are stored in Postgres and survive a restart; only 2xx and 3xx responses are stored.
      schema:
        type: string
        minLength: 1
        maxLength: 255
  responses:
    WireNotFound:
      description: The addressed resource does not exist, or is not visible to the caller.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WireError"
    WireConflict:
      description: >-
        The write conflicts with the resource's state: stale_revision, invalid_state_transition, duplicate, idempotency_in_progress or conflict.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WireError"
    WirePreconditionRequired:
      description: The write needs If-Match or a body revision and carries neither.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WireError"
    BadRequest:
      description: >-
        A handler (or the branch middleware) cannot consume the request. The body is the standard error envelope; the message is the generic status text, and the specific message goes to the server log only. POST, PUT and PATCH operations that take an Idempotency-Key use BadRequestEither.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: >-
        No or invalid credentials. The auth layer (pkg/middleware respondAuthError) answers every route with the ADR 0001 error envelope, code unauthorized.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WireError"
    HandlerUnauthorized:
      description: >-
        No or invalid credentials on a route whose handler also checks the claims itself. The auth layer answers with the ADR 0001 envelope; a handler reached without claims (AUTH_MODE=dev mounts no auth layer) answers with the legacy Error envelope.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/WireError"
              - $ref: "#/components/schemas/Error"
    Forbidden:
      description: >-
        The caller's roles, or a machine key's scopes, do not include one the route requires. The role guard and the machine key check answer every route with the ADR 0001 error envelope, code forbidden.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WireError"
    NotFound:
      description: The addressed resource does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: >-
        A handler reports that the write conflicts with the resource's current state (the standard error envelope). Operations that take an Idempotency-Key use ConflictEither.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnprocessableEntity:
      description: >-
        The idempotency layer refused an Idempotency-Key reused with a request whose method, path, query or body differs from the original (code idempotency_key_reused). Written by middleware, so the ADR 0001 envelope.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WireError"
    UnprocessableEntityEither:
      description: >-
        Either the handler refused the operation as semantically invalid (the standard error envelope, code UNPROCESSABLE_ENTITY), or the idempotency layer refused a reused Idempotency-Key (the ADR 0001 envelope, code idempotency_key_reused).
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/Error"
              - $ref: "#/components/schemas/WireError"
    IdempotencyConflict:
      description: >-
        The Idempotency-Key is already in progress under a concurrent request (code idempotency_in_progress). Written by the idempotency layer, so the ADR 0001 envelope. The operation raises no 409 of its own.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WireError"
    ConflictEither:
      description: >-
        Either the handler reports a conflict with the resource's current state (the standard error envelope, code CONFLICT), or the idempotency layer reports the Idempotency-Key in progress (the ADR 0001 envelope, code idempotency_in_progress).
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/Error"
              - $ref: "#/components/schemas/WireError"
    BadRequestEither:
      description: >-
        Either the handler cannot consume the request (the standard error envelope, code BAD_REQUEST, generic message), or the idempotency layer rejects the Idempotency-Key header or the body read (the ADR 0001 envelope, codes validation_failed and bad_request, one details entry per fault).
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/Error"
              - $ref: "#/components/schemas/WireError"
    IdempotencyBadRequest:
      description: >-
        The idempotency layer rejects an Idempotency-Key that is not 1 to 255 printable ASCII characters (code validation_failed) or a body it cannot read (code bad_request). Written by middleware, so the ADR 0001 envelope. The operation raises no 400 of its own.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WireError"
    PayloadTooLarge:
      description: >-
        An Idempotency-Key was sent and the body exceeds the request size limit (code payload_too_large). Written by the idempotency layer, so the ADR 0001 envelope.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WireError"
    ForbiddenEither:
      description: >-
        Either the role guard or the machine key scope check refused the caller (the ADR 0001 envelope, code forbidden), or the branch middleware found no grant for the X-Branch-Id (the standard error envelope, code FORBIDDEN).
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/WireError"
              - $ref: "#/components/schemas/Error"
    InternalErrorEither:
      description: >-
        An unexpected server fault. A converted handler answers with the ADR 0001 envelope (code internal_error, the fixed message "internal error"); the branch middleware's access lookup failing answers with the standard error envelope (code INTERNAL_ERROR).
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/WireError"
              - $ref: "#/components/schemas/Error"
    LegacyUnauthorized:
      description: >-
        No or invalid portal credentials. The portal auth middleware answers with httputil.RespondError, so the standard error envelope.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    LegacyForbidden:
      description: >-
        A portal handler refused the caller. Portal handlers answer with httputil.RespondError, so the standard error envelope.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    WireBadRequest:
      description: >-
        The request cannot be consumed or fails validation. The body is the ADR 0001 error envelope: lowercase code, the handler's own message in full, one details entry per offending field or blocker.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WireError"
    WireInternalError:
      description: >-
        An unexpected server fault in the ADR 0001 error envelope. The message is always the fixed string "internal error" and details is omitted.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WireError"
    WireUnavailable:
      description: >-
        A dependency the route needs is down, in the ADR 0001 error envelope (code unavailable); retry later.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WireError"
    PaymentRequired:
      description: The card charge or its persistence failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: Unexpected server fault (also today's status for most service level validation failures).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServiceUnavailable:
      description: A dependency the route needs is not configured.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    IntegrationUnauthorized:
      description: The X-Integration-Key is missing or wrong (the integration seam's own error body, not the standard envelope).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/IntegrationError"
    IntegrationUnavailable:
      description: No integration key is configured, so the whole seam is closed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/IntegrationError"
    AppDisabled:
      description: >-
        The route belongs to an app that is disabled on this instance. Written by the registry gate before the handler or its role guard runs, in a hand written body with no meta block. Applies to every route of a non core app (millwork and configurator under the millwork key, governance).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AppsDisabledError"
    IntegrationBadRequest:
      description: The body or a parameter is malformed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/IntegrationError"
    IntegrationBadRequestEither:
      description: >-
        The body or a parameter is malformed (the seam's own error body), or the idempotency layer rejects the Idempotency-Key header or the body read (the ADR 0001 envelope).
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/IntegrationError"
              - $ref: "#/components/schemas/WireError"
    IntegrationNotFound:
      description: The addressed resource does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/IntegrationError"
    IntegrationConflict:
      description: The order was created but could not be confirmed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/IntegrationError"
    IntegrationConflictEither:
      description: >-
        The order was created but could not be confirmed (the seam's own error body), or the idempotency layer reports the Idempotency-Key in progress (the ADR 0001 envelope).
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/IntegrationError"
              - $ref: "#/components/schemas/WireError"
    IntegrationServerError:
      description: The handler failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/IntegrationError"
    WirePaymentRequired:
      description: The card was declined or the gateway could not take the charge; nothing was recorded.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WireError"
    WireServiceUnavailable:
      description: The payment gateway is not configured or cannot be reached.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WireError"
    ChargeNotReversed:
      description: >-
        The card was charged, the system refused the payment, and neither the gateway void nor the refund went through. The message names the gateway transaction id finance must reconcile; it is the one 5xx whose message reaches the client.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WireError"
  schemas:
    Error:
      type: object
      required: [error, meta]
      description: >-
        The standard error envelope written by httputil.RespondError. The message is always the generic status text; the handler's specific message is server log only. request_id echoes the X-Request-ID response header.
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [BAD_REQUEST, UNAUTHORIZED, FORBIDDEN, NOT_FOUND, CONFLICT, RATE_LIMITED, UNPROCESSABLE_ENTITY, PAYMENT_REQUIRED, INTERNAL_ERROR]
            message:
              type: string
              description: Generic status text such as "Bad Request".
        meta:
          type: object
          required: [request_id]
          properties:
            request_id:
              type: string
    WireError:
      type: object
      required: [error, meta]
      description: >-
        The ADR 0001 section 3 error envelope, written by internal/platform/httpx.WriteError. Converted modules answer with it; routes not yet converted keep the Error envelope above. code is a stable lowercase snake_case machine code, message the handler's own message (the fixed string "internal error" on a 500), details one entry per reason (omitted when empty).
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - bad_request
                - validation_failed
                - unsupported_query_parameter
                - unauthorized
                - forbidden
                - not_found
                - method_not_allowed
                - stale_revision
                - duplicate
                - idempotency_in_progress
                - invalid_state_transition
                - conflict
                - payment_required
                - charge_not_reversed
                - precondition_failed
                - payload_too_large
                - unsupported_media_type
                - idempotency_key_reused
                - precondition_required
                - rate_limited
                - internal_error
                - unavailable
            message:
              type: string
            details:
              type: array
              items:
                $ref: "#/components/schemas/WireErrorDetail"
        meta:
          type: object
          required: [request_id]
          properties:
            request_id:
              type: string
              description: The request id, equal to the X-Request-ID response header.
    WireErrorDetail:
      type: object
      required: [message]
      description: >-
        One reason. A field entry names the field (a body JSON path, a query parameter name, or cursor); a blocker carries code and no field.
      properties:
        field:
          type: string
        message:
          type: string
        code:
          type: string
    IntegrationError:
      type: object
      required: [error]
      description: The integration seam's own error body, a bare message string.
      properties:
        error:
          type: string
    ExposureBlock:
      type: object
      required: [error, code, exposure]
      description: >-
        The raw 409 payload the order module writes when the lumber index exposure gate blocks a confirm, fulfill or gate check. This is not the standard error envelope.
      properties:
        error:
          type: string
          enum: [unresolved index exposure on source quote]
        code:
          type: string
          enum: [UNRESOLVED_EXPOSURE]
        exposure:
          type: object
          required: [quote_id, state, exposure_dollars, indexes]
          properties:
            quote_id:
              type: string
              format: uuid
            quote_short_id:
              type: string
            state:
              type: string
              description: The exposure state vocabulary (ACK_REQUIRED, BLOCKED and neighbors).
            exposure_dollars:
              type: number
            indexes:
              type: array
              items:
                type: string
            salesperson_id:
              type: [string, "null"]
              format: uuid
            salesperson_name:
              type: [string, "null"]
            required_action:
              type: string
            last_checked_at:
              type: [string, "null"]
              format: date-time
    A2aInboundPOWebhook:
      type: object
      description: >-
        Go type purchase_order.InboundPOWebhook (github.com/gablelbm/gable/internal/purchase_order), the A2A webhook envelope. No field is validated at this level except that the body is JSON; for event_type create_purchase_order the payload must decode as purchase_order.A2APurchaseOrderPayload (vendor_id, lines, requested_by, project_id, rfq_ref) and vendor_id must be a UUID. Only vendor_id and the line product_id, description, quantity and cost are used to create the order; the other fields are logged or ignored.
      properties:
        event_type:
          type: string
          description: Only create_purchase_order is processed; any other value is acknowledged and ignored.
        payload:
          type: object
          description: >-
            For create_purchase_order, purchase_order.A2APurchaseOrderPayload.
          properties:
            vendor_id:
              type: string
              format: uuid
            lines:
              type: array
              items:
                $ref: "#/components/schemas/A2aPurchaseOrderLine"
            requested_by:
              type: string
            project_id:
              type: string
            rfq_ref:
              type: string
        trace_id:
          type: string
        idempotency_key:
          type: string
          description: Carried in the envelope and ignored; the X-Idempotency-Key header is what the receiver uses.
        timestamp:
          type: string
        iss:
          type: string
    A2aPurchaseOrderLine:
      type: object
      description: >-
        Go type purchase_order.A2APurchaseOrderLine (github.com/gablelbm/gable/internal/purchase_order). quantity is a unit quantity and cost a per unit cost in float dollars.
      properties:
        product_id:
          type: string
        description:
          type: string
        quantity:
          type: number
        cost:
          type: number
    A2aCreatedResponse:
      type: object
      description: >-
        Inline map in ReceiveWebhook with the keys status (created) and po_id.
      required: [status, po_id]
      properties:
        status:
          type: string
          enum: [created]
        po_id:
          type: string
          format: uuid
    A2aIgnoredResponse:
      type: object
      description: >-
        Inline map in ReceiveWebhook with the single key status (ignored).
      required: [status]
      properties:
        status:
          type: string
          enum: [ignored]
    A2aError:
      type: object
      description: >-
        The receiver's own error body (writeError in a2a_receiver.go): code and message only, no meta object.
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [VALIDATION_ERROR, UNAUTHORIZED, DUPLICATE, INTERNAL_ERROR]
            message:
              type: string
    AccountSummary:
      type: object
      required: [customer_id, currency, balance_cents, credit_limit_cents, available_credit_cents, unapplied_cents]
      properties:
        customer_id: {type: string, format: uuid}
        currency: {type: string}
        balance_cents: {type: integer, format: int64}
        credit_limit_cents: {type: [integer, "null"], format: int64, description: "null for no limit; 0 is no credit."}
        available_credit_cents: {type: [integer, "null"], format: int64, description: "Limit less balance; null for no limit."}
        unapplied_cents: {type: integer, format: int64, description: "Open credit memos plus unapplied cash, negative or zero."}
    AccountTransactionType:
      type: string
      enum: [INVOICE, PAYMENT, ADJUSTMENT, REFUND, CREDIT_MEMO, DISCOUNT, WRITE_OFF, REVERSAL]
    AccountTransaction:
      type: object
      required: [id, customer_id, type, amount_cents, balance_after_cents, currency, source_kind, reference_id, description, created_at]
      properties:
        id: {type: string, format: uuid}
        customer_id: {type: string, format: uuid}
        type: {$ref: "#/components/schemas/AccountTransactionType"}
        amount_cents: {type: integer, format: int64, description: "Signed, debit positive."}
        balance_after_cents: {type: integer, format: int64}
        currency: {type: string}
        source_kind: {type: [string, "null"], description: "invoice, credit_memo, application, refund or pos_return; null on a row written before cycle 2."}
        reference_id: {type: [string, "null"], format: uuid}
        description: {type: string}
        created_at: {type: string, format: date-time}
    AccountTransactionPage:
      type: object
      required: [items, next_cursor, limit]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/AccountTransaction"}
        next_cursor: {type: [string, "null"]}
        limit: {type: integer}
        total: {type: integer, description: "Only under include=total."}
    ArApplicationKind:
      type: string
      enum: [payment, credit_memo, discount, write_off]
    ArApplication:
      type: object
      required: [id, customer_id, currency, kind, payment_id, credit_memo_id, invoice_id, amount_cents, reason, applied_on, applied_by, act_id, gl_entry_id, reversed_at, reversed_by, reversal_reason, reversal_gl_entry_id, reversed_on, created_at]
      description: The one record of AR being settled; a reversed application is never deleted.
      properties:
        id: {type: string, format: uuid}
        customer_id: {type: string, format: uuid}
        currency: {type: string}
        kind: {$ref: "#/components/schemas/ArApplicationKind"}
        payment_id: {type: [string, "null"], format: uuid}
        credit_memo_id: {type: [string, "null"], format: uuid}
        invoice_id: {type: string, format: uuid}
        amount_cents: {type: integer, format: int64}
        reason: {type: [string, "null"], description: "Required for a write off."}
        applied_on: {type: string, format: date}
        applied_by: {type: [string, "null"]}
        act_id: {type: string, format: uuid, description: "Groups the applications one request made."}
        gl_entry_id: {type: [string, "null"], format: uuid}
        reversed_at: {type: [string, "null"], format: date-time}
        reversed_by: {type: [string, "null"]}
        reversal_reason: {type: [string, "null"]}
        reversal_gl_entry_id: {type: [string, "null"], format: uuid}
        reversed_on: {type: [string, "null"], format: date}
        created_at: {type: string, format: date-time}
    ArApplicationReverseRequest:
      type: object
      required: [reason]
      properties:
        reason: {type: string, minLength: 1, maxLength: 500}
    ArAgingItem:
      type: object
      required: [customer_id, customer_name, job_id, job_name, ship_to_id, ship_to_code, currency, current_cents, days_1_30_cents, days_31_60_cents, days_61_90_cents, over_90_cents, unapplied_cents, total_cents]
      properties:
        customer_id: {type: string, format: uuid}
        customer_name: {type: string}
        job_id: {type: [string, "null"], format: uuid}
        job_name: {type: [string, "null"]}
        ship_to_id: {type: [string, "null"], format: uuid}
        ship_to_code: {type: [string, "null"]}
        currency: {type: string}
        current_cents: {type: integer, format: int64}
        days_1_30_cents: {type: integer, format: int64}
        days_31_60_cents: {type: integer, format: int64}
        days_61_90_cents: {type: integer, format: int64}
        over_90_cents: {type: integer, format: int64}
        unapplied_cents: {type: integer, format: int64}
        total_cents: {type: integer, format: int64}
    ArAgingPage:
      type: object
      required: [items, next_cursor, limit]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/ArAgingItem"}
        next_cursor: {type: [string, "null"]}
        limit: {type: integer}
        total: {type: integer, description: "Only under include=total."}
    ArAgingTotal:
      type: object
      required: [currency, current_cents, days_1_30_cents, days_31_60_cents, days_61_90_cents, over_90_cents, unapplied_cents, total_cents]
      properties:
        currency: {type: string}
        current_cents: {type: integer, format: int64}
        days_1_30_cents: {type: integer, format: int64}
        days_31_60_cents: {type: integer, format: int64}
        days_61_90_cents: {type: integer, format: int64}
        over_90_cents: {type: integer, format: int64}
        unapplied_cents: {type: integer, format: int64}
        total_cents: {type: integer, format: int64}
    ArAgingSummary:
      type: object
      required: [as_of, basis, totals]
      properties:
        as_of: {type: string, format: date}
        basis: {type: string, enum: [due_date, invoice_date]}
        totals:
          type: array
          items: {$ref: "#/components/schemas/ArAgingTotal"}
    ArStatementLine:
      type: object
      required: [id, date, type, description, amount_cents, balance_after_cents, source_kind, reference_id, job_id]
      properties:
        id: {type: string, format: uuid}
        date: {type: string, format: date}
        type: {$ref: "#/components/schemas/AccountTransactionType"}
        description: {type: string}
        amount_cents: {type: integer, format: int64}
        balance_after_cents: {type: integer, format: int64}
        source_kind: {type: [string, "null"]}
        reference_id: {type: [string, "null"], format: uuid}
        job_id: {type: [string, "null"], format: uuid}
    ArOpenDocument:
      type: object
      required: [kind, id, number, date, due_date, job_id, total_cents, open_cents]
      properties:
        kind: {type: string, enum: [invoice, credit_memo]}
        id: {type: string, format: uuid}
        number: {type: string}
        date: {type: string, format: date}
        due_date: {type: [string, "null"], format: date}
        job_id: {type: [string, "null"], format: uuid}
        total_cents: {type: integer, format: int64}
        open_cents: {type: integer, format: int64, description: "Negative for a credit memo."}
    ArStatementCurrency:
      type: object
      required: [currency, opening_balance_cents, lines, closing_balance_cents, open_documents]
      properties:
        currency: {type: string}
        opening_balance_cents: {type: integer, format: int64}
        lines:
          type: array
          items: {$ref: "#/components/schemas/ArStatementLine"}
        closing_balance_cents: {type: integer, format: int64}
        open_documents:
          type: array
          items: {$ref: "#/components/schemas/ArOpenDocument"}
    ArStatement:
      type: object
      required: [customer_id, customer_name, from, to, job_id, currencies]
      properties:
        customer_id: {type: string, format: uuid}
        customer_name: {type: string}
        from: {type: string, format: date}
        to: {type: string, format: date}
        job_id: {type: [string, "null"], format: uuid}
        currencies:
          type: array
          items: {$ref: "#/components/schemas/ArStatementCurrency"}
    ArDriftRow:
      type: object
      required: [customer_id, customer_name, currency, balance_cents, subledger_cents, documents_cents]
      properties:
        customer_id: {type: string, format: uuid}
        customer_name: {type: string}
        currency: {type: string}
        balance_cents: {type: integer, format: int64}
        subledger_cents: {type: integer, format: int64}
        documents_cents: {type: integer, format: int64}
    ArLedgerRow:
      type: object
      required: [currency, receivable_ledger_cents, balance_sum_cents, deposits_ledger_cents, unapplied_sum_cents, receivable_in_sync, deposits_in_sync]
      properties:
        currency: {type: string}
        receivable_ledger_cents: {type: integer, format: int64}
        balance_sum_cents: {type: integer, format: int64}
        deposits_ledger_cents: {type: integer, format: int64}
        unapplied_sum_cents: {type: integer, format: int64}
        receivable_in_sync: {type: boolean}
        deposits_in_sync: {type: boolean}
    ArReconciliation:
      type: object
      required: [customers, currencies]
      properties:
        customers:
          type: array
          items: {$ref: "#/components/schemas/ArDriftRow"}
        currencies:
          type: array
          items: {$ref: "#/components/schemas/ArLedgerRow"}
    ActivityType:
      type: string
      description: Lowercase on the wire (ADR 0001 section 6); the storage vocabulary stays uppercase.
      enum: [call, meeting, email, note]
    Activity:
      type: object
      description: >-
        One logged activity. Optional fields are present as null, never omitted. The response is the stored row: every field reads back its own value.
      required:
        - id
        - customer_id
        - contact_id
        - activity_type
        - description
        - logged_by
        - activity_date
        - revision
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        customer_id:
          type: string
          format: uuid
        contact_id:
          type: [string, "null"]
          format: uuid
        activity_type:
          $ref: "#/components/schemas/ActivityType"
        description:
          type: string
          description: 1 to 4000 characters.
        logged_by:
          type: [string, "null"]
          format: uuid
        activity_date:
          type: string
          format: date-time
        revision:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ActivityRequest:
      type: object
      description: >-
        The body of the create and the update. Every field problem is collected into one 400 with a details entry per field; an unknown field is refused.
      required: [activity_type, description]
      properties:
        contact_id:
          type: [string, "null"]
          format: uuid
        activity_type:
          $ref: "#/components/schemas/ActivityType"
        description:
          type: string
        logged_by:
          type: [string, "null"]
          format: uuid
        activity_date:
          type: string
          format: date-time
          description: Optional; defaults to now on create, keeps its stored value on update when absent.
        revision:
          type: integer
          format: int64
          description: The body revision, on update only. A create carrying one is a 400.
    ActivityPage:
      type: object
      required: [items, next_cursor, limit]
      description: The list envelope of ADR 0001 section 1. items is never null; total is present only under include=total.
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Activity"
        next_cursor:
          type: [string, "null"]
          description: Opaque; pass it back verbatim as cursor. Null on the last page.
        limit:
          type: integer
        total:
          type: integer
          format: int64
    ApiKey:
      type: object
      required: [id, name, prefix, scopes, branch_id, created_at, last_used_at, revoked_at]
      description: >-
        Go type techadmin.APIKey. The hash field is tagged out of the JSON and never leaves the package; only the 12 character prefix identifies a key.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        prefix:
          type: string
        scopes:
          type: array
          items:
            type: string
        branch_id:
          type: [string, "null"]
          format: uuid
          description: >-
            The branch a branch bound key is pinned to (ADR 0007 section 5.5), set at mint and never edited; null is today's unbound behaviour.
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: [string, "null"]
          format: date-time
        revoked_at:
          type: [string, "null"]
          format: date-time
    ApiKeyPage:
      type: object
      required: [items, next_cursor, limit]
      description: The list envelope of ADR 0001 section 1. items is never null; total is present only under include=total.
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ApiKey"
        next_cursor:
          type: [string, "null"]
        limit:
          type: integer
        total:
          type: integer
    AdminCreateKeyRequest:
      type: object
      description: Go type techadmin.CreateKeyRequest. Scopes are minted verbatim; validation of the grammar is C5-2a's.
      required: [name]
      properties:
        name:
          type: string
        scopes:
          type: array
          items:
            type: string
    AdminCreateKeyResponse:
      type: object
      required: [api_key, key]
      description: Go type techadmin.CreatedKey. The raw key appears here and nowhere else.
      properties:
        api_key:
          type: string
        key:
          $ref: "#/components/schemas/ApiKey"
    AISettings:
      type: object
      required: [configured, source, key_hint, base_url, revision]
      description: >-
        Go type techadmin.AISettings. source is admin (a stored override), env (a key from the environment only) or none. key_hint and base_url are null when absent, never omitted.
      properties:
        configured:
          type: boolean
        source:
          type: string
          enum: [admin, env, none]
        key_hint:
          type: [string, "null"]
        base_url:
          type: [string, "null"]
        revision:
          type: integer
    RoutingSettings:
      type: object
      required: [configured, source, key_hint, revision]
      description: Go type techadmin.RoutingSettings, the AI settings' shape without the base URL.
      properties:
        configured:
          type: boolean
        source:
          type: string
          enum: [admin, env, none]
        key_hint:
          type: [string, "null"]
        revision:
          type: integer
    AdminSaveAISettingsRequest:
      type: object
      description: >-
        Go type techadmin.SaveAISettingsRequest. base_url is a pointer: absent leaves the override, empty clears it, a URL sets it. revision is the body form of the If-Match precondition.
      required: [api_key]
      properties:
        api_key:
          type: string
        base_url:
          type: [string, "null"]
        revision:
          type: integer
    AdminSaveRoutingSettingsRequest:
      type: object
      required: [api_key]
      description: Go type techadmin.SaveRoutingSettingsRequest.
      properties:
        api_key:
          type: string
        revision:
          type: integer
    StaffMember:
      type: object
      required: [id, email, full_name, staff_no, role, active, revision, created_at, updated_at, modules]
      description: >-
