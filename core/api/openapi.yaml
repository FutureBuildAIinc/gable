                $ref: "#/components/schemas/MatchingResult"
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/matching/run/{po_id}:
    post:
      operationId: matchingRun
      tags: [matching]
      summary: Run the three way match for an order
      description: >-
        Roles admin, owner, finance. Compares ordered, received and invoiced quantities and prices. An unknown order, an order with no lines and every other failure are 500.
      parameters:
        - name: po_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: The match outcome.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchingResult"
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/InternalError"}
  /api/v1/orders:
    get:
