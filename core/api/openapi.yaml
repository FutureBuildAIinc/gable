  /api/v1/drafts/quotes/feed:
    get:
      operationId: quotesDraftFeed
      tags: [draft]
      summary: The quote drafts change feed
      description: >-
        A text/event-stream of the draft change rows, never payloads: event ready opens with the head cursor, event draft carries each write's summary with its by actor, event cursor advances a filtered stream past rows its filters exclude, event reset tells a resuming client its cursor aged out behind the purge, and event reauth closes the stream at the token's exp, the lifetime bound or a revoked key. The cursor resumes through Last-Event-ID (which wins when both are present) or the cursor parameter; any other parameter is a 400 before the stream opens.
      parameters:
        - name: cursor
          in: query
          required: false
          description: The cursor this feed minted (an SSE id); no cursor means from now.
          schema:
            type: string
        - name: draft_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: subject_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: Last-Event-ID
          in: header
          required: false
          description: What an SSE client sends on reconnect; it wins over the cursor parameter.
          schema:
            type: string
        - $ref: "#/components/parameters/XBranchId"
      responses:
        "200":
          description: The stream (Cache-Control no-store, X-Accel-Buffering no).
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/WireBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "429":
          description: This principal holds its draft feed stream limit, answered before the stream opens.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WireError"
        "503":
          $ref: "#/components/responses/WireUnavailable"
