          application/json:
            schema:
              $ref: "#/components/schemas/GlAccountRequest"
      responses:
        "200":
          description: The account as written, not re-read.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GlAccount"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
