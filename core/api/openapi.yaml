              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "404":
          $ref: "#/components/responses/WireNotFound"
        "409":
          $ref: "#/components/responses/ConflictEither"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "428":
          $ref: "#/components/responses/WirePreconditionRequired"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/payments/{id}/transitions:
    post:
      operationId: paymentTransition
      tags: [payment]
      summary: Void a payment
      description: >-
        The only client transition is voided (roles admin, owner, finance; a reason is required). It reverses every live application (with its discounts), then posts the void entry (DR 2200 / CR 1010) for the amount still unapplied, which is the amount less refunds; a payment with refunds can be voided and the void covers only what was not refunded. A card payment is refused with 409 card_payment (it is refunded through the gateway). Writes payment.unapplied per reversed application, invoice.reopened per invoice, customer.updated and payment.voided.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: "#/components/parameters/XBranchId"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentTransitionRequest"
      responses:
        "200":
          description: The payment after the void.
          headers:
            ETag:
              description: The document's revision.
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
        "400":
          $ref: "#/components/responses/BadRequestEither"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEither"
        "404":
          $ref: "#/components/responses/WireNotFound"
        "409":
          $ref: "#/components/responses/ConflictEither"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
