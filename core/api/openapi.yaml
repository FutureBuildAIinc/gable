          in: query
          required: false
          description: Statement date, YYYY-MM-DD. Defaults to today.
          schema:
            type: string
            format: date
        - name: currency
          in: query
          required: false
          description: >-
            ISO 4217 code, three capital letters. Reports never add two currencies (ADR 0005 4.2): defaults to the dealer's default currency; the sheet is in that one currency.
          schema:
            type: string
            pattern: "^[A-Z]{3}$"
      responses:
        "200":
