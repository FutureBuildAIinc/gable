          description: The products, a bare array, never null.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PortalCatalogProduct"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
