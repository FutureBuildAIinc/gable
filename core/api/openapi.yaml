        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/AppDisabled"}
        "500": {$ref: "#/components/responses/InternalError"}
  /api/v1/configurator/options:
    get:
      operationId: configuratorListOptions
      tags: [configurator]
      summary: List the allowed values of one attribute
      description: >-
        Admin, owner or sales. Every query parameter other than attribute_type is read as a current selection (attribute type to chosen value, first value wins), for example attribute_type=Grade&Species=SYP. With no selections, or when no rule matches them, the static defaults for the attribute are answered (an empty array for an unknown attribute). Otherwise the order of the options is unspecified.
      parameters:
        - name: attribute_type
          in: query
          required: true
          description: The attribute to list values for, for example Species, Grade, Treatment, Dimensions, ProductType.
          schema:
            type: string
      responses:
        "200":
          description: The values with their allowed flag. Never null.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConfiguratorAvailableOption"
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/AppDisabled"}
        "500": {$ref: "#/components/responses/InternalError"}
  /api/v1/configurator/presets:
    get:
      operationId: configuratorListPresets
      tags: [configurator]
      summary: List the active presets
      description: Admin, owner or sales. Active presets only, ordered by name. Never null.
      parameters:
        - name: product_type
          in: query
          required: false
          description: Exact match on the preset's product type; absent or empty lists all.
          schema:
            type: string
      responses:
        "200":
          description: The presets.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConfiguratorPreset"
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/AppDisabled"}
        "500": {$ref: "#/components/responses/InternalError"}
  /api/v1/configurator/validate:
    post:
      operationId: configuratorValidate
      tags: [configurator]
      summary: Validate a set of selections against the rules
      description: >-
        Admin, owner or sales. The body is capped at 64 KiB; an oversized or malformed body is a 400, as is an empty selections map. A rule conflict is a 200 with valid false and the conflicts listed.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfiguratorValidateRequest"
      responses:
        "200":
          description: The verdict.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfiguratorValidateResponse"
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/AppDisabled"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/UnprocessableEntity"}
        "500": {$ref: "#/components/responses/InternalError"}
  /api/v1/configurator/build-sku:
    post:
      operationId: configuratorBuildSku
      tags: [configurator]
      summary: Build a non stock SKU from selections
      description: >-
        Admin, owner or sales. The body is capped at 64 KiB. Product type and selections are both required. The selections are validated first; a conflict, and any other service failure including a database fault, answers 400 (never 500). The SKU is NS, the product type code, then the Species, Grade, Treatment and Dimensions selections upper cased with spaces as hyphens; the keys other than those four are ignored.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfiguratorBuildSKURequest"
      responses:
        "200":
          description: The generated SKU and description.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfiguratorBuildSKUResponse"
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/AppDisabled"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/UnprocessableEntity"}
