      summary: Submit a purchase order to the vendor
      description: >-
        Roles admin, owner, purchasing. Every service failure (unknown order, wrong status, vendor send failure) is a 500.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
