    ApVendorInvoiceLine:
      type: object
      required: [id, position, description, quantity, unit_price_ten_thousandths, line_total_cents, gl_account_id, purchase_order_line_id, product_id, po_freight_charge_id, created_at]
      description: >-
        A vendor invoice line (ap.InvoiceLine). The quantity is a decimal string, the unit price is _ten_thousandths, and the extension is the server's one rounding. The purchase order line and freight charge links arrive with migration 106 and are written from package C's freight rule on (ADR 0008 7.3): today's lines are not linked.
