        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: orderCreate
      tags: [order]
      summary: Create an order
      description: >-
        Money is cents on this route. A missing customer_id or an unknown product surfaces as a 500 today, not a 400.
      parameters:
        - $ref: "#/components/parameters/XBranchId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderCreateRequest"
      responses:
        "201":
          description: The created order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/orders/{id}:
    get:
      operationId: orderGet
      tags: [order]
      summary: Get one order with lines
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/XBranchId"
      responses:
        "200":
          description: The order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/orders/{id}/confirm:
    post:
      operationId: orderConfirm
      tags: [order]
      summary: Confirm a draft order
      description: >-
        Bare 204 on success; side effects (stock depletion for stocked lines) are not represented. A blocked exposure gate is the raw exposure 409 payload.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/XBranchId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204":
          description: Confirmed.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: The lumber index exposure gate blocks this order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExposureBlock"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/orders/{id}/fulfill:
    post:
      operationId: orderFulfill
      tags: [order]
      summary: Fulfill a confirmed order
      description: >-
        Bare 204 on success. Fulfilling creates an invoice, posts GL and AR and depletes stock; none of that is represented in the response.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/XBranchId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204":
          description: Fulfilled.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: The lumber index exposure gate blocks this order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExposureBlock"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/orders/{id}/cancel:
    post:
      operationId: orderCancel
      tags: [order]
      summary: Cancel an order
      description: >-
        A refusal from the state machine (already cancelled, not cancellable) is a 409. The reason is optional; an empty body is accepted.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/XBranchId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderCancelRequest"
      responses:
        "204":
          description: Cancelled.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/orders/{id}/exposure-gate:
    get:
      operationId: orderExposureGate
      tags: [order]
      summary: Check the pre ship exposure gate
      description: 200 with blocked false when clear; the raw exposure payload with 409 when blocked.
      parameters:
        - name: id
