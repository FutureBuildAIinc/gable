    PortalQuote:
      type: object
      required: [id, status, erp_state, project_id, project_name, notes, priced, total_amount, freight_amount, delivery_type, expires_at, sent_at, accepted_at, rejected_at, created_at, updated_at, lines]
      description: >-
        A customer-facing quote. Status is the portal vocabulary and erp_state the raw ERP state, so a consumer can de-dup on what the dealer actually said.
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [REQUESTED, PRICED, ACCEPTED, DECLINED, EXPIRED]
          description: The portal projection of erp_state; an unrecognised ERP state passes through verbatim.
        erp_state:
          type: string
          enum: [DRAFT, SENT, ACCEPTED, REJECTED, EXPIRED]
        project_id:
          type: [string, "null"]
          format: uuid
        project_name:
          type: [string, "null"]
        notes:
          type: string
        priced:
          type: boolean
          description: False until the dealer sends the quote back; derived from the lifecycle, never from the total.
        total_amount:
          type: number
          description: Float dollars; 0.00 while priced is false and not a quotation.
        freight_amount:
          type: number
          description: Float dollars.
        delivery_type:
          type: string
          enum: [PICKUP, DELIVERY]
        expires_at:
          type: [string, "null"]
          format: date-time
        sent_at:
          type: [string, "null"]
          format: date-time
        accepted_at:
          type: [string, "null"]
          format: date-time
        rejected_at:
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        lines:
          type: array
          description: Never null.
          items:
            $ref: "#/components/schemas/PortalQuoteLine"
    PortalQuoteLine:
      type: object
      required: [id, product_id, product_sku, description, customer_note, quantity, uom, price_uom, unit_price, line_total, is_special_order]
      properties:
        id:
          type: string
          format: uuid
        product_id:
          type: [string, "null"]
          format: uuid
          description: Null for a special-order line (a thing the dealer does not stock).
        product_sku:
          type: string
          description: SPECIAL-ORDER for a line with no product behind it.
        description:
          type: string
        customer_note:
          type: string
          description: What the contractor wrote when asking; never overwritten by the dealer's pricing pass.
        quantity:
          type: number
        uom:
          type: string
        price_uom:
          type: string
          description: The unit unit_price is quoted per; equal to uom unless the dealer priced the line per another unit.
        unit_price:
          type: number
          description: Float dollars per price_uom; 0 until the dealer prices the line.
        line_total:
          type: number
          description: Float dollars; 0 until the dealer prices the line.
        is_special_order:
          type: boolean
    PortalCreateQuoteRequest:
      type: object
      required: [lines]
      description: >-
        A scope, never a price: there is no money field. At least one line, at most 200; delivery_type defaults to PICKUP when absent.
      properties:
        project_id:
          type: [string, "null"]
          format: uuid
          description: Optional; when set it must be the caller's own project.
        notes:
          type: string
        delivery_type:
          type: string
          enum: [PICKUP, DELIVERY]
        lines:
          type: array
          items:
            $ref: "#/components/schemas/PortalQuoteRequestLine"
    PortalQuoteRequestLine:
      type: object
      required: [quantity]
      description: A catalog line (product_id set, dealer SKU and UOM snapshotted) or a special-order line (product_id null, description and uom required).
      properties:
        product_id:
          type: [string, "null"]
          format: uuid
        description:
          type: string
        quantity:
          type: number
        uom:
          type: string
          description: One of the uom_type values; uppercased and validated, unknown values are a 400.
        note:
          type: string
