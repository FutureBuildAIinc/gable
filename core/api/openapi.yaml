        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/products/{id}/margins:
    patch:
      operationId: productUpdateMarginRules
      tags: [product]
      summary: Set the target margin and commission rate
      description: A bare 200 with no body on success.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductMarginUpdate"
      responses:
        "200":
          description: Updated; no body.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/products/{id}/dimensions:
    patch:
      operationId: productUpdateDimensions
      tags: [product]
      summary: Set the PIM parametric geometry
      description: >-
        All fields are nullable: an omitted or explicitly null field clears the column to no geometry recorded, while a real zero is a recorded zero dimension. The persisted geometry is returned.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Geometry"
      responses:
        "200":
          description: The persisted geometry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Geometry"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/products/{id}/lead-time:
    patch:
      operationId: productUpdateLeadTime
      tags: [product]
      summary: Set the dealer side lead time
      description: >-
        The lead time in days published to the portal catalog. A null clears it back to unpublished; zero asserts same day availability. The request is echoed as the response.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductLeadTimeUpdate"
      responses:
        "200":
          description: The echoed request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductLeadTimeUpdate"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/quotes:
    get:
      operationId: quoteList
      tags: [quote]
      summary: List quotes
      description: >-
        Offset paged quote list. No filters are implemented; any query parameter other than limit and offset is silently ignored.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/XBranchId"
      responses:
        "200":
          description: The page of quotes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuotePage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: quoteCreate
      tags: [quote]
      summary: Create a quote
      description: >-
        Decodes the full quote shape (lines included) and the optional base64 original upload. Validation is loose: a line without a unit of measure fails at the database cast and surfaces as a 500.
      parameters:
        - $ref: "#/components/parameters/XBranchId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuoteCreateRequest"
      responses:
        "201":
          description: The created quote, echoed with server filled fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/quotes/analytics:
    get:
      operationId: quoteAnalytics
      tags: [quote]
      summary: Quote analytics aggregates
      parameters:
        - $ref: "#/components/parameters/XBranchId"
      responses:
        "200":
          description: Aggregated quote analytics.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteAnalytics"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/quotes/{id}:
    get:
      operationId: quoteGet
      tags: [quote]
      summary: Get one quote with lines
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/XBranchId"
      responses:
        "200":
          description: The quote.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: quoteUpdate
      tags: [quote]
      summary: Replace a draft quote
      description: >-
        Full replace. Only a DRAFT quote can be edited; any other state is a 400. Lines are replaced; a line whose id survives keeps its customer note.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/XBranchId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuoteCreateRequest"
      responses:
        "200":
          description: The updated quote with lines.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/quotes/{id}/state:
    put:
      operationId: quoteUpdateState
      tags: [quote]
      summary: Change the quote lifecycle state
      description: >-
        Sets the state directly; the service refuses transitions it does not allow and the handler reports that refusal as a 400. Returns the updated quote.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/XBranchId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuoteStateUpdate"
      responses:
        "200":
          description: The updated quote.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/quotes/{id}/convert:
    post:
      operationId: quoteConvertToOrderPayload
      tags: [quote]
      summary: Mark accepted and return the order creation payload
      description: >-
        Marks the quote ACCEPTED and returns the body the client is expected to POST to /api/v1/orders itself; no order is created here. The returned price_each is in float dollars, while POST /api/v1/orders expects cents: the client converts.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/XBranchId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: The order creation payload for the client to POST.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteOrderPayload"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/quotes/{id}/file:
    get:
      operationId: quoteDownloadOriginalFile
      tags: [quote]
      summary: Download the original uploaded file
      description: >-
        Streams the stored original upload of an AI sourced quote. The stored content type is echoed; the filename in Content-Disposition is sanitized. A quote with no stored file is a 404.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/XBranchId"
      responses:
        "200":
          description: The file bytes; the stored content type is echoed.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    BearerJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        The user JWT the auth middleware verifies against the configured JWKS issuer. Role guards run per module (the census column in ROUTES.txt names the registering module; cmd/server/main.go names the roles each module registers with). AUTH_MODE=dev disables verification entirely.
    IntegrationKey:
      type: apiKey
      in: header
      name: X-Integration-Key
      description: >-
        The shared integration key of the AI load management seam, compared in constant time. When no key is configured the whole seam answers 503 before the handler runs.
  parameters:
    Limit:
      name: limit
      in: query
      description: >-
        Page size. Unparseable, non positive or over maximum values are silently ignored and the default applies; the value is never refused today.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Offset:
      name: offset
      in: query
      description: >-
        Page offset. Unparseable or negative values are silently ignored and the default applies.
      schema:
        type: integer
        minimum: 0
        default: 0
    XBranchId:
      name: X-Branch-Id
      in: header
      required: false
      description: >-
        Branch scope for modules registered behind the branch middleware (quote, customer, order, invoice in this fragment set). A missing header passes for admins and in dev mode; with default_branch_required on, a non admin without it is refused. A non UUID value is a 400 and a branch the caller has no grant for is a 403.
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >-
        Opt in idempotent replay for POST, PUT and PATCH. The legacy name X-Idempotency-Key addresses the same claim. Claims are stored in Postgres and survive a restart; only 2xx and 3xx responses are stored.
      schema:
        type: string
        minLength: 1
        maxLength: 255
  responses:
    BadRequest:
      description: >-
        The request cannot be consumed. The body is the standard error envelope; the message is the generic status text, and the handler's specific message goes to the server log only.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: No or invalid credentials.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: The caller's roles do not include one the route requires.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: The addressed resource does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: The write conflicts with the resource's current state.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PaymentRequired:
      description: The card charge or its persistence failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: Unexpected server fault (also today's status for most service level validation failures).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServiceUnavailable:
      description: A dependency the route needs is not configured.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    IntegrationUnauthorized:
      description: The X-Integration-Key is missing or wrong (the integration seam's own error body, not the standard envelope).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/IntegrationError"
    IntegrationUnavailable:
      description: No integration key is configured, so the whole seam is closed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/IntegrationError"
    IntegrationBadRequest:
      description: The body or a parameter is malformed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/IntegrationError"
    IntegrationNotFound:
      description: The addressed resource does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/IntegrationError"
    IntegrationConflict:
      description: The order was created but could not be confirmed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/IntegrationError"
    IntegrationServerError:
      description: The handler failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/IntegrationError"
  schemas:
    Error:
      type: object
      required: [error, meta]
      description: >-
        The standard error envelope written by httputil.RespondError. The message is always the generic status text; the handler's specific message is server log only. request_id echoes the X-Request-ID response header.
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [BAD_REQUEST, UNAUTHORIZED, FORBIDDEN, NOT_FOUND, CONFLICT, RATE_LIMITED, UNPROCESSABLE_ENTITY, PAYMENT_REQUIRED, INTERNAL_ERROR]
            message:
              type: string
              description: Generic status text such as "Bad Request".
        meta:
          type: object
          required: [request_id]
          properties:
            request_id:
              type: string
    IntegrationError:
      type: object
      required: [error]
      description: The integration seam's own error body, a bare message string.
      properties:
        error:
          type: string
    ExposureBlock:
      type: object
      required: [error, code, exposure]
      description: >-
        The raw 409 payload the order module writes when the lumber index exposure gate blocks a confirm, fulfill or gate check. This is not the standard error envelope.
      properties:
        error:
          type: string
          enum: [unresolved index exposure on source quote]
        code:
          type: string
          enum: [UNRESOLVED_EXPOSURE]
        exposure:
          type: object
          required: [quote_id, state, exposure_dollars, indexes]
          properties:
            quote_id:
              type: string
              format: uuid
            quote_short_id:
              type: string
            state:
              type: string
              description: The exposure state vocabulary (ACK_REQUIRED, BLOCKED and neighbors).
            exposure_dollars:
              type: number
            indexes:
              type: array
              items:
                type: string
            salesperson_id:
              type: [string, "null"]
              format: uuid
            salesperson_name:
              type: [string, "null"]
            required_action:
              type: string
            last_checked_at:
              type: [string, "null"]
              format: date-time
    Customer:
      type: object
      required: [id, primary_branch_id, name, account_number, tier, credit_limit, balance_due, is_active, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        primary_branch_id:
          type: string
          format: uuid
        name:
          type: string
        account_number:
          type: string
        email:
          type: string
        phone:
          type: string
        address:
          type: string
        tier:
          type: string
          enum: [RETAIL, SILVER, GOLD, PLATINUM]
        price_level_id:
          type: string
          format: uuid
        price_level:
          $ref: "#/components/schemas/PriceLevel"
        salesperson_id:
          type: string
          format: uuid
        salesperson_name:
          type: string
        credit_limit:
          type: number
          description: Float dollars.
        balance_due:
          type: number
          description: Float dollars. The account module carries the same fact in cents.
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CustomerPage:
      type: object
      required: [data, total, limit, offset]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Customer"
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
    CustomerSalespersonUpdate:
      type: object
      required: [salesperson_id]
      properties:
        salesperson_id:
          type: [string, "null"]
          format: uuid
          description: The salesperson to assign, or null to clear.
    PriceLevel:
      type: object
      required: [id, name, multiplier, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        multiplier:
          type: number
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PriceLevelList:
      type: [array, "null"]
      items:
        $ref: "#/components/schemas/PriceLevel"
    EscalationPolicy:
      type: object
      required: [customer_id, policy, threshold_pct]
      properties:
        customer_id:
          type: string
          format: uuid
        policy:
          type: string
          description: The policy name; an unknown name is a 400 on set.
        threshold_pct:
          type: number
        agreement_signed_at:
          type: string
          format: date-time
        agreement_ref:
          type: string
          description: Required by the set validation for the policies that need a signed agreement.
    Contact:
      type: object
      required: [id, customer_id, first_name, last_name, role, is_primary, is_active, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        customer_id:
          type: string
          format: uuid
        first_name:
          type: string
        last_name:
          type: string
        title:
          type: string
        email:
          type: string
        phone:
          type: string
        role:
          type: string
          enum: [Buyer, AP, Owner, Site Super]
        is_primary:
          type: boolean
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ContactList:
      type: [array, "null"]
      items:
        $ref: "#/components/schemas/Contact"
    IntegrationProduct:
      type: object
      required: [id, sku, name, category, uom, price, weight_lbs, length_in, width_in, height_in, stackable, geometry_source]
      properties:
        id:
          type: string
          format: uuid
        sku:
          type: string
        name:
          type: string
        category:
          type: string
        uom:
          type: string
        price:
          type: integer
          format: int64
          description: Cents.
        weight_lbs:
          type: number
          description: Per unit weight; zero means unknown.
        length_in:
          type: [number, "null"]
          description: Inches; null when the PIM has no geometry.
        width_in:
          type: [number, "null"]
        height_in:
          type: [number, "null"]
        stackable:
          type: [boolean, "null"]
        geometry_source:
          type: string
    IntegrationProductList:
      type: array
      items:
        $ref: "#/components/schemas/IntegrationProduct"
    IntegrationBulkPriceRequest:
      type: object
      required: [customer_id, items]
      properties:
        customer_id:
          type: string
          format: uuid
        items:
          type: array
          items:
            type: object
            required: [product_id, quantity]
            properties:
              product_id:
                type: string
                format: uuid
              quantity:
                type: integer
    IntegrationPricedItem:
      type: object
      required: [product_id, product_name, sku, quantity, unit_price, total_price, uom]
      properties:
        product_id:
          type: string
          format: uuid
        product_name:
          type: string
        sku:
          type: string
        quantity:
          type: integer
        unit_price:
          type: integer
          format: int64
          description: Cents.
        total_price:
          type: integer
          format: int64
          description: Cents.
        uom:
          type: string
    IntegrationPricedItemList:
      type: array
      items:
        $ref: "#/components/schemas/IntegrationPricedItem"
    IntegrationQuoteRequest:
      type: object
      required: [customer_id, lines]
      properties:
        customer_id:
          type: string
          format: uuid
        lines:
          type: array
          items:
            type: object
            required: [product_id, quantity, unit_price]
            properties:
              product_id:
                type: string
                format: uuid
              quantity:
                type: integer
              unit_price:
                type: integer
                format: int64
                description: Cents.
    IntegrationQuoteResponse:
      type: object
      required: [id, customer_id, total, status]
      properties:
        id:
          type: string
          format: uuid
        customer_id:
          type: string
          format: uuid
        total:
          type: integer
          format: int64
          description: Cents.
        status:
          type: string
          enum: [DRAFT, SENT, ACCEPTED, REJECTED, EXPIRED]
    IntegrationOrderResponse:
      type: object
      required: [id, quote_id, status]
      properties:
        id:
          type: string
          format: uuid
        quote_id:
          type: string
          format: uuid
        status:
          type: string
          description: The order status after conversion and confirmation.
    IntegrationVehicle:
      type: object
      required: [id, name, vehicle_type]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        vehicle_type:
          type: string
        license_plate:
          type: string
        capacity_weight_lbs:
          type: [integer, "null"]
          description: Null when the rating was never recorded.
        make:
          type: string
        model:
          type: string
        year:
          type: integer
    IntegrationVehicleList:
      type: array
      items:
        $ref: "#/components/schemas/IntegrationVehicle"
    IntegrationDriver:
      type: object
      required: [id, name, status]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        status:
          type: string
          enum: [ACTIVE, INACTIVE, ON_LEAVE]
    IntegrationDriverList:
      type: array
      items:
        $ref: "#/components/schemas/IntegrationDriver"
    IntegrationLocation:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        address:
          type: string
          description: The composed street, city, state zip form.
        latitude:
          type: [number, "null"]
          description: Null when the branch was never geocoded.
        longitude:
          type: [number, "null"]
    IntegrationLocationList:
      type: array
      items:
        $ref: "#/components/schemas/IntegrationLocation"
    IntegrationOrderLine:
      type: object
      required: [product_id, sku, quantity, weight_lbs]
      properties:
        product_id:
          type: string
          format: uuid
        sku:
          type: string
        quantity:
          type: number
        weight_lbs:
          type: number
          description: Per unit catalog weight, not the line total.
