          type: number
        avg_margin_accepted:
          type: number
        avg_margin_rejected:
          type: number
        avg_days_to_close:
          type: number
        total_quote_value:
          type: number
        total_accepted_value:
          type: number
        ai_sourced_count:
          type: integer
        ai_conversion_rate:
          type: number
        manual_conversion_rate:
          type: number
        trend_data:
          type: array
          items:
            $ref: "#/components/schemas/QuoteAnalyticsTrend"
    QuoteAnalyticsTrend:
      type: object
      required: [date, created, accepted, rejected, total_value, accepted_value]
      properties:
        date:
          type: string
        created:
          type: integer
        accepted:
          type: integer
        rejected:
          type: integer
        total_value:
          type: number
        accepted_value:
          type: number
    TaxExemption:
      type: object
      required: [id, customer_id, exempt_reason, certificate_number, issuing_state, effective_date, is_active, created_at]
      properties:
        id: {type: string, format: uuid}
        customer_id: {type: string, format: uuid}
        exempt_reason:
          type: string
          description: For example RESALE, GOVERNMENT or CONTRACTOR (not validated).
        certificate_number: {type: string}
        issuing_state:
          type: string
          description: A state code (not validated).
        effective_date:
          type: string
          format: date-time
          description: A full timestamp today, not a date.
        expiry_date:
          type: string
          format: date-time
          description: Absent when the exemption does not expire.
        is_active: {type: boolean}
        created_at: {type: string, format: date-time}
    TaxExemptionCreateRequest:
      type: object
      required: [customer_id, exempt_reason]
      properties:
        customer_id: {type: string, format: uuid}
        exempt_reason: {type: string}
        certificate_number: {type: string}
        issuing_state: {type: string}
        expiry_date:
          type: string
          format: date
          description: YYYY-MM-DD.
    TaxAddress:
      type: object
      required: [line1, city, state, postal_code, country]
      properties:
        line1: {type: string}
        line2: {type: string}
        city: {type: string}
        state: {type: string}
        postal_code: {type: string}
        country:
          type: string
          description: ISO 3166-1 alpha-2.
    TaxLineInput:
      type: object
      properties:
        line_number: {type: integer}
        item_code: {type: string}
        description: {type: string}
        quantity: {type: number}
        amount:
          type: integer
          format: int64
          description: Pre-tax line total in cents.
        tax_code:
          type: string
          description: Avalara tax code.
    TaxPreviewRequest:
      type: object
      required: [lines]
      properties:
        customer_id: {type: string, format: uuid}
        ship_from:
          $ref: "#/components/schemas/TaxAddress"
        ship_to:
          $ref: "#/components/schemas/TaxAddress"
        lines:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/TaxLineInput"
        document_type:
          type: string
          description: SalesInvoice (default) or ReturnInvoice.
        rate_hint:
          type: number
          description: Caller resolved fallback rate for the flat rate path; zero means the configured rate.
    TaxLine:
      type: object
      required: [line_number, item_code, description, quantity, amount, tax_amount, tax_rate, jurisdiction, tax_code, exempt]
      properties:
        line_number: {type: integer}
        item_code: {type: string}
        description: {type: string}
        quantity: {type: number}
        amount:
          type: integer
          format: int64
          description: Pre-tax amount in cents.
        tax_amount:
          type: integer
          format: int64
          description: Tax in cents.
        tax_rate:
          type: number
          description: Effective rate as a fraction (0.0825 is 8.25 percent).
        jurisdiction: {type: string}
        tax_code: {type: string}
        exempt: {type: boolean}
    TaxResult:
      type: object
      required: [total_amount, total_tax, grand_total, lines, is_estimate]
      properties:
        document_code:
          type: string
          description: The Avalara document code; absent for estimates.
        total_amount:
          type: integer
          format: int64
          description: Pre-tax total in cents.
        total_tax:
          type: integer
          format: int64
          description: Tax in cents.
        grand_total:
          type: integer
          format: int64
        lines:
          type: array
          items:
            $ref: "#/components/schemas/TaxLine"
        is_estimate:
          type: boolean
          description: True when the flat rate fallback was used.

