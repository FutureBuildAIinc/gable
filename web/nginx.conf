#
# One origin, four bundles (all built by web/Dockerfile):
#
#   exactly /            the front door (its index.html)
#   /door/*              the front door's hashed assets
#   /shell/*             the work shell (its index.html and assets)
#   /field/*             the field shell (its index.html and assets)
#   /assets/*            the desk's hashed assets
#   everything else      the desk, through an SPA fallback: /home, /quotes/{id},
#                        /orders/{id}, /invoices/{id}, /inventory/{id},
#                        /accounts/{id}, /portal/*, /driver/*, /yard/*, /pos
#                        and every other desk route open directly by URL.
#
# Files on disk (in the image, and where a developer mounts them):
#   /etc/nginx/gable-headers.conf   web/nginx-headers.conf (the deny default)
#   /etc/nginx/gable-headers-frameable.conf   web/nginx-headers-frameable.conf (desk only)
#   /usr/share/nginx/html/front-door   the front door's dist
#   /usr/share/nginx/html/desk         the desk's dist
#   /usr/share/nginx/html/work-shell   the work shell's dist
#   /usr/share/nginx/html/field-shell  the field shell's dist
#
# The API is not proxied here: on App Platform the ingress routes /api to the
# backend on the same hostname. A stack that serves the bundles itself (the
# local stack, the Playwright job) mounts a snippet at /etc/nginx/gable-api.conf
# holding its `location /api/ { proxy_pass ...; }`; with none mounted the
# include below matches no file and is skipped, and /api answers 404.

server {
    listen 8080;
    server_tokens off;
    server_name _;
    client_max_body_size 10m;

    gzip on;
    gzip_types text/plain application/json application/javascript text/css application/xml text/javascript image/svg+xml;
    gzip_min_length 256;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;

    include /etc/nginx/gable-api.conf*;

    # With no API upstream mounted, /api answers 404 rather than falling
    # through to the desk's index.html with a 200. A mounted snippet's longer
    # `location /api/` wins over this one.
    location /api {
        default_type application/json;
        return 404 '{"error":"no API upstream is configured on this server"}';
    }

    # The front door: only at exactly /.
    location = / {
        root /usr/share/nginx/html/front-door;
        try_files /index.html =404;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/gable-headers.conf;
    }

    location /door/ {
        root /usr/share/nginx/html/front-door;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        include /etc/nginx/gable-headers.conf;
    }

    location /assets/ {
        root /usr/share/nginx/html/desk;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        include /etc/nginx/gable-headers.conf;
    }

    location = /shell {
        return 308 /shell/;
    }

    # The work shell under /shell/: a real file when there is one, otherwise
    # its index.html (the shell has no deep routes of its own yet, but the
    # fallback keeps reloads safe when it grows them).
    location /shell/ {
        alias /usr/share/nginx/html/work-shell/;
        try_files $uri $uri/ /shell/index.html;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/gable-headers.conf;
    }

    location = /field {
        return 308 /field/;
    }

    # The field shell under /field/: a real file when there is one, otherwise
    # its index.html, with the never-framed headers.
    location /field/ {
        alias /usr/share/nginx/html/field-shell/;
        try_files $uri $uri/ /field/index.html;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/gable-headers.conf;
    }

    # The contractor portal keeps the deny default even though it is served
    # from the desk bundle: the contractor sign in and the checkout must never
    # sit inside a frame. The =404 tail keeps the SPA answer INSIDE this block:
    # a bare /index.html last argument is an internal redirect, which would
    # re-match the desk's frameable catch all.
    location = /portal {
        root /usr/share/nginx/html/desk;
        try_files /index.html =404;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/gable-headers.conf;
    }

    location ^~ /portal/ {
        root /usr/share/nginx/html/desk;
        try_files $uri /index.html =404;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/gable-headers.conf;
    }

    # The desk: a real file when there is one, otherwise its index.html. This
    # is the ONE frameable location (the work shell frames desk pages on this
    # origin); everything else takes the deny default.
    location / {
        root /usr/share/nginx/html/desk;
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/gable-headers-frameable.conf;
    }
}
