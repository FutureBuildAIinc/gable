#
# Nginx serves two frontend bundles on the same origin:
#
#   /          → front-door bundle (the micro-app selector)
#   /app/*     → desk bundle (the full ERP workspace)
#
# Both bundles are built by Vite; their hashed asset chunks land under:
#   /door/         (front-door, vite assetsDir: 'door')
#   /app/assets/   (desk, vite base: '/app/')
#
# The front door has no client-side routing, so it is served without an SPA
# fallback: /foo 404s instead of returning index.html.  The desk uses the
# SPA fallback so record URLs opened directly work.  Keeping the two fallbacks
# on separate location blocks ( / and /app/ ) means they never collide.
#
# Backend probes and API calls go to the Go core on the same host, port 8080.

server {
    listen 8080;
    server_tokens off;
    server_name _;
    client_max_body_size 10m;

    # ── Security headers (repeated at location level so they fire on every response) ──
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;

    # ── Front door: micro-app selector at / ─────────────────────────────
    #
    # No SPA fallback here.  The door is a single page; any path not a known
    # static file returns 404 rather than swallowing the desk's /app/ mount.
    location = / {
        root /usr/share/nginx/html/front-door;
        try_files $uri =404;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.tile.openstreetmap.org; connect-src 'self' http://localhost:8080; worker-src 'self' blob:; frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
    }

    # Front-door hashed assets: /door/*.  No fallback.
    location /door/ {
        root /usr/share/nginx/html/front-door;
        expires 30d;
        add_header Cache-Control "public, immutable" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.tile.openstreetmap.org; connect-src 'self' http://localhost:8080; worker-src 'self' blob:; frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
    }

    # ── Desk: ERP workspace at /app/* ───────────────────────────────────
    #
    # SPA fallback: a direct /app/quotes/123 URL (opened from a deep link or
    # a tile click) returns desk's index.html and the Lit router handles it.
    location /app/ {
        root /usr/share/nginx/html/desk;
        try_files $uri $uri/ /app/index.html;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.tile.openstreetmap.org; connect-src 'self' http://localhost:8080; worker-src 'self' blob:; frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
    }

    # Desk hashed assets: /app/assets/*.  No fallback (assets exist on disk).
    location /app/assets/ {
        root /usr/share/nginx/html/desk;
        expires 30d;
        add_header Cache-Control "public, immutable" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.tile.openstreetmap.org; connect-src 'self' http://localhost:8080; worker-src 'self' blob:; frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
    }

    # ── Backend proxy ──────────────────────────────────────────────────
    #
    # The Go core listens on the same host, port 8080.  preserve_path_prefix
    # keeps /api/v1 and /healthz as-is so the Go router matches them.
    location /api/ {
        proxy_pass http://localhost:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /healthz/ {
        proxy_pass http://localhost:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://localhost:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /metrics {
        proxy_pass http://localhost:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
