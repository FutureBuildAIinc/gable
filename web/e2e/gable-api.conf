#
# Mounted at /etc/nginx/gable-api.conf by scripts/e2e-stack.sh: proxies the API
# to the `core serve` process on the Docker host.
location /api/ {
    proxy_pass http://host.docker.internal:__CORE_PORT__;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# The readiness and liveness probes sit at the root, as a real deployment
# routes them; the desk's Tech Admin page reads /healthz/ready.
location /healthz/ {
    proxy_pass http://host.docker.internal:__CORE_PORT__;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
}
