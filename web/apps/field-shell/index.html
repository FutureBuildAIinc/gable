<!doctype html>
<html lang="en">

<head>
  <!-- Applies the stored mode before the first paint (a same origin file: the CSP refuses inline scripts) -->
  <script src="./theme-boot.js"></script>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='8' fill='%230A0B10'/%3E%3Cpath d='M10 38 L32 16 L54 38' stroke='%23FFFFFF' stroke-width='6' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3Cpath d='M32 22 V30' stroke='%2300FFA3' stroke-width='4' stroke-linecap='round'/%3E%3Cpath d='M24 30 C24 30 24 44 32 44 C40 44 40 30 40 30' stroke='%2300FFA3' stroke-width='4' stroke-linecap='round' fill='none'/%3E%3Crect x='29' y='44' width='6' height='5' rx='1' fill='%2300FFA3'/%3E%3C/svg%3E" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#00FFA3" />
  <meta name="description" content="Gable, the operating system for lumber and building materials dealers" />


  <title>Gable Field</title>
</head>

<body>
  <style>
    body {
      background-color: rgb(var(--gb-deep-space, 10 11 16));
      margin: 0;
      font-family: 'Outfit', sans-serif;
    }

    .initial-loader {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      color: rgb(var(--gb-white, 255 255 255));
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgb(var(--gb-white, 255 255 255) / 0.05);
      border-top-color: rgb(var(--gb-gable-green, 0 255 163));
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }
  </style>
  <div id="root">
    <div class="initial-loader">
      <div class="spinner"></div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
