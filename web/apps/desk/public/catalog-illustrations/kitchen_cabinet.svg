<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>Kitchen base cabinet in flat white</title>
  <defs>
    <style>
      .cabFront{fill:#faf3e0}
      .cabSide{fill:#d8c8a0}
      .cabTop{fill:#ffffff}
      .cabShade{fill:#c8b488}
      .doorMain{fill:#faf3e0}
      .doorShade{fill:#a89878}
      .handleBar{fill:#7a7a72}
      .drawerMain{fill:#faf3e0}
      .drawerShade{fill:#a89878}
      .line{fill:none;stroke:#a89878}
    </style>
  </defs>
  <ellipse cx="128" cy="232" rx="98" ry="6" fill="#1a1410" opacity="0.18"/>
  <g>
    <polygon class="cabSide" points="218,80 198,86 198,222 218,216"/>
    <polygon class="cabTop" points="38,80 218,80 198,86 18,86"/>
    <rect class="cabFront" x="38" y="80" width="180" height="142"/>
    <rect class="cabShade" x="38" y="216" width="180" height="6" opacity="0.5"/>
    <rect class="cabShade" x="208" y="80" width="10" height="142" opacity="0.5"/>
  </g>
  <g>
    <rect class="doorMain" x="50" y="92" width="78" height="124"/>
    <rect class="doorMain" x="50" y="92" width="78" height="124" fill="none" stroke="#a89878" stroke-width="0.6"/>
    <line class="line" x1="50" y1="160" x2="128" y2="160" stroke-width="0.6"/>
    <rect class="handleBar" x="116" y="150" width="6" height="14" rx="1"/>
    <rect class="handleBar" x="116" y="170" width="6" height="14" rx="1"/>
  </g>
  <g>
    <rect class="drawerMain" x="138" y="92" width="74" height="34"/>
    <rect class="drawerMain" x="138" y="92" width="74" height="34" fill="none" stroke="#a89878" stroke-width="0.6"/>
    <rect class="handleBar" x="166" y="106" width="18" height="6" rx="1"/>
    <rect class="drawerMain" x="138" y="132" width="74" height="34"/>
    <rect class="drawerMain" x="138" y="132" width="74" height="34" fill="none" stroke="#a89878" stroke-width="0.6"/>
    <rect class="handleBar" x="166" y="146" width="18" height="6" rx="1"/>
    <rect class="drawerMain" x="138" y="172" width="74" height="44"/>
    <rect class="drawerMain" x="138" y="172" width="74" height="44" fill="none" stroke="#a89878" stroke-width="0.6"/>
    <rect class="handleBar" x="166" y="190" width="18" height="6" rx="1"/>
  </g>
</svg>