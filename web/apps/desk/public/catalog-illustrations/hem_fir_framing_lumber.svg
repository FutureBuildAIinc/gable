    <rect class="endgrain" x="226" y="140" width="14" height="22"/>
    <ellipse class="ring" cx="233" cy="151" rx="3.5" ry="3" stroke-width="0.6"/>
    <ellipse class="ring" cx="233" cy="151" rx="1.8" ry="1.4" stroke-width="0.5"/>
  </g>
  <g>
    <rect class="face" x="30" y="118" width="196" height="22"/>
    <rect class="topedge" x="30" y="118" width="196" height="2"/>
