<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>Five gallon pail of joint compound with lid</title>
  <defs>
    <style>
      .pailMain{fill:#f4ecd8}
      .pailShade{fill:#c8b488}
      .pailHi{fill:#faf3e0}
      .lidMain{fill:#e8dcc0}
      .lidShade{fill:#a89878}
      .lidHi{fill:#faf3e0}
      .handleMain{fill:#3a3d44}
      .handleShade{fill:#1a1a1a}
      .label{fill:#faf3e0}
      .labelBand{fill:#3a8acc}
      .labelDark{fill:#0e3a66}
      .textBrand{font-family:Verdana,Arial,sans-serif;font-weight:700;letter-spacing:1.2px}
      .textSub{font-family:Verdana,Arial,sans-serif;font-weight:600;letter-spacing:2px}
    </style>
  </defs>
  <ellipse cx="128" cy="232" rx="80" ry="6" fill="#1a1410" opacity="0.18"/>
  <g>
    <ellipse class="lidHi" cx="128" cy="62" rx="68" ry="14"/>
    <ellipse class="lidMain" cx="128" cy="62" rx="68" ry="10"/>
    <ellipse class="lidShade" cx="128" cy="62" rx="62" ry="6" opacity="0.6"/>
    <ellipse cx="128" cy="62" rx="60" ry="6" fill="none" stroke="#a89878" stroke-width="0.5"/>
  </g>
  <g>
    <path class="pailMain" d="M 60 64 L 196 64 L 188 222 L 68 222 Z"/>
    <path class="pailShade" d="M 188 64 L 196 64 L 188 222 Z" opacity="0.7"/>
    <path class="pailHi" d="M 60 64 L 70 64 L 78 222 L 68 222 Z" opacity="0.5"/>
    <path class="pailShade" d="M 60 200 L 196 200 L 196 222 L 60 222 Z" opacity="0.4"/>
  </g>
  <g>
    <ellipse class="handleMain" cx="60" cy="64" rx="6" ry="2"/>
    <ellipse class="handleMain" cx="196" cy="64" rx="6" ry="2"/>
    <path class="handleMain" d="M 60 64 C 60 36 196 36 196 64" fill="none" stroke="#3a3d44" stroke-width="3" stroke-linecap="round"/>
  </g>
  <g>
    <rect class="label" x="60" y="120" width="136" height="80"/>
    <rect class="labelBand" x="60" y="120" width="136" height="20"/>
    <rect class="labelBand" x="60" y="186" width="136" height="14"/>
    
    <rect x="72" y="146" width="112" height="1" fill="#3a8acc" opacity="0.6"/>
    <text class="textSub" x="136" y="164" font-size="10" fill="#0e3a66" text-anchor="middle">JOINT COMPOUND</text>
    <text class="textSub" x="136" y="178" font-size="6.5" fill="#0e3a66" text-anchor="middle" opacity="0.7">ALL PURPOSE  18.9 L</text>
  </g>
