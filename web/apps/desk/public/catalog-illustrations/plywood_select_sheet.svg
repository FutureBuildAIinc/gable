      <line class="grain" x1="48" y1="80" x2="220" y2="80" stroke-width="0.5" opacity="0.55"/>
      <line class="grain" x1="44" y1="94" x2="216" y2="94" stroke-width="0.4" opacity="0.5"/>
      <line class="grain" x1="48" y1="108" x2="220" y2="108" stroke-width="0.5" opacity="0.55"/>
      <line class="grain" x1="44" y1="124" x2="216" y2="124" stroke-width="0.4" opacity="0.5"/>
      <line class="grain" x1="48" y1="140" x2="220" y2="140" stroke-width="0.5" opacity="0.55"/>
      <line class="grain" x1="44" y1="158" x2="216" y2="158" stroke-width="0.4" opacity="0.5"/>
      <line class="grain" x1="48" y1="178" x2="220" y2="178" stroke-width="0.5" opacity="0.55"/>
