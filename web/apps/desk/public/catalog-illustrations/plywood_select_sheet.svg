<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>Plywood select panel at an angle, smooth light face and layered ply edge</title>
  <defs>
    <style>
      .frontFace{fill:#eccfa0}
      .frontFaceHi{fill:#f6e0bc}
      .frontFaceShade{fill:#c4a378}
      .plyEdge{fill:#a87a4a}
      .plyEdgeShade{fill:#7a5230}
      .plyEdgeHi{fill:#c89868}
      .grain{stroke:#a87a4a;fill:none;stroke-linecap:round}
      .stamp{fill:#3a2410}
    </style>
  </defs>
  <ellipse cx="128" cy="226" rx="108" ry="6" fill="#1a1410" opacity="0.2"/>
  <g transform="rotate(-12 128 128)">
