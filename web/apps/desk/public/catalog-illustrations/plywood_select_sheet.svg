      <line x1="222" y1="132" x2="228" y2="132"/>
      <line x1="222" y1="144" x2="228" y2="144"/>
      <line x1="222" y1="156" x2="228" y2="156"/>
      <line x1="222" y1="168" x2="228" y2="168"/>
      <line x1="222" y1="180" x2="228" y2="180"/>
