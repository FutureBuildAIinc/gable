    <ellipse class="ring" cx="226" cy="85" rx="3" ry="5" stroke-width="0.4"/>
  </g>
  <g opacity="0.55">
    <line class="grain" x1="50" y1="82" x2="220" y2="82" stroke-width="0.5"/>
    <line class="grain" x1="54" y1="90" x2="220" y2="90" stroke-width="0.4"/>
