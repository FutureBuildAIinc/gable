    <ellipse class="ring" cx="226" cy="157" rx="3" ry="5" stroke-width="0.4"/>
  </g>
  <g opacity="0.55">
    <line class="grain" x1="50" y1="154" x2="220" y2="154" stroke-width="0.5"/>
    <line class="grain" x1="54" y1="162" x2="220" y2="162" stroke-width="0.4"/>
  </g>
  <g>
    <polygon class="sideEdge" points="32,98 46,108 38,108 38,134 32,134"/>
    <polygon class="topEdge" points="32,98 220,98 230,108 46,108"/>
    <rect class="faceA" x="46" y="108" width="174" height="26"/>
    <rect class="topEdge" x="46" y="108" width="174" height="2"/>
    <rect class="sideEdge" x="216" y="108" width="4" height="26" opacity="0.5"/>
    <ellipse class="endGrain" cx="226" cy="121" rx="10" ry="13"/>
    <ellipse class="ring" cx="226" cy="121" rx="6" ry="9" stroke-width="0.5"/>
    <ellipse class="ring" cx="226" cy="121" rx="3" ry="5" stroke-width="0.4"/>
  </g>
  <g opacity="0.55">
    <line class="grain" x1="50" y1="118" x2="220" y2="118" stroke-width="0.5"/>
    <line class="grain" x1="54" y1="126" x2="220" y2="126" stroke-width="0.4"/>
  </g>
  <g>
    <polygon class="sideEdge" points="32,62 46,72 38,72 38,98 32,98"/>
    <polygon class="topEdge" points="32,62 220,62 230,72 46,72"/>
