<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>Portable garden hose reel cart</title>
  <defs>
    <style>
      .frameMain{fill:#3a8a4a}
      .frameShade{fill:#1a5a2a}
      .frameHi{fill:#5aaa6a}
      .reelMain{fill:#5a5d66}
