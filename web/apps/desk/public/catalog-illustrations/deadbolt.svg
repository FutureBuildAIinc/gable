<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>Single cylinder deadbolt in brushed nickel</title>
  <defs>
    <style>
      .faceMain{fill:#bdbdbd}
      .faceHi{fill:#e0e0e0}
      .faceShade{fill:#7a7a7a}
      .cylinderMain{fill:#9a9a9a}
      .cylinderHi{fill:#cdcdcd}
      .cylinderShade{fill:#5a5a5a}
      .keyhole{fill:#1a1a1a}
      .plateMain{fill:#bdbdbd}
      .plateShade{fill:#7a7a7a}
      .screw{fill:#3a3d44}
    </style>
  </defs>
  <ellipse cx="128" cy="222" rx="86" ry="6" fill="#1a1410" opacity="0.18"/>
  <g>
    <rect class="faceMain" x="48" y="48" width="160" height="160" rx="20"/>
    <rect class="faceHi" x="48" y="48" width="160" height="6" rx="3" opacity="0.6"/>
    <rect class="faceShade" x="48" y="200" width="160" height="8" rx="4" opacity="0.5"/>
    <rect class="faceShade" x="200" y="48" width="8" height="160" opacity="0.5"/>
    <g opacity="0.5">
      <line x1="56" y1="60" x2="200" y2="60" stroke="#7a7a7a" stroke-width="0.4"/>
      <line x1="56" y1="80" x2="200" y2="80" stroke="#7a7a7a" stroke-width="0.4"/>
      <line x1="56" y1="100" x2="200" y2="100" stroke="#7a7a7a" stroke-width="0.4"/>
      <line x1="56" y1="120" x2="200" y2="120" stroke="#7a7a7a" stroke-width="0.4"/>
      <line x1="56" y1="140" x2="200" y2="140" stroke="#7a7a7a" stroke-width="0.4"/>
      <line x1="56" y1="160" x2="200" y2="160" stroke="#7a7a7a" stroke-width="0.4"/>
      <line x1="56" y1="180" x2="200" y2="180" stroke="#7a7a7a" stroke-width="0.4"/>
      <line x1="80" y1="54" x2="80" y2="200" stroke="#7a7a7a" stroke-width="0.4"/>
      <line x1="120" y1="54" x2="120" y2="200" stroke="#7a7a7a" stroke-width="0.4"/>
      <line x1="160" y1="54" x2="160" y2="200" stroke="#7a7a7a" stroke-width="0.4"/>
    </g>
  </g>
  <g>
    <circle class="cylinderMain" cx="128" cy="128" r="48"/>
    <circle class="cylinderHi" cx="128" cy="128" r="48" fill="none" stroke="#cdcdcd" stroke-width="2" opacity="0.7"/>
    <circle class="cylinderShade" cx="128" cy="128" r="42" fill="none" stroke="#5a5a5a" stroke-width="1" opacity="0.6"/>
    <circle class="keyhole" cx="128" cy="128" r="6"/>
    <rect class="keyhole" x="125" y="128" width="6" height="14"/>
    <rect class="keyhole" x="122" y="138" width="12" height="6"/>
    <circle cx="128" cy="116" r="3" fill="#5a5a5a"/>
  </g>
  <g>
    <circle class="screw" cx="68" cy="68" r="4"/>
    <line x1="65" y1="68" x2="71" y2="68" stroke="#1a1a1a" stroke-width="0.8"/>
    <line x1="68" y1="65" x2="68" y2="71" stroke="#1a1a1a" stroke-width="0.8"/>
    <circle class="screw" cx="188" cy="68" r="4"/>
    <line x1="185" y1="68" x2="191" y2="68" stroke="#1a1a1a" stroke-width="0.8"/>
    <line x1="188" y1="65" x2="188" y2="71" stroke="#1a1a1a" stroke-width="0.8"/>
    <circle class="screw" cx="68" cy="188" r="4"/>
    <line x1="65" y1="188" x2="71" y2="188" stroke="#1a1a1a" stroke-width="0.8"/>
    <line x1="68" y1="185" x2="68" y2="191" stroke="#1a1a1a" stroke-width="0.8"/>
    <circle class="screw" cx="188" cy="188" r="4"/>
    <line x1="185" y1="188" x2="191" y2="188" stroke="#1a1a1a" stroke-width="0.8"/>
    <line x1="188" y1="185" x2="188" y2="191" stroke="#1a1a1a" stroke-width="0.8"/>
  </g>
  <g>
    <rect class="plateMain" x="174" y="118" width="48" height="20" rx="2"/>
    <rect class="plateShade" x="174" y="132" width="48" height="6" rx="2"/>
  </g>
