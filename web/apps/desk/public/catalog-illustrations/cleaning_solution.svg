<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>Gallon jug of bleach</title>
  <defs>
    <style>
      .jugMain{fill:#f4ecd8}
      .jugShade{fill:#d8c8a0}
      .jugHi{fill:#ffffff}
      .cap{fill:#1d6cb0}
      .capShade{fill:#0e3a66}
      .handle{fill:#f4ecd8}
      .label{fill:#3a8acc}
      .labelBand{fill:#faf3e0}
      .labelDark{fill:#0e3a66}
      .textBrand{font-family:Verdana,Arial,sans-serif;font-weight:700;letter-spacing:1.2px}
      .textSub{font-family:Verdana,Arial,sans-serif;font-weight:600;letter-spacing:2px}
      .warn{fill:#c84a3d}
    </style>
  </defs>
  <ellipse cx="128" cy="232" rx="78" ry="6" fill="#1a1410" opacity="0.18"/>
  <g>
    <rect class="handle" x="86" y="60" width="20" height="40" rx="3"/>
    <rect class="jugShade" x="86" y="60" width="4" height="40" opacity="0.5"/>
    <rect class="jugShade" x="102" y="60" width="4" height="40" opacity="0.5"/>
    <ellipse class="jugMain" cx="96" cy="60" rx="14" ry="4"/>
    <rect class="cap" x="62" y="46" width="34" height="14" rx="2"/>
    <rect class="capShade" x="62" y="56" width="34" height="4" rx="1"/>
    <ellipse class="jugMain" cx="128" cy="62" rx="56" ry="10"/>
    <rect class="jugMain" x="72" y="62" width="112" height="160"/>
    <rect class="jugShade" x="170" y="62" width="14" height="160" opacity="0.5"/>
    <rect class="jugShade" x="72" y="208" width="112" height="14" opacity="0.5"/>
    <rect class="jugHi" x="76" y="68" width="6" height="148" opacity="0.7"/>
  </g>
  <g>
    <rect class="labelBand" x="72" y="100" width="112" height="98"/>
    <rect class="labelBand" x="72" y="100" width="112" height="98" fill="none" stroke="#3a8acc" stroke-width="0.6"/>
    <rect class="label" x="72" y="100" width="112" height="22"/>
    <rect class="label" x="72" y="174" width="112" height="24"/>
    
    <text class="textSub" x="128" y="148" font-size="11" fill="#0e3a66" text-anchor="middle">BLEACH</text>
    <rect class="warn" x="120" y="156" width="16" height="6"/>
    <text x="128" y="160" font-family="Verdana,Arial,sans-serif" font-weight="700" font-size="5" text-anchor="middle" fill="#faf3e0">!</text>
    <text class="textSub" x="128" y="190" font-size="7" fill="#faf3e0" text-anchor="middle">1 GAL  3.78L</text>
  </g>
