<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>Five gallon bucket</title>
  <defs>
    <style>
      .bucketMain{fill:#1d6cb0}
      .bucketShade{fill:#0e3a66}
      .bucketHi{fill:#3a8acc}
      .bucketRim{fill:#fafaf6}
      .bucketRimShade{fill:#bcbcae}
      .handle{fill:none;stroke:#3a3d44;stroke-width:3;stroke-linecap:round}
      .handleGrip{fill:#3a3d44}
      .label{fill:#faf3e0}
      .labelBand{fill:#faf3e0}
      .textBrand{font-family:Verdana,Arial,sans-serif;font-weight:700;letter-spacing:1.2px}
    </style>
  </defs>
  <ellipse cx="128" cy="232" rx="78" ry="6" fill="#1a1410" opacity="0.18"/>
  <g>
    <ellipse class="bucketRim" cx="128" cy="68" rx="68" ry="8"/>
    <ellipse class="bucketRimShade" cx="128" cy="68" rx="62" ry="6" opacity="0.6"/>
    <path class="bucketMain" d="M 60 68 L 196 68 L 188 224 L 68 224 Z"/>
    <path class="bucketShade" d="M 188 68 L 196 68 L 188 224 Z" opacity="0.7"/>
    <path class="bucketHi" d="M 60 68 L 70 68 L 78 224 L 68 224 Z" opacity="0.5"/>
  </g>
  <path class="handle" d="M 70 64 C 70 26 186 26 186 64"/>
  <ellipse class="handleGrip" cx="128" cy="32" rx="14" ry="4"/>
  <rect class="handleGrip" x="115" y="30" width="26" height="6" rx="2"/>
  <g>
    <rect class="label" x="62" y="124" width="132" height="68"/>
    <rect x="58" y="124" width="140" height="2" fill="#1a1a1a" opacity="0.6"/>
    <rect x="58" y="192" width="140" height="2" fill="#1a1a1a" opacity="0.6"/>
    <text class="textBrand" x="128" y="148" font-size="14" fill="#1d6cb0" text-anchor="middle">ProFrame</text>
    <rect x="74" y="156" width="108" height="1" fill="#3a3d44" opacity="0.6"/>
    <text x="128" y="174" font-family="Verdana,Arial,sans-serif" font-weight="700" font-size="11" fill="#1d6cb0" text-anchor="middle">5 GAL</text>
  </g>
