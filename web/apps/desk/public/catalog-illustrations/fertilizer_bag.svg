  <g>
    <rect class="label" x="62" y="86" width="132" height="124"/>
    <rect class="label" x="62" y="86" width="132" height="124" fill="none" stroke="#1a4a2a" stroke-width="0.6"/>
    <rect class="labelDark" x="62" y="86" width="132" height="22"/>
    <text class="textBrand" x="128" y="102" font-size="13" fill="#faf3e0" text-anchor="middle">GardenPro</text>
