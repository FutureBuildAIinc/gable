    <text class="textSub" x="128" y="124" font-size="10" fill="#1a4a2a" text-anchor="middle">FERTILIZER</text>
    <text class="textNums" x="128" y="146" font-size="14" fill="#c84a3d" text-anchor="middle">10-10-10</text>
    <text class="textSub" x="128" y="162" font-size="7" fill="#1a4a2a" text-anchor="middle" opacity="0.7">ALL PURPOSE</text>
    <text x="128" y="180" font-family="Verdana,Arial,sans-serif" font-weight="600" font-size="6" fill="#1a4a2a" text-anchor="middle" opacity="0.7">LAWN BY PRODUCT</text>
    <rect x="74" y="190" width="32" height="14" fill="#c84a3d"/>
    <text x="90" y="200" font-family="Verdana,Arial,sans-serif" font-weight="700" font-size="8" fill="#faf3e0" text-anchor="middle">25 LB</text>
