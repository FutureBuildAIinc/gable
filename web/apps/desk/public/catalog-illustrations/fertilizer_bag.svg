      .bagRim{fill:#1a4a2a}
      .label{fill:#faf3e0}
      .labelBand{fill:#faf3e0}
      .labelDark{fill:#1a4a2a}
      .textBrand{font-family:Verdana,Arial,sans-serif;font-weight:700;letter-spacing:1.5px}
      .textSub{font-family:Verdana,Arial,sans-serif;font-weight:600;letter-spacing:2px}
      .textNums{font-family:Verdana,Arial,sans-serif;font-weight:700;letter-spacing:1px}
    </style>
  </defs>
  <ellipse cx="128" cy="232" rx="92" ry="6" fill="#1a1410" opacity="0.18"/>
  <g>
    <polygon class="bagMain" points="58,42 198,42 214,72 198,220 58,220 42,72"/>
    <polygon class="bagHi" points="58,42 198,42 196,48 60,48"/>
    <polygon class="bagShade" points="198,42 214,72 210,222 198,220" opacity="0.7"/>
    <polygon class="bagShade" points="58,42 42,72 46,222 58,220" opacity="0.7"/>
    <polygon class="bagRim" points="58,42 198,42 214,72 42,72" opacity="0.5"/>
    <polygon class="bagShade" points="86,42 170,42 178,72 78,72" opacity="0.4"/>
