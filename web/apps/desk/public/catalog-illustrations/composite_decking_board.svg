<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>composite decking board with wood-grain texture</title>
  <defs>
    <style>
      .face{fill:#7a5a3c}
      .faceHi{fill:#a8845c}
      .faceShade{fill:#5a3a1c}
      .grainA{fill:#6a4a2a}
      .grainB{fill:#8a6a4a}
      .grainC{fill:#a8845c}
      .grainD{fill:#5a3a1c}
      .topEdge{fill:#a8845c}
      .sideEdge{fill:#5a3a1c}
      .endGrain{fill:#3a2a1c}
    </style>
    <pattern id="compgrain" x="0" y="0" width="60" height="14" patternUnits="userSpaceOnUse">
      <rect width="60" height="14" fill="#7a5a3c"/>
      <ellipse class="grainA" cx="10" cy="4" rx="14" ry="1.2"/>
      <ellipse class="grainB" cx="30" cy="8" rx="20" ry="1.4"/>
      <ellipse class="grainC" cx="46" cy="3" rx="12" ry="1"/>
      <ellipse class="grainD" cx="22" cy="11" rx="16" ry="1.2"/>
      <ellipse class="grainA" cx="50" cy="10" rx="14" ry="1.2"/>
    </pattern>
  </defs>
  <ellipse cx="128" cy="212" rx="106" ry="6" fill="#1a1410" opacity="0.18"/>
  <g>
    <polygon class="sideEdge" points="28,116 44,108 44,162 28,170"/>
    <polygon class="topEdge" points="28,116 220,116 232,108 44,108"/>
    <rect x="28" y="116" width="192" height="56" fill="url(#compgrain)"/>
    <rect class="sideEdge" x="216" y="116" width="4" height="56" opacity="0.5"/>
    <ellipse class="endGrain" cx="230" cy="144" rx="12" ry="26"/>
    <ellipse class="topEdge" x="28" y="116" width="192" height="2"/>
  </g>
  <g>
    <rect x="32" y="180" width="188" height="8" fill="url(#compgrain)" opacity="0.85"/>
  </g>
</svg>