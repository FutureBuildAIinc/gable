# The frameable twin of gable-headers.conf, identical but for the framing
# pair: SAMEORIGIN and frame-ancestors 'self' let THIS origin frame the
# response, no other. nginx.conf includes it only in the desk's catch all
# location (the work shell frames desk pages); every other location takes the
# deny default. The desk's framing-headers guard test holds the split.
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: https://*.tile.openstreetmap.org; connect-src 'self'; worker-src 'self' blob:; frame-ancestors 'self'; object-src 'none'; base-uri 'self'" always;
