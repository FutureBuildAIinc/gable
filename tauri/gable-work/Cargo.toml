[package]
name = "gable-work"
version.workspace = true
description = "Gable Work: the Tauri 2 profile for the office and counter roles (the work shell)."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "gable_work_lib"
path = "src/lib.rs"

[[bin]]
name = "gable-work"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
gable-shell-core = { path = "../core" }
tauri = { version = "=2.12.1", features = [] }
# tauri::generate_context! expands to code that names serde_json; serde
# derives the commands' answer shapes.
serde = { version = "1", features = ["derive"] }
serde_json = "=1.0.151"
