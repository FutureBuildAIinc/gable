[package]
name = "gable-shell-core"
version.workspace = true
description = "Shared Rust core for the Gable shells: the OS keychain custody of the core tokens, the token command's origin fence, and the profile manifest."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Secret values (the access and refresh tokens, the AEAD key, and the Ed25519
# signing seed) are wiped when their holding value drops, so a freed string
# leaves no plaintext behind in reclaimed memory.
zeroize = "1"
# Origin parsing for the token and offline counter commands' fence; the same
# url crate the shell graph already carries through Tauri.
url = "2"
# Serialization for the offline counter's snapshot copy, canonical JSON
# signing payload, and keychain custody records.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# AEAD sealing (AES-256-GCM), SHA-256 hash chaining, and Ed25519 signing for
# the offline counter queue (ADR 0011 section 5.1).
ring = "0.17"
# Bundled SQLite store for the offline counter queue and the core's own
# snapshot copy.
rusqlite = { version = "0.31", features = ["bundled"] }
hex = "0.4"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }

# The OS keychain through the keyring crate, one backend per desktop target:
# the freedesktop Secret Service's pure Rust path on desktop Linux (zbus, no
# libsecret and no libdbus headers), the macOS Keychain, and the Windows
# Credential Manager. No target carries another's backend, and the build
# never needs a C keychain header.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["async-secret-service", "tokio", "crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["windows-native"] }
