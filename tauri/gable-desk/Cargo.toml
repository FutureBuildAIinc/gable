[package]
name = "gable-desk"
version.workspace = true
description = "Gable desktop shell: a Tauri 2 window around the front door"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "gable_desk_lib"
path = "src/lib.rs"

[[bin]]
name = "gable-desk"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
gable-shell-core = { path = "../core" }
tauri = { version = "=2.12.1", features = [] }
# The commands' answer shape.
serde = { version = "1", features = ["derive"] }
# tauri::generate_context! expands to code that names serde_json.
serde_json = "=1.0.151"
tauri-plugin-deep-link = "=2.6.1"
tauri-plugin-single-instance = { version = "=2.5.2", features = ["deep-link"] }

[features]
# `cargo tauri build` turns this on: the window then serves the embedded
# front door bundle instead of the dev server URL.
custom-protocol = ["tauri/custom-protocol"]
